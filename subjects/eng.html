<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇬🇧 สมรรถนะภาษาอังกฤษ (CEFR) — ข้อสอบ V-NET 100 ข้อ</title>
<style>
:root{
  --bg:#0f1220; --bg2:#171b30; --card:#1e2340; --card2:#252b4d;
  --text:#eef0ff; --muted:#9aa3c7; --line:#323a63;
  --brand:#7c6cff; --brand2:#4ecdc4; --good:#3ddc84; --bad:#ff5d73; --warn:#ffc94d;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Noto Sans Thai","Segoe UI",sans-serif;
  background:radial-gradient(1200px 800px at 80% -10%,#2a2f55 0%,var(--bg) 55%);
  color:var(--text); min-height:100vh; line-height:1.6;
}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}

/* ===== Home ===== */
.hero{text-align:center;padding:28px 0 20px}
.hero h1{font-size:2rem;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);margin-top:6px}
.statbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;text-align:center;min-width:110px}
.stat b{font-size:1.3rem;display:block}
.stat span{color:var(--muted);font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.subj{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:left;transition:.18s;position:relative;overflow:hidden}
.subj:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 24px rgba(124,108,255,.25)}
.subj .ic{font-size:1.9rem}
.subj h3{font-size:1.02rem;margin:8px 0 2px}
.subj .sub{color:var(--muted);font-size:.8rem}
.subj .meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:.82rem;color:var(--muted)}
.badge{background:var(--bg2);border:1px solid var(--line);padding:2px 10px;border-radius:999px}
.best{color:var(--warn)}
.subj.mix{background:linear-gradient(135deg,#3b2f7a,#1c5f5a);border-color:#6a5cff}

/* ===== Setup modal ===== */
.overlay{position:fixed;inset:0;background:rgba(8,10,20,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:20px;max-width:440px;width:100%;padding:24px}
.modal h2{font-size:1.2rem;margin-bottom:2px}
.modal .sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.optlabel{font-size:.85rem;color:var(--muted);margin:14px 0 6px}
.optrow{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:.9rem}
.opt.sel{background:var(--brand);border-color:var(--brand);font-weight:700}
.toggle{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.9rem;color:var(--muted);cursor:pointer;user-select:none}
.toggle .box{width:20px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.toggle.on .box{background:var(--good);border-color:var(--good);color:#08331c}
.mrow{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:12px;border-radius:12px;font-size:1rem;font-weight:700}
.btn.primary{background:linear-gradient(90deg,var(--brand),#9b8cff);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line)}

/* ===== Quiz ===== */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qtop .left{display:flex;gap:8px;align-items:center}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.85rem}
.pill.flame{border-color:#ff8c42;color:#ffb347}
.pill.timer{min-width:84px;text-align:center}
.progress{height:8px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.qsec{color:var(--brand2);font-size:.78rem;margin-bottom:6px}
.qtext{font-size:1.08rem;font-weight:600;white-space:pre-wrap}
.choices{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-size:.97rem;transition:.15s;width:100%}
.choice:not(:disabled):hover{border-color:var(--brand)}
.choice .lb{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.choice.correct{border-color:var(--good);background:rgba(61,220,132,.12)}
.choice.correct .lb{background:var(--good);color:#06301a;border-color:var(--good)}
.choice.wrong{border-color:var(--bad);background:rgba(255,93,115,.12)}
.choice.wrong .lb{background:var(--bad);color:#fff;border-color:var(--bad)}
.choice.picked{border-color:var(--brand);background:rgba(124,108,255,.14)}
.choice.dim{opacity:.28;pointer-events:none}
.expl{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid;animation:pop .25s}
.expl.good{background:rgba(61,220,132,.1);border-color:var(--good)}
.expl.bad{background:rgba(255,93,115,.1);border-color:var(--bad)}
.expl h4{font-size:.95rem;margin-bottom:4px}
.expl p{font-size:.92rem;color:var(--text)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.qactions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.lifeline{background:var(--card);border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:10px 16px;font-weight:700}
.lifeline:disabled{opacity:.35;border-color:var(--line);color:var(--muted)}
.shake{animation:shake .35s}
.audio-box{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
.audio-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.playbtn{background:linear-gradient(90deg,#2e7d6b,var(--brand2));color:#04241f;font-weight:800;border-radius:99px;padding:10px 22px;font-size:1rem;display:inline-flex;align-items:center;gap:8px}
.playbtn.playing{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(78,205,196,.5)}50%{box-shadow:0 0 0 10px rgba(78,205,196,0)}}
.scriptbtn{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:.85rem;color:var(--muted)}
.script{margin-top:12px;border-left:3px solid var(--brand2);padding:6px 12px;font-style:italic;color:var(--muted);font-size:.95rem}
.audio-hint{color:var(--muted);font-size:.78rem;margin-top:8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.combo-pop{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);font-size:2.2rem;font-weight:800;pointer-events:none;z-index:99;animation:rise 1s forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}

/* palette (exam mode) */
.palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.pal{width:34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-size:.8rem}
.pal.done{background:var(--brand);border-color:var(--brand);font-weight:700}
.pal.cur{outline:2px solid var(--brand2)}

/* ===== Results ===== */
.result{text-align:center;padding-top:10px}
.ring{width:190px;height:190px;margin:14px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:2.4rem}
.ring .num span{color:var(--muted);font-size:.85rem}
.verdict{font-size:1.3rem;font-weight:800;margin:4px 0 14px}
.rstats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.review{margin-top:26px;text-align:left}
.review h3{margin-bottom:12px}
.rq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.rq .st{font-weight:700}
.rq .st.ok{color:var(--good)} .rq .st.no{color:var(--bad)}
.rq p{font-size:.9rem;margin-top:4px}
.rq .ex{color:var(--muted);font-size:.86rem;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.topbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.85rem}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.footer-note{text-align:center;color:var(--muted);font-size:.75rem;margin-top:40px}
@media(max-width:520px){ .hero h1{font-size:1.5rem} .qtext{font-size:1rem} }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ HOME ============ -->
  <div id="home">
    <div class="hero">
      <h1>🇬🇧 สมรรถนะภาษาอังกฤษ (CEFR)</h1>
      <p>English Competency • 100 ข้อ พร้อมเฉลยและคำอธิบายทุกข้อ</p>
    </div>
    <div class="statbar">
      <div class="stat"><b id="st-total">540</b><span>ข้อสอบทั้งหมด</span></div>
      <div class="stat"><b id="st-answered">0</b><span>ทำไปแล้ว (ครั้ง)</span></div>
      <div class="stat"><b id="st-acc">—</b><span>ความแม่นยำรวม</span></div>
      <div class="stat"><b id="st-streak">0</b><span>สถิติตอบถูกติดกัน</span></div>
    </div>
    <div class="grid" id="subjects"></div>
    <p class="footer-note">แตะวิชาเพื่อเริ่ม • ผลคะแนนบันทึกไว้ในเครื่องอัตโนมัติ</p>
  </div>

  <!-- ============ QUIZ ============ -->
  <div id="quiz" class="hidden">
    <div class="qtop">
      <div class="left">
        <button class="topbtn" onclick="confirmExit()">← ออก</button>
        <span class="pill" id="q-count">1/30</span>
        <span class="pill" id="q-score">✅ 0</span>
      </div>
      <div class="left">
        <span class="pill flame" id="q-streak">🔥 0</span>
        <span class="pill timer" id="q-timer">00:00</span>
        <button class="topbtn" id="mutebtn" onclick="toggleMute()">🔊</button>
      </div>
    </div>
    <div class="progress"><i id="q-progress" style="width:0%"></i></div>
    <div class="qcard" id="qcard">
      <div class="qsec" id="q-section"></div>
      <div class="qtext" id="q-text"></div>
      <div id="q-audio"></div>
      <div class="choices" id="q-choices"></div>
      <div id="q-expl"></div>
      <div class="qactions">
        <button class="lifeline" id="fifty" onclick="useFifty()">✂️ 50:50 <span id="fifty-n">×3</span></button>
        <button class="btn primary hidden" id="nextbtn" onclick="nextQ()">ข้อถัดไป →</button>
        <button class="btn ghost hidden" id="skipbtn" onclick="nextQ()">ข้าม →</button>
        <button class="btn primary hidden" id="submitbtn" onclick="finishQuiz()">ส่งคำตอบ ✅</button>
      </div>
    </div>
    <div class="palette hidden" id="palette"></div>
  </div>

  <!-- ============ RESULT ============ -->
  <div id="result" class="hidden"></div>
</div>

<div id="modal-root"></div>
<canvas class="confetti" id="confetti"></canvas>

<script>const EXAM_DATA = {"subjects": [{"id": "eng-speak", "icon": "🗣️", "title": "Speaking", "subtitle": "Question-Response • Part 7.1 [B1]", "labels": ["A", "B", "C", "D", "E"], "questions": [{"n": 1, "q": "What is your opinion on the new remote work policy?", "choices": ["I am working remotely.", "It's on the desk.", "I think it will improve employee productivity.", "The policy is a book.", "Yes, I do."], "answer": 2, "explanation": "คำถามขอความคิดเห็น (What is your opinion...?) ต้องตอบด้วยการแสดงความเห็น เช่น I think it will improve productivity ส่วนตัวเลือกอื่นตอบไม่ตรงประเด็น", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 2, "q": "I'm afraid I won't be able to attend the meeting tomorrow at 10 AM.", "choices": ["That's a pity. Shall we reschedule for Thursday?", "I am attending the meeting.", "The meeting is in Room 5.", "I'm afraid the projector isn't working.", "Thank you for the presentation."], "answer": 0, "explanation": "เมื่อคู่สนทนาแจ้งว่าไม่สามารถเข้าประชุมได้ การตอบสนองที่เหมาะสมคือแสดงความเสียดายและเสนอเลื่อนนัด (Shall we reschedule?)", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 3, "q": "Could you please clarify what you mean by 'budget constraints'?", "choices": ["The budget is 1,000 dollars.", "It means we have strictly limited funds for this project.", "I bought it on sale.", "The weather is clear today.", "No, I cannot see it."], "answer": 1, "explanation": "ผู้ถามขอให้อธิบายความหมายของคำว่า budget constraints จึงต้องตอบด้วยคำอธิบายว่าหมายถึงเงินทุนของโครงการมีจำกัด", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 4, "q": "Would you mind sending me the report by the end of the day?", "choices": ["Yes, I mind it.", "Not at all. I'll email it to you by 4 PM.", "The report is very long.", "I don't like reading.", "My mind is full."], "answer": 1, "explanation": "คำขอแบบสุภาพ Would you mind...? การตอบตกลงคือ Not at all (ไม่รังเกียจเลย) พร้อมยืนยันว่าจะส่งให้ภายใน 4 โมงเย็น", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 5, "q": "How long have you been working in the marketing department?", "choices": ["I work there every day.", "For about three years now.", "It is a very big department.", "At 9 o'clock in the morning.", "I am going to work."], "answer": 1, "explanation": "How long have you been...? ถามระยะเวลา ต้องตอบด้วย For + ช่วงเวลา (For about three years)", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 6, "q": "Do you think we should hire more staff for the upcoming season?", "choices": ["Yes, we definitely need more hands to handle the workload.", "The staff room is on the second floor.", "I don't know how to hire a car.", "The season is winter.", "No, they are already fired."], "answer": 0, "explanation": "คำถามขอความเห็นเรื่องการจ้างพนักงานเพิ่ม คำตอบที่ตอบคำถามพร้อมเหตุผลคือ Yes, we need more hands to handle the workload", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 7, "q": "Excuse me, could you point me in the direction of the HR office?", "choices": ["The point is very sharp.", "I am the HR manager.", "Certainly. Go straight and take the second left.", "HR stands for Human Resources.", "You should direct the movie."], "answer": 2, "explanation": "ผู้ถามถามทางไปห้อง HR จึงต้องตอบด้วยการบอกเส้นทาง (Go straight and take the second left)", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 8, "q": "I'm having some trouble with the new software. It keeps crashing.", "choices": ["The software is very expensive.", "Have you tried restarting your computer or contacting IT support?", "A car crashed yesterday.", "I don't have any trouble.", "It is a soft material."], "answer": 1, "explanation": "ผู้พูดแจ้งปัญหาโปรแกรมล่ม การตอบที่เหมาะสมคือเสนอแนวทางแก้ไข เช่น ลองรีสตาร์ตหรือติดต่อฝ่าย IT", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 9, "q": "Why was the shipment delayed this week?", "choices": ["The ship is very large.", "Due to a strike at the port, nothing is moving.", "It is late at night.", "I shipped it yesterday.", "It usually ships on Fridays."], "answer": 1, "explanation": "คำถาม Why ถามหาสาเหตุของการส่งของล่าช้า ต้องตอบด้วยเหตุผล คือมีการนัดหยุดงานที่ท่าเรือ", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 10, "q": "Are you familiar with the ISO 9001 quality standards?", "choices": ["Yes, my family is fine.", "I have standard equipment.", "Yes, I implemented them in my previous company.", "Quality is important.", "No, I don't know him."], "answer": 2, "explanation": "ถามว่าคุ้นเคยกับมาตรฐาน ISO 9001 หรือไม่ คำตอบที่ตรงคือยืนยันพร้อมอ้างประสบการณ์ที่เคยนำมาใช้จริง ส่วน family เป็นกับดักเสียงคล้าย familiar", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 11, "q": "Can we push the deadline back by two days?", "choices": ["The deadline is fixed.", "Let me check with the project manager first.", "I pushed the door open.", "Two days is a long time.", "The line is dead."], "answer": 1, "explanation": "คำขอเลื่อนกำหนดส่งงาน คำตอบที่สมเหตุสมผลคือขอตรวจสอบกับผู้จัดการโครงการก่อน", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 12, "q": "How did the negotiation with the supplier go?", "choices": ["They supplied the goods.", "It went well; we managed to get a 10% discount.", "I am negotiating now.", "The supplier is from China.", "Go straight ahead."], "answer": 1, "explanation": "How did ... go? ถามผลลัพธ์ของการเจรจา จึงตอบว่าเป็นไปด้วยดีและได้ส่วนลด 10%", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 13, "q": "I apologize for the confusion regarding the invoice.", "choices": ["You are confused.", "The invoice is paid.", "That's alright, just send the corrected version.", "I don't have an invoice.", "Please apologize to me."], "answer": 2, "explanation": "เมื่อมีผู้กล่าวขอโทษ การตอบรับที่สุภาพคือ That's alright พร้อมบอกสิ่งที่ต้องการให้ทำต่อ (ส่งฉบับแก้ไขมา)", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 14, "q": "Would you like me to help you set up the projector?", "choices": ["The projector is broken.", "Yes, please. That would be very helpful.", "I like projectors.", "Set it on the table.", "No, I am helping you."], "answer": 1, "explanation": "ข้อเสนอให้ความช่วยเหลือ (Would you like me to...?) ตอบรับด้วย Yes, please. That would be very helpful", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 15, "q": "What are the main objectives of this quarter?", "choices": ["We need to increase sales and expand our customer base.", "The quarter is 25 cents.", "I object to this.", "The main entrance is here.", "Four quarters make a dollar."], "answer": 0, "explanation": "ถามเป้าหมายหลักของไตรมาส ต้องตอบด้วยเป้าหมาย (เพิ่มยอดขายและขยายฐานลูกค้า) ตัวเลือกอื่นเล่นคำ quarter/object", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 16, "q": "Do you happen to know where Sarah is?", "choices": ["Sarah is my friend.", "She just stepped out for lunch.", "I happen to know.", "Where is the bathroom?", "She is a woman."], "answer": 1, "explanation": "ถามว่า Sarah อยู่ที่ไหน คำตอบที่ให้ข้อมูลคือเธอเพิ่งออกไปพักกลางวัน", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 17, "q": "Shall we take a short break before continuing?", "choices": ["I usually take my break at noon.", "I took a photo.", "Good idea, let's meet back here in 15 minutes.", "Continue walking.", "I am short."], "answer": 2, "explanation": "คำชวนพักเบรก ตอบตกลงพร้อมนัดหมายเวลากลับมา (Good idea, let's meet back in 15 minutes)", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 18, "q": "I'd prefer to handle this matter via email so we have a record.", "choices": ["I have a record player.", "The mail is delivered.", "Makes sense. I'll send you a summary shortly.", "Handle it with care.", "I prefer tea."], "answer": 2, "explanation": "ผู้พูดขอสื่อสารทางอีเมลเพื่อเก็บหลักฐาน การตอบที่สอดคล้องคือเห็นด้วย (Makes sense) และจะส่งสรุปให้", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 19, "q": "Could you give me an update on the marketing campaign?", "choices": ["The campaign is running smoothly and we are seeing good engagement.", "Update your computer.", "The market is closed.", "I gave it to you.", "We are camping."], "answer": 0, "explanation": "ขอทราบความคืบหน้าของแคมเปญ ต้องตอบสถานะงาน (กำลังไปได้ดี มี engagement ที่ดี)", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 20, "q": "We seem to have a problem with the Wi-Fi connection.", "choices": ["I have a connection.", "Let me call the IT department to check the router.", "The connection fee was already paid.", "Problem solved.", "We seem happy."], "answer": 1, "explanation": "เมื่อมีการแจ้งปัญหา Wi-Fi การตอบที่เหมาะสมคือเสนอการแก้ไข โดยโทรแจ้งฝ่าย IT ให้ตรวจสอบเราเตอร์", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 21, "q": "How was your business trip to Singapore?", "choices": ["Singapore is a country.", "Very productive. We secured two new contracts.", "I am tripping.", "It is a business.", "I went by plane."], "answer": 1, "explanation": "How was...? ถามให้ประเมินการเดินทาง คำตอบคือ Very productive พร้อมผลลัพธ์ (ได้สัญญาใหม่ 2 ฉบับ)", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 22, "q": "What do you suggest we do to reduce expenses?", "choices": ["They are expensive.", "We could start by cutting down on travel costs.", "I suggest a movie.", "Do your homework.", "Reduce the volume."], "answer": 1, "explanation": "ถามข้อเสนอแนะในการลดค่าใช้จ่าย ต้องตอบด้วยวิธีการ เช่น เริ่มจากลดค่าเดินทาง", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 23, "q": "Have you received the agenda for tomorrow's meeting?", "choices": ["The meeting is long.", "Yes, I'm reviewing the discussion points now.", "I received a gift.", "Tomorrow is Friday.", "No, I haven't received the meeting."], "answer": 1, "explanation": "ถามว่าได้รับวาระการประชุมหรือยัง ตอบยืนยันว่าได้รับแล้วและกำลังอ่านประเด็นต่าง ๆ", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 24, "q": "I'm not sure I follow your logic on this issue.", "choices": ["Let me break it down into simpler steps.", "Follow me on social media.", "The logic is a subject.", "I have an issue.", "Are you sure?"], "answer": 0, "explanation": "ผู้พูดบอกว่าตามตรรกะไม่ทัน การตอบที่ช่วยได้คือเสนออธิบายใหม่เป็นขั้นตอนง่าย ๆ (break it down)", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}, {"n": 25, "q": "Thank you for taking the time to meet with me today.", "choices": ["I am taking the bus.", "The time is 3 PM.", "My pleasure. Let me know if you have further questions.", "Meet me tomorrow.", "You're welcome to the party."], "answer": 2, "explanation": "การตอบรับคำขอบคุณอย่างสุภาพในบริบทธุรกิจคือ My pleasure พร้อมเปิดโอกาสให้ถามเพิ่มเติม", "section": "Part 7.1: Speaking (Question-Response) [B1 Level]"}]}, {"id": "eng-listen", "icon": "🎧", "title": "Listening", "subtitle": "Conversations & Talks • Part 7.2 [B1]", "labels": ["A", "B", "C", "D", "E"], "questions": [{"n": 26, "q": "(Audio) 'Attention passengers on flight BL402. The flight is delayed by two hours due to severe weather.' -> Why is the flight delayed?", "choices": ["Mechanical failure", "Bad weather", "Missing crew", "Security check", "Too many passengers"], "answer": 1, "explanation": "ประกาศระบุว่าดีเลย์เพราะ severe weather ซึ่งตรงกับ Bad weather", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 27, "q": "(Audio) 'Hi John, it's Sarah. I'm stuck in traffic and will be 15 minutes late. Can you set up the projector?' -> What does Sarah want John to do?", "choices": ["Drive her to work", "Cancel the presentation", "Prepare the equipment", "Wait outside", "Call the boss"], "answer": 2, "explanation": "Sarah ขอให้ John ติดตั้งโปรเจกเตอร์ (set up the projector) = เตรียมอุปกรณ์", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 28, "q": "(Audio) 'To reduce waste, the company will no longer provide plastic cups in the break room.' -> What is changing?", "choices": ["The break room is closing", "Coffee is no longer free", "Plastic cups will be removed", "Employees must work from home", "The company is moving"], "answer": 2, "explanation": "บริษัทจะเลิกให้แก้วพลาสติกในห้องพัก จึงตรงกับ Plastic cups will be removed", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 29, "q": "(Audio) 'Our Q3 profits increased by 15%, exceeding initial forecasts.' -> How did the company perform in Q3?", "choices": ["They lost money", "Profits dropped by 15%", "They performed worse than expected", "They did better than predicted", "They fired 15% of staff"], "answer": 3, "explanation": "กำไรเพิ่ม 15% และ exceeding forecasts = ทำได้ดีกว่าที่คาดการณ์ไว้", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 30, "q": "(Audio) 'Please ensure all confidential documents are shredded before leaving the office.' -> What is the instruction?", "choices": ["Take documents home", "Destroy sensitive papers", "Print more documents", "Leave papers on the desk", "Share documents with everyone"], "answer": 1, "explanation": "shredded คือการทำลายเอกสารด้วยเครื่องย่อย จึงตรงกับ Destroy sensitive papers", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 31, "q": "(Audio) 'I would recommend the grilled salmon; it's our chef's specialty today.' -> Where is this conversation taking place?", "choices": ["A fish market", "A hospital", "A restaurant", "An office", "A gym"], "answer": 2, "explanation": "การแนะนำเมนู grilled salmon โดยพูดถึง chef บ่งบอกว่าอยู่ในร้านอาหาร", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 32, "q": "(Audio) 'The warranty covers parts and labor for two years, but accidental damage is not included.' -> What is NOT covered?", "choices": ["Labor costs", "Replacement parts", "Two years of service", "Dropping and breaking the item", "Manufacturing defects"], "answer": 3, "explanation": "ประกันครอบคลุมอะไหล่และค่าแรง 2 ปี แต่ระบุชัดว่าไม่รวมความเสียหายจากอุบัติเหตุ (ทำตกแตก)", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 33, "q": "(Audio) 'Before we conclude, does anyone have questions regarding the new health policy?' -> What part of the meeting is this?", "choices": ["The beginning", "The middle", "The end", "The lunch break", "The introduction"], "answer": 2, "explanation": "Before we conclude แปลว่าก่อนจะจบการประชุม จึงเป็นช่วงท้ายของการประชุม", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 34, "q": "(Audio) 'I've reviewed your application and would like to invite you for a second interview next Tuesday.' -> What is happening?", "choices": ["The person is fired", "The person got the job instantly", "The person is applying for a visa", "The person is moving to the next hiring stage", "The person is resigning"], "answer": 3, "explanation": "การถูกเชิญสัมภาษณ์รอบสอง หมายถึงผ่านเข้าสู่ขั้นตอนถัดไปของการคัดเลือก", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 35, "q": "(Audio) 'Due to maintenance, the elevator will be out of service from 2 PM to 4 PM.' -> What should people do at 3 PM?", "choices": ["Use the elevator", "Use the stairs", "Go home", "Wait for the maintenance", "Call the fire department"], "answer": 1, "explanation": "ลิฟต์ปิดซ่อม 14:00-16:00 น. ดังนั้นเวลา 15:00 น. ต้องใช้บันได", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 36, "q": "(Audio) 'Next stop, Central Station. Please remember to take all your belongings.' -> Where would you hear this?", "choices": ["In a restaurant", "On a train or bus", "At a hospital", "In a bank", "At a cinema"], "answer": 1, "explanation": "ประกาศ Next stop และเตือนให้หยิบสัมภาระ เป็นประกาศบนรถไฟหรือรถโดยสาร", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 37, "q": "(Audio) 'Your appointment with Dr. Smith is scheduled for Monday at 10:30 AM.' -> Who is the listener going to see?", "choices": ["A mechanic", "A teacher", "A doctor", "A lawyer", "A chef"], "answer": 2, "explanation": "นัดหมายกับ Dr. Smith แสดงว่าผู้ฟังกำลังจะไปพบแพทย์", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 38, "q": "(Audio) 'The fire alarm is currently being tested. Please ignore the sound and remain at your desks.' -> What should employees do?", "choices": ["Evacuate the building", "Call the fire department", "Stay where they are", "Turn off their computers", "Hide under the desks"], "answer": 2, "explanation": "ประกาศบอกว่ากำลังทดสอบสัญญาณเตือนไฟไหม้ ให้เพิกเฉยและอยู่ที่โต๊ะ = Stay where they are", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 39, "q": "(Audio) 'We are pleased to announce that Emma will be taking over as the new Head of Sales.' -> What is Emma's new position?", "choices": ["Sales Assistant", "Marketing Director", "Head of Sales", "HR Manager", "CEO"], "answer": 2, "explanation": "ประกาศระบุชัดว่า Emma จะรับตำแหน่ง Head of Sales คนใหม่", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 40, "q": "(Audio) 'The deadline for the project proposal has been extended to Friday.' -> When is the new deadline?", "choices": ["Monday", "Wednesday", "Thursday", "Friday", "Sunday"], "answer": 3, "explanation": "กำหนดส่งถูกขยาย (extended) ไปเป็นวันศุกร์", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 41, "q": "(Audio) 'Please leave a message after the beep, and I will get back to you as soon as possible.' -> What are you listening to?", "choices": ["A live radio show", "A voicemail greeting", "A meeting recording", "A customer service operator", "A podcast"], "answer": 1, "explanation": "ข้อความให้ฝากข้อความหลังเสียงบี๊บ คือข้อความตอบรับอัตโนมัติของ voicemail", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 42, "q": "(Audio) 'All electronic devices must be turned off during takeoff and landing.' -> Where are you?", "choices": ["In an airplane", "In a car", "At a movie theater", "On a bicycle", "On a train"], "answer": 0, "explanation": "คำสั่งปิดอุปกรณ์อิเล็กทรอนิกส์ช่วง takeoff และ landing มีเฉพาะบนเครื่องบิน", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 43, "q": "(Audio) 'The total comes to $45.50. Will you be paying with cash or card?' -> Where is this taking place?", "choices": ["At a library", "At a park", "At a checkout counter", "In a meeting", "At a gym"], "answer": 2, "explanation": "การแจ้งยอดเงินและถามว่าจ่ายเงินสดหรือบัตร เกิดขึ้นที่จุดชำระเงิน (checkout counter)", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 44, "q": "(Audio) 'We regret to inform you that the concert has been cancelled due to unforeseen circumstances.' -> What happened to the concert?", "choices": ["It is starting now", "It is postponed", "It is sold out", "It will not happen", "It is moving to a new venue"], "answer": 3, "explanation": "cancelled แปลว่ายกเลิก คอนเสิร์ตจะไม่จัดขึ้น (ไม่ใช่เลื่อนซึ่งคือ postponed)", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 45, "q": "(Audio) 'Please hold the line. Our next available agent will be with you shortly.' -> What should the caller do?", "choices": ["Hang up", "Wait on the phone", "Call back later", "Speak to the manager", "Leave a voicemail"], "answer": 1, "explanation": "Please hold the line แปลว่าให้ถือสายรอ = Wait on the phone", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 46, "q": "(Audio) 'The museum is open daily from 9 AM to 5 PM, except on Mondays.' -> Is the museum open on Monday at 10 AM?", "choices": ["Yes, it's open", "No, it's closed", "Only for VIPs", "Only in the afternoon", "It depends on the season"], "answer": 1, "explanation": "พิพิธภัณฑ์ปิดทุกวันจันทร์ ดังนั้นวันจันทร์ 10 โมงจึงปิด", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 47, "q": "(Audio) 'Welcome to the annual tech conference. Our first keynote speaker will begin in 10 minutes.' -> What event is this?", "choices": ["A wedding", "A tech conference", "A sports match", "A music festival", "A graduation"], "answer": 1, "explanation": "ประกาศต้อนรับระบุชัดว่าเป็นงาน annual tech conference", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 48, "q": "(Audio) 'Could you please speak a bit slower? I am having trouble understanding you.' -> What is the problem?", "choices": ["The speaker is too quiet", "The speaker is too fast", "The listener is deaf", "The phone is broken", "The language is wrong"], "answer": 1, "explanation": "ผู้ฟังขอให้พูดช้าลง แสดงว่าปัญหาคือผู้พูดพูดเร็วเกินไป", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 49, "q": "(Audio) 'Don't forget to submit your timesheets by the end of the week.' -> What must employees submit?", "choices": ["Their resignations", "Their vacation requests", "Their timesheets", "Their expense reports", "Their project plans"], "answer": 2, "explanation": "ประกาศเตือนให้ส่ง timesheets ภายในสิ้นสัปดาห์", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}, {"n": 50, "q": "(Audio) 'The weather forecast predicts heavy rain this afternoon, so don't forget your umbrellas.' -> What should people bring?", "choices": ["Sunglasses", "Sunscreen", "Winter coats", "Umbrellas", "Swimsuits"], "answer": 3, "explanation": "พยากรณ์ว่าฝนตกหนัก จึงเตือนให้พกร่ม (umbrellas)", "section": "Part 7.2: Listening Context (Conversations & Talks) [B1 Level]"}]}, {"id": "eng-write", "icon": "✍️", "title": "Writing", "subtitle": "Grammar & Sentence Completion • Part 7.3 [B1]", "labels": ["A", "B", "C", "D", "E"], "questions": [{"n": 51, "q": "If we _____ earlier, we wouldn't have missed the flight.", "choices": ["leave", "left", "have left", "had left", "leaving"], "answer": 3, "explanation": "ประโยคเงื่อนไขแบบที่ 3 (เหตุการณ์ตรงข้ามอดีต): If + past perfect (had left), would have + V3", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 52, "q": "The quarterly report _____ by the financial team yesterday.", "choices": ["completed", "was completed", "is completed", "has completed", "completes"], "answer": 1, "explanation": "ประธาน (รายงาน) ถูกกระทำ และมี yesterday บอกอดีต จึงใช้ passive อดีต: was completed", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 53, "q": "_____ the heavy rain, the outdoor team building event was cancelled.", "choices": ["Because", "Although", "Due to", "However", "In spite of"], "answer": 2, "explanation": "Due to + คำนามวลี (the heavy rain) แสดงสาเหตุ ส่วน Because ต้องตามด้วยประโยคเต็ม", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 54, "q": "I am looking forward _____ you at the conference next week.", "choices": ["to meet", "meet", "meeting", "to meeting", "met"], "answer": 3, "explanation": "สำนวน look forward to + V-ing โดย to เป็นบุพบท จึงตอบ to meeting", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 55, "q": "She asked me where _____ the marketing documents.", "choices": ["did I put", "I put", "put I", "do I put", "I putting"], "answer": 1, "explanation": "คำถามทางอ้อม (indirect question) ใช้โครงสร้างบอกเล่า ประธานมาก่อนกริยา: where I put", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 56, "q": "Employees are required to wear safety helmets _____ they are on the construction site.", "choices": ["during", "whether", "while", "despite", "until"], "answer": 2, "explanation": "while + ประโยค (they are on site) แปลว่าขณะที่ ส่วน during ต้องตามด้วยคำนาม", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 57, "q": "By this time next year, I _____ my master's degree in business administration.", "choices": ["will finish", "will have finished", "finish", "finished", "am finishing"], "answer": 1, "explanation": "By this time next year เป็นสัญญาณของ future perfect: will have finished", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 58, "q": "We won't be able to launch the product _____ we get the final approval from the CEO.", "choices": ["if", "unless", "because", "therefore", "so"], "answer": 1, "explanation": "unless = if...not: เปิดตัวสินค้าไม่ได้ถ้าไม่ได้รับอนุมัติจาก CEO", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 59, "q": "The manager, _____ office is on the third floor, is currently in a meeting.", "choices": ["who", "whom", "which", "whose", "that"], "answer": 3, "explanation": "whose แสดงความเป็นเจ้าของ แทน the manager's office", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 60, "q": "He is very _____ in learning new programming languages.", "choices": ["interest", "interesting", "interested", "interestingly", "interests"], "answer": 2, "explanation": "คนรู้สึกสนใจใช้ interested (in) ส่วน interesting ใช้บรรยายสิ่งที่น่าสนใจ", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 61, "q": "They have been working on this project _____ three months.", "choices": ["since", "for", "in", "during", "ago"], "answer": 1, "explanation": "for + ระยะเวลา (three months) ส่วน since + จุดเริ่มต้นของเวลา", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 62, "q": "_____ she is the youngest in the team, she is the most experienced.", "choices": ["However", "Because", "Therefore", "Although", "Despite"], "answer": 3, "explanation": "Although + ประโยค แสดงความขัดแย้ง ส่วน Despite ต้องตามด้วยคำนามหรือ V-ing", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 63, "q": "The new software update _____ released next Monday.", "choices": ["will be", "is being", "has been", "was", "will"], "answer": 0, "explanation": "เหตุการณ์อนาคต (next Monday) ในรูปถูกกระทำ: will be released", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 64, "q": "If I _____ you, I would ask for a raise.", "choices": ["am", "was", "were", "been", "be"], "answer": 2, "explanation": "ประโยคเงื่อนไขแบบที่ 2 สมมติสิ่งที่ไม่จริง ใช้ were กับทุกประธาน: If I were you", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 65, "q": "You should _____ your resume before applying for the job.", "choices": ["to update", "updating", "updated", "update", "updates"], "answer": 3, "explanation": "หลังกริยาช่วย should ใช้กริยาช่องที่ 1 ไม่ผัน: should update", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 66, "q": "The company decided to lay off 50 employees _____ the economic downturn.", "choices": ["instead of", "because of", "in addition to", "despite", "although"], "answer": 1, "explanation": "because of + คำนามวลี (the economic downturn) แสดงสาเหตุ", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 67, "q": "Neither the manager _____ the employees were happy with the new policy.", "choices": ["or", "and", "nor", "but", "so"], "answer": 2, "explanation": "โครงสร้างคู่ Neither...nor (ไม่ทั้งผู้จัดการและพนักงาน)", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 68, "q": "She is the _____ employee we have ever hired.", "choices": ["most hardworking", "more hardworking", "hardworking", "hardwork", "hardworkingest"], "answer": 0, "explanation": "ขั้นสุดของคำคุณศัพท์หลายพยางค์ hardworking คือ the most hardworking", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 69, "q": "Please make sure to turn off the lights before _____ the office.", "choices": ["leave", "left", "leaving", "to leave", "leaves"], "answer": 2, "explanation": "หลังบุพบท before ใช้ V-ing: before leaving the office", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 70, "q": "We need to come _____ with a better strategy to increase sales.", "choices": ["up", "down", "in", "out", "over"], "answer": 0, "explanation": "phrasal verb: come up with = คิด (กลยุทธ์/ไอเดีย) ขึ้นมา", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 71, "q": "The client requested that the contract _____ revised.", "choices": ["is", "be", "was", "were", "has been"], "answer": 1, "explanation": "requested that + present subjunctive กริยาไม่ผัน: (should) be revised", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 72, "q": "I'm not used _____ up so early in the morning.", "choices": ["to wake", "waking", "to waking", "wake", "woke"], "answer": 2, "explanation": "be/get used to + V-ing (to เป็นบุพบท): not used to waking up early", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 73, "q": "It is important that everyone _____ the meeting on time.", "choices": ["attends", "attend", "attended", "attending", "to attend"], "answer": 1, "explanation": "It is important that + subjunctive ใช้กริยารูปฐานไม่ผัน: everyone attend", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 74, "q": "Hardly _____ arrived at the station when the train departed.", "choices": ["I had", "had I", "I have", "have I", "I did"], "answer": 1, "explanation": "Hardly ขึ้นต้นประโยคต้องสลับที่ (inversion): Hardly had I arrived ... when ...", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}, {"n": 75, "q": "The book, _____ was published last year, became a bestseller.", "choices": ["who", "whom", "that", "which", "whose"], "answer": 3, "explanation": "อนุประโยคแบบ non-restrictive (มี comma) กับสิ่งของใช้ which เท่านั้น ใช้ that ไม่ได้", "section": "Part 7.3: Writing (Grammar & Sentence Completion) [B1 Level]"}]}, {"id": "eng-read", "icon": "📖", "title": "Reading", "subtitle": "Passages & Visual Data • Part 7.4 [B1]", "labels": ["A", "B", "C", "D", "E"], "questions": [{"n": 76, "q": "(Memo) 'Reminder: The deadline for submitting annual leave requests is Nov 15th.' -> What is the main purpose?", "choices": ["To cancel all annual leave", "To announce a holiday", "To remind staff of a submission deadline", "To guarantee everyone gets a vacation", "To introduce a new booking system"], "answer": 2, "explanation": "Reminder + deadline คือการเตือนกำหนดส่งคำขอลาพักร้อน", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 77, "q": "(Email) 'Dear Client, We apologize for the error. We have credited your account with $50.' -> What action did the company take?", "choices": ["They charged $50", "They closed the account", "They ignored the error", "They refunded $50", "They sued the client"], "answer": 3, "explanation": "credited your account with $50 = คืนเงินเข้าบัญชี $50", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 78, "q": "(Sign) 'Authorized Personnel Only. Protective gear must be worn.' -> Who can enter?", "choices": ["Anyone without gear", "Only staff, but gear is optional", "Only approved staff wearing safety equipment", "Customers wearing helmets", "Nobody"], "answer": 2, "explanation": "เข้าได้เฉพาะผู้ได้รับอนุญาต และต้องสวมอุปกรณ์ป้องกัน (ทั้งสองเงื่อนไข)", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 79, "q": "(Job Ad) 'Looking for a motivated individual with 3 years B2B sales experience. Mandarin is a plus.' -> Best candidate?", "choices": ["Fresh graduate speaking Spanish", "4 years B2B experience speaking Mandarin", "10 years B2C experience only", "Mandarin teacher", "1 year B2B experience"], "answer": 1, "explanation": "ผู้สมัครที่มีประสบการณ์ B2B 4 ปีและพูดจีนกลางได้ ตรงและเกินคุณสมบัติที่ประกาศต้องการ", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 80, "q": "(Article) 'Despite the economic downturn, cloud computing grew 5%, while hardware sales plummeted.' -> What happened to hardware?", "choices": ["Grew by 5%", "Remained stable", "Decreased significantly", "Became cloud computing", "Were not reported"], "answer": 2, "explanation": "plummeted แปลว่าตกฮวบ = ลดลงอย่างมาก", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 81, "q": "(Schedule) 'Workshop A: 09:00-10:30. Workshop B: 10:45-12:15. Lunch: 12:15.' -> Break between workshops?", "choices": ["10 minutes", "15 minutes", "30 minutes", "45 minutes", "1 hour"], "answer": 1, "explanation": "Workshop A จบ 10:30 และ B เริ่ม 10:45 จึงมีช่วงพัก 15 นาที", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 82, "q": "(Policy) 'Items may be returned within 30 days for a full refund, if in original packaging with receipt.' -> NOT required?", "choices": ["Returning within 30 days", "Having original receipt", "Original packaging", "Explaining why you didn't like it", "Being a purchased item"], "answer": 3, "explanation": "เงื่อนไขการคืนคือภายใน 30 วัน มีบรรจุภัณฑ์เดิมและใบเสร็จ ไม่ต้องอธิบายเหตุผลที่ไม่ชอบสินค้า", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 83, "q": "(Chart text) 'A sharp rise in user engagement during summer, followed by a gradual decline in winter.' -> Winter trend?", "choices": ["Goes up quickly", "Stays high", "Drops off slowly", "Crashes instantly", "Fluctuates wildly"], "answer": 2, "explanation": "gradual decline = ค่อย ๆ ลดลง (Drops off slowly)", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 84, "q": "(Instruction) 'Apply primer before painting. Let dry for at least 2 hours.' -> What to do before painting?", "choices": ["Wait 2 hours doing nothing", "Paint immediately", "Put primer and let dry for 2+ hours", "Put thick paint", "Wash wall"], "answer": 2, "explanation": "ก่อนทาสีต้องทาไพรเมอร์และปล่อยให้แห้งอย่างน้อย 2 ชั่วโมง", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 85, "q": "(News) 'The council approved a shopping mall, expecting to create 500 permanent jobs.' -> Positive outcome?", "choices": ["Increased traffic", "Higher taxes", "More employment", "Closing local shops", "Noise pollution"], "answer": 2, "explanation": "การสร้างงานประจำ 500 ตำแหน่ง = การจ้างงานเพิ่มขึ้น (More employment)", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 86, "q": "(Notice) 'The cafeteria will be closed for renovations from Monday to Wednesday.' -> When will it reopen?", "choices": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], "answer": 3, "explanation": "ปิดปรับปรุงจันทร์ถึงพุธ จึงกลับมาเปิดวันพฤหัสบดี", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 87, "q": "(Email) 'Please find attached the finalized budget for Q4. Let me know if you need any adjustments.' -> What is attached?", "choices": ["A schedule", "A resume", "The Q4 budget", "An invoice", "A presentation"], "answer": 2, "explanation": "Please find attached the finalized budget for Q4 = ไฟล์แนบคืองบประมาณ Q4", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 88, "q": "(Label) 'Machine wash cold with like colors. Tumble dry low.' -> How should you dry the item?", "choices": ["Hand wash", "Hang it outside", "Tumble dry on low heat", "Iron it", "Dry clean only"], "answer": 2, "explanation": "ฉลากระบุ Tumble dry low = อบแห้งด้วยความร้อนต่ำ", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 89, "q": "(Warning) 'Do not operate heavy machinery after taking this medication.' -> What is prohibited?", "choices": ["Sleeping", "Eating", "Driving a bulldozer", "Taking medicine", "Working night shifts"], "answer": 2, "explanation": "bulldozer (รถดันดิน) คือเครื่องจักรหนัก จึงเป็นสิ่งที่ห้ามทำหลังกินยา", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 90, "q": "(Ad) 'Buy one get one 50% off on all footwear this weekend only!' -> What is the offer?", "choices": ["Free shoes", "50% off everything", "Second pair of shoes is half price", "Shoes are double price", "Valid all month"], "answer": 2, "explanation": "Buy one get one 50% off = ซื้อคู่แรกราคาเต็ม คู่ที่สองลดครึ่งราคา", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 91, "q": "(Policy) 'Employees must clock in within 10 minutes of their shift start time to avoid a penalty.' -> What happens at 15 minutes late?", "choices": ["They get a bonus", "They are fired", "They face a penalty", "Nothing", "They go home"], "answer": 2, "explanation": "มาช้าเกิน 10 นาที (15 นาที) จึงเข้าข่ายได้รับบทลงโทษตามนโยบาย", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 92, "q": "(Graph description) 'Sales peaked in November due to Black Friday, then leveled off in December.' -> When were sales highest?", "choices": ["October", "November", "December", "Black Friday only", "They were flat"], "answer": 1, "explanation": "Sales peaked in November = ยอดขายสูงสุดในเดือนพฤศจิกายน", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 93, "q": "(Memo) 'The IT department will be conducting server maintenance tonight from midnight to 4 AM. Systems will be offline.' -> When will systems be back online?", "choices": ["Midnight", "2 AM", "4 AM", "Tomorrow night", "Next week"], "answer": 2, "explanation": "ระบบออฟไลน์เที่ยงคืนถึงตี 4 จึงกลับมาใช้งานได้ตอนตี 4", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 94, "q": "(Review) 'The hotel was incredibly clean and the staff were friendly, but the Wi-Fi was terribly slow.' -> What was a negative aspect?", "choices": ["The cleanliness", "The staff", "The location", "The internet speed", "The price"], "answer": 3, "explanation": "ข้อเสียที่รีวิวระบุคือ Wi-Fi ช้ามาก = ความเร็วอินเทอร์เน็ต", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 95, "q": "(Instruction) 'In case of fire, use the stairs. Do not use the elevator.' -> What should you avoid during a fire?", "choices": ["The stairs", "The exit", "The elevator", "Running", "The ground floor"], "answer": 2, "explanation": "คำสั่งระบุชัดว่าเมื่อเกิดไฟไหม้ให้ใช้บันได ห้ามใช้ลิฟต์", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 96, "q": "(Invitation) 'You are cordially invited to the company's 10th anniversary gala on Friday at 7 PM. Dress code: Formal.' -> What should you wear?", "choices": ["Casual clothes", "Business casual attire", "A suit or evening gown", "Pyjamas", "A uniform"], "answer": 2, "explanation": "Dress code: Formal หมายถึงชุดสูทหรือชุดราตรี", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 97, "q": "(Article) 'The new legislation aims to reduce carbon emissions by 30% over the next decade.' -> What is the goal?", "choices": ["Increase pollution", "Cut carbon emissions by 30% in 10 years", "Ban all cars", "Build more factories", "Plant trees"], "answer": 1, "explanation": "เป้าหมายของกฎหมายคือลดการปล่อยคาร์บอน 30% ภายในหนึ่งทศวรรษ", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 98, "q": "(Sign) 'Please wait behind the yellow line until the train has come to a complete stop.' -> When can you cross the line?", "choices": ["When the train is approaching", "When the train has stopped completely", "Whenever you want", "Never", "When the lights flash"], "answer": 1, "explanation": "ให้รอหลังเส้นเหลืองจนกว่ารถไฟจะหยุดสนิท (complete stop) จึงข้ามเส้นได้", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 99, "q": "(Email snippet) 'I am writing to express my dissatisfaction with the service I received at your store yesterday.' -> What is the tone of the email?", "choices": ["Happy", "Complaining", "Apologetic", "Informative", "Thankful"], "answer": 1, "explanation": "express my dissatisfaction = แสดงความไม่พอใจ น้ำเสียงจึงเป็นการร้องเรียน (Complaining)", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}, {"n": 100, "q": "(Warranty) 'This product is guaranteed against manufacturing defects for a period of one year.' -> What does the warranty cover?", "choices": ["Accidental drops", "Normal wear and tear", "Flaws from the manufacturing process", "Theft", "Water damage"], "answer": 2, "explanation": "ประกันครอบคลุมเฉพาะ manufacturing defects = ข้อบกพร่องจากกระบวนการผลิต", "section": "Part 7.4: Reading (Passages & Visual Data) [B1 Level]"}]}]};</script>

let actx = null;
function beep(freqs, dur=0.12, type="sine", vol=0.15){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, actx.currentTime + i*dur);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (i+1)*dur);
      o.connect(g).connect(actx.destination);
      o.start(actx.currentTime + i*dur); o.stop(actx.currentTime + (i+1)*dur + .02);
    });
  }catch(e){}
}
const sndGood = ()=>beep([660,880],0.1,"sine",.12);
const sndBad  = ()=>beep([220,180],0.15,"square",.06);
const sndWin  = ()=>beep([523,659,784,1047],0.14,"sine",.14);
const sndClick= ()=>beep([440],0.05,"sine",.05);
function toggleMute(){ muted=!muted; localStorage.setItem("vnet-muted",muted?"1":"0"); $("mutebtn").textContent = muted?"🔇":"🔊"; }

/* ================= home ================= */
function renderHome(){
  const st = store.get();
  const myIds = new Set([...EXAM_DATA.subjects.map(s=>s.id), "mix"]);
  let answered=0, correct=0;
  for(const k in (st.log||{})){ if(!myIds.has(k)) continue; answered += st.log[k].a; correct += st.log[k].c; }
  $("st-total").textContent = EXAM_DATA.subjects.reduce((s,x)=>s+x.questions.length,0);
  $("st-answered").textContent = answered;
  $("st-acc").textContent = answered ? Math.round(correct/answered*100)+"%" : "—";
  $("st-streak").textContent = st.maxStreak||0;

  const g = $("subjects"); g.innerHTML = "";
  EXAM_DATA.subjects.forEach(s=>{
    const best = (st.best||{})[s.id];
    const b = document.createElement("button");
    b.className = "subj";
    b.innerHTML = `<div class="ic">${s.icon}</div><h3>${s.title}</h3><div class="sub">${s.subtitle}</div>
      <div class="meta"><span class="badge">${s.questions.length} ข้อ</span>
      <span class="best">${best!=null ? "🏆 "+best+"%" : "ยังไม่เคยทำ"}</span></div>`;
    b.onclick = ()=>openSetup(s.id);
    g.appendChild(b);
  });
  if(EXAM_DATA.subjects.length < 2) return;
  const grandTotal = EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0);
  const mix = document.createElement("button");
  mix.className = "subj mix";
  const mixBest = (st.best||{})["mix"];
  mix.innerHTML = `<div class="ic">🎲</div><h3>จับฉลากรวมทุกชุด</h3><div class="sub">สุ่มคละจากทั้ง ${grandTotal} ข้อ</div>
    <div class="meta"><span class="badge">ท้าทาย!</span><span class="best">${mixBest!=null?"🏆 "+mixBest+"%":"ยังไม่เคยทำ"}</span></div>`;
  mix.onclick = ()=>openSetup("mix");
  g.appendChild(mix);
}

/* ================= setup modal ================= */
let setup = {n:20, mode:"practice", shuffleQ:true, shuffleC:false, subj:null};
function openSetup(id){
  sndClick();
  setup.subj = id;
  const s = id==="mix" ? {title:"จับฉลากรวมทุกวิชา", subtitle:"คละทุกสมรรถนะ", icon:"🎲",
      questions:{length:EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0)}}
    : EXAM_DATA.subjects.find(x=>x.id===id);
  const total = s.questions.length;
  const counts = [10,20,30,total>=100?50:total].filter((v,i,a)=>v<=total && a.indexOf(v)===i);
  if(!counts.includes(total) && total<=60) counts.push(total);
  setup.n = counts.includes(20)?20:counts[0];
  if(id==="mix") setup.shuffleQ = true;
  $("modal-root").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeSetup()">
    <div class="modal">
      <h2>${s.icon} ${s.title}</h2>
      <div class="sub">${s.subtitle} • มีทั้งหมด ${total} ข้อ</div>
      <div class="optlabel">โหมด</div>
      <div class="optrow" id="mode-row">
        <button class="opt ${setup.mode==="practice"?"sel":""}" onclick="setMode('practice')">📖 ฝึกฝน (เฉลยทันที)</button>
        <button class="opt ${setup.mode==="exam"?"sel":""}" onclick="setMode('exam')">⏱️ สอบเสมือนจริง</button>
      </div>
      <div class="optlabel">จำนวนข้อ</div>
      <div class="optrow" id="count-row">
        ${counts.map(c=>`<button class="opt ${c===setup.n?"sel":""}" onclick="setCount(${c})">${c===total?"ทั้งหมด ("+c+")":c}</button>`).join("")}
      </div>
      <div class="toggle ${setup.shuffleQ?"on":""}" id="tg-q" onclick="tog('shuffleQ','tg-q')"><span class="box">${setup.shuffleQ?"✓":""}</span> สุ่มลำดับข้อ</div>
      <div class="toggle ${setup.shuffleC?"on":""}" id="tg-c" onclick="tog('shuffleC','tg-c')"><span class="box">${setup.shuffleC?"✓":""}</span> สุ่มลำดับตัวเลือก</div>
      <div class="mrow">
        <button class="btn ghost" onclick="closeSetup()">ยกเลิก</button>
        <button class="btn primary" onclick="startQuiz()">เริ่มเลย 🚀</button>
      </div>
    </div>
  </div>`;
}
function setMode(m){ setup.mode=m; document.querySelectorAll("#mode-row .opt").forEach((b,i)=>b.classList.toggle("sel",(i===0)===(m==="practice"))); sndClick(); }
function setCount(c){ setup.n=c; document.querySelectorAll("#count-row .opt").forEach(b=>b.classList.toggle("sel",b.textContent.includes("("+c+")")||b.textContent.trim()==String(c))); sndClick(); }
function tog(key,id){ setup[key]=!setup[key]; const el=$(id); el.classList.toggle("on",setup[key]); el.querySelector(".box").textContent = setup[key]?"✓":""; sndClick(); }
function closeSetup(){ $("modal-root").innerHTML=""; }

/* ================= quiz engine ================= */
function shuffled(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

function startQuiz(){
  closeSetup();
  let pool, labels;
  if(setup.subj==="mix"){
    pool = EXAM_DATA.subjects.flatMap(s=>s.questions.map(q=>({...q, labels:s.labels, from:s.icon+" "+s.title})));
    labels = null;
  } else {
    const s = EXAM_DATA.subjects.find(x=>x.id===setup.subj);
    pool = s.questions.map(q=>({...q, labels:s.labels, from:""}));
  }
  if(setup.shuffleQ) pool = shuffled(pool);
  pool = pool.slice(0, setup.n);
  pool = pool.map(q=>{
    let idx = q.choices.map((_,i)=>i);
    if(setup.shuffleC) idx = shuffled(idx);
    return {...q, order:idx, picked:null, removed:[]};
  });
  S = { qs:pool, i:0, correct:0, streak:0, maxStreak:0, fifty:3, mode:setup.mode,
        subj:setup.subj, start:Date.now(), done:false };
  $("home").classList.add("hidden"); $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("mutebtn").textContent = muted?"🔇":"🔊";
  $("palette").classList.toggle("hidden", S.mode!=="exam");
  clearInterval(timerInt);
  timerInt = setInterval(()=>{ const t=Math.floor((Date.now()-S.start)/1000);
    $("q-timer").textContent = String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); },500);
  renderQ();
  window.scrollTo(0,0);
}

function renderQ(){
  const q = S.qs[S.i];
  $("q-count").textContent = `${S.i+1}/${S.qs.length}`;
  $("q-score").textContent = `✅ ${S.correct}`;
  $("q-streak").textContent = `🔥 ${S.streak}`;
  $("q-progress").style.width = (S.i/S.qs.length*100)+"%";
  $("q-section").textContent = q.from || q.section || "";
  stopSpeech();
  const audio = parseAudio(q.q);
  $("q-text").textContent = `${S.i+1}. ${audio ? audio.question : q.q}`;
  renderAudioBox(audio);
  $("q-expl").innerHTML = "";
  $("nextbtn").classList.add("hidden");
  $("skipbtn").classList.toggle("hidden", S.mode!=="exam");
  $("submitbtn").classList.add("hidden");
  $("fifty").classList.toggle("hidden", S.mode!=="practice");
  $("fifty").disabled = S.fifty<=0;
  $("fifty-n").textContent = "×"+S.fifty;

  const c = $("q-choices"); c.innerHTML = "";
  q.order.forEach((origIdx,pos)=>{
    const b = document.createElement("button");
    b.className = "choice";
    if(q.removed.includes(origIdx)) b.classList.add("dim");
    b.innerHTML = `<span class="lb">${q.labels[pos]}</span><span>${q.choices[origIdx]}</span>`;
    if(S.mode==="exam" && q.picked===origIdx) b.classList.add("picked");
    b.onclick = ()=>pick(origIdx, b);
    c.appendChild(b);
  });
  if(S.mode==="exam"){
    renderPalette();
    if(q.picked!==null || S.i===S.qs.length-1) maybeShowSubmit();
  }
}

/* ===== text-to-speech for listening questions ===== */
const AUDIO_RE = /^\(Audio\)\s*['‘’](.*)['‘’]\s*(?:->|→)\s*(.*)$/s;
function parseAudio(text){
  const m = AUDIO_RE.exec(text);
  return m ? {script:m[1].trim(), question:m[2].trim()} : null;
}
let currentScript = null;
function stopSpeech(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  document.querySelectorAll(".playbtn").forEach(b=>b.classList.remove("playing"));
}
let currentUtterance = null; // keep a reference so Chrome doesn't GC it mid-speech
function playAudio(){
  if(!("speechSynthesis" in window) || !currentScript) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(currentScript);
  u.lang = "en-US"; u.rate = 0.92;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x=>x.name==="Samantha") || vs.find(x=>x.lang==="en-US") ||
            vs.find(x=>x.lang && x.lang.startsWith("en"));
  if(v) u.voice = v;
  const btn = document.querySelector(".playbtn");
  u.onstart = ()=>btn && btn.classList.add("playing");
  u.onend = u.onerror = ()=>btn && btn.classList.remove("playing");
  currentUtterance = u;
  // Chrome quirk: speak() immediately after cancel() can be silently dropped
  setTimeout(()=>speechSynthesis.speak(u), 80);
}
function toggleScript(){
  const s = $("q-script"); if(s) s.classList.toggle("hidden");
}
function renderAudioBox(audio){
  currentScript = audio ? audio.script : null;
  const box = $("q-audio");
  if(!audio){ box.innerHTML = ""; return; }
  const ttsOK = "speechSynthesis" in window;
  box.innerHTML = `<div class="audio-box">
    <div class="audio-row">
      <button class="playbtn" onclick="playAudio()">▶️ ฟังเสียง</button>
      <button class="scriptbtn" onclick="toggleScript()">📜 ดูบทพูด</button>
    </div>
    <div class="script hidden" id="q-script">"${audio.script}"</div>
    <div class="audio-hint">${ttsOK ? "ฟังได้หลายรอบ • ลองตอบโดยไม่เปิดบทพูดเพื่อฝึกการฟังจริง" : "เบราว์เซอร์นี้ไม่รองรับเสียงพูด — กด ดูบทพูด เพื่ออ่านแทน"}</div>
  </div>`;
}
function labelOf(q, origIdx){ return q.labels[q.order.indexOf(origIdx)]; }
function pick(idx, btn){
  const q = S.qs[S.i];
  if(S.mode==="practice"){
    if(q.picked!==null) return;
    q.picked = idx;
    const good = idx===q.answer;
    if(good){ S.correct++; S.streak++; S.maxStreak=Math.max(S.maxStreak,S.streak); sndGood();
      if(S.streak>0 && S.streak%5===0){ comboPop("🔥 "+S.streak+" ติด!"); }
    } else { S.streak=0; sndBad(); $("qcard").classList.add("shake"); setTimeout(()=>$("qcard").classList.remove("shake"),400); }
    // reveal
    [...$("q-choices").children].forEach((b,pos)=>{
      const oi = q.order[pos];
      b.disabled = true;
      if(oi===q.answer) b.classList.add("correct");
      else if(oi===idx) b.classList.add("wrong");
    });
    $("q-score").textContent = `✅ ${S.correct}`;
    $("q-streak").textContent = `🔥 ${S.streak}`;
    $("q-expl").innerHTML = `<div class="expl ${good?"good":"bad"}">
      <h4>${good ? "🎉 ถูกต้อง!" : "❌ ยังไม่ถูก — เฉลยคือ "+labelOf(q,q.answer)+"."}</h4>
      <p>${q.explanation || "ไม่มีคำอธิบายเพิ่มเติมสำหรับข้อนี้"}</p></div>`;
    const sc = $("q-script"); if(sc) sc.classList.remove("hidden");
    $("fifty").classList.add("hidden");
    if(S.i===S.qs.length-1){ $("nextbtn").textContent = "ดูสรุปผล 🏁"; }
    $("nextbtn").classList.remove("hidden");
    $("nextbtn").focus();
  } else {
    q.picked = idx; sndClick();
    [...$("q-choices").children].forEach((b,pos)=>b.classList.toggle("picked", q.order[pos]===idx));
    renderPalette(); maybeShowSubmit();
    setTimeout(()=>{ if(S.i<S.qs.length-1){ S.i++; renderQ(); window.scrollTo(0,0);} }, 250);
  }
}

function nextQ(){
  if(S.i>=S.qs.length-1){ finishQuiz(); return; }
  S.i++; renderQ(); window.scrollTo(0,0);
}
function maybeShowSubmit(){
  const allDone = S.qs.every(q=>q.picked!==null);
  $("submitbtn").classList.toggle("hidden", !(allDone || S.i===S.qs.length-1));
}
function renderPalette(){
  const p = $("palette"); p.innerHTML = "";
  S.qs.forEach((q,i)=>{
    const b = document.createElement("button");
    b.className = "pal"+(q.picked!==null?" done":"")+(i===S.i?" cur":"");
    b.textContent = i+1;
    b.onclick = ()=>{ S.i=i; renderQ(); };
    p.appendChild(b);
  });
}
function useFifty(){
  const q = S.qs[S.i];
  if(S.fifty<=0 || q.picked!==null) return;
  S.fifty--;
  const wrongs = shuffled(q.order.filter(i=>i!==q.answer && !q.removed.includes(i))).slice(0,2);
  q.removed.push(...wrongs);
  sndClick(); renderQ();
}
function confirmExit(){
  if(S && !S.done && S.qs.some(q=>q.picked!==null)){
    if(!confirm("ออกจากการทำข้อสอบ? ความคืบหน้ารอบนี้จะหายไป")) return;
  }
  quitToHome();
}
function quitToHome(){
  stopSpeech();
  clearInterval(timerInt); S=null;
  $("quiz").classList.add("hidden"); $("result").classList.add("hidden");
  $("home").classList.remove("hidden");
  renderHome(); window.scrollTo(0,0);
}

/* ================= results ================= */
function finishQuiz(){
  S.done = true;
  stopSpeech();
  clearInterval(timerInt);
  if(S.mode==="exam"){ S.correct = S.qs.filter(q=>q.picked===q.answer).length; }
  const n = S.qs.length, pct = Math.round(S.correct/n*100);
  const secs = Math.floor((Date.now()-S.start)/1000);
  const time = String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0");

  // save stats
  const st = store.get();
  st.best = st.best||{}; st.log = st.log||{};
  if(pct > (st.best[S.subj] ?? -1)) st.best[S.subj] = pct;
  const lg = st.log[S.subj] || {a:0,c:0};
  lg.a += n; lg.c += S.correct; st.log[S.subj] = lg;
  st.maxStreak = Math.max(st.maxStreak||0, S.maxStreak);
  store.set(st);

  const verdict = pct===100 ? ["🏆 สมบูรณ์แบบ!","var(--warn)"]
    : pct>=80 ? ["🌟 เยี่ยมมาก!","var(--good)"]
    : pct>=60 ? ["👍 ผ่านเกณฑ์ ทำได้ดี","var(--brand2)"]
    : pct>=40 ? ["💪 เกือบแล้ว สู้ต่อ!","var(--warn)"]
    : ["📚 ทบทวนอีกนิด แล้วลองใหม่","var(--bad)"];

  const circ = 2*Math.PI*80;
  const wrong = S.qs.filter(q=>q.picked!==q.answer);
  $("quiz").classList.add("hidden");
  const r = $("result");
  r.classList.remove("hidden");
  r.innerHTML = `
  <div class="result">
    <div style="display:flex;justify-content:space-between"><button class="topbtn" onclick="quitToHome()">← หน้าหลัก</button>
    <button class="topbtn" onclick="retry()">🔄 ทำใหม่</button></div>
    <div class="ring">
      <svg width="190" height="190"><circle cx="95" cy="95" r="80" fill="none" stroke="var(--card2)" stroke-width="14"/>
      <circle cx="95" cy="95" r="80" fill="none" stroke="${pct>=60?"var(--good)":pct>=40?"var(--warn)":"var(--bad)"}" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" id="ringbar"/></svg>
      <div class="num"><b>${pct}%</b><span>${S.correct} / ${n} ข้อ</span></div>
    </div>
    <div class="verdict" style="color:${verdict[1]}">${verdict[0]}</div>
    <div class="rstats">
      <div class="stat"><b>⏱️ ${time}</b><span>เวลาที่ใช้</span></div>
      <div class="stat"><b>🔥 ${S.maxStreak}</b><span>ตอบถูกติดกันสูงสุด</span></div>
      <div class="stat"><b>${wrong.length}</b><span>ข้อที่ผิด/ข้าม</span></div>
    </div>
    ${wrong.length ? `<button class="btn primary" style="max-width:320px;margin:0 auto" onclick="$('rev').classList.toggle('hidden')">📖 ทบทวนข้อที่ผิด (${wrong.length})</button>` : ""}
    <div class="review ${S.mode==="exam"?"":"hidden"}" id="rev">
      ${wrong.map(q=>`<div class="rq">
        <div class="st no">✗ ${q.q}</div>
        <p>คำตอบของคุณ: ${q.picked!==null ? labelOf(q,q.picked)+". "+q.choices[q.picked] : "— ไม่ได้ตอบ"}</p>
        <p style="color:var(--good)">เฉลย: ${labelOf(q,q.answer)}. ${q.choices[q.answer]}</p>
        <div class="ex">💡 ${q.explanation || "ไม่มีคำอธิบายเพิ่มเติม"}</div>
      </div>`).join("")}
    </div>
  </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const bar = $("ringbar"); bar.style.transition = "stroke-dashoffset 1.2s ease";
    bar.style.strokeDashoffset = circ*(1-pct/100);
  }));
  if(pct>=80){ sndWin(); confetti(); } else if(pct>=60){ sndWin(); }
  window.scrollTo(0,0);
}
function retry(){ openSetupFromResult(); }
function openSetupFromResult(){ const id=S.subj; quitToHome(); openSetup(id); }

/* ================= fun bits ================= */
function comboPop(text){
  const el = document.createElement("div");
  el.className = "combo-pop"; el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}
function confetti(){
  const cv = $("confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#7c6cff","#4ecdc4","#ffc94d","#ff5d73","#3ddc84"];
  const ps = Array.from({length:140},()=>({
    x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.5,
    w:6+Math.random()*6, h:8+Math.random()*8,
    vy:2+Math.random()*3, vx:(Math.random()-.5)*2, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.2,
    c:colors[Math.floor(Math.random()*colors.length)]
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if(++frames < 260) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* keyboard shortcuts: 1-5 answer, Enter/space next */
document.addEventListener("keydown", e=>{
  if(!S || $("quiz").classList.contains("hidden")) return;
  if(e.key>="1" && e.key<="5"){
    const pos = +e.key-1, btns = $("q-choices").children;
    if(btns[pos] && !btns[pos].disabled) btns[pos].click();
  } else if(e.key==="Enter" && !$("nextbtn").classList.contains("hidden")){ nextQ(); }
});

renderHome();
</script>
