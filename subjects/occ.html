<script>window.AUDIO_BASE='../audio/';const EXAM_DATA = {"subjects": [{"id": "occ", "icon": "💼", "title": "ความรู้พื้นฐานด้านอาชีพ", "subtitle": "Occupational Fundamentals", "labels": ["ก", "ข", "ค", "ง", "จ"], "questions": [{"n": 1, "q": "หากองค์กรประกาศปรับเปลี่ยน 'พันธกิจ' (Mission) ไปสู่การเป็นผู้นำด้านเทคโนโลยีสีเขียว พนักงานระดับปฏิบัติการควรปรับตัวอย่างไรจึงจะสอดคล้องกับเป้าหมายองค์กรมากที่สุด?", "choices": ["ทำงานตามหน้าที่เดิมให้ดีที่สุดโดยไม่สนใจการเปลี่ยนแปลง", "เสนอตัวขอย้ายแผนกไปทำงานที่เกี่ยวข้องกับสิ่งแวดล้อมทันที", "ศึกษาความรู้เพิ่มเติมเกี่ยวกับเทคโนโลยีสะอาดที่เกี่ยวข้องกับสายงานของตน", "คอยสังเกตการณ์ว่าเพื่อนร่วมงานคนอื่นทำอย่างไรแล้วค่อยทำตาม", "วิพากษ์วิจารณ์พันธกิจใหม่ว่ายากเกินความสามารถของพนักงาน"], "answer": 2, "explanation": "เมื่อพันธกิจองค์กรเปลี่ยน พนักงานที่ดีควรปรับตัวเชิงรุกด้วยการศึกษาเทคโนโลยีสะอาดที่เกี่ยวข้องกับสายงานของตนโดยตรง เป็นการพัฒนาตนเองให้สอดคล้องกับเป้าหมายใหม่ที่ทำได้จริงทันที ต่างจากการเพิกเฉย (ก, ง) หรือต่อต้าน (จ)", "section": ""}, {"n": 2, "q": "ข้อใดอธิบาย 'คุณค่าของการมีทักษะอาชีพ' ในยุคอุตสาหกรรมที่เน้นระบบอัตโนมัติได้ถูกต้องที่สุด?", "choices": ["ทักษะฝีมือแรงงานจะถูกแทนที่ด้วยหุ่นยนต์ทั้งหมดในอนาคตอันใกล้", "ทักษะอาชีพช่วยให้พนักงานสามารถแก้ไขปัญหาซับซ้อนที่ระบบอัตโนมัติไม่สามารถทำได้", "การมีทักษะเพียงอย่างเดียวทำให้พนักงานมั่นคงกว่าพนักงานที่มีความหลากหลายทางทักษะ", "ทักษะอาชีพมีคุณค่าต่อตัวบุคคลเท่านั้น ไม่ส่งผลต่อกำไรขององค์กร", "ทักษะทางช่างมีความสำคัญน้อยกว่าทักษะทางการตลาดในสถานประกอบการ"], "answer": 1, "explanation": "ระบบอัตโนมัติทำงานซ้ำ ๆ ตามโปรแกรมได้ดี แต่การวิเคราะห์และแก้ปัญหาซับซ้อนหน้างานยังต้องอาศัยทักษะ ประสบการณ์ และดุลยพินิจของมนุษย์ นี่คือคุณค่าที่แท้จริงของทักษะอาชีพในยุคอัตโนมัติ", "section": ""}, {"n": 3, "q": "พนักงานที่มีลักษณะ 'Multi-skill' หรือมีทักษะหลากหลาย มีส่วนช่วยเสริมสร้างเป้าหมายองค์กรในด้านความคล่องตัว (Agility) อย่างไร?", "choices": ["สามารถเข้าทำงานแทนที่เพื่อนร่วมงานที่ลางานได้ในหลายตำแหน่ง", "ช่วยลดการจ้างงานพนักงานใหม่ ทำให้องค์กรประหยัดค่าใช้จ่าย", "ทำให้พนักงานคนเดียวต้องทำงานหนักขึ้นเป็น 2 เท่า", "ช่วยให้กระบวนการผลิตไม่สะดุดเมื่อเกิดการปรับเปลี่ยนสายงานหรือเทคโนโลยี", "ทำให้พนักงานมีความมั่นใจสูงจนไม่ต้องปรึกษาหัวหน้างาน"], "answer": 3, "explanation": "ความคล่องตัว (Agility) หมายถึงความสามารถขององค์กรในการปรับเปลี่ยนได้รวดเร็ว พนักงานที่มีทักษะหลากหลายช่วยให้กระบวนการผลิตดำเนินต่อได้ไม่สะดุดเมื่อมีการปรับสายงานหรือเปลี่ยนเทคโนโลยี ซึ่งตรงกับประเด็นของโจทย์มากกว่าการทำงานแทนเพื่อน (ก) ที่เป็นเพียงประโยชน์เฉพาะหน้า", "section": ""}, {"n": 4, "q": "เมื่อองค์กรเผชิญกับภาวะวิกฤตเศรษฐกิจ พนักงานที่มีเจตคติที่ดีต่อภารกิจองค์กรควรปฏิบัติอย่างไร?", "choices": ["รีบมองหางานใหม่ทันทีเพื่อความมั่นคงของตนเอง", "เสนอแนวทางการลดความสูญเปล่า (Waste) ในส่วนที่ตนเองรับผิดชอบ", "เรียกร้องสวัสดิการเพิ่มขึ้นเพื่อชดเชยความเสี่ยงในการทำงาน", "ทำงานตามปกติแต่ไม่รับผิดชอบงานที่นอกเหนือจากหน้าที่", "เก็บรวบรวมข้อมูลภายในเพื่อนำไปเปรียบเทียบกับบริษัทอื่น"], "answer": 1, "explanation": "เจตคติที่ดีต่อภารกิจองค์กรคือการช่วยองค์กรฝ่าวิกฤตในส่วนที่ตนรับผิดชอบ การเสนอแนวทางลดความสูญเปล่า (Waste) เป็นการช่วยลดต้นทุนอย่างสร้างสรรค์และเป็นรูปธรรม", "section": ""}, {"n": 5, "q": "การประยุกต์ใช้ทักษะพื้นฐานด้านการคิดเชิงวิพากษ์ (Critical Thinking) ในงานอาชีพ ก่อให้เกิดผลลัพธ์ใดมากที่สุด?", "choices": ["การทำตามคำสั่งของหัวหน้างานอย่างเคร่งครัดโดยไม่สงสัย", "การตั้งคำถามและหาข้อบกพร่องของเพื่อนร่วมงาน", "การวิเคราะห์สาเหตุของปัญหาที่แท้จริงเพื่อหาทางป้องกันไม่ให้เกิดซ้ำ", "การใช้อารมณ์ตัดสินใจเมื่อเกิดเหตุการณ์คับขัน", "การรอให้ปัญหาเกิดขึ้นก่อนแล้วค่อยหาทางแก้ไข"], "answer": 2, "explanation": "หัวใจของการคิดเชิงวิพากษ์คือการวิเคราะห์หาสาเหตุที่แท้จริงของปัญหา (Root Cause) เพื่อป้องกันไม่ให้เกิดซ้ำ ไม่ใช่การจับผิดผู้อื่น (ข) หรือใช้อารมณ์ตัดสิน (ง)", "section": ""}, {"n": 6, "q": "พนักงานควรทำอย่างไรเมื่อพบว่า 'เป้าหมายส่วนตน' ขัดแย้งกับ 'เป้าหมายองค์กร'?", "choices": ["ลาออกทันทีโดยไม่แจ้งล่วงหน้า", "แอบทำงานส่วนตัวในเวลางานเพื่อให้เป้าหมายส่วนตนบรรลุ", "พยายามหาจุดร่วมที่สามารถพัฒนาทักษะตนเองไปพร้อมกับงานขององค์กร", "พยายามชักชวนเพื่อนร่วมงานให้ต่อต้านเป้าหมายองค์กร", "ละทิ้งเป้าหมายส่วนตนและทำตามองค์กรแบบไม่มีความสุข"], "answer": 2, "explanation": "แนวทางที่สร้างสรรค์ที่สุดคือการหาจุดร่วม (Win-Win) ที่ทำให้ได้พัฒนาทักษะตนเองไปพร้อมกับการทำงานให้องค์กร ทั้งสองเป้าหมายจึงเดินหน้าไปด้วยกันได้อย่างมีความสุข", "section": ""}, {"n": 7, "q": "ในการทำงานอาชีพ 'การสร้างมูลค่าเพิ่ม' (Value Added) ให้กับงานที่ทำ หมายถึงข้อใด?", "choices": ["การขอขึ้นราคาสินค้าหรือบริการโดยไม่พัฒนาคุณภาพ", "การทำงานให้เสร็จเร็วขึ้นแต่คุณภาพลดลงครึ่งหนึ่ง", "การใส่ใจในรายละเอียดและการบริการที่ทำให้ลูกค้าประทับใจเกินความคาดหมาย", "การโฆษณาชวนเชื่อให้สินค้าดูดีเกินความเป็นจริง", "การลดจำนวนพนักงานเพื่อลดต้นทุนการผลิต"], "answer": 2, "explanation": "มูลค่าเพิ่ม (Value Added) คือคุณค่าที่ลูกค้าได้รับเกินความคาดหมาย ซึ่งเกิดจากความใส่ใจในรายละเอียดและคุณภาพการบริการ ไม่ใช่การขึ้นราคาโดยไม่พัฒนา (ก) หรือโฆษณาเกินจริง (ง)", "section": ""}, {"n": 8, "q": "เหตุใดพนักงานระดับปฏิบัติการจึงจำเป็นต้องเข้าใจ 'โครงสร้างองค์กร'?", "choices": ["เพื่อทราบว่าใครเป็นพนักงานที่ได้รับความไว้วางใจจากผู้บริหารสูงสุด", "เพื่อให้ทราบสายการบังคับบัญชาและการส่งต่อข้อมูลที่ถูกต้อง", "เพื่อหลีกเลี่ยงการพบปะกับผู้บริหารระดับสูง", "เพื่อเปรียบเทียบภาระหน้าที่ของตนเองกับแผนกอื่นเพื่อเรียกร้องค่าจ้าง", "เพื่อทราบรายได้ของพนักงานในทุกตำแหน่ง"], "answer": 1, "explanation": "โครงสร้างองค์กรแสดงสายการบังคับบัญชา ทำให้พนักงานรายงาน ประสานงาน และส่งต่อข้อมูลได้ถูกคน ถูกลำดับขั้น งานจึงไม่ตกหล่นและไม่ข้ามสายบังคับบัญชา", "section": ""}, {"n": 9, "q": "หากพนักงานอาชีวศึกษาต้องการมีส่วนร่วมในเป้าหมาย 'นวัตกรรม' ขององค์กร ข้อใดคือจุดเริ่มต้นที่เหมาะสมที่สุด?", "choices": ["รอให้องค์กรซื้อเครื่องจักรที่ทันสมัยที่สุดมาให้ใช้งาน", "แอบรื้อเครื่องจักรของบริษัทเพื่อศึกษาโครงสร้างภายใน", "เสนอแนวทางการปรับปรุงกระบวนการทำงานที่ช่วยลดเวลาหรือเพิ่มความปลอดภัย", "เขียนจดหมายร้องเรียนเรื่องระบบการทำงานที่ล้าสมัย", "ลาศึกษาต่อในสาขาที่ไม่เกี่ยวข้องเพื่อเปลี่ยนสายงาน"], "answer": 2, "explanation": "นวัตกรรมเริ่มต้นได้จากจุดเล็ก ๆ ในงานประจำ การเสนอปรับปรุงกระบวนการทำงาน (ตามแนวคิดไคเซ็น) ที่ช่วยลดเวลาหรือเพิ่มความปลอดภัย คือจุดเริ่มต้นที่พนักงานปฏิบัติการทำได้จริง", "section": ""}, {"n": 10, "q": "ข้อใดเป็นทัศนคติที่แสดงถึงความเข้าใจใน 'คุณค่าของงานอาชีพ' อย่างแท้จริง?", "choices": ["งานอาชีพเป็นเพียงวิธีการหารายได้มาเพื่อใช้จ่าย", "งานอาชีพคือการพิสูจน์ว่าตนเองเก่งกว่าผู้อื่น", "งานอาชีพคือการใช้อำนาจหน้าที่เพื่อให้ผู้อื่นยอมรับ", "งานอาชีพคือการสร้างประโยชน์และขับเคลื่อนเศรษฐกิจของสังคม", "งานอาชีพคือภาระที่ต้องทำให้จบไปในแต่ละวัน"], "answer": 3, "explanation": "คุณค่าที่แท้จริงของงานอาชีพคือการสร้างประโยชน์ให้ผู้อื่นและร่วมขับเคลื่อนเศรษฐกิจของสังคม มุมมองนี้ทำให้เกิดความภาคภูมิใจในวิชาชีพ ต่างจากการมองเป็นเพียงรายได้ (ก) หรือภาระ (จ)", "section": ""}, {"n": 11, "q": "หากพนักงานพบว่ากฎระเบียบด้านความปลอดภัยบางข้อทำให้ทำงานได้ช้าลง พนักงานควรปฏิบัติอย่างไรตามหลักวินัยและจรรยาบรรณ?", "choices": ["ละเว้นการปฏิบัติตามกฎข้อนั้นเพื่อให้งานเสร็จตามกำหนด", "แอบทำผิดกฎเฉพาะตอนที่หัวหน้างานไม่อยู่", "ปฏิบัติตามกฎอย่างเคร่งครัดและรวบรวมข้อมูลเพื่อเสนอแนวทางปรับปรุงกฎให้เหมาะสม", "บอกเพื่อนร่วมงานคนอื่นให้ไม่ต้องทำตามกฎข้อนั้นด้วยกัน", "ประชดด้วยการหยุดทำงานจนกว่ากฎจะถูกแก้ไข"], "answer": 2, "explanation": "หลักวินัยคือต้องปฏิบัติตามกฎที่ยังมีผลบังคับอยู่ก่อนเสมอ หากเห็นว่ากฎควรปรับปรุง ให้รวบรวมข้อมูลและเสนอผ่านช่องทางที่ถูกต้อง ไม่ใช่ละเมิดกฎเอง (ก, ข) ซึ่งอาจนำไปสู่อุบัติเหตุ", "section": ""}, {"n": 12, "q": "การกระทำในข้อใดถือว่าเป็นการ 'ทุจริตต่อหน้าที่' แม้จะไม่ได้ขโมยเงินของบริษัท?", "choices": ["การลากิจเพื่อไปดูแลพ่อแม่ที่เจ็บป่วยตามสิทธิ์ที่มี", "การนำข้อมูลความลับของบริษัทไปขายให้บริษัทคู่แข่ง", "การเสนอความคิดเห็นที่แตกต่างจากผู้บริหารในที่ประชุม", "การขอใช้วัสดุที่เหลือทิ้งแล้วอย่างถูกต้องตามขั้นตอน", "การลืมลงเวลาเข้าทำงานแต่แจ้งหัวหน้าทันทีที่รู้ตัว"], "answer": 1, "explanation": "การนำข้อมูลความลับของบริษัทไปขายให้คู่แข่งคือการใช้ตำแหน่งหน้าที่แสวงหาประโยชน์โดยมิชอบ ถือเป็นการทุจริตต่อหน้าที่ที่สร้างความเสียหายร้ายแรง แม้ไม่ได้ขโมยเงินโดยตรง", "section": ""}, {"n": 13, "q": "สัญลักษณ์ความปลอดภัยประเภท 'เครื่องหมายเตือน' (Warning Sign) มักใช้สีคู่กับรูปร่างใด?", "choices": ["วงกลมสีแดง", "สี่เหลี่ยมสีเขียว", "สามเหลี่ยมสีเหลือง", "วงกลมสีน้ำเงิน", "กากบาทสีแดง"], "answer": 2, "explanation": "ตามมาตรฐานสากล (ISO 3864) เครื่องหมายเตือนใช้รูปสามเหลี่ยมพื้นสีเหลือง ขอบและสัญลักษณ์สีดำ ส่วนวงกลมสีแดงคือเครื่องหมายห้าม วงกลมสีน้ำเงินคือเครื่องหมายบังคับ และสี่เหลี่ยมสีเขียวคือเครื่องหมายแสดงสภาวะปลอดภัย", "section": ""}, {"n": 14, "q": "ข้อใดคือการสร้าง 'วินัยในตนเอง' (Self-Discipline) ที่ส่งผลต่อคุณภาพงานมากที่สุด?", "choices": ["การทำงานเฉพาะเมื่อถูกหัวหน้างานจับตามองเท่านั้น", "การตรวจสอบความถูกต้องของงานทุกขั้นตอนด้วยตนเองอย่างสม่ำเสมอ", "การอาสาทำงานให้คนอื่นเพื่อสร้างภาพลักษณ์ที่ดี", "การเข้างานเช้ากว่ากำหนดแต่กลับก่อนเวลาเสมอ", "การทำงานที่ง่ายก่อนเสมอเพื่อเพิ่มสถิติงานที่ทำเสร็จ"], "answer": 1, "explanation": "วินัยในตนเองคือการทำสิ่งที่ถูกต้องอย่างสม่ำเสมอโดยไม่ต้องมีผู้ควบคุม การตรวจสอบความถูกต้องของงานทุกขั้นตอนด้วยตนเองส่งผลโดยตรงต่อคุณภาพของงานมากที่สุด", "section": ""}, {"n": 15, "q": "พนักงานควรปฏิบัติอย่างไรเมื่อได้รับ 'ของกำนัล' จากลูกค้าที่มีมูลค่าสูงและอาจมีผลต่อการตัดสินใจสั่งซื้อของบริษัท?", "choices": ["รับไว้ทันทีเพราะเป็นสินน้ำใจจากการบริการที่ดี", "รับไว้แต่ขอให้ลูกค้าไม่บอกพนักงานคนอื่น", "ปฏิเสธอย่างสุภาพและแจ้งว่าเป็นนโยบายของบริษัทที่ไม่ให้รับของกำนัล", "รับไว้แล้วนำไปแบ่งให้หัวหน้างานเพื่อไม่ให้ตนเองผิดคนเดียว", "ขอเปลี่ยนเป็นเงินสดเพื่อนำไปบริจาคการกุศล"], "answer": 2, "explanation": "ของกำนัลมูลค่าสูงที่อาจมีผลต่อการตัดสินใจทางธุรกิจเข้าข่ายผลประโยชน์ทับซ้อน (Conflict of Interest) จึงต้องปฏิเสธอย่างสุภาพโดยอ้างอิงนโยบายของบริษัท เพื่อรักษาความซื่อสัตย์และความเป็นธรรม", "section": ""}, {"n": 16, "q": "ระบบ 'Lockout/Tagout' (LOTO) ในโรงงานอุตสาหกรรมมีความสำคัญอย่างไรด้านความปลอดภัย?", "choices": ["เพื่อป้องกันขโมยเข้ามาใช้เครื่องจักรในยามวิกฤต", "เพื่อช่วยลดค่าไฟฟ้าจากการเปิดเครื่องจักรทิ้งไว้", "เพื่อป้องกันไม่ให้มีการเปิดเครื่องจักรขณะพนักงานกำลังซ่อมบำรุง", "เพื่อระบุชื่อพนักงานที่ทำงานได้ดีที่สุดในกะนั้น", "เพื่อใช้ในการเช็คชื่อพนักงานเข้าทำงานรายวัน"], "answer": 2, "explanation": "ระบบ Lockout/Tagout คือการล็อกและแขวนป้ายที่แหล่งจ่ายพลังงานของเครื่องจักร เพื่อป้องกันไม่ให้ผู้ใดเปิดเครื่องโดยไม่ตั้งใจขณะมีพนักงานกำลังซ่อมบำรุง ซึ่งอาจเกิดอันตรายถึงชีวิต", "section": ""}, {"n": 17, "q": "พนักงานที่แอบใช้คอมพิวเตอร์และอินเทอร์เน็ตของบริษัทในการ 'ขุดเหรียญดิจิทัล' (Crypto Mining) ถือว่าผิดกฎระเบียบในข้อใดร้ายแรงที่สุด?", "choices": ["ผิดกฎเรื่องการประหยัดพลังงาน", "ผิดกฎเรื่องการรักษาความสะอาดโต๊ะทำงาน", "ผิดวินัยร้ายแรงเรื่องการใช้ทรัพย์สินบริษัทเพื่อประโยชน์ส่วนตัว", "ผิดกฎระเบียบการแต่งกาย", "ผิดมารยาทในการใช้เสียงในที่ทำงาน"], "answer": 2, "explanation": "การแอบใช้คอมพิวเตอร์ ไฟฟ้า และอินเทอร์เน็ตของบริษัทขุดเหรียญดิจิทัลเป็นการนำทรัพย์สินขององค์กรไปแสวงหาประโยชน์ส่วนตัวโดยมิชอบ ถือเป็นความผิดวินัยร้ายแรงที่สุดในบรรดาตัวเลือกทั้งหมด", "section": ""}, {"n": 18, "q": "พนักงานที่มี 'วินัยด้านความปลอดภัย' ขั้นสูง จะมีพฤติกรรมอย่างไร?", "choices": ["สวมหมวกนิรภัยเฉพาะตอนเดินผ่านป้ายเตือนเท่านั้น", "ไม่ใช้ทางหนีไฟเพราะกลัวจะทำให้บันไดสึกหรอ", "รายงานความเสี่ยงที่อาจเกิดขึ้นแม้จะยังไม่เกิดอุบัติเหตุ (Near Miss)", "พยายามทำงานคนเดียวในที่อับอากาศเพื่อพิสูจน์ความกล้า", "เชื่อมั่นในประสบการณ์จนไม่ยอมอ่านคู่มือความปลอดภัย"], "answer": 2, "explanation": "วัฒนธรรมความปลอดภัยขั้นสูงเน้นการป้องกันเชิงรุก การรายงานเหตุการณ์เกือบเกิดอุบัติเหตุ (Near Miss) ช่วยให้องค์กรกำจัดความเสี่ยงได้ก่อนที่จะกลายเป็นอุบัติเหตุจริง", "section": ""}, {"n": 19, "q": "ความซื่อสัตย์สุจริตต่อ 'ข้อมูล' (Data Integrity) ของช่างตรวจสภาพรถยนต์คือข้อใด?", "choices": ["การจดบันทึกเฉพาะจุดที่ซ่อมเสร็จแล้วเท่านั้น", "การแก้ไขรายงานการตรวจสภาพเพื่อให้รถผ่านเกณฑ์มาตรฐาน", "การรายงานค่าที่วัดได้ตามจริง แม้ค่าจะออกมาไม่ดีก็ตาม", "การใช้ลายมือที่อ่านยากเพื่อปกปิดความผิดพลาด", "การทำรายงานให้ดูดีที่สุดเพื่อให้ลูกค้าประทับใจ"], "answer": 2, "explanation": "ความซื่อสัตย์ต่อข้อมูล (Data Integrity) คือการบันทึกและรายงานค่าที่วัดได้ตามความเป็นจริง แม้ผลจะออกมาไม่ดี เพราะการแก้ไขรายงานให้รถผ่านเกณฑ์ (ข) อาจนำไปสู่อันตรายร้ายแรงต่อผู้ใช้รถและผู้ร่วมทาง", "section": ""}, {"n": 20, "q": "เหตุใดกฎหมายแรงงานจึงห้ามลูกจ้างทำงานในที่อับอากาศเกินเวลาที่กำหนด?", "choices": ["เพื่อให้นายจ้างประหยัดค่าจ้างล่วงเวลา", "เพื่อป้องกันความเหนื่อยล้าที่อาจนำไปสู่การสะสมของสารพิษในร่างกาย", "เพื่อให้นักศึกษาฝึกงานได้มีโอกาสทำแทน", "เพื่อป้องกันเครื่องจักรที่ทำงานในที่อับอากาศร้อนเกินไป", "เพื่อลดความแออัดในพื้นที่ทำงาน"], "answer": 1, "explanation": "ที่อับอากาศมีการระบายอากาศจำกัด อาจมีออกซิเจนไม่เพียงพอและมีก๊าซหรือสารพิษสะสม การทำงานต่อเนื่องนานเกินไปทำให้ร่างกายอ่อนล้าและรับสารพิษสะสมจนเป็นอันตราย กฎหมายจึงจำกัดเวลาทำงานเพื่อคุ้มครองสุขภาพและชีวิตของลูกจ้าง", "section": ""}, {"n": 21, "q": "พนักงานที่มี 'เจตคติเชิงบวก' เมื่อได้รับคำติชม (Feedback) ที่รุนแรงจากหัวหน้างาน ควรตอบสนองอย่างไร?", "choices": ["เก็บความโกรธไว้แล้วไปนินทาหัวหน้าในภายหลัง", "เถียงกลับทันทีเพื่อปกป้องศักดิ์ศรีของตนเอง", "แยกแยะอารมณ์ออกจากเนื้อหา และนำข้อบกพร่องมาปรับปรุงงาน", "ประชดด้วยการหยุดทำงานที่หัวหน้าติชมทันที", "ร้องไห้และขอลาพักร้อนระยะยาวเพื่อทำใจ"], "answer": 2, "explanation": "เจตคติเชิงบวกคือการแยกอารมณ์ของผู้พูดออกจากเนื้อหาสาระของคำติชม แล้วเลือกนำประเด็นที่เป็นประโยชน์มาปรับปรุงงานของตนเอง ซึ่งทำให้เกิดการพัฒนาอย่างแท้จริง", "section": ""}, {"n": 22, "q": "บทบาทหน้าที่ความรับผิดชอบของพนักงานอาชีวศึกษา 'ระดับฝีมือ' ที่สำคัญที่สุดคือข้อใด?", "choices": ["การสั่งการพนักงานคนอื่นให้ทำงานแทนตนเอง", "การวางแผนนโยบายระยะ 10 ปีของบริษัท", "การปฏิบัติงานให้ถูกต้องตามมาตรฐานฝีมือและปลอดภัย", "การดูแลเรื่องการตลาดและการหาลูกค้าใหม่", "การตรวจสอบประวัติอาชญากรรมของเพื่อนร่วมงาน"], "answer": 2, "explanation": "บทบาทหลักของพนักงานระดับฝีมือคือการปฏิบัติงานให้ถูกต้องตามมาตรฐานฝีมือและปลอดภัย ส่วนการวางแผนนโยบายระยะยาว (ข) เป็นบทบาทของผู้บริหารระดับสูง", "section": ""}, {"n": 23, "q": "พฤติกรรมใดแสดงถึง 'ความรับผิดชอบ' ต่อผลรวมของทีม (Team Responsibility)?", "choices": ["ทำงานส่วนของตนให้เสร็จแล้วนั่งดูเพื่อนทำงานหนัก", "ช่วยเหลือและคอยประสานงานกับเพื่อนร่วมงานเพื่อให้งานสำเร็จตามกำหนด", "แย่งงานของคนอื่นมาทำเพื่อเอาความดีความชอบคนเดียว", "โทษเพื่อนร่วมงานทันทีเมื่อมีข้อผิดพลาดเกิดขึ้นในโปรเจกต์", "การไม่แสดงความคิดเห็นใดๆ เพื่อไม่ให้เกิดความขัดแย้ง"], "answer": 1, "explanation": "ความรับผิดชอบต่อทีมวัดกันที่ผลสำเร็จรวมของงาน การช่วยเหลือและประสานงานกับเพื่อนร่วมงานเพื่อให้งานทั้งหมดสำเร็จตามกำหนดจึงเป็นพฤติกรรมของผู้ที่รับผิดชอบต่อทีมอย่างแท้จริง", "section": ""}, {"n": 24, "q": "การมี 'เจตคติที่ดีในการเรียนรู้งานใหม่' (Lifelong Learning) สำคัญอย่างไรในโลกยุคปัจจุบัน?", "choices": ["ช่วยให้บริษัทไม่ต้องจ้างผู้เชี่ยวชาญจากภายนอก", "ทำให้พนักงานมีความเสี่ยงในการตกงานน้อยลงและปรับตัวได้เร็ว", "ช่วยเพิ่มชั่วโมงการทำงานให้มากขึ้นเพื่อโอที", "ทำให้พนักงานสามารถกดดันเรียกเงินเดือนได้ทุกเดือน", "ช่วยลดเวลาพักกลางวันลงเพื่อมาศึกษาหาความรู้"], "answer": 1, "explanation": "ในยุคที่เทคโนโลยีเปลี่ยนแปลงรวดเร็ว ผู้ที่เรียนรู้ตลอดชีวิตจะมีทักษะทันสมัยและปรับตัวได้เร็ว ความเสี่ยงในการตกงานจึงลดลงอย่างมีนัยสำคัญ", "section": ""}, {"n": 25, "q": "เมื่อเกิดความขัดแย้งด้านความคิดเห็นในการทำงานร่วมกัน พนักงานที่มี 'วุฒิภาวะ' ควรทำอย่างไร?", "choices": ["ยึดถือความคิดเห็นของตนเองเป็นหลักเพราะมั่นใจในประสบการณ์", "นำความคิดเห็นที่ขัดแย้งไปโพสต์ลงสื่อสังคมออนไลน์เพื่อหาพวก", "ใช้วิธีการลงคะแนนเสียงโดยไม่ฟังเหตุผลของฝ่ายข้างน้อย", "เปิดใจรับฟังข้อมูลของอีกฝ่ายและหารือเพื่อหาทางออกที่เกิดประโยชน์สูงสุดต่องาน", "ยอมตามอีกฝ่ายทุกอย่างเพื่อตัดรำคาญ"], "answer": 3, "explanation": "ผู้มีวุฒิภาวะจะยึดประโยชน์ของงานเป็นตัวตั้ง เปิดใจรับฟังข้อมูลและเหตุผลของอีกฝ่าย แล้วหารือหาข้อสรุปที่ดีที่สุดต่องาน ไม่ใช้อารมณ์ ไม่ยึดตัวเองเป็นศูนย์กลาง (ก) และไม่ยอมตามโดยไม่มีเหตุผล (จ)", "section": ""}, {"n": 26, "q": "พฤติกรรมใดที่แสดงถึงการมี 'จิตสาธารณะ' (Public Mind) ในที่ทำงาน?", "choices": ["การปิดไฟและเครื่องปรับอากาศในห้องประชุมเมื่อไม่มีผู้ใช้งาน", "การอาสาไปซื้อของใช้ส่วนตัวให้หัวหน้างาน", "การนำอาหารของบริษัทมากินคนเดียวให้หมด", "การจองโต๊ะทำงานที่ดีที่สุดไว้ให้เพื่อนสนิท", "การแอบถ่ายคลิปเพื่อนทำงานผิดพลาดเพื่อความสนุก"], "answer": 0, "explanation": "จิตสาธารณะคือการคำนึงถึงประโยชน์ส่วนรวมโดยไม่ต้องมีใครร้องขอ การปิดไฟและเครื่องปรับอากาศเมื่อไม่มีผู้ใช้งานช่วยประหยัดทรัพยากรส่วนรวมขององค์กร", "section": ""}, {"n": 27, "q": "ความรับผิดชอบด้าน 'ความมั่นคงทางข้อมูล' (Cybersecurity) ของพนักงานระดับปฏิบัติการคือข้อใด?", "choices": ["การเขียนรหัสผ่านติดไว้บนหน้าจอคอมพิวเตอร์เพื่อกันลืม", "การไม่อนุญาตให้ผู้อื่นใช้ยูสเซอร์เนมของตนเองในการเข้าถึงระบบ", "การลงโปรแกรมเกมหรือซอฟต์แวร์เถื่อนในคอมพิวเตอร์บริษัท", "การแชร์รหัสผ่านอีเมลบริษัทให้คนในครอบครัวช่วยตอบงาน", "การปิดระบบแจ้งเตือนไวรัสเพราะรำคาญหน้าจอเด้ง"], "answer": 1, "explanation": "บัญชีผู้ใช้ (Username) เป็นความรับผิดชอบเฉพาะบุคคล การไม่อนุญาตให้ผู้อื่นใช้บัญชีของตนช่วยป้องกันการเข้าถึงข้อมูลโดยมิชอบ และทำให้ระบุตัวผู้กระทำได้ถูกต้องเมื่อเกิดปัญหา", "section": ""}, {"n": 28, "q": "ข้อใดแสดงถึงเจตคติที่ดีต่อ 'การรักษาภาพลักษณ์' ขององค์กรผ่านงานบริการลูกค้า?", "choices": ["การตอบคำถามลูกค้าแบบขอไปทีเพื่อให้จบงานไวๆ", "การกล่าวโทษแผนกอื่นเมื่อลูกค้ามาร้องเรียนเรื่องความล่าช้า", "การแต่งกายที่สุภาพและใช้วาจาที่ให้เกียรติลูกค้าในทุกสถานการณ์", "การขอทิปจากลูกค้าหลังการให้บริการเสร็จสิ้น", "การเลือกให้บริการเฉพาะลูกค้าที่แต่งตัวดูมีฐานะ"], "answer": 2, "explanation": "พนักงานทุกคนคือหน้าตาขององค์กร การแต่งกายสุภาพและใช้วาจาให้เกียรติลูกค้าในทุกสถานการณ์สร้างความประทับใจและรักษาภาพลักษณ์ที่ดีขององค์กรอย่างยั่งยืน", "section": ""}, {"n": 29, "q": "หากพนักงานพบว่าหัวหน้างานสั่งให้ทำในสิ่งที่ 'ผิดต่อความปลอดภัย' พนักงานควรทำอย่างไร?", "choices": ["ทำตามทันทีเพราะหัวหน้าเป็นคนรับผิดชอบ", "ลาออกโดยไม่คุยกับใครเพื่อหนีปัญหา", "ทักท้วงด้วยเหตุผลและข้อมูลความปลอดภัย พร้อมเสนอทางเลือกที่ปลอดภัยกว่า", "แกล้งทำเป็นไม่ได้ยินคำสั่งแล้วเดินหนีไป", "รวบรวมหลักฐานไปแจ้งตำรวจทันทีโดยไม่แจ้งภายในก่อน"], "answer": 2, "explanation": "ความปลอดภัยต้องมาก่อนเสมอ แต่วิธีที่ถูกต้องคือทักท้วงอย่างสร้างสรรค์ด้วยเหตุผลและข้อมูลความปลอดภัย พร้อมเสนอทางเลือกที่ปลอดภัยกว่า ไม่ใช่ทำตามทั้งที่รู้ว่าเสี่ยง (ก) หรือหลีกหนีปัญหา (ข, ง)", "section": ""}, {"n": 30, "q": "การมีเจตคติแบบ 'Growth Mindset' ส่งผลดีต่ออาชีพช่างอย่างไร?", "choices": ["เชื่อว่าทักษะที่มีอยู่เดิมดีที่สุดแล้วไม่ต้องเปลี่ยน", "มองว่าความผิดพลาดคือโอกาสในการเรียนรู้และพัฒนาฝีมือ", "เชื่อว่าพรสวรรค์สำคัญกว่าการฝึกฝน", "พยายามทำงานให้ยากเข้าไว้เพื่อให้ผู้อื่นทำตามไม่ได้", "มองว่าการเข้าอบรมเป็นเรื่องเสียเวลาทำงาน"], "answer": 1, "explanation": "Growth Mindset คือความเชื่อว่าความสามารถพัฒนาได้ด้วยความพยายามและการฝึกฝน ผู้มีแนวคิดนี้จึงมองความผิดพลาดเป็นโอกาสเรียนรู้เพื่อพัฒนาฝีมือ ไม่ใช่ความล้มเหลวถาวร", "section": ""}, {"n": 31, "q": "พฤติกรรมในข้อใดแสดงถึงความรับผิดชอบต่อ 'สิ่งแวดล้อม' ในกระบวนการผลิตงานช่างได้ดีที่สุด?", "choices": ["การล้างทำความสะอาดเครื่องมือด้วยน้ำปริมาณมากเพื่อให้สะอาดที่สุด", "การเผาทำลายขยะที่เป็นเศษพลาสติกหลังเลิกงาน", "การนำเศษวัสดุที่เหลือจากการทำงานมาประยุกต์ใช้ใหม่หรือคัดแยกอย่างถูกต้อง", "การทิ้งแบตเตอรี่เก่าปนกับขยะทั่วไปในถังขยะชุมชน", "การใช้น้ำยาทำความสะอาดที่มีฤทธิ์กัดกร่อนสูงเพื่อความรวดเร็ว"], "answer": 2, "explanation": "ตามหลัก 3R (Reduce–Reuse–Recycle) การนำเศษวัสดุมาประยุกต์ใช้ใหม่และคัดแยกขยะอย่างถูกต้องช่วยลดขยะและลดการใช้ทรัพยากรใหม่ ต่างจากการเผา (ข) หรือทิ้งแบตเตอรี่ปนขยะทั่วไป (ง) ที่สร้างมลพิษโดยตรง", "section": ""}, {"n": 32, "q": "การเสริมสร้างภาพลักษณ์องค์กรผ่าน 'สื่อสังคมออนไลน์' ของพนักงาน ข้อใดคือแนวทางที่เหมาะสม?", "choices": ["การโพสต์บ่นเรื่องเงินเดือนและหัวหน้างานในพื้นที่สาธารณะ", "การแชร์ภาพผลงานที่ตนเองทำสำเร็จด้วยความภูมิใจ (โดยไม่เปิดเผยความลับบริษัท)", "การโพสต์ภาพแอบหลับในที่ทำงานเพื่อความตลกขบขันกับเพื่อน", "การแชร์ข้อมูลภายในที่ยังไม่ได้ประกาศอย่างเป็นทางการเพื่ออวดว่ารู้ก่อน", "การนำสินค้าของบริษัทมาโพสต์ขายตัดราคาแข่งกับตัวแทนจำหน่าย"], "answer": 1, "explanation": "การแชร์ผลงานที่ทำสำเร็จด้วยความภูมิใจโดยไม่เปิดเผยความลับของบริษัท เป็นการสื่อสารเชิงบวกที่ช่วยเสริมภาพลักษณ์ที่ดีให้องค์กรผ่านสื่อสังคมออนไลน์", "section": ""}, {"n": 33, "q": "เหตุใดองค์กรจึงควรส่งเสริมให้พนักงานเข้าไปมีส่วนร่วมกับ 'กิจกรรมจิตอาสา' ในชุมชนโดยรอบ?", "choices": ["เพื่อให้นายจ้างไม่ต้องจ่ายเงินค่าจ้างเต็มวันในวันที่มีกิจกรรม", "เพื่อสร้างความสัมพันธ์ที่ดีและความไว้วางใจระหว่างองค์กรกับชุมชน", "เพื่อหาพนักงานใหม่ราคาถูกจากคนในชุมชน", "เพื่อเป็นการลงโทษพนักงานที่ทำผลงานไม่ถึงเป้า", "เพื่อสร้างความรำคาญใจให้คู่แข่งที่ไม่มีกิจกรรมดังกล่าว"], "answer": 1, "explanation": "กิจกรรมจิตอาสาเป็นส่วนหนึ่งของความรับผิดชอบต่อสังคม (CSR) ช่วยสร้างความสัมพันธ์และความไว้วางใจระหว่างองค์กรกับชุมชน ทำให้องค์กรอยู่ร่วมกับชุมชนได้อย่างยั่งยืน", "section": ""}, {"n": 34, "q": "หากโรงงานตั้งอยู่ใกล้เขตชุมชน พนักงานควรแสดงความรับผิดชอบอย่างไรด้านมลพิษทางเสียง?", "choices": ["เปิดเครื่องจักรทำงานเฉพาะช่วงกลางคืนเพราะคนหลับแล้วไม่เห็น", "เปิดเพลงให้ดังกว่าเสียงเครื่องจักรเพื่อกลบเสียง", "ตรวจสอบและบำรุงรักษาเครื่องจักรไม่ให้มีเสียงดังผิดปกติและติดตั้งอุปกรณ์ลดเสียง", "บอกให้คนในชุมชนย้ายบ้านหนีไปถ้าไม่ชอบเสียงดัง", "ทำงานให้เร็วที่สุดโดยไม่สนใจระดับเสียงเพื่อให้เสียงดังแค่ช่วงเวลาสั้นๆ"], "answer": 2, "explanation": "การแก้ปัญหาที่ต้นเหตุคือการตรวจสอบบำรุงรักษาเครื่องจักรไม่ให้เกิดเสียงดังผิดปกติ และติดตั้งอุปกรณ์ลดเสียง เป็นความรับผิดชอบต่อชุมชนที่ปฏิบัติได้จริงและยั่งยืน", "section": ""}, {"n": 35, "q": "ข้อใดแสดงถึงการเสริมสร้างภาพลักษณ์ขององค์กรด้าน 'ความโปร่งใส'?", "choices": ["การจัดจ้างบริษัทของญาติพนักงานมาทำงานโดยไม่ต้องผ่านการประมูล", "การจัดทำรายงานผลการดำเนินงานที่ระบุข้อมูลกำไรและกิจกรรมเพื่อสังคมตามจริง", "การเก็บข้อมูลข้อร้องเรียนของลูกค้าไว้ไม่ให้ใครเห็น", "การใช้งบประมาณโฆษณาจำนวนมากเพื่อปกปิดข้อผิดพลาดของสินค้า", "การจัดงานเลี้ยงที่หรูหราที่สุดเพื่อให้คนภายนอกคิดว่าบริษัทมั่นคง"], "answer": 1, "explanation": "ความโปร่งใสคือการเปิดเผยข้อมูลตามความเป็นจริงและตรวจสอบได้ การจัดทำรายงานผลการดำเนินงานที่ระบุข้อมูลตามจริงจึงสะท้อนความโปร่งใส ต่างจากการปกปิดข้อร้องเรียน (ค) หรือสร้างภาพ (ง, จ)", "section": ""}, {"n": 36, "q": "พนักงานสามารถมีส่วนร่วมในการ 'ประหยัดทรัพยากรส่วนรวม' ขององค์กรได้อย่างไร?", "choices": ["การนำทรัพยากรของบริษัทไปใช้ที่บ้านเพื่อลดขยะในบริษัท", "การพิมพ์เอกสารด้วยกระดาษที่ใช้แล้วหนึ่งหน้า (Re-use) ในงานร่างเบื้องต้น", "การใช้เครื่องปรับอากาศอุณหภูมิ 18 องศาเพื่อให้พนักงานตื่นตัวตลอดเวลา", "การไม่เปิดไฟในจุดที่ทำงานที่มืดเกินไปเพื่อช่วยบริษัทประหยัดไฟ", "การทิ้งเครื่องมือที่เก่าแล้วเพื่อจะได้ขอเบิกเครื่องมือใหม่ที่ทำงานได้เร็วกว่า"], "answer": 1, "explanation": "การนำกระดาษที่ใช้แล้วหน้าเดียวกลับมาใช้ในงานร่าง (Reuse) ประหยัดทรัพยากรได้จริงโดยไม่กระทบคุณภาพงาน ส่วนการเปิดแอร์ 18 องศา (ค) สิ้นเปลืองพลังงาน และการไม่เปิดไฟในจุดที่มืด (ง) เสี่ยงต่ออุบัติเหตุ", "section": ""}, {"n": 37, "q": "ภาพลักษณ์ที่ดีขององค์กรต่อ 'สิ่งแวดล้อม' มีผลต่อการตัดสินใจของผู้บริโภคยุคใหม่อย่างไร?", "choices": ["ผู้บริโภคส่วนใหญ่มองว่าเป็นเรื่องไกลตัวและสนใจแค่ราคา", "ผู้บริโภคจะยอมจ่ายแพงกว่าเพื่อสนับสนุนองค์กรที่รับผิดชอบต่อโลก", "ผู้บริโภคจะระแวงว่าองค์กรที่ทำกิจกรรมสิ่งแวดล้อมมีสินค้าคุณภาพต่ำ", "ผู้บริโภคจะมองว่าเป็นภาพลวงตาและเลิกอุดหนุนสินค้าทันที", "ไม่มีผลต่อการตัดสินใจใดๆ เลย"], "answer": 1, "explanation": "ผู้บริโภคยุคใหม่ให้ความสำคัญกับสิ่งแวดล้อม และจำนวนมากยินดีจ่ายแพงกว่าเพื่อสนับสนุนสินค้าจากองค์กรที่รับผิดชอบต่อโลก ภาพลักษณ์สีเขียวจึงเป็นข้อได้เปรียบในการแข่งขัน", "section": ""}, {"n": 38, "q": "พฤติกรรมใดของพนักงานอาชีวศึกษาถือเป็น 'ทูตวัฒนธรรม' ที่ดีต่อสังคม?", "choices": ["การขี่รถจักรยานยนต์ดัดแปลงเสียงดังในชุดฟอร์มวิทยาลัย", "การเข้าไปช่วยเหลือคนรถเสียบนท้องถนนด้วยความรู้ทางช่างอย่างสุภาพ", "การชักชวนเพื่อนสถาบันอื่นมาทะเลาะวิวาทเพื่ออวดพลัง", "การนำชุดทำงานไปใส่ในสถานที่ที่ไม่เหมาะสม", "การเดินถือเครื่องมือช่างไปมาในที่สาธารณะเพื่อให้คนเกรงขาม"], "answer": 1, "explanation": "การใช้ความรู้ทางช่างเข้าช่วยเหลือผู้อื่นด้วยความสุภาพ เป็นการแสดงคุณค่าของวิชาชีพต่อสาธารณะ สะท้อนภาพลักษณ์ที่ดีของชาวอาชีวศึกษาต่อสังคม", "section": ""}, {"n": 39, "q": "การจัดการ 'มลพิษทางอากาศ' ในวิชาชีพช่างพ่นสีรถยนต์ที่รับผิดชอบต่อสังคมคือข้อใด?", "choices": ["พ่นสีกลางแจ้งเพื่อให้ลมพัดกลิ่นเจือจางหายไปไวๆ", "พ่นสีเฉพาะตอนที่ฝนตกเพื่อให้น้ำฝนช่วยชะล้างกลิ่น", "ติดตั้งห้องพ่นสีมาตรฐานที่มีระบบกรองฝุ่นและละอองสารเคมีก่อนปล่อยสู่ภายนอก", "ให้พนักงานกลั้นหายใจขณะพ่นสีเพื่อลดปริมาณการสูดดม", "บอกให้พนักงานพ่นสีให้หนาขึ้นจะได้ไม่ต้องพ่นหลายรอบลดจำนวนครั้งของกลิ่น"], "answer": 2, "explanation": "การติดตั้งห้องพ่นสีมาตรฐานที่มีระบบกรองฝุ่นและละอองสารเคมีก่อนปล่อยสู่ภายนอก คือการควบคุมมลพิษที่แหล่งกำเนิด ซึ่งถูกต้องตามหลักวิศวกรรมความปลอดภัยและกฎหมายสิ่งแวดล้อม", "section": ""}, {"n": 40, "q": "ความยั่งยืน (Sustainability) ในงานอาชีพเกิดขึ้นจากปัจจัยใดร่วมกัน?", "choices": ["กำไรสูงสุด + การจ่ายเงินเดือนพนักงานน้อยที่สุด", "กำไรของธุรกิจ + ความผาสุกของพนักงานและชุมชน + การรักษาสิ่งแวดล้อม", "เทคโนโลยีที่ทันสมัยที่สุด + การจ้างงานที่น้อยที่สุด", "การโฆษณาที่ยอดเยี่ยม + การผลิตสินค้าจำนวนมหาศาล", "ความโด่งดังของเจ้าของบริษัท + ยอดไลก์ในเพจเฟซบุ๊ก"], "answer": 1, "explanation": "ความยั่งยืนตั้งอยู่บนหลัก 3 เสา (Triple Bottom Line) ได้แก่ เศรษฐกิจ (กำไรของธุรกิจ) สังคม (ความผาสุกของพนักงานและชุมชน) และสิ่งแวดล้อม ต้องดำเนินไปอย่างสมดุลทั้งสามด้านจึงจะยั่งยืนอย่างแท้จริง", "section": ""}, {"n": 41, "q": "โรงงานผลิตชิ้นส่วนยานยนต์ตั้งเป้าหมายลดของเสียจากการผลิตลงร้อยละ 50 ภายในหนึ่งปี พนักงานฝ่ายผลิตควรทำอย่างไรจึงสนับสนุนเป้าหมายนี้ได้อย่างเป็นรูปธรรมที่สุด?", "choices": ["เร่งผลิตชิ้นงานให้ได้จำนวนมากขึ้นเพื่อชดเชยของเสียที่เกิดขึ้น", "รอให้ฝ่ายบริหารออกมาตรการโดยละเอียดก่อนแล้วจึงค่อยปฏิบัติตาม", "บันทึกและวิเคราะห์สาเหตุของเสียในจุดงานของตน แล้วเสนอแนวทางแก้ไขต่อหัวหน้างาน", "คัดแยกชิ้นงานเสียออกไปทิ้งให้เร็วที่สุดเพื่อไม่ให้ปะปนกับงานดี", "ตรวจงานของเพื่อนร่วมงานแทนงานของตนเอง เพราะของเสียมักเกิดจากผู้อื่น"], "answer": 2, "explanation": "การวิเคราะห์สาเหตุของเสียที่หน้างานของตนเองและเสนอทางแก้คือการมีส่วนร่วมขับเคลื่อนเป้าหมายโดยตรง ส่วนการเร่งผลิตชดเชยยิ่งเพิ่มของเสีย และการคัดแยกทิ้งเป็นการแก้ปลายเหตุที่ไม่ได้ลดของเสียเลย", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 42, "q": "ช่างซ่อมรถยนต์ในอู่แห่งหนึ่งพบว่ารถยนต์ไฟฟ้าเริ่มเข้ามาใช้บริการมากขึ้น แต่ตนถนัดเฉพาะเครื่องยนต์สันดาป การตัดสินใจใดสะท้อนการเห็นคุณค่าของทักษะอาชีพและการประยุกต์ใช้ได้ดีที่สุด?", "choices": ["เข้ารับการอบรมระบบไฟฟ้าแรงดันสูง แล้วนำพื้นฐานงานช่างเดิมมาต่อยอดกับงานซ่อมรถไฟฟ้า", "ปฏิเสธการรับซ่อมรถไฟฟ้าทุกคันเพื่อป้องกันความผิดพลาดจากความไม่ชำนาญ", "ทดลองซ่อมรถไฟฟ้าด้วยวิธีเดียวกับเครื่องยนต์สันดาป เพราะหลักการช่างย่อมเหมือนกัน", "ขอให้เจ้าของอู่จ้างช่างใหม่มาทำแทน โดยตนทำเฉพาะงานเดิมต่อไป", "ย้ายไปทำงานอู่อื่นที่ยังมีแต่รถเครื่องยนต์สันดาปเข้ารับบริการ"], "answer": 0, "explanation": "การอบรมเพิ่มเติมแล้วต่อยอดจากพื้นฐานเดิมคือการประยุกต์ทักษะให้ทันการเปลี่ยนแปลงของอาชีพ ส่วนการซ่อมรถไฟฟ้าด้วยวิธีเดิมเป็นความเข้าใจผิดที่อันตรายถึงชีวิต และการหลบเลี่ยงงานใหม่ทำให้คุณค่าทางอาชีพของตนลดลง", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 43, "q": "หากพนักงานต้องการเชื่อมโยงงานประจำวันของตนให้สอดคล้องกับพันธกิจองค์กร ควรเรียงลำดับขั้นตอนอย่างไรจึงเหมาะสมที่สุด ก. ศึกษาพันธกิจและเป้าหมายองค์กร ข. วิเคราะห์ว่างานในหน้าที่ของตนส่งผลต่อเป้าหมายข้อใด ค. กำหนดเป้าหมายย่อยของงานตนเอง ง. ลงมือปฏิบัติและติดตามผล", "choices": ["ข → ก → ค → ง", "ก → ค → ข → ง", "ค → ก → ข → ง", "ก → ข → ง → ค", "ก → ข → ค → ง"], "answer": 4, "explanation": "ต้องเริ่มจากเข้าใจพันธกิจก่อน จึงวิเคราะห์ความเชื่อมโยงกับหน้าที่ตน แล้วแปลงเป็นเป้าหมายย่อยก่อนลงมือและติดตามผล การตั้งเป้าหมายย่อยก่อนวิเคราะห์ความเชื่อมโยง (ตัวเลือกอื่น) จะได้เป้าหมายที่ไม่ตอบโจทย์องค์กร", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 44, "q": "ร้านจำหน่ายเครื่องใช้ไฟฟ้าประกาศเป้าหมายใหม่ว่าจะสร้างรายได้จากบริการหลังการขายให้มากขึ้น พนักงานขายควรปรับวิธีทำงานอย่างไรจึงสอดคล้องกับเป้าหมายนี้มากที่สุด?", "choices": ["ลดราคาสินค้าให้มากที่สุดเพื่อดึงลูกค้าเข้าร้านให้มากขึ้น", "อธิบายแพ็กเกจตรวจเช็กและการรับประกันเพิ่มเติมให้ลูกค้าเห็นประโยชน์ทุกครั้งที่ปิดการขาย", "เร่งปิดการขายให้เร็วขึ้นเพื่อให้รับลูกค้าได้จำนวนมากขึ้นต่อวัน", "โอนลูกค้าที่มีปัญหาการใช้งานไปให้ฝ่ายช่างทันทีโดยไม่ต้องสอบถามรายละเอียด", "เก็บข้อมูลส่วนตัวลูกค้าไว้ให้มากที่สุดแม้ลูกค้าจะไม่ยินยอม"], "answer": 1, "explanation": "การนำเสนอบริการหลังการขายอย่างเป็นระบบทุกครั้งคือการแปลงเป้าหมายองค์กรสู่การปฏิบัติจริงในหน้าที่ของตน ส่วนการลดราคาหรือเร่งปิดการขายมุ่งยอดขายสินค้าซึ่งไม่ตรงกับเป้าหมายด้านบริการ และการเก็บข้อมูลโดยไม่ยินยอมผิดหลักจริยธรรม", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 45, "q": "หากพนักงานส่วนใหญ่ในองค์กรทำงานโดยไม่รู้และไม่สนใจพันธกิจขององค์กร ผลกระทบระยะยาวที่น่าจะเกิดขึ้นมากที่สุดคือข้อใด?", "choices": ["องค์กรจะประหยัดงบประมาณอบรมเพราะพนักงานสนใจแต่งานตรงหน้า", "พนักงานจะทำงานเร็วขึ้นเพราะไม่ต้องเสียเวลากับเรื่องนโยบาย", "องค์กรจะได้เปรียบคู่แข่งเพราะพนักงานมีอิสระในการตัดสินใจเต็มที่", "ทิศทางการทำงานของแต่ละฝ่ายจะขัดแย้งกัน ทรัพยากรถูกใช้ไปโดยไม่ขับเคลื่อนเป้าหมายรวม", "ลูกค้าจะพึงพอใจมากขึ้นเพราะพนักงานยืดหยุ่นตามสถานการณ์เฉพาะหน้า"], "answer": 3, "explanation": "พันธกิจคือกรอบที่ทำให้ทุกฝ่ายเดินไปทางเดียวกัน เมื่อขาดไปแต่ละฝ่ายจะตัดสินใจคนละทิศจนสิ้นเปลืองทรัพยากรโดยไม่เกิดผลรวม ส่วนความรู้สึกว่างานเร็วขึ้นหรืออิสระขึ้นเป็นเพียงผลระยะสั้นที่บดบังความเสียหายเชิงระบบ", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 46, "q": "พนักงานธุรการของสำนักงานบัญชีมีทักษะการใช้โปรแกรมตารางคำนวณขั้นสูง สถานการณ์ใดถือเป็นการประยุกต์ใช้ทักษะอาชีพให้เกิดคุณค่าต่อองค์กรชัดเจนที่สุด?", "choices": ["สร้างแบบฟอร์มสรุปรายงานอัตโนมัติที่ช่วยลดเวลาปิดงบประจำเดือนของทั้งทีม", "รับจ้างทำบัญชีให้บริษัทคู่แข่งนอกเวลางานโดยใช้แบบฟอร์มของบริษัท", "เก็บเทคนิคไว้ใช้คนเดียวเพื่อให้ผลงานของตนโดดเด่นกว่าเพื่อนร่วมงาน", "ใช้เวลางานฝึกฝนโปรแกรมอื่นที่ไม่เกี่ยวข้องกับงานที่ได้รับมอบหมาย", "สอนเทคนิคเฉพาะเพื่อนที่สนิทเพื่อสร้างกลุ่มของตนเองในสำนักงาน"], "answer": 0, "explanation": "การนำทักษะมาสร้างเครื่องมือที่ยกระดับประสิทธิภาพของทั้งทีมคือการประยุกต์ใช้ทักษะให้เกิดคุณค่าต่อองค์กรโดยตรง ส่วนการหวงวิชาหรือสอนเฉพาะพวกพ้องจำกัดคุณค่าไว้ที่ตัวบุคคล และการนำทรัพยากรบริษัทไปช่วยคู่แข่งเป็นการทุจริต", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 47, "q": "ฝ่ายผลิตได้รับเป้าหมายส่งมอบตรงเวลาร้อยละ 98 แต่พนักงานคนหนึ่งพบว่าการเร่งงานให้ทันเวลาทำให้คุณภาพชิ้นงานต่ำกว่ามาตรฐาน เขาควรตีความเป้าหมายองค์กรอย่างไรจึงถูกต้องที่สุด?", "choices": ["เป้าหมายด้านเวลาสำคัญที่สุด จึงควรปล่อยงานที่คุณภาพหย่อนไปก่อนแล้วค่อยแก้ทีหลัง", "เป้าหมายเป็นเรื่องของผู้บริหาร พนักงานมีหน้าที่ทำตามคำสั่งรายวันเท่านั้น", "เป้าหมายย่อยต้องไม่ขัดกับเป้าหมายรวม จึงควรรายงานปัญหาเพื่อปรับกระบวนการให้ได้ทั้งคุณภาพและเวลา", "ลดจำนวนงานที่รับต่อวันลงเองโดยไม่แจ้งใครเพื่อรักษาคุณภาพไว้", "โยกงานที่ทำไม่ทันไปบันทึกในกะถัดไปเพื่อให้ตัวเลขตรงตามเป้า"], "answer": 2, "explanation": "เป้าหมายส่งมอบตรงเวลาเป็นเพียงส่วนหนึ่งของเป้าหมายรวมที่ต้องส่งมอบงานคุณภาพด้วย การรายงานเพื่อปรับกระบวนการจึงถูกหลักที่สุด ส่วนการปล่อยงานด้อยคุณภาพหรือตกแต่งตัวเลขคือการทำลายเป้าหมายรวมเพื่อรักษาตัวชี้วัดเดียว", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 48, "q": "ข้อใดแสดงว่าพนักงานเห็นคุณค่าของทักษะอาชีพต่อความมั่นคงในอาชีพของตนมากที่สุด?", "choices": ["สมชายเลือกทำงานล่วงเวลาทุกวันเพื่อให้มีรายได้มากที่สุด", "สมหญิงเปลี่ยนงานทุกครั้งที่มีที่ใหม่เสนอเงินเดือนสูงกว่า", "สมศักดิ์ทำงานตำแหน่งเดิมด้วยวิธีเดิมมาสิบปีโดยไม่เคยผิดพลาด", "สมปองฝึกฝนทักษะใหม่ที่ตลาดแรงงานต้องการควบคู่กับงานเดิม และสอบใบรับรองมาตรฐานฝีมือแรงงาน", "สมใจสร้างความสัมพันธ์ที่ดีกับหัวหน้างานเพื่อโอกาสเลื่อนตำแหน่ง"], "answer": 3, "explanation": "ความมั่นคงในอาชีพระยะยาวมาจากทักษะที่พัฒนาต่อเนื่องและมีการรับรองมาตรฐาน ส่วนการทำงานแบบเดิมสิบปีดูเหมือนมั่นคงแต่เสี่ยงล้าสมัย และรายได้ล่วงเวลาหรือสายสัมพันธ์ไม่ใช่หลักประกันเมื่อสภาพงานเปลี่ยน", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 49, "q": "พนักงานจัดซื้อมีเป้าหมายส่วนตัวคือกลับบ้านตรงเวลา ขณะที่องค์กรมีเป้าหมายลดต้นทุนการจัดซื้อ วันหนึ่งเขาต้องคัดเลือกผู้ขายรายใหญ่ก่อนเลิกงานเพียงครึ่งชั่วโมง ข้อใดคือการตัดสินใจที่สมดุลระหว่างเป้าหมายส่วนตัวกับเป้าหมายองค์กรมากที่สุด?", "choices": ["เลือกผู้ขายรายแรกที่ติดต่อได้เพื่อให้ทันเวลาเลิกงาน", "เลือกรายที่ใช้ประจำโดยไม่เปรียบเทียบราคา เพราะคุ้นเคยกันดีอยู่แล้ว", "อยู่ทำงานจนดึกทุกวันเพื่อพิสูจน์ความทุ่มเท แม้ประสิทธิภาพจะลดลง", "ส่งเรื่องคืนให้หัวหน้าตัดสินใจแทนเพราะเวลาของตนไม่พอ", "ประเมินว่างานนี้กระทบต้นทุนสูง จึงเปรียบเทียบข้อเสนอหลักให้ครบถ้วนก่อน แล้ววางแผนงานวันถัดไปให้เผื่อเวลาสำหรับงานลักษณะนี้"], "answer": 4, "explanation": "งานที่กระทบต้นทุนสูงต้องทำให้ครบถ้วนก่อน แล้วแก้ที่การวางแผนเวลาเพื่อรักษาเป้าหมายส่วนตัวในระยะยาว ส่วนการรีบเลือกหรือเลือกตามความคุ้นเคยเสี่ยงเสียประโยชน์องค์กร และการอยู่ดึกทุกวันไม่ใช่ความสมดุลที่ยั่งยืน", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 50, "q": "สำนักงานแห่งหนึ่งประกาศเป้าหมายเปลี่ยนผ่านสู่ระบบเอกสารดิจิทัลทั้งหมดภายใน 2 ปี พนักงานอาวุโสที่ไม่ถนัดเทคโนโลยีควรทำอย่างไรจึงเหมาะสมที่สุด?", "choices": ["ขอทำงานด้วยเอกสารกระดาษต่อไปจนเกษียณเพราะเหลือเวลาทำงานอีกไม่นาน", "ทยอยเรียนรู้ระบบใหม่จากการอบรมและเพื่อนร่วมงาน พร้อมถ่ายทอดความเชี่ยวชาญงานเอกสารเดิมของตนให้ทีม", "ให้พนักงานรุ่นใหม่ทำงานในระบบดิจิทัลแทนตนทั้งหมด โดยแลกกับการช่วยงานด้านอื่น", "รอให้ระบบเสถียรและคนอื่นใช้คล่องก่อน จึงเริ่มเรียนรู้ในปีสุดท้าย", "ยื่นข้อเรียกร้องให้องค์กรชะลอเป้าหมายเพราะพนักงานส่วนใหญ่ยังไม่พร้อม"], "answer": 1, "explanation": "การเรียนรู้อย่างค่อยเป็นค่อยไปพร้อมนำจุดแข็งเดิมมาเสริมทีมคือการปรับตัวที่สอดคล้องกับเป้าหมายองค์กรและรักษาคุณค่าของตน ส่วนการรอถึงปีสุดท้ายหรือให้ผู้อื่นทำแทนคือการผลักภาระและทำให้ตนล้าหลังยิ่งขึ้น", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 51, "q": "สถานการณ์ใดต่อไปนี้เสี่ยงต่อการเกิดอุบัติเหตุร้ายแรงในโรงงานมากที่สุด?", "choices": ["พนักงานสวมแว่นนิรภัยขณะเจียรชิ้นงานในบริเวณที่จัดไว้", "พนักงานหยุดเครื่องจักรก่อนเข้าไปเก็บเศษวัสดุที่ตกค้าง", "พนักงานติดป้ายเตือนพื้นเปียกหลังทำความสะอาดพื้นที่", "พนักงานเอื้อมมือเข้าไปดึงชิ้นงานที่ติดขัดขณะเครื่องจักรยังทำงาน เพราะทำเป็นประจำจนชำนาญ", "พนักงานรายงานเสียงผิดปกติของเครื่องจักรให้ช่างซ่อมบำรุงตรวจสอบ"], "answer": 3, "explanation": "การล้วงเข้าไปในเครื่องจักรที่กำลังทำงานเป็นสาเหตุอุบัติเหตุร้ายแรงอันดับต้น และความชำนาญยิ่งสร้างความประมาทซึ่งเป็นความเข้าใจผิดที่อันตราย ส่วนตัวเลือกอื่นล้วนเป็นพฤติกรรมความปลอดภัยที่ถูกต้อง", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 52, "q": "ระหว่างงานซ่อมบำรุง เพื่อนร่วมงานกำลังจะเปิดสวิตช์เครื่องจักรทั้งที่ยังมีป้ายแขวนเตือนว่าห้ามเปิดเพราะกำลังซ่อม โดยอ้างว่าต้องรีบส่งงาน ท่านควรทำอย่างไรเป็นอันดับแรก?", "choices": ["ปล่อยให้เปิดไปก่อนเพราะเพื่อนย่อมรู้งานของตนดี แล้วค่อยตักเตือนภายหลัง", "ห้ามและให้หยุดการเปิดสวิตช์ทันที เพราะอาจมีผู้ปฏิบัติงานอยู่กับเครื่องจักร แล้วรายงานหัวหน้างาน", "ถ่ายคลิปเก็บไว้เป็นหลักฐานเพื่อใช้ร้องเรียนอย่างเป็นทางการในภายหลัง", "ช่วยเพื่อนเดินเครื่องให้เร็วขึ้นเพื่อให้กลับมาทำงานซ่อมต่อได้ไว", "เขียนบันทึกแจ้งฝ่ายบุคคลเป็นลายลักษณ์อักษรก่อนเข้าไปเกี่ยวข้องกับหน้างาน"], "answer": 1, "explanation": "ป้ายแขวนหมายถึงอาจมีชีวิตคนอยู่กับเครื่องจักร การหยุดยั้งทันทีจึงต้องมาก่อนขั้นตอนอื่นทั้งหมด ส่วนการถ่ายคลิปหรือทำบันทึกก่อนเป็นการเลือกขั้นตอนเอกสารในจังหวะที่ชีวิตคนกำลังเสี่ยงซึ่งผิดลำดับความสำคัญ", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 53, "q": "พนักงานแคชเชียร์ปิดยอดสิ้นวันพบเงินสดเกินจากระบบ 500 บาทโดยไม่มีผู้ใดทราบ ข้อใดคือการปฏิบัติที่ถูกต้องตามหลักความซื่อสัตย์สุจริตที่สุด?", "choices": ["รายงานยอดเงินเกินต่อผู้จัดการทันที พร้อมตรวจสอบรายการขายย้อนหลังเพื่อหาสาเหตุ", "เก็บเงินไว้กับตนก่อน หากมีลูกค้ามาทวงจึงค่อยคืนให้", "นำเงินใส่กล่องบริจาคหน้าร้าน เพราะถือว่าได้ทำบุญแทนเจ้าของเงิน", "แบ่งให้เพื่อนพนักงานกะเดียวกัน เพราะถือว่าช่วยกันทำงานมาทั้งวัน", "ปรับตัวเลขในระบบให้ตรงกับเงินสดเพื่อไม่ให้ยอดคลาดเคลื่อน"], "answer": 0, "explanation": "เงินเกินอาจเกิดจากการทอนผิดหรือบันทึกขายผิด การรายงานและหาสาเหตุคือความซื่อสัตย์ต่อทั้งองค์กรและลูกค้า ส่วนการบริจาคแทนดูเหมือนทำดีแต่เป็นการจัดการทรัพย์ของผู้อื่นโดยพลการ และการแก้ตัวเลขคือการปกปิดความคลาดเคลื่อน", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 54, "q": "พนักงานคนหนึ่งมาทำงานสายเป็นประจำโดยอ้างว่ารถติด แต่ผลงานยังอยู่ในเกณฑ์ดี หากพิจารณาตามหลักวินัยองค์กร ข้อใดวิเคราะห์สถานการณ์นี้ได้ถูกต้องที่สุด?", "choices": ["ไม่ถือว่าผิดวินัย เพราะผลงานสำคัญกว่าเวลาเข้างาน", "ไม่ถือว่าผิดวินัย เพราะรถติดเป็นเหตุภายนอกที่ควบคุมไม่ได้", "ถือว่าผิดวินัย เพราะระเบียบเวลาทำงานผูกพันพนักงานทุกคนเท่าเทียมกัน และควรปรับการเดินทางให้มาทันเวลา", "ถือว่าผิดวินัยเฉพาะเมื่อหัวหน้างานพบเห็นและตักเตือนเท่านั้น", "ถือว่าผิดวินัยต่อเมื่อมีเพื่อนร่วมงานร้องเรียนอย่างเป็นทางการ"], "answer": 2, "explanation": "วินัยองค์กรบังคับใช้กับทุกคนโดยไม่ขึ้นกับผลงานหรือการถูกจับได้ และรถติดที่เกิดประจำเป็นสิ่งที่วางแผนล่วงหน้าได้จึงไม่ใช่เหตุสุดวิสัย แนวคิดว่าผลงานดีแล้วละเมิดเวลาได้คือความเข้าใจผิดที่บั่นทอนวินัยส่วนรวม", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 55, "q": "ขณะเคลื่อนย้ายถังสารเคมีในคลังสินค้า ถังหนึ่งรั่วไหลลงพื้นเป็นบริเวณกว้าง พนักงานควรปฏิบัติอย่างไรจึงเหมาะสมที่สุด?", "choices": ["รีบใช้ผ้าที่หาได้ใกล้ตัวเช็ดสารเคมีทันทีเพื่อไม่ให้ลุกลาม", "เปิดพัดลมเป่าให้สารระเหยหมดโดยเร็วแล้วทำงานต่อ", "เทน้ำล้างพื้นให้สารเจือจางแล้วปล่อยไหลลงท่อระบายน้ำ", "ทำงานส่วนอื่นต่อไปก่อน แล้วแจ้งแม่บ้านมาทำความสะอาดช่วงพักเที่ยง", "กันบุคคลออกจากพื้นที่ แจ้งผู้ควบคุมงานทันที และจัดการตามข้อมูลความปลอดภัยสารเคมี (SDS) ของสารนั้น"], "answer": 4, "explanation": "สารเคมีแต่ละชนิดมีวิธีจัดการเฉพาะตาม SDS การกันพื้นที่และแจ้งผู้รับผิดชอบจึงเป็นขั้นตอนที่ถูกต้อง ส่วนการเช็ดด้วยมือเปล่า เป่าให้ระเหย หรือล้างลงท่อ ล้วนเสี่ยงอันตรายต่อตนเองและแพร่มลพิษสู่ภายนอก", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 56, "q": "เมื่อพบเปลวไฟเริ่มลุกไหม้ที่ถังขยะใกล้จุดเก็บทินเนอร์ในอู่ซ่อมรถ ควรเรียงลำดับการปฏิบัติอย่างไรจึงถูกต้องที่สุด ก. แจ้งเหตุ/ตะโกนบอกผู้ร่วมงานทันที ข. ประเมินว่าไฟยังเล็กพอควบคุมได้หรือไม่ ค. ใช้ถังดับเพลิงชนิดเหมาะสมฉีดที่ฐานไฟ ง. อพยพออกจากพื้นที่หากควบคุมไม่ได้", "choices": ["ข → ค → ก → ง", "ก → ข → ค → ง", "ค → ก → ข → ง", "ก → ค → ง → ข", "ข → ก → ง → ค"], "answer": 1, "explanation": "ต้องแจ้งเหตุให้ผู้อื่นรับรู้ก่อนเสมอเพราะไฟใกล้สารไวไฟอาจลุกลามเฉียบพลัน จากนั้นจึงประเมิน ดับด้วยเครื่องมือที่เหมาะสม และอพยพเมื่อควบคุมไม่ได้ การรีบดับก่อนแจ้งใคร (ตัวเลือกแรก) ทำให้ไม่มีผู้ช่วยหากสถานการณ์พลิกผัน", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 57, "q": "พนักงานจัดซื้อได้รับกระเช้าของขวัญมูลค่าสูงจากผู้ขายรายหนึ่ง ในช่วงที่กำลังจะมีการคัดเลือกผู้ขายประจำปี ข้อใดคือการปฏิบัติที่เหมาะสมที่สุด?", "choices": ["รับไว้เพราะเป็นธรรมเนียมตามเทศกาล ไม่เกี่ยวข้องกับการตัดสินใจ", "รับไว้แล้วนำไปแบ่งให้ทั้งแผนก เพื่อไม่ให้เป็นประโยชน์ส่วนตัว", "รับไว้ได้ แต่ตั้งใจมั่นว่าจะตัดสินใจคัดเลือกอย่างเป็นกลาง", "ปฏิเสธอย่างเงียบ ๆ โดยไม่แจ้งผู้ใด เพื่อรักษาน้ำใจของผู้ขาย", "ปฏิเสธหรือส่งคืนตามระเบียบองค์กร และรายงานผู้บังคับบัญชาเพื่อความโปร่งใสในการคัดเลือก"], "answer": 4, "explanation": "ของขวัญมูลค่าสูงในช่วงคัดเลือกผู้ขายคือผลประโยชน์ทับซ้อน ต้องปฏิเสธตามระเบียบและรายงานให้ตรวจสอบได้ การรับไว้แล้วแบ่งกันหรืออ้างว่าใจเป็นกลางไม่ได้ลบล้างข้อครหา และการปฏิเสธเงียบ ๆ ยังขาดการบันทึกที่พิสูจน์ความโปร่งใส", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 58, "q": "หัวหน้างานสั่งให้ข้ามขั้นตอนการตรวจสอบคุณภาพชิ้นงานล็อตหนึ่งเพื่อให้ทันกำหนดส่งลูกค้า พนักงานตรวจสอบคุณภาพควรทำอย่างไรจึงเหมาะสมที่สุด?", "choices": ["ปฏิบัติตามคำสั่งทันที เพราะหัวหน้าเป็นผู้รับผิดชอบผลทั้งหมดอยู่แล้ว", "ปฏิเสธคำสั่งและหยุดงานทั้งหมดจนกว่าหัวหน้าจะถอนคำสั่ง", "ชี้แจงความเสี่ยงต่อหัวหน้าพร้อมเสนอทางเลือก เช่น การสุ่มตรวจตามมาตรฐาน หากยังยืนยันให้ข้ามขั้นตอน ควรรายงานผู้บริหารตามสายงาน", "ตรวจเฉพาะชิ้นงานบนสุดของแต่ละกล่องเพื่อประหยัดเวลาโดยไม่แจ้งผู้ใด", "ลงบันทึกว่าตรวจครบตามขั้นตอนเพื่อให้เอกสารสมบูรณ์ แล้วส่งงานตามกำหนด"], "answer": 2, "explanation": "การชี้แจงความเสี่ยงพร้อมเสนอทางออกที่ยังรักษามาตรฐานคือการสมดุลระหว่างการเคารพผู้บังคับบัญชากับหน้าที่วิชาชีพ ส่วนการทำตามเงียบ ๆ หรือปลอมบันทึกคือการร่วมทุจริต และการหยุดงานทั้งหมดเป็นการตอบโต้เกินเหตุ", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 59, "q": "พนักงานลื่นเกือบล้มเพราะคราบน้ำมันบนทางเดินในโรงงานแต่ไม่ได้รับบาดเจ็บ ข้อใดคือเหตุผลสำคัญที่สุดที่เขาควรรายงานเหตุการณ์เกือบเกิดอุบัติเหตุ (Near Miss) นี้?", "choices": ["เพื่อให้องค์กรกำจัดสาเหตุที่ต้นตอ ก่อนที่จะเกิดอุบัติเหตุจริงที่รุนแรงกับผู้อื่น", "เพื่อให้ตนพ้นความรับผิดหากมีผู้ลื่นล้มบริเวณเดียวกันในภายหลัง", "เพื่อสะสมสถิติการรายงานให้ได้รับรางวัลพนักงานดีเด่นด้านความปลอดภัย", "เพื่อให้ฝ่ายอาคารสถานที่ถูกตำหนิเรื่องการทำความสะอาดที่บกพร่อง", "ไม่จำเป็นต้องรายงาน เพราะไม่มีผู้บาดเจ็บและทรัพย์สินไม่เสียหาย"], "answer": 0, "explanation": "หลักการของการรายงาน Near Miss คือการใช้สัญญาณเตือนล่วงหน้ากำจัดอันตรายก่อนเกิดเหตุจริง ส่วนการรายงานเพื่อป้องกันตัว เอารางวัล หรือกล่าวโทษผู้อื่น เป็นแรงจูงใจที่ผิดวัตถุประสงค์ และการไม่รายงานเพราะไม่มีคนเจ็บคือการปล่อยอันตรายไว้รอเหยื่อรายต่อไป", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 60, "q": "เพื่อนสนิทขอให้ท่านสแกนลายนิ้วมือลงเวลาทำงานแทน เพราะติดธุระจะมาสายครึ่งชั่วโมง โดยสัญญาว่าจะทำงานชดเชยให้ครบ ข้อใดวิเคราะห์สถานการณ์นี้ได้ถูกต้องที่สุด?", "choices": ["ช่วยได้ เพราะเพื่อนตั้งใจทำงานชดเชยครบ จึงไม่มีผู้ใดเสียประโยชน์", "ช่วยได้เฉพาะครั้งแรกครั้งเดียว หากทำบ่อยครั้งจึงจะถือว่าผิด", "ช่วยได้หากแจ้งให้เพื่อนร่วมงานคนอื่นรับรู้ร่วมกันอย่างเปิดเผย", "ช่วยไม่ได้ เพราะเป็นการปลอมแปลงข้อมูลเวลาทำงาน ถือเป็นการทุจริตต่อองค์กรทั้งผู้ทำแทนและผู้ขอให้ทำ", "ช่วยไม่ได้ เว้นแต่วันนั้นหัวหน้างานไม่อยู่ปฏิบัติงาน"], "answer": 3, "explanation": "การลงเวลาแทนคือการสร้างหลักฐานเท็จซึ่งผิดทั้งผู้ขอและผู้ทำแทนโดยไม่ขึ้นกับจำนวนครั้งหรือการชดเชย ข้ออ้างว่าไม่มีใครเสียประโยชน์คือความเข้าใจผิด เพราะองค์กรจ่ายค่าจ้างตามข้อมูลที่ถูกบิดเบือนและความไว้วางใจถูกทำลาย", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 61, "q": "พนักงานซ่อมบำรุงได้รับคำสั่งเร่งด่วนให้ไปช่วยขนย้ายวัสดุเข้าคลัง ซึ่งอยู่นอกเหนือหน้าที่ประจำ ขณะที่งานตรวจเช็กเครื่องจักรประจำวันของตนยังไม่เสร็จ ข้อใดคือการจัดการที่เหมาะสมที่สุด?", "choices": ["ปฏิเสธทันทีเพราะไม่ใช่หน้าที่ตามใบพรรณนางานของตน", "พักงานตรวจเช็กไว้ก่อนแล้วไปขนย้ายจนเสร็จ เพราะเป็นคำสั่งล่าสุด", "ทำสองงานสลับกันอย่างเร่งรีบเพื่อให้เสร็จพร้อมกันทั้งคู่", "ขอให้เพื่อนที่ไม่มีความรู้เรื่องเครื่องจักรมาตรวจเช็กแทนตน", "แจ้งผู้สั่งงานว่างานตรวจเช็กมีผลต่อความปลอดภัยการผลิต แล้วตกลงลำดับความสำคัญและช่วงเวลาที่จะไปช่วยให้ชัดเจน"], "answer": 4, "explanation": "การสื่อสารข้อจำกัดและจัดลำดับความสำคัญร่วมกับผู้สั่งงานคือความรับผิดชอบทั้งต่อหน้าที่หลักและต่อส่วนรวม ส่วนการทิ้งงานความปลอดภัย การให้ผู้ไม่มีความรู้ทำแทน หรือการปฏิเสธแข็งกร้าว ล้วนสร้างความเสี่ยงหรือทำลายความร่วมมือ", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 62, "q": "พนักงานเสิร์ฟถูกผู้จัดการตำหนิต่อหน้าลูกค้าว่าจัดโต๊ะผิดรูปแบบงานเลี้ยง ทั้งที่ตนทำตามใบสั่งงานที่ได้รับมา เจตคติและการปฏิบัติใดเหมาะสมที่สุด?", "choices": ["โต้แย้งทันทีต่อหน้าลูกค้า พร้อมนำใบสั่งงานมายืนยันว่าตนทำถูกต้อง", "ยอมรับผิดทุกกรณีเพื่อให้เรื่องจบ แม้จะไม่ใช่ความผิดของตน", "นิ่งเฉยไว้ก่อน แล้วนำเรื่องไประบายในสื่อสังคมออนไลน์หลังเลิกงาน", "แก้ไขการจัดโต๊ะให้ลูกค้าเรียบร้อยก่อน แล้วชี้แจงข้อเท็จจริงพร้อมใบสั่งงานกับผู้จัดการเป็นการส่วนตัวภายหลัง", "ขอย้ายไปประจำโซนบริการอื่นเพื่อไม่ต้องพบผู้จัดการคนนี้อีก"], "answer": 3, "explanation": "มืออาชีพต้องแก้ปัญหาให้ลูกค้าก่อนแล้วจึงชี้แจงข้อเท็จจริงในที่เหมาะสม ซึ่งรักษาทั้งงานบริการและความถูกต้อง ส่วนการโต้แย้งต่อหน้าลูกค้าทำลายภาพลักษณ์ร้าน และการยอมรับผิดทั้งที่ไม่ผิดทำให้ต้นเหตุของความผิดพลาดไม่ถูกแก้ไข", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 63, "q": "ช่างไฟฟ้าประกอบตู้ควบคุมผิดวงจรหนึ่งจุดและส่งมอบให้ลูกค้าไปแล้ว ต่อมาตนเองตรวจพบก่อนที่จะเกิดปัญหาใด ๆ ข้อใดคือการแสดงความรับผิดชอบที่ถูกต้องที่สุด?", "choices": ["รอดูก่อนว่าลูกค้าจะตรวจพบหรือไม่ หากไม่พบก็ไม่จำเป็นต้องแจ้ง", "รายงานหัวหน้างานทันทีและประสานลูกค้าเพื่อเข้าแก้ไขโดยเร็ว พร้อมทบทวนขั้นตอนการตรวจสอบงานของตน", "แอบไปแก้ไขที่หน้างานของลูกค้าเงียบ ๆ โดยไม่แจ้งผู้ใด เพื่อไม่ให้เสียประวัติการทำงาน", "แจ้งลูกค้าว่าเป็นความบกพร่องของวัสดุจากโรงงานผู้ผลิต", "ขอให้เพื่อนช่างที่สนิทเป็นผู้ไปแก้ไขแทนโดยไม่ระบุสาเหตุที่แท้จริง"], "answer": 1, "explanation": "ความรับผิดชอบที่แท้จริงคือเปิดเผยข้อผิดพลาด เร่งแก้ไขก่อนเกิดอันตราย และปรับปรุงกระบวนการไม่ให้เกิดซ้ำ ส่วนการแอบแก้เองแม้ดูเหมือนรับผิดชอบ แต่เป็นการปกปิดข้อมูลที่องค์กรต้องใช้ประเมินความเสี่ยง และการโทษวัสดุคือการโกหกซ้ำ", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 64, "q": "งานติดตั้งระบบต้องส่งมอบในวันพรุ่งนี้ แต่เพื่อนร่วมทีมที่รับผิดชอบงานเดินสายป่วยกะทันหันทำให้งานส่วนนั้นไม่เสร็จ ข้อใดคือการปฏิบัติที่สะท้อนความรับผิดชอบต่อทีมมากที่สุด?", "choices": ["แจ้งหัวหน้าทีมถึงสถานการณ์ทันที แล้วอาสาช่วยงานส่วนที่ตนมีทักษะ พร้อมร่วมกันปรับแผนงาน", "ทำเฉพาะส่วนของตนให้สมบูรณ์ที่สุด เพราะแต่ละคนต้องรับผิดชอบงานของตนเอง", "ตำหนิเพื่อนที่ไม่วางแผนเผื่อเหตุฉุกเฉิน เพื่อไม่ให้เกิดเหตุการณ์เช่นนี้ซ้ำ", "ติดต่อเลื่อนกำหนดส่งมอบกับลูกค้าด้วยตนเองทันทีโดยไม่ปรึกษาหัวหน้า", "เร่งทำงานเดินสายแทนทั้งหมดตามลำพังแม้ไม่ชำนาญ เพื่อไม่ให้ผู้ใดรู้ว่ามีปัญหา"], "answer": 0, "explanation": "ความรับผิดชอบต่อทีมคือการเปิดเผยปัญหาให้เร็วและร่วมแก้ตามความสามารถจริงภายใต้การตัดสินใจร่วม ส่วนการทำเฉพาะส่วนตนเป็นความรับผิดชอบแบบแคบ การทำงานที่ไม่ชำนาญแทนทั้งหมดเสี่ยงต่อคุณภาพและความปลอดภัย และการติดต่อลูกค้าเองเป็นการทำเกินอำนาจ", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 65, "q": "พนักงานได้รับมอบหมายงานด่วนจากหัวหน้างานสองคนในเวลาเดียวกัน และไม่สามารถทำให้เสร็จพร้อมกันได้ทั้งสองงาน ควรจัดการอย่างไรจึงเหมาะสมที่สุด?", "choices": ["เลือกทำงานของหัวหน้าที่มีตำแหน่งสูงกว่าก่อนเสมอ โดยไม่ต้องแจ้งอีกฝ่าย", "เลือกทำงานที่ง่ายและเสร็จเร็วก่อน เพื่อให้มีผลงานปรากฏโดยเร็ว", "แจ้งหัวหน้าทั้งสองให้ทราบข้อจำกัดของเวลา และขอให้ร่วมกันจัดลำดับความสำคัญของงานทั้งสองชิ้น", "ทำทั้งสองงานสลับกันไปมาทีละครึ่งชั่วโมงเพื่อให้เกิดความเป็นธรรม", "ส่งงานชิ้นหนึ่งให้เพื่อนร่วมงานทำแทนโดยไม่แจ้งหัวหน้าเจ้าของงาน"], "answer": 2, "explanation": "ผู้มอบหมายงานคือผู้ที่รู้ผลกระทบของแต่ละงานดีที่สุด การเปิดเผยข้อจำกัดและให้ร่วมกันจัดลำดับจึงถูกหลักการสื่อสารในองค์กร ส่วนการเดาลำดับเองจากตำแหน่งหรือความง่าย และการสลับงานถี่ ๆ ล้วนเสี่ยงให้งานสำคัญเสียหายทั้งคู่", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 66, "q": "โรงแรมนำระบบเช็กอินอัตโนมัติมาใช้ ทำให้พนักงานต้อนรับต้องเปลี่ยนบทบาทไปดูแลลูกค้าเชิงลึกมากขึ้น พนักงานที่มีเจตคติที่ดีต่อการปฏิบัติงานจะมีท่าทีอย่างไร?", "choices": ["มองว่าเป็นโอกาสพัฒนาทักษะการบริการระดับสูง และเรียนรู้ระบบใหม่เพื่อช่วยเหลือลูกค้าที่ใช้งานไม่คล่อง", "กังวลว่าจะถูกลดความสำคัญ จึงทำงานแบบเดิมให้มากที่สุดเพื่อพิสูจน์ว่าระบบไม่จำเป็น", "แนะนำให้ลูกค้ามาใช้เคาน์เตอร์พนักงานแทนระบบอัตโนมัติ เพื่อรักษาบทบาทของตำแหน่งตน", "ทำตามหน้าที่ใหม่ไปวัน ๆ โดยไม่แสดงความคิดเห็นหรือความสนใจใด ๆ", "รวมกลุ่มเพื่อนร่วมงานคัดค้านระบบใหม่เพราะทำให้ภาระงานเปลี่ยนไป"], "answer": 0, "explanation": "เจตคติที่ดีคือการมองการเปลี่ยนแปลงเป็นโอกาสพัฒนาตนและยังคงยึดประโยชน์ของลูกค้าเป็นหลัก ส่วนการชักจูงลูกค้าเลี่ยงระบบหรือต่อต้านการเปลี่ยนแปลงคือการเอาความมั่นคงส่วนตัวมาอยู่เหนือเป้าหมายองค์กร", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 67, "q": "ช่างอู่รับปากลูกค้าว่ารถจะซ่อมเสร็จภายในเย็นนี้ แต่ระหว่างซ่อมพบความเสียหายเพิ่มเติมที่ทำให้ไม่สามารถเสร็จทันได้แน่นอน ข้อใดคือการปฏิบัติที่รับผิดชอบต่อลูกค้ามากที่สุด?", "choices": ["ซ่อมเฉพาะรายการเดิมให้เสร็จตามนัด ส่วนความเสียหายใหม่ไม่ต้องแจ้งเพราะลูกค้าไม่ได้สั่งซ่อม", "ปิดโทรศัพท์เพื่อหลีกเลี่ยงการติดต่อจากลูกค้าจนกว่างานจะเสร็จ", "ประกอบชิ้นส่วนเดิมกลับคืนแล้วส่งมอบรถตามนัด โดยนัดมาซ่อมใหม่ภายหลังโดยไม่บอกเหตุผลที่แท้จริง", "เร่งซ่อมโดยข้ามขั้นตอนการทดสอบเพื่อให้เสร็จทันเวลานัดหมาย", "โทรแจ้งลูกค้าทันทีถึงความเสียหายที่ตรวจพบ พร้อมประเมินค่าใช้จ่ายและระยะเวลาที่ต้องใช้เพิ่ม เพื่อให้ลูกค้าเป็นผู้ตัดสินใจ"], "answer": 4, "explanation": "ความรับผิดชอบต่อลูกค้าคือการแจ้งข้อเท็จจริงทันทีและให้ลูกค้าตัดสินใจบนข้อมูลครบถ้วน ส่วนการข้ามขั้นตอนทดสอบเพื่อรักษาคำพูดคือการเอากำหนดเวลามาแลกกับความปลอดภัย และการซ่อมเฉพาะรายการเดิมโดยปกปิดความเสียหายอาจทำให้ลูกค้าใช้รถที่มีอันตรายแฝง", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 68, "q": "สถานการณ์ใดแสดงถึงความรับผิดชอบต่อหน้าที่ได้ชัดเจนที่สุด?", "choices": ["พนักงานที่อยู่ทำงานล่วงเวลาทุกวัน แม้งานประจำยังผิดพลาดอยู่บ่อยครั้ง", "พนักงานที่รับปากทำทุกงานที่ถูกร้องขอ แม้รู้ว่าตนทำไม่ทัน", "พนักงานที่ตั้งใจทำเฉพาะงานที่หัวหน้ามองเห็นและมักได้รับคำชม", "พนักงานที่ตรวจสอบงานของตนก่อนส่งมอบทุกครั้ง และแจ้งผู้เกี่ยวข้องล่วงหน้าทันทีเมื่อคาดว่างานจะล่าช้า", "พนักงานที่ทำงานเสร็จเร็วที่สุดในแผนกโดยไม่ใส่ใจข้อผิดพลาดเล็กน้อย"], "answer": 3, "explanation": "ความรับผิดชอบวัดจากคุณภาพของงานที่ส่งมอบและการสื่อสารเชิงรุกเมื่อมีปัญหา ไม่ใช่จำนวนชั่วโมง ความเร็ว หรือการรับปากเกินกำลัง ซึ่งล้วนเป็นภาพลวงของความขยันที่ไม่ได้ประกันผลลัพธ์ของหน้าที่", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 69, "q": "หากพนักงานในแผนกหนึ่งมักเกี่ยงกันทำงานที่ไม่มีผู้รับผิดชอบชัดเจน เช่น การดูแลเครื่องมือส่วนกลาง ผลกระทบระยะยาวที่น่าจะเกิดขึ้นมากที่สุดคือข้อใด?", "choices": ["องค์กรจะจ้างพนักงานเพิ่มขึ้น ทำให้ทุกคนทำงานสบายขึ้น", "หัวหน้างานจะลงมือทำแทนจนเกิดความสัมพันธ์ที่ดีขึ้นในแผนก", "เครื่องมือเสื่อมสภาพเร็ว งานสะดุดบ่อย และวัฒนธรรมปัดความรับผิดชอบฝังรากจนแก้ไขได้ยาก", "พนักงานแต่ละคนจะมีเวลาไปพัฒนาทักษะเฉพาะทางของตนมากขึ้น", "ปัญหาจะคลี่คลายไปเองเมื่อมีพนักงานใหม่เข้ามารับช่วงต่อ"], "answer": 2, "explanation": "งานส่วนกลางที่ถูกละเลยจะสะสมความเสียหายทั้งด้านทรัพย์สินและประสิทธิภาพ และที่ร้ายแรงกว่าคือกลายเป็นบรรทัดฐานของการปัดความรับผิดชอบ ส่วนความคิดว่าปัญหาจะหายเองหรือมีคนอื่นมาทำแทนคือการมองโลกแบบผลักภาระ", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 70, "q": "พนักงานใหม่ถูกรุ่นพี่แนะนำว่าขั้นตอนบันทึกการตรวจสอบท้ายกะไม่ต้องทำจริง เพียงติ๊กเครื่องหมายให้ครบเพราะใคร ๆ ก็ทำเช่นนี้ พนักงานใหม่ควรทำอย่างไรจึงเหมาะสมที่สุด?", "choices": ["ทำตามรุ่นพี่ เพราะเป็นวิธีปฏิบัติจริงของหน้างานที่สืบทอดกันมา", "ปฏิบัติตามขั้นตอนจริงทุกครั้ง และหากเห็นว่าขั้นตอนซ้ำซ้อนจริงควรเสนอปรับปรุงผ่านหัวหน้างานอย่างเปิดเผย", "ทำตามขั้นตอนจริงเฉพาะวันที่มีผู้ตรวจประเมินภายนอกเข้ามาในโรงงาน", "รายงานพฤติกรรมรุ่นพี่ต่อฝ่ายบุคคลทันที โดยไม่พูดคุยหรือตรวจสอบข้อเท็จจริงใด ๆ ก่อน", "ติ๊กให้ครบตามคำแนะนำ แต่จดบันทึกส่วนตัวเก็บไว้เพื่อป้องกันตนเอง"], "answer": 1, "explanation": "การบันทึกตรวจสอบเป็นหลักฐานความปลอดภัยและคุณภาพ การติ๊กโดยไม่ทำจริงคือการปลอมเอกสารแม้จะทำกันทั่วไป ทางที่ถูกคือทำจริงและแก้ปัญหาขั้นตอนซ้ำซ้อนผ่านช่องทางที่เปิดเผย ส่วนการรายงานทันทีโดยไม่ตรวจสอบข้อเท็จจริงอาจสร้างความขัดแย้งเกินจำเป็น", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 71, "q": "พนักงานโรงงานฟอกย้อมพบว่ากะกลางคืนมีการปล่อยน้ำเสียที่ยังไม่ผ่านการบำบัดลงคลองสาธารณะเพื่อประหยัดค่าไฟฟ้าของระบบบำบัด ข้อใดคือการปฏิบัติที่เหมาะสมที่สุด?", "choices": ["วางเฉย เพราะเป็นการตัดสินใจของหัวหน้ากะกลางคืน ไม่ใช่หน้าที่ของตน", "นำเรื่องไปโพสต์ประจานในสื่อสังคมออนไลน์ทันทีเพื่อกดดันโรงงาน", "รายงานข้อเท็จจริงพร้อมหลักฐานต่อผู้บริหารหรือช่องทางรับเรื่องร้องเรียนภายในองค์กร เพราะการกระทำนี้กระทบชุมชนและอาจผิดกฎหมายสิ่งแวดล้อม", "ขอย้ายไปทำงานกะกลางวันเพื่อไม่ต้องเข้าไปเกี่ยวข้อง", "เตือนเพื่อนกะกลางคืนเป็นการส่วนตัวว่าอย่าให้บุคคลภายนอกพบเห็น"], "answer": 2, "explanation": "การรายงานผ่านช่องทางภายในพร้อมหลักฐานคือการหยุดความเสียหายต่อชุมชนอย่างเป็นระบบและให้องค์กรได้แก้ไขตามกฎหมาย ส่วนการวางเฉยหรือย้ายกะคือการปล่อยให้มลพิษดำเนินต่อ และการเตือนให้ระวังคนเห็นคือการช่วยปกปิดความผิด", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 72, "q": "บริษัทแห่งหนึ่งต้องการดำเนินธุรกิจตามแนวคิด Triple Bottom Line (กำไร ผู้คน โลก) โครงการใดสะท้อนแนวคิดนี้ได้ครบถ้วนที่สุด?", "choices": ["โครงการลดต้นทุนการผลิตทุกด้านเพื่อสร้างกำไรสูงสุดแก่ผู้ถือหุ้น", "โครงการปรับกระบวนการผลิตให้ลดของเสียและพลังงานซึ่งช่วยลดต้นทุน ควบคู่กับการจ้างงานและรับซื้อวัตถุดิบจากชุมชนโดยรอบ", "โครงการบริจาคเงินก้อนใหญ่ให้โรงเรียนปีละครั้งพร้อมทำข่าวประชาสัมพันธ์", "โครงการปลูกป่าประจำปีโดยหยุดสายการผลิตทั้งหมดหนึ่งวัน แม้จะทำให้บริษัทขาดทุน", "โครงการเพิ่มสวัสดิการพนักงานโดยตัดงบประมาณระบบบำบัดมลพิษมาใช้แทน"], "answer": 1, "explanation": "Triple Bottom Line ต้องสมดุลทั้งเศรษฐกิจ สังคม และสิ่งแวดล้อมพร้อมกัน ซึ่งโครงการลดของเสียควบคู่การสร้างรายได้ให้ชุมชนตอบครบทั้งสามมิติ ส่วนการบริจาคปีละครั้งเน้นภาพลักษณ์มิติเดียว และการเพิ่มสวัสดิการโดยตัดงบสิ่งแวดล้อมคือการแลกมิติหนึ่งด้วยอีกมิติ", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 73, "q": "องค์กรใดต่อไปนี้มีพฤติกรรมเข้าข่ายการสร้างภาพลักษณ์ด้านสิ่งแวดล้อมโดยไม่จริงใจ (Greenwashing) ชัดเจนที่สุด?", "choices": ["โรงงานที่ติดตั้งแผงพลังงานแสงอาทิตย์และเปิดเผยข้อมูลการใช้พลังงานตามจริง", "ร้านค้าที่ยกเลิกการแจกถุงพลาสติกและเชิญชวนลูกค้านำถุงผ้ามาเอง", "บริษัทที่ตั้งเป้าลดคาร์บอนและรายงานความคืบหน้าทุกปี แม้บางปีทำไม่ถึงเป้า", "อู่ซ่อมรถที่รวบรวมน้ำมันเครื่องใช้แล้วส่งให้ผู้รับกำจัดที่ได้รับอนุญาต", "บริษัทที่โฆษณาว่าบรรจุภัณฑ์ของตนเป็นมิตรต่อสิ่งแวดล้อม ขณะที่กระบวนการผลิตยังลักลอบปล่อยมลพิษเกินค่ามาตรฐาน"], "answer": 4, "explanation": "Greenwashing คือการสื่อสารภาพลักษณ์สีเขียวที่สวนทางกับการกระทำจริง การโฆษณาบรรจุภัณฑ์รักษ์โลกขณะลักลอบปล่อยมลพิษจึงเข้าข่ายชัดเจนที่สุด ส่วนบริษัทที่รายงานตามจริงแม้ทำไม่ถึงเป้ายังถือว่าโปร่งใส ไม่ใช่การหลอกลวง", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 74, "q": "อู่ซ่อมรถขนาดเล็กมีน้ำมันเครื่องใช้แล้วสะสมอยู่จำนวนมาก วิธีจัดการใดถูกต้องตามหลักความรับผิดชอบต่อสิ่งแวดล้อมมากที่สุด?", "choices": ["ทยอยเทลงท่อระบายน้ำทีละน้อยเพื่อไม่ให้เกิดผลกระทบครั้งใหญ่", "ขุดหลุมฝังบริเวณหลังอู่ เพราะน้ำมันจะย่อยสลายเองตามธรรมชาติ", "เผาทำลายในที่โล่งช่วงกลางคืนเพื่อไม่ให้รบกวนเพื่อนบ้าน", "จัดเก็บในภาชนะปิดมิดชิดแยกประเภท แล้วส่งให้ผู้รับกำจัดหรือรีไซเคิลที่ได้รับอนุญาตตามกฎหมาย", "นำไปผสมกับน้ำมันเชื้อเพลิงเพื่อใช้กับเครื่องจักรเก่าในอู่ให้หมดไป"], "answer": 3, "explanation": "น้ำมันเครื่องใช้แล้วเป็นของเสียอันตรายที่ต้องส่งต่อให้ผู้รับกำจัดที่ได้รับอนุญาตเท่านั้น การเทลงท่อทีละน้อยหรือฝังกลบเป็นความเข้าใจผิดที่ทำให้สารปนเปื้อนสะสมในดินและแหล่งน้ำ ส่วนการเผาในที่โล่งปล่อยสารพิษสู่อากาศโดยตรง", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 75, "q": "ร้านสะดวกซื้อในชุมชนเริ่มนโยบายงดแจกถุงพลาสติกและตั้งจุดรับขยะรีไซเคิล แม้ช่วงแรกลูกค้าบางส่วนไม่พอใจ ข้อใดวิเคราะห์ผลกระทบระยะยาวต่อร้านได้สมเหตุสมผลที่สุด?", "choices": ["ร้านจะได้รับความไว้วางใจจากชุมชนในฐานะผู้ร่วมดูแลสิ่งแวดล้อม ซึ่งเป็นภาพลักษณ์ที่ส่งผลดีต่อกิจการอย่างยั่งยืน", "ร้านจะสูญเสียลูกค้าอย่างถาวร เพราะความสะดวกสำคัญกว่าสิ่งแวดล้อมเสมอ", "ร้านจะมีต้นทุนสูงขึ้นเรื่อย ๆ โดยไม่ได้รับประโยชน์ใดกลับคืนมา", "นโยบายนี้จะไม่เกิดผลใด ๆ เพราะปัญหาสิ่งแวดล้อมเป็นหน้าที่ของภาครัฐเท่านั้น", "ร้านคู่แข่งที่ยังแจกถุงฟรีจะได้เปรียบตลอดไปโดยไม่มีผลเสียใด ๆ"], "answer": 0, "explanation": "ความไม่พอใจช่วงเปลี่ยนผ่านเป็นต้นทุนระยะสั้น แต่ภาพลักษณ์องค์กรที่รับผิดชอบต่อชุมชนสร้างความผูกพันของลูกค้าในระยะยาว ส่วนแนวคิดว่าความสะดวกชนะเสมอหรือสิ่งแวดล้อมเป็นเรื่องของรัฐเท่านั้น เป็นมุมมองที่มองข้ามแนวโน้มพฤติกรรมผู้บริโภคยุคปัจจุบัน", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 76, "q": "โรงงานได้รับหนังสือร้องเรียนจากชุมชนเรื่องเสียงดังจากเครื่องจักรในช่วงกลางคืน แนวทางใดสะท้อนความรับผิดชอบขององค์กรต่อชุมชนมากที่สุด?", "choices": ["ชี้แจงว่าโรงงานตั้งอยู่ก่อนที่ชุมชนจะขยายเข้ามา จึงไม่มีความจำเป็นต้องแก้ไข", "จ่ายเงินชดเชยเฉพาะบ้านที่ร้องเรียนเพื่อยุติเรื่องให้เร็วที่สุด", "จัดงานเลี้ยงสานสัมพันธ์กับชุมชนเพื่อให้เรื่องร้องเรียนเงียบหายไป", "ตรวจวัดระดับเสียงตามข้อเท็จจริง ปรับปรุงฉนวนกันเสียงและช่วงเวลาเดินเครื่อง พร้อมสื่อสารความคืบหน้ากับชุมชนอย่างต่อเนื่อง", "ย้ายการเดินเครื่องที่เสียงดังไปช่วงเช้ามืดแทนโดยไม่แจ้งให้ชุมชนทราบ"], "answer": 3, "explanation": "ความรับผิดชอบต่อชุมชนต้องแก้ที่ต้นเหตุด้วยข้อมูลจริงและสื่อสารอย่างโปร่งใสต่อเนื่อง ส่วนการจ่ายเงินปิดเรื่องหรือจัดงานเลี้ยงเป็นการซื้อความเงียบโดยปัญหายังอยู่ และการย้ายเวลาเดินเครื่องโดยไม่แจ้งเป็นเพียงการย้ายความเดือดร้อน", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 77, "q": "หากองค์กรมีงบประมาณด้านกิจกรรมเพื่อสังคมจำกัด โครงการใดต่อไปนี้สร้างความยั่งยืนให้ชุมชนได้มากที่สุด?", "choices": ["ฝึกอาชีพซ่อมบำรุงเครื่องใช้ไฟฟ้าให้เยาวชนในชุมชน พร้อมเปิดรับผู้ผ่านการฝึกเข้าฝึกงานในบริษัท", "แจกเงินสดให้ครัวเรือนรอบโรงงานปีละครั้งในวันครบรอบก่อตั้งบริษัท", "แจกสิ่งของอุปโภคบริโภคให้ชุมชนในทุกเทศกาลสำคัญ", "จัดคอนเสิร์ตการกุศลขนาดใหญ่ปีละครั้งเพื่อประชาสัมพันธ์แบรนด์", "มอบทุนก่อสร้างซุ้มประตูชุมชนพร้อมติดตราสัญลักษณ์ของบริษัท"], "answer": 0, "explanation": "การสร้างทักษะอาชีพและเส้นทางการมีงานทำคือการพัฒนาที่ชุมชนต่อยอดได้ด้วยตนเองอย่างถาวร ส่วนการแจกเงินหรือสิ่งของช่วยบรรเทาได้เพียงชั่วคราว และซุ้มประตูหรือคอนเสิร์ตเน้นการมองเห็นแบรนด์มากกว่าประโยชน์ที่ยั่งยืนของชุมชน", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 78, "q": "บริษัทประกาศนโยบายลดการใช้พลังงานทั้งองค์กร พนักงานทั่วไปสามารถมีส่วนร่วมให้เกิดผลจริงได้มากที่สุดด้วยวิธีใด?", "choices": ["รอเข้าร่วมกิจกรรมรณรงค์ประหยัดพลังงานประจำปีที่บริษัทจัดขึ้น", "ปรับพฤติกรรมประจำวัน เช่น ปิดเครื่องจักรและอุปกรณ์ไฟฟ้าเมื่อไม่ใช้งาน พร้อมเสนอจุดสูญเสียพลังงานที่พบในหน้างานของตน", "แชร์โพสต์ประชาสัมพันธ์นโยบายของบริษัทลงสื่อสังคมออนไลน์ให้มากที่สุด", "ติดป้ายรณรงค์ประหยัดพลังงานในแผนกโดยไม่เปลี่ยนพฤติกรรมการทำงานเดิม", "ปิดเครื่องปรับอากาศทั้งอาคารรวมถึงห้องเซิร์ฟเวอร์เพื่อให้ประหยัดสูงสุด"], "answer": 1, "explanation": "การเปลี่ยนพฤติกรรมจริงในหน้างานบวกกับการรายงานจุดสูญเสียที่มีแต่คนหน้างานเท่านั้นที่เห็นคือการมีส่วนร่วมที่วัดผลได้จริง ส่วนการแชร์โพสต์หรือติดป้ายเป็นเพียงการสื่อสาร และการปิดระบบที่จำเป็นอย่างห้องเซิร์ฟเวอร์สร้างความเสียหายมากกว่าที่ประหยัดได้", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 79, "q": "สถานการณ์ใดส่งผลเสียต่อภาพลักษณ์องค์กรต่อชุมชนและสังคมรุนแรงและยาวนานที่สุด?", "choices": ["พนักงานคนหนึ่งแต่งกายไม่เรียบร้อยระหว่างเดินทางกลับบ้าน", "องค์กรเลื่อนการจัดกิจกรรมกีฬาภายในประจำปีออกไปหนึ่งไตรมาส", "ลูกค้ารายหนึ่งตำหนิความล่าช้าของการบริการหน้าร้านและได้รับการแก้ไขทันที", "องค์กรแถลงยอมรับข้อผิดพลาดในการผลิตและเรียกคืนสินค้าเพื่อแก้ไข", "สื่อมวลชนเปิดโปงว่าองค์กรจงใจปกปิดการปล่อยมลพิษที่ทำให้ชาวบ้านเจ็บป่วยต่อเนื่องหลายปี"], "answer": 4, "explanation": "การจงใจปกปิดความเสียหายต่อสุขภาพชุมชนทำลายความไว้วางใจในระดับที่ฟื้นฟูได้ยากที่สุด เพราะสังคมลงโทษการหลอกลวงหนักกว่าความผิดพลาด ส่วนการยอมรับผิดและเรียกคืนสินค้าแม้เป็นข่าวลบระยะสั้น แต่กลับสะท้อนความรับผิดชอบที่ช่วยรักษาความเชื่อมั่นระยะยาว", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 80, "q": "สำนักงานแห่งหนึ่งต้องการลดขยะตามหลัก 3R (Reduce Reuse Recycle) การดำเนินการใดจัดลำดับความสำคัญได้ถูกต้องตามหลักการมากที่สุด?", "choices": ["เน้นคัดแยกขยะส่งรีไซเคิลให้ได้มากที่สุด โดยไม่ต้องลดปริมาณการใช้", "สั่งซื้อกระดาษเพิ่มเป็นสองเท่าเพื่อสำรองไว้ใช้ในอนาคต", "ลดการพิมพ์เอกสารด้วยระบบไฟล์ดิจิทัลเป็นอันดับแรก นำกระดาษใช้แล้วหน้าเดียวกลับมาใช้ซ้ำ แล้วจึงคัดแยกส่วนที่เหลือส่งรีไซเคิล", "เผาทำลายเอกสารเก่าทั้งหมดเพื่อลดพื้นที่จัดเก็บในสำนักงาน", "ทิ้งขยะทุกประเภทรวมกันแล้วให้บริษัทรับกำจัดนำไปคัดแยกเองภายหลัง"], "answer": 2, "explanation": "หลัก 3R ให้ความสำคัญกับการลดการใช้ (Reduce) ก่อน ตามด้วยการใช้ซ้ำ (Reuse) และรีไซเคิลเป็นลำดับสุดท้าย เพราะการรีไซเคิลยังใช้พลังงานในการแปรรูป การมุ่งรีไซเคิลอย่างเดียวโดยไม่ลดการใช้จึงเป็นความเข้าใจผิดที่พบบ่อย", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}]}]};</script>
<script>
"use strict";
/* ================= state & storage ================= */
const $ = id => document.getElementById(id);
const store = {
  get(){ try{return JSON.parse(localStorage.getItem("vnet-stats"))||{}}catch(e){return{}} },
  set(d){ localStorage.setItem("vnet-stats", JSON.stringify(d)) }
};
let S = null;         // current quiz session
let timerInt = null;
let muted = localStorage.getItem("vnet-muted")==="1";

/* ================= sounds (WebAudio) ================= */
let actx = null;
function beep(freqs, dur=0.12, type="sine", vol=0.15){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, actx.currentTime + i*dur);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (i+1)*dur);
      o.connect(g).connect(actx.destination);
      o.start(actx.currentTime + i*dur); o.stop(actx.currentTime + (i+1)*dur + .02);
    });
  }catch(e){}
}
const sndGood = ()=>beep([660,880],0.1,"sine",.12);
const sndBad  = ()=>beep([220,180],0.15,"square",.06);
const sndWin  = ()=>beep([523,659,784,1047],0.14,"sine",.14);
const sndClick= ()=>beep([440],0.05,"sine",.05);
function toggleMute(){ muted=!muted; localStorage.setItem("vnet-muted",muted?"1":"0"); $("mutebtn").textContent = muted?"🔇":"🔊"; }

/* ================= home ================= */
function renderHome(){
  const st = store.get();
  const myIds = new Set([...EXAM_DATA.subjects.map(s=>s.id), "mix"]);
  let answered=0, correct=0;
  for(const k in (st.log||{})){ if(!myIds.has(k)) continue; answered += st.log[k].a; correct += st.log[k].c; }
  $("st-total").textContent = EXAM_DATA.subjects.reduce((s,x)=>s+x.questions.length,0);
  $("st-answered").textContent = answered;
  $("st-acc").textContent = answered ? Math.round(correct/answered*100)+"%" : "—";
  $("st-streak").textContent = st.maxStreak||0;

  const g = $("subjects"); g.innerHTML = "";
  EXAM_DATA.subjects.forEach(s=>{
    const best = (st.best||{})[s.id];
    const b = document.createElement("button");
    b.className = "subj";
    b.innerHTML = `<div class="ic">${s.icon}</div><h3>${s.title}</h3><div class="sub">${s.subtitle}</div>
      <div class="meta"><span class="badge">${s.questions.length} ข้อ</span>
      <span class="best">${best!=null ? "🏆 "+best+"%" : "ยังไม่เคยทำ"}</span></div>`;
    b.onclick = ()=>openSetup(s.id);
    g.appendChild(b);
  });
  if(EXAM_DATA.subjects.length < 2) return;
  const grandTotal = EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0);
  const mix = document.createElement("button");
  mix.className = "subj mix";
  const mixBest = (st.best||{})["mix"];
  mix.innerHTML = `<div class="ic">🎲</div><h3>จับฉลากรวมทุกชุด</h3><div class="sub">สุ่มคละจากทั้ง ${grandTotal} ข้อ</div>
    <div class="meta"><span class="badge">ท้าทาย!</span><span class="best">${mixBest!=null?"🏆 "+mixBest+"%":"ยังไม่เคยทำ"}</span></div>`;
  mix.onclick = ()=>openSetup("mix");
  g.appendChild(mix);
}

/* ================= setup modal ================= */
let setup = {n:20, mode:"practice", shuffleQ:true, shuffleC:false, subj:null};
function openSetup(id){
  sndClick();
  setup.subj = id;
  const s = id==="mix" ? {title:"จับฉลากรวมทุกวิชา", subtitle:"คละทุกสมรรถนะ", icon:"🎲",
      questions:{length:EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0)}}
    : EXAM_DATA.subjects.find(x=>x.id===id);
  const total = s.questions.length;
  const counts = [10,20,30,total>=100?50:total].filter((v,i,a)=>v<=total && a.indexOf(v)===i);
  if(!counts.includes(total) && total<=60) counts.push(total);
  setup.n = counts.includes(20)?20:counts[0];
  if(id==="mix") setup.shuffleQ = true;
  $("modal-root").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeSetup()">
    <div class="modal">
      <h2>${s.icon} ${s.title}</h2>
      <div class="sub">${s.subtitle} • มีทั้งหมด ${total} ข้อ</div>
      <div class="optlabel">โหมด</div>
      <div class="optrow" id="mode-row">
        <button class="opt ${setup.mode==="practice"?"sel":""}" onclick="setMode('practice')">📖 ฝึกฝน (เฉลยทันที)</button>
        <button class="opt ${setup.mode==="exam"?"sel":""}" onclick="setMode('exam')">⏱️ สอบเสมือนจริง</button>
      </div>
      <div class="optlabel">จำนวนข้อ</div>
      <div class="optrow" id="count-row">
        ${counts.map(c=>`<button class="opt ${c===setup.n?"sel":""}" onclick="setCount(${c})">${c===total?"ทั้งหมด ("+c+")":c}</button>`).join("")}
      </div>
      <div class="toggle ${setup.shuffleQ?"on":""}" id="tg-q" onclick="tog('shuffleQ','tg-q')"><span class="box">${setup.shuffleQ?"✓":""}</span> สุ่มลำดับข้อ</div>
      <div class="toggle ${setup.shuffleC?"on":""}" id="tg-c" onclick="tog('shuffleC','tg-c')"><span class="box">${setup.shuffleC?"✓":""}</span> สุ่มลำดับตัวเลือก</div>
      <div class="mrow">
        <button class="btn ghost" onclick="closeSetup()">ยกเลิก</button>
        <button class="btn primary" onclick="startQuiz()">เริ่มเลย 🚀</button>
      </div>
    </div>
  </div>`;
}
function setMode(m){ setup.mode=m; document.querySelectorAll("#mode-row .opt").forEach((b,i)=>b.classList.toggle("sel",(i===0)===(m==="practice"))); sndClick(); }
function setCount(c){ setup.n=c; document.querySelectorAll("#count-row .opt").forEach(b=>b.classList.toggle("sel",b.textContent.includes("("+c+")")||b.textContent.trim()==String(c))); sndClick(); }
function tog(key,id){ setup[key]=!setup[key]; const el=$(id); el.classList.toggle("on",setup[key]); el.querySelector(".box").textContent = setup[key]?"✓":""; sndClick(); }
function closeSetup(){ $("modal-root").innerHTML=""; }

/* ================= quiz engine ================= */
function shuffled(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

function startQuiz(){
  closeSetup();
  let pool, labels;
  if(setup.subj==="mix"){
    pool = EXAM_DATA.subjects.flatMap(s=>s.questions.map(q=>({...q, labels:s.labels, from:s.icon+" "+s.title})));
    labels = null;
  } else {
    const s = EXAM_DATA.subjects.find(x=>x.id===setup.subj);
    pool = s.questions.map(q=>({...q, labels:s.labels, from:""}));
  }
  if(setup.shuffleQ) pool = shuffled(pool);
  pool = pool.slice(0, setup.n);
  pool = pool.map(q=>{
    let idx = q.choices.map((_,i)=>i);
    if(setup.shuffleC) idx = shuffled(idx);
    return {...q, order:idx, picked:null, removed:[]};
  });
  S = { qs:pool, i:0, correct:0, streak:0, maxStreak:0, fifty:3, mode:setup.mode,
        subj:setup.subj, start:Date.now(), done:false };
  $("home").classList.add("hidden"); $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("mutebtn").textContent = muted?"🔇":"🔊";
  $("palette").classList.toggle("hidden", S.mode!=="exam");
  clearInterval(timerInt);
  timerInt = setInterval(()=>{ const t=Math.floor((Date.now()-S.start)/1000);
    $("q-timer").textContent = String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); },500);
  renderQ();
  window.scrollTo(0,0);
}

function renderQ(){
  const q = S.qs[S.i];
  $("q-count").textContent = `${S.i+1}/${S.qs.length}`;
  $("q-score").textContent = `✅ ${S.correct}`;
  $("q-streak").textContent = `🔥 ${S.streak}`;
  $("q-progress").style.width = (S.i/S.qs.length*100)+"%";
  $("q-section").textContent = q.from || q.section || "";
  stopSpeech();
  const audio = parseAudio(q.q);
  $("q-text").textContent = `${S.i+1}. ${audio ? audio.question : q.q}`;
  renderAudioBox(audio, q);
  $("q-expl").innerHTML = "";
  $("nextbtn").classList.add("hidden");
  $("skipbtn").classList.toggle("hidden", S.mode!=="exam");
  $("submitbtn").classList.add("hidden");
  $("fifty").classList.toggle("hidden", S.mode!=="practice");
  $("fifty").disabled = S.fifty<=0;
  $("fifty-n").textContent = "×"+S.fifty;

  const c = $("q-choices"); c.innerHTML = "";
  q.order.forEach((origIdx,pos)=>{
    const b = document.createElement("button");
    b.className = "choice";
    if(q.removed.includes(origIdx)) b.classList.add("dim");
    b.innerHTML = `<span class="lb">${q.labels[pos]}</span><span>${q.choices[origIdx]}</span>`;
    if(S.mode==="exam" && q.picked===origIdx) b.classList.add("picked");
    b.onclick = ()=>pick(origIdx, b);
    c.appendChild(b);
  });
  if(S.mode==="exam"){
    renderPalette();
    if(q.picked!==null || S.i===S.qs.length-1) maybeShowSubmit();
  }
}

/* ===== text-to-speech for listening questions ===== */
const AUDIO_RE = /^\(Audio\)\s*['‘’](.*)['‘’]\s*(?:->|→)\s*(.*)$/s;
function parseAudio(text){
  const m = AUDIO_RE.exec(text);
  return m ? {script:m[1].trim(), question:m[2].trim()} : null;
}
let currentScript = null;
let currentAudioSrc = null;   // mp3 for this question (real voice), if available
let audioEl = null;
function stopSpeech(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  if(audioEl){ audioEl.pause(); audioEl = null; }
  document.querySelectorAll(".playbtn").forEach(b=>b.classList.remove("playing"));
}
let currentUtterance = null; // keep a reference so Chrome doesn't GC it mid-speech
function playAudio(){
  stopSpeech();
  const btnA = document.querySelector(".playbtn");
  if(currentAudioSrc){
    const src = currentAudioSrc.startsWith("data:") ? currentAudioSrc
              : (window.AUDIO_BASE || "audio/") + currentAudioSrc;
    audioEl = new Audio(src);
    audioEl.onplay = ()=>btnA && btnA.classList.add("playing");
    audioEl.onended = ()=>btnA && btnA.classList.remove("playing");
    audioEl.onerror = ()=>{ btnA && btnA.classList.remove("playing"); speakScript(); };
    audioEl.play().catch(()=>speakScript());
    return;
  }
  speakScript();
}
function speakScript(){
  if(!("speechSynthesis" in window) || !currentScript) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(currentScript);
  u.lang = "en-US"; u.rate = 0.92;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x=>x.name==="Samantha") || vs.find(x=>x.lang==="en-US") ||
            vs.find(x=>x.lang && x.lang.startsWith("en"));
  if(v) u.voice = v;
  const btn = document.querySelector(".playbtn");
  u.onstart = ()=>btn && btn.classList.add("playing");
  u.onend = u.onerror = ()=>btn && btn.classList.remove("playing");
  currentUtterance = u;
  // Chrome quirk: speak() immediately after cancel() can be silently dropped
  setTimeout(()=>speechSynthesis.speak(u), 80);
}
function toggleScript(){
  const s = $("q-script"); if(s) s.classList.toggle("hidden");
}
function renderAudioBox(audio, q){
  currentScript = audio ? audio.script : null;
  currentAudioSrc = (audio && q && q.audio) ? q.audio : null;
  const box = $("q-audio");
  if(!audio){ box.innerHTML = ""; return; }
  const ttsOK = currentAudioSrc !== null || "speechSynthesis" in window;
  box.innerHTML = `<div class="audio-box">
    <div class="audio-row">
      <button class="playbtn" onclick="playAudio()">▶️ ฟังเสียง</button>
      <button class="scriptbtn" onclick="toggleScript()">📜 ดูบทพูด</button>
    </div>
    <div class="script hidden" id="q-script">"${audio.script}"</div>
    <div class="audio-hint">${ttsOK ? "ฟังได้หลายรอบ • ลองตอบโดยไม่เปิดบทพูดเพื่อฝึกการฟังจริง" : "เบราว์เซอร์นี้ไม่รองรับเสียงพูด — กด ดูบทพูด เพื่ออ่านแทน"}</div>
  </div>`;
}
function labelOf(q, origIdx){ return q.labels[q.order.indexOf(origIdx)]; }
function pick(idx, btn){
  const q = S.qs[S.i];
  if(S.mode==="practice"){
    if(q.picked!==null) return;
    q.picked = idx;
    const good = idx===q.answer;
    if(good){ S.correct++; S.streak++; S.maxStreak=Math.max(S.maxStreak,S.streak); sndGood();
      if(S.streak>0 && S.streak%5===0){ comboPop("🔥 "+S.streak+" ติด!"); }
    } else { S.streak=0; sndBad(); $("qcard").classList.add("shake"); setTimeout(()=>$("qcard").classList.remove("shake"),400); }
    // reveal
    [...$("q-choices").children].forEach((b,pos)=>{
      const oi = q.order[pos];
      b.disabled = true;
      if(oi===q.answer) b.classList.add("correct");
      else if(oi===idx) b.classList.add("wrong");
    });
    $("q-score").textContent = `✅ ${S.correct}`;
    $("q-streak").textContent = `🔥 ${S.streak}`;
    $("q-expl").innerHTML = `<div class="expl ${good?"good":"bad"}">
      <h4>${good ? "🎉 ถูกต้อง!" : "❌ ยังไม่ถูก — เฉลยคือ "+labelOf(q,q.answer)+"."}</h4>
      <p>${q.explanation || "ไม่มีคำอธิบายเพิ่มเติมสำหรับข้อนี้"}</p></div>`;
    const sc = $("q-script"); if(sc) sc.classList.remove("hidden");
    $("fifty").classList.add("hidden");
    if(S.i===S.qs.length-1){ $("nextbtn").textContent = "ดูสรุปผล 🏁"; }
    $("nextbtn").classList.remove("hidden");
    $("nextbtn").focus();
  } else {
    q.picked = idx; sndClick();
    [...$("q-choices").children].forEach((b,pos)=>b.classList.toggle("picked", q.order[pos]===idx));
    renderPalette(); maybeShowSubmit();
    setTimeout(()=>{ if(S.i<S.qs.length-1){ S.i++; renderQ(); window.scrollTo(0,0);} }, 250);
  }
}

function nextQ(){
  if(S.i>=S.qs.length-1){ finishQuiz(); return; }
  S.i++; renderQ(); window.scrollTo(0,0);
}
function maybeShowSubmit(){
  const allDone = S.qs.every(q=>q.picked!==null);
  $("submitbtn").classList.toggle("hidden", !(allDone || S.i===S.qs.length-1));
}
function renderPalette(){
  const p = $("palette"); p.innerHTML = "";
  S.qs.forEach((q,i)=>{
    const b = document.createElement("button");
    b.className = "pal"+(q.picked!==null?" done":"")+(i===S.i?" cur":"");
    b.textContent = i+1;
    b.onclick = ()=>{ S.i=i; renderQ(); };
    p.appendChild(b);
  });
}
function useFifty(){
  const q = S.qs[S.i];
  if(S.fifty<=0 || q.picked!==null) return;
  S.fifty--;
  const wrongs = shuffled(q.order.filter(i=>i!==q.answer && !q.removed.includes(i))).slice(0,2);
  q.removed.push(...wrongs);
  sndClick(); renderQ();
}
function confirmExit(){
  if(S && !S.done && S.qs.some(q=>q.picked!==null)){
    if(!confirm("ออกจากการทำข้อสอบ? ความคืบหน้ารอบนี้จะหายไป")) return;
  }
  quitToHome();
}
function quitToHome(){
  stopSpeech();
  clearInterval(timerInt); S=null;
  $("quiz").classList.add("hidden"); $("result").classList.add("hidden");
  $("home").classList.remove("hidden");
  renderHome(); window.scrollTo(0,0);
}

/* ================= results ================= */
function finishQuiz(){
  S.done = true;
  stopSpeech();
  clearInterval(timerInt);
  if(S.mode==="exam"){ S.correct = S.qs.filter(q=>q.picked===q.answer).length; }
  const n = S.qs.length, pct = Math.round(S.correct/n*100);
  const secs = Math.floor((Date.now()-S.start)/1000);
  const time = String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0");

  // save stats
  const st = store.get();
  st.best = st.best||{}; st.log = st.log||{};
  if(pct > (st.best[S.subj] ?? -1)) st.best[S.subj] = pct;
  const lg = st.log[S.subj] || {a:0,c:0};
  lg.a += n; lg.c += S.correct; st.log[S.subj] = lg;
  st.maxStreak = Math.max(st.maxStreak||0, S.maxStreak);
  store.set(st);

  const verdict = pct===100 ? ["🏆 สมบูรณ์แบบ!","var(--warn)"]
    : pct>=80 ? ["🌟 เยี่ยมมาก!","var(--good)"]
    : pct>=60 ? ["👍 ผ่านเกณฑ์ ทำได้ดี","var(--brand2)"]
    : pct>=40 ? ["💪 เกือบแล้ว สู้ต่อ!","var(--warn)"]
    : ["📚 ทบทวนอีกนิด แล้วลองใหม่","var(--bad)"];

  const circ = 2*Math.PI*80;
  const wrong = S.qs.filter(q=>q.picked!==q.answer);
  $("quiz").classList.add("hidden");
  const r = $("result");
  r.classList.remove("hidden");
  r.innerHTML = `
  <div class="result">
    <div style="display:flex;justify-content:space-between"><button class="topbtn" onclick="quitToHome()">← หน้าหลัก</button>
    <button class="topbtn" onclick="retry()">🔄 ทำใหม่</button></div>
    <div class="ring">
      <svg width="190" height="190"><circle cx="95" cy="95" r="80" fill="none" stroke="var(--card2)" stroke-width="14"/>
      <circle cx="95" cy="95" r="80" fill="none" stroke="${pct>=60?"var(--good)":pct>=40?"var(--warn)":"var(--bad)"}" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" id="ringbar"/></svg>
      <div class="num"><b>${pct}%</b><span>${S.correct} / ${n} ข้อ</span></div>
    </div>
    <div class="verdict" style="color:${verdict[1]}">${verdict[0]}</div>
    <div class="rstats">
      <div class="stat"><b>⏱️ ${time}</b><span>เวลาที่ใช้</span></div>
      <div class="stat"><b>🔥 ${S.maxStreak}</b><span>ตอบถูกติดกันสูงสุด</span></div>
      <div class="stat"><b>${wrong.length}</b><span>ข้อที่ผิด/ข้าม</span></div>
    </div>
    ${wrong.length ? `<button class="btn primary" style="max-width:320px;margin:0 auto" onclick="$('rev').classList.toggle('hidden')">📖 ทบทวนข้อที่ผิด (${wrong.length})</button>` : ""}
    <div class="review ${S.mode==="exam"?"":"hidden"}" id="rev">
      ${wrong.map(q=>`<div class="rq">
        <div class="st no">✗ ${q.q}</div>
        <p>คำตอบของคุณ: ${q.picked!==null ? labelOf(q,q.picked)+". "+q.choices[q.picked] : "— ไม่ได้ตอบ"}</p>
        <p style="color:var(--good)">เฉลย: ${labelOf(q,q.answer)}. ${q.choices[q.answer]}</p>
        <div class="ex">💡 ${q.explanation || "ไม่มีคำอธิบายเพิ่มเติม"}</div>
      </div>`).join("")}
    </div>
  </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const bar = $("ringbar"); bar.style.transition = "stroke-dashoffset 1.2s ease";
    bar.style.strokeDashoffset = circ*(1-pct/100);
  }));
  if(pct>=80){ sndWin(); confetti(); } else if(pct>=60){ sndWin(); }
  window.scrollTo(0,0);
}
function retry(){ openSetupFromResult(); }
function openSetupFromResult(){ const id=S.subj; quitToHome(); openSetup(id); }

/* ================= fun bits ================= */
function comboPop(text){
  const el = document.createElement("div");
  el.className = "combo-pop"; el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}
function confetti(){
  const cv = $("confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#7c6cff","#4ecdc4","#ffc94d","#ff5d73","#3ddc84"];
  const ps = Array.from({length:140},()=>({
    x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.5,
    w:6+Math.random()*6, h:8+Math.random()*8,
    vy:2+Math.random()*3, vx:(Math.random()-.5)*2, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.2,
    c:colors[Math.floor(Math.random()*colors.length)]
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if(++frames < 260) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* keyboard shortcuts: 1-5 answer, Enter/space next */
document.addEventListener("keydown", e=>{
  if(!S || $("quiz").classList.contains("hidden")) return;
  if(e.key>="1" && e.key<="5"){
    const pos = +e.key-1, btns = $("q-choices").children;
    if(btns[pos] && !btns[pos].disabled) btns[pos].click();
  } else if(e.key==="Enter" && !$("nextbtn").classList.contains("hidden")){ nextQ(); }
});

renderHome();
</script>
