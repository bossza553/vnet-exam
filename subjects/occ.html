<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💼 ความรู้พื้นฐานด้านอาชีพ — ข้อสอบ V-NET 80 ข้อ</title>
<style>
:root{
  --bg:#0f1220; --bg2:#171b30; --card:#1e2340; --card2:#252b4d;
  --text:#eef0ff; --muted:#9aa3c7; --line:#323a63;
  --brand:#7c6cff; --brand2:#4ecdc4; --good:#3ddc84; --bad:#ff5d73; --warn:#ffc94d;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Noto Sans Thai","Segoe UI",sans-serif;
  background:radial-gradient(1200px 800px at 80% -10%,#2a2f55 0%,var(--bg) 55%);
  color:var(--text); min-height:100vh; line-height:1.6;
}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}

/* ===== Home ===== */
.hero{text-align:center;padding:28px 0 20px}
.hero h1{font-size:2rem;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);margin-top:6px}
.statbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;text-align:center;min-width:110px}
.stat b{font-size:1.3rem;display:block}
.stat span{color:var(--muted);font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.subj{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:left;transition:.18s;position:relative;overflow:hidden}
.subj:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 24px rgba(124,108,255,.25)}
.subj .ic{font-size:1.9rem}
.subj h3{font-size:1.02rem;margin:8px 0 2px}
.subj .sub{color:var(--muted);font-size:.8rem}
.subj .meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:.82rem;color:var(--muted)}
.badge{background:var(--bg2);border:1px solid var(--line);padding:2px 10px;border-radius:999px}
.best{color:var(--warn)}
.subj.mix{background:linear-gradient(135deg,#3b2f7a,#1c5f5a);border-color:#6a5cff}

/* ===== Setup modal ===== */
.overlay{position:fixed;inset:0;background:rgba(8,10,20,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:20px;max-width:440px;width:100%;padding:24px}
.modal h2{font-size:1.2rem;margin-bottom:2px}
.modal .sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.optlabel{font-size:.85rem;color:var(--muted);margin:14px 0 6px}
.optrow{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:.9rem}
.opt.sel{background:var(--brand);border-color:var(--brand);font-weight:700}
.toggle{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.9rem;color:var(--muted);cursor:pointer;user-select:none}
.toggle .box{width:20px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.toggle.on .box{background:var(--good);border-color:var(--good);color:#08331c}
.mrow{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:12px;border-radius:12px;font-size:1rem;font-weight:700}
.btn.primary{background:linear-gradient(90deg,var(--brand),#9b8cff);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line)}

/* ===== Quiz ===== */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qtop .left{display:flex;gap:8px;align-items:center}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.85rem}
.pill.flame{border-color:#ff8c42;color:#ffb347}
.pill.timer{min-width:84px;text-align:center}
.progress{height:8px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.qsec{color:var(--brand2);font-size:.78rem;margin-bottom:6px}
.qtext{font-size:1.08rem;font-weight:600;white-space:pre-wrap}
.choices{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-size:.97rem;transition:.15s;width:100%}
.choice:not(:disabled):hover{border-color:var(--brand)}
.choice .lb{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.choice.correct{border-color:var(--good);background:rgba(61,220,132,.12)}
.choice.correct .lb{background:var(--good);color:#06301a;border-color:var(--good)}
.choice.wrong{border-color:var(--bad);background:rgba(255,93,115,.12)}
.choice.wrong .lb{background:var(--bad);color:#fff;border-color:var(--bad)}
.choice.picked{border-color:var(--brand);background:rgba(124,108,255,.14)}
.choice.dim{opacity:.28;pointer-events:none}
.expl{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid;animation:pop .25s}
.expl.good{background:rgba(61,220,132,.1);border-color:var(--good)}
.expl.bad{background:rgba(255,93,115,.1);border-color:var(--bad)}
.expl h4{font-size:.95rem;margin-bottom:4px}
.expl p{font-size:.92rem;color:var(--text)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.qactions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.lifeline{background:var(--card);border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:10px 16px;font-weight:700}
.lifeline:disabled{opacity:.35;border-color:var(--line);color:var(--muted)}
.shake{animation:shake .35s}
.audio-box{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
.audio-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.playbtn{background:linear-gradient(90deg,#2e7d6b,var(--brand2));color:#04241f;font-weight:800;border-radius:99px;padding:10px 22px;font-size:1rem;display:inline-flex;align-items:center;gap:8px}
.playbtn.playing{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(78,205,196,.5)}50%{box-shadow:0 0 0 10px rgba(78,205,196,0)}}
.scriptbtn{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:.85rem;color:var(--muted)}
.script{margin-top:12px;border-left:3px solid var(--brand2);padding:6px 12px;font-style:italic;color:var(--muted);font-size:.95rem}
.audio-hint{color:var(--muted);font-size:.78rem;margin-top:8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.combo-pop{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);font-size:2.2rem;font-weight:800;pointer-events:none;z-index:99;animation:rise 1s forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}

/* palette (exam mode) */
.palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.pal{width:34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-size:.8rem}
.pal.done{background:var(--brand);border-color:var(--brand);font-weight:700}
.pal.cur{outline:2px solid var(--brand2)}

/* ===== Results ===== */
.result{text-align:center;padding-top:10px}
.ring{width:190px;height:190px;margin:14px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:2.4rem}
.ring .num span{color:var(--muted);font-size:.85rem}
.verdict{font-size:1.3rem;font-weight:800;margin:4px 0 14px}
.rstats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.review{margin-top:26px;text-align:left}
.review h3{margin-bottom:12px}
.rq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.rq .st{font-weight:700}
.rq .st.ok{color:var(--good)} .rq .st.no{color:var(--bad)}
.rq p{font-size:.9rem;margin-top:4px}
.rq .ex{color:var(--muted);font-size:.86rem;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.topbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.85rem}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.footer-note{text-align:center;color:var(--muted);font-size:.75rem;margin-top:40px}
@media(max-width:520px){ .hero h1{font-size:1.5rem} .qtext{font-size:1rem} }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ HOME ============ -->
  <div id="home">
    <div class="hero">
      <h1>💼 ความรู้พื้นฐานด้านอาชีพ</h1>
      <p>Occupational Fundamentals • 80 ข้อ พร้อมเฉลยและคำอธิบายทุกข้อ</p>
    </div>
    <div class="statbar">
      <div class="stat"><b id="st-total">540</b><span>ข้อสอบทั้งหมด</span></div>
      <div class="stat"><b id="st-answered">0</b><span>ทำไปแล้ว (ครั้ง)</span></div>
      <div class="stat"><b id="st-acc">—</b><span>ความแม่นยำรวม</span></div>
      <div class="stat"><b id="st-streak">0</b><span>สถิติตอบถูกติดกัน</span></div>
    </div>
    <div class="grid" id="subjects"></div>
    <p class="footer-note">แตะวิชาเพื่อเริ่ม • ผลคะแนนบันทึกไว้ในเครื่องอัตโนมัติ</p>
  </div>

  <!-- ============ QUIZ ============ -->
  <div id="quiz" class="hidden">
    <div class="qtop">
      <div class="left">
        <button class="topbtn" onclick="confirmExit()">← ออก</button>
        <span class="pill" id="q-count">1/30</span>
        <span class="pill" id="q-score">✅ 0</span>
      </div>
      <div class="left">
        <span class="pill flame" id="q-streak">🔥 0</span>
        <span class="pill timer" id="q-timer">00:00</span>
        <button class="topbtn" id="mutebtn" onclick="toggleMute()">🔊</button>
      </div>
    </div>
    <div class="progress"><i id="q-progress" style="width:0%"></i></div>
    <div class="qcard" id="qcard">
      <div class="qsec" id="q-section"></div>
      <div class="qtext" id="q-text"></div>
      <div id="q-audio"></div>
      <div class="choices" id="q-choices"></div>
      <div id="q-expl"></div>
      <div class="qactions">
        <button class="lifeline" id="fifty" onclick="useFifty()">✂️ 50:50 <span id="fifty-n">×3</span></button>
        <button class="btn primary hidden" id="nextbtn" onclick="nextQ()">ข้อถัดไป →</button>
        <button class="btn ghost hidden" id="skipbtn" onclick="nextQ()">ข้าม →</button>
        <button class="btn primary hidden" id="submitbtn" onclick="finishQuiz()">ส่งคำตอบ ✅</button>
      </div>
    </div>
    <div class="palette hidden" id="palette"></div>
  </div>

  <!-- ============ RESULT ============ -->
  <div id="result" class="hidden"></div>
</div>

<div id="modal-root"></div>

<script>const EXAM_DATA = {"subjects": [{"id": "occ", "icon": "💼", "title": "ความรู้พื้นฐานด้านอาชีพ", "subtitle": "Occupational Fundamentals", "labels": ["ก", "ข", "ค", "ง", "จ"], "questions": [{"n": 1, "q": "หากองค์กรประกาศปรับเปลี่ยน 'พันธกิจ' (Mission) ไปสู่การเป็นผู้นำด้านเทคโนโลยีสีเขียว พนักงานระดับปฏิบัติการควรปรับตัวอย่างไรจึงจะสอดคล้องกับเป้าหมายองค์กรมากที่สุด?", "choices": ["ทำงานตามหน้าที่เดิมให้ดีที่สุดโดยไม่สนใจการเปลี่ยนแปลง", "เสนอตัวขอย้ายแผนกไปทำงานที่เกี่ยวข้องกับสิ่งแวดล้อมทันที", "ศึกษาความรู้เพิ่มเติมเกี่ยวกับเทคโนโลยีสะอาดที่เกี่ยวข้องกับสายงานของตน", "คอยสังเกตการณ์ว่าเพื่อนร่วมงานคนอื่นทำอย่างไรแล้วค่อยทำตาม", "วิพากษ์วิจารณ์พันธกิจใหม่ว่ายากเกินความสามารถของพนักงาน"], "answer": 2, "explanation": "เมื่อพันธกิจองค์กรเปลี่ยน พนักงานที่ดีควรปรับตัวเชิงรุกด้วยการศึกษาเทคโนโลยีสะอาดที่เกี่ยวข้องกับสายงานของตนโดยตรง เป็นการพัฒนาตนเองให้สอดคล้องกับเป้าหมายใหม่ที่ทำได้จริงทันที ต่างจากการเพิกเฉย (ก, ง) หรือต่อต้าน (จ)", "section": ""}, {"n": 2, "q": "ข้อใดอธิบาย 'คุณค่าของการมีทักษะอาชีพ' ในยุคอุตสาหกรรมที่เน้นระบบอัตโนมัติได้ถูกต้องที่สุด?", "choices": ["ทักษะฝีมือแรงงานจะถูกแทนที่ด้วยหุ่นยนต์ทั้งหมดในอนาคตอันใกล้", "ทักษะอาชีพช่วยให้พนักงานสามารถแก้ไขปัญหาซับซ้อนที่ระบบอัตโนมัติไม่สามารถทำได้", "การมีทักษะเพียงอย่างเดียวทำให้พนักงานมั่นคงกว่าพนักงานที่มีความหลากหลายทางทักษะ", "ทักษะอาชีพมีคุณค่าต่อตัวบุคคลเท่านั้น ไม่ส่งผลต่อกำไรขององค์กร", "ทักษะทางช่างมีความสำคัญน้อยกว่าทักษะทางการตลาดในสถานประกอบการ"], "answer": 1, "explanation": "ระบบอัตโนมัติทำงานซ้ำ ๆ ตามโปรแกรมได้ดี แต่การวิเคราะห์และแก้ปัญหาซับซ้อนหน้างานยังต้องอาศัยทักษะ ประสบการณ์ และดุลยพินิจของมนุษย์ นี่คือคุณค่าที่แท้จริงของทักษะอาชีพในยุคอัตโนมัติ", "section": ""}, {"n": 3, "q": "พนักงานที่มีลักษณะ 'Multi-skill' หรือมีทักษะหลากหลาย มีส่วนช่วยเสริมสร้างเป้าหมายองค์กรในด้านความคล่องตัว (Agility) อย่างไร?", "choices": ["สามารถเข้าทำงานแทนที่เพื่อนร่วมงานที่ลางานได้ในหลายตำแหน่ง", "ช่วยลดการจ้างงานพนักงานใหม่ ทำให้องค์กรประหยัดค่าใช้จ่าย", "ทำให้พนักงานคนเดียวต้องทำงานหนักขึ้นเป็น 2 เท่า", "ช่วยให้กระบวนการผลิตไม่สะดุดเมื่อเกิดการปรับเปลี่ยนสายงานหรือเทคโนโลยี", "ทำให้พนักงานมีความมั่นใจสูงจนไม่ต้องปรึกษาหัวหน้างาน"], "answer": 3, "explanation": "ความคล่องตัว (Agility) หมายถึงความสามารถขององค์กรในการปรับเปลี่ยนได้รวดเร็ว พนักงานที่มีทักษะหลากหลายช่วยให้กระบวนการผลิตดำเนินต่อได้ไม่สะดุดเมื่อมีการปรับสายงานหรือเปลี่ยนเทคโนโลยี ซึ่งตรงกับประเด็นของโจทย์มากกว่าการทำงานแทนเพื่อน (ก) ที่เป็นเพียงประโยชน์เฉพาะหน้า", "section": ""}, {"n": 4, "q": "เมื่อองค์กรเผชิญกับภาวะวิกฤตเศรษฐกิจ พนักงานที่มีเจตคติที่ดีต่อภารกิจองค์กรควรปฏิบัติอย่างไร?", "choices": ["รีบมองหางานใหม่ทันทีเพื่อความมั่นคงของตนเอง", "เสนอแนวทางการลดความสูญเปล่า (Waste) ในส่วนที่ตนเองรับผิดชอบ", "เรียกร้องสวัสดิการเพิ่มขึ้นเพื่อชดเชยความเสี่ยงในการทำงาน", "ทำงานตามปกติแต่ไม่รับผิดชอบงานที่นอกเหนือจากหน้าที่", "เก็บรวบรวมข้อมูลภายในเพื่อนำไปเปรียบเทียบกับบริษัทอื่น"], "answer": 1, "explanation": "เจตคติที่ดีต่อภารกิจองค์กรคือการช่วยองค์กรฝ่าวิกฤตในส่วนที่ตนรับผิดชอบ การเสนอแนวทางลดความสูญเปล่า (Waste) เป็นการช่วยลดต้นทุนอย่างสร้างสรรค์และเป็นรูปธรรม", "section": ""}, {"n": 5, "q": "การประยุกต์ใช้ทักษะพื้นฐานด้านการคิดเชิงวิพากษ์ (Critical Thinking) ในงานอาชีพ ก่อให้เกิดผลลัพธ์ใดมากที่สุด?", "choices": ["การทำตามคำสั่งของหัวหน้างานอย่างเคร่งครัดโดยไม่สงสัย", "การตั้งคำถามและหาข้อบกพร่องของเพื่อนร่วมงาน", "การวิเคราะห์สาเหตุของปัญหาที่แท้จริงเพื่อหาทางป้องกันไม่ให้เกิดซ้ำ", "การใช้อารมณ์ตัดสินใจเมื่อเกิดเหตุการณ์คับขัน", "การรอให้ปัญหาเกิดขึ้นก่อนแล้วค่อยหาทางแก้ไข"], "answer": 2, "explanation": "หัวใจของการคิดเชิงวิพากษ์คือการวิเคราะห์หาสาเหตุที่แท้จริงของปัญหา (Root Cause) เพื่อป้องกันไม่ให้เกิดซ้ำ ไม่ใช่การจับผิดผู้อื่น (ข) หรือใช้อารมณ์ตัดสิน (ง)", "section": ""}, {"n": 6, "q": "พนักงานควรทำอย่างไรเมื่อพบว่า 'เป้าหมายส่วนตน' ขัดแย้งกับ 'เป้าหมายองค์กร'?", "choices": ["ลาออกทันทีโดยไม่แจ้งล่วงหน้า", "แอบทำงานส่วนตัวในเวลางานเพื่อให้เป้าหมายส่วนตนบรรลุ", "พยายามหาจุดร่วมที่สามารถพัฒนาทักษะตนเองไปพร้อมกับงานขององค์กร", "พยายามชักชวนเพื่อนร่วมงานให้ต่อต้านเป้าหมายองค์กร", "ละทิ้งเป้าหมายส่วนตนและทำตามองค์กรแบบไม่มีความสุข"], "answer": 2, "explanation": "แนวทางที่สร้างสรรค์ที่สุดคือการหาจุดร่วม (Win-Win) ที่ทำให้ได้พัฒนาทักษะตนเองไปพร้อมกับการทำงานให้องค์กร ทั้งสองเป้าหมายจึงเดินหน้าไปด้วยกันได้อย่างมีความสุข", "section": ""}, {"n": 7, "q": "ในการทำงานอาชีพ 'การสร้างมูลค่าเพิ่ม' (Value Added) ให้กับงานที่ทำ หมายถึงข้อใด?", "choices": ["การขอขึ้นราคาสินค้าหรือบริการโดยไม่พัฒนาคุณภาพ", "การทำงานให้เสร็จเร็วขึ้นแต่คุณภาพลดลงครึ่งหนึ่ง", "การใส่ใจในรายละเอียดและการบริการที่ทำให้ลูกค้าประทับใจเกินความคาดหมาย", "การโฆษณาชวนเชื่อให้สินค้าดูดีเกินความเป็นจริง", "การลดจำนวนพนักงานเพื่อลดต้นทุนการผลิต"], "answer": 2, "explanation": "มูลค่าเพิ่ม (Value Added) คือคุณค่าที่ลูกค้าได้รับเกินความคาดหมาย ซึ่งเกิดจากความใส่ใจในรายละเอียดและคุณภาพการบริการ ไม่ใช่การขึ้นราคาโดยไม่พัฒนา (ก) หรือโฆษณาเกินจริง (ง)", "section": ""}, {"n": 8, "q": "เหตุใดพนักงานระดับปฏิบัติการจึงจำเป็นต้องเข้าใจ 'โครงสร้างองค์กร'?", "choices": ["เพื่อทราบว่าใครเป็นพนักงานที่ได้รับความไว้วางใจจากผู้บริหารสูงสุด", "เพื่อให้ทราบสายการบังคับบัญชาและการส่งต่อข้อมูลที่ถูกต้อง", "เพื่อหลีกเลี่ยงการพบปะกับผู้บริหารระดับสูง", "เพื่อเปรียบเทียบภาระหน้าที่ของตนเองกับแผนกอื่นเพื่อเรียกร้องค่าจ้าง", "เพื่อทราบรายได้ของพนักงานในทุกตำแหน่ง"], "answer": 1, "explanation": "โครงสร้างองค์กรแสดงสายการบังคับบัญชา ทำให้พนักงานรายงาน ประสานงาน และส่งต่อข้อมูลได้ถูกคน ถูกลำดับขั้น งานจึงไม่ตกหล่นและไม่ข้ามสายบังคับบัญชา", "section": ""}, {"n": 9, "q": "หากพนักงานอาชีวศึกษาต้องการมีส่วนร่วมในเป้าหมาย 'นวัตกรรม' ขององค์กร ข้อใดคือจุดเริ่มต้นที่เหมาะสมที่สุด?", "choices": ["รอให้องค์กรซื้อเครื่องจักรที่ทันสมัยที่สุดมาให้ใช้งาน", "แอบรื้อเครื่องจักรของบริษัทเพื่อศึกษาโครงสร้างภายใน", "เสนอแนวทางการปรับปรุงกระบวนการทำงานที่ช่วยลดเวลาหรือเพิ่มความปลอดภัย", "เขียนจดหมายร้องเรียนเรื่องระบบการทำงานที่ล้าสมัย", "ลาศึกษาต่อในสาขาที่ไม่เกี่ยวข้องเพื่อเปลี่ยนสายงาน"], "answer": 2, "explanation": "นวัตกรรมเริ่มต้นได้จากจุดเล็ก ๆ ในงานประจำ การเสนอปรับปรุงกระบวนการทำงาน (ตามแนวคิดไคเซ็น) ที่ช่วยลดเวลาหรือเพิ่มความปลอดภัย คือจุดเริ่มต้นที่พนักงานปฏิบัติการทำได้จริง", "section": ""}, {"n": 10, "q": "ข้อใดเป็นทัศนคติที่แสดงถึงความเข้าใจใน 'คุณค่าของงานอาชีพ' อย่างแท้จริง?", "choices": ["งานอาชีพเป็นเพียงวิธีการหารายได้มาเพื่อใช้จ่าย", "งานอาชีพคือการพิสูจน์ว่าตนเองเก่งกว่าผู้อื่น", "งานอาชีพคือการใช้อำนาจหน้าที่เพื่อให้ผู้อื่นยอมรับ", "งานอาชีพคือการสร้างประโยชน์และขับเคลื่อนเศรษฐกิจของสังคม", "งานอาชีพคือภาระที่ต้องทำให้จบไปในแต่ละวัน"], "answer": 3, "explanation": "คุณค่าที่แท้จริงของงานอาชีพคือการสร้างประโยชน์ให้ผู้อื่นและร่วมขับเคลื่อนเศรษฐกิจของสังคม มุมมองนี้ทำให้เกิดความภาคภูมิใจในวิชาชีพ ต่างจากการมองเป็นเพียงรายได้ (ก) หรือภาระ (จ)", "section": ""}, {"n": 11, "q": "หากพนักงานพบว่ากฎระเบียบด้านความปลอดภัยบางข้อทำให้ทำงานได้ช้าลง พนักงานควรปฏิบัติอย่างไรตามหลักวินัยและจรรยาบรรณ?", "choices": ["ละเว้นการปฏิบัติตามกฎข้อนั้นเพื่อให้งานเสร็จตามกำหนด", "แอบทำผิดกฎเฉพาะตอนที่หัวหน้างานไม่อยู่", "ปฏิบัติตามกฎอย่างเคร่งครัดและรวบรวมข้อมูลเพื่อเสนอแนวทางปรับปรุงกฎให้เหมาะสม", "บอกเพื่อนร่วมงานคนอื่นให้ไม่ต้องทำตามกฎข้อนั้นด้วยกัน", "ประชดด้วยการหยุดทำงานจนกว่ากฎจะถูกแก้ไข"], "answer": 2, "explanation": "หลักวินัยคือต้องปฏิบัติตามกฎที่ยังมีผลบังคับอยู่ก่อนเสมอ หากเห็นว่ากฎควรปรับปรุง ให้รวบรวมข้อมูลและเสนอผ่านช่องทางที่ถูกต้อง ไม่ใช่ละเมิดกฎเอง (ก, ข) ซึ่งอาจนำไปสู่อุบัติเหตุ", "section": ""}, {"n": 12, "q": "การกระทำในข้อใดถือว่าเป็นการ 'ทุจริตต่อหน้าที่' แม้จะไม่ได้ขโมยเงินของบริษัท?", "choices": ["การลากิจเพื่อไปดูแลพ่อแม่ที่เจ็บป่วยตามสิทธิ์ที่มี", "การนำข้อมูลความลับของบริษัทไปขายให้บริษัทคู่แข่ง", "การเสนอความคิดเห็นที่แตกต่างจากผู้บริหารในที่ประชุม", "การขอใช้วัสดุที่เหลือทิ้งแล้วอย่างถูกต้องตามขั้นตอน", "การลืมลงเวลาเข้าทำงานแต่แจ้งหัวหน้าทันทีที่รู้ตัว"], "answer": 1, "explanation": "การนำข้อมูลความลับของบริษัทไปขายให้คู่แข่งคือการใช้ตำแหน่งหน้าที่แสวงหาประโยชน์โดยมิชอบ ถือเป็นการทุจริตต่อหน้าที่ที่สร้างความเสียหายร้ายแรง แม้ไม่ได้ขโมยเงินโดยตรง", "section": ""}, {"n": 13, "q": "สัญลักษณ์ความปลอดภัยประเภท 'เครื่องหมายเตือน' (Warning Sign) มักใช้สีคู่กับรูปร่างใด?", "choices": ["วงกลมสีแดง", "สี่เหลี่ยมสีเขียว", "สามเหลี่ยมสีเหลือง", "วงกลมสีน้ำเงิน", "กากบาทสีแดง"], "answer": 2, "explanation": "ตามมาตรฐานสากล (ISO 3864) เครื่องหมายเตือนใช้รูปสามเหลี่ยมพื้นสีเหลือง ขอบและสัญลักษณ์สีดำ ส่วนวงกลมสีแดงคือเครื่องหมายห้าม วงกลมสีน้ำเงินคือเครื่องหมายบังคับ และสี่เหลี่ยมสีเขียวคือเครื่องหมายแสดงสภาวะปลอดภัย", "section": ""}, {"n": 14, "q": "ข้อใดคือการสร้าง 'วินัยในตนเอง' (Self-Discipline) ที่ส่งผลต่อคุณภาพงานมากที่สุด?", "choices": ["การทำงานเฉพาะเมื่อถูกหัวหน้างานจับตามองเท่านั้น", "การตรวจสอบความถูกต้องของงานทุกขั้นตอนด้วยตนเองอย่างสม่ำเสมอ", "การอาสาทำงานให้คนอื่นเพื่อสร้างภาพลักษณ์ที่ดี", "การเข้างานเช้ากว่ากำหนดแต่กลับก่อนเวลาเสมอ", "การทำงานที่ง่ายก่อนเสมอเพื่อเพิ่มสถิติงานที่ทำเสร็จ"], "answer": 1, "explanation": "วินัยในตนเองคือการทำสิ่งที่ถูกต้องอย่างสม่ำเสมอโดยไม่ต้องมีผู้ควบคุม การตรวจสอบความถูกต้องของงานทุกขั้นตอนด้วยตนเองส่งผลโดยตรงต่อคุณภาพของงานมากที่สุด", "section": ""}, {"n": 15, "q": "พนักงานควรปฏิบัติอย่างไรเมื่อได้รับ 'ของกำนัล' จากลูกค้าที่มีมูลค่าสูงและอาจมีผลต่อการตัดสินใจสั่งซื้อของบริษัท?", "choices": ["รับไว้ทันทีเพราะเป็นสินน้ำใจจากการบริการที่ดี", "รับไว้แต่ขอให้ลูกค้าไม่บอกพนักงานคนอื่น", "ปฏิเสธอย่างสุภาพและแจ้งว่าเป็นนโยบายของบริษัทที่ไม่ให้รับของกำนัล", "รับไว้แล้วนำไปแบ่งให้หัวหน้างานเพื่อไม่ให้ตนเองผิดคนเดียว", "ขอเปลี่ยนเป็นเงินสดเพื่อนำไปบริจาคการกุศล"], "answer": 2, "explanation": "ของกำนัลมูลค่าสูงที่อาจมีผลต่อการตัดสินใจทางธุรกิจเข้าข่ายผลประโยชน์ทับซ้อน (Conflict of Interest) จึงต้องปฏิเสธอย่างสุภาพโดยอ้างอิงนโยบายของบริษัท เพื่อรักษาความซื่อสัตย์และความเป็นธรรม", "section": ""}, {"n": 16, "q": "ระบบ 'Lockout/Tagout' (LOTO) ในโรงงานอุตสาหกรรมมีความสำคัญอย่างไรด้านความปลอดภัย?", "choices": ["เพื่อป้องกันขโมยเข้ามาใช้เครื่องจักรในยามวิกฤต", "เพื่อช่วยลดค่าไฟฟ้าจากการเปิดเครื่องจักรทิ้งไว้", "เพื่อป้องกันไม่ให้มีการเปิดเครื่องจักรขณะพนักงานกำลังซ่อมบำรุง", "เพื่อระบุชื่อพนักงานที่ทำงานได้ดีที่สุดในกะนั้น", "เพื่อใช้ในการเช็คชื่อพนักงานเข้าทำงานรายวัน"], "answer": 2, "explanation": "ระบบ Lockout/Tagout คือการล็อกและแขวนป้ายที่แหล่งจ่ายพลังงานของเครื่องจักร เพื่อป้องกันไม่ให้ผู้ใดเปิดเครื่องโดยไม่ตั้งใจขณะมีพนักงานกำลังซ่อมบำรุง ซึ่งอาจเกิดอันตรายถึงชีวิต", "section": ""}, {"n": 17, "q": "พนักงานที่แอบใช้คอมพิวเตอร์และอินเทอร์เน็ตของบริษัทในการ 'ขุดเหรียญดิจิทัล' (Crypto Mining) ถือว่าผิดกฎระเบียบในข้อใดร้ายแรงที่สุด?", "choices": ["ผิดกฎเรื่องการประหยัดพลังงาน", "ผิดกฎเรื่องการรักษาความสะอาดโต๊ะทำงาน", "ผิดวินัยร้ายแรงเรื่องการใช้ทรัพย์สินบริษัทเพื่อประโยชน์ส่วนตัว", "ผิดกฎระเบียบการแต่งกาย", "ผิดมารยาทในการใช้เสียงในที่ทำงาน"], "answer": 2, "explanation": "การแอบใช้คอมพิวเตอร์ ไฟฟ้า และอินเทอร์เน็ตของบริษัทขุดเหรียญดิจิทัลเป็นการนำทรัพย์สินขององค์กรไปแสวงหาประโยชน์ส่วนตัวโดยมิชอบ ถือเป็นความผิดวินัยร้ายแรงที่สุดในบรรดาตัวเลือกทั้งหมด", "section": ""}, {"n": 18, "q": "พนักงานที่มี 'วินัยด้านความปลอดภัย' ขั้นสูง จะมีพฤติกรรมอย่างไร?", "choices": ["สวมหมวกนิรภัยเฉพาะตอนเดินผ่านป้ายเตือนเท่านั้น", "ไม่ใช้ทางหนีไฟเพราะกลัวจะทำให้บันไดสึกหรอ", "รายงานความเสี่ยงที่อาจเกิดขึ้นแม้จะยังไม่เกิดอุบัติเหตุ (Near Miss)", "พยายามทำงานคนเดียวในที่อับอากาศเพื่อพิสูจน์ความกล้า", "เชื่อมั่นในประสบการณ์จนไม่ยอมอ่านคู่มือความปลอดภัย"], "answer": 2, "explanation": "วัฒนธรรมความปลอดภัยขั้นสูงเน้นการป้องกันเชิงรุก การรายงานเหตุการณ์เกือบเกิดอุบัติเหตุ (Near Miss) ช่วยให้องค์กรกำจัดความเสี่ยงได้ก่อนที่จะกลายเป็นอุบัติเหตุจริง", "section": ""}, {"n": 19, "q": "ความซื่อสัตย์สุจริตต่อ 'ข้อมูล' (Data Integrity) ของช่างตรวจสภาพรถยนต์คือข้อใด?", "choices": ["การจดบันทึกเฉพาะจุดที่ซ่อมเสร็จแล้วเท่านั้น", "การแก้ไขรายงานการตรวจสภาพเพื่อให้รถผ่านเกณฑ์มาตรฐาน", "การรายงานค่าที่วัดได้ตามจริง แม้ค่าจะออกมาไม่ดีก็ตาม", "การใช้ลายมือที่อ่านยากเพื่อปกปิดความผิดพลาด", "การทำรายงานให้ดูดีที่สุดเพื่อให้ลูกค้าประทับใจ"], "answer": 2, "explanation": "ความซื่อสัตย์ต่อข้อมูล (Data Integrity) คือการบันทึกและรายงานค่าที่วัดได้ตามความเป็นจริง แม้ผลจะออกมาไม่ดี เพราะการแก้ไขรายงานให้รถผ่านเกณฑ์ (ข) อาจนำไปสู่อันตรายร้ายแรงต่อผู้ใช้รถและผู้ร่วมทาง", "section": ""}, {"n": 20, "q": "เหตุใดกฎหมายแรงงานจึงห้ามลูกจ้างทำงานในที่อับอากาศเกินเวลาที่กำหนด?", "choices": ["เพื่อให้นายจ้างประหยัดค่าจ้างล่วงเวลา", "เพื่อป้องกันความเหนื่อยล้าที่อาจนำไปสู่การสะสมของสารพิษในร่างกาย", "เพื่อให้นักศึกษาฝึกงานได้มีโอกาสทำแทน", "เพื่อป้องกันเครื่องจักรที่ทำงานในที่อับอากาศร้อนเกินไป", "เพื่อลดความแออัดในพื้นที่ทำงาน"], "answer": 1, "explanation": "ที่อับอากาศมีการระบายอากาศจำกัด อาจมีออกซิเจนไม่เพียงพอและมีก๊าซหรือสารพิษสะสม การทำงานต่อเนื่องนานเกินไปทำให้ร่างกายอ่อนล้าและรับสารพิษสะสมจนเป็นอันตราย กฎหมายจึงจำกัดเวลาทำงานเพื่อคุ้มครองสุขภาพและชีวิตของลูกจ้าง", "section": ""}, {"n": 21, "q": "พนักงานที่มี 'เจตคติเชิงบวก' เมื่อได้รับคำติชม (Feedback) ที่รุนแรงจากหัวหน้างาน ควรตอบสนองอย่างไร?", "choices": ["เก็บความโกรธไว้แล้วไปนินทาหัวหน้าในภายหลัง", "เถียงกลับทันทีเพื่อปกป้องศักดิ์ศรีของตนเอง", "แยกแยะอารมณ์ออกจากเนื้อหา และนำข้อบกพร่องมาปรับปรุงงาน", "ประชดด้วยการหยุดทำงานที่หัวหน้าติชมทันที", "ร้องไห้และขอลาพักร้อนระยะยาวเพื่อทำใจ"], "answer": 2, "explanation": "เจตคติเชิงบวกคือการแยกอารมณ์ของผู้พูดออกจากเนื้อหาสาระของคำติชม แล้วเลือกนำประเด็นที่เป็นประโยชน์มาปรับปรุงงานของตนเอง ซึ่งทำให้เกิดการพัฒนาอย่างแท้จริง", "section": ""}, {"n": 22, "q": "บทบาทหน้าที่ความรับผิดชอบของพนักงานอาชีวศึกษา 'ระดับฝีมือ' ที่สำคัญที่สุดคือข้อใด?", "choices": ["การสั่งการพนักงานคนอื่นให้ทำงานแทนตนเอง", "การวางแผนนโยบายระยะ 10 ปีของบริษัท", "การปฏิบัติงานให้ถูกต้องตามมาตรฐานฝีมือและปลอดภัย", "การดูแลเรื่องการตลาดและการหาลูกค้าใหม่", "การตรวจสอบประวัติอาชญากรรมของเพื่อนร่วมงาน"], "answer": 2, "explanation": "บทบาทหลักของพนักงานระดับฝีมือคือการปฏิบัติงานให้ถูกต้องตามมาตรฐานฝีมือและปลอดภัย ส่วนการวางแผนนโยบายระยะยาว (ข) เป็นบทบาทของผู้บริหารระดับสูง", "section": ""}, {"n": 23, "q": "พฤติกรรมใดแสดงถึง 'ความรับผิดชอบ' ต่อผลรวมของทีม (Team Responsibility)?", "choices": ["ทำงานส่วนของตนให้เสร็จแล้วนั่งดูเพื่อนทำงานหนัก", "ช่วยเหลือและคอยประสานงานกับเพื่อนร่วมงานเพื่อให้งานสำเร็จตามกำหนด", "แย่งงานของคนอื่นมาทำเพื่อเอาความดีความชอบคนเดียว", "โทษเพื่อนร่วมงานทันทีเมื่อมีข้อผิดพลาดเกิดขึ้นในโปรเจกต์", "การไม่แสดงความคิดเห็นใดๆ เพื่อไม่ให้เกิดความขัดแย้ง"], "answer": 1, "explanation": "ความรับผิดชอบต่อทีมวัดกันที่ผลสำเร็จรวมของงาน การช่วยเหลือและประสานงานกับเพื่อนร่วมงานเพื่อให้งานทั้งหมดสำเร็จตามกำหนดจึงเป็นพฤติกรรมของผู้ที่รับผิดชอบต่อทีมอย่างแท้จริง", "section": ""}, {"n": 24, "q": "การมี 'เจตคติที่ดีในการเรียนรู้งานใหม่' (Lifelong Learning) สำคัญอย่างไรในโลกยุคปัจจุบัน?", "choices": ["ช่วยให้บริษัทไม่ต้องจ้างผู้เชี่ยวชาญจากภายนอก", "ทำให้พนักงานมีความเสี่ยงในการตกงานน้อยลงและปรับตัวได้เร็ว", "ช่วยเพิ่มชั่วโมงการทำงานให้มากขึ้นเพื่อโอที", "ทำให้พนักงานสามารถกดดันเรียกเงินเดือนได้ทุกเดือน", "ช่วยลดเวลาพักกลางวันลงเพื่อมาศึกษาหาความรู้"], "answer": 1, "explanation": "ในยุคที่เทคโนโลยีเปลี่ยนแปลงรวดเร็ว ผู้ที่เรียนรู้ตลอดชีวิตจะมีทักษะทันสมัยและปรับตัวได้เร็ว ความเสี่ยงในการตกงานจึงลดลงอย่างมีนัยสำคัญ", "section": ""}, {"n": 25, "q": "เมื่อเกิดความขัดแย้งด้านความคิดเห็นในการทำงานร่วมกัน พนักงานที่มี 'วุฒิภาวะ' ควรทำอย่างไร?", "choices": ["ยึดถือความคิดเห็นของตนเองเป็นหลักเพราะมั่นใจในประสบการณ์", "นำความคิดเห็นที่ขัดแย้งไปโพสต์ลงสื่อสังคมออนไลน์เพื่อหาพวก", "ใช้วิธีการลงคะแนนเสียงโดยไม่ฟังเหตุผลของฝ่ายข้างน้อย", "เปิดใจรับฟังข้อมูลของอีกฝ่ายและหารือเพื่อหาทางออกที่เกิดประโยชน์สูงสุดต่องาน", "ยอมตามอีกฝ่ายทุกอย่างเพื่อตัดรำคาญ"], "answer": 3, "explanation": "ผู้มีวุฒิภาวะจะยึดประโยชน์ของงานเป็นตัวตั้ง เปิดใจรับฟังข้อมูลและเหตุผลของอีกฝ่าย แล้วหารือหาข้อสรุปที่ดีที่สุดต่องาน ไม่ใช้อารมณ์ ไม่ยึดตัวเองเป็นศูนย์กลาง (ก) และไม่ยอมตามโดยไม่มีเหตุผล (จ)", "section": ""}, {"n": 26, "q": "พฤติกรรมใดที่แสดงถึงการมี 'จิตสาธารณะ' (Public Mind) ในที่ทำงาน?", "choices": ["การปิดไฟและเครื่องปรับอากาศในห้องประชุมเมื่อไม่มีผู้ใช้งาน", "การอาสาไปซื้อของใช้ส่วนตัวให้หัวหน้างาน", "การนำอาหารของบริษัทมากินคนเดียวให้หมด", "การจองโต๊ะทำงานที่ดีที่สุดไว้ให้เพื่อนสนิท", "การแอบถ่ายคลิปเพื่อนทำงานผิดพลาดเพื่อความสนุก"], "answer": 0, "explanation": "จิตสาธารณะคือการคำนึงถึงประโยชน์ส่วนรวมโดยไม่ต้องมีใครร้องขอ การปิดไฟและเครื่องปรับอากาศเมื่อไม่มีผู้ใช้งานช่วยประหยัดทรัพยากรส่วนรวมขององค์กร", "section": ""}, {"n": 27, "q": "ความรับผิดชอบด้าน 'ความมั่นคงทางข้อมูล' (Cybersecurity) ของพนักงานระดับปฏิบัติการคือข้อใด?", "choices": ["การเขียนรหัสผ่านติดไว้บนหน้าจอคอมพิวเตอร์เพื่อกันลืม", "การไม่อนุญาตให้ผู้อื่นใช้ยูสเซอร์เนมของตนเองในการเข้าถึงระบบ", "การลงโปรแกรมเกมหรือซอฟต์แวร์เถื่อนในคอมพิวเตอร์บริษัท", "การแชร์รหัสผ่านอีเมลบริษัทให้คนในครอบครัวช่วยตอบงาน", "การปิดระบบแจ้งเตือนไวรัสเพราะรำคาญหน้าจอเด้ง"], "answer": 1, "explanation": "บัญชีผู้ใช้ (Username) เป็นความรับผิดชอบเฉพาะบุคคล การไม่อนุญาตให้ผู้อื่นใช้บัญชีของตนช่วยป้องกันการเข้าถึงข้อมูลโดยมิชอบ และทำให้ระบุตัวผู้กระทำได้ถูกต้องเมื่อเกิดปัญหา", "section": ""}, {"n": 28, "q": "ข้อใดแสดงถึงเจตคติที่ดีต่อ 'การรักษาภาพลักษณ์' ขององค์กรผ่านงานบริการลูกค้า?", "choices": ["การตอบคำถามลูกค้าแบบขอไปทีเพื่อให้จบงานไวๆ", "การกล่าวโทษแผนกอื่นเมื่อลูกค้ามาร้องเรียนเรื่องความล่าช้า", "การแต่งกายที่สุภาพและใช้วาจาที่ให้เกียรติลูกค้าในทุกสถานการณ์", "การขอทิปจากลูกค้าหลังการให้บริการเสร็จสิ้น", "การเลือกให้บริการเฉพาะลูกค้าที่แต่งตัวดูมีฐานะ"], "answer": 2, "explanation": "พนักงานทุกคนคือหน้าตาขององค์กร การแต่งกายสุภาพและใช้วาจาให้เกียรติลูกค้าในทุกสถานการณ์สร้างความประทับใจและรักษาภาพลักษณ์ที่ดีขององค์กรอย่างยั่งยืน", "section": ""}, {"n": 29, "q": "หากพนักงานพบว่าหัวหน้างานสั่งให้ทำในสิ่งที่ 'ผิดต่อความปลอดภัย' พนักงานควรทำอย่างไร?", "choices": ["ทำตามทันทีเพราะหัวหน้าเป็นคนรับผิดชอบ", "ลาออกโดยไม่คุยกับใครเพื่อหนีปัญหา", "ทักท้วงด้วยเหตุผลและข้อมูลความปลอดภัย พร้อมเสนอทางเลือกที่ปลอดภัยกว่า", "แกล้งทำเป็นไม่ได้ยินคำสั่งแล้วเดินหนีไป", "รวบรวมหลักฐานไปแจ้งตำรวจทันทีโดยไม่แจ้งภายในก่อน"], "answer": 2, "explanation": "ความปลอดภัยต้องมาก่อนเสมอ แต่วิธีที่ถูกต้องคือทักท้วงอย่างสร้างสรรค์ด้วยเหตุผลและข้อมูลความปลอดภัย พร้อมเสนอทางเลือกที่ปลอดภัยกว่า ไม่ใช่ทำตามทั้งที่รู้ว่าเสี่ยง (ก) หรือหลีกหนีปัญหา (ข, ง)", "section": ""}, {"n": 30, "q": "การมีเจตคติแบบ 'Growth Mindset' ส่งผลดีต่ออาชีพช่างอย่างไร?", "choices": ["เชื่อว่าทักษะที่มีอยู่เดิมดีที่สุดแล้วไม่ต้องเปลี่ยน", "มองว่าความผิดพลาดคือโอกาสในการเรียนรู้และพัฒนาฝีมือ", "เชื่อว่าพรสวรรค์สำคัญกว่าการฝึกฝน", "พยายามทำงานให้ยากเข้าไว้เพื่อให้ผู้อื่นทำตามไม่ได้", "มองว่าการเข้าอบรมเป็นเรื่องเสียเวลาทำงาน"], "answer": 1, "explanation": "Growth Mindset คือความเชื่อว่าความสามารถพัฒนาได้ด้วยความพยายามและการฝึกฝน ผู้มีแนวคิดนี้จึงมองความผิดพลาดเป็นโอกาสเรียนรู้เพื่อพัฒนาฝีมือ ไม่ใช่ความล้มเหลวถาวร", "section": ""}, {"n": 31, "q": "พฤติกรรมในข้อใดแสดงถึงความรับผิดชอบต่อ 'สิ่งแวดล้อม' ในกระบวนการผลิตงานช่างได้ดีที่สุด?", "choices": ["การล้างทำความสะอาดเครื่องมือด้วยน้ำปริมาณมากเพื่อให้สะอาดที่สุด", "การเผาทำลายขยะที่เป็นเศษพลาสติกหลังเลิกงาน", "การนำเศษวัสดุที่เหลือจากการทำงานมาประยุกต์ใช้ใหม่หรือคัดแยกอย่างถูกต้อง", "การทิ้งแบตเตอรี่เก่าปนกับขยะทั่วไปในถังขยะชุมชน", "การใช้น้ำยาทำความสะอาดที่มีฤทธิ์กัดกร่อนสูงเพื่อความรวดเร็ว"], "answer": 2, "explanation": "ตามหลัก 3R (Reduce–Reuse–Recycle) การนำเศษวัสดุมาประยุกต์ใช้ใหม่และคัดแยกขยะอย่างถูกต้องช่วยลดขยะและลดการใช้ทรัพยากรใหม่ ต่างจากการเผา (ข) หรือทิ้งแบตเตอรี่ปนขยะทั่วไป (ง) ที่สร้างมลพิษโดยตรง", "section": ""}, {"n": 32, "q": "การเสริมสร้างภาพลักษณ์องค์กรผ่าน 'สื่อสังคมออนไลน์' ของพนักงาน ข้อใดคือแนวทางที่เหมาะสม?", "choices": ["การโพสต์บ่นเรื่องเงินเดือนและหัวหน้างานในพื้นที่สาธารณะ", "การแชร์ภาพผลงานที่ตนเองทำสำเร็จด้วยความภูมิใจ (โดยไม่เปิดเผยความลับบริษัท)", "การโพสต์ภาพแอบหลับในที่ทำงานเพื่อความตลกขบขันกับเพื่อน", "การแชร์ข้อมูลภายในที่ยังไม่ได้ประกาศอย่างเป็นทางการเพื่ออวดว่ารู้ก่อน", "การนำสินค้าของบริษัทมาโพสต์ขายตัดราคาแข่งกับตัวแทนจำหน่าย"], "answer": 1, "explanation": "การแชร์ผลงานที่ทำสำเร็จด้วยความภูมิใจโดยไม่เปิดเผยความลับของบริษัท เป็นการสื่อสารเชิงบวกที่ช่วยเสริมภาพลักษณ์ที่ดีให้องค์กรผ่านสื่อสังคมออนไลน์", "section": ""}, {"n": 33, "q": "เหตุใดองค์กรจึงควรส่งเสริมให้พนักงานเข้าไปมีส่วนร่วมกับ 'กิจกรรมจิตอาสา' ในชุมชนโดยรอบ?", "choices": ["เพื่อให้นายจ้างไม่ต้องจ่ายเงินค่าจ้างเต็มวันในวันที่มีกิจกรรม", "เพื่อสร้างความสัมพันธ์ที่ดีและความไว้วางใจระหว่างองค์กรกับชุมชน", "เพื่อหาพนักงานใหม่ราคาถูกจากคนในชุมชน", "เพื่อเป็นการลงโทษพนักงานที่ทำผลงานไม่ถึงเป้า", "เพื่อสร้างความรำคาญใจให้คู่แข่งที่ไม่มีกิจกรรมดังกล่าว"], "answer": 1, "explanation": "กิจกรรมจิตอาสาเป็นส่วนหนึ่งของความรับผิดชอบต่อสังคม (CSR) ช่วยสร้างความสัมพันธ์และความไว้วางใจระหว่างองค์กรกับชุมชน ทำให้องค์กรอยู่ร่วมกับชุมชนได้อย่างยั่งยืน", "section": ""}, {"n": 34, "q": "หากโรงงานตั้งอยู่ใกล้เขตชุมชน พนักงานควรแสดงความรับผิดชอบอย่างไรด้านมลพิษทางเสียง?", "choices": ["เปิดเครื่องจักรทำงานเฉพาะช่วงกลางคืนเพราะคนหลับแล้วไม่เห็น", "เปิดเพลงให้ดังกว่าเสียงเครื่องจักรเพื่อกลบเสียง", "ตรวจสอบและบำรุงรักษาเครื่องจักรไม่ให้มีเสียงดังผิดปกติและติดตั้งอุปกรณ์ลดเสียง", "บอกให้คนในชุมชนย้ายบ้านหนีไปถ้าไม่ชอบเสียงดัง", "ทำงานให้เร็วที่สุดโดยไม่สนใจระดับเสียงเพื่อให้เสียงดังแค่ช่วงเวลาสั้นๆ"], "answer": 2, "explanation": "การแก้ปัญหาที่ต้นเหตุคือการตรวจสอบบำรุงรักษาเครื่องจักรไม่ให้เกิดเสียงดังผิดปกติ และติดตั้งอุปกรณ์ลดเสียง เป็นความรับผิดชอบต่อชุมชนที่ปฏิบัติได้จริงและยั่งยืน", "section": ""}, {"n": 35, "q": "ข้อใดแสดงถึงการเสริมสร้างภาพลักษณ์ขององค์กรด้าน 'ความโปร่งใส'?", "choices": ["การจัดจ้างบริษัทของญาติพนักงานมาทำงานโดยไม่ต้องผ่านการประมูล", "การจัดทำรายงานผลการดำเนินงานที่ระบุข้อมูลกำไรและกิจกรรมเพื่อสังคมตามจริง", "การเก็บข้อมูลข้อร้องเรียนของลูกค้าไว้ไม่ให้ใครเห็น", "การใช้งบประมาณโฆษณาจำนวนมากเพื่อปกปิดข้อผิดพลาดของสินค้า", "การจัดงานเลี้ยงที่หรูหราที่สุดเพื่อให้คนภายนอกคิดว่าบริษัทมั่นคง"], "answer": 1, "explanation": "ความโปร่งใสคือการเปิดเผยข้อมูลตามความเป็นจริงและตรวจสอบได้ การจัดทำรายงานผลการดำเนินงานที่ระบุข้อมูลตามจริงจึงสะท้อนความโปร่งใส ต่างจากการปกปิดข้อร้องเรียน (ค) หรือสร้างภาพ (ง, จ)", "section": ""}, {"n": 36, "q": "พนักงานสามารถมีส่วนร่วมในการ 'ประหยัดทรัพยากรส่วนรวม' ขององค์กรได้อย่างไร?", "choices": ["การนำทรัพยากรของบริษัทไปใช้ที่บ้านเพื่อลดขยะในบริษัท", "การพิมพ์เอกสารด้วยกระดาษที่ใช้แล้วหนึ่งหน้า (Re-use) ในงานร่างเบื้องต้น", "การใช้เครื่องปรับอากาศอุณหภูมิ 18 องศาเพื่อให้พนักงานตื่นตัวตลอดเวลา", "การไม่เปิดไฟในจุดที่ทำงานที่มืดเกินไปเพื่อช่วยบริษัทประหยัดไฟ", "การทิ้งเครื่องมือที่เก่าแล้วเพื่อจะได้ขอเบิกเครื่องมือใหม่ที่ทำงานได้เร็วกว่า"], "answer": 1, "explanation": "การนำกระดาษที่ใช้แล้วหน้าเดียวกลับมาใช้ในงานร่าง (Reuse) ประหยัดทรัพยากรได้จริงโดยไม่กระทบคุณภาพงาน ส่วนการเปิดแอร์ 18 องศา (ค) สิ้นเปลืองพลังงาน และการไม่เปิดไฟในจุดที่มืด (ง) เสี่ยงต่ออุบัติเหตุ", "section": ""}, {"n": 37, "q": "ภาพลักษณ์ที่ดีขององค์กรต่อ 'สิ่งแวดล้อม' มีผลต่อการตัดสินใจของผู้บริโภคยุคใหม่อย่างไร?", "choices": ["ผู้บริโภคส่วนใหญ่มองว่าเป็นเรื่องไกลตัวและสนใจแค่ราคา", "ผู้บริโภคจะยอมจ่ายแพงกว่าเพื่อสนับสนุนองค์กรที่รับผิดชอบต่อโลก", "ผู้บริโภคจะระแวงว่าองค์กรที่ทำกิจกรรมสิ่งแวดล้อมมีสินค้าคุณภาพต่ำ", "ผู้บริโภคจะมองว่าเป็นภาพลวงตาและเลิกอุดหนุนสินค้าทันที", "ไม่มีผลต่อการตัดสินใจใดๆ เลย"], "answer": 1, "explanation": "ผู้บริโภคยุคใหม่ให้ความสำคัญกับสิ่งแวดล้อม และจำนวนมากยินดีจ่ายแพงกว่าเพื่อสนับสนุนสินค้าจากองค์กรที่รับผิดชอบต่อโลก ภาพลักษณ์สีเขียวจึงเป็นข้อได้เปรียบในการแข่งขัน", "section": ""}, {"n": 38, "q": "พฤติกรรมใดของพนักงานอาชีวศึกษาถือเป็น 'ทูตวัฒนธรรม' ที่ดีต่อสังคม?", "choices": ["การขี่รถจักรยานยนต์ดัดแปลงเสียงดังในชุดฟอร์มวิทยาลัย", "การเข้าไปช่วยเหลือคนรถเสียบนท้องถนนด้วยความรู้ทางช่างอย่างสุภาพ", "การชักชวนเพื่อนสถาบันอื่นมาทะเลาะวิวาทเพื่ออวดพลัง", "การนำชุดทำงานไปใส่ในสถานที่ที่ไม่เหมาะสม", "การเดินถือเครื่องมือช่างไปมาในที่สาธารณะเพื่อให้คนเกรงขาม"], "answer": 1, "explanation": "การใช้ความรู้ทางช่างเข้าช่วยเหลือผู้อื่นด้วยความสุภาพ เป็นการแสดงคุณค่าของวิชาชีพต่อสาธารณะ สะท้อนภาพลักษณ์ที่ดีของชาวอาชีวศึกษาต่อสังคม", "section": ""}, {"n": 39, "q": "การจัดการ 'มลพิษทางอากาศ' ในวิชาชีพช่างพ่นสีรถยนต์ที่รับผิดชอบต่อสังคมคือข้อใด?", "choices": ["พ่นสีกลางแจ้งเพื่อให้ลมพัดกลิ่นเจือจางหายไปไวๆ", "พ่นสีเฉพาะตอนที่ฝนตกเพื่อให้น้ำฝนช่วยชะล้างกลิ่น", "ติดตั้งห้องพ่นสีมาตรฐานที่มีระบบกรองฝุ่นและละอองสารเคมีก่อนปล่อยสู่ภายนอก", "ให้พนักงานกลั้นหายใจขณะพ่นสีเพื่อลดปริมาณการสูดดม", "บอกให้พนักงานพ่นสีให้หนาขึ้นจะได้ไม่ต้องพ่นหลายรอบลดจำนวนครั้งของกลิ่น"], "answer": 2, "explanation": "การติดตั้งห้องพ่นสีมาตรฐานที่มีระบบกรองฝุ่นและละอองสารเคมีก่อนปล่อยสู่ภายนอก คือการควบคุมมลพิษที่แหล่งกำเนิด ซึ่งถูกต้องตามหลักวิศวกรรมความปลอดภัยและกฎหมายสิ่งแวดล้อม", "section": ""}, {"n": 40, "q": "ความยั่งยืน (Sustainability) ในงานอาชีพเกิดขึ้นจากปัจจัยใดร่วมกัน?", "choices": ["กำไรสูงสุด + การจ่ายเงินเดือนพนักงานน้อยที่สุด", "กำไรของธุรกิจ + ความผาสุกของพนักงานและชุมชน + การรักษาสิ่งแวดล้อม", "เทคโนโลยีที่ทันสมัยที่สุด + การจ้างงานที่น้อยที่สุด", "การโฆษณาที่ยอดเยี่ยม + การผลิตสินค้าจำนวนมหาศาล", "ความโด่งดังของเจ้าของบริษัท + ยอดไลก์ในเพจเฟซบุ๊ก"], "answer": 1, "explanation": "ความยั่งยืนตั้งอยู่บนหลัก 3 เสา (Triple Bottom Line) ได้แก่ เศรษฐกิจ (กำไรของธุรกิจ) สังคม (ความผาสุกของพนักงานและชุมชน) และสิ่งแวดล้อม ต้องดำเนินไปอย่างสมดุลทั้งสามด้านจึงจะยั่งยืนอย่างแท้จริง", "section": ""}]}, {"id": "digi40", "icon": "💻", "title": "สมรรถนะเทคโนโลยีดิจิทัล (ชุดคัดเลือก)", "subtitle": "Digital Literacy • 40 ข้อคัดจากทั้ง 200", "labels": ["ก", "ข", "ค", "ง", "จ"], "questions": [{"n": 1, "q": "ข้อใดคือหน้าที่หลักของหน่วยประมวลผลกลาง (CPU) ที่เปรียบเสมือนสมองของคอมพิวเตอร์?", "choices": ["เก็บข้อมูลถาวร", "แสดงผลภาพ", "คำนวณและควบคุมการทำงาน", "จ่ายกระแสไฟฟ้า", "เชื่อมต่ออินเทอร์เน็ต"], "answer": 2, "explanation": "CPU ทำหน้าที่คำนวณและควบคุมการทำงานของทุกส่วนในเครื่อง จึงเปรียบเป็นสมองของคอมพิวเตอร์", "section": "ส่วนที่ 1: 8.1 ฮาร์ดแวร์, 8.2 ระบบปฏิบัติการ, 8.3 จัดการข้อมูล, 8.4 สำรองข้อมูล, 8.5 อุปกรณ์เคลื่อนที่"}, {"n": 6, "q": "อุปกรณ์ใดจัดเป็น Input Device ทั้งหมด?", "choices": ["คีย์บอร์ด, เมาส์, สแกนเนอร์", "จอภาพ, ลำโพง, เครื่องพิมพ์", "ไมโครโฟน, หูฟัง, แฟลชไดรฟ์", "จอสัมผัส, โปรเจกเตอร์, เว็บแคม", "พลอตเตอร์, จอยสติ๊ก, บาร์โค้ดรีดเดอร์"], "answer": 0, "explanation": "คีย์บอร์ด เมาส์ สแกนเนอร์ เป็นอุปกรณ์รับข้อมูล (Input) ทั้งหมด ข้ออื่นมีอุปกรณ์แสดงผล (Output) ปนอยู่", "section": "ส่วนที่ 1: 8.1 ฮาร์ดแวร์, 8.2 ระบบปฏิบัติการ, 8.3 จัดการข้อมูล, 8.4 สำรองข้อมูล, 8.5 อุปกรณ์เคลื่อนที่"}, {"n": 11, "q": "ความละเอียดของเครื่องพิมพ์ (Printer) มีหน่วยวัดเป็นอะไร?", "choices": ["Hz (Hertz)", "DPI (Dots Per Inch)", "PPM (Pages Per Minute)", "FPS (Frames Per Second)", "RPM (Revolutions Per Minute)"], "answer": 1, "explanation": "ความละเอียดงานพิมพ์วัดเป็น DPI (จุดต่อนิ้ว) ส่วน PPM คือความเร็วการพิมพ์ต่อนาที", "section": "ส่วนที่ 1: 8.1 ฮาร์ดแวร์, 8.2 ระบบปฏิบัติการ, 8.3 จัดการข้อมูล, 8.4 สำรองข้อมูล, 8.5 อุปกรณ์เคลื่อนที่"}, {"n": 16, "q": "Driver (ไดรเวอร์) มีความสำคัญอย่างไร?", "choices": ["เป็นเฟิร์มแวร์ที่ติดตั้งถาวรมากับฮาร์ดแวร์", "เป็นซอฟต์แวร์ที่ช่วยให้ OS สื่อสารกับฮาร์ดแวร์ได้", "เป็นเกมแข่งรถ", "เป็นไวรัสชนิดหนึ่ง", "เป็นอุปกรณ์ทำความสะอาด"], "answer": 1, "explanation": "Driver คือซอฟต์แวร์ที่ทำให้ระบบปฏิบัติการรู้จักและสั่งงานฮาร์ดแวร์แต่ละชิ้นได้ ไม่ใช่เฟิร์มแวร์ที่ฝังในตัวอุปกรณ์", "section": "ส่วนที่ 1: 8.1 ฮาร์ดแวร์, 8.2 ระบบปฏิบัติการ, 8.3 จัดการข้อมูล, 8.4 สำรองข้อมูล, 8.5 อุปกรณ์เคลื่อนที่"}, {"n": 21, "q": "Windows Update มีความสำคัญที่สุดในด้านใด?", "choices": ["เปลี่ยนหน้าตา Windows ให้สวยงาม", "อุดช่องโหว่ความปลอดภัยและแก้บั๊ก", "ลบโปรแกรมเก่าออก", "เพิ่มพื้นที่ว่างในเครื่อง", "ทำให้เครื่องเล่นเกมลื่นขึ้น"], "answer": 1, "explanation": "ความสำคัญหลักของ Windows Update คือแพตช์อุดช่องโหว่ความปลอดภัยและแก้ไขบั๊กของระบบ", "section": "ส่วนที่ 1: 8.1 ฮาร์ดแวร์, 8.2 ระบบปฏิบัติการ, 8.3 จัดการข้อมูล, 8.4 สำรองข้อมูล, 8.5 อุปกรณ์เคลื่อนที่"}, {"n": 26, "q": "นามสกุลไฟล์ (File Extension) ข้อใดเป็นไฟล์โปรแกรมที่สามารถรันได้ (Executable)?", "choices": [".docx", ".jpg", ".exe", ".mp4", ".pdf"], "answer": 2, "explanation": ".exe (Executable) คือไฟล์โปรแกรมที่รันได้โดยตรง ข้ออื่นเป็นไฟล์เอกสาร ภาพ และวิดีโอ", "section": "ส่วนที่ 1: 8.1 ฮาร์ดแวร์, 8.2 ระบบปฏิบัติการ, 8.3 จัดการข้อมูล, 8.4 สำรองข้อมูล, 8.5 อุปกรณ์เคลื่อนที่"}, {"n": 31, "q": "คุณลักษณะ 3Vs ของ Big Data ประกอบด้วยอะไรบ้าง?", "choices": ["Volume, Velocity, Variety", "Value, Vision, Voice", "Video, Vector, Virtual", "Virus, Vaccine, Verify", "View, Visit, Vote"], "answer": 0, "explanation": "3Vs ของ Big Data คือ Volume (ปริมาณมหาศาล), Velocity (เกิดเร็ว), Variety (หลากหลายรูปแบบ)", "section": "ส่วนที่ 1: 8.1 ฮาร์ดแวร์, 8.2 ระบบปฏิบัติการ, 8.3 จัดการข้อมูล, 8.4 สำรองข้อมูล, 8.5 อุปกรณ์เคลื่อนที่"}, {"n": 36, "q": "ข้อใดไม่ใช่ประโยชน์ของการใช้ Fo <script>
"use strict";
/* ================= state & storage ================= */
const $ = id => document.getElementById(id);
const store = {
  get(){ try{return JSON.parse(localStorage.getItem("vnet-stats"))||{}}catch(e){return{}} },
  set(d){ localStorage.setItem("vnet-stats", JSON.stringify(d)) }
};
let S = null;         // current quiz session
let timerInt = null;
let muted = localStorage.getItem("vnet-muted")==="1";

/* ================= sounds (WebAudio) ================= */
let actx = null;
function beep(freqs, dur=0.12, type="sine", vol=0.15){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, actx.currentTime + i*dur);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (i+1)*dur);
      o.connect(g).connect(actx.destination);
      o.start(actx.currentTime + i*dur); o.stop(actx.currentTime + (i+1)*dur + .02);
    });
  }catch(e){}
}
const sndGood = ()=>beep([660,880],0.1,"sine",.12);
const sndBad  = ()=>beep([220,180],0.15,"square",.06);
const sndWin  = ()=>beep([523,659,784,1047],0.14,"sine",.14);
const sndClick= ()=>beep([440],0.05,"sine",.05);
function toggleMute(){ muted=!muted; localStorage.setItem("vnet-muted",muted?"1":"0"); $("mutebtn").textContent = muted?"🔇":"🔊"; }

/* ================= home ================= */
function renderHome(){
  const st = store.get();
  const myIds = new Set([...EXAM_DATA.subjects.map(s=>s.id), "mix"]);
  let answered=0, correct=0;
  for(const k in (st.log||{})){ if(!myIds.has(k)) continue; answered += st.log[k].a; correct += st.log[k].c; }
  $("st-total").textContent = EXAM_DATA.subjects.reduce((s,x)=>s+x.questions.length,0);
  $("st-answered").textContent = answered;
  $("st-acc").textContent = answered ? Math.round(correct/answered*100)+"%" : "—";
  $("st-streak").textContent = st.maxStreak||0;

  const g = $("subjects"); g.innerHTML = "";
  EXAM_DATA.subjects.forEach(s=>{
    const best = (st.best||{})[s.id];
    const b = document.createElement("button");
    b.className = "subj";
    b.innerHTML = `<div class="ic">${s.icon}</div><h3>${s.title}</h3><div class="sub">${s.subtitle}</div>
      <div class="meta"><span class="badge">${s.questions.length} ข้อ</span>
      <span class="best">${best!=null ? "🏆 "+best+"%" : "ยังไม่เคยทำ"}</span></div>`;
    b.onclick = ()=>openSetup(s.id);
    g.appendChild(b);
  });
  if(EXAM_DATA.subjects.length < 2) return;
  const grandTotal = EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0);
  const mix = document.createElement("button");
  mix.className = "subj mix";
  const mixBest = (st.best||{})["mix"];
  mix.innerHTML = `<div class="ic">🎲</div><h3>จับฉลากรวมทุกชุด</h3><div class="sub">สุ่มคละจากทั้ง ${grandTotal} ข้อ</div>
    <div class="meta"><span class="badge">ท้าทาย!</span><span class="best">${mixBest!=null?"🏆 "+mixBest+"%":"ยังไม่เคยทำ"}</span></div>`;
  mix.onclick = ()=>openSetup("mix");
  g.appendChild(mix);
}

/* ================= setup modal ================= */
let setup = {n:20, mode:"practice", shuffleQ:true, shuffleC:false, subj:null};
function openSetup(id){
  sndClick();
  setup.subj = id;
  const s = id==="mix" ? {title:"จับฉลากรวมทุกวิชา", subtitle:"คละทุกสมรรถนะ", icon:"🎲",
      questions:{length:EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0)}}
    : EXAM_DATA.subjects.find(x=>x.id===id);
  const total = s.questions.length;
  const counts = [10,20,30,total>=100?50:total].filter((v,i,a)=>v<=total && a.indexOf(v)===i);
  if(!counts.includes(total) && total<=60) counts.push(total);
  setup.n = counts.includes(20)?20:counts[0];
  if(id==="mix") setup.shuffleQ = true;
  $("modal-root").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeSetup()">
    <div class="modal">
      <h2>${s.icon} ${s.title}</h2>
      <div class="sub">${s.subtitle} • มีทั้งหมด ${total} ข้อ</div>
      <div class="optlabel">โหมด</div>
      <div class="optrow" id="mode-row">
        <button class="opt ${setup.mode==="practice"?"sel":""}" onclick="setMode('practice')">📖 ฝึกฝน (เฉลยทันที)</button>
        <button class="opt ${setup.mode==="exam"?"sel":""}" onclick="setMode('exam')">⏱️ สอบเสมือนจริง</button>
      </div>
      <div class="optlabel">จำนวนข้อ</div>
      <div class="optrow" id="count-row">
        ${counts.map(c=>`<button class="opt ${c===setup.n?"sel":""}" onclick="setCount(${c})">${c===total?"ทั้งหมด ("+c+")":c}</button>`).join("")}
      </div>
      <div class="toggle ${setup.shuffleQ?"on":""}" id="tg-q" onclick="tog('shuffleQ','tg-q')"><span class="box">${setup.shuffleQ?"✓":""}</span> สุ่มลำดับข้อ</div>
      <div class="toggle ${setup.shuffleC?"on":""}" id="tg-c" onclick="tog('shuffleC','tg-c')"><span class="box">${setup.shuffleC?"✓":""}</span> สุ่มลำดับตัวเลือก</div>
      <div class="mrow">
        <button class="btn ghost" onclick="closeSetup()">ยกเลิก</button>
        <button class="btn primary" onclick="startQuiz()">เริ่มเลย 🚀</button>
      </div>
    </div>
  </div>`;
}
function setMode(m){ setup.mode=m; document.querySelectorAll("#mode-row .opt").forEach((b,i)=>b.classList.toggle("sel",(i===0)===(m==="practice"))); sndClick(); }
function setCount(c){ setup.n=c; document.querySelectorAll("#count-row .opt").forEach(b=>b.classList.toggle("sel",b.textContent.includes("("+c+")")||b.textContent.trim()==String(c))); sndClick(); }
function tog(key,id){ setup[key]=!setup[key]; const el=$(id); el.classList.toggle("on",setup[key]); el.querySelector(".box").textContent = setup[key]?"✓":""; sndClick(); }
function closeSetup(){ $("modal-root").innerHTML=""; }

/* ================= quiz engine ================= */
function shuffled(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

function startQuiz(){
  closeSetup();
  let pool, labels;
  if(setup.subj==="mix"){
    pool = EXAM_DATA.subjects.flatMap(s=>s.questions.map(q=>({...q, labels:s.labels, from:s.icon+" "+s.title})));
    labels = null;
  } else {
    const s = EXAM_DATA.subjects.find(x=>x.id===setup.subj);
    pool = s.questions.map(q=>({...q, labels:s.labels, from:""}));
  }
  if(setup.shuffleQ) pool = shuffled(pool);
  pool = pool.slice(0, setup.n);
  pool = pool.map(q=>{
    let idx = q.choices.map((_,i)=>i);
    if(setup.shuffleC) idx = shuffled(idx);
    return {...q, order:idx, picked:null, removed:[]};
  });
  S = { qs:pool, i:0, correct:0, streak:0, maxStreak:0, fifty:3, mode:setup.mode,
        subj:setup.subj, start:Date.now(), done:false };
  $("home").classList.add("hidden"); $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("mutebtn").textContent = muted?"🔇":"🔊";
  $("palette").classList.toggle("hidden", S.mode!=="exam");
  clearInterval(timerInt);
  timerInt = setInterval(()=>{ const t=Math.floor((Date.now()-S.start)/1000);
    $("q-timer").textContent = String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); },500);
  renderQ();
  window.scrollTo(0,0);
}

function renderQ(){
  const q = S.qs[S.i];
  $("q-count").textContent = `${S.i+1}/${S.qs.length}`;
  $("q-score").textContent = `✅ ${S.correct}`;
  $("q-streak").textContent = `🔥 ${S.streak}`;
  $("q-progress").style.width = (S.i/S.qs.length*100)+"%";
  $("q-section").textContent = q.from || q.section || "";
  stopSpeech();
  const audio = parseAudio(q.q);
  $("q-text").textContent = `${S.i+1}. ${audio ? audio.question : q.q}`;
  renderAudioBox(audio);
  $("q-expl").innerHTML = "";
  $("nextbtn").classList.add("hidden");
  $("skipbtn").classList.toggle("hidden", S.mode!=="exam");
  $("submitbtn").classList.add("hidden");
  $("fifty").classList.toggle("hidden", S.mode!=="practice");
  $("fifty").disabled = S.fifty<=0;
  $("fifty-n").textContent = "×"+S.fifty;

  const c = $("q-choices"); c.innerHTML = "";
  q.order.forEach((origIdx,pos)=>{
    const b = document.createElement("button");
    b.className = "choice";
    if(q.removed.includes(origIdx)) b.classList.add("dim");
    b.innerHTML = `<span class="lb">${q.labels[pos]}</span><span>${q.choices[origIdx]}</span>`;
    if(S.mode==="exam" && q.picked===origIdx) b.classList.add("picked");
    b.onclick = ()=>pick(origIdx, b);
    c.appendChild(b);
  });
  if(S.mode==="exam"){
    renderPalette();
    if(q.picked!==null || S.i===S.qs.length-1) maybeShowSubmit();
  }
}

/* ===== text-to-speech for listening questions ===== */
const AUDIO_RE = /^\(Audio\)\s*['‘’](.*)['‘’]\s*(?:->|→)\s*(.*)$/s;
function parseAudio(text){
  const m = AUDIO_RE.exec(text);
  return m ? {script:m[1].trim(), question:m[2].trim()} : null;
}
let currentScript = null;
function stopSpeech(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  document.querySelectorAll(".playbtn").forEach(b=>b.classList.remove("playing"));
}
let currentUtterance = null; // keep a reference so Chrome doesn't GC it mid-speech
function playAudio(){
  if(!("speechSynthesis" in window) || !currentScript) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(currentScript);
  u.lang = "en-US"; u.rate = 0.92;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x=>x.name==="Samantha") || vs.find(x=>x.lang==="en-US") ||
            vs.find(x=>x.lang && x.lang.startsWith("en"));
  if(v) u.voice = v;
  const btn = document.querySelector(".playbtn");
  u.onstart = ()=>btn && btn.classList.add("playing");
  u.onend = u.onerror = ()=>btn && btn.classList.remove("playing");
  currentUtterance = u;
  // Chrome quirk: speak() immediately after cancel() can be silently dropped
  setTimeout(()=>speechSynthesis.speak(u), 80);
}
function toggleScript(){
  const s = $("q-script"); if(s) s.classList.toggle("hidden");
}
function renderAudioBox(audio){
  currentScript = audio ? audio.script : null;
  const box = $("q-audio");
  if(!audio){ box.innerHTML = ""; return; }
  const ttsOK = "speechSynthesis" in window;
  box.innerHTML = `<div class="audio-box">
    <div class="audio-row">
      <button class="playbtn" onclick="playAudio()">▶️ ฟังเสียง</button>
      <button class="scriptbtn" onclick="toggleScript()">📜 ดูบทพูด</button>
    </div>
    <div class="script hidden" id="q-script">"${audio.script}"</div>
    <div class="audio-hint">${ttsOK ? "ฟังได้หลายรอบ • ลองตอบโดยไม่เปิดบทพูดเพื่อฝึกการฟังจริง" : "เบราว์เซอร์นี้ไม่รองรับเสียงพูด — กด ดูบทพูด เพื่ออ่านแทน"}</div>
  </div>`;
}
function labelOf(q, origIdx){ return q.labels[q.order.indexOf(origIdx)]; }
function pick(idx, btn){
  const q = S.qs[S.i];
  if(S.mode==="practice"){
    if(q.picked!==null) return;
    q.picked = idx;
    const good = idx===q.answer;
    if(good){ S.correct++; S.streak++; S.maxStreak=Math.max(S.maxStreak,S.streak); sndGood();
      if(S.streak>0 && S.streak%5===0){ comboPop("🔥 "+S.streak+" ติด!"); }
    } else { S.streak=0; sndBad(); $("qcard").classList.add("shake"); setTimeout(()=>$("qcard").classList.remove("shake"),400); }
    // reveal
    [...$("q-choices").children].forEach((b,pos)=>{
      const oi = q.order[pos];
      b.disabled = true;
      if(oi===q.answer) b.classList.add("correct");
      else if(oi===idx) b.classList.add("wrong");
    });
    $("q-score").textContent = `✅ ${S.correct}`;
    $("q-streak").textContent = `🔥 ${S.streak}`;
    $("q-expl").innerHTML = `<div class="expl ${good?"good":"bad"}">
      <h4>${good ? "🎉 ถูกต้อง!" : "❌ ยังไม่ถูก — เฉลยคือ "+labelOf(q,q.answer)+"."}</h4>
      <p>${q.explanation || "ไม่มีคำอธิบายเพิ่มเติมสำหรับข้อนี้"}</p></div>`;
    const sc = $("q-script"); if(sc) sc.classList.remove("hidden");
    $("fifty").classList.add("hidden");
    if(S.i===S.qs.length-1){ $("nextbtn").textContent = "ดูสรุปผล 🏁"; }
    $("nextbtn").classList.remove("hidden");
    $("nextbtn").focus();
  } else {
    q.picked = idx; sndClick();
    [...$("q-choices").children].forEach((b,pos)=>b.classList.toggle("picked", q.order[pos]===idx));
    renderPalette(); maybeShowSubmit();
    setTimeout(()=>{ if(S.i<S.qs.length-1){ S.i++; renderQ(); window.scrollTo(0,0);} }, 250);
  }
}

function nextQ(){
  if(S.i>=S.qs.length-1){ finishQuiz(); return; }
  S.i++; renderQ(); window.scrollTo(0,0);
}
function maybeShowSubmit(){
  const allDone = S.qs.every(q=>q.picked!==null);
  $("submitbtn").classList.toggle("hidden", !(allDone || S.i===S.qs.length-1));
}
function renderPalette(){
  const p = $("palette"); p.innerHTML = "";
  S.qs.forEach((q,i)=>{
    const b = document.createElement("button");
    b.className = "pal"+(q.picked!==null?" done":"")+(i===S.i?" cur":"");
    b.textContent = i+1;
    b.onclick = ()=>{ S.i=i; renderQ(); };
    p.appendChild(b);
  });
}
function useFifty(){
  const q = S.qs[S.i];
  if(S.fifty<=0 || q.picked!==null) return;
  S.fifty--;
  const wrongs = shuffled(q.order.filter(i=>i!==q.answer && !q.removed.includes(i))).slice(0,2);
  q.removed.push(...wrongs);
  sndClick(); renderQ();
}
function confirmExit(){
  if(S && !S.done && S.qs.some(q=>q.picked!==null)){
    if(!confirm("ออกจากการทำข้อสอบ? ความคืบหน้ารอบนี้จะหายไป")) return;
  }
  quitToHome();
}
function quitToHome(){
  stopSpeech();
  clearInterval(timerInt); S=null;
  $("quiz").classList.add("hidden"); $("result").classList.add("hidden");
  $("home").classList.remove("hidden");
  renderHome(); window.scrollTo(0,0);
}

/* ================= results ================= */
function finishQuiz(){
  S.done = true;
  stopSpeech();
  clearInterval(timerInt);
  if(S.mode==="exam"){ S.correct = S.qs.filter(q=>q.picked===q.answer).length; }
  const n = S.qs.length, pct = Math.round(S.correct/n*100);
  const secs = Math.floor((Date.now()-S.start)/1000);
  const time = String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0");

  // save stats
  const st = store.get();
  st.best = st.best||{}; st.log = st.log||{};
  if(pct > (st.best[S.subj] ?? -1)) st.best[S.subj] = pct;
  const lg = st.log[S.subj] || {a:0,c:0};
  lg.a += n; lg.c += S.correct; st.log[S.subj] = lg;
  st.maxStreak = Math.max(st.maxStreak||0, S.maxStreak);
  store.set(st);

  const verdict = pct===100 ? ["🏆 สมบูรณ์แบบ!","var(--warn)"]
    : pct>=80 ? ["🌟 เยี่ยมมาก!","var(--good)"]
    : pct>=60 ? ["👍 ผ่านเกณฑ์ ทำได้ดี","var(--brand2)"]
    : pct>=40 ? ["💪 เกือบแล้ว สู้ต่อ!","var(--warn)"]
    : ["📚 ทบทวนอีกนิด แล้วลองใหม่","var(--bad)"];

  const circ = 2*Math.PI*80;
  const wrong = S.qs.filter(q=>q.picked!==q.answer);
  $("quiz").classList.add("hidden");
  const r = $("result");
  r.classList.remove("hidden");
  r.innerHTML = `
  <div class="result">
    <div style="display:flex;justify-content:space-between"><button class="topbtn" onclick="quitToHome()">← หน้าหลัก</button>
    <button class="topbtn" onclick="retry()">🔄 ทำใหม่</button></div>
    <div class="ring">
      <svg width="190" height="190"><circle cx="95" cy="95" r="80" fill="none" stroke="var(--card2)" stroke-width="14"/>
      <circle cx="95" cy="95" r="80" fill="none" stroke="${pct>=60?"var(--good)":pct>=40?"var(--warn)":"var(--bad)"}" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" id="ringbar"/></svg>
      <div class="num"><b>${pct}%</b><span>${S.correct} / ${n} ข้อ</span></div>
    </div>
    <div class="verdict" style="color:${verdict[1]}">${verdict[0]}</div>
    <div class="rstats">
      <div class="stat"><b>⏱️ ${time}</b><span>เวลาที่ใช้</span></div>
      <div class="stat"><b>🔥 ${S.maxStreak}</b><span>ตอบถูกติดกันสูงสุด</span></div>
      <div class="stat"><b>${wrong.length}</b><span>ข้อที่ผิด/ข้าม</span></div>
    </div>
    ${wrong.length ? `<button class="btn primary" style="max-width:320px;margin:0 auto" onclick="$('rev').classList.toggle('hidden')">📖 ทบทวนข้อที่ผิด (${wrong.length})</button>` : ""}
    <div class="review ${S.mode==="exam"?"":"hidden"}" id="rev">
      ${wrong.map(q=>`<div class="rq">
        <div class="st no">✗ ${q.q}</div>
        <p>คำตอบของคุณ: ${q.picked!==null ? labelOf(q,q.picked)+". "+q.choices[q.picked] : "— ไม่ได้ตอบ"}</p>
        <p style="color:var(--good)">เฉลย: ${labelOf(q,q.answer)}. ${q.choices[q.answer]}</p>
        <div class="ex">💡 ${q.explanation || "ไม่มีคำอธิบายเพิ่มเติม"}</div>
      </div>`).join("")}
    </div>
  </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const bar = $("ringbar"); bar.style.transition = "stroke-dashoffset 1.2s ease";
    bar.style.strokeDashoffset = circ*(1-pct/100);
  }));
  if(pct>=80){ sndWin(); confetti(); } else if(pct>=60){ sndWin(); }
  window.scrollTo(0,0);
}
function retry(){ openSetupFromResult(); }
function openSetupFromResult(){ const id=S.subj; quitToHome(); openSetup(id); }

/* ================= fun bits ================= */
function comboPop(text){
  const el = document.createElement("div");
  el.className = "combo-pop"; el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}
function confetti(){
  const cv = $("confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#7c6cff","#4ecdc4","#ffc94d","#ff5d73","#3ddc84"];
  const ps = Array.from({length:140},()=>({
    x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.5,
    w:6+Math.random()*6, h:8+Math.random()*8,
    vy:2+Math.random()*3, vx:(Math.random()-.5)*2, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.2,
    c:colors[Math.floor(Math.random()*colors.length)]
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if(++frames < 260) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* keyboard shortcuts: 1-5 answer, Enter/space next */
document.addEventListener("keydown", e=>{
  if(!S || $("quiz").classList.contains("hidden")) return;
  if(e.key>="1" && e.key<="5"){
    const pos = +e.key-1, btns = $("q-choices").children;
    if(btns[pos] && !btns[pos].disabled) btns[pos].click();
  } else if(e.key==="Enter" && !$("nextbtn").classList.contains("hidden")){ nextQ(); }
});

renderHome();
</script>
