<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 การปฏิบัติตามคำสั่ง — ข้อสอบ V-NET 80 ข้อ</title>
<style>
:root{
  --bg:#0f1220; --bg2:#171b30; --card:#1e2340; --card2:#252b4d;
  --text:#eef0ff; --muted:#9aa3c7; --line:#323a63;
  --brand:#7c6cff; --brand2:#4ecdc4; --good:#3ddc84; --bad:#ff5d73; --warn:#ffc94d;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Noto Sans Thai","Segoe UI",sans-serif;
  background:radial-gradient(1200px 800px at 80% -10%,#2a2f55 0%,var(--bg) 55%);
  color:var(--text); min-height:100vh; line-height:1.6;
}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}

/* ===== Home ===== */
.hero{text-align:center;padding:28px 0 20px}
.hero h1{font-size:2rem;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);margin-top:6px}
.statbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;text-align:center;min-width:110px}
.stat b{font-size:1.3rem;display:block}
.stat span{color:var(--muted);font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.subj{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:left;transition:.18s;position:relative;overflow:hidden}
.subj:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 24px rgba(124,108,255,.25)}
.subj .ic{font-size:1.9rem}
.subj h3{font-size:1.02rem;margin:8px 0 2px}
.subj .sub{color:var(--muted);font-size:.8rem}
.subj .meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:.82rem;color:var(--muted)}
.badge{background:var(--bg2);border:1px solid var(--line);padding:2px 10px;border-radius:999px}
.best{color:var(--warn)}
.subj.mix{background:linear-gradient(135deg,#3b2f7a,#1c5f5a);border-color:#6a5cff}

/* ===== Setup modal ===== */
.overlay{position:fixed;inset:0;background:rgba(8,10,20,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:20px;max-width:440px;width:100%;padding:24px}
.modal h2{font-size:1.2rem;margin-bottom:2px}
.modal .sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.optlabel{font-size:.85rem;color:var(--muted);margin:14px 0 6px}
.optrow{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:.9rem}
.opt.sel{background:var(--brand);border-color:var(--brand);font-weight:700}
.toggle{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.9rem;color:var(--muted);cursor:pointer;user-select:none}
.toggle .box{width:20px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.toggle.on .box{background:var(--good);border-color:var(--good);color:#08331c}
.mrow{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:12px;border-radius:12px;font-size:1rem;font-weight:700}
.btn.primary{background:linear-gradient(90deg,var(--brand),#9b8cff);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line)}

/* ===== Quiz ===== */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qtop .left{display:flex;gap:8px;align-items:center}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.85rem}
.pill.flame{border-color:#ff8c42;color:#ffb347}
.pill.timer{min-width:84px;text-align:center}
.progress{height:8px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.qsec{color:var(--brand2);font-size:.78rem;margin-bottom:6px}
.qtext{font-size:1.08rem;font-weight:600;white-space:pre-wrap}
.choices{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-size:.97rem;transition:.15s;width:100%}
.choice:not(:disabled):hover{border-color:var(--brand)}
.choice .lb{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.choice.correct{border-color:var(--good);background:rgba(61,220,132,.12)}
.choice.correct .lb{background:var(--good);color:#06301a;border-color:var(--good)}
.choice.wrong{border-color:var(--bad);background:rgba(255,93,115,.12)}
.choice.wrong .lb{background:var(--bad);color:#fff;border-color:var(--bad)}
.choice.picked{border-color:var(--brand);background:rgba(124,108,255,.14)}
.choice.dim{opacity:.28;pointer-events:none}
.expl{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid;animation:pop .25s}
.expl.good{background:rgba(61,220,132,.1);border-color:var(--good)}
.expl.bad{background:rgba(255,93,115,.1);border-color:var(--bad)}
.expl h4{font-size:.95rem;margin-bottom:4px}
.expl p{font-size:.92rem;color:var(--text)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.qactions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.lifeline{background:var(--card);border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:10px 16px;font-weight:700}
.lifeline:disabled{opacity:.35;border-color:var(--line);color:var(--muted)}
.shake{animation:shake .35s}
.audio-box{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
.audio-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.playbtn{background:linear-gradient(90deg,#2e7d6b,var(--brand2));color:#04241f;font-weight:800;border-radius:99px;padding:10px 22px;font-size:1rem;display:inline-flex;align-items:center;gap:8px}
.playbtn.playing{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(78,205,196,.5)}50%{box-shadow:0 0 0 10px rgba(78,205,196,0)}}
.scriptbtn{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:.85rem;color:var(--muted)}
.script{margin-top:12px;border-left:3px solid var(--brand2);padding:6px 12px;font-style:italic;color:var(--muted);font-size:.95rem}
.audio-hint{color:var(--muted);font-size:.78rem;margin-top:8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.combo-pop{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);font-size:2.2rem;font-weight:800;pointer-events:none;z-index:99;animation:rise 1s forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}

/* palette (exam mode) */
.palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.pal{width:34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-size:.8rem}
.pal.done{background:var(--brand);border-color:var(--brand);font-weight:700}
.pal.cur{outline:2px solid var(--brand2)}

/* ===== Results ===== */
.result{text-align:center;padding-top:10px}
.ring{width:190px;height:190px;margin:14px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:2.4rem}
.ring .num span{color:var(--muted);font-size:.85rem}
.verdict{font-size:1.3rem;font-weight:800;margin:4px 0 14px}
.rstats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.review{margin-top:26px;text-align:left}
.review h3{margin-bottom:12px}
.rq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.rq .st{font-weight:700}
.rq .st.ok{color:var(--good)} .rq .st.no{color:var(--bad)}
.rq p{font-size:.9rem;margin-top:4px}
.rq .ex{color:var(--muted);font-size:.86rem;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.topbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.85rem}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.footer-note{text-align:center;color:var(--muted);font-size:.75rem;margin-top:40px}
@media(max-width:520px){ .hero h1{font-size:1.5rem} .qtext{font-size:1rem} }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ HOME ============ -->
  <div id="home">
    <div class="hero">
      <h1>📋 การปฏิบัติตามคำสั่ง</h1>
      <p>Following Instructions • 80 ข้อ พร้อมเฉลยและคำอธิบายทุกข้อ</p>
    </div>
    <div class="statbar">
      <div class="stat"><b id="st-total">540</b><span>ข้อสอบทั้งหมด</span></div>
      <div class="stat"><b id="st-answered">0</b><span>ทำไปแล้ว (ครั้ง)</span></div>
      <div class="stat"><b id="st-acc">—</b><span>ความแม่นยำรวม</span></div>
      <div class="stat"><b id="st-streak">0</b><span>สถิติตอบถูกติดกัน</span></div>
    </div>
    <div class="grid" id="subjects"></div>
    <p class="footer-note">แตะวิชาเพื่อเริ่ม • ผลคะแนนบันทึกไว้ในเครื่องอัตโนมัติ</p>
  </div>

  <!-- ============ QUIZ ============ -->
  <div id="quiz" class="hidden">
    <div class="qtop">
      <div class="left">
        <button class="topbtn" onclick="confirmExit()">← ออก</button>
        <span class="pill" id="q-count">1/30</span>
        <span class="pill" id="q-score">✅ 0</span>
      </div>
      <div class="left">
        <span class="pill flame" id="q-streak">🔥 0</span>
        <span class="pill timer" id="q-timer">00:00</span>
        <button class="topbtn" id="mutebtn" onclick="toggleMute()">🔊</button>
      </div>
    </div>
    <div class="progress"><i id="q-progress" style="width:0%"></i></div>
    <div class="qcard" id="qcard">
      <div class="qsec" id="q-section"></div>
      <div class="qtext" id="q-text"></div>
      <div id="q-audio"></div>
      <div class="choices" id="q-choices"></div>
      <div id="q-expl"></div>
      <div class="qactions">
        <button class="lifeline" id="fifty" onclick="useFifty()">✂️ 50:50 <span id="fifty-n">×3</span></button>
        <button class="btn primary hidden" id="nextbtn" onclick="nextQ()">ข้อถัดไป →</button>
        <button class="btn ghost hidden" id="skipbtn" onclick="nextQ()">ข้าม →</button>
        <button class="btn primary hidden" id="submitbtn" onclick="finishQuiz()">ส่งคำตอบ ✅</button>
      </div>
    </div>
    <div class="palette hidden" id="palette"></div>
  </div>

  <!-- ============ RESULT ============ -->
  <div id="result" class="hidden"></div>
</div>

<div id="modal-root"></div>

<script>window.AUDIO_BASE='../audio/';const EXAM_DATA = {"subjects": [{"id": "order", "icon": "📋", "title": "การปฏิบัติตามคำสั่ง", "subtitle": "Following Instructions", "labels": ["ก", "ข", "ค", "ง", "จ"], "questions": [{"n": 1, "q": "เมื่อได้รับมอบหมายงานที่ซับซ้อน สิ่งแรกที่สมาชิกทีมควรปฏิบัติคือข้อใด", "choices": ["เริ่มลงมือทำส่วนที่ชัดเจนก่อนทันที เพราะการลงมือเร็วช่วยให้เห็นปัญหาจริงได้ก่อน", "ทบทวนคำสั่งและวัตถุประสงค์ของงานให้เข้าใจถ่องแท้", "ประชุมทีมเพื่อแบ่งหน้าที่ความรับผิดชอบให้ครบทุกคนก่อน", "ศึกษาตัวอย่างงานเดิมที่ใกล้เคียงแล้วยึดเป็นแนวทางหลักในการปฏิบัติ", "ประเมินทรัพยากรและระยะเวลาที่ต้องใช้ก่อนเป็นอันดับแรก"], "answer": 1, "explanation": "งานที่ซับซ้อนต้องเริ่มจากการทบทวนคำสั่งและวัตถุประสงค์ให้เข้าใจถ่องแท้ก่อน จึงจะแบ่งงาน วางแผน และประเมินทรัพยากรได้ถูกทิศทาง (สมรรถนะ 3.1)", "section": ""}, {"n": 2, "q": "การ \"ตอบสนองต่อภารกิจ\" ที่มีประสิทธิภาพสูงสุดควรพิจารณาจากสิ่งใดเป็นสำคัญ", "choices": ["ความรวดเร็วในการส่งมอบงานก่อนกำหนดทุกครั้ง", "ความครบถ้วนของขั้นตอนที่ได้ปฏิบัติตามคู่มือทุกข้อ", "ความสำเร็จของเป้าหมายที่ได้รับมอบหมาย", "ความประหยัดทรัพยากรที่ใช้เมื่อเทียบกับแผนงาน", "ความรวดเร็วในการตอบรับคำสั่งจากผู้บังคับบัญชา"], "answer": 2, "explanation": "ประสิทธิภาพของการตอบสนองต่อภารกิจวัดจากความสำเร็จของเป้าหมายที่ได้รับมอบหมายเป็นสำคัญ ส่วนความเร็ว ความครบถ้วนของขั้นตอน หรือความประหยัดทรัพยากร เป็นเพียงปัจจัยสนับสนุน ไม่ใช่ตัวชี้วัดหลัก", "section": ""}, {"n": 3, "q": "หากคำสั่งที่ได้รับมีผลกระทบต่อความปลอดภัยในการทำงาน ท่านควรทำอย่างไร", "choices": ["ปฏิบัติตามทันทีเพราะผู้ออกคำสั่งย่อมรับผิดชอบผลที่ตามมา", "ปรับวิธีปฏิบัติให้ปลอดภัยขึ้นด้วยตนเองก่อนแล้วจึงแจ้งให้ทราบภายหลัง", "รายงานข้อกังวลด้านความปลอดภัยต่อผู้ออกคำสั่งก่อนปฏิบัติ", "ปฏิบัติเฉพาะส่วนที่มั่นใจว่าปลอดภัยไปพลางก่อนเพื่อไม่ให้งานหยุดชะงัก", "แจ้งเจ้าหน้าที่ความปลอดภัยให้ตรวจหน้างานก่อนโดยยังไม่บอกผู้ออกคำสั่ง"], "answer": 2, "explanation": "ความปลอดภัยต้องมาก่อนเสมอ การรายงานข้อกังวลต่อผู้ออกคำสั่งก่อนปฏิบัติเปิดโอกาสให้ทบทวนคำสั่ง ไม่ควรปรับแก้วิธีการเองโดยพลการ หรือข้ามผู้ออกคำสั่งไปหน่วยงานอื่นก่อน", "section": ""}, {"n": 4, "q": "ข้อใดคือตัวอย่างของการเลือกวิธีสื่อสารที่ \"เหมาะสม\" กับงานด่วนและต้องการการตัดสินใจทันที", "choices": ["การส่งข้อความแชทถึงผู้เกี่ยวข้องทุกคนพร้อมกันทันที", "การส่งอีเมลระบุหัวข้อด่วนที่สุดพร้อมกำหนดเวลาตอบกลับ", "การสื่อสารผ่านโทรศัพท์หรือการพูดคุยโดยตรง", "การส่งอีเมลแจ้งรายละเอียดเชิงลึกประกอบการตัดสินใจ", "การนัดประชุมด่วนภายในวันเดียวกันเพื่อชี้แจง"], "answer": 2, "explanation": "งานด่วนที่ต้องตัดสินใจทันทีต้องใช้ช่องทางสื่อสารสองทางที่ได้รับคำตอบทันที คือโทรศัพท์หรือการพูดคุยโดยตรง ส่วนแชท อีเมล (แม้ระบุว่าด่วน) หรือการนัดประชุม ล้วนได้รับคำตอบช้ากว่า", "section": ""}, {"n": 5, "q": "เมื่อต้องส่งสรุปรายงานการประชุมที่ต้องการความถูกต้องและใช้อ้างอิงภายหลัง ควรเลือกสื่อสารทางใด", "choices": ["การรายงานด้วยวาจาในที่ประชุมอย่างเป็นทางการต่อหน้าทุกฝ่าย", "การส่งข้อความสั้นสรุปเฉพาะมติสำคัญให้ผู้เข้าประชุม", "การส่งอีเมลหรือเอกสารบันทึกข้อความ", "การแจ้งสรุปมติผ่านกลุ่ม Line ของหน่วยงานให้เห็นพร้อมกัน", "การโทรศัพท์แจ้งผลการประชุมแก่ผู้เกี่ยวข้องรายบุคคล"], "answer": 2, "explanation": "อีเมลหรือบันทึกข้อความเป็นลายลักษณ์อักษรที่เป็นทางการ ตรวจสอบย้อนหลังและใช้อ้างอิงได้ ต่างจากการรายงานด้วยวาจา ข้อความสั้น หรือแชทกลุ่มซึ่งไม่เหมาะเป็นเอกสารอ้างอิง", "section": ""}, {"n": 6, "q": "หากท่านสงสัยในลำดับขั้นตอนการทำงานที่ได้รับมอบหมาย การปฏิบัติในข้อใดถูกต้องที่สุด", "choices": ["ปฏิบัติตามขั้นตอนที่เคยใช้ได้ผลดีในงานลักษณะใกล้เคียงกัน", "ตั้งคำถามเพื่อขอความชัดเจนจากผู้ออกคำสั่ง", "เริ่มทำส่วนที่มั่นใจก่อนแล้วสอบถามส่วนที่เหลือภายหลัง", "ศึกษาคู่มือการปฏิบัติงานอย่างละเอียดด้วยตนเองแทนการรบกวนผู้สั่ง", "สอบถามเพื่อนร่วมงานที่เคยผ่านงานลักษณะนี้มาแล้วโดยตรง"], "answer": 1, "explanation": "เมื่อสงสัยในขั้นตอนการทำงาน ต้องตั้งคำถามขอความชัดเจนจากผู้ออกคำสั่งโดยตรง (สมรรถนะ 3.3) การอนุมานจากงานเดิม ค้นคู่มือเอง หรือถามผู้อื่นแทนผู้ออกคำสั่ง เสี่ยงได้ข้อมูลคลาดเคลื่อน", "section": ""}, {"n": 7, "q": "การตั้งคำถามเมื่อสงสัยในคำสั่ง ควรทำในลักษณะใด", "choices": ["ถามให้ครบทุกรายละเอียดตั้งแต่ต้นจนจบเพื่อความมั่นใจสูงสุด", "ถามด้วยความสุภาพ มุ่งประเด็นที่ความชัดเจนของเนื้องาน", "ถามพร้อมเสนอความเห็นแย้งเพื่อแสดงว่าตนวิเคราะห์งานมาแล้ว", "ถามทันทีทุกครั้งที่สงสัยโดยไม่ต้องทบทวนคำสั่งด้วยตนเองก่อน", "รวบรวมข้อสงสัยทั้งหมดไว้สอบถามในคราวเดียวเมื่อใกล้ส่งงาน"], "answer": 1, "explanation": "การตั้งคำถามที่ดีต้องสุภาพและมุ่งประเด็นที่ความชัดเจนของเนื้องาน ควรทบทวนคำสั่งด้วยตนเองก่อนถาม ถามให้ตรงจุด ไม่ถามพร่ำเพรื่อทุกรายละเอียด และไม่เก็บข้อสงสัยไว้ถามเมื่อใกล้ส่งงาน", "section": ""}, {"n": 8, "q": "เมื่อท่านพบว่างานที่ได้รับมอบหมายไม่สามารถเสร็จทันตามกำหนดเวลา (Deadline) ควรทำอย่างไร", "choices": ["ตัดขั้นตอนตรวจสอบรองบางส่วนออกเพื่อรักษากำหนดส่งซึ่งสำคัญที่สุด", "เร่งทำงานเต็มกำลังจนถึงกำหนดแล้วส่งเท่าที่เสร็จพร้อมคำชี้แจง", "รายงานปัญหาและขอขยายระยะเวลาล่วงหน้าพร้อมเหตุผล", "ทำงานล่วงเวลาด้วยตนเองให้เสร็จโดยไม่ต้องรบกวนรายงานผู้ใด", "ขอให้เพื่อนร่วมทีมช่วยแบ่งงานบางส่วนโดยตกลงกันเองภายในทีม"], "answer": 2, "explanation": "การรายงานปัญหาและขอขยายเวลาล่วงหน้าพร้อมเหตุผล เปิดโอกาสให้หัวหน้าปรับแผนได้ทัน ดีกว่าการลดคุณภาพงาน ส่งงานไม่สมบูรณ์ หรือจัดการกันเองโดยหัวหน้าไม่รับรู้", "section": ""}, {"n": 9, "q": "ปัจจัยใดที่มีผลต่อการทำงานให้เสร็จตามกำหนดเวลามากที่สุด", "choices": ["ความทันสมัยของเครื่องมือและเทคโนโลยีที่ใช้ปฏิบัติงาน", "การวางแผนและจัดลำดับความสำคัญของงาน (Prioritization)", "การเผื่อเวลาทำงานล่วงเวลา (OT) ไว้ล่วงหน้าทุกวันตั้งแต่เริ่มงาน", "ประสบการณ์การทำงานที่ยาวนานในสายงานของผู้ปฏิบัติ", "ความสามารถทำงานหลายอย่างพร้อมกัน (Multitasking)"], "answer": 1, "explanation": "การวางแผนและจัดลำดับความสำคัญของงาน (Prioritization) คือหัวใจของการทำงานให้เสร็จทันกำหนด ส่วนเครื่องมือ ประสบการณ์ การเผื่อ OT หรือ Multitasking เป็นเพียงปัจจัยเสริม หากขาดการวางแผนก็ไม่ช่วยให้งานทันกำหนด", "section": ""}, {"n": 10, "q": "การสื่อสารผ่าน 'บันทึกข้อความ' (Memo) มีข้อดีอย่างไรในเชิงการปฏิบัติตามคำสั่ง", "choices": ["ส่งถึงผู้รับได้รวดเร็วกว่าช่องทางการสื่อสารอื่นทุกช่องทาง", "เป็นหลักฐานที่ชัดเจนในการมอบหมายงาน", "ปรับเปลี่ยนรายละเอียดงานได้ทันทีเมื่อสถานการณ์หน้างานเปลี่ยน", "สื่อสารได้ยืดหยุ่นและเป็นกันเองกว่าการพูดคุยโดยตรง", "ผู้รับสามารถสอบถามข้อสงสัยกลับได้ทันทีขณะอ่าน"], "answer": 1, "explanation": "บันทึกข้อความ (Memo) เป็นหลักฐานลายลักษณ์อักษรของการมอบหมายงาน ระบุผู้สั่ง รายละเอียด และกำหนดเวลาได้ชัดเจน จุดแข็งคือความเป็นหลักฐานที่ตรวจสอบย้อนหลังได้ ไม่ใช่ความรวดเร็ว ความยืดหยุ่น หรือการโต้ตอบได้ทันที", "section": ""}, {"n": 11, "q": "พฤติกรรมใดแสดงถึงการ 'ยอมรับภารกิจ' อย่างมืออาชีพ", "choices": ["ตอบรับทันทีเพื่อแสดงความกระตือรือร้นแล้วค่อยศึกษารายละเอียดภายหลัง", "ทำความเข้าใจเป้าหมายและวางแผนการปฏิบัติงานทันที", "ขอเวลาศึกษารายละเอียดงานให้ครบถ้วนหลายวันก่อนจึงตอบรับ", "แจ้งข้อจำกัดของตนเองก่อนเพื่อให้พิจารณามอบหมายผู้ที่เหมาะสมกว่า", "ตอบรับทุกงานที่มอบหมายเพื่อแสดงความพร้อมโดยไม่ต่อรองเงื่อนไข"], "answer": 1, "explanation": "มืออาชีพเมื่อรับภารกิจจะทำความเข้าใจเป้าหมายและวางแผนการปฏิบัติงานทันที การรับปากทันทีโดยยังไม่ศึกษางาน การขอเวลานานเกินจำเป็น หรือการปัดงานให้ผู้อื่น ล้วนไม่ใช่การยอมรับภารกิจอย่างมืออาชีพ", "section": ""}, {"n": 12, "q": "คำถามในข้อใดช่วยแก้ปัญหา 'ความไม่ชัดเจนของคำสั่ง' ได้ดีที่สุด", "choices": ["งานนี้ต้องส่งภายในวันและเวลาใดแน่นอนครับ", "งานนี้ต้องประสานงานกับหน่วยงานใดบ้างครับ", "ผลลัพธ์ที่หัวหน้าต้องการในขั้นตอนนี้คืออะไรครับ", "งานลักษณะนี้เคยมีตัวอย่างที่ทำสำเร็จมาก่อนหรือไม่ครับ", "งานนี้มีงบประมาณให้ใช้ดำเนินการเท่าไรครับ"], "answer": 2, "explanation": "คำถามที่เจาะจงถึง \"ผลลัพธ์ที่ต้องการ\" ช่วยขจัดความไม่ชัดเจนของคำสั่งได้ตรงจุดที่สุด ส่วนคำถามเรื่องกำหนดเวลา หน่วยงานที่เกี่ยวข้อง งบประมาณ หรือตัวอย่างงานเดิม เป็นเพียงข้อมูลประกอบ ไม่ได้ทำให้เป้าหมายของงานชัดเจนขึ้นโดยตรง", "section": ""}, {"n": 13, "q": "เมื่อได้รับคำสั่งทางโทรศัพท์ขณะเดินทาง สิ่งที่ควรทำเพื่อให้ไม่เกิดความผิดพลาดคือข้อใด", "choices": ["ตั้งใจฟังอย่างละเอียดและจดจำสาระสำคัญโดยไม่ขัดจังหวะผู้สั่ง", "จดบันทึกสาระสำคัญของคำสั่งและทวนกลับให้ผู้สั่งยืนยันความถูกต้อง", "แจ้งผู้สั่งว่าจะโทรกลับไปฟังรายละเอียดอีกครั้งเมื่อถึงที่ทำงาน", "ขอให้ผู้สั่งส่งรายละเอียดเป็นข้อความยืนยันแทนการสั่งด้วยวาจา", "เริ่มดำเนินการทันทีตามที่เข้าใจเพื่อไม่ให้งานล่าช้า"], "answer": 1, "explanation": "การจดบันทึกสาระสำคัญและทวนคำสั่งกลับ (Repeat back) เป็นเทคนิคมาตรฐานในการป้องกันความผิดพลาดจากการสื่อสารด้วยวาจา การอาศัยความจำ การเลื่อนรับคำสั่ง หรือการขอให้เปลี่ยนช่องทางแทนการรับคำสั่งตรงหน้า เสี่ยงต่อความคลาดเคลื่อนและความล่าช้า", "section": ""}, {"n": 14, "q": "การเลือกใช้ช่องทาง 'กลุ่มแชท Line' ในการสั่งงานในทีม เหมาะกับเรื่องใด", "choices": ["การมอบหมายงานเร่งด่วนที่ต้องการการตัดสินใจภายในไม่กี่นาที", "การประสานงานทั่วไปที่ต้องการการรับทราบข้อมูลพร้อมกัน", "การแจ้งผลการประเมินผลงานประจำปีให้สมาชิกรายบุคคล", "การให้ข้อติชมผลงานรายบุคคลเพื่อให้ปรับปรุงโดยเร็ว", "การส่งเอกสารสัญญาที่มีผลผูกพันทางกฎหมายให้ลงนาม"], "answer": 1, "explanation": "กลุ่มแชทเหมาะกับการประสานงานทั่วไปที่สมาชิกทุกคนต้องรับทราบข้อมูลพร้อมกัน แต่ไม่เหมาะกับงานด่วนที่ต้องการการตัดสินใจทันที เรื่องประเมินหรือติชมรายบุคคล และเอกสารทางกฎหมาย", "section": ""}, {"n": 15, "q": "หากเพื่อนร่วมทีมได้รับคำสั่งที่ขัดแย้งกับท่าน ท่านควรทำอย่างไร", "choices": ["ยึดตามคำสั่งฉบับหลังสุดเพราะย่อมสะท้อนสถานการณ์ล่าสุดกว่า", "ประสานงานและขอคำยืนยันจากผู้ออกคำสั่งร่วมกัน", "ต่างคนต่างปฏิบัติตามคำสั่งที่ตนได้รับเพราะถือว่าได้รับมอบหมายโดยตรง", "ชะลองานทั้งสองส่วนไว้ก่อนจนกว่าจะมีคำสั่งฉบับใหม่ลงมา", "ให้ผู้ที่อาวุโสที่สุดในทีมเป็นผู้ชี้ขาดว่าจะยึดคำสั่งใด"], "answer": 1, "explanation": "เมื่อคำสั่งขัดแย้งกัน ต้องประสานงานและขอคำยืนยันจากผู้ออกคำสั่งร่วมกัน การยึดคำสั่งล่าสุด ต่างคนต่างทำ หรือให้ผู้อาวุโสในทีมชี้ขาดกันเอง อาจไม่ตรงกับเจตนาที่แท้จริงของผู้ออกคำสั่ง", "section": ""}, {"n": 16, "q": "ข้อใดคือทักษะที่จำเป็นในการทำตามคำสั่งให้เสร็จตามกำหนดเวลา", "choices": ["ทักษะการบริหารเวลา (Time Management)", "ทักษะการเจรจาต่อรองเงื่อนไขงาน (Negotiation)", "ทักษะการนำเสนอความคืบหน้าของงาน (Presentation)", "ทักษะการสร้างเครือข่ายในองค์กร (Networking)", "ทักษะการใช้เทคโนโลยีสำนักงานสมัยใหม่"], "answer": 0, "explanation": "ทักษะการบริหารเวลา (Time Management) เกี่ยวข้องโดยตรงกับการทำงานให้เสร็จตามกำหนดเวลา (สมรรถนะ 3.4) ส่วนการเจรจาต่อรอง การนำเสนอ หรือการสร้างเครือข่าย เป็นทักษะที่มีประโยชน์แต่ไม่ใช่ปัจจัยหลักของการส่งงานให้ทันกำหนด", "section": ""}, {"n": 17, "q": "การที่พนักงาน 'นิ่งเงียบ' ทั้งที่ยังสงสัยในคำสั่ง ส่งผลเสียอย่างไรมากที่สุด", "choices": ["หัวหน้าเข้าใจว่าพนักงานรับทราบและเข้าใจงานครบถ้วนแล้ว", "งานอาจผิดพลาดและเสียเวลาในการแก้ไขภายหลัง", "บรรยากาศการประชุมดูราบรื่นแต่ขาดการมีส่วนร่วมที่แท้จริง", "พนักงานเสียโอกาสในการแสดงความคิดเห็นและศักยภาพของตน", "ผู้สั่งงานไม่สามารถประเมินระดับความเข้าใจของพนักงานได้"], "answer": 1, "explanation": "การนิ่งเงียบทั้งที่ยังสงสัยทำให้ทำงานบนความเข้าใจที่คลาดเคลื่อน งานอาจผิดพลาดและต้องเสียเวลากลับมาแก้ไขภายหลัง ซึ่งเป็นผลเสียที่รุนแรงที่สุดเมื่อเทียบกับผลกระทบในตัวเลือกอื่น", "section": ""}, {"n": 18, "q": "พฤติกรรม 'เช้าชามเย็นชาม' ขัดต่อสมรรถนะข้อใดมากที่สุด", "choices": ["3.1 การตอบสนองต่อภารกิจที่ได้รับมอบหมาย", "3.4 การปฏิบัติงานให้เสร็จตามกำหนดเวลา", "3.3 การตั้งคำถามเมื่อสงสัยในความไม่ชัดเจนของคำสั่ง", "3.2 การเลือกวิธีการสื่อสารที่เหมาะสมกับงาน", "2.1 การเป็นสมาชิกที่ดีของทีมงาน"], "answer": 1, "explanation": "\"เช้าชามเย็นชาม\" หมายถึงการทำงานเรื่อยเปื่อยไม่กระตือรือร้น จึงขัดกับสมรรถนะ 3.4 การปฏิบัติงานให้เสร็จสิ้นตามกำหนดเวลาโดยตรง", "section": ""}, {"n": 19, "q": "ข้อใดไม่ใช่จุดประสงค์ของการ 'ทวนคำสั่ง'", "choices": ["เพื่อให้ผู้สั่งและผู้รับคำสั่งเข้าใจเนื้องานตรงกัน", "เพื่อลดความผิดพลาดจากการสื่อสารด้วยวาจา", "เพื่อแสดงความกระตือรือร้นให้ผู้สั่งงานเห็น", "เพื่อยืนยันความถูกต้องครบถ้วนของข้อมูลที่ได้รับ", "เพื่อประเมินความพร้อมของตนเองก่อนรับปฏิบัติ"], "answer": 2, "explanation": "ข้อนี้ถามหาข้อที่ \"ไม่ใช่\" จุดประสงค์ การทวนคำสั่งมีไว้เพื่อความเข้าใจตรงกัน ลดความผิดพลาด ยืนยันความถูกต้องของข้อมูล และประเมินความพร้อมของตน ไม่ใช่เครื่องมือสร้างภาพความกระตือรือร้น", "section": ""}, {"n": 20, "q": "หากงานที่ได้รับมีขั้นตอนมาก ท่านควรจัดการอย่างไรเพื่อให้ทันกำหนด (3.4)", "choices": ["เริ่มจากขั้นตอนที่ใช้เวลาน้อยที่สุดเพื่อให้เห็นความคืบหน้าเร็ว", "แบ่งงานเป็นส่วนย่อย ๆ (Milestones) และกำหนดวันเสร็จของแต่ละส่วน", "เจรจาขอเลื่อนกำหนดส่งตั้งแต่วันแรกเพื่อให้มีเวลาเผื่อ", "เดินหน้าทุกขั้นตอนคู่ขนานกันไปเพื่อประหยัดเวลาโดยรวม", "รวบรวมข้อมูลให้นิ่งก่อนแล้วทุ่มทำรวดเดียวในช่วงท้าย"], "answer": 1, "explanation": "การแบ่งงานเป็นส่วนย่อย (Milestones) พร้อมกำหนดวันเสร็จแต่ละส่วน ช่วยติดตามความคืบหน้าและควบคุมเวลาให้ทันกำหนดส่งได้", "section": ""}, {"n": 21, "q": "เมื่อผู้สั่งงานใช้คำว่า 'เร็วที่สุด' (Urgent) ท่านควรปฏิบัติอย่างไร", "choices": ["พักงานอื่นทั้งหมดไว้ก่อนแล้วทุ่มกำลังทำงานด่วนนี้ทันที", "สอบถามกำหนดเวลาที่แน่นอนเพื่อใช้จัดลำดับความสำคัญ", "เริ่มทำทันทีตามความเข้าใจของตนเพื่อไม่ให้เสียเวลาสอบถาม", "เร่งปิดงานเดิมที่ค้างอยู่ให้เสร็จก่อนแล้วจึงเริ่มงานด่วนชิ้นนี้", "ลดขอบเขตงานบางส่วนลงเพื่อให้ส่งมอบได้เร็วขึ้นตามที่สั่ง"], "answer": 1, "explanation": "คำว่า \"เร็วที่สุด\" เป็นคำกำกวม จึงควรสอบถามกำหนดเวลาที่แน่นอนเพื่อจัดลำดับความสำคัญของงานได้ถูกต้อง ไม่ควรทิ้งงานอื่นหรือลดขอบเขตงานเองโดยพลการ (เชื่อมโยงสมรรถนะ 3.3 และ 3.4)", "section": ""}, {"n": 22, "q": "ข้อใดคือความหมายของ '3.1 สามารถตอบสนองต่อภารกิจ'", "choices": ["การรับทราบและตอบรับคำสั่งอย่างรวดเร็วทุกครั้งที่ได้รับมอบหมาย", "การรับคำสั่งและเปลี่ยนเป็นแผนการปฏิบัติงานได้", "การจดจำรายละเอียดของคำสั่งได้อย่างครบถ้วนแม่นยำ", "การปฏิบัติตามคำสั่งอย่างเคร่งครัดโดยไม่เบี่ยงเบนจากที่สั่ง", "การประเมินความยากง่ายของภารกิจก่อนตอบรับทุกครั้ง"], "answer": 1, "explanation": "การตอบสนองต่อภารกิจ คือการรับคำสั่งแล้วแปลงเป็นแผนการปฏิบัติงานที่ลงมือทำได้จริง ไม่ใช่เพียงการตอบรับอย่างรวดเร็ว การจดจำคำสั่งได้แม่นยำ หรือการทำตามโดยไม่คิดวิเคราะห์", "section": ""}, {"n": 23, "q": "การใช้ 'รูปภาพหรือแผนผัง' ในการสั่งงานช่าง ช่วยเรื่องใดมากที่สุด (3.2)", "choices": ["ความน่าเชื่อถือและความเป็นทางการของการสั่งงาน", "ความเข้าใจในรายละเอียดที่ถูกต้องแม่นยำ", "การลดเวลาที่ต้องใช้อธิบายด้วยวาจาในการมอบหมายงาน", "การลดจำนวนครั้งของการประชุมชี้แจงหน้างาน", "การลดภาระผู้สั่งงานในการลงตรวจหน้างานด้วยตนเอง"], "answer": 1, "explanation": "รูปภาพหรือแผนผังช่วยให้ผู้รับคำสั่งเห็นรายละเอียดตรงกันกับผู้สั่ง ลดการตีความคลาดเคลื่อน เหมาะกับงานช่างที่ต้องการความแม่นยำสูง ส่วนการประหยัดเวลาเป็นเพียงผลพลอยได้", "section": ""}, {"n": 24, "q": "หากท่านพบอุปสรรคระหว่างปฏิบัติงานที่ได้รับมอบหมาย ข้อใดคือพฤติกรรมที่ดี (3.4)", "choices": ["พยายามแก้ไขด้วยตนเองให้ถึงที่สุดเพื่อแสดงความรับผิดชอบ", "รายงานปัญหาพร้อมเสนอทางเลือกในการแก้ไขต่อผู้บังคับบัญชา", "รายงานปัญหาทันทีแล้วรอรับคำสั่งแก้ไขจากผู้บังคับบัญชา", "ขอสลับไปรับผิดชอบงานส่วนอื่นที่ตนถนัดกว่าแทน", "พักส่วนที่ติดขัดไว้แล้วเร่งทำส่วนอื่นให้คืบหน้าไปก่อน"], "answer": 1, "explanation": "เมื่อพบอุปสรรคควรรายงานปัญหาพร้อมเสนอทางเลือกในการแก้ไข แสดงถึงความรับผิดชอบและช่วยให้งานเดินหน้าต่อได้ทันกำหนด การดันทุรังแก้เองจนเลยกำหนด หรือรายงานโดยไม่เสนอทางแก้ใด ๆ ยังไม่ใช่พฤติกรรมที่ดีที่สุด", "section": ""}, {"n": 25, "q": "การที่พนักงานถามว่า 'งานนี้ต้องการเน้นคุณภาพหรือความเร็วครับ' จัดเป็นสมรรถนะข้อใด", "choices": ["3.2 การเลือกวิธีการสื่อสารที่เหมาะสมกับงาน", "3.3 การตั้งคำถามเมื่อสงสัยในความไม่ชัดเจน", "3.4 การปฏิบัติงานให้เสร็จสิ้นตามกำหนดเวลา", "3.1 การตอบสนองต่อภารกิจที่ได้รับมอบหมาย", "4.1 การทำงานร่วมกันเป็นทีมอย่างมีประสิทธิภาพ"], "answer": 1, "explanation": "การถามว่าเน้นคุณภาพหรือความเร็ว คือการตั้งคำถามเพื่อขจัดความไม่ชัดเจนของคำสั่ง ตรงกับสมรรถนะ 3.3", "section": ""}, {"n": 26, "q": "การส่งงานก่อนกำหนดเวลา (Early Submission) ส่งผลดีอย่างไรต่อทีม", "choices": ["ช่วยให้ทีมได้พักฟื้นกำลังก่อนเริ่มงานชิ้นถัดไป", "ช่วยให้มีเวลาตรวจสอบความถูกต้องมากขึ้น", "ช่วยแสดงศักยภาพของทีมต่อหัวหน้าเพื่อผลการประเมินปลายปี", "ช่วยลดปริมาณงานที่สมาชิกคนอื่นในทีมต้องรับผิดชอบ", "ทำให้ทีมมีผลงานโดดเด่นกว่าทีมอื่นเมื่อถูกเปรียบเทียบ"], "answer": 1, "explanation": "การส่งงานก่อนกำหนดทำให้ทีมมีเวลาตรวจสอบความถูกต้องและแก้ไขข้อบกพร่องก่อนส่งจริง คุณภาพงานโดยรวมจึงดีขึ้น ประโยชน์ด้านภาพลักษณ์หรือการประเมินเป็นเพียงผลพลอยได้", "section": ""}, {"n": 27, "q": "การเลือกใช้ 'วิทยุสื่อสาร' (Walkie-Talkie) เหมาะสมในไซต์งานก่อสร้างเพราะเหตุใด (3.2)", "choices": ["สัญญาณเสียงคมชัดกว่าโทรศัพท์มือถือในทุกพื้นที่", "สะดวกรวดเร็วและสื่อสารได้หลายคนพร้อมกันในพื้นที่งาน", "ตัวเครื่องทนทานต่อฝุ่นและแรงกระแทกหน้างานมากกว่า", "ช่วยประหยัดค่าใช้จ่ายด้านการสื่อสารของโครงการ", "เป็นอุปกรณ์มาตรฐานที่กำหนดใช้ในงานก่อสร้างทั่วไป"], "answer": 1, "explanation": "วิทยุสื่อสารกดพูดได้ทันที สื่อสารถึงหลายคนพร้อมกันในพื้นที่งาน และไม่ต้องพึ่งสัญญาณโทรศัพท์ จึงเหมาะกับไซต์งานก่อสร้าง ส่วนความทนทานหรือการประหยัดค่าใช้จ่ายเป็นผลพลอยได้ ไม่ใช่เหตุผลหลักด้านการสื่อสาร (3.2)", "section": ""}, {"n": 28, "q": "เมื่อหัวหน้างานไม่อยู่และท่านมีข้อสงสัยในคำสั่งด่วน ควรทำอย่างไร (3.3)", "choices": ["ตัดสินใจตามประสบการณ์ของตนไปก่อนเพื่อไม่ให้งานด่วนล่าช้า", "พยายามติดต่อหัวหน้าหรือถามผู้รักษาการแทนที่มีอำนาจตัดสินใจ", "ชะลองานส่วนที่สงสัยไว้ก่อนจนกว่าหัวหน้าจะกลับมาสั่งการเอง", "ประชุมเพื่อนร่วมงานที่เกี่ยวข้องแล้วปฏิบัติตามความเห็นของเสียงส่วนใหญ่", "ทำเฉพาะส่วนที่เข้าใจชัดเจนก่อน ส่วนที่สงสัยพักไว้ภายหลัง"], "answer": 1, "explanation": "งานด่วนที่มีข้อสงสัยต้องหาผู้มีอำนาจตัดสินใจ โดยพยายามติดต่อหัวหน้าหรือผู้รักษาการแทน ไม่ควรตัดสินใจเองตามประสบการณ์ ใช้เสียงส่วนใหญ่ของเพื่อนร่วมงาน หรือชะลองานด่วนไว้เฉย ๆ", "section": ""}, {"n": 29, "q": "ความรับผิดชอบ (Accountability) สัมพันธ์กับสมรรถนะในข้อใดมากที่สุด", "choices": ["3.3 การตั้งคำถามเมื่อสงสัยในความไม่ชัดเจนของคำสั่งที่ได้รับ", "3.4 การปฏิบัติงานตามคำสั่งให้เสร็จสิ้นตามกำหนดเวลา", "3.2 การเลือกวิธีการสื่อสารที่เหมาะสมกับลักษณะงาน", "3.1 การตอบสนองต่อภารกิจต่าง ๆ ที่ได้รับมอบหมาย", "2.1 การเป็นสมาชิกที่ดีและให้ความร่วมมือกับทีมงาน"], "answer": 1, "explanation": "Accountability คือความรับผิดชอบต่อผลของงานที่รับมอบหมายจนเสร็จสมบูรณ์ตามกำหนดเวลา ตรงกับสมรรถนะ 3.4 มากที่สุด", "section": ""}, {"n": 30, "q": "ผลลัพธ์สุดท้ายของการปฏิบัติตามคำสั่งที่ดีคืออะไร", "choices": ["ผู้บังคับบัญชาเกิดความไว้วางใจในตัวผู้ปฏิบัติงานมากขึ้น", "งานสำเร็จตามเป้าหมาย มีคุณภาพ และตรงเวลา", "องค์กรมีภาพลักษณ์ที่ดีต่อลูกค้าและบุคคลภายนอก", "ผู้ปฏิบัติงานมีความก้าวหน้าในสายอาชีพของตนเอง", "ทีมงานมีความสามัคคีและบรรยากาศการทำงานที่ดี"], "answer": 1, "explanation": "เป้าหมายสุดท้ายของการปฏิบัติตามคำสั่งที่ดี คืองานสำเร็จตามเป้าหมาย มีคุณภาพ และตรงเวลา ส่วนความไว้วางใจ ภาพลักษณ์องค์กร หรือความก้าวหน้า เป็นผลพลอยได้ที่ตามมาจากผลงานที่สำเร็จ", "section": ""}, {"n": 31, "q": "หัวหน้าสั่งว่า 'ไปทำความสะอาดเครื่องจักรให้เสร็จก่อนเที่ยง' แต่ในโรงงานมีเครื่องจักรหลายเครื่องและไม่ได้ระบุว่าเครื่องใด ท่านควรทำอย่างไร?", "choices": ["เริ่มจากเครื่องที่สกปรกที่สุดก่อนเพราะน่าจะตรงกับเจตนาของหัวหน้ามากที่สุด", "ทำความสะอาดทุกเครื่องเท่าที่เวลาอำนวยเพื่อให้ครอบคลุมทุกกรณี", "สอบถามหัวหน้าให้ชัดเจนว่าหมายถึงเครื่องใดบ้าง", "สอบถามเพื่อนอาวุโสที่รู้แนวการสั่งงานของหัวหน้าดีแล้วทำตามนั้น", "เริ่มจากเครื่องที่ถึงรอบทำความสะอาดตามตารางบำรุงรักษาก่อน"], "answer": 2, "explanation": "คำสั่งกำกวมเรื่องขอบเขตงาน ต้องทวนถามผู้ออกคำสั่งโดยตรงให้ชัดเจนก่อนปฏิบัติ การอนุมานจากความสกปรก ตารางบำรุงรักษา หรือความเห็นของผู้อื่น อาจไม่ตรงกับเจตนาจริงและทำให้งานผิดเป้าหมาย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 32, "q": "หัวหน้าแผนกสั่งให้บรรจุสินค้าไลน์ A ก่อน แต่ผู้จัดการโรงงานเดินมาสั่งให้ทำไลน์ B ก่อนโดยไม่ทราบว่ามีคำสั่งเดิมอยู่ ท่านควรทำอย่างไร?", "choices": ["แจ้งผู้จัดการว่ามีคำสั่งจากหัวหน้าแผนกอยู่ก่อน แล้วขอคำยืนยันลำดับความสำคัญ", "ทำตามผู้จัดการทันทีเพราะเป็นผู้บริหารระดับสูงกว่า คำสั่งย่อมมีน้ำหนักเหนือกว่าโดยอัตโนมัติ", "ทำตามหัวหน้าแผนกต่อไปเพราะเป็นผู้บังคับบัญชาโดยตรงตามสายการบังคับบัญชา", "แบ่งกำลังทำทั้งสองไลน์คู่ขนานกันไปเพื่อให้งานคืบหน้าทั้งสองฝ่าย", "ปรึกษาเพื่อนร่วมกะที่มีประสบการณ์มากกว่าว่าควรทำไลน์ใดก่อน"], "answer": 0, "explanation": "เมื่อคำสั่งขัดแย้งกัน ต้องแจ้งข้อมูลให้ผู้ออกคำสั่งทราบเพื่อให้ผู้มีอำนาจตัดสินลำดับความสำคัญ การเลือกข้างตามตำแหน่งหรือสายบังคับบัญชาเองโดยไม่แจ้งข้อมูล อาจทำให้งานที่สำคัญกว่าเสียหาย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 33, "q": "ท่านได้รับคำสั่งด่วนให้เดินเครื่องปั๊มโลหะ แต่พบว่าเซนเซอร์นิรภัยของเครื่องเสียอยู่ ท่านควรทำอย่างไร?", "choices": ["เดินเครื่องด้วยความระมัดระวังเป็นพิเศษพร้อมให้เพื่อนช่วยเฝ้าระวังตลอดเวลา", "เดินเครื่องให้เสร็จงานด่วนก่อนแล้วออกใบแจ้งซ่อมทันทีหลังจบงาน", "ประสานให้ช่างที่ชำนาญเครื่องนี้มากกว่ามาเป็นผู้เดินเครื่องแทน", "หยุดใช้เครื่องและรายงานหัวหน้าทันทีว่าอุปกรณ์นิรภัยชำรุด", "ตรวจเช็กและซ่อมเซนเซอร์เบื้องต้นด้วยตนเองเพื่อให้ทันกำหนดงาน"], "answer": 3, "explanation": "ความปลอดภัยต้องมาก่อนความเร่งด่วนเสมอ ต้องหยุดและรายงานผู้ออกคำสั่งให้ตัดสินใจสั่งการใหม่ การฝืนเดินเครื่องแม้จะเฝ้าระวังเพิ่ม หรือให้ผู้อื่นมาเสี่ยงแทน ล้วนไม่ถูกต้อง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 34, "q": "หัวหน้ามอบหมายให้ท่านนำคำสั่งการปรับตั้งเครื่อง CNC ไปถ่ายทอดให้เพื่อนกะดึก วิธีใดเหมาะสมที่สุด?", "choices": ["อธิบายด้วยวาจาอย่างละเอียดตามที่จำได้เพราะเป็นการสื่อสารภายในทีม", "จดรายละเอียดเป็นลายลักษณ์อักษร ส่งมอบพร้อมอธิบาย และให้ผู้รับทวนกลับ", "ฝากบันทึกย่อไว้กับพนักงานกะดึกคนแรกที่มาถึงให้ช่วยส่งต่อ", "สรุปเฉพาะประเด็นที่สำคัญที่สุดให้กระชับเพื่อไม่ให้ผู้รับสับสน", "แนะนำให้เพื่อนกะดึกโทรยืนยันกับหัวหน้าโดยตรงในวันรุ่งขึ้น"], "answer": 1, "explanation": "การส่งต่อคำสั่งต้องครบถ้วนเป็นลายลักษณ์อักษรและให้ผู้รับทวนกลับ เพื่อป้องกันข้อมูลตกหล่นหรือคลาดเคลื่อน การเล่าตามความจำ ตัดทอนเอง หรือฝากส่งต่อผ่านคนอื่น เสี่ยงต่อความผิดพลาด", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 35, "q": "ใบสั่งงานฉบับใหม่ตัดขั้นตอนการตัดแยกพลังงาน (Lockout) ออกจากลำดับงานซ่อมบำรุง ซึ่งท่านเห็นว่าผิดปกติ ท่านควรทำอย่างไร?", "choices": ["ทำตามใบสั่งงานฉบับใหม่เพราะเอกสารที่ออกมาย่อมผ่านการทบทวนและอนุมัติแล้ว", "เพิ่มขั้นตอน Lockout กลับเข้าไปเองระหว่างทำงานเพราะเป็นการเพิ่มความปลอดภัย", "ปฏิบัติตามใบสั่งงานฉบับเดิมที่ตนคุ้นเคยไปพลางก่อน", "หารือเพื่อนร่วมงานที่ชำนาญแล้วปฏิบัติตามความเห็นส่วนใหญ่", "ยังไม่เริ่มงานและสอบถามผู้ออกคำสั่งทันทีถึงขั้นตอนความปลอดภัยที่หายไป"], "answer": 4, "explanation": "เมื่อพบข้อสงสัยด้านความปลอดภัยในคำสั่ง ต้องทักท้วงและสอบถามผู้ออกคำสั่งก่อนปฏิบัติ แม้แต่การเพิ่มขั้นตอนกลับเองโดยไม่แจ้งก็เป็นการแก้เอกสารโดยพลการ ซึ่งไม่ใช่แนวทางที่ถูกต้อง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 36, "q": "ผู้จัดการสั่งทางโทรศัพท์ว่า 'รีบส่งเอกสารชุดนั้นให้ลูกค้ารายสำคัญด้วย' แต่ท่านดูแลลูกค้ารายสำคัญอยู่สามราย ท่านควรทำอย่างไร?", "choices": ["ทวนถามทันทีว่าหมายถึงเอกสารชุดใดและลูกค้ารายใด", "ส่งเอกสารให้ลูกค้ารายสำคัญทั้งสามรายเพื่อความครอบคลุมไว้ก่อน", "เลือกส่งให้ลูกค้าที่มียอดสั่งซื้อสูงสุดเพราะน่าจะเป็นรายที่หมายถึง", "ตรวจสอบงานค้างของแต่ละรายแล้วส่งให้รายที่มีเรื่องเร่งด่วนที่สุดอยู่", "สอบถามเลขานุการผู้จัดการซึ่งใกล้ชิดงานที่สุดแล้วส่งตามนั้น"], "answer": 0, "explanation": "คำสั่งที่ระบุเป้าหมายไม่ชัดต้องทวนถามผู้ออกคำสั่งทันที การส่งเหมาทุกรายอาจทำให้ข้อมูลรั่วไหลผิดราย ส่วนการอนุมานจากยอดสั่งซื้อ งานค้าง หรือคำบอกเล่าของผู้อื่น ล้วนเป็นการเดาแทนการยืนยัน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 37, "q": "ในอู่ซ่อมรถ ลูกค้าขอให้ท่านข้ามขั้นตอนการตรวจแรงขันน็อตล้อเพื่อรับรถเร็วขึ้น ทั้งที่ใบสั่งซ่อมของหัวหน้าอู่กำหนดให้ตรวจทุกคัน ท่านควรทำอย่างไร?", "choices": ["ข้ามขั้นตอนตามที่ลูกค้าขอเพราะความพึงพอใจของลูกค้าคือหัวใจของงานบริการ", "สุ่มตรวจเฉพาะล้อหน้าซึ่งรับภาระมากที่สุดเพื่อประหยัดเวลาให้ลูกค้า", "ปฏิบัติตามใบสั่งซ่อมครบทุกขั้นตอน และชี้แจงลูกค้าว่าเป็นข้อกำหนดด้านความปลอดภัยของอู่", "ให้ลูกค้าลงนามรับทราบความเสี่ยงเป็นลายลักษณ์อักษรแล้วจึงข้ามขั้นตอนได้", "ทำตามคำขอของลูกค้าแต่บันทึกเหตุการณ์ไว้ในใบงานเพื่อป้องกันความรับผิดของตน"], "answer": 2, "explanation": "คำขอของบุคคลภายนอกไม่อาจยกเลิกคำสั่งและมาตรฐานความปลอดภัยได้ แม้ลูกค้าลงนามรับความเสี่ยงหรือมีบันทึกไว้ก็ตาม ต้องปฏิบัติตามใบสั่งซ่อมและส่งข้อโต้แย้งให้ผู้มีอำนาจตัดสิน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 38, "q": "ที่ไซต์ก่อสร้าง ท่านได้รับคำสั่งให้ยกแผ่นพื้นด้วยเครนตามแผนงาน แต่ขณะปฏิบัติลมกระโชกแรงเกินค่าที่กำหนดในคู่มือ ท่านควรทำอย่างไร?", "choices": ["ยกต่อด้วยความเร็วต่ำสุดและเพิ่มผู้เฝ้าระวังรอบพื้นที่เพื่อให้งานเดินหน้าตามแผนที่วางไว้", "เลือกยกเฉพาะแผ่นพื้นที่น้ำหนักเบาที่สุดไปก่อนในช่วงที่ลมกระโชกแรง", "ชะลอการยกไว้ชั่วคราวโดยไม่ต้องรายงานเพราะถือเป็นดุลยพินิจหน้างาน", "ให้ทีมงานใช้เชือกไกด์ช่วยประคองแผ่นพื้นทั้งสองด้านแทนการหยุดงาน", "หยุดการยกทันที และรายงานผู้ควบคุมงานว่าลมเกินเกณฑ์ความปลอดภัยเพื่อรอคำสั่งใหม่"], "answer": 4, "explanation": "เมื่อสภาพหน้างานเกินเกณฑ์ความปลอดภัยต้องหยุดปฏิบัติและรายงานผู้ออกคำสั่งทันที การฝืนยกต่อแม้จะช้าลงหรือเพิ่มคนช่วยประคอง และการหยุดเองโดยไม่รายงาน ล้วนไม่ครบตามหลักปฏิบัติ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 39, "q": "ท่านทำงานตามคำสั่งไปได้ครึ่งทาง พบว่าวัสดุในคลังไม่พอทำให้ไม่สามารถเสร็จตามกำหนด ท่านควรทำอย่างไร?", "choices": ["เร่งทำส่วนที่วัสดุยังพอมีให้เสร็จสมบูรณ์ไปก่อนแล้วค่อยชี้แจงเมื่อถูกสอบถามภายหลัง", "รายงานความคืบหน้าและอุปสรรคให้ผู้ออกคำสั่งทราบทันที พร้อมเสนอทางเลือก", "ทำเรื่องขอเบิกวัสดุเพิ่มตามขั้นตอนแล้วรอจนกว่าวัสดุจะมาถึง", "ประสานยืมวัสดุจากแผนกข้างเคียงมาใช้ก่อนเพื่อไม่ให้งานสะดุด", "ปรับใช้วัสดุใกล้เคียงที่มีในคลังซึ่งคุณสมบัติแทบไม่ต่างกันแทน"], "answer": 1, "explanation": "เมื่อพบอุปสรรคที่กระทบเป้าหมาย ต้องรายงานผู้ออกคำสั่งทันทีพร้อมข้อเสนอ เพื่อให้ตัดสินใจได้ทันเวลา การเบิกแล้วรอเฉย ๆ การยืมของ หรือเปลี่ยนสเปกวัสดุเองโดยไม่รายงาน ล้วนเสี่ยงต่อความเสียหาย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 40, "q": "เพื่อนร่วมกะส่วนใหญ่เห็นตรงกันว่าควรสลับลำดับขั้นตอนในใบสั่งงานเพื่อให้ทำง่ายขึ้น และชวนท่านทำตามมติกลุ่ม ท่านควรทำอย่างไร?", "choices": ["ทำตามมติกลุ่มเพราะผู้ปฏิบัติหน้างานย่อมรู้วิธีที่เหมาะสมที่สุด", "ทำตามมติกลุ่มแต่บันทึกไว้เป็นลายลักษณ์อักษรว่าตนได้แสดงความไม่เห็นด้วยไว้แล้วตั้งแต่ต้น", "ปฏิบัติตามลำดับเดิมเงียบ ๆ คนเดียวโดยไม่แจ้งความเห็นของกลุ่มต่อผู้ใด", "ปฏิบัติตามลำดับในใบสั่งงาน และเสนอแนวคิดของกลุ่มให้หัวหน้าพิจารณาอนุมัติก่อน", "ทดลองสลับขั้นตอนเฉพาะล็อตเล็ก ๆ ก่อนเพื่อพิสูจน์ว่าได้ผลจริง"], "answer": 3, "explanation": "เสียงส่วนใหญ่ไม่มีอำนาจแก้ไขคำสั่ง การเปลี่ยนขั้นตอนแม้เพียงทดลองก็ต้องได้รับอนุมัติจากผู้มีอำนาจก่อน เพราะลำดับงานมักถูกออกแบบไว้ด้วยเหตุผลด้านคุณภาพและความปลอดภัย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 41, "q": "หัวหน้าส่งภาพถ่ายใบสั่งงานมาทางแอปแชท แต่ภาพเบลอจนอ่านตัวเลขขนาดชิ้นงานไม่ชัด ท่านควรทำอย่างไร?", "choices": ["ขยายภาพและเทียบกับแบบงานเดิมเพื่อประเมินตัวเลขที่น่าจะเป็น", "เริ่มตัดชิ้นงานตามขนาดมาตรฐานที่โรงงานใช้บ่อยที่สุดไปก่อนระหว่างรอ", "ปรึกษาช่างรุ่นพี่ที่เคยทำงานลักษณะนี้ให้ช่วยยืนยันตัวเลขให้", "ติดต่อหัวหน้าเพื่อขอไฟล์ที่ชัดเจน และทวนตัวเลขสำคัญกลับก่อนเริ่มงาน", "ตัดชิ้นงานเผื่อขนาดไว้เกินเล็กน้อยเพื่อให้นำมาแก้ไขลดขนาดได้ภายหลังเมื่อทราบค่าจริง"], "answer": 3, "explanation": "ข้อมูลตัวเลขในคำสั่งเป็นสาระสำคัญ ห้ามเดาหรืออนุมานจากงานเดิมโดยเด็ดขาด ต้องขอข้อมูลที่ชัดเจนและทวนกลับกับผู้ออกคำสั่ง การตัดเผื่อไว้ก็ยังสิ้นเปลืองวัสดุและเวลาโดยไม่จำเป็น", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 42, "q": "หัวหน้าสั่งงานด้วยวาจาต่อเนื่องกันถึง 6 ขั้นตอนในครั้งเดียว ท่านควรทำอย่างไรเพื่อให้ปฏิบัติได้ถูกต้อง?", "choices": ["ตั้งใจฟังอย่างมีสมาธิให้จบแล้วรีบไปปฏิบัติทันทีก่อนจะหลงลืม", "จดบันทึกทุกขั้นตอนขณะฟัง แล้วทวนสรุปกลับให้หัวหน้ายืนยันก่อนแยกย้าย", "เริ่มจากสามขั้นตอนแรกให้แม่นยำก่อน ที่เหลือค่อยกลับมาขอคำยืนยันเพิ่มเติมอีกครั้ง", "ชวนเพื่อนที่ความจำดีมาช่วยฟังพร้อมกันเพื่อช่วยกันจดจำให้ครบถ้วน", "เลือกปฏิบัติเฉพาะขั้นตอนที่เข้าใจชัดเจนเพื่อไม่ให้งานผิดพลาด"], "answer": 1, "explanation": "คำสั่งหลายขั้นตอนควรจดบันทึกและทวนกลับเพื่อยืนยันความเข้าใจตรงกันก่อนปฏิบัติ การพึ่งความจำของตนหรือผู้อื่น และการทำเป็นบางส่วน เสี่ยงต่อการตกหล่นและผิดลำดับ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 43, "q": "หัวหน้าคนเดียวกันสั่งงานสองชิ้นโดยระบุว่า 'ด่วนมาก' ทั้งคู่ แต่เวลาที่มีทำได้ทีละชิ้น ท่านควรทำอย่างไร?", "choices": ["สอบถามหัวหน้าว่างานใดต้องเสร็จก่อน พร้อมแจ้งข้อจำกัดด้านเวลา", "เลือกทำงานที่ใช้เวลาน้อยกว่าก่อนเพื่อให้ปิดงานได้เร็วหนึ่งชิ้น", "สลับทำทั้งสองงานคู่ขนานกันไปเพื่อให้คืบหน้าพร้อมกันทั้งคู่", "เริ่มจากงานที่ตนชำนาญมากกว่าเพราะจะเสร็จเร็วและคุณภาพดีกว่า", "แบ่งงานชิ้นหนึ่งให้เพื่อนที่พอมีเวลาช่วยทำคู่ขนานกันไป"], "answer": 0, "explanation": "เมื่องานด่วนชนกันและทรัพยากรจำกัด ผู้ปฏิบัติต้องให้ผู้ออกคำสั่งเป็นผู้จัดลำดับความสำคัญ ไม่ใช่เลือกเองตามความง่าย ความถนัด หรือโอนงานให้ผู้อื่นโดยพลการ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 44, "q": "ท่านพบว่ารหัสอะไหล่ในใบสั่งงานน่าจะพิมพ์ผิด เพราะไม่ตรงกับรุ่นเครื่องที่ต้องซ่อม ท่านควรทำอย่างไร?", "choices": ["เบิกตามรหัสในใบสั่งงานไปก่อนเพราะเอกสารที่อนุมัติแล้วถือเป็นที่สุด", "เบิกตามรหัสที่ถูกต้องซึ่งตนตรวจสอบแล้ว และบันทึกการแก้ไขไว้ในใบสั่งงานให้เรียบร้อยด้วย", "เบิกอะไหล่ทั้งสองรหัสมาเตรียมสำรองไว้เพื่อไม่ให้งานสะดุดรอเอกสาร", "พักงานนี้ไว้ก่อนแล้วไปทำงานอื่นจนกว่าใบสั่งงานฉบับแก้ไขจะออกมา", "แจ้งข้อสังเกตให้ผู้ออกคำสั่งตรวจสอบและแก้ไขเอกสารให้ถูกต้องก่อนเบิก"], "answer": 4, "explanation": "เมื่อสงสัยว่าคำสั่งมีข้อผิดพลาด ต้องรายงานให้ผู้ออกคำสั่งยืนยันหรือแก้ไข การแก้เอกสารเองแม้จะมั่นใจว่าถูก การเบิกเผื่อ หรือฝืนทำตามข้อมูลที่น่าจะผิด ล้วนไม่ใช่วิธีที่ถูกต้อง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 45, "q": "ท่านเป็นพนักงานใหม่ ได้รับคำสั่งที่มีศัพท์เทคนิคเฉพาะโรงงานหลายคำที่ไม่เข้าใจ ท่านควรทำอย่างไร?", "choices": ["จดคำศัพท์ไว้ค้นความหมายจากคู่มือและอินเทอร์เน็ตด้วยตนเองให้ครบก่อนเริ่มงาน", "เริ่มทำส่วนที่เข้าใจไปก่อน ส่วนที่ติดศัพท์เทคนิคค่อยถามเมื่อถึงขั้นตอนนั้น", "สอบถามความหมายจากผู้ออกคำสั่งตรง ๆ และทวนความเข้าใจก่อนเริ่มปฏิบัติ", "สังเกตวิธีทำงานของเพื่อนที่ได้รับคำสั่งเดียวกันแล้วปฏิบัติตามไปพร้อมกัน", "ขอให้จัดรุ่นพี่มาประกบตลอดงานแทนการสอบถามผู้ออกคำสั่งโดยตรง"], "answer": 2, "explanation": "การทวนความเข้าใจกับผู้ออกคำสั่งก่อนปฏิบัติเป็นหน้าที่ของผู้รับคำสั่ง ศัพท์เฉพาะโรงงานอาจมีความหมายต่างจากแหล่งค้นคว้าทั่วไป การค้นเองหรือเลียนแบบผู้อื่นจึงเสี่ยงตีความคลาดเคลื่อนและเกิดอันตราย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 46, "q": "ระหว่างทำงานตามคำสั่งที่ต้องเสร็จก่อนเที่ยง เกิดสารเคมีหกในบริเวณปฏิบัติงาน ท่านควรทำอย่างไร?", "choices": ["เร่งปิดงานส่วนที่ค้างให้เสร็จก่อนเพราะคำสั่งกำหนดเวลาไว้ชัดเจน", "ทำความสะอาดคราบอย่างรวดเร็วด้วยวัสดุซับที่หาได้ใกล้ตัวแล้วทำงานต่อ", "ย้ายไปปฏิบัติงานมุมอื่นที่ปลอดภัยกว่าเพื่อให้งานเดินต่อได้ทันเวลา", "แจ้งเพื่อนร่วมงานที่ว่างกว่าให้มาดูแลจุดสารเคมีหกแทนส่วนตนเร่งทำงานต่อ", "หยุดงาน กั้นพื้นที่และจัดการตามขั้นตอนสารเคมีหก แล้วรายงานหัวหน้าว่างานอาจล่าช้า"], "answer": 4, "explanation": "เหตุฉุกเฉินด้านความปลอดภัยสำคัญกว่ากำหนดเวลา ต้องจัดการตามขั้นตอนที่ถูกต้องและรายงานผลกระทบต่อกำหนดงาน การเช็ดเองแบบลวก ๆ หรือหลบไปทำงานต่อ ปล่อยให้อันตรายคงอยู่ในพื้นที่", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 47, "q": "หัวหน้าคลังสินค้าสั่งให้ท่านขับรถโฟล์คลิฟท์ขนพาเลทด่วน แต่ท่านยังไม่มีใบอนุญาตขับรถโฟล์คลิฟท์ ท่านควรทำอย่างไร?", "choices": ["ขับอย่างช้าและระมัดระวังเป็นพิเศษเพราะเคยสังเกตวิธีขับจากรุ่นพี่มานานจนเข้าใจขั้นตอนดี", "ขับเฉพาะระยะสั้นในโซนที่กั้นคนออกแล้วเพื่อจำกัดความเสี่ยงให้ต่ำสุด", "ประสานเพื่อนที่มีใบอนุญาตให้มาขับแทนแล้วค่อยเรียนแจ้งหัวหน้าภายหลัง", "แจ้งหัวหน้าตรงไปตรงมาว่าตนไม่มีใบอนุญาต และเสนอให้มอบหมายผู้ที่มีคุณสมบัติ", "ขอเลื่อนงานนี้ออกไปก่อนโดยให้เหตุผลว่าตนติดภารกิจเร่งด่วนอื่นอยู่"], "answer": 3, "explanation": "การปฏิบัติงานที่ต้องมีใบอนุญาตโดยไม่มีคุณสมบัติเป็นการเสี่ยงและผิดกฎ ต้องรายงานข้อจำกัดของตนต่อผู้ออกคำสั่งเพื่อให้จัดคนที่เหมาะสม การจัดการแทนกันเองก่อนแล้วแจ้งทีหลังคือการข้ามอำนาจสั่งการ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 48, "q": "หัวหน้ากะเร่งปิดยอด สั่งให้ท่านลงชื่อในใบตรวจคุณภาพว่า 'ผ่าน' ทั้งที่ยังไม่ได้ตรวจชิ้นงานจริง ท่านควรทำอย่างไร?", "choices": ["ลงชื่อตามคำสั่งเพราะความรับผิดชอบย่อมอยู่กับผู้บังคับบัญชาผู้สั่งการ", "แจ้งว่าไม่สามารถลงชื่อรับรองสิ่งที่ยังไม่ได้ตรวจได้ และขอเวลาตรวจตามขั้นตอนที่กำหนด", "สุ่มตรวจตัวอย่างบางชิ้นตามหลักการทางสถิติแล้วลงชื่อรับรองทั้งล็อต", "ขอให้เพื่อนร่วมกะที่ชำนาญการตรวจมากกว่าเป็นผู้ลงชื่อรับรองแทน", "ลงชื่อไปก่อนแต่บันทึกภาพและข้อความคำสั่งไว้เป็นหลักฐานป้องกันตน"], "answer": 1, "explanation": "คำสั่งที่ให้รับรองเท็จเป็นคำสั่งที่ไม่ชอบ ผู้ปฏิบัติมีหน้าที่ทักท้วง และรายงานผู้บริหารระดับสูงขึ้นหากถูกกดดัน การสุ่มตรวจนอกขั้นตอนหรือให้ผู้อื่นลงชื่อแทนก็ยังเป็นการรับรองที่ไม่ตรงความจริง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 49, "q": "หัวหน้าสั่งงานไว้ตั้งแต่เช้า แต่บ่ายสถานการณ์หน้างานเปลี่ยนไปมากจนคำสั่งเดิมอาจไม่เหมาะสม และหัวหน้าออกไปประชุมนอกสถานที่ ท่านควรทำอย่างไร?", "choices": ["ทำตามคำสั่งเดิมทุกประการเพราะผู้ปฏิบัติไม่มีอำนาจเปลี่ยนแปลงคำสั่งด้วยตนเองไม่ว่ากรณีใด", "ปรับวิธีทำงานตามสถานการณ์จริงหน้างานแล้วรายงานเมื่อหัวหน้ากลับมา", "พยายามติดต่อหัวหน้าทุกช่องทางเพื่อขอคำสั่งใหม่ หากไม่ได้ให้ปรึกษาผู้รักษาการแทน", "ชะลองานไว้ก่อนอย่างเงียบ ๆ เพื่อไม่ให้ความเสียหายขยายวงกว้างไปมากกว่านี้", "ประชุมทีมหน้างานแล้วดำเนินการตามมติเสียงส่วนใหญ่ของผู้ปฏิบัติ"], "answer": 2, "explanation": "เมื่อสถานการณ์เปลี่ยนจนกระทบคำสั่ง ต้องรายงานผู้ออกคำสั่งหรือผู้รักษาการแทนเพื่อขอคำวินิจฉัย ไม่ควรฝืนทำทั้งที่รู้ว่าจะเสียหาย ปรับคำสั่งเองแล้วค่อยรายงาน หรือใช้มติกลุ่มแทนผู้มีอำนาจ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 50, "q": "ท่านทำงานเสร็จก่อนกำหนดเวลาที่หัวหน้าสั่งไว้ ขั้นตอนใดเหมาะสมที่สุดเป็นลำดับถัดไป?", "choices": ["ตรวจสอบผลงานเทียบกับวัตถุประสงค์ของคำสั่งอีกครั้ง แล้วรายงานผลให้หัวหน้าทราบ", "ใช้เวลาที่เหลือทบทวนบทเรียนที่ได้จากงานเพื่อพัฒนาตนเองระหว่างรอการมอบหมายงานชิ้นใหม่", "เริ่มศึกษางานชิ้นถัดไปที่คาดว่าจะได้รับมอบหมายเพื่อเตรียมพร้อมล่วงหน้า", "ไปช่วยงานเพื่อนร่วมทีมที่ยังไม่เสร็จทันทีเพื่อประโยชน์โดยรวมของทีม", "เก็บงานไว้ตรวจทานไปเรื่อย ๆ แล้วส่งเมื่อใกล้ครบกำหนดเพื่อความรอบคอบ"], "answer": 0, "explanation": "การตอบสนองภารกิจให้สมบูรณ์รวมถึงการตรวจสอบคุณภาพเทียบกับเป้าหมายและรายงานผลต่อผู้สั่งงานทันที การไปทำอย่างอื่นหรือถ่วงงานไว้โดยยังไม่รายงาน ถือว่ากระบวนการยังไม่ครบ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 51, "q": "เพื่อนร่วมงานมาบอกว่า 'หัวหน้าฝากสั่งให้นายไปปรับตั้งค่าเตาอบใหม่ แต่จำตัวเลขไม่ได้แล้ว ประมาณสองร้อยกว่า ๆ' ท่านควรทำอย่างไร?", "choices": ["ตั้งค่าที่ 250 องศาไว้ก่อนเพราะเป็นค่ากลางของช่วงที่เพื่อนแจ้งมา", "ยืนยันตัวเลขที่ถูกต้องกับหัวหน้าผู้ออกคำสั่งโดยตรงก่อนปรับตั้ง", "ตั้งค่าตามบันทึกการผลิตครั้งก่อนซึ่งเป็นข้อมูลจริงที่ตรวจสอบได้", "ขอให้เพื่อนผู้รับสารกลับไปยืนยันตัวเลขกับหัวหน้าอีกครั้งให้แน่ใจ", "ทดลองปรับทีละขั้นแล้วสังเกตผลชิ้นงานเพื่อหาค่าที่เหมาะสมที่สุด"], "answer": 1, "explanation": "คำสั่งที่ส่งต่อผ่านบุคคลอื่นและข้อมูลไม่ครบ ต้องยืนยันกับผู้ออกคำสั่งต้นทางด้วยตนเอง การให้คนกลางไปถามซ้ำยังเสี่ยงคลาดเคลื่อนอีกทอด ส่วนการอ้างค่าครั้งก่อนหรือทดลองเองอาจไม่ตรงกับงานใหม่", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 52, "q": "ขณะเดินเครื่องกลึงตามใบสั่งงาน ท่านได้ยินเสียงผิดปกติดังจากชุดเกียร์เป็นระยะ แม้เครื่องยังทำงานได้ ท่านควรทำอย่างไร?", "choices": ["เร่งปิดชิ้นงานที่ค้างให้จบก่อนเพื่อไม่ให้เสียงานหากเครื่องต้องหยุดซ่อมนาน", "เฝ้าสังเกตอาการต่อไปก่อนเพราะเครื่องยังทำงานได้ตามปกติทุกฟังก์ชัน", "หยอดน้ำมันหล่อลื่นชุดเกียร์เพิ่มตามคู่มือแล้วเดินเครื่องต่ออย่างระมัดระวังเป็นพิเศษ", "จดบันทึกอาการอย่างละเอียดไว้รายงานรวมในเอกสารสรุปประจำสัปดาห์", "หยุดเครื่องอย่างปลอดภัย แล้วรายงานอาการผิดปกติให้หัวหน้าหรือฝ่ายซ่อมบำรุงทันที"], "answer": 4, "explanation": "อาการผิดปกติของเครื่องจักรเป็นสัญญาณความเสี่ยง ต้องหยุดและรายงานทันทีเพื่อป้องกันอุบัติเหตุและความเสียหายลุกลาม การเฝ้าดูต่อ ซ่อมบำรุงเอง หรือเก็บไว้รายงานภายหลัง ล้วนปล่อยความเสี่ยงคงอยู่", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 53, "q": "หัวหน้ามอบหมายงานเขียนโปรแกรมควบคุม PLC ซึ่งท่านมีพื้นฐานเพียงเล็กน้อยและไม่มั่นใจว่าจะทำได้ตามกำหนด ท่านควรทำอย่างไร?", "choices": ["ตอบรับอย่างมั่นใจไว้ก่อนแล้วเร่งศึกษาเรียนรู้ด้วยตนเองนอกเวลางานให้ทันตามกำหนดส่งงาน", "ขอผ่องถ่ายงานนี้ให้ผู้ที่ชำนาญกว่าเพื่อประโยชน์สูงสุดขององค์กร", "แจ้งหัวหน้าตามจริงถึงระดับทักษะของตน และขอคำแนะนำ พี่เลี้ยง หรือการปรับกำหนดเวลา", "รับงานแล้วประสานผู้เชี่ยวชาญภายนอกมาช่วยดำเนินการให้ทันกำหนด", "รับงานแล้วทำเฉพาะส่วนที่ตนมั่นใจ ส่วนที่เกินทักษะค่อยแจ้งตอนส่งมอบงาน"], "answer": 2, "explanation": "การทบทวนความพร้อมของตนก่อนรับปฏิบัติเป็นส่วนหนึ่งของการทำความเข้าใจคำสั่ง ควรสื่อสารข้อจำกัดตามจริงเพื่อให้ผู้สั่งงานวางแผนสนับสนุนได้ ไม่ใช่รับปากเกินจริง ปัดงาน หรือจัดหาคนนอกเองโดยพลการ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 54, "q": "หัวหน้าครัวสั่งว่า 'เตรียมวัตถุดิบให้พอสำหรับพรุ่งนี้' โดยไม่บอกจำนวนลูกค้าที่คาดไว้ ท่านควรทำอย่างไร?", "choices": ["สอบถามจำนวนลูกค้าที่คาดการณ์หรือเกณฑ์ปริมาณให้ชัดเจนก่อนเตรียม", "เตรียมเผื่อไว้ให้มากที่สุดเท่าที่จัดเก็บได้เพื่อไม่ให้ของขาดหน้าร้าน", "เตรียมตามยอดใช้จริงของวันเดียวกันในสัปดาห์ก่อนซึ่งมีสถิติอ้างอิงได้", "เตรียมขั้นต่ำไว้ก่อนแล้วจัดคนพร้อมวิ่งซื้อเพิ่มทันทีเมื่อใกล้หมด", "ให้แต่ละสถานีครัวเตรียมตามปริมาณที่ตนเคยใช้เป็นประจำ"], "answer": 0, "explanation": "คำว่า 'ให้พอ' เป็นคำกำกวมเชิงปริมาณ ต้องสอบถามเกณฑ์ที่ชัดเจนจากผู้ออกคำสั่ง การเดาหรืออ้างสถิติเดิมเองอาจไม่ตรงกับแผนงานพรุ่งนี้ ทำให้วัตถุดิบเหลือทิ้งหรือไม่พอบริการลูกค้า", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 55, "q": "ฝ่ายผลิตสั่งให้ตั้งค่าความหนาชิ้นงาน 5 มม. แต่ฝ่ายควบคุมคุณภาพส่งสเปกมาให้เป็น 5.5 มม. เอกสารทั้งสองออกวันเดียวกัน ท่านควรทำอย่างไร?", "choices": ["ใช้ค่า 5 มม. เพราะฝ่ายผลิตเป็นผู้สั่งงานโดยตรงของผู้ปฏิบัติตามสายการบังคับบัญชา", "ใช้ค่า 5.5 มม. เพราะฝ่ายควบคุมคุณภาพย่อมยึดสเปกของลูกค้าเป็นหลัก", "ผลิตล็อตทดลองทั้งสองความหนาแล้วส่งให้ทั้งสองฝ่ายเลือกจากชิ้นงานจริง", "รายงานความขัดแย้งของข้อมูลให้ทั้งสองฝ่ายทราบ และรอผู้มีอำนาจยืนยันค่าที่ถูกต้องก่อนผลิต", "ใช้ค่าจากเอกสารฉบับที่ลงเวลาออกช้ากว่าเพราะถือเป็นข้อมูลที่ใหม่ล่าสุดกว่า"], "answer": 3, "explanation": "เมื่อข้อมูลจากสองหน่วยงานขัดแย้งกัน ต้องหยุดและให้ผู้มีอำนาจชี้ขาดยืนยันเป็นลายลักษณ์อักษรก่อนปฏิบัติ การเลือกข้างตามสายงาน เดาจากเวลาออกเอกสาร หรือผลิตทดลองสองแบบ ล้วนเสี่ยงเสียทั้งวัสดุและเวลา", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 56, "q": "ขณะท่านกำลังทำงานตามคำสั่งของหัวหน้าแผนก A ผู้จัดการเดินมาสั่งงานด่วนอีกชิ้นให้ทำทันที ท่านควรทำอย่างไร?", "choices": ["เรียนผู้จัดการว่ากำลังทำงานของหัวหน้าแผนก A อยู่ และขอให้ประสานลำดับความสำคัญกันก่อน", "สลับมาทำงานของผู้จัดการทันทีเพราะคำสั่งผู้บริหารระดับสูงย่อมสำคัญกว่า", "เรียนปฏิเสธอย่างสุภาพเพราะตามระเบียบต้องรับคำสั่งผ่านผู้บังคับบัญชาโดยตรงตามสายงานเท่านั้น", "รับปากทั้งสองงานไว้พร้อมกันแล้วบริหารเวลาเองให้เสร็จทันทั้งคู่ให้จงได้", "รับงานผู้จัดการแล้วกระจายงานเดิมให้เพื่อนช่วยทำโดยตกลงกันเองในทีม"], "answer": 0, "explanation": "เมื่อได้รับคำสั่งซ้อนจากผู้บังคับบัญชาหลายระดับ ต้องสื่อสารให้ทุกฝ่ายรับทราบและจัดลำดับความสำคัญร่วมกัน การทิ้งงานเดิมเงียบ ๆ การปฏิเสธโดยอ้างระเบียบ หรือรับปากทั้งหมดไว้เอง ล้วนสร้างความเสียหาย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 57, "q": "หัวหน้าสั่งให้ท่านใช้เครื่องเชื่อมรุ่นใหม่ที่เพิ่งติดตั้ง ซึ่งท่านยังไม่เคยผ่านการอบรมการใช้งาน ท่านควรทำอย่างไร?", "choices": ["ศึกษาคู่มือประจำเครื่องอย่างละเอียดถี่ถ้วนด้วยตนเองแล้วทดลองใช้งานอย่างระมัดระวัง", "ดูวิดีโอสาธิตของผู้ผลิตให้เข้าใจหลักการก่อนแล้วจึงลงมือใช้งานจริง", "ใช้เครื่องเชื่อมรุ่นเก่าที่ตนชำนาญทำงานแทนไปก่อนเพื่อให้ทันกำหนด", "แจ้งหัวหน้าว่ายังไม่ผ่านการอบรมเครื่องรุ่นนี้ และขอผู้ชำนาญกำกับดูแลก่อนปฏิบัติ", "ขอให้เพื่อนที่พอใช้งานเป็นช่วยสอนหน้างานแบบเร่งรัดแล้วลงมือปฏิบัติทันที"], "answer": 3, "explanation": "การใช้อุปกรณ์ที่ยังไม่ผ่านการอบรมเสี่ยงต่ออันตรายและความเสียหาย ต้องรายงานข้อจำกัดต่อผู้ออกคำสั่งเพื่อจัดการอบรมหรือการกำกับดูแลที่เหมาะสม การศึกษาเองจากคู่มือหรือวิดีโอไม่ทดแทนการอบรมตามมาตรฐาน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 58, "q": "งานที่ได้รับมอบหมายล้มเหลวเพราะซัพพลายเออร์ส่งวัสดุล่าช้ากว่ากำหนดมาก ท่านควรรายงานหัวหน้าอย่างไรจึงเหมาะสมที่สุด?", "choices": ["รอให้หัวหน้าสอบถามก่อนจึงชี้แจงเพื่อไม่ให้ดูเป็นการแก้ตัวล่วงหน้า", "รายงานสรุปสั้น ๆ ว่างานไม่เสร็จตามกำหนดโดยยังไม่ต้องลงรายละเอียด", "รายงานโดยชี้ให้เห็นว่าความล่าช้าทั้งหมดเกิดจากซัพพลายเออร์ภายนอก", "รายงานความสำเร็จส่วนที่ทำได้ก่อน ส่วนที่ติดขัดค่อยชี้แจงเมื่อแก้ไขแล้ว", "รายงานทันทีตามข้อเท็จจริง ระบุสาเหตุ ผลกระทบ และเสนอแนวทางแก้ไข"], "answer": 4, "explanation": "การรายงานผลต้องรวดเร็ว ตรงตามข้อเท็จจริง และมีข้อเสนอแนะประกอบ เพื่อให้ผู้สั่งงานตัดสินใจแก้สถานการณ์ได้ทัน การรอให้ถูกถาม รายงานครึ่งเดียว หรือมุ่งชี้ความผิดผู้อื่นโดยไม่เสนอทางแก้ ทำให้ปัญหาบานปลาย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 59, "q": "ใบสั่งงานเขียนให้ทาสีรองพื้น 2 รอบ แต่ตอนมอบงานหัวหน้าพูดด้วยวาจาว่า 'รอบเดียวพอ' ท่านควรทำอย่างไร?", "choices": ["ยึดตามเอกสารเพราะคำสั่งลายลักษณ์อักษรย่อมมีน้ำหนักเหนือคำพูดเสมอ", "ยึดตามคำพูดล่าสุดเพราะเป็นการแก้ไขคำสั่งเดิมโดยผู้มีอำนาจเอง", "สอบถามหัวหน้าให้ยืนยันชัดเจน และขอให้แก้ไขเอกสารให้ตรงกัน", "ทารองพื้นสองรอบตามเอกสารไว้ก่อนเพราะทำเกินย่อมดีกว่าทำขาด", "สอบถามผู้ควบคุมงานหน้างานให้ช่วยชี้ขาดแทนการรบกวนหัวหน้า"], "answer": 2, "explanation": "เมื่อคำสั่งลายลักษณ์อักษรกับวาจาขัดแย้งกัน ต้องให้ผู้ออกคำสั่งยืนยันและปรับเอกสารให้ตรงกัน เพื่อป้องกันข้อโต้แย้งภายหลัง การเลือกเชื่อฝั่งใดฝั่งหนึ่งเองแม้ฟังมีเหตุผลก็ยังเป็นการตีความแทนผู้มีอำนาจ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 60, "q": "หัวหน้ามอบหมายให้ท่านนำคำสั่งเปลี่ยนแผนการผลิตไปแจ้งทีมงาน 8 คนก่อนเริ่มกะ ท่านควรดำเนินการอย่างไร?", "choices": ["แจ้งหัวหน้ากลุ่มย่อยทั้งสองคนให้ครบถ้วนแล้วให้ช่วยกระจายต่อทีมของตน", "เรียกประชุมสั้น แจ้งรายละเอียดพร้อมเอกสาร เปิดให้ซักถาม และตรวจสอบความเข้าใจของทุกคน", "ติดประกาศรายละเอียดฉบับเต็มไว้ที่บอร์ดประชาสัมพันธ์หน้าไลน์ผลิตก่อนเริ่มกะ", "ส่งรายละเอียดครบถ้วนในกลุ่มแชทของทีมพร้อมกำชับให้ทุกคนกดรับทราบข้อความ", "แจ้งด้วยวาจากับสมาชิกในทีมทีละคนตามลำดับที่เดินทางมาถึงก่อนเริ่มกะ"], "answer": 1, "explanation": "การส่งต่อคำสั่งสำคัญต้องแจ้งครบถ้วน มีหลักฐาน เปิดโอกาสซักถาม และยืนยันความเข้าใจของผู้รับทุกคน การแจ้งผ่านคนกลาง บอร์ดประกาศ หรือแชทที่กดรับทราบ ยืนยันได้เพียงว่าเห็นข้อความ แต่ไม่ยืนยันความเข้าใจ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 61, "q": "ขณะท่านกำลังปฏิบัติงานตามคำสั่งของตน เห็นเพื่อนร่วมงานแผนกข้าง ๆ ถอดการ์ดป้องกันใบเลื่อยออกเพื่อทำงานให้เร็วขึ้น ท่านควรทำอย่างไร?", "choices": ["ไม่เข้าไปก้าวก่ายเพราะเป็นอำนาจกำกับดูแลของหัวหน้าแผนกนั้นโดยตรงตามสายงาน", "บันทึกภาพไว้เป็นหลักฐานแล้วส่งให้คณะกรรมการความปลอดภัยพิจารณา", "เตือนเพื่อนถึงอันตรายทันที หากยังฝืนทำต่อให้รายงานเจ้าหน้าที่ความปลอดภัย", "รวบรวมข้อมูลไว้นำเสนอในวาระการประชุมด้านความปลอดภัยประจำเดือน", "รายงานหัวหน้าแผนกของเพื่อนโดยตรงโดยยังไม่ต้องเข้าไปเตือนเพื่อนก่อน"], "answer": 2, "explanation": "วัฒนธรรมความปลอดภัยเป็นหน้าที่ของทุกคน ต้องเตือนให้หยุดพฤติกรรมเสี่ยงทันทีก่อนแล้วจึงรายงาน การอ้างว่าเป็นเรื่องของแผนกอื่น หรือรอช่องทางเอกสารและการประชุม ล้วนปล่อยให้ความเสี่ยงดำเนินต่อไป", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 62, "q": "หัวหน้าสั่งงานพร้อมกำหนดส่งที่ท่านประเมินแล้วว่าจะทันได้ก็ต่อเมื่อข้ามขั้นตอนตรวจสอบคุณภาพขั้นสุดท้าย ท่านควรทำอย่างไร?", "choices": ["เร่งงานทุกขั้นตอนให้กระชับลงและตัดออกเฉพาะการตรวจสอบซ้ำส่วนที่มีความสำคัญน้อยที่สุด", "แจ้งหัวหน้าถึงข้อจำกัดตั้งแต่แรก และให้หัวหน้าตัดสินใจทางเลือกอย่างเป็นทางการ", "รับกำหนดส่งไว้ก่อนแล้วทยอยแจ้งความล่าช้าเมื่อใกล้ถึงกำหนดจริง", "เปลี่ยนไปตรวจคุณภาพแบบสุ่มตัวอย่างแทนการตรวจเต็มรูปแบบเพื่อประหยัดเวลา", "ทำงานล่วงเวลาเองเงียบ ๆ ให้ครบทุกขั้นตอนโดยไม่รายงานความเสี่ยงให้ทราบ"], "answer": 1, "explanation": "เมื่อเป้าหมายเวลาขัดกับขั้นตอนคุณภาพ ต้องรายงานข้อจำกัดให้ผู้สั่งงานตัดสินใจอย่างเป็นทางการ การตัดหรือหย่อนการตรวจสอบเองแม้บางส่วนคือการแก้คำสั่งโดยพลการที่เสี่ยงต่อความเสียหายใหญ่", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 63, "q": "ผู้จัดการสั่งให้ท่านจัดผังคลังสินค้าใหม่ภายในสัปดาห์นี้ ก่อนลงมือท่านควรทำสิ่งใดเป็นอันดับแรก?", "choices": ["สอบถามวัตถุประสงค์ของการจัดผังใหม่เพื่อวางแผนให้ตรงเป้าหมาย", "สำรวจและวัดพื้นที่คลังทั้งหมดก่อนเพื่อให้มีข้อมูลจริงประกอบการวางผัง", "ศึกษาผังคลังมาตรฐานของบริษัทชั้นนำมาปรับใช้ให้ทันสมัยที่สุด", "เริ่มย้ายโซนสินค้าหมุนเวียนเร็วมาไว้หน้าคลังก่อนตามหลักการทั่วไป", "ประชุมพนักงานคลังให้ร่วมกันออกแบบผังตามความถนัดของหน้างาน"], "answer": 0, "explanation": "การทำความเข้าใจวัตถุประสงค์ของคำสั่งก่อนปฏิบัติทำให้เลือกวิธีได้ถูกต้องและวัดผลสำเร็จได้ การสำรวจพื้นที่หรือใช้หลักการทั่วไปโดยยังไม่รู้เป้าหมาย อาจต้องรื้อทำใหม่ทั้งหมด", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 64, "q": "ลูกค้าที่หน้างานเร่งให้ท่านติดตั้งอุปกรณ์เพิ่มนอกเหนือจากใบสั่งงาน โดยบอกว่า 'เดี๋ยวเคลียร์กับบริษัทให้เอง' ท่านควรทำอย่างไร?", "choices": ["ติดตั้งให้ตามที่ลูกค้าขอเพราะลูกค้ายืนยันหนักแน่นว่าจะประสานเคลียร์กับบริษัทให้เรียบร้อยเอง", "ติดตั้งให้โดยไม่คิดค่าใช้จ่ายเพิ่มเพื่อรักษาความสัมพันธ์อันดีกับลูกค้า", "ประเมินค่าใช้จ่ายเพิ่มและเรียกเก็บจากลูกค้าโดยตรงตามจริงแล้วจึงติดตั้ง", "ปฏิบัติเฉพาะตามใบสั่งงาน และแจ้งลูกค้าให้ประสานคำขอเพิ่มผ่านบริษัทอย่างเป็นทางการ", "ติดตั้งเฉพาะส่วนเล็กน้อยที่ไม่กระทบระบบหลักให้ไว้ก่อนเป็นน้ำใจแก่ลูกค้า"], "answer": 3, "explanation": "การขยายขอบเขตงานต้องมาจากผู้มีอำนาจออกคำสั่งเท่านั้น คำรับปากของลูกค้าหน้างานไม่ใช่คำสั่งที่ชอบ การทำเกินคำสั่งแม้บางส่วนอาจกระทบสัญญา ค่าใช้จ่าย และความรับผิด", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 65, "q": "ท่านรับช่วงงานต่อจากกะก่อน พบว่าเครื่องเจียรที่ต้องใช้ตามคำสั่งถูกถอดการ์ดป้องกันออกและหาไม่พบ ท่านควรทำอย่างไร?", "choices": ["ใช้เครื่องต่อโดยสวมแว่นนิรภัยและกระบังหน้าเพิ่มเป็นการป้องกันชดเชย", "ใช้เครื่องอย่างระมัดระวังเป็นพิเศษเพราะกะก่อนก็ใช้งานมาตลอดทั้งกะโดยไม่มีอุบัติเหตุใด ๆ", "จัดทำแผ่นกั้นสะเก็ดชั่วคราวที่แข็งแรงพอมาติดตั้งเองก่อนเริ่มใช้งาน", "ประสานขอใช้เครื่องเจียรของแผนกข้างเคียงไปพลางก่อนโดยแจ้งกันปากเปล่า", "ไม่ใช้เครื่องดังกล่าว รายงานหัวหน้าเรื่องการ์ดหาย และรอติดตั้งให้ครบก่อนปฏิบัติงาน"], "answer": 4, "explanation": "ห้ามใช้เครื่องจักรที่อุปกรณ์ป้องกันไม่ครบโดยเด็ดขาด อุปกรณ์ส่วนบุคคลหรือของดัดแปลงชั่วคราวไม่ทดแทนการ์ดมาตรฐาน และการที่กะก่อนเคยใช้มาก็ไม่ทำให้ปลอดภัยขึ้น ต้องรายงานและรอการแก้ไข", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 66, "q": "คำสั่งที่ได้รับตีความได้สองแบบ กำหนดส่งคือเย็นนี้ แต่หัวหน้าผู้ออกคำสั่งลาป่วยติดต่อไม่ได้ทุกช่องทาง ท่านควรทำอย่างไร?", "choices": ["เลือกตีความในแบบที่สอดคล้องกับแนวทางงานเดิมของหน่วยงานมากที่สุด", "เลื่อนกำหนดส่งออกไปก่อนโดยแจ้งผู้เกี่ยวข้องว่ารอหัวหน้ายืนยัน", "จัดทำงานทั้งสองแบบคู่ขนานกันไปเพื่อให้มีผลงานที่ถูกต้องแน่นอน", "ตัดสินใจเลือกแบบที่ดีที่สุดตามดุลยพินิจแล้วรายงานเมื่อหัวหน้ากลับมา", "ปรึกษาผู้รักษาการแทนเพื่อขอคำวินิจฉัย พร้อมบันทึกไว้รายงานหัวหน้าเมื่อกลับมา"], "answer": 4, "explanation": "เมื่อผู้ออกคำสั่งติดต่อไม่ได้ ให้ใช้สายการบังคับบัญชาสำรองช่วยวินิจฉัยและบันทึกไว้เป็นหลักฐาน การตีความเอง เลื่อนงานเอง หรือทำสองแบบ ล้วนใช้ดุลยพินิจแทนผู้มีอำนาจและสิ้นเปลืองทรัพยากร", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 67, "q": "หลังส่งมอบงานติดตั้งระบบไฟตามคำสั่งเรียบร้อยแล้ว ท่านมาพบภายหลังว่ามีจุดต่อสายหนึ่งจุดที่ตนขันไม่แน่นตามมาตรฐาน ท่านควรทำอย่างไร?", "choices": ["รายงานหัวหน้าตามความจริงทันที และขอเข้าแก้ไขจุดบกพร่องตามขั้นตอน", "บันทึกจุดดังกล่าวไว้ในรายงานตรวจสอบประจำปีเพื่อแก้ไขในรอบบำรุงรักษา", "เฝ้าติดตามจุดนั้นเป็นระยะก่อน หากพบความร้อนผิดปกติจึงค่อยแจ้งซ่อม", "กลับเข้าไปขันแก้ให้แน่นด้วยตนเองทันทีโดยถือเป็นการเก็บงานตามปกติ", "แจ้งทีมซ่อมบำรุงประจำอาคารให้ช่วยตรวจสอบโดยไม่ต้องรายงานหัวหน้า"], "answer": 0, "explanation": "ความบกพร่องที่พบภายหลังต้องรายงานตามความจริงทันทีเพื่อแก้ไขอย่างถูกขั้นตอน จุดต่อไฟที่หลวมอาจก่อไฟไหม้ การรอรอบบำรุงรักษา เฝ้าดูอาการ หรือแอบแก้เองโดยไม่มีบันทึก ทำให้ตรวจสอบย้อนกลับไม่ได้", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 68, "q": "หัวหน้าสั่งให้ท่านเข้าไปทำงานในถังอับอากาศทันทีโดยไม่ต้องรอผลตรวจวัดแก๊ส ซึ่งขัดกับระเบียบความปลอดภัยของบริษัท ท่านควรทำอย่างไร?", "choices": ["เข้าไปปฏิบัติทันทีเพราะผู้ออกคำสั่งย่อมเป็นผู้รับผิดชอบผลที่ตามมา", "แจ้งหัวหน้าอย่างสุภาพว่าระเบียบกำหนดให้ตรวจวัดแก๊สก่อน และขอทำตามขั้นตอนความปลอดภัย", "เข้าไปทำให้เสร็จโดยเร็วที่สุดพร้อมจัดเพื่อนเฝ้าปากถังคอยสังเกตอาการผิดปกติอยู่ตลอดเวลา", "สวมหน้ากากกรองอากาศที่มีอยู่ในคลังแล้วเข้าไปปฏิบัติงานอย่างรวดเร็ว", "เปิดฝาถังระบายอากาศไว้ราวครึ่งชั่วโมงก่อนเข้าไปโดยถือว่าเพียงพอแล้ว"], "answer": 1, "explanation": "คำสั่งที่ขัดกับระเบียบความปลอดภัยต้องได้รับการทักท้วง และหากถูกบังคับให้รายงานเจ้าหน้าที่ความปลอดภัย การจัดคนเฝ้าปากถัง หน้ากากกรองอากาศ หรือการระบายอากาศเอง ไม่ทดแทนการตรวจวัดแก๊สซึ่งชี้ขาดว่าเข้าได้หรือไม่", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 69, "q": "คู่มือประกอบชิ้นส่วนกำหนดลำดับการขันสลักเกลียวไว้ 12 ตำแหน่งแบบสลับฟันปลา ท่านคิดว่าขันเรียงแถวไปเลยน่าจะเร็วกว่า ท่านควรทำอย่างไร?", "choices": ["ขันเรียงแถวตามที่ตนถนัดเพราะแรงบิดสุดท้ายที่ได้ย่อมเท่ากันทุกตัวอยู่แล้วเหมือนกัน", "ขันเรียงแถวพอตึงมือก่อนแล้วค่อยไล่ตามลำดับคู่มือเฉพาะรอบสุดท้าย", "สอบถามเพื่อนที่เคยขันแบบเรียงแถวมาก่อนว่าชิ้นงานเคยมีปัญหาหรือไม่", "ปฏิบัติตามลำดับในคู่มืออย่างเคร่งครัด และเสนอข้อปรับปรุงผ่านฝ่ายวิศวกรรม", "ขันตามคู่มือเฉพาะจุดยึดหลัก ส่วนจุดรองขันเรียงแถวเพื่อประหยัดเวลา"], "answer": 3, "explanation": "ลำดับการขันถูกออกแบบเพื่อกระจายแรงอย่างสม่ำเสมอ การเปลี่ยนหรือผสมลำดับเองแม้บางส่วนอาจทำให้ชิ้นงานบิดตัวเสียหาย ข้อเสนอปรับปรุงต้องผ่านผู้มีอำนาจทางเทคนิค ไม่ใช่ตัดสินใจเองหน้างาน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 70, "q": "ท่านได้รับคำสั่งงานต่อเนื่องตอนใกล้หมดกะ และต้องส่งมอบงานที่ค้างให้กะถัดไปทำต่อ ท่านควรทำอย่างไร?", "choices": ["จัดเก็บพื้นที่งานให้เรียบร้อยแล้วกลับตามเวลา ให้กะถัดไปดูรายละเอียดจากใบสั่งงานเอง", "อธิบายรายละเอียดปากเปล่าอย่างครบถ้วนกับพนักงานกะถัดไปคนแรกที่เดินทางมาถึง", "บันทึกสถานะงานและข้อควรระวังเป็นลายลักษณ์อักษร พร้อมอธิบายส่งมอบกับผู้รับผิดชอบกะถัดไปโดยตรง", "อยู่ทำงานต่อให้เสร็จด้วยตนเองแม้เลยเวลากะเพื่อไม่ให้เป็นภาระของกะถัดไป", "ส่งรูปถ่ายหน้างานพร้อมข้อความสรุปสั้นไว้ในกลุ่มแชทของแผนกให้เปิดดู"], "answer": 2, "explanation": "การส่งมอบงานข้ามกะต้องมีบันทึกลายลักษณ์อักษรและการอธิบายโดยตรงกับผู้รับผิดชอบ การให้ดูใบสั่งงานเอง เล่าปากเปล่ากับใครก็ได้ หรือฝากข้อความในแชท ส่งต่อข้อควรระวังได้ไม่ครบถ้วน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 71, "q": "ผู้จัดการสั่งว่า 'ไปจัดการเรื่องข้อร้องเรียนของลูกค้ารายนี้ให้เรียบร้อย' โดยไม่ระบุว่าต้องดำเนินการถึงขั้นไหน ท่านควรทำอย่างไร?", "choices": ["โทรขอโทษลูกค้าอย่างจริงใจทันทีเพราะความรวดเร็วในการตอบสนองคือหัวใจสำคัญของงานบริการ", "เสนอส่วนลดหรือของชดเชยให้ลูกค้าทันทีเพื่อยุติเรื่องโดยเร็วที่สุด", "ส่งเรื่องให้ฝ่ายลูกค้าสัมพันธ์ซึ่งมีความชำนาญมากกว่าดำเนินการโดยตรง", "สอบถามผู้จัดการให้ชัดเจนถึงขอบเขตอำนาจและผลลัพธ์ที่ถือว่า 'เรียบร้อย' ก่อนดำเนินการ", "ศึกษาประวัติข้อร้องเรียนแล้วดำเนินการตามแนวทางที่เคยใช้กับรายอื่น"], "answer": 3, "explanation": "คำว่า 'ให้เรียบร้อย' เป็นเป้าหมายที่กำกวม ต้องทวนถามขอบเขตอำนาจและเกณฑ์ความสำเร็จก่อน การรีบชดเชย โยนเรื่องต่อ หรืออ้างแนวทางเดิม อาจเกินอำนาจหรือไม่ตรงเจตนาผู้สั่งงาน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 72, "q": "ระหว่างทำงานด่วนตามคำสั่ง ท่านพบว่าต้องใช้อะไหล่ที่ต้องผ่านการอนุมัติจัดซื้อจากผู้จัดการก่อน ท่านควรทำอย่างไร?", "choices": ["สำรองเงินส่วนตัวซื้อมาก่อนเพื่อให้งานด่วนไม่สะดุดแล้วค่อยทำเรื่องเบิกคืนในภายหลัง", "นำอะไหล่สภาพดีจากเครื่องสำรองที่ไม่ได้ใช้งานมาหมุนเวียนใช้ก่อน", "รายงานหัวหน้าทันทีว่างานติดขั้นตอนอนุมัติจัดซื้อ พร้อมขอให้เร่งกระบวนการ", "ทำส่วนอื่นของงานไปพลางก่อนโดยยังไม่รายงานเพราะถือว่าแก้ปัญหาเองได้", "ยื่นใบขออนุมัติตามขั้นตอนปกติแล้วรอผลโดยไม่ต้องแจ้งผู้ใดเพิ่มเติม"], "answer": 2, "explanation": "เมื่องานด่วนติดข้อจำกัดด้านอำนาจอนุมัติ ต้องรายงานอุปสรรคให้ผู้สั่งงานช่วยเร่งกระบวนการหรือกำหนดแนวทางอย่างเป็นทางการ การสำรองเงินซื้อเอง ถอดอะไหล่หมุนเวียนเอง หรือยื่นเรื่องแล้วรอเงียบ ๆ ทำให้งานด่วนเสียหาย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 73, "q": "รุ่นพี่ในไซต์งานสอนทางลัดที่ขัดกับวิธีในใบสั่งงาน โดยบอกว่า 'ที่นี่เขาทำกันแบบนี้ทั้งนั้น ไม่เคยมีปัญหา' ท่านควรทำอย่างไร?", "choices": ["ทำตามรุ่นพี่เพราะประสบการณ์หน้างานจริงย่อมทันสมัยกว่าเอกสารที่เขียนไว้นานมาแล้ว", "ทำตามทางลัดเฉพาะขั้นตอนที่ประเมินแล้วว่าไม่กระทบคุณภาพชิ้นงาน", "ทำตามทางลัดโดยเพิ่มการตรวจสอบผลงานท้ายกระบวนการให้เข้มงวดขึ้น", "ทดลองทั้งสองวิธีเปรียบเทียบกันแล้วเลือกใช้วิธีที่ให้ผลดีกว่า", "ปฏิบัติตามใบสั่งงาน และนำข้อเสนอทางลัดไปหารือหัวหน้างานให้ประเมินอนุมัติก่อน"], "answer": 4, "explanation": "ความเคยชินของคนหน้างานไม่ใช่ข้ออนุญาตให้เบี่ยงเบนจากคำสั่ง คำว่า 'ไม่เคยมีปัญหา' ไม่ได้แปลว่าปลอดภัย การเลือกใช้ทางลัดเองแม้บางขั้นตอนก็ต้องผ่านการประเมินและอนุมัติจากผู้มีอำนาจก่อน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 74, "q": "หัวหน้าสั่งให้ท่านสอนงานพนักงานใหม่ 2 คนในสัปดาห์หน้า แต่ไม่ได้ระบุหัวข้อ ระยะเวลา และสื่อที่ใช้ ท่านควรทำอย่างไรก่อน?", "choices": ["สอบถามหัวหน้าถึงขอบเขตหัวข้อ เป้าหมาย ระยะเวลา และทรัพยากรที่ใช้ได้ก่อนเตรียมการสอน", "จัดทำแผนการสอนตามประสบการณ์ตรงของตนให้ครอบคลุมเนื้องานทุกด้านมากที่สุด", "ให้พนักงานใหม่ติดตามสังเกตการทำงานจริงตลอดสัปดาห์เพื่อเรียนรู้จากหน้างาน", "นำหลักสูตรปฐมนิเทศกลางของฝ่ายบุคคลมาใช้สอนได้ทันทีโดยไม่ต้องปรับ", "สอบถามพนักงานใหม่ทั้งสองว่าอยากเรียนรู้เรื่องใดแล้วสอนตามนั้น"], "answer": 0, "explanation": "คำสั่งที่ขาดรายละเอียดสำคัญต้องทบทวนขอบเขตและวัตถุประสงค์กับผู้ออกคำสั่งก่อนวางแผนปฏิบัติ การวางแผนตามประสบการณ์ตนเองหรือความต้องการของผู้เรียนโดยไม่รู้เป้าหมายของหัวหน้า อาจสอนไม่ตรงวัตถุประสงค์", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 75, "q": "ระหว่างปฏิบัติงานตามคำสั่ง ท่านเผลอทำชิ้นงานของลูกค้าเสียหายหนึ่งชิ้น ท่านควรทำอย่างไร?", "choices": ["แยกชิ้นงานเสียออกจากไลน์แล้วทำงานต่อ ค่อยสรุปรวมตอนส่งมอบงาน", "หยุดประเมินความเสียหาย แล้วรายงานหัวหน้าตามความจริงทันที", "นำชิ้นงานสำรองที่สเปกเดียวกันมาทดแทนเพื่อให้ยอดส่งมอบครบถ้วน", "รายงานว่าเครื่องจักรมีอาการขัดข้องร่วมด้วยเพื่อให้เรื่องฟังสมเหตุสมผล", "รอให้ฝ่ายตรวจสอบคุณภาพเป็นผู้ตรวจพบเองตามกระบวนการปกติ"], "answer": 1, "explanation": "ความผิดพลาดต้องรายงานตามความจริงทันทีเพื่อจำกัดความเสียหายและหาทางป้องกันการเกิดซ้ำ การเก็บไว้แจ้งทีหลัง สลับชิ้นงานแทน หรือบิดเบือนสาเหตุ ทำลายความไว้วางใจและอาจทำให้ของเสียหลุดถึงลูกค้า", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 76, "q": "หัวหน้ากำลังโมโหและสั่งงานอย่างรวดเร็วรวบรัดจนจับใจความได้ไม่ครบ ท่านควรทำอย่างไร?", "choices": ["รับคำสั่งไว้ก่อนเพื่อลดความตึงเครียด แล้วค่อยขอความชัดเจนเมื่อหัวหน้าอารมณ์ดีขึ้น", "ตั้งสติ ทวนประเด็นสำคัญกลับอย่างสุภาพ เช่น งานอะไร เสร็จเมื่อไร เพื่อยืนยันความเข้าใจ", "สอบถามเพื่อนร่วมงานที่อยู่ในเหตุการณ์ว่าจับใจความได้ตรงกันหรือไม่", "ทำงานเดิมที่ค้างอยู่ต่อไปก่อนแล้วรอหัวหน้าใจเย็นลงจึงเข้าไปรับคำสั่งใหม่", "ส่งอีเมลสรุปความเข้าใจของตนให้หัวหน้าช่วยยืนยันภายในวันเดียวกัน"], "answer": 1, "explanation": "แม้สถานการณ์กดดัน ผู้รับคำสั่งยังต้องยืนยันสาระสำคัญของคำสั่งให้ครบก่อนปฏิบัติ การรอให้อารมณ์ดีขึ้น เทียบความเข้าใจกับเพื่อน หรือรอคำตอบทางอีเมล ล้วนเปิดช่องให้เริ่มงานบนความเข้าใจที่ผิด", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 77, "q": "คำสั่งให้ติดตั้งป้ายที่ความสูง 6 เมตรภายในวันนี้ แต่พบว่าเข็มขัดนิรภัยชนิดเต็มตัวถูกยืมไปใช้ที่ไซต์อื่นหมด ท่านควรทำอย่างไร?", "choices": ["ขึ้นทำงานโดยยึดจับโครงนั่งร้านให้มั่นตลอดเวลาเพราะเป็นงานช่วงสั้น ๆ", "ใช้เชือกใยสังเคราะห์คุณภาพสูงผูกยึดกับโครงสร้างแทนเข็มขัดนิรภัยชั่วคราว", "จัดเพื่อนร่วมงานสองคนคอยเฝ้าระวังด้านล่างพร้อมกั้นพื้นที่ให้ปลอดภัย", "ติดตั้งเฉพาะส่วนที่เอื้อมถึงจากระดับพื้นไปก่อนให้งานมีความคืบหน้า", "ยังไม่ขึ้นปฏิบัติงาน และรายงานหัวหน้าว่าอุปกรณ์ป้องกันการตกไม่พร้อม"], "answer": 4, "explanation": "งานบนที่สูงโดยไม่มีอุปกรณ์ป้องกันการตกเป็นความเสี่ยงถึงชีวิต ต้องรายงานผู้ออกคำสั่งให้จัดหาอุปกรณ์หรือเลื่อนงาน อุปกรณ์ดัดแปลง คนเฝ้าระวัง หรือการทำบางส่วนโดยไม่รายงาน ไม่ใช่การป้องกันที่แท้จริง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 78, "q": "งานที่ท่านได้รับคำสั่งให้ทำต้องรอข้อมูลจากแผนกบัญชี แต่เลยกำหนดที่แผนกบัญ
