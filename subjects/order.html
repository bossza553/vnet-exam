<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 การปฏิบัติตามคำสั่ง — ข้อสอบ V-NET 80 ข้อ</title>
<style>
:root{
  --bg:#0f1220; --bg2:#171b30; --card:#1e2340; --card2:#252b4d;
  --text:#eef0ff; --muted:#9aa3c7; --line:#323a63;
  --brand:#7c6cff; --brand2:#4ecdc4; --good:#3ddc84; --bad:#ff5d73; --warn:#ffc94d;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Noto Sans Thai","Segoe UI",sans-serif;
  background:radial-gradient(1200px 800px at 80% -10%,#2a2f55 0%,var(--bg) 55%);
  color:var(--text); min-height:100vh; line-height:1.6;
}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}

/* ===== Home ===== */
.hero{text-align:center;padding:28px 0 20px}
.hero h1{font-size:2rem;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);margin-top:6px}
.statbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;text-align:center;min-width:110px}
.stat b{font-size:1.3rem;display:block}
.stat span{color:var(--muted);font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.subj{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:left;transition:.18s;position:relative;overflow:hidden}
.subj:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 24px rgba(124,108,255,.25)}
.subj .ic{font-size:1.9rem}
.subj h3{font-size:1.02rem;margin:8px 0 2px}
.subj .sub{color:var(--muted);font-size:.8rem}
.subj .meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:.82rem;color:var(--muted)}
.badge{background:var(--bg2);border:1px solid var(--line);padding:2px 10px;border-radius:999px}
.best{color:var(--warn)}
.subj.mix{background:linear-gradient(135deg,#3b2f7a,#1c5f5a);border-color:#6a5cff}

/* ===== Setup modal ===== */
.overlay{position:fixed;inset:0;background:rgba(8,10,20,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:20px;max-width:440px;width:100%;padding:24px}
.modal h2{font-size:1.2rem;margin-bottom:2px}
.modal .sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.optlabel{font-size:.85rem;color:var(--muted);margin:14px 0 6px}
.optrow{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:.9rem}
.opt.sel{background:var(--brand);border-color:var(--brand);font-weight:700}
.toggle{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.9rem;color:var(--muted);cursor:pointer;user-select:none}
.toggle .box{width:20px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.toggle.on .box{background:var(--good);border-color:var(--good);color:#08331c}
.mrow{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:12px;border-radius:12px;font-size:1rem;font-weight:700}
.btn.primary{background:linear-gradient(90deg,var(--brand),#9b8cff);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line)}

/* ===== Quiz ===== */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qtop .left{display:flex;gap:8px;align-items:center}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.85rem}
.pill.flame{border-color:#ff8c42;color:#ffb347}
.pill.timer{min-width:84px;text-align:center}
.progress{height:8px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.qsec{color:var(--brand2);font-size:.78rem;margin-bottom:6px}
.qtext{font-size:1.08rem;font-weight:600;white-space:pre-wrap}
.choices{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-size:.97rem;transition:.15s;width:100%}
.choice:not(:disabled):hover{border-color:var(--brand)}
.choice .lb{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.choice.correct{border-color:var(--good);background:rgba(61,220,132,.12)}
.choice.correct .lb{background:var(--good);color:#06301a;border-color:var(--good)}
.choice.wrong{border-color:var(--bad);background:rgba(255,93,115,.12)}
.choice.wrong .lb{background:var(--bad);color:#fff;border-color:var(--bad)}
.choice.picked{border-color:var(--brand);background:rgba(124,108,255,.14)}
.choice.dim{opacity:.28;pointer-events:none}
.expl{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid;animation:pop .25s}
.expl.good{background:rgba(61,220,132,.1);border-color:var(--good)}
.expl.bad{background:rgba(255,93,115,.1);border-color:var(--bad)}
.expl h4{font-size:.95rem;margin-bottom:4px}
.expl p{font-size:.92rem;color:var(--text)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.qactions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.lifeline{background:var(--card);border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:10px 16px;font-weight:700}
.lifeline:disabled{opacity:.35;border-color:var(--line);color:var(--muted)}
.shake{animation:shake .35s}
.audio-box{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
.audio-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.playbtn{background:linear-gradient(90deg,#2e7d6b,var(--brand2));color:#04241f;font-weight:800;border-radius:99px;padding:10px 22px;font-size:1rem;display:inline-flex;align-items:center;gap:8px}
.playbtn.playing{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(78,205,196,.5)}50%{box-shadow:0 0 0 10px rgba(78,205,196,0)}}
.scriptbtn{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:.85rem;color:var(--muted)}
.script{margin-top:12px;border-left:3px solid var(--brand2);padding:6px 12px;font-style:italic;color:var(--muted);font-size:.95rem}
.audio-hint{color:var(--muted);font-size:.78rem;margin-top:8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.combo-pop{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);font-size:2.2rem;font-weight:800;pointer-events:none;z-index:99;animation:rise 1s forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}

/* palette (exam mode) */
.palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.pal{width:34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-size:.8rem}
.pal.done{background:var(--brand);border-color:var(--brand);font-weight:700}
.pal.cur{outline:2px solid var(--brand2)}

/* ===== Results ===== */
.result{text-align:center;padding-top:10px}
.ring{width:190px;height:190px;margin:14px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:2.4rem}
.ring .num span{color:var(--muted);font-size:.85rem}
.verdict{font-size:1.3rem;font-weight:800;margin:4px 0 14px}
.rstats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.review{margin-top:26px;text-align:left}
.review h3{margin-bottom:12px}
.rq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.rq .st{font-weight:700}
.rq .st.ok{color:var(--good)} .rq .st.no{color:var(--bad)}
.rq p{font-size:.9rem;margin-top:4px}
.rq .ex{color:var(--muted);font-size:.86rem;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.topbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.85rem}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.footer-note{text-align:center;color:var(--muted);font-size:.75rem;margin-top:40px}
@media(max-width:520px){ .hero h1{font-size:1.5rem} .qtext{font-size:1rem} }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ HOME ============ -->
  <div id="home">
    <div class="hero">
      <h1>📋 การปฏิบัติตามคำสั่ง</h1>
      <p>Following Instructions • 80 ข้อ พร้อมเฉลยและคำอธิบายทุกข้อ</p>
    </div>
    <div class="statbar">
      <div class="stat"><b id="st-total">540</b><span>ข้อสอบทั้งหมด</span></div>
      <div class="stat"><b id="st-answered">0</b><span>ทำไปแล้ว (ครั้ง)</span></div>
      <div class="stat"><b id="st-acc">—</b><span>ความแม่นยำรวม</span></div>
      <div class="stat"><b id="st-streak">0</b><span>สถิติตอบถูกติดกัน</span></div>
    </div>
    <div class="grid" id="subjects"></div>
    <p class="footer-note">แตะวิชาเพื่อเริ่ม • ผลคะแนนบันทึกไว้ในเครื่องอัตโนมัติ</p>
  </div>

  <!-- ============ QUIZ ============ -->
  <div id="quiz" class="hidden">
    <div class="qtop">
      <div class="left">
        <button class="topbtn" onclick="confirmExit()">← ออก</button>
        <span class="pill" id="q-count">1/30</span>
        <span class="pill" id="q-score">✅ 0</span>
      </div>
      <div class="left">
        <span class="pill flame" id="q-streak">🔥 0</span>
        <span class="pill timer" id="q-timer">00:00</span>
        <button class="topbtn" id="mutebtn" onclick="toggleMute()">🔊</button>
      </div>
    </div>
    <div class="progress"><i id="q-progress" style="width:0%"></i></div>
    <div class="qcard" id="qcard">
      <div class="qsec" id="q-section"></div>
      <div class="qtext" id="q-text"></div>
      <div id="q-audio"></div>
      <div class="choices" id="q-choices"></div>
      <div id="q-expl"></div>
      <div class="qactions">
        <button class="lifeline" id="fifty" onclick="useFifty()">✂️ 50:50 <span id="fifty-n">×3</span></button>
        <button class="btn primary hidden" id="nextbtn" onclick="nextQ()">ข้อถัดไป →</button>
        <button class="btn ghost hidden" id="skipbtn" onclick="nextQ()">ข้าม →</button>
        <button class="btn primary hidden" id="submitbtn" onclick="finishQuiz()">ส่งคำตอบ ✅</button>
      </div>
    </div>
    <div class="palette hidden" id="palette"></div>
  </div>

  <!-- ============ RESULT ============ -->
  <div id="result" class="hidden"></div>
</div>

<div id="modal-root"></div>

<script>window.AUDIO_BASE='../audio/';const EXAM_DATA = {"subjects": [{"id": "order", "icon": "📋", "title": "การปฏิบัติตามคำสั่ง", "subtitle": "Following Instructions", "labels": ["ก", "ข", "ค", "ง", "จ"], "questions": [{"n": 1, "q": "เมื่อได้รับมอบหมายงานที่ซับซ้อน สิ่งแรกที่สมาชิกทีมควรปฏิบัติคือข้อใด", "choices": ["เริ่มลงมือทำทันทีเพื่อประหยัดเวลา", "ทบทวนคำสั่งและวัตถุประสงค์ของงานให้เข้าใจถ่องแท้", "ประชุมทีมเพื่อแบ่งหน้าที่ความรับผิดชอบก่อนเป็นอันดับแรก", "ศึกษาตัวอย่างงานเดิมที่ใกล้เคียงแล้วปฏิบัติตามแนวทางนั้นทันที", "ประเมินทรัพยากรและระยะเวลาที่ต้องใช้ก่อนเป็นอันดับแรก"], "answer": 1, "explanation": "งานที่ซับซ้อนต้องเริ่มจากการทบทวนคำสั่งและวัตถุประสงค์ให้เข้าใจถ่องแท้ก่อน จึงจะวางแผนได้ถูกทิศทางและลดความผิดพลาดตั้งแต่ต้น (สมรรถนะ 3.1)", "section": ""}, {"n": 2, "q": "การ \"ตอบสนองต่อภารกิจ\" ที่มีประสิทธิภาพสูงสุดควรพิจารณาจากสิ่งใดเป็นสำคัญ", "choices": ["ความเร็วในการทำงาน", "ความครบถ้วนของขั้นตอนที่ได้ปฏิบัติ", "ความสำเร็จของเป้าหมายที่ได้รับมอบหมาย", "ความประหยัดทรัพยากรที่ใช้ในการทำงาน", "ความรวดเร็วในการตอบรับคำสั่ง"], "answer": 2, "explanation": "ประสิทธิภาพของการตอบสนองต่อภารกิจวัดจากความสำเร็จของเป้าหมายที่ได้รับมอบหมายเป็นสำคัญ ส่วนความเร็ว ความครบถ้วนของขั้นตอน หรือความประหยัดทรัพยากร เป็นเพียงปัจจัยสนับสนุน ไม่ใช่ตัวชี้วัดหลัก", "section": ""}, {"n": 3, "q": "หากคำสั่งที่ได้รับมีผลกระทบต่อความปลอดภัยในการทำงาน ท่านควรทำอย่างไร", "choices": ["ปฏิบัติตามทันทีเพราะเป็นคำสั่งสั่งการ", "ปรับวิธีปฏิบัติให้ปลอดภัยขึ้นด้วยตนเองโดยไม่แจ้งผู้ออกคำสั่ง", "รายงานข้อกังวลด้านความปลอดภัยต่อผู้ออกคำสั่งก่อนปฏิบัติ", "ปฏิบัติเฉพาะส่วนที่มั่นใจว่าปลอดภัยไปพลางก่อน", "ปรึกษาเพื่อนร่วมงานเพื่อลงความเห็นกันว่าควรปฏิบัติหรือไม่"], "answer": 2, "explanation": "ความปลอดภัยต้องมาก่อนเสมอ การรายงานข้อกังวลต่อผู้ออกคำสั่งก่อนปฏิบัติเปิดโอกาสให้ทบทวนคำสั่ง ไม่ควรฝืนปฏิบัติ ปรับแก้วิธีการเองโดยพลการ หรือใช้เสียงส่วนใหญ่ตัดสินแทนผู้มีอำนาจสั่งการ", "section": ""}, {"n": 4, "q": "ข้อใดคือตัวอย่างของการเลือกวิธีสื่อสารที่ \"เหมาะสม\" กับงานด่วนและต้องการการตัดสินใจทันที", "choices": ["การส่งข้อความผ่านแอปพลิเคชันแชทแล้วรอการตอบกลับ", "การส่งอีเมลโดยระบุหัวข้อว่าด่วนที่สุด", "การสื่อสารผ่านโทรศัพท์หรือการพูดคุยโดยตรง", "การส่งอีเมลแจ้งรายละเอียดเชิงลึก", "การนัดประชุมเพื่อชี้แจงอย่างเป็นทางการ"], "answer": 2, "explanation": "งานด่วนที่ต้องตัดสินใจทันทีต้องใช้ช่องทางสื่อสารสองทางที่ได้รับคำตอบทันที คือโทรศัพท์หรือการพูดคุยโดยตรง ส่วนข้อความแชท อีเมล (แม้ระบุว่าด่วน) หรือการนัดประชุม ล้วนได้รับคำตอบช้ากว่า", "section": ""}, {"n": 5, "q": "เมื่อต้องส่งสรุปรายงานการประชุมที่ต้องการความถูกต้องและใช้อ้างอิงภายหลัง ควรเลือกสื่อสารทางใด", "choices": ["การรายงานด้วยวาจาในที่ประชุมอย่างเป็นทางการ", "การส่งข้อความสั้น (SMS)", "การส่งอีเมลหรือเอกสารบันทึกข้อความ", "การพูดคุยผ่านแอปพลิเคชัน Line แบบไม่เป็นทางการ", "การโทรศัพท์แจ้งผู้เกี่ยวข้องเป็นรายบุคคล"], "answer": 2, "explanation": "อีเมลหรือบันทึกข้อความเป็นลายลักษณ์อักษร มีความถูกต้อง ตรวจสอบย้อนหลังและใช้อ้างอิงได้ ต่างจากการบอกด้วยวาจาหรือแชทแบบไม่เป็นทางการ", "section": ""}, {"n": 6, "q": "หากท่านสงสัยในลำดับขั้นตอนการทำงานที่ได้รับมอบหมาย การปฏิบัติในข้อใดถูกต้องที่สุด", "choices": ["ปฏิบัติตามขั้นตอนที่เคยใช้ในงานลักษณะใกล้เคียงกัน", "ตั้งคำถามเพื่อขอความชัดเจนจากผู้ออกคำสั่ง", "เริ่มทำส่วนที่มั่นใจก่อนแล้วค่อยสอบถามส่วนที่เหลือภายหลัง", "ศึกษาคู่มือการปฏิบัติงานด้วยตนเองแทนการสอบถาม", "สอบถามจากเพื่อนร่วมงานที่เคยทำงานนี้แทนผู้ออกคำสั่ง"], "answer": 1, "explanation": "เมื่อสงสัยในขั้นตอนการทำงาน ต้องตั้งคำถามขอความชัดเจนจากผู้ออกคำสั่งโดยตรง (สมรรถนะ 3.3) การอนุมานจากงานเดิม ทำเฉพาะส่วนที่มั่นใจ หรือถามผู้อื่นแทนผู้ออกคำสั่ง เสี่ยงได้ข้อมูลคลาดเคลื่อน", "section": ""}, {"n": 7, "q": "การตั้งคำถามเมื่อสงสัยในคำสั่ง ควรทำในลักษณะใด", "choices": ["ถามทุกรายละเอียดตั้งแต่ต้นจนจบเพื่อความมั่นใจสูงสุด", "ถามด้วยความสุภาพ มุ่งประเด็นที่ความชัดเจนของเนื้องาน", "ถามพร้อมแสดงความเห็นแย้งเพื่อเสนอมุมมองของตนเอง", "ถามทันทีทุกครั้งโดยไม่ทบทวนคำสั่งด้วยตนเองก่อน", "รวบรวมข้อสงสัยไว้สอบถามในคราวเดียวเมื่อใกล้ส่งงาน"], "answer": 1, "explanation": "การตั้งคำถามที่ดีต้องสุภาพและมุ่งประเด็นที่ความชัดเจนของเนื้องาน ควรทบทวนคำสั่งด้วยตนเองก่อนถาม ถามให้ตรงจุด ไม่ถามพร่ำเพรื่อทุกรายละเอียด และไม่เก็บข้อสงสัยไว้ถามเมื่อใกล้ส่งงาน", "section": ""}, {"n": 8, "q": "เมื่อท่านพบว่างานที่ได้รับมอบหมายไม่สามารถเสร็จทันตามกำหนดเวลา (Deadline) ควรทำอย่างไร", "choices": ["ตัดขั้นตอนการตรวจสอบบางส่วนออกเพื่อให้งานเสร็จทันกำหนด", "เร่งทำงานจนวินาทีสุดท้ายแล้วส่งงานที่ไม่สมบูรณ์", "รายงานปัญหาและขอขยายระยะเวลาล่วงหน้าพร้อมเหตุผล", "ทำงานล่วงเวลาด้วยตนเองโดยไม่รายงานความเสี่ยงให้ผู้ใดทราบ", "ขอให้เพื่อนร่วมทีมช่วยทำบางส่วนโดยไม่แจ้งหัวหน้างาน"], "answer": 2, "explanation": "การรายงานปัญหาและขอขยายเวลาล่วงหน้าพร้อมเหตุผล เปิดโอกาสให้หัวหน้าปรับแผนได้ทัน ดีกว่าการส่งงานไม่สมบูรณ์หรือปิดบังปัญหา", "section": ""}, {"n": 9, "q": "ปัจจัยใดที่มีผลต่อการทำงานให้เสร็จตามกำหนดเวลามากที่สุด", "choices": ["ความทันสมัยของเครื่องมือและเทคโนโลยีที่ใช้", "การวางแผนและจัดลำดับความสำคัญของงาน (Prioritization)", "การทำงานล่วงเวลา (OT) ทุกวัน", "ประสบการณ์การทำงานที่ยาวนานของผู้ปฏิบัติงาน", "ความสามารถในการทำงานหลายอย่างพร้อมกัน (Multitasking)"], "answer": 1, "explanation": "การวางแผนและจัดลำดับความสำคัญของงาน (Prioritization) คือหัวใจของการทำงานให้เสร็จทันกำหนด ส่วนเครื่องมือ ประสบการณ์ การทำ OT หรือ Multitasking เป็นเพียงปัจจัยเสริม หากขาดการวางแผนก็ไม่ช่วยให้งานทันกำหนด", "section": ""}, {"n": 10, "q": "การสื่อสารผ่าน 'บันทึกข้อความ' (Memo) มีข้อดีอย่างไรในเชิงการปฏิบัติตามคำสั่ง", "choices": ["ส่งถึงผู้รับได้รวดเร็วกว่าช่องทางอื่น", "เป็นหลักฐานที่ชัดเจนในการมอบหมายงาน", "ปรับเปลี่ยนรายละเอียดงานได้ทันทีเมื่อสถานการณ์เปลี่ยน", "สื่อสารได้ยืดหยุ่นกว่าการพูดคุยโดยตรง", "ผู้รับสามารถสอบถามข้อสงสัยกลับได้ทันทีขณะอ่าน"], "answer": 1, "explanation": "บันทึกข้อความ (Memo) เป็นหลักฐานลายลักษณ์อักษรของการมอบหมายงาน ระบุผู้สั่ง รายละเอียด และกำหนดเวลาได้ชัดเจน จุดแข็งคือความเป็นหลักฐานที่ตรวจสอบย้อนหลังได้ ไม่ใช่ความรวดเร็วหรือการโต้ตอบได้ทันที", "section": ""}, {"n": 11, "q": "พฤติกรรมใดแสดงถึงการ 'ยอมรับภารกิจ' อย่างมืออาชีพ", "choices": ["ตอบรับทันทีเพื่อแสดงความกระตือรือร้น แล้วค่อยศึกษารายละเอียดภายหลัง", "ทำความเข้าใจเป้าหมายและวางแผนการปฏิบัติงานทันที", "ขอเวลาศึกษางานอย่างละเอียดหลายวันก่อนจึงตอบรับภารกิจ", "แจ้งข้อจำกัดของตนเองเพื่อให้พิจารณามอบหมายผู้อื่นแทน", "รับทุกงานที่มอบหมายโดยไม่ประเมินภาระงานเดิมของตน"], "answer": 1, "explanation": "มืออาชีพเมื่อรับภารกิจจะทำความเข้าใจเป้าหมายและวางแผนการปฏิบัติงานทันที การรับปากทันทีโดยยังไม่ศึกษางาน การขอเวลานานเกินจำเป็น หรือการปัดงานให้ผู้อื่น ล้วนไม่ใช่การยอมรับภารกิจอย่างมืออาชีพ", "section": ""}, {"n": 12, "q": "คำถามในข้อใดช่วยแก้ปัญหา 'ความไม่ชัดเจนของคำสั่ง' ได้ดีที่สุด", "choices": ["งานนี้จะเสร็จเมื่อไหร่ครับ", "งานนี้เกี่ยวข้องกับหน่วยงานใดบ้างครับ", "ผลลัพธ์ที่หัวหน้าต้องการในขั้นตอนนี้คืออะไรครับ", "งานลักษณะนี้เคยมีผู้ทำมาก่อนหรือไม่ครับ", "งานนี้ใช้งบประมาณเท่าไรครับ"], "answer": 2, "explanation": "คำถามที่เจาะจงถึง \"ผลลัพธ์ที่ต้องการ\" ช่วยขจัดความไม่ชัดเจนของคำสั่งได้ตรงจุดที่สุด ส่วนคำถามเรื่องกำหนดเวลา หน่วยงานที่เกี่ยวข้อง งบประมาณ หรือผู้เคยทำ เป็นเพียงข้อมูลประกอบ ไม่ได้ทำให้เป้าหมายของงานชัดเจนขึ้นโดยตรง", "section": ""}, {"n": 13, "q": "เมื่อได้รับคำสั่งทางโทรศัพท์ขณะเดินทาง สิ่งที่ควรทำเพื่อให้ไม่เกิดความผิดพลาดคือข้อใด", "choices": ["ตั้งใจฟังอย่างละเอียดและจดจำด้วยตนเองโดยไม่ขัดจังหวะผู้สั่ง", "จดบันทึกสาระสำคัญและทวนคำสั่งกลับไปยังผู้สั่ง", "ขอให้ผู้สั่งเล่ารายละเอียดทั้งหมดอีกครั้งเมื่อกลับถึงที่ทำงาน", "ปฏิเสธการรับคำสั่งทางโทรศัพท์และขอให้ส่งเป็นข้อความเท่านั้น", "รีบดำเนินการทันทีตามที่เข้าใจเพื่อความรวดเร็ว"], "answer": 1, "explanation": "การจดบันทึกสาระสำคัญและทวนคำสั่งกลับ (Repeat back) เป็นเทคนิคมาตรฐานในการป้องกันความผิดพลาดจากการสื่อสารด้วยวาจา การอาศัยความจำเพียงอย่างเดียว หรือเลื่อนการรับคำสั่งออกไป เสี่ยงต่อความคลาดเคลื่อนและความล่าช้า", "section": ""}, {"n": 14, "q": "การเลือกใช้ช่องทาง 'กลุ่มแชท Line' ในการสั่งงานในทีม เหมาะกับเรื่องใด", "choices": ["การมอบหมายงานเร่งด่วนที่ต้องการการตัดสินใจทันที", "การประสานงานทั่วไปที่ต้องการการรับทราบข้อมูลพร้อมกัน", "การแจ้งผลประเมินเงินเดือนรายบุคคล", "การตำหนิผลงานของสมาชิกในทีม", "การส่งเอกสารสัญญาทางกฎหมาย"], "answer": 1, "explanation": "กลุ่มแชทเหมาะกับการประสานงานทั่วไปที่สมาชิกทุกคนต้องรับทราบข้อมูลพร้อมกัน แต่ไม่เหมาะกับงานด่วนที่ต้องการการตัดสินใจทันที เรื่องเฉพาะบุคคล การตำหนิ หรือเอกสารทางกฎหมาย", "section": ""}, {"n": 15, "q": "หากเพื่อนร่วมทีมได้รับคำสั่งที่ขัดแย้งกับท่าน ท่านควรทำอย่างไร", "choices": ["ยึดตามคำสั่งที่ออกภายหลังเพราะถือว่าเป็นข้อมูลล่าสุด", "ประสานงานและขอคำยืนยันจากผู้ออกคำสั่งร่วมกัน", "ปฏิบัติตามคำสั่งที่ตนได้รับต่อไปเพราะได้รับมอบหมายโดยตรง", "ชะลองานทั้งสองส่วนไว้จนกว่าจะมีคำสั่งใหม่ลงมา", "ให้ผู้ที่อาวุโสกว่าในทีมเป็นผู้ชี้ขาดว่าจะทำตามคำสั่งใด"], "answer": 1, "explanation": "เมื่อคำสั่งขัดแย้งกัน ต้องประสานงานและขอคำยืนยันจากผู้ออกคำสั่งร่วมกัน การยึดคำสั่งล่าสุด ยึดคำสั่งของตน หรือให้ผู้อาวุโสในทีมชี้ขาดกันเอง อาจไม่ตรงกับเจตนาที่แท้จริงของผู้ออกคำสั่ง", "section": ""}, {"n": 16, "q": "ข้อใดคือทักษะที่จำเป็นในการทำตามคำสั่งให้เสร็จตามกำหนดเวลา", "choices": ["ทักษะการบริหารเวลา (Time Management)", "ทักษะการเจรจาต่อรอง (Negotiation)", "ทักษะการนำเสนองาน (Presentation)", "ทักษะการสร้างความสัมพันธ์ (Networking)", "ทักษะการใช้เทคโนโลยีสำนักงานสมัยใหม่"], "answer": 0, "explanation": "ทักษะการบริหารเวลา (Time Management) เกี่ยวข้องโดยตรงกับการทำงานให้เสร็จตามกำหนดเวลา (สมรรถนะ 3.4) ส่วนการเจรจาต่อรอง การนำเสนอ หรือการสร้างความสัมพันธ์ เป็นทักษะที่มีประโยชน์แต่ไม่ใช่ปัจจัยหลักของการส่งงานให้ทันกำหนด", "section": ""}, {"n": 17, "q": "การที่พนักงาน 'นิ่งเงียบ' ทั้งที่ยังสงสัยในคำสั่ง ส่งผลเสียอย่างไรมากที่สุด", "choices": ["หัวหน้าเข้าใจว่าพนักงานรับทราบและเข้าใจงานครบถ้วนแล้ว", "งานอาจผิดพลาดและเสียเวลาในการแก้ไขภายหลัง", "บรรยากาศการประชุมดูราบรื่นแต่ขาดการมีส่วนร่วม", "พนักงานเสียโอกาสในการแสดงความคิดเห็นของตน", "ผู้สั่งงานไม่อาจประเมินระดับความเข้าใจของพนักงานได้"], "answer": 1, "explanation": "การนิ่งเงียบทั้งที่ยังสงสัยทำให้ทำงานบนความเข้าใจที่คลาดเคลื่อน งานอาจผิดพลาดและต้องเสียเวลากลับมาแก้ไขภายหลัง ซึ่งเป็นผลเสียที่รุนแรงที่สุดเมื่อเทียบกับผลกระทบในตัวเลือกอื่น", "section": ""}, {"n": 18, "q": "พฤติกรรม 'เช้าชามเย็นชาม' ขัดต่อสมรรถนะข้อใดมากที่สุด", "choices": ["3.1 ความเข้าใจภารกิจ", "3.4 การปฏิบัติงานให้เสร็จตามกำหนดเวลา", "3.3 การตั้งคำถาม", "3.2 การเลือกวิธีสื่อสาร", "2.1 การเป็นสมาชิกทีม"], "answer": 1, "explanation": "\"เช้าชามเย็นชาม\" หมายถึงการทำงานเรื่อยเปื่อยไม่กระตือรือร้น จึงขัดกับสมรรถนะ 3.4 การปฏิบัติงานให้เสร็จสิ้นตามกำหนดเวลาโดยตรง", "section": ""}, {"n": 19, "q": "ข้อใดไม่ใช่จุดประสงค์ของการ 'ทวนคำสั่ง'", "choices": ["เพื่อให้เข้าใจตรงกัน", "เพื่อลดความผิดพลาด", "เพื่อแสดงความกระตือรือร้นให้ผู้สั่งงานเห็นมากกว่าผู้อื่น", "เพื่อยืนยันความถูกต้องของข้อมูล", "เพื่อประเมินความพร้อมของตนเอง"], "answer": 2, "explanation": "ข้อนี้ถามหาข้อที่ \"ไม่ใช่\" จุดประสงค์ การทวนคำสั่งมีไว้เพื่อความเข้าใจตรงกัน ลดความผิดพลาด และยืนยันความถูกต้องของข้อมูล ไม่ใช่เครื่องมือสร้างภาพความกระตือรือร้นเพื่อให้ตนดูดีกว่าผู้อื่น", "section": ""}, {"n": 20, "q": "หากงานที่ได้รับมีขั้นตอนมาก ท่านควรจัดการอย่างไรเพื่อให้ทันกำหนด (3.4)", "choices": ["เริ่มจากขั้นตอนที่ใช้เวลาน้อยที่สุดเพื่อให้เห็นความคืบหน้าโดยเร็ว", "แบ่งงานเป็นส่วนย่อยๆ (Milestones) และกำหนดวันเสร็จแต่ละส่วน", "ขอเลื่อนกำหนดส่งตั้งแต่วันแรกที่รับงาน", "เร่งทำทุกขั้นตอนไปพร้อมกันเพื่อประหยัดเวลาโดยรวม", "ทุ่มทำรวดเดียวในช่วงท้ายเพื่อให้ข้อมูลเป็นปัจจุบันที่สุด"], "answer": 1, "explanation": "การแบ่งงานเป็นส่วนย่อย (Milestones) พร้อมกำหนดวันเสร็จแต่ละส่วน ช่วยติดตามความคืบหน้าและควบคุมเวลาให้ทันกำหนดส่งได้", "section": ""}, {"n": 21, "q": "เมื่อผู้สั่งงานใช้คำว่า 'เร็วที่สุด' (Urgent) ท่านควรปฏิบัติอย่างไร", "choices": ["ทิ้งงานอื่นทุกอย่างทันทีโดยไม่ดูความสำคัญ", "สอบถามกำหนดเวลา (ชั่วโมง/นาที) ที่แน่นอนเพื่อจัดลำดับความสำคัญ", "เริ่มทำทันทีตามความเข้าใจของตนโดยไม่สอบถามเพิ่ม", "ทำงานเดิมที่ค้างอยู่ให้เสร็จก่อนแล้วจึงเริ่มงานด่วน", "ลดขอบเขตของงานลงเองเพื่อให้ส่งได้เร็วขึ้น"], "answer": 1, "explanation": "คำว่า \"เร็วที่สุด\" เป็นคำกำกวม จึงควรสอบถามกำหนดเวลาที่แน่นอนเพื่อจัดลำดับความสำคัญของงานได้ถูกต้อง (เชื่อมโยงสมรรถนะ 3.3 และ 3.4)", "section": ""}, {"n": 22, "q": "ข้อใดคือความหมายของ '3.1 สามารถตอบสนองต่อภารกิจ'", "choices": ["การรับทราบและตอบรับคำสั่งอย่างรวดเร็วทุกครั้ง", "การรับคำสั่งและเปลี่ยนเป็นแผนการปฏิบัติงานได้", "การจดจำรายละเอียดของคำสั่งได้อย่างครบถ้วนแม่นยำ", "การปฏิบัติตามคำสั่งทุกประการโดยไม่ตั้งข้อสงสัยใด ๆ", "การประเมินความยากง่ายของภารกิจก่อนตอบรับทุกครั้ง"], "answer": 1, "explanation": "การตอบสนองต่อภารกิจ คือการรับคำสั่งแล้วแปลงเป็นแผนการปฏิบัติงานที่ลงมือทำได้จริง ไม่ใช่เพียงการตอบรับอย่างรวดเร็ว การจดจำคำสั่งได้แม่นยำ หรือการทำตามโดยไม่คิดวิเคราะห์", "section": ""}, {"n": 23, "q": "การใช้ 'รูปภาพหรือแผนผัง' ในการสั่งงานช่าง ช่วยเรื่องใดมากที่สุด (3.2)", "choices": ["ความน่าเชื่อถือและความเป็นทางการของการสั่งงาน", "ความเข้าใจในรายละเอียดที่ถูกต้องแม่นยำ", "ทดแทนการอธิบายด้วยวาจาได้ทั้งหมดโดยไม่ต้องพูดคุยเพิ่ม", "การลดเวลาการประชุม", "ช่วยให้ผู้สั่งงานไม่จำเป็นต้องลงตรวจหน้างานด้วยตนเอง"], "answer": 1, "explanation": "รูปภาพหรือแผนผังช่วยให้ผู้รับคำสั่งเห็นรายละเอียดตรงกันกับผู้สั่ง ลดการตีความคลาดเคลื่อน เหมาะกับงานช่างที่ต้องการความแม่นยำสูง", "section": ""}, {"n": 24, "q": "หากท่านพบอุปสรรคระหว่างปฏิบัติงานที่ได้รับมอบหมาย ข้อใดคือพฤติกรรมที่ดี (3.4)", "choices": ["พยายามแก้ไขด้วยตนเองให้ถึงที่สุดแม้จะใกล้เกินกำหนดส่งงาน", "รายงานปัญหาพร้อมเสนอทางเลือกในการแก้ไขต่อผู้บังคับบัญชา", "รายงานปัญหาแล้วรอรับคำสั่งแก้ไขโดยไม่เสนอความเห็นใด ๆ", "ขอเปลี่ยนไปรับผิดชอบงานส่วนอื่นที่ตนถนัดกว่า", "พักงานส่วนที่ติดขัดไว้แล้วเร่งทำส่วนอื่นให้เสร็จโดยไม่แจ้งผู้ใด"], "answer": 1, "explanation": "เมื่อพบอุปสรรคควรรายงานปัญหาพร้อมเสนอทางเลือกในการแก้ไข แสดงถึงความรับผิดชอบและช่วยให้งานเดินหน้าต่อได้ทันกำหนด การดันทุรังแก้เองจนเลยกำหนด หรือรายงานโดยไม่เสนอทางแก้ใด ๆ ยังไม่ใช่พฤติกรรมที่ดีที่สุด", "section": ""}, {"n": 25, "q": "การที่พนักงานถามว่า 'งานนี้ต้องการเน้นคุณภาพหรือความเร็วครับ' จัดเป็นสมรรถนะข้อใด", "choices": ["3.2 การเลือกวิธีการสื่อสารที่เหมาะสมกับงาน", "3.3 การตั้งคำถามเมื่อสงสัยในความไม่ชัดเจน", "3.4 การปฏิบัติงานให้เสร็จสิ้นตามกำหนดเวลา", "3.1 การตอบสนองต่อภารกิจที่ได้รับมอบหมาย", "4.1 การทำงานเป็นทีม"], "answer": 1, "explanation": "การถามว่าเน้นคุณภาพหรือความเร็ว คือการตั้งคำถามเพื่อขจัดความไม่ชัดเจนของคำสั่ง ตรงกับสมรรถนะ 3.3", "section": ""}, {"n": 26, "q": "การส่งงานก่อนกำหนดเวลา (Early Submission) ส่งผลดีอย่างไรต่อทีม", "choices": ["ช่วยให้ทีมมีเวลาว่างเพื่อพักก่อนเริ่มงานถัดไป", "ช่วยให้มีเวลาตรวจสอบความถูกต้องมากขึ้น", "แสดงศักยภาพของทีมต่อหัวหน้าเพื่อผลการประเมิน", "ช่วยลดปริมาณงานของสมาชิกคนอื่นในทีม", "ทำให้ทีมมีผลงานโดดเด่นกว่าทีมอื่นเมื่อเปรียบเทียบกัน"], "answer": 1, "explanation": "การส่งงานก่อนกำหนดทำให้ทีมมีเวลาตรวจสอบความถูกต้องและแก้ไขข้อบกพร่องก่อนส่งจริง คุณภาพงานโดยรวมจึงดีขึ้น", "section": ""}, {"n": 27, "q": "การเลือกใช้ 'วิทยุสื่อสาร' (Walkie-Talkie) เหมาะสมในไซต์งานก่อสร้างเพราะเหตุใด (3.2)", "choices": ["สัญญาณเสียงชัดเจนกว่ามือถือ", "สะดวกรวดเร็วและสื่อสารได้หลายคนพร้อมกันในพื้นที่งาน", "ตัวเครื่องทนทานต่อสภาพแวดล้อมหน้างานมากกว่า", "ช่วยประหยัดค่าใช้จ่ายด้านการสื่อสารของโครงการ", "เป็นอุปกรณ์มาตรฐานที่นิยมใช้กันในงานก่อสร้างทั่วไป"], "answer": 1, "explanation": "วิทยุสื่อสารกดพูดได้ทันที สื่อสารถึงหลายคนพร้อมกันในพื้นที่งาน และไม่ต้องพึ่งสัญญาณโทรศัพท์ จึงเหมาะกับไซต์งานก่อสร้าง ส่วนความทนทานหรือการประหยัดค่าใช้จ่ายเป็นผลพลอยได้ ไม่ใช่เหตุผลหลักด้านการสื่อสาร (3.2)", "section": ""}, {"n": 28, "q": "เมื่อหัวหน้างานไม่อยู่และท่านมีข้อสงสัยในคำสั่งด่วน ควรทำอย่างไร (3.3)", "choices": ["ตัดสินใจตามประสบการณ์ของตนเพื่อไม่ให้งานด่วนล่าช้า", "พยายามติดต่อหัวหน้าหรือถามผู้รักษาการแทนที่มีอำนาจตัดสินใจ", "ชะลองานไว้ก่อนจนกว่าหัวหน้างานจะกลับมา", "สอบถามเพื่อนร่วมงานแล้วปฏิบัติตามความเห็นส่วนใหญ่", "ทำเฉพาะส่วนที่เข้าใจ ส่วนที่ไม่เข้าใจไม่ต้องทำ"], "answer": 1, "explanation": "งานด่วนที่มีข้อสงสัยต้องหาผู้มีอำนาจตัดสินใจ โดยพยายามติดต่อหัวหน้าหรือผู้รักษาการแทน ไม่ควรตัดสินใจเองตามประสบการณ์ ใช้เสียงส่วนใหญ่ของเพื่อนร่วมงาน หรือชะลองานด่วนไว้เฉย ๆ", "section": ""}, {"n": 29, "q": "ความรับผิดชอบ (Accountability) สัมพันธ์กับสมรรถนะในข้อใดมากที่สุด", "choices": ["3.3 การตั้งคำถามเมื่อสงสัยในความไม่ชัดเจนของคำสั่ง", "3.4 การปฏิบัติงานตามคำสั่งให้เสร็จสิ้นตามกำหนดเวลา", "3.2 การเลือกวิธีการสื่อสารที่เหมาะสมกับงาน", "3.1 การตอบสนองต่อภารกิจที่ได้รับมอบหมาย", "2.1 การเป็นสมาชิกที่ดีของทีม"], "answer": 1, "explanation": "Accountability คือความรับผิดชอบต่อผลของงานที่รับมอบหมายจนเสร็จสมบูรณ์ตามกำหนดเวลา ตรงกับสมรรถนะ 3.4 มากที่สุด", "section": ""}, {"n": 30, "q": "ผลลัพธ์สุดท้ายของการปฏิบัติตามคำสั่งที่ดีคืออะไร", "choices": ["ผู้บังคับบัญชาเกิดความไว้วางใจในตัวผู้ปฏิบัติงาน", "งานสำเร็จตามเป้าหมาย มีคุณภาพ และตรงเวลา", "องค์กรมีภาพลักษณ์ที่ดีต่อบุคคลภายนอก", "ผู้ปฏิบัติงานมีความก้าวหน้าในหน้าที่การงาน", "ทีมงานมีความสามัคคีและบรรยากาศการทำงานที่ดี"], "answer": 1, "explanation": "เป้าหมายสุดท้ายของการปฏิบัติตามคำสั่งที่ดี คืองานสำเร็จตามเป้าหมาย มีคุณภาพ และตรงเวลา ส่วนความไว้วางใจ ภาพลักษณ์องค์กร หรือความก้าวหน้า เป็นผลพลอยได้ที่ตามมาจากผลงานที่สำเร็จ", "section": ""}, {"n": 31, "q": "หัวหน้าสั่งว่า 'ไปทำความสะอาดเครื่องจักรให้เสร็จก่อนเที่ยง' แต่ในโรงงานมีเครื่องจักรหลายเครื่องและไม่ได้ระบุว่าเครื่องใด ท่านควรทำอย่างไร?", "choices": ["เลือกทำความสะอาดเครื่องที่สกปรกที่สุดก่อนเพราะน่าจะตรงกับความต้องการ", "ทำความสะอาดทุกเครื่องเท่าที่เวลาจะอำนวยเพื่อแสดงความขยัน", "สอบถามหัวหน้าให้ชัดเจนว่าหมายถึงเครื่องใดและมาตรฐานความสะอาดระดับใด", "ถามเพื่อนร่วมงานที่อาวุโสแล้วทำตามที่เพื่อนคาดเดา", "เริ่มจากเครื่องที่ใกล้ตัวที่สุดเพื่อไม่ให้เสียเวลา"], "answer": 2, "explanation": "คำสั่งกำกวมเรื่องขอบเขตงาน ต้องทวนถามผู้ออกคำสั่งโดยตรงให้ชัดเจนก่อนปฏิบัติ การเดาเองหรือถามคนอื่นแทนอาจทำให้งานผิดเป้าหมายและเสียเวลา", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 32, "q": "หัวหน้าแผนกสั่งให้บรรจุสินค้าไลน์ A ก่อน แต่ผู้จัดการโรงงานเดินมาสั่งให้ทำไลน์ B ก่อนโดยไม่ทราบว่ามีคำสั่งเดิมอยู่ ท่านควรทำอย่างไร?", "choices": ["แจ้งผู้จัดการว่ามีคำสั่งจากหัวหน้าแผนกอยู่ก่อน และขอให้ทั้งสองฝ่ายตกลงลำดับความสำคัญร่วมกัน", "ทำตามผู้จัดการทันทีเพราะตำแหน่งสูงกว่าโดยไม่ต้องแจ้งใคร", "ทำตามหัวหน้าแผนกเพราะเป็นผู้บังคับบัญชาโดยตรงและเงียบไว้", "แบ่งเวลาทำทั้งสองไลน์พร้อมกันอย่างละครึ่งเพื่อไม่ให้ใครขัดใจ", "ให้เพื่อนร่วมงานโหวตกันว่าควรทำไลน์ไหนก่อน"], "answer": 0, "explanation": "เมื่อคำสั่งขัดแย้งกัน ต้องแจ้งข้อมูลให้ผู้ออกคำสั่งทั้งสองทราบเพื่อให้ผู้มีอำนาจตัดสินลำดับความสำคัญ การเลือกทำเองหรือใช้เสียงส่วนใหญ่ไม่ใช่วิธีที่ถูกต้อง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 33, "q": "ท่านได้รับคำสั่งด่วนให้เดินเครื่องปั๊มโลหะ แต่พบว่าเซนเซอร์นิรภัยของเครื่องเสียอยู่ ท่านควรทำอย่างไร?", "choices": ["เดินเครื่องด้วยความระมัดระวังเป็นพิเศษเพราะเป็นงานด่วน", "เดินเครื่องไปก่อนแล้วค่อยแจ้งซ่อมหลังเลิกงาน", "ให้เพื่อนที่ชำนาญกว่ามาเดินเครื่องแทนตน", "หยุดการใช้เครื่องและรายงานหัวหน้าทันทีว่าอุปกรณ์นิรภัยชำรุด เพื่อให้ตัดสินใจสั่งการใหม่", "ซ่อมเซนเซอร์ด้วยตนเองโดยไม่แจ้งใครเพื่อให้ทันกำหนด"], "answer": 3, "explanation": "ความปลอดภัยต้องมาก่อนความเร่งด่วนเสมอ ต้องหยุดและรายงานผู้ออกคำสั่งให้ทราบข้อจำกัด การฝืนทำหรือให้ผู้อื่นเสี่ยงแทนล้วนไม่ถูกต้อง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 34, "q": "หัวหน้ามอบหมายให้ท่านนำคำสั่งการปรับตั้งเครื่อง CNC ไปถ่ายทอดให้เพื่อนกะดึก วิธีใดเหมาะสมที่สุด?", "choices": ["เล่าให้ฟังปากเปล่าตามที่จำได้เพราะเป็นเรื่องภายในทีม", "จดรายละเอียดเป็นลายลักษณ์อักษร ส่งมอบพร้อมอธิบาย และให้ผู้รับทวนคำสั่งกลับเพื่อยืนยันความเข้าใจ", "ฝากข้อความสั้น ๆ ไว้กับพนักงานคนใดก็ได้ที่เจอก่อน", "สรุปเฉพาะประเด็นที่ตนคิดว่าสำคัญเพื่อไม่ให้เพื่อนสับสน", "ให้เพื่อนกะดึกไปถามหัวหน้าเอาเองในวันรุ่งขึ้น"], "answer": 1, "explanation": "การส่งต่อคำสั่งต้องครบถ้วนเป็นลายลักษณ์อักษรและให้ผู้รับทวนกลับ เพื่อป้องกันข้อมูลตกหล่นหรือคลาดเคลื่อน การเล่าตามความจำหรือตัดทอนเองเสี่ยงต่อความผิดพลาด", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 35, "q": "ใบสั่งงานฉบับใหม่ตัดขั้นตอนการตัดแยกพลังงาน (Lockout) ออกจากลำดับงานซ่อมบำรุง ซึ่งท่านเห็นว่าผิดปกติ ท่านควรทำอย่างไร?", "choices": ["ทำตามใบสั่งงานใหม่ทันทีเพราะเอกสารย่อมผ่านการอนุมัติแล้ว", "เพิ่มขั้นตอน Lockout กลับเข้าไปเองโดยไม่แจ้งใครเพราะมั่นใจว่าถูกต้อง", "ทำตามใบสั่งงานเดิมที่ตนคุ้นเคยโดยไม่สนใจฉบับใหม่", "ปรึกษาเพื่อนร่วมงานแล้วทำตามที่คนส่วนใหญ่เห็นด้วย", "ยังไม่เริ่มงานและสอบถามผู้ออกคำสั่งทันทีถึงเหตุผลที่ตัดขั้นตอนความปลอดภัยออก"], "answer": 4, "explanation": "เมื่อพบข้อสงสัยด้านความปลอดภัยในคำสั่ง ต้องทักท้วงและสอบถามผู้ออกคำสั่งก่อนปฏิบัติ การแก้เอกสารเองโดยพลการหรือเลือกทำตามความเคยชินล้วนไม่ใช่แนวทางที่ถูกต้อง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 36, "q": "ผู้จัดการสั่งทางโทรศัพท์ว่า 'รีบส่งเอกสารชุดนั้นให้ลูกค้ารายสำคัญด้วย' แต่ท่านดูแลลูกค้ารายสำคัญอยู่สามราย ท่านควรทำอย่างไร?", "choices": ["ทวนถามทันทีว่าหมายถึงเอกสารชุดใดและลูกค้ารายใด พร้อมยืนยันช่องทางการส่ง", "ส่งเอกสารให้ลูกค้าทั้งสามรายเพื่อความไม่ประมาท", "เลือกส่งให้ลูกค้าที่มียอดสั่งซื้อสูงสุดเพราะน่าจะสำคัญที่สุด", "รอให้ผู้จัดการกลับมาที่สำนักงานค่อยถามเพราะเกรงใจ", "ถามเลขานุการผู้จัดการแล้วส่งตามที่เลขาคาดเดา"], "answer": 0, "explanation": "คำสั่งที่ระบุเป้าหมายไม่ชัดต้องทวนถามผู้ออกคำสั่งทันที การส่งเหมาทุกรายอาจทำให้ข้อมูลรั่วไหลผิดราย ส่วนการเดาหรือรอช้าอาจทำให้งานเสียหาย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 37, "q": "ในอู่ซ่อมรถ ลูกค้าขอให้ท่านข้ามขั้นตอนการตรวจแรงขันน็อตล้อเพื่อรับรถเร็วขึ้น ทั้งที่ใบสั่งซ่อมของหัวหน้าอู่กำหนดให้ตรวจทุกคัน ท่านควรทำอย่างไร?", "choices": ["ข้ามขั้นตอนตามที่ลูกค้าขอเพราะลูกค้าคือผู้จ่ายเงิน", "ตรวจแบบคร่าว ๆ เพียงบางล้อเพื่อประหยัดเวลา", "ปฏิบัติตามใบสั่งซ่อมครบทุกขั้นตอน และแจ้งลูกค้าว่าเป็นข้อกำหนดด้านความปลอดภัย หากลูกค้าติดใจให้ประสานหัวหน้าอู่", "ให้ลูกค้าเซ็นรับทราบแล้วข้ามขั้นตอนได้เลย", "ทำตามลูกค้าแต่จดบันทึกไว้ป้องกันตนเอง"], "answer": 2, "explanation": "คำขอของบุคคลภายนอกไม่อาจยกเลิกคำสั่งและมาตรฐานความปลอดภัยได้ ต้องปฏิบัติตามใบสั่งซ่อมและส่งเรื่องให้ผู้มีอำนาจตัดสินหากมีข้อโต้แย้ง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 38, "q": "ที่ไซต์ก่อสร้าง ท่านได้รับคำสั่งให้ยกแผ่นพื้นด้วยเครนตามแผนงาน แต่ขณะปฏิบัติลมกระโชกแรงเกินค่าที่กำหนดในคู่มือ ท่านควรทำอย่างไร?", "choices": ["ยกต่อไปโดยลดความเร็วลงเพราะงานต้องเสร็จตามแผน", "ยกเฉพาะแผ่นที่เบาที่สุดไปก่อน", "รอให้หัวหน้าเดินมาเห็นเองแล้วค่อยว่ากัน", "ให้ทีมงานช่วยกันจับลวดสลิงประคองแทนการหยุดงาน", "หยุดการยกทันที และรายงานผู้ควบคุมงานว่าสภาพอากาศเกินเกณฑ์ความปลอดภัยเพื่อรอคำสั่งใหม่"], "answer": 4, "explanation": "เมื่อสภาพหน้างานเกินเกณฑ์ความปลอดภัยต้องหยุดปฏิบัติและรายงานผู้ออกคำสั่งทันที การฝืนทำต่อแม้จะระมัดระวังก็ยังเสี่ยงต่ออุบัติเหตุร้ายแรง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 39, "q": "ท่านทำงานตามคำสั่งไปได้ครึ่งทาง พบว่าวัสดุในคลังไม่พอทำให้ไม่สามารถเสร็จตามกำหนด ท่านควรทำอย่างไร?", "choices": ["ทำเท่าที่วัสดุมีแล้วเงียบไว้ รอให้หัวหน้าถามเอง", "รายงานความคืบหน้าและอุปสรรคให้ผู้ออกคำสั่งทราบทันที พร้อมเสนอทางเลือกในการแก้ไข", "หยุดงานทั้งหมดไว้ก่อนจนกว่าวัสดุจะมาเอง", "ยืมวัสดุของแผนกอื่นมาใช้โดยไม่ขออนุญาตเพื่อให้งานเสร็จ", "ใช้วัสดุเกรดต่ำกว่าที่กำหนดแทนไปก่อนเพราะหน้าตาใกล้เคียงกัน"], "answer": 1, "explanation": "เมื่อพบอุปสรรคที่กระทบเป้าหมาย ต้องรายงานผู้ออกคำสั่งทันทีพร้อมข้อเสนอ เพื่อให้ตัดสินใจได้ทันเวลา การเงียบ การเปลี่ยนสเปกเอง หรือยืมของโดยพลการล้วนสร้างความเสียหาย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 40, "q": "เพื่อนร่วมกะส่วนใหญ่เห็นตรงกันว่าควรสลับลำดับขั้นตอนในใบสั่งงานเพื่อให้ทำง่ายขึ้น และชวนท่านทำตามมติกลุ่ม ท่านควรทำอย่างไร?", "choices": ["ทำตามมติกลุ่มเพราะเสียงส่วนใหญ่ย่อมถูกต้อง", "ทำตามกลุ่มแต่บันทึกไว้ว่าตนไม่เห็นด้วย", "แอบทำตามลำดับเดิมคนเดียวโดยไม่บอกใคร", "ปฏิบัติตามลำดับในใบสั่งงาน และเสนอแนวคิดของกลุ่มให้หัวหน้าพิจารณาอนุมัติก่อนจึงค่อยเปลี่ยน", "สลับขั้นตอนเฉพาะช่วงที่หัวหน้าไม่อยู่"], "answer": 3, "explanation": "เสียงส่วนใหญ่ไม่มีอำนาจแก้ไขคำสั่ง การเปลี่ยนขั้นตอนต้องได้รับอนุมัติจากผู้มีอำนาจ เพราะลำดับงานมักถูกออกแบบไว้ด้วยเหตุผลด้านคุณภาพและความปลอดภัย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 41, "q": "หัวหน้าส่งภาพถ่ายใบสั่งงานมาทางแอปแชท แต่ภาพเบลอจนอ่านตัวเลขขนาดชิ้นงานไม่ชัด ท่านควรทำอย่างไร?", "choices": ["ขยายภาพแล้วเดาตัวเลขจากบริบทของงานเดิม", "เริ่มตัดชิ้นงานตามขนาดที่เคยทำบ่อยที่สุด", "ถามช่างรุ่นพี่ให้ช่วยเดาตัวเลขแทน", "ติดต่อหัวหน้าเพื่อขอไฟล์หรือข้อมูลที่ชัดเจน และทวนตัวเลขสำคัญกลับก่อนเริ่มงาน", "ตัดเผื่อขนาดไว้หลาย ๆ แบบเพื่อให้มีอันที่ถูก"], "answer": 3, "explanation": "ข้อมูลตัวเลขในคำสั่งเป็นสาระสำคัญ ห้ามเดาโดยเด็ดขาด ต้องขอข้อมูลที่ชัดเจนและทวนกลับกับผู้ออกคำสั่ง การตัดเผื่อหลายแบบสิ้นเปลืองวัสดุและเวลา", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 42, "q": "หัวหน้าสั่งงานด้วยวาจาต่อเนื่องกันถึง 6 ขั้นตอนในครั้งเดียว ท่านควรทำอย่างไรเพื่อให้ปฏิบัติได้ถูกต้อง?", "choices": ["ตั้งใจฟังให้จบแล้วรีบไปทำทันทีก่อนจะลืม", "จดบันทึกทุกขั้นตอนขณะฟัง แล้วทวนสรุปกลับให้หัวหน้ายืนยันความถูกต้องก่อนแยกย้าย", "เลือกจำเฉพาะ 3 ขั้นตอนแรก ที่เหลือค่อยกลับมาถามใหม่", "ขอให้เพื่อนช่วยฟังแทนเพราะเพื่อนความจำดี", "ทำเฉพาะขั้นตอนที่ตนเข้าใจ ส่วนที่ไม่เข้าใจก็ข้ามไป"], "answer": 1, "explanation": "คำสั่งหลายขั้นตอนควรจดบันทึกและทวนกลับเพื่อยืนยันความเข้าใจตรงกันก่อนปฏิบัติ การพึ่งความจำหรือทำเฉพาะบางส่วนเสี่ยงต่อการตกหล่น", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 43, "q": "หัวหน้าคนเดียวกันสั่งงานสองชิ้นโดยระบุว่า 'ด่วนมาก' ทั้งคู่ แต่เวลาที่มีทำได้ทีละชิ้น ท่านควรทำอย่างไร?", "choices": ["สอบถามหัวหน้าว่างานใดต้องเสร็จก่อน พร้อมแจ้งข้อจำกัดด้านเวลาให้ทราบ", "เลือกทำงานที่ง่ายกว่าก่อนเพื่อให้มีผลงานเร็ว", "ทำสลับกันไปมาชิ้นละครึ่งชั่วโมงให้คืบหน้าทั้งคู่", "เลือกทำงานที่ตนถนัดก่อนเพราะจะเสร็จเร็วกว่า", "มอบงานชิ้นหนึ่งให้เพื่อนทำแทนโดยไม่แจ้งหัวหน้า"], "answer": 0, "explanation": "เมื่องานด่วนชนกันและทรัพยากรจำกัด ผู้ปฏิบัติต้องให้ผู้ออกคำสั่งเป็นผู้จัดลำดับความสำคัญ ไม่ใช่ตัดสินใจเลือกเองตามความสะดวกหรือโอนงานโดยพลการ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 44, "q": "ท่านพบว่ารหัสอะไหล่ในใบสั่งงานน่าจะพิมพ์ผิด เพราะไม่ตรงกับรุ่นเครื่องที่ต้องซ่อม ท่านควรทำอย่างไร?", "choices": ["เบิกอะไหล่ตามรหัสในใบสั่งงานไปก่อนเพราะเอกสารถือเป็นที่สุด", "แก้รหัสในใบสั่งงานเองเลยเพราะมั่นใจว่าตนถูก", "เบิกอะไหล่ทั้งสองรหัสมาเผื่อไว้", "หยุดรอเฉย ๆ จนกว่าจะมีใบสั่งงานใหม่ออกมาเอง", "แจ้งข้อสังเกตให้ผู้ออกคำสั่งตรวจสอบและแก้ไขเอกสารให้ถูกต้องก่อนเบิก"], "answer": 4, "explanation": "เมื่อสงสัยว่าคำสั่งมีข้อผิดพลาด ต้องรายงานให้ผู้ออกคำสั่งยืนยันหรือแก้ไข ไม่ใช่แก้เอกสารเองโดยพลการหรือฝืนทำตามข้อมูลที่น่าจะผิด", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 45, "q": "ท่านเป็นพนักงานใหม่ ได้รับคำสั่งที่มีศัพท์เทคนิคเฉพาะโรงงานหลายคำที่ไม่เข้าใจ ท่านควรทำอย่างไร?", "choices": ["แสร้งพยักหน้าว่าเข้าใจเพื่อไม่ให้ดูด้อยความสามารถ แล้วค่อยไปเปิดหาความหมายเอง", "ทำเฉพาะส่วนที่เข้าใจ ส่วนที่ไม่เข้าใจปล่อยไว้ก่อน", "สอบถามความหมายจากผู้ออกคำสั่งอย่างตรงไปตรงมา และทวนความเข้าใจก่อนเริ่มปฏิบัติ", "เลียนแบบการทำงานของเพื่อนข้าง ๆ โดยไม่ถามใคร", "ขอเปลี่ยนไปทำงานอื่นที่ตนเข้าใจมากกว่า"], "answer": 2, "explanation": "การทบทวนความเข้าใจก่อนปฏิบัติเป็นหน้าที่ของผู้รับคำสั่ง การแสร้งเข้าใจหรือเลียนแบบผู้อื่นโดยไม่รู้หลักการ อาจทำงานผิดพลาดและเกิดอันตราย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 46, "q": "ระหว่างทำงานตามคำสั่งที่ต้องเสร็จก่อนเที่ยง เกิดสารเคมีหกในบริเวณปฏิบัติงาน ท่านควรทำอย่างไร?", "choices": ["ทำงานต่อให้เสร็จก่อนแล้วค่อยจัดการสารเคมีเพราะคำสั่งกำหนดเวลาไว้", "เอาเศษผ้าเช็ดคราบออกอย่างรวดเร็วแล้วรีบทำงานต่อ", "ย้ายไปทำงานมุมอื่นของห้องโดยไม่ต้องสนใจสารเคมี", "ให้เพื่อนที่ว่างกว่ามาจัดการสารเคมีส่วนตนทำงานต่อไป", "หยุดงาน กั้นพื้นที่และจัดการตามขั้นตอนสารเคมีหก แล้วรายงานหัวหน้าว่างานอาจล่าช้าเพราะเหตุฉุกเฉิน"], "answer": 4, "explanation": "เหตุฉุกเฉินด้านความปลอดภัยสำคัญกว่ากำหนดเวลา ต้องจัดการตามขั้นตอนที่ถูกต้องและรายงานผลกระทบต่อกำหนดงานให้ผู้ออกคำสั่งทราบ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 47, "q": "หัวหน้าคลังสินค้าสั่งให้ท่านขับรถโฟล์คลิฟท์ขนพาเลทด่วน แต่ท่านยังไม่มีใบอนุญาตขับรถโฟล์คลิฟท์ ท่านควรทำอย่างไร?", "choices": ["ขับช้า ๆ อย่างระมัดระวังเพราะเคยเห็นคนอื่นขับบ่อยแล้ว", "ขับเฉพาะระยะสั้น ๆ ในโซนที่คนน้อย", "รับคำสั่งไว้ก่อนแล้วแอบให้เพื่อนที่มีใบอนุญาตขับแทนโดยไม่บอกหัวหน้า", "แจ้งหัวหน้าตรงไปตรงมาว่าตนไม่มีใบอนุญาต และเสนอให้มอบหมายผู้ที่มีคุณสมบัติแทน", "ปฏิเสธเฉย ๆ แล้วเดินหนีไปทำงานอื่น"], "answer": 3, "explanation": "การปฏิบัติงานที่ต้องมีใบอนุญาตโดยไม่มีคุณสมบัติเป็นการเสี่ยงและผิดกฎ ต้องรายงานข้อจำกัดของตนต่อผู้ออกคำสั่งเพื่อให้จัดคนที่เหมาะสม ไม่ใช่ฝืนทำหรือจัดการลับหลัง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 48, "q": "หัวหน้ากะเร่งปิดยอด สั่งให้ท่านลงชื่อในใบตรวจคุณภาพว่า 'ผ่าน' ทั้งที่ยังไม่ได้ตรวจชิ้นงานจริง ท่านควรทำอย่างไร?", "choices": ["ลงชื่อไปก่อนเพราะเป็นคำสั่งของผู้บังคับบัญชา", "แจ้งว่าไม่ส ว่า ๆ' ท่านควรทำอย่างไร?", "choices": ["ตั้งค่าที่ 250 องศาเพราะเป็นค่ากลางของช่วงที่เพื่อนบอก", "ยืนยันตัวเลขที่ถูกต้องกับหัวหน้าผู้ออกคำสั่งโดยตรงก่อนปรับตั้งค่า", "ตั้งค่าตามที่เคยใช้ครั้งก่อนเพราะน่าจะใกล้เคียง", "ให้เพื่อนกลับไปถามหัวหน้าอีกรอบส่วนตนทำงานอื่นต่อ", "ทดลองตั้งหลายค่าแล้วดูว่าค่าไหนได้ผลดีที่สุด"], "answer": 1, "explanation": "คำสั่งที่ส่งต่อผ่านบุคคลอื่นและข้อมูลไม่ครบ ต้องยืนยันกับผู้ออกคำสั่งต้นทางโดยตรง การเดาค่าหรือทดลองเองกับอุปกรณ์จริงเสี่ยงต่อความเสียหายและอันตราย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 52, "q": "ขณะเดินเครื่องกลึงตามใบสั่งงาน ท่านได้ยินเสียงผิดปกติดังจากชุดเกียร์เป็นระยะ แม้เครื่องยังทำงานได้ ท่านควรทำอย่างไร?", "choices": ["เร่งทำชิ้นงานให้เสร็จก่อนเผื่อเครื่องพังจะได้ไม่เสียงาน", "เปิดเพลงกลบเสียงเพื่อให้มีสมาธิทำงานต่อ", "หยอดน้ำมันหล่อลื่นเพิ่มเองแล้วเดินเครื่องต่อ", "จดบันทึกไว้แล้วรายงานตอนสิ้นเดือนพร้อมรายงานประจำ", "หยุดเครื่องอย่างปลอดภัย แล้วรายงานอาการผิดปกติให้หัวหน้าหรือฝ่ายซ่อมบำรุงทันที"], "answer": 4, "explanation": "อาการผิดปกติของเครื่องจักรเป็นสัญญาณความเสี่ยง ต้องหยุดและรายงานทันทีเพื่อป้องกันอุบัติเหตุและความเสียหายลุกลาม การฝืนใช้ต่อหรือซ่อมเองโดยพลการไม่ใช่หน้าที่ของผู้ปฏิบัติ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 53, "q": "หัวหน้ามอบหมายงานเขียนโปรแกรมควบคุม PLC ซึ่งท่านมีพื้นฐานเพียงเล็กน้อยและไม่มั่นใจว่าจะทำได้ตามกำหนด ท่านควรทำอย่างไร?", "choices": ["รับปากเต็มที่ไว้ก่อนแล้วค่อยหาทางเอาข้างหน้า", "ปฏิเสธงานทันทีเพราะไม่ใช่ความถนัดของตน", "แจ้งหัวหน้าตามจริงถึงระดับทักษะของตน และขอคำแนะนำ พี่เลี้ยง หรือการปรับกำหนดเวลาให้เหมาะสม", "รับงานแล้วจ้างคนนอกมาทำแทนโดยไม่บอกหัวหน้า", "รับงานแล้วทำเท่าที่ได้ ส่วนที่ทำไม่ได้ก็ส่งไปทั้งอย่างนั้น"], "answer": 2, "explanation": "การทบทวนความพร้อมของตนก่อนรับปฏิบัติเป็นส่วนหนึ่งของการทำความเข้าใจคำสั่ง ควรสื่อสารข้อจำกัดตามจริงเพื่อให้ผู้สั่งงานวางแผนสนับสนุนได้ ไม่ใช่รับปากเกินจริงหรือส่งงานบกพร่อง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 54, "q": "หัวหน้าครัวสั่งว่า 'เตรียมวัตถุดิบให้พอสำหรับพรุ่งนี้' โดยไม่บอกจำนวนลูกค้ -80)"}, {"n": 57, "q": "หัวหน้าสั่งให้ท่านใช้เครื่องเชื่อมรุ่นใหม่ที่เพิ่งติดตั้ง ซึ่งท่านยังไม่เคยผ่านการอบรมการใช้งาน ท่านควรทำอย่างไร?", "choices": ["ลองผิดลองถูกไปเรื่อย ๆ เดี๋ยวก็ใช้เป็นเอง", "ดูคลิปสอนในอินเทอร์เน็ตแล้วลงมือใช้งานจริงทันที", "ใช้เครื่องรุ่นเก่าทำแทนโดยไม่บอกหัวหน้า", "แจ้งหัวหน้าว่ายังไม่ได้รับการอบรมเครื่องรุ่นนี้ และขอให้จัดอบรมหรือให้ผู้ชำนาญกำกับดูแลก่อนปฏิบัติ", "ให้เพื่อนที่พอใช้เป็นสอนแบบเร่งรัดห้านาทีแล้วทำเลย"], "answer": 3, "explanation": "การใช้อุปกรณ์ที่ยังไม่ผ่านการอบรมเสี่ยงต่ออันตรายและความเสียหาย ต้องรายงานข้อจำกัดต่อผู้ออกคำสั่งเพื่อจัดการอบรมหรือการกำกับดูแลที่เหมาะสมก่อน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 58, "q": "งานที่ได้รับมอบหมายล้มเหลวเพราะซัพพลายเออร์ส่งวัสดุล่าช้ากว่ากำหนดมาก ท่านควรรายงานหัวหน้าอย่างไรจึงเหมาะสมที่สุด?", "choices": ["รอให้หัวหน้าทวงถามก่อนค่อยชี้แจงเพื่อไม่ให้ดูเหมือนแก้ตัว", "รายงานสั้น ๆ ว่างานไม่เสร็จโดยไม่ต้องบอกสาเหตุ", "โยนความผิดให้ซัพพลายเออร์ทั้งหมดโดยไม่เสนอทางแก้", "รายงานเฉพาะส่วนที่สำเร็จ ส่วนที่ล้มเหลวไว้ค่อยบอกทีหลัง", "รายงานทันทีตามข้อเท็จจริง ระบุสาเหตุ ผลกระทบ และเสนอแนวทางแก้ไขหรือแผนสำรองให้พิจารณา"], "answer": 4, "explanation": "การรายงานผลต้องรวดเร็ว ตรงตามข้อเท็จจริง และมีข้อเสนอแนะประกอบ เพื่อให้ผู้สั่งงานตัดสินใจแก้สถานการณ์ได้ทัน การปกปิดหรือรายงานครึ่งเดียวทำให้ปัญหาบานปลาย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 59, "q": "ใบสั่งงานเขียนให้ทาสีรองพื้น 2 รอบ แต่ตอนมอบงานหัวหน้าพูดด้วยวาจาว่า 'รอบเดียวพอ' ท่านควรทำอย่างไร?", "choices": ["ทำตามเอกสารเพราะลายลักษณ์อักษรย่อมสำคัญกว่าเสมอโดยไม่ต้องถาม", "ทำตามคำพูดล่าสุดเพราะเป็นคำสั่งใหม่กว่าโดยไม่ต้องยืนยัน", "สอบถามหัวหน้าให้ยืนยันชัดเจนว่าจะใช้ตามเอกสารหรือคำพูด และขอให้แก้ไขเอกสารให้ตรงกัน", "ทารอบครึ่งเป็นการประนีประนอมทั้งสองคำสั่ง", "ถามลูกค้าเจ้าของงานโดยตรงว่าต้องการกี่รอบ"], "answer": 2, "explanation": "เมื่อคำสั่งลายลักษณ์อักษรกับวาจาขัดแย้งกัน ต้องให้ผู้ออกคำสั่งยืนยันและปรับเอกสารให้ตรงกัน เพื่อป้องกันข้อโต้แย้งภายหลัง ไม่ควรตีความเลือกข้างเองหรือข้ามหัวหน้าไปถามลูกค้า", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 60, "q": "หัวหน้ามอบหมายให้ท่านนำคำสั่งเปลี่ยนแผนการผลิตไปแจ้งทีมงาน 8 คนก่อนเริ่มกะ ท่านควรดำเนินการอย่างไร?", "choices": ["บอกต่อคนแรกที่เจอแล้วให้ช่วยบอกต่อ ๆ กันไปเอง", "เรียกประชุมสั้น แจ้งรายละเอียดครบถ้วนพร้อมเอกสารประกอบ เปิดให้ซักถาม และตรวจสอบว่าทุกคนเข้าใจตรงกัน", "ติดประกาศไว้ที่บอร์ดโดยไม่ต้องพูดกับใคร", "บอกเฉพาะหัวหน้ากลุ่มย่อยแบบคร่าว ๆ ให้ไปขยายความกันเอง", "ส่งข้อความในกลุ่มแชทตอนดึกแล้วถือว่าแจ้งแล้ว"], "answer": 1, "explanation": "การส่งต่อคำสั่งสำคัญต้องแจ้งครบถ้วน มีหลักฐาน เปิดโอกาสซักถาม และยืนยันความเข้าใจของผู้รับทุกคน การบอกต่อเป็นทอด ๆ ทำให้สารคลาดเคลื่อนแบบปากต่อปาก", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 61, "q": "ขณะท่านกำลังปฏิบัติงานตามคำสั่งของตน เห็นเพื่อนร่วมงานแผนกข้าง ๆ ถอดการ์ดป้องกันใบเลื่อยออกเพื่อทำงานให้เร็วขึ้น ท่านควรทำอย่างไร?", "choices": ["ไม่ยุ่งเพราะไม่ใช่งานในคำสั่งของตนและคนละแผนก", "ถ่ายคลิปไว้โพสต์เตือนภัยในโซเชียล", "เตือนเพื่อนถึงอันตรายทันที และหากยังฝืนทำต่อให้รายงานหัวหน้างานหรือเจ้าหน้าที่ความปลอดภัย", "รอเก็บไว้เล่าให้หัวหน้าฟังในการประชุมประจำเดือน", "เดินไปช่วยจับชิ้นงานให้เพื่อนเพื่อให้เสร็จเร็ว ๆ"], "answer": 2, "explanation": "วัฒนธรรมความปลอดภัยเป็นหน้าที่ของทุกคน ต้องเตือนและรายงานพฤติกรรมเสี่ยงทันที การนิ่งเฉย รอรายงานทีหลัง หรือเข้าไปมีส่วนร่วม ล้วนปล่อยให้ความเสี่ยงดำเนินต่อไป", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 62, "q": "หัวหน้าสั่งงานพร้อมกำหนดส่งที่ท่านประเมินแล้วว่าจะทันได้ก็ต่อเมื่อข้ามขั้นตอนตรวจสอบคุณภาพขั้นสุดท้าย ท่านควรทำอย่างไร?", "choices": ["ข้ามขั้นตอนตรวจสอบไปเลยเพราะกำหนดส่งสำคัญที่สุด", "แจ้งหัวหน้าถึงข้อจำกัดตั้งแต่แรก และขอปรับกำหนดเวลา เพิ่มกำลังคน หรือให้หัวหน้าตัดสินใจทางเลือกอย่างเป็นทางการ", "รับปากไปก่อนแล้วค่อยส่งช้าพร้อมคำขอโทษ", "ตรวจสอบคุณภาพแบบผ่าน ๆ พอเป็นพิธี", "ทำงานเลยเวลาเลิกงานเองเงียบ ๆ โดยไม่เบิกโอทีและไม่บอกใคร"], "answer": 1, "explanation": "เมื่อเป้าหมายเวลาขัดกับขั้นตอนคุณภาพ ต้องรายงานข้อจำกัดให้ผู้สั่งงานตัดสินใจอย่างเป็นทางการ การข้ามหรือหย่อนการตรวจสอบเองคือการแก้คำสั่งโดยพลการที่เสี่ยงต่อความเสียหายใหญ่", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 63, "q": "ผู้จัดการสั่งให้ท่านจัดผังคลังสินค้าใหม่ภายในสัปดาห์นี้ ก่อนลงมือท่านควรทำสิ่งใดเป็นอันดับแรก?", "choices": ["สอบถามวัตถุประสงค์ของการจัดผังใหม่ เช่น ลดเวลาหยิบสินค้าหรือเพิ่มพื้นที่ เพื่อวางแผนให้ตรงเป้าหมาย", "เริ่มย้ายชั้นวางทันทีเพื่อให้เห็นความคืบหน้าเร็วที่สุด", "จัดตามผังคลังของบริษัทอื่นที่เคยเห็นว่าสวยงาม", "สั่งซื้อชั้นวางใหม่ทั้งหมดก่อนเพื่อความทันสมัย", "ให้พนักงานคลังจัดกันเองตามความถนัดของแต่ละคน"], "answer": 0, "explanation": "การทำความเข้าใจวัตถุประสงค์ของคำสั่งก่อนปฏิบัติทำให้เลือกวิธีได้ถูกต้องและวัดผลสำเร็จได้ การลงมือทันทีโดยไม่รู้เป้าหมายอาจต้องรื้อทำใหม่ทั้งหมด", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 64, "q": "ลูกค้าที่หน้างานเร่งให้ท่านติดตั้งอุปกรณ์เพิ่มนอกเหนือจากใบสั่งงาน โดยบอกว่า 'เดี๋ยวเคลียร์กับบริษัทให้เอง' ท่านควรทำอย่างไร?", "choices": ["ทำให้ตามที่ลูกค้าขอเพราะลูกค้ารับปากจะเคลียร์ให้แล้ว", "ทำให้ฟรี ๆ ไปเลยเพื่อรักษาความสัมพันธ์กับลูกค้า", "เรียกเก็บเงินเพิ่มจากลูกค้าโดยตรงแล้วค่อยทำให้", "ปฏิบัติเฉพาะตามใบสั่งงาน และแจ้งลูกค้าให้ประสานคำขอเพิ่มเติมผ่านหัวหน้าหรือบริษัทเพื่อออกคำสั่งอย่างเป็นทางการ", "ทำให้ครึ่งเดียวพอเป็นน้ำใจ"], "answer": 3, "explanation": "การขยายขอบเขตงานต้องมาจากผู้มีอำนาจออกคำสั่งเท่านั้น คำรับปากของลูกค้าหน้างานไม่ใช่คำสั่งที่ชอบ การทำเกินคำสั่งอาจกระทบสัญญา ค่าใช้จ่าย และความรับผิด", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 65, "q": "ท่านรับช่วงงานต่อจากกะก่อน พบว่าเครื่องเจียรที่ต้องใช้ตามคำสั่งถูกถอดการ์ดป้องกันออกและหาไม่พบ ท่านควรทำอย่างไร?", "choices": ["ใช้เครื่องต่อไปโดยสวมแว่นนิรภัยเพิ่มเป็นการชดเชย", "ใช้เครื่องอย่างระมัดระวังเพราะกะก่อนก็ใช้แบบนี้มาแล้วทั้งกะ", "ประดิษฐ์แผ่นกันสะเก็ดชั่วคราวขึ้นเองแล้วใช้งานต่อ", "ย้ายไปใช้เครื่องของแผนกอื่นโดยไม่ขออนุญาต", "ไม่ใช้เครื่องดังกล่าว รายงานหัวหน้าเรื่องการ์ดหาย และรอให้ติดตั้งอุปกรณ์ป้องกันครบก่อนปฏิบัติงาน"], "answer": 4, "explanation": "ห้ามใช้เครื่องจักรที่อุปกรณ์ป้องกันไม่ครบโดยเด็ดขาด แม้กะก่อนจะเคยใช้มาก็ไม่ทำให้ปลอดภัยขึ้น ต้องรายงานและรอการแก้ไขให้ถูกต้องตามมาตรฐาน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 66, "q": "คำสั่งที่ได้รับตีความได้สองแบบ กำหนดส่งคือเย็นนี้ แต่หัวหน้าผู้ออกคำสั่งลาป่วยติดต่อไม่ได้ทุกช่องทาง ท่านควรทำอย่างไร?", "choices": ["เลือกตีความแบบที่ทำง่ายกว่าเพื่อให้ทันเวลา", "หยุดงานไว้เฉย ๆ จนกว่าหัวหน้าจะหายป่วยกลับมา", "ทำทั้งสองแบบพร้อมกันเพื่อให้มีอันที่ถูกแน่นอน", "ตัดสินใจเองเงียบ ๆ โดยไม่ปรึกษาหรือบันทึกอะไรไว้", "ปรึกษาผู้รักษาการแทนหรือผู้บังคับบัญชาลำดับถัดไปเพื่อขอคำวินิจฉัย พร้อมบันทึกการตัดสินใจไว้รายงานหัวหน้าเมื่อกลับมา"], "answer": 4, "explanation": "เมื่อผู้ออกคำสั่งติดต่อไม่ได้ ให้ใช้สายการบังคับบัญชาสำรองช่วยวินิจฉัยและบันทึกไว้เป็นหลักฐาน การเดาเอง ทำสองแบบ หรือหยุดรอเฉย ๆ ล้วนทำให้เสียทรัพยากรหรืองานไม่บรรลุเป้าหมาย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 67, "q": "หลังส่งมอบงานติดตั้งระบบไฟตามคำสั่งเรียบร้อยแล้ว ท่านมาพบภายหลังว่ามีจุดต่อสายหนึ่งจุดที่ตนขันไม่แน่นตามมาตรฐาน ท่านควรทำอย่างไร?", "choices": ["รายงานหัวหน้าทันทีตามความจริง และขอเข้าแก้ไขจุดบกพร่องโดยเร็วตามขั้นตอน", "เงียบไว้เพราะงานตรวจรับผ่านไปแล้ว ไม่มีใครรู้", "รอดูก่อนว่าจะเกิดปัญหาหรือไม่ ถ้ามีค่อยไปแก้", "แอบย้อนกลับไปแก้เองนอกเวลางานโดยไม่บอกใคร", "บอกเพื่อนให้ช่วยแก้แทนแบบลับ ๆ"], "answer": 0, "explanation": "ความบกพร่องที่พบภายหลังต้องรายงานตามความจริงทันทีเพื่อแก้ไขอย่างถูกขั้นตอน จุดต่อไฟที่หลวมอาจก่อไฟไหม้ การปกปิดหรือแอบแก้โดยไม่มีบันทึกทำให้ตรวจสอบย้อนกลับไม่ได้", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 68, "q": "หัวหน้าสั่งให้ท่านเข้าไปทำงานในถังอับอากาศทันทีโดยไม่ต้องรอผลตรวจวัดแก๊ส ซึ่งขัดกับระเบียบความปลอดภัยของบริษัท ท่านควรทำอย่างไร?", "choices": ["เข้าไปทำทันทีเพราะหัวหน้าย่อมรับผิดชอบแทนอยู่แล้ว", "แจ้งหัวหน้าอย่างสุภาพว่าระเบียบกำหนดให้ต้องตรวจวัดแก๊สก่อน และขอปฏิบัติตามขั้นตอนความปลอดภัย หากยังถูกบังคับให้รายงานเจ้าหน้าที่ความปลอดภัย", "เข้าไปทำแบบรีบ ๆ ให้เสร็จเร็วที่สุดจะได้เสี่ยงน้อย", "ให้เพื่อนที่ตัวเล็กกว่าเข้าไปแทนเพราะออกมาง่ายกว่า", "เปิดฝาถังทิ้งไว้สักพักแล้วเข้าไปเลยโดยถือว่าอากาศถ่ายเทแล้ว"], "answer": 1, "explanation": "คำสั่งที่ขัดกับระเบียบความปลอดภัยต้องได้รับการทักท้วง ผู้ปฏิบัติมีสิทธิ์ปฏิเสธงานที่เสี่ยงถึงชีวิตและรายงานต่อเจ้าหน้าที่ความปลอดภัย งานที่อับอากาศโดยไม่ตรวจแก๊สอาจถึงแก่ชีวิตได้", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 69, "q": "คู่มือประกอบชิ้นส่วนกำหนดลำดับการขันสลักเกลียวไว้ 12 ตำแหน่งแบบสลับฟันปลา ท่านคิดว่าขันเรียงแถวไปเลยน่าจะเร็วกว่า ท่านควรทำอย่างไร?", "choices": ["ขันเรียงแถวตามที่ตนคิดเพราะผลลัพธ์สุดท้ายก็แน่นเหมือนกัน", "ขันแบบผสมทั้งสองวิธีเพื่อความรวดเร็ว", "ถามเพื่อนว่าเคยขันเรียงแถวแล้วไม่มีปัญหาใช่ไหม แล้วทำตามเพื่อน", "ปฏิบัติตามลำดับในคู่มืออย่างเคร่งครัด และหากมีข้อเสนอปรับปรุงให้เสนอฝ่ายวิศวกรรมพิจารณาตามช่องทาง", "ขันตามคู่มือเฉพาะตอนที่มีคนดู"], "answer": 3, "explanation": "ลำดับการขันถูกออกแบบเพื่อกระจายแรงอย่างสม่ำเสมอ การเปลี่ยนลำดับเองอาจทำให้ชิ้นงานบิดตัวเสียหาย ข้อเสนอปรับปรุงต้องผ่านผู้มีอำนาจทางเทคนิค ไม่ใช่ตัดสินใจเองหน้างาน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 70, "q": "ท่านได้รับคำสั่งงานต่อเนื่องตอนใกล้หมดกะ และต้องส่งมอบงานที่ค้างให้กะถัดไปทำต่อ ท่านควรทำอย่างไร?", "choices": ["กลับบ้านตรงเวลาโดยปล่อยให้กะถัดไปมาดูงานเอาเอง", "เล่าปากเปล่าสั้น ๆ กับใครก็ได้ที่มาถึงก่อนแล้วรีบกลับ", "บันทึกสถานะงาน ขั้นตอนที่เหลือ ข้อควรระวัง และคำสั่งที่เกี่ยวข้องเป็นลายลักษณ์อักษร พร้อมอธิบายส่งมอบกับผู้รับผิดชอบกะถัดไปโดยตรง", "ทำงานต่อคนเดียวจนเสร็จแม้จะเลยกะไปหลายชั่วโมงโดยไม่แจ้งใคร", "ซ่อนงานที่ค้างไว้ก่อนเพื่อไม่ให้กะถัดไปสับสน"], "answer": 2, "explanation": "การส่งมอบงานข้ามกะต้องมีบันทึกลายลักษณ์อักษรและการอธิบายโดยตรงกับผู้รับผิดชอบ เพื่อให้คำสั่งและข้อควรระวังถูกส่งต่อครบถ้วน งานจึงเดินต่อได้อย่างปลอดภัย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 71, "q": "ผู้จัดการสั่งว่า 'ไปจัดการเรื่องข้อร้องเรียนของลูกค้ารายนี้ให้เรียบร้อย' โดยไม่ระบุว่าต้องดำเนินการถึงขั้นไหน ท่านควรทำอย่างไร?", "choices": ["โทรไปขอโทษลูกค้าอย่างเดียวแล้วถือว่าจบเรื่อง", "จ่ายเงินชดเชยให้ลูกค้าเต็มจำนวนทันทีเพื่อให้เรื่องเงียบ", "ส่งเรื่องต่อให้แผนกอื่นแล้วรายงานว่าจัดการแล้ว", "สอบถามผู้จัดการให้ชัดเจนถึงขอบเขตอำนาจ แนวทางที่ต้องการ และผลลัพธ์ที่ถือว่า 'เรียบร้อย' ก่อนดำเนินการ", "ตอบลูกค้าไปตามที่ตนเห็นสมควรโดยใช้ชื่อผู้จัดการอ้างอิง"], "answer": 3, "explanation": "คำว่า 'ให้เรียบร้อย' เป็นเป้าหมายที่กำกวม ต้องทวนถามขอบเขตอำนาจและเกณฑ์ความสำเร็จก่อน การชดเชยหรือให้คำมั่นเกินอำนาจของตนอาจสร้างภาระผูกพันที่บริษัทไม่ได้อนุมัติ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 72, "q": "ระหว่างทำงานด่วนตามคำสั่ง ท่านพบว่าต้องใช้อะไหล่ที่ต้องผ่านการอนุมัติจัดซื้อจากผู้จัดการก่อน ท่านควรทำอย่างไร?", "choices": ["สำรองเงินตัวเองซื้อมาก่อนเพื่อให้งานไม่สะดุด แล้วค่อยไปเบิกทีหลัง", "ใช้อะไหล่มือสองที่หาได้ในโรงงานแทนโดยไม่บอกใคร", "รายงานหัวหน้าทันทีว่างานติดขั้นตอนอนุมัติจัดซื้อ พร้อมขอให้เร่งกระบวนการหรือกำหนดแนวทางชั่วคราวอย่างเป็นทางการ", "หยุดงานเงียบ ๆ โดยไม่แจ้งใครว่าติดปัญหาอะไร", "ปลอมลายเซ็นอนุมัติไปก่อนเพราะยังไงผู้จัดการก็ต้องอนุมัติอยู่แล้ว"], "answer": 2, "explanation": "เมื่องานติดข้อจำกัดด้านอำนาจอนุมัติ ต้องรายงานอุปสรรคให้ผู้สั่งงานเร่งดำเนินการตามขั้นตอน การสำรองเงินซื้อเอง ใช้ของแทนโดยพลการ หรือปลอมการอนุมัติ ล้วนผิดระเบียบร้ายแรง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 73, "q": "รุ่นพี่ในไซต์งานสอนทางลัดที่ขัดกับวิธีในใบสั่งงาน โดยบอกว่า 'ที่นี่เขาทำกันแบบนี้ทั้งนั้น ไม่เคยมีปัญหา' ท่านควรทำอย่างไร?", "choices": ["ทำตามรุ่นพี่เพราะประสบการณ์จริงย่อมดีกว่าเอกสาร", "ทำตามรุ่นพี่เฉพาะตอนที่หัวหน้าไม่อยู่", "ทำตามทางลัดแต่เพิ่มความระมัดระวังเป็นสองเท่า", "ลองทำทั้งสองวิธีแล้วเลือกวิธีที่เร็วกว่า", "ปฏิบัติตามใบสั่งงาน และนำข้อเสนอทางลัดไปหารือหัวหน้างานให้ประเมินและอนุมัติอย่างเป็นทางการก่อนหากเห็นว่ามีประโยชน์"], "answer": 4, "explanation": "ความเคยชินของคนหน้างานไม่ใช่ข้ออนุญาตให้เบี่ยงเบนจากคำสั่ง คำว่า 'ไม่เคยมีปัญหา' ไม่ได้แปลว่าปลอดภัย วิธีใหม่ต้องผ่านการประเมินและอนุมัติจากผู้มีอำนาจก่อน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 74, "q": "หัวหน้าสั่งให้ท่านสอนงานพนักงานใหม่ 2 คนในสัปดาห์หน้า แต่ไม่ได้ระบุหัวข้อ ระยะเวลา และสื่อที่ใช้ ท่านควรทำอย่างไรก่อน?", "choices": ["สอบถามหัวหน้าถึงขอบเขตหัวข้อ เป้าหมายที่ต้องการ ระยะเวลา และทรัพยากรที่ใช้ได้ เพื่อเตรียมการสอนให้ตรงวัตถุประสงค์", "สอนทุกอย่างที่ตนรู้แบบไม่มีแผนเพราะยิ่งมากยิ่งดี", "ให้พนักงานใหม่เดินตามดูงานเฉย ๆ ทั้งสัปดาห์ก็ถือว่าสอนแล้ว", "เอาสไลด์เก่าของแผนกอื่นมาสอนโดยไม่ปรับเนื้อหา", "ปฏิเสธเพราะการสอนงานไม่ใช่หน้าที่ในตำแหน่งของตน"], "answer": 0, "explanation": "คำสั่งที่ขาดรายละเอียดสำคัญต้องทบทวนขอบเขตและวัตถุประสงค์กับผู้ออกคำสั่งก่อนวางแผนปฏิบัติ การสอนแบบไม่มีเป้าหมายทำให้เสียเวลาและวัดผลไม่ได้", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 75, "q": "ระหว่างปฏิบัติงานตามคำสั่ง ท่านเผลอทำชิ้นงานของลูกค้าเสียหายหนึ่งชิ้น ท่านควรทำอย่างไร?", "choices": ["ซ่อนชิ้นงานที่เสียไว้ท้ายกองแล้วทำงานต่อไป", "หยุดประเมินความเสียหาย แล้วรายงานหัวหน้าตามความจริงทันทีเพื่อหาทางแก้ไขและป้องกันการเกิดซ้ำ", "สลับเอาชิ้นงานสำรองของงานอื่นมาแทนโดยไม่บอกใคร", "โทษว่าเครื่องจักรขัดข้องทั้งที่เป็นความพลั้งเผลอของตน", "รอให้ฝ่ายตรวจสอบพบเองเพราะอาจตรวจไม่เจอก็ได้"], "answer": 1, "explanation": "ความผิดพลาดต้องรายงานตามความจริงทันทีเพื่อจำกัดความเสียหายและหาทางป้องกัน การปกปิด สลับชิ้นงาน หรือโยนความผิด ทำลายความไว้วางใจและอาจทำให้ของเสียหลุดถึงลูกค้า", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 76, "q": "หัวหน้ากำลังโมโหและสั่งงานอย่างรวดเร็วรวบรัดจนจับใจความได้ไม่ครบ ท่านควรทำอย่างไร?", "choices": ["รีบรับคำแล้วเดินออกมาก่อนเพื่อไม่ให้หัวหน้าโมโหหนักขึ้น แล้วค่อยเดาเอาทีหลัง", "ตั้งสติ ทวนประเด็นสำคัญกลับอย่างสุภาพ เช่น งานอะไร เสร็จเมื่อไร ส่งที่ใคร เพื่อยืนยันความเข้าใจก่อนแยกย้าย", "ไปถามเพื่อนร่วมงานว่าหัวหน้าน่าจะหมายถึงอะไร", "ทำงานที่ค้างอยู่เดิมต่อไปก่อน เดี๋ยวหัวหน้าหายโมโหคงมาสั่งใหม่เอง", "ส่งอีเมลถามยาว ๆ หลายข้อในตอนเย็นแทนการถามตอนนี้"], "answer": 1, "explanation": "แม้สถานการณ์กดดัน ผู้รับคำสั่งยังต้องยืนยันสาระสำคัญของคำสั่งให้ครบก่อนปฏิบัติ การเดาหรือรอเฉย ๆ เสี่ยงทำงานผิดและทำให้สถานการณ์แย่ลงกว่าเดิม", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 77, "q": "คำสั่งให้ติดตั้งป้ายที่ความสูง 6 เมตรภายในวันนี้ แต่พบว่าเข็มขัดนิรภัยชนิดเต็มตัวถูกยืมไปใช้ที่ไซต์อื่นหมด ท่านควรทำอย่างไร?", "choices": ["ปีนขึ้นไปทำโดยจับนั่งร้านให้แน่น ๆ เพราะแค่งานสั้น ๆ", " บกับคำสั่งและวัตถุประสงค์ทุกข้อ เก็บงานให้เรียบร้อย แล้วรายงานผลพร้อมปัญหาที่พบและข้อเสนอแนะต่อผู้สั่งงาน", "ส่งงานทันทีที่คิดว่าเสร็จเพื่อให้เร็วที่สุด", "ส่งงานแล้วรีบไปทำงานอื่นโดยไม่ต้องรอคำติชม", "ให้เพื่อนช่วยส่งงานแทนเพราะตนเขินที่จะพบหัวหน้า", "รายงานเฉพาะส่วนที่ทำได้ดี ส่วนปัญหาที่พบเก็บไว้ไม่ต้องพูดถึง"], "answer": 0, "explanation": "การปิดงานที่สมบูรณ์ต้องตรวจทานเทียบกับคำสั่งและเป้าหมาย แล้วรายงานผลอย่างครบถ้วนทั้งความสำเร็จและปัญหา เพื่อให้ผู้สั่งงานใช้ข้อมูลปรับปรุงงานครั้งต่อไปได้", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}]}]};</script>
<script>
"use strict";
/* ================= state & storage ================= */
const $ = id => document.getElementById(id);
const store = {
  get(){ try{return JSON.parse(localStorage.getItem("vnet-stats"))||{}}catch(e){return{}} },
  set(d){ localStorage.setItem("vnet-stats", JSON.stringify(d)) }
};
let S = null;         // current quiz session
let timerInt = null;
let muted = localStorage.getItem("vnet-muted")==="1";

/* ================= sounds (WebAudio) ================= */
let actx = null;
function beep(freqs, dur=0.12, type="sine", vol=0.15){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, actx.currentTime + i*dur);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (i+1)*dur);
      o.connect(g).connect(actx.destination);
      o.start(actx.currentTime + i*dur); o.stop(actx.currentTime + (i+1)*dur + .02);
    });
  }catch(e){}
}
const sndGood = ()=>beep([660,880],0.1,"sine",.12);
const sndBad  = ()=>beep([220,180],0.15,"square",.06);
const sndWin  = ()=>beep([523,659,784,1047],0.14,"sine",.14);
const sndClick= ()=>beep([440],0.05,"sine",.05);
function toggleMute(){ muted=!muted; localStorage.setItem("vnet-muted",muted?"1":"0"); $("mutebtn").textContent = muted?"🔇":"🔊"; }

/* ================= home ================= */
function renderHome(){
  const st = store.get();
  const myIds = new Set([...EXAM_DATA.subjects.map(s=>s.id), "mix"]);
  let answered=0, correct=0;
  for(const k in (st.log||{})){ if(!myIds.has(k)) continue; answered += st.log[k].a; correct += st.log[k].c; }
  $("st-total").textContent = EXAM_DATA.subjects.reduce((s,x)=>s+x.questions.length,0);
  $("st-answered").textContent = answered;
  $("st-acc").textContent = answered ? Math.round(correct/answered*100)+"%" : "—";
  $("st-streak").textContent = st.maxStreak||0;

  const g = $("subjects"); g.innerHTML = "";
  EXAM_DATA.subjects.forEach(s=>{
    const best = (st.best||{})[s.id];
    const b = document.createElement("button");
    b.className = "subj";
    b.innerHTML = `<div class="ic">${s.icon}</div><h3>${s.title}</h3><div class="sub">${s.subtitle}</div>
      <div class="meta"><span class="badge">${s.questions.length} ข้อ</span>
      <span class="best">${best!=null ? "🏆 "+best+"%" : "ยังไม่เคยทำ"}</span></div>`;
    b.onclick = ()=>openSetup(s.id);
    g.appendChild(b);
  });
  if(EXAM_DATA.subjects.length < 2) return;
  const grandTotal = EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0);
  const mix = document.createElement("button");
  mix.className = "subj mix";
  const mixBest = (st.best||{})["mix"];
  mix.innerHTML = `<div class="ic">🎲</div><h3>จับฉลากรวมทุกชุด</h3><div class="sub">สุ่มคละจากทั้ง ${grandTotal} ข้อ</div>
    <div class="meta"><span class="badge">ท้าทาย!</span><span class="best">${mixBest!=null?"🏆 "+mixBest+"%":"ยังไม่เคยทำ"}</span></div>`;
  mix.onclick = ()=>openSetup("mix");
  g.appendChild(mix);
}

/* ================= setup modal ================= */
let setup = {n:20, mode:"practice", shuffleQ:true, shuffleC:false, subj:null};
function openSetup(id){
  sndClick();
  setup.subj = id;
  const s = id==="mix" ? {title:"จับฉลากรวมทุกวิชา", subtitle:"คละทุกสมรรถนะ", icon:"🎲",
      questions:{length:EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0)}}
    : EXAM_DATA.subjects.find(x=>x.id===id);
  const total = s.questions.length;
  const counts = [10,20,30,total>=100?50:total].filter((v,i,a)=>v<=total && a.indexOf(v)===i);
  if(!counts.includes(total) && total<=60) counts.push(total);
  setup.n = counts.includes(20)?20:counts[0];
  if(id==="mix") setup.shuffleQ = true;
  $("modal-root").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeSetup()">
    <div class="modal">
      <h2>${s.icon} ${s.title}</h2>
      <div class="sub">${s.subtitle} • มีทั้งหมด ${total} ข้อ</div>
      <div class="optlabel">โหมด</div>
      <div class="optrow" id="mode-row">
        <button class="opt ${setup.mode==="practice"?"sel":""}" onclick="setMode('practice')">📖 ฝึกฝน (เฉลยทันที)</button>
        <button class="opt ${setup.mode==="exam"?"sel":""}" onclick="setMode('exam')">⏱️ สอบเสมือนจริง</button>
      </div>
      <div class="optlabel">จำนวนข้อ</div>
      <div class="optrow" id="count-row">
        ${counts.map(c=>`<button class="opt ${c===setup.n?"sel":""}" onclick="setCount(${c})">${c===total?"ทั้งหมด ("+c+")":c}</button>`).join("")}
      </div>
      <div class="toggle ${setup.shuffleQ?"on":""}" id="tg-q" onclick="tog('shuffleQ','tg-q')"><span class="box">${setup.shuffleQ?"✓":""}</span> สุ่มลำดับข้อ</div>
      <div class="toggle ${setup.shuffleC?"on":""}" id="tg-c" onclick="tog('shuffleC','tg-c')"><span class="box">${setup.shuffleC?"✓":""}</span> สุ่มลำดับตัวเลือก</div>
      <div class="mrow">
        <button class="btn ghost" onclick="closeSetup()">ยกเลิก</button>
        <button class="btn primary" onclick="startQuiz()">เริ่มเลย 🚀</button>
      </div>
    </div>
  </div>`;
}
function setMode(m){ setup.mode=m; document.querySelectorAll("#mode-row .opt").forEach((b,i)=>b.classList.toggle("sel",(i===0)===(m==="practice"))); sndClick(); }
function setCount(c){ setup.n=c; document.querySelectorAll("#count-row .opt").forEach(b=>b.classList.toggle("sel",b.textContent.includes("("+c+")")||b.textContent.trim()==String(c))); sndClick(); }
function tog(key,id){ setup[key]=!setup[key]; const el=$(id); el.classList.toggle("on",setup[key]); el.querySelector(".box").textContent = setup[key]?"✓":""; sndClick(); }
function closeSetup(){ $("modal-root").innerHTML=""; }

/* ================= quiz engine ================= */
function shuffled(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

function startQuiz(){
  closeSetup();
  let pool, labels;
  if(setup.subj==="mix"){
    pool = EXAM_DATA.subjects.flatMap(s=>s.questions.map(q=>({...q, labels:s.labels, from:s.icon+" "+s.title})));
    labels = null;
  } else {
    const s = EXAM_DATA.subjects.find(x=>x.id===setup.subj);
    pool = s.questions.map(q=>({...q, labels:s.labels, from:""}));
  }
  if(setup.shuffleQ) pool = shuffled(pool);
  pool = pool.slice(0, setup.n);
  pool = pool.map(q=>{
    let idx = q.choices.map((_,i)=>i);
    if(setup.shuffleC) idx = shuffled(idx);
    return {...q, order:idx, picked:null, removed:[]};
  });
  S = { qs:pool, i:0, correct:0, streak:0, maxStreak:0, fifty:3, mode:setup.mode,
        subj:setup.subj, start:Date.now(), done:false };
  $("home").classList.add("hidden"); $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("mutebtn").textContent = muted?"🔇":"🔊";
  $("palette").classList.toggle("hidden", S.mode!=="exam");
  clearInterval(timerInt);
  timerInt = setInterval(()=>{ const t=Math.floor((Date.now()-S.start)/1000);
    $("q-timer").textContent = String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); },500);
  renderQ();
  window.scrollTo(0,0);
}

function renderQ(){
  const q = S.qs[S.i];
  $("q-count").textContent = `${S.i+1}/${S.qs.length}`;
  $("q-score").textContent = `✅ ${S.correct}`;
  $("q-streak").textContent = `🔥 ${S.streak}`;
  $("q-progress").style.width = (S.i/S.qs.length*100)+"%";
  $("q-section").textContent = q.from || q.section || "";
  stopSpeech();
  const audio = parseAudio(q.q);
  $("q-text").textContent = `${S.i+1}. ${audio ? audio.question : q.q}`;
  renderAudioBox(audio, q);
  $("q-expl").innerHTML = "";
  $("nextbtn").classList.add("hidden");
  $("skipbtn").classList.toggle("hidden", S.mode!=="exam");
  $("submitbtn").classList.add("hidden");
  $("fifty").classList.toggle("hidden", S.mode!=="practice");
  $("fifty").disabled = S.fifty<=0;
  $("fifty-n").textContent = "×"+S.fifty;

  const c = $("q-choices"); c.innerHTML = "";
  q.order.forEach((origIdx,pos)=>{
    const b = document.createElement("button");
    b.className = "choice";
    if(q.removed.includes(origIdx)) b.classList.add("dim");
    b.innerHTML = `<span class="lb">${q.labels[pos]}</span><span>${q.choices[origIdx]}</span>`;
    if(S.mode==="exam" && q.picked===origIdx) b.classList.add("picked");
    b.onclick = ()=>pick(origIdx, b);
    c.appendChild(b);
  });
  if(S.mode==="exam"){
    renderPalette();
    if(q.picked!==null || S.i===S.qs.length-1) maybeShowSubmit();
  }
}

/* ===== text-to-speech for listening questions ===== */
const AUDIO_RE = /^\(Audio\)\s*['‘’](.*)['‘’]\s*(?:->|→)\s*(.*)$/s;
function parseAudio(text){
  const m = AUDIO_RE.exec(text);
  return m ? {script:m[1].trim(), question:m[2].trim()} : null;
}
let currentScript = null;
let currentAudioSrc = null;   // mp3 for this question (real voice), if available
let audioEl = null;
function stopSpeech(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  if(audioEl){ audioEl.pause(); audioEl = null; }
  document.querySelectorAll(".playbtn").forEach(b=>b.classList.remove("playing"));
}
let currentUtterance = null; // keep a reference so Chrome doesn't GC it mid-speech
function playAudio(){
  stopSpeech();
  const btnA = document.querySelector(".playbtn");
  if(currentAudioSrc){
    const src = currentAudioSrc.startsWith("data:") ? currentAudioSrc
              : (window.AUDIO_BASE || "audio/") + currentAudioSrc;
    audioEl = new Audio(src);
    audioEl.onplay = ()=>btnA && btnA.classList.add("playing");
    audioEl.onended = ()=>btnA && btnA.classList.remove("playing");
    audioEl.onerror = ()=>{ btnA && btnA.classList.remove("playing"); speakScript(); };
    audioEl.play().catch(()=>speakScript());
    return;
  }
  speakScript();
}
function speakScript(){
  if(!("speechSynthesis" in window) || !currentScript) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(currentScript);
  u.lang = "en-US"; u.rate = 0.92;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x=>x.name==="Samantha") || vs.find(x=>x.lang==="en-US") ||
            vs.find(x=>x.lang && x.lang.startsWith("en"));
  if(v) u.voice = v;
  const btn = document.querySelector(".playbtn");
  u.onstart = ()=>btn && btn.classList.add("playing");
  u.onend = u.onerror = ()=>btn && btn.classList.remove("playing");
  currentUtterance = u;
  // Chrome quirk: speak() immediately after cancel() can be silently dropped
  setTimeout(()=>speechSynthesis.speak(u), 80);
}
function toggleScript(){
  const s = $("q-script"); if(s) s.classList.toggle("hidden");
}
function renderAudioBox(audio, q){
  currentScript = audio ? audio.script : null;
  currentAudioSrc = (audio && q && q.audio) ? q.audio : null;
  const box = $("q-audio");
  if(!audio){ box.innerHTML = ""; return; }
  const ttsOK = currentAudioSrc !== null || "speechSynthesis" in window;
  box.innerHTML = `<div class="audio-box">
    <div class="audio-row">
      <button class="playbtn" onclick="playAudio()">▶️ ฟังเสียง</button>
      <button class="scriptbtn" onclick="toggleScript()">📜 ดูบทพูด</button>
    </div>
    <div class="script hidden" id="q-script">"${audio.script}"</div>
    <div class="audio-hint">${ttsOK ? "ฟังได้หลายรอบ • ลองตอบโดยไม่เปิดบทพูดเพื่อฝึกการฟังจริง" : "เบราว์เซอร์นี้ไม่รองรับเสียงพูด — กด ดูบทพูด เพื่ออ่านแทน"}</div>
  </div>`;
}
function labelOf(q, origIdx){ return q.labels[q.order.indexOf(origIdx)]; }
function pick(idx, btn){
  const q = S.qs[S.i];
  if(S.mode==="practice"){
    if(q.picked!==null) return;
    q.picked = idx;
    const good = idx===q.answer;
    if(good){ S.correct++; S.streak++; S.maxStreak=Math.max(S.maxStreak,S.streak); sndGood();
      if(S.streak>0 && S.streak%5===0){ comboPop("🔥 "+S.streak+" ติด!"); }
    } else { S.streak=0; sndBad(); $("qcard").classList.add("shake"); setTimeout(()=>$("qcard").classList.remove("shake"),400); }
    // reveal
    [...$("q-choices").children].forEach((b,pos)=>{
      const oi = q.order[pos];
      b.disabled = true;
      if(oi===q.answer) b.classList.add("correct");
      else if(oi===idx) b.classList.add("wrong");
    });
    $("q-score").textContent = `✅ ${S.correct}`;
    $("q-streak").textContent = `🔥 ${S.streak}`;
    $("q-expl").innerHTML = `<div class="expl ${good?"good":"bad"}">
      <h4>${good ? "🎉 ถูกต้อง!" : "❌ ยังไม่ถูก — เฉลยคือ "+labelOf(q,q.answer)+"."}</h4>
      <p>${q.explanation || "ไม่มีคำอธิบายเพิ่มเติมสำหรับข้อนี้"}</p></div>`;
    const sc = $("q-script"); if(sc) sc.classList.remove("hidden");
    $("fifty").classList.add("hidden");
    if(S.i===S.qs.length-1){ $("nextbtn").textContent = "ดูสรุปผล 🏁"; }
    $("nextbtn").classList.remove("hidden");
    $("nextbtn").focus();
  } else {
    q.picked = idx; sndClick();
    [...$("q-choices").children].forEach((b,pos)=>b.classList.toggle("picked", q.order[pos]===idx));
    renderPalette(); maybeShowSubmit();
    setTimeout(()=>{ if(S.i<S.qs.length-1){ S.i++; renderQ(); window.scrollTo(0,0);} }, 250);
  }
}

function nextQ(){
  if(S.i>=S.qs.length-1){ finishQuiz(); return; }
  S.i++; renderQ(); window.scrollTo(0,0);
}
function maybeShowSubmit(){
  const allDone = S.qs.every(q=>q.picked!==null);
  $("submitbtn").classList.toggle("hidden", !(allDone || S.i===S.qs.length-1));
}
function renderPalette(){
  const p = $("palette"); p.innerHTML = "";
  S.qs.forEach((q,i)=>{
    const b = document.createElement("button");
    b.className = "pal"+(q.picked!==null?" done":"")+(i===S.i?" cur":"");
    b.textContent = i+1;
    b.onclick = ()=>{ S.i=i; renderQ(); };
    p.appendChild(b);
  });
}
function useFifty(){
  const q = S.qs[S.i];
  if(S.fifty<=0 || q.picked!==null) return;
  S.fifty--;
  const wrongs = shuffled(q.order.filter(i=>i!==q.answer && !q.removed.includes(i))).slice(0,2);
  q.removed.push(...wrongs);
  sndClick(); renderQ();
}
function confirmExit(){
  if(S && !S.done && S.qs.some(q=>q.picked!==null)){
    if(!confirm("ออกจากการทำข้อสอบ? ความคืบหน้ารอบนี้จะหายไป")) return;
  }
  quitToHome();
}
function quitToHome(){
  stopSpeech();
  clearInterval(timerInt); S=null;
  $("quiz").classList.add("hidden"); $("result").classList.add("hidden");
  $("home").classList.remove("hidden");
  renderHome(); window.scrollTo(0,0);
}

/* ================= results ================= */
function finishQuiz(){
  S.done = true;
  stopSpeech();
  clearInterval(timerInt);
  if(S.mode==="exam"){ S.correct = S.qs.filter(q=>q.picked===q.answer).length; }
  const n = S.qs.length, pct = Math.round(S.correct/n*100);
  const secs = Math.floor((Date.now()-S.start)/1000);
  const time = String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0");

  // save stats
  const st = store.get();
  st.best = st.best||{}; st.log = st.log||{};
  if(pct > (st.best[S.subj] ?? -1)) st.best[S.subj] = pct;
  const lg = st.log[S.subj] || {a:0,c:0};
  lg.a += n; lg.c += S.correct; st.log[S.subj] = lg;
  st.maxStreak = Math.max(st.maxStreak||0, S.maxStreak);
  store.set(st);

  const verdict = pct===100 ? ["🏆 สมบูรณ์แบบ!","var(--warn)"]
    : pct>=80 ? ["🌟 เยี่ยมมาก!","var(--good)"]
    : pct>=60 ? ["👍 ผ่านเกณฑ์ ทำได้ดี","var(--brand2)"]
    : pct>=40 ? ["💪 เกือบแล้ว สู้ต่อ!","var(--warn)"]
    : ["📚 ทบทวนอีกนิด แล้วลองใหม่","var(--bad)"];

  const circ = 2*Math.PI*80;
  const wrong = S.qs.filter(q=>q.picked!==q.answer);
  $("quiz").classList.add("hidden");
  const r = $("result");
  r.classList.remove("hidden");
  r.innerHTML = `
  <div class="result">
    <div style="display:flex;justify-content:space-between"><button class="topbtn" onclick="quitToHome()">← หน้าหลัก</button>
    <button class="topbtn" onclick="retry()">🔄 ทำใหม่</button></div>
    <div class="ring">
      <svg width="190" height="190"><circle cx="95" cy="95" r="80" fill="none" stroke="var(--card2)" stroke-width="14"/>
      <circle cx="95" cy="95" r="80" fill="none" stroke="${pct>=60?"var(--good)":pct>=40?"var(--warn)":"var(--bad)"}" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" id="ringbar"/></svg>
      <div class="num"><b>${pct}%</b><span>${S.correct} / ${n} ข้อ</span></div>
    </div>
    <div class="verdict" style="color:${verdict[1]}">${verdict[0]}</div>
    <div class="rstats">
      <div class="stat"><b>⏱️ ${time}</b><span>เวลาที่ใช้</span></div>
      <div class="stat"><b>🔥 ${S.maxStreak}</b><span>ตอบถูกติดกันสูงสุด</span></div>
      <div class="stat"><b>${wrong.length}</b><span>ข้อที่ผิด/ข้าม</span></div>
    </div>
    ${wrong.length ? `<button class="btn primary" style="max-width:320px;margin:0 auto" onclick="$('rev').classList.toggle('hidden')">📖 ทบทวนข้อที่ผิด (${wrong.length})</button>` : ""}
    <div class="review ${S.mode==="exam"?"":"hidden"}" id="rev">
      ${wrong.map(q=>`<div class="rq">
        <div class="st no">✗ ${q.q}</div>
        <p>คำตอบของคุณ: ${q.picked!==null ? labelOf(q,q.picked)+". "+q.choices[q.picked] : "— ไม่ได้ตอบ"}</p>
        <p style="color:var(--good)">เฉลย: ${labelOf(q,q.answer)}. ${q.choices[q.answer]}</p>
        <div class="ex">💡 ${q.explanation || "ไม่มีคำอธิบายเพิ่มเติม"}</div>
      </div>`).join("")}
    </div>
  </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const bar = $("ringbar"); bar.style.transition = "stroke-dashoffset 1.2s ease";
    bar.style.strokeDashoffset = circ*(1-pct/100);
  }));
  if(pct>=80){ sndWin(); confetti(); } else if(pct>=60){ sndWin(); }
  window.scrollTo(0,0);
}
function retry(){ openSetupFromResult(); }
function openSetupFromResult(){ const id=S.subj; quitToHome(); openSetup(id); }

/* ================= fun bits ================= */
function comboPop(text){
  const el = document.createElement("div");
  el.className = "combo-pop"; el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}
function confetti(){
  const cv = $("confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#7c6cff","#4ecdc4","#ffc94d","#ff5d73","#3ddc84"];
  const ps = Array.from({length:140},()=>({
    x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.5,
    w:6+Math.random()*6, h:8+Math.random()*8,
    vy:2+Math.random()*3, vx:(Math.random()-.5)*2, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.2,
    c:colors[Math.floor(Math.random()*colors.length)]
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if(++frames < 260) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* keyboard shortcuts: 1-5 answer, Enter/space next */
document.addEventListener("keydown", e=>{
  if(!S || $("quiz").classList.contains("hidden")) return;
  if(e.key>="1" && e.key<="5"){
    const pos = +e.key-1, btns = $("q-choices").children;
    if(btns[pos] && !btns[pos].disabled) btns[pos].click();
  } else if(e.key==="Enter" && !$("nextbtn").classList.contains("hidden")){ nextQ(); }
});

renderHome();
</script>
