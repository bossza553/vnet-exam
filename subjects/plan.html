<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗓️ การวางแผนและจัดตารางเวลา — ข้อสอบ V-NET 80 ข้อ</title>
<style>
:root{
  --bg:#0f1220; --bg2:#171b30; --card:#1e2340; --card2:#252b4d;
  --text:#eef0ff; --muted:#9aa3c7; --line:#323a63;
  --brand:#7c6cff; --brand2:#4ecdc4; --good:#3ddc84; --bad:#ff5d73; --warn:#ffc94d;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Noto Sans Thai","Segoe UI",sans-serif;
  background:radial-gradient(1200px 800px at 80% -10%,#2a2f55 0%,var(--bg) 55%);
  color:var(--text); min-height:100vh; line-height:1.6;
}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}

/* ===== Home ===== */
.hero{text-align:center;padding:28px 0 20px}
.hero h1{font-size:2rem;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);margin-top:6px}
.statbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;text-align:center;min-width:110px}
.stat b{font-size:1.3rem;display:block}
.stat span{color:var(--muted);font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.subj{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:left;transition:.18s;position:relative;overflow:hidden}
.subj:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 24px rgba(124,108,255,.25)}
.subj .ic{font-size:1.9rem}
.subj h3{font-size:1.02rem;margin:8px 0 2px}
.subj .sub{color:var(--muted);font-size:.8rem}
.subj .meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:.82rem;color:var(--muted)}
.badge{background:var(--bg2);border:1px solid var(--line);padding:2px 10px;border-radius:999px}
.best{color:var(--warn)}
.subj.mix{background:linear-gradient(135deg,#3b2f7a,#1c5f5a);border-color:#6a5cff}

/* ===== Setup modal ===== */
.overlay{position:fixed;inset:0;background:rgba(8,10,20,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:20px;max-width:440px;width:100%;padding:24px}
.modal h2{font-size:1.2rem;margin-bottom:2px}
.modal .sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.optlabel{font-size:.85rem;color:var(--muted);margin:14px 0 6px}
.optrow{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:.9rem}
.opt.sel{background:var(--brand);border-color:var(--brand);font-weight:700}
.toggle{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.9rem;color:var(--muted);cursor:pointer;user-select:none}
.toggle .box{width:20px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.toggle.on .box{background:var(--good);border-color:var(--good);color:#08331c}
.mrow{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:12px;border-radius:12px;font-size:1rem;font-weight:700}
.btn.primary{background:linear-gradient(90deg,var(--brand),#9b8cff);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line)}

/* ===== Quiz ===== */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qtop .left{display:flex;gap:8px;align-items:center}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.85rem}
.pill.flame{border-color:#ff8c42;color:#ffb347}
.pill.timer{min-width:84px;text-align:center}
.progress{height:8px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.qsec{color:var(--brand2);font-size:.78rem;margin-bottom:6px}
.qtext{font-size:1.08rem;font-weight:600;white-space:pre-wrap}
.choices{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-size:.97rem;transition:.15s;width:100%}
.choice:not(:disabled):hover{border-color:var(--brand)}
.choice .lb{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.choice.correct{border-color:var(--good);background:rgba(61,220,132,.12)}
.choice.correct .lb{background:var(--good);color:#06301a;border-color:var(--good)}
.choice.wrong{border-color:var(--bad);background:rgba(255,93,115,.12)}
.choice.wrong .lb{background:var(--bad);color:#fff;border-color:var(--bad)}
.choice.picked{border-color:var(--brand);background:rgba(124,108,255,.14)}
.choice.dim{opacity:.28;pointer-events:none}
.expl{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid;animation:pop .25s}
.expl.good{background:rgba(61,220,132,.1);border-color:var(--good)}
.expl.bad{background:rgba(255,93,115,.1);border-color:var(--bad)}
.expl h4{font-size:.95rem;margin-bottom:4px}
.expl p{font-size:.92rem;color:var(--text)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.qactions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.lifeline{background:var(--card);border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:10px 16px;font-weight:700}
.lifeline:disabled{opacity:.35;border-color:var(--line);color:var(--muted)}
.shake{animation:shake .35s}
.audio-box{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
.audio-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.playbtn{background:linear-gradient(90deg,#2e7d6b,var(--brand2));color:#04241f;font-weight:800;border-radius:99px;padding:10px 22px;font-size:1rem;display:inline-flex;align-items:center;gap:8px}
.playbtn.playing{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(78,205,196,.5)}50%{box-shadow:0 0 0 10px rgba(78,205,196,0)}}
.scriptbtn{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:.85rem;color:var(--muted)}
.script{margin-top:12px;border-left:3px solid var(--brand2);padding:6px 12px;font-style:italic;color:var(--muted);font-size:.95rem}
.audio-hint{color:var(--muted);font-size:.78rem;margin-top:8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.combo-pop{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);font-size:2.2rem;font-weight:800;pointer-events:none;z-index:99;animation:rise 1s forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}

/* palette (exam mode) */
.palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.pal{width:34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-size:.8rem}
.pal.done{background:var(--brand);border-color:var(--brand);font-weight:700}
.pal.cur{outline:2px solid var(--brand2)}

/* ===== Results ===== */
.result{text-align:center;padding-top:10px}
.ring{width:190px;height:190px;margin:14px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:2.4rem}
.ring .num span{color:var(--muted);font-size:.85rem}
.verdict{font-size:1.3rem;font-weight:800;margin:4px 0 14px}
.rstats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.review{margin-top:26px;text-align:left}
.review h3{margin-bottom:12px}
.rq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.rq .st{font-weight:700}
.rq .st.ok{color:var(--good)} .rq .st.no{color:var(--bad)}
.rq p{font-size:.9rem;margin-top:4px}
.rq .ex{color:var(--muted);font-size:.86rem;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.topbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.85rem}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.footer-note{text-align:center;color:var(--muted);font-size:.75rem;margin-top:40px}
@media(max-width:520px){ .hero h1{font-size:1.5rem} .qtext{font-size:1rem} }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ HOME ============ -->
  <div id="home">
    <div class="hero">
      <h1>🗓️ การวางแผนและจัดตารางเวลา</h1>
      <p>Planning & Scheduling • 80 ข้อ พร้อมเฉลยและคำอธิบายทุกข้อ</p>
    </div>
    <div class="statbar">
      <div class="stat"><b id="st-total">540</b><span>ข้อสอบทั้งหมด</span></div>
      <div class="stat"><b id="st-answered">0</b><span>ทำไปแล้ว (ครั้ง)</span></div>
      <div class="stat"><b id="st-acc">—</b><span>ความแม่นยำรวม</span></div>
      <div class="stat"><b id="st-streak">0</b><span>สถิติตอบถูกติดกัน</span></div>
    </div>
    <div class="grid" id="subjects"></div>
    <p class="footer-note">แตะวิชาเพื่อเริ่ม • ผลคะแนนบันทึกไว้ในเครื่องอัตโนมัติ</p>
  </div>

  <!-- ============ QUIZ ============ -->
  <div id="quiz" class="hidden">
    <div class="qtop">
      <div class="left">
        <button class="topbtn" onclick="confirmExit()">← ออก</button>
        <span class="pill" id="q-count">1/30</span>
        <span class="pill" id="q-score">✅ 0</span>
      </div>
      <div class="left">
        <span class="pill flame" id="q-streak">🔥 0</span>
        <span class="pill timer" id="q-timer">00:00</span>
        <button class="topbtn" id="mutebtn" onclick="toggleMute()">🔊</button>
      </div>
    </div>
    <div class="progress"><i id="q-progress" style="width:0%"></i></div>
    <div class="qcard" id="qcard">
      <div class="qsec" id="q-section"></div>
      <div class="qtext" id="q-text"></div>
      <div id="q-audio"></div>
      <div class="choices" id="q-choices"></div>
      <div id="q-expl"></div>
      <div class="qactions">
        <button class="lifeline" id="fifty" onclick="useFifty()">✂️ 50:50 <span id="fifty-n">×3</span></button>
        <button class="btn primary hidden" id="nextbtn" onclick="nextQ()">ข้อถัดไป →</button>
        <button class="btn ghost hidden" id="skipbtn" onclick="nextQ()">ข้าม →</button>
        <button class="btn primary hidden" id="submitbtn" onclick="finishQuiz()">ส่งคำตอบ ✅</button>
      </div>
    </div>
    <div class="palette hidden" id="palette"></div>
  </div>

  <!-- ============ RESULT ============ -->
  <div id="result" class="hidden"></div>
</div>

<div id="modal-root"></div>

<script>window.AUDIO_BASE='../audio/';const EXAM_DATA = {"subjects": [{"id": "plan", "icon": "🗓️", "title": "การวางแผนและจัดตารางเวลา", "subtitle": "Planning & Scheduling", "labels": ["ก", "ข", "ค", "ง", "จ"], "questions": [{"n": 1, "q": "หากคุณมีงาน 2 ชิ้นที่ต้องส่งในวันเดียวกัน งาน A มีผลกระทบต่อภาพรวมสูงแต่งานง่าย งาน B มีความเร่งด่วนสูงแต่ผลกระทบต่ำ คุณควรเลือกทำสิ่งใดก่อน?", "choices": ["เลือกทำงาน B ให้เสร็จก่อนเพราะเร่งด่วนที่สุด", "เลือกทำงาน A ก่อนเพราะส่งผลกระทบมากกว่า", "ทำงานที่ง่ายที่สุดก่อนเพื่อสร้างกำลังใจ", "สอบถามหัวหน้างานก่อนว่าควรเริ่มงานใด แล้วจึงค่อยลงมือ", "สลับทำทั้งสองงานไปพร้อมกันเพื่อให้คืบหน้าเท่ากัน"], "answer": 0, "explanation": "สมรรถนะ 4.1 กำหนดให้จัดลำดับตามสภาพความเร่งด่วนของงาน เมื่อกำหนดส่งวันเดียวกัน งาน B ที่เร่งด่วนกว่าจึงต้องทำก่อน ส่วนงาน A แม้ผลกระทบสูงแต่เป็นงานง่าย ใช้เวลาน้อย สามารถทำตามหลังให้เสร็จทันได้", "section": ""}, {"n": 2, "q": "ข้อใดคือเกณฑ์ที่สำคัญที่สุดในการวิเคราะห์ 'ความเร่งด่วน' ของงาน?", "choices": ["ความยากง่ายของเนื้อหางาน", "กำหนดเวลาส่ง (Deadline) และผลกระทบหากล่าช้า", "ลำดับก่อน-หลังที่ได้รับมอบหมายงาน", "ปริมาณงานและระยะเวลาที่ต้องใช้ทำ", "ระดับตำแหน่งของผู้สั่งงาน"], "answer": 1, "explanation": "ความเร่งด่วนวัดจากเงื่อนไขเวลา (Deadline) และผลกระทบหากงานล่าช้า ไม่ใช่ความยากง่าย ปริมาณงาน ลำดับที่ได้รับ หรือตำแหน่งของผู้สั่งงาน", "section": ""}, {"n": 3, "q": "หากงานที่สำคัญที่สุดใช้เวลานานเกินคาดจนอาจกระทบงานอื่น คุณควรจัดการอย่างไร?", "choices": ["เลื่อนงานอื่นทั้งหมดออกไปก่อนโดยไม่แจ้งผู้เกี่ยวข้อง", "ปรับแผนและใช้เวลาสำรอง (Buffer Time) ที่เตรียมไว้", "ลดคุณภาพงานลงเพื่อให้เสร็จตามเวลา", "เร่งทำงานสำคัญต่อจนเสร็จ แล้วค่อยพิจารณางานที่เหลือ", "ทำงานล่วงเวลาเพิ่มโดยไม่ปรับแผนใด ๆ"], "answer": 1, "explanation": "แผนงานที่ดีต้องเผื่อเวลาสำรอง (Buffer Time) ไว้ เมื่องานหลักใช้เวลาเกินคาดจึงปรับแผนโดยใช้เวลาสำรองนั้น ไม่ใช่ลดคุณภาพ เลื่อนงานอื่นโดยพลการ หรือทุ่มทำล่วงเวลาโดยไม่ปรับแผน", "section": ""}, {"n": 4, "q": "เครื่องมือ 'Gantt Chart' มีประโยชน์สูงสุดในเรื่องใด?", "choices": ["การบันทึกและควบคุมค่าใช้จ่ายของโครงการ", "การแสดงลำดับขั้นตอนงานและความสัมพันธ์กับเวลา", "การวิเคราะห์หาสาเหตุของปัญหาในการทำงาน", "การประเมินผลการปฏิบัติงานรายบุคคล", "การสรุปค่าใช้จ่ายเปรียบเทียบกับงบประมาณ"], "answer": 1, "explanation": "Gantt Chart คือแผนภูมิแท่งแสดงกิจกรรมเทียบกับแกนเวลา ใช้ดูลำดับขั้นตอน ระยะเวลา และความสัมพันธ์ของงานแต่ละส่วน ไม่ใช่เครื่องมือด้านงบประมาณ การวิเคราะห์สาเหตุ หรือการประเมินบุคคล", "section": ""}, {"n": 5, "q": "ข้อใดแสดงถึงการใช้ 'ทรัพยากรอย่างมีประสิทธิภาพ' ในสำนักงาน?", "choices": ["การสั่งซื้อวัสดุครั้งละมาก ๆ เพื่อให้ได้ส่วนลดสูงสุด", "การใช้ทรัพยากรร่วมกันอย่างเหมาะสม เช่น เครื่องพิมพ์ส่วนกลาง", "การเลือกใช้วัสดุเกรดสูงสุดในทุกงานเพื่อคุณภาพ", "การพิมพ์เอกสารสำรองไว้หลายชุดเผื่อมีผู้ขอ", "การเพิ่มกำลังคนทุกครั้งที่งานเริ่มล่าช้า"], "answer": 1, "explanation": "การใช้ทรัพยากรร่วมกัน เช่น เครื่องพิมพ์ส่วนกลาง ลดความซ้ำซ้อนและคุ้มค่าที่สุด ส่วนการซื้อจำนวนมากเกิน การใช้เกรดสูงเกินจำเป็น หรือการเพิ่มคนทุกครั้งที่งานช้า ล้วนสิ้นเปลืองโดยไม่จำเป็น", "section": ""}, {"n": 6, "q": "การตรวจสอบแผนงานว่า 'ถูกต้องและครบถ้วน' ควรทำเมื่อใด?", "choices": ["เมื่อทำงานเสร็จแล้ว", "ก่อนเริ่มปฏิบัติงานและเป็นระยะระหว่างดำเนินการ", "เมื่อเกิดปัญหาขึ้นเท่านั้น", "ก่อนส่งมอบงานขั้นสุดท้ายเพียงครั้งเดียว", "ตรวจสอบเฉพาะงานใหม่ที่ไม่เคยทำมาก่อน"], "answer": 1, "explanation": "การตรวจสอบแผนต้องทำทั้งก่อนเริ่มงานและติดตามเป็นระยะระหว่างดำเนินการ เพื่อพบข้อผิดพลาดตั้งแต่เนิ่น ๆ การตรวจครั้งเดียวตอนท้ายหรือรอให้ปัญหาเกิดก่อนจะแก้ไขได้ยากและมีต้นทุนสูงกว่า", "section": ""}, {"n": 7, "q": "พฤติกรรมใดแสดงถึงการจัดลำดับความสำคัญที่ 'ผิดพลาด'?", "choices": ["ทำงานที่ส่งผลต่อความปลอดภัยก่อน", "ทำงานที่ง่ายและชอบก่อนแต่งานนั้นไม่ด่วน", "ทำงานที่ใกล้ถึงกำหนดส่งก่อน", "ทำงานที่เป็นเป้าหมายหลักของปี", "ทำงานที่ต้องส่งต่อให้แผนกอื่นเพื่อไม่ให้งานติดขัด"], "answer": 1, "explanation": "การเลือกทำงานที่ง่ายและชอบทั้งที่ไม่เร่งด่วนคือการจัดลำดับที่ผิด ส่วนตัวเลือกอื่น (งานความปลอดภัย งานใกล้กำหนด งานเป้าหมายหลัก งานที่แผนกอื่นรอ) เป็นเกณฑ์การจัดลำดับที่ถูกต้องทั้งสิ้น", "section": ""}, {"n": 8, "q": "หากทรัพยากรที่เตรียมไว้ไม่เพียงพอต่อแผนงาน คุณควรทำอย่างไร?", "choices": ["ฝืนทำต่อไปแม้คุณภาพต่ำ", "ทบทวนแผนและหาทางบริหารทรัพยากรทดแทน", "ชะลองานไว้จนกว่าจะได้รับทรัพยากรครบตามแผนเดิม", "ดึงทรัพยากรจากงานอื่นมาใช้ก่อนโดยไม่ปรับแผน", "ขอเพิ่มงบประมาณทันทีโดยยังไม่ทบทวนแผนเดิม"], "answer": 1, "explanation": "เมื่อทรัพยากรไม่พอ ต้องทบทวนแผนและบริหารจัดการทดแทนอย่างเป็นระบบ ไม่ฝืนทำจนคุณภาพตก ไม่ชะลองานรอเฉย ๆ และไม่ดึงทรัพยากรของงานอื่นมาใช้โดยไม่ปรับแผน", "section": ""}, {"n": 9, "q": "เครื่องมือ 'Checklist' ช่วยในเรื่องใดมากที่สุด?", "choices": ["ช่วยจัดลำดับความสำคัญของงานให้โดยอัตโนมัติ", "ป้องกันการลืมขั้นตอนสำคัญและความครบถ้วนของงาน", "ใช้วัดผลการปฏิบัติงานของพนักงานได้โดยตรง", "ช่วยลดเวลาการทำงานในแต่ละขั้นตอนลงโดยตรง", "ใช้แทนแผนการดำเนินงานทั้งหมดได้"], "answer": 1, "explanation": "Checklist ช่วยป้องกันการหลงลืมขั้นตอนและยืนยันความครบถ้วนของงาน แต่ไม่ได้จัดลำดับความสำคัญให้ ไม่ใช่เครื่องมือวัดผลงาน และใช้แทนแผนงานทั้งหมดไม่ได้", "section": ""}, {"n": 10, "q": "ในงานช่าง หากพนักงาน 'ไม่สำรวจหน้างานก่อน' จะส่งผลเสียต่อข้อใด?", "choices": ["การเบิกจ่ายค่าวัสดุของโครงการ", "ความถูกต้องและความครบถ้วนของขั้นตอนการทำงาน", "ความสัมพันธ์ระหว่างช่างกับลูกค้า", "การประเมินผลงานประจำปีของช่าง", "ต้นทุนค่าเดินทางไปหน้างาน"], "answer": 1, "explanation": "การสำรวจหน้างานทำให้ทราบสภาพจริงก่อนกำหนดขั้นตอน หากข้ามไป ขั้นตอนที่วางไว้อาจผิดหรือขาดหาย กระทบความถูกต้องและความครบถ้วนของงานโดยตรง (สมรรถนะ 4.4)", "section": ""}, {"n": 11, "q": "การจัดลำดับความสำคัญ (4.1) ควรยึดเป้าหมายใดเป็นหลัก?", "choices": ["เป้าหมายผลงานส่วนบุคคลของตนเอง", "เป้าหมายและตัวชี้วัดขององค์กร (KPI)", "ลำดับก่อน-หลังที่งานมาถึงโต๊ะ", "ความถนัดและความเชี่ยวชาญของตนเอง", "ปริมาณงานที่ทำเสร็จได้มากที่สุดในแต่ละวัน"], "answer": 1, "explanation": "การจัดลำดับความสำคัญต้องอิงเป้าหมายและตัวชี้วัดขององค์กร (KPI) เป็นหลัก ไม่ใช่เป้าหมายส่วนบุคคล ความถนัดของตน ลำดับที่งานมาถึง หรือปริมาณชิ้นงานที่ทำได้", "section": ""}, {"n": 12, "q": "เทคนิค 'Pomodoro' สอดคล้องกับสมรรถนะข้อใด?", "choices": ["การวางแผนและจัดสรรเวลาการทำงาน", "การใช้ทรัพยากรอย่างมีประสิทธิภาพ", "การตรวจสอบความถูกต้องของแผนงาน", "การจัดลำดับความสำคัญของงาน", "การมอบหมายและกระจายงานในทีม"], "answer": 0, "explanation": "Pomodoro คือเทคนิคแบ่งเวลาทำงานเป็นช่วงสั้น ๆ สลับพัก (เช่น ทำ 25 นาที พัก 5 นาที) จึงเป็นเรื่องการวางแผนและจัดสรรเวลา (4.2) ไม่ใช่การจัดลำดับงาน การใช้ทรัพยากร หรือการตรวจสอบแผน", "section": ""}, {"n": 13, "q": "การจัดสรรทรัพยากรบุคคลควรพิจารณาจากสิ่งใดเป็นอันดับแรก?", "choices": ["ความสัมพันธ์อันดีในทีมงาน", "ทักษะและความสามารถที่ตรงกับความต้องการของงาน", "ความอาวุโส", "ค่าตอบแทนที่ต่ำที่สุดเพื่อประหยัดงบประมาณ", "ความพร้อมด้านเวลาของพนักงานเป็นหลักเท่านั้น"], "answer": 1, "explanation": "หลักการจัดคนเข้างานคือ Put the right man on the right job — พิจารณาทักษะที่ตรงกับงานเป็นอันดับแรก ส่วนความอาวุโส ค่าตอบแทน หรือความพร้อมด้านเวลา เป็นปัจจัยประกอบรอง", "section": ""}, {"n": 14, "q": "ข้อใดคือความหมายของ 'การบริหารทรัพยากรอย่างมีประสิทธิภาพ'?", "choices": ["การใช้จ่ายเงินให้หมดงบ", "การใช้ทรัพยากรอย่างคุ้มค่าเพื่อให้ได้ผลลัพธ์ตามเป้าหมาย", "การสำรองทรัพยากรไว้ให้มากที่สุดเพื่อความมั่นใจ", "การใช้ทรัพยากรให้น้อยที่สุดในทุกกรณี", "การเลือกใช้แต่ทรัพยากรที่มีราคาถูกที่สุด"], "answer": 1, "explanation": "ประสิทธิภาพหมายถึงได้ผลลัพธ์ตามเป้าหมายโดยใช้ทรัพยากรอย่างคุ้มค่า ไม่ใช่การใช้ให้น้อยที่สุด เลือกแต่ของถูกที่สุด สำรองมากที่สุด หรือใช้งบให้หมด", "section": ""}, {"n": 15, "q": "การตรวจสอบแผนงานล่วงหน้าช่วยป้องกันสิ่งใดได้ดีที่สุด?", "choices": ["การทำงานซ้ำซ้อนหรือการตกหล่นขั้นตอนสำคัญ", "ความขัดแย้งเรื่องการแบ่งหน้าที่ภายในทีม", "การเปลี่ยนแปลงความต้องการของลูกค้า", "ความเหนื่อยล้าจากการทำงานต่อเนื่อง", "เหตุสุดวิสัยที่อยู่นอกเหนือการควบคุม"], "answer": 0, "explanation": "การตรวจสอบแผนล่วงหน้าช่วยจับความซ้ำซ้อนและขั้นตอนที่ตกหล่นได้ก่อนลงมือทำ ส่วนความต้องการลูกค้าที่เปลี่ยน ความเหนื่อยล้า หรือเหตุสุดวิสัย เป็นปัจจัยที่การตรวจแผนป้องกันไม่ได้", "section": ""}, {"n": 16, "q": "เมื่อเป้าหมายงานเปลี่ยนไป คุณควรจัดการตารางเวลาอย่างไร?", "choices": ["ยึดตารางเดิมไว้ก่อนเพราะผ่านการอนุมัติแล้ว", "วิเคราะห์ผลกระทบและปรับตารางเวลาให้สอดคล้องกับเป้าหมายใหม่", "ล้มตารางเดิมทั้งหมดแล้วเริ่มวางแผนใหม่ตั้งแต่ต้น", "ทำงานตามตารางเดิมให้เสร็จก่อนแล้วจึงเริ่มแผนใหม่", "รอคำสั่งอย่างเป็นทางการก่อนจึงค่อยปรับตาราง"], "answer": 1, "explanation": "เมื่อเป้าหมายเปลี่ยน ต้องวิเคราะห์ผลกระทบแล้วปรับตารางให้สอดคล้องกับเป้าหมายใหม่ ไม่ยึดตารางเดิมเพียงเพราะอนุมัติแล้ว ไม่ล้มแผนทั้งหมดโดยไม่วิเคราะห์ และไม่รอผู้อื่นแก้ให้", "section": ""}, {"n": 17, "q": "พฤติกรรมใดช่วยให้แผนงานมีความ 'ถูกต้อง' มากขึ้น?", "choices": ["ให้ผู้จัดทำแผนตรวจทานด้วยตนเองเพื่อความรวดเร็ว", "การให้ทีมช่วยกันวิพากษ์แผนและหาจุดบกพร่อง", "การทำตามแผนของปีที่แล้วทุกขั้นตอนโดยไม่เปลี่ยน", "ตัดขั้นตอนที่ซับซ้อนออกเพื่อให้แผนกระชับขึ้น", "ให้ผู้เชี่ยวชาญภายนอกจัดทำแผนแทนทั้งหมด"], "answer": 1, "explanation": "การให้ทีมร่วมกันวิพากษ์แผน (Peer Review) เปิดมุมมองหลายด้าน ช่วยพบจุดบกพร่องที่ผู้จัดทำมองข้าม ดีกว่าการตรวจเองคนเดียว คัดลอกแผนเก่า หรือตัดขั้นตอนที่ซับซ้อนทิ้ง", "section": ""}, {"n": 18, "q": "การจัดลำดับความสำคัญในเวลาเร่งด่วน ควรเลือกสิ่งใด?", "choices": ["งานที่ตนถนัดและทำเสร็จได้เร็วที่สุด", "งานที่ส่งผลกระทบต่อส่วนรวมและเป้าหมายหลัก", "งานของผู้บังคับบัญชาระดับสูงสุดเสมอ", "งานที่ใกล้เสร็จแต่ไม่สำคัญ", "งานที่มีค่าตอบแทนพิเศษ"], "answer": 1, "explanation": "ในภาวะเร่งด่วนต้องเลือกงานที่ส่งผลต่อส่วนรวมและเป้าหมายหลักก่อน ไม่ใช่งานที่ตนถนัด งานของผู้มีตำแหน่งสูงสุด งานใกล้เสร็จที่ไม่สำคัญ หรืองานที่มีค่าตอบแทนพิเศษ", "section": ""}, {"n": 19, "q": "การทำ 'Time Blocking' มีประโยชน์อย่างไร?", "choices": ["เพื่อบันทึกว่าใช้เวลาไปกับงานใดบ้างในแต่ละวัน", "เพื่อจองเวลาทำภารกิจที่สำคัญโดยไม่ให้งานอื่นแทรก", "เพื่อลดจำนวนชั่วโมงทำงานรวมในแต่ละสัปดาห์", "เพื่อบันทึกเวลาเข้า-ออกงาน", "เพื่อแบ่งงานใหญ่ออกเป็นงานย่อยหลายชิ้น"], "answer": 1, "explanation": "Time Blocking คือการกันช่วงเวลาในตารางไว้ให้ภารกิจสำคัญโดยเฉพาะ เพื่อไม่ให้งานอื่นแทรก ต่างจากการบันทึกการใช้เวลา (Time Tracking) การลงเวลาเข้างาน หรือการแบ่งงานย่อย", "section": ""}, {"n": 20, "q": "สาเหตุหลักที่ทำให้การวางแผนทรัพยากรล้มเหลวคือข้อใด?", "choices": ["การตั้งงบประมาณสำรองไว้สูงเกินความจำเป็น", "ขาดข้อมูลที่แม่นยำและการประมาณการที่ต่ำกว่าจริง", "การใช้เครื่องมือวางแผนหลายชนิดพร้อมกัน", "การประชุมติดตามความคืบหน้าบ่อยเกินไป", "มีหัวหน้างานหลายคน"], "answer": 1, "explanation": "การวางแผนทรัพยากรมักล้มเหลวจากข้อมูลที่ไม่แม่นยำและการประมาณการต่ำกว่าความเป็นจริง (Underestimation) ส่วนงบสำรองสูง เครื่องมือหลายชนิด หรือการประชุมบ่อย ไม่ใช่สาเหตุหลัก", "section": ""}, {"n": 21, "q": "หากพบว่าขั้นตอนในแผนงาน 'ข้ามลำดับที่ควรจะเป็น' คุณควรทำอย่างไร?", "choices": ["ปล่อยไว้ก่อนหากงานยังพอดำเนินต่อไปได้", "ปรับปรุงลำดับขั้นตอนให้ถูกต้องตามหลักเหตุและผล", "ตัดขั้นตอนที่สลับลำดับออกเพื่อไม่ให้สับสน", "แจ้งผู้จัดทำแผนโดยไม่แก้ไขเพราะไม่ใช่หน้าที่ของตน", "ปฏิบัติตามแผนเดิมไปก่อนเพราะผ่านการอนุมัติแล้ว"], "answer": 1, "explanation": "ขั้นตอนที่ข้ามลำดับต้องปรับแก้ให้ถูกต้องตามหลักเหตุและผลทันที (สมรรถนะ 4.4) การปล่อยไว้ ตัดทิ้ง เกี่ยงว่าไม่ใช่หน้าที่ หรือทำตามแผนที่ผิดต่อไป จะสร้างความเสียหายต่อเนื่อง", "section": ""}, {"n": 22, "q": "การจัดลำดับความสำคัญ (4.1) ช่วยในเรื่อง 'เวลา' อย่างไร?", "choices": ["ช่วยให้มีเวลาว่างระหว่างวันเพิ่มขึ้นเสมอ", "ช่วยให้ใช้เวลาที่มีจำกัดกับงานที่สร้างมูลค่าสูงสุด", "ช่วยให้ทำงานได้หลายชิ้นพร้อมกันมากขึ้น", "ทำให้ไม่จำเป็นต้องกำหนดเส้นตายของงาน", "ช่วยลดปริมาณงานที่ได้รับมอบหมายลง"], "answer": 1, "explanation": "เวลาเป็นทรัพยากรที่มีจำกัด การจัดลำดับความสำคัญช่วยให้เวลาที่มีถูกใช้กับงานที่สร้างมูลค่าสูงสุดก่อน ไม่ได้ทำให้ทำงานหลายชิ้นพร้อมกันได้ ลดปริมาณงาน หรือยกเลิกเส้นตาย", "section": ""}, {"n": 23, "q": "หากคุณได้ทรัพยากรที่มีคุณภาพดีกว่าเดิม แผนงานควรเปลี่ยนอย่างไร?", "choices": ["ใช้ของเดิมให้หมดก่อน", "ปรับแผนเพื่อนำของใหม่มาเพิ่มคุณภาพหรืองดขั้นตอนที่ไม่จำเป็น", "เก็บของใหม่ไว้เป็นทรัพยากรสำรองยามฉุกเฉิน", "ใช้ของใหม่ตามแผนเดิมทุกขั้นตอนโดยไม่ปรับสิ่งใด", "ส่งคืนของใหม่เพราะแผนงานเดิมกำหนดคุณสมบัติวัสดุไว้แล้ว"], "answer": 1, "explanation": "เมื่อได้ทรัพยากรที่ดีกว่าเดิม ควรทบทวนแผนเพื่อใช้ประโยชน์สูงสุด เช่น ยกระดับคุณภาพหรือลดขั้นตอนที่ไม่จำเป็น การใช้ของเดิมให้หมดก่อนหรือเก็บของใหม่ไว้เฉย ๆ คือการเสียโอกาส", "section": ""}, {"n": 24, "q": "ข้อใดคือการตรวจสอบความ 'ครบถ้วน' ของแผนงาน?", "choices": ["แผนงานผ่านการอนุมัติจากผู้บริหารแล้ว", "ทุกเป้าหมายมีขั้นตอนรองรับและมีตัวชี้วัดชัดเจน", "แผนงานเขียนรายละเอียดไว้ยาวครอบคลุมหลายหัวข้อ", "มีผู้เกี่ยวข้องลงนามรับทราบครบทุกฝ่าย", "ผู้จัดทำมีประสบการณ์สูงจึงเชื่อได้ว่าครบถ้วน"], "answer": 1, "explanation": "ความครบถ้วนของแผนดูจากเนื้อหา คือทุกเป้าหมายมีขั้นตอนรองรับและมีตัวชี้วัดชัดเจน ความยาวของเอกสาร การอนุมัติ ลายเซ็น หรือประสบการณ์ผู้จัดทำ ไม่ได้รับประกันความครบถ้วน", "section": ""}, {"n": 25, "q": "ความเร่งด่วน (Urgency) มักถูกกำหนดโดยปัจจัยใด?", "choices": ["ปริมาณทรัพยากรที่ต้องใช้ในงาน", "เงื่อนไขเวลาและข้อตกลงกับลูกค้า/หัวหน้า", "มูลค่าผลตอบแทนที่จะได้รับจากงาน", "ความยากของงาน", "ความพร้อมของทีมงานที่รับผิดชอบ"], "answer": 1, "explanation": "ความเร่งด่วนถูกกำหนดโดยเงื่อนไขเวลาและข้อตกลงที่ให้ไว้กับลูกค้าหรือผู้บังคับบัญชา ส่วนมูลค่างาน ความยาก ทรัพยากร หรือความพร้อมของทีม เป็นเรื่องความสำคัญและความซับซ้อนของงาน", "section": ""}, {"n": 26, "q": "การจัดการทรัพยากรที่มีจำกัดให้สำเร็จ ต้องใช้ทักษะใด?", "choices": ["ทักษะการสื่อสารและการนำเสนองาน", "การวิเคราะห์ความคุ้มค่าและการแก้ปัญหาเฉพาะหน้า", "การเจรจาขอเพิ่มงบประมาณเป็นหลัก", "การกันทรัพยากรไว้สำหรับงานของตนก่อนเสมอ", "การปฏิบัติตามแผนเดิมอย่างเคร่งครัดในทุกสถานการณ์"], "answer": 1, "explanation": "การจัดการทรัพยากรที่จำกัดต้องใช้การวิเคราะห์ความคุ้มค่าและการแก้ปัญหาเฉพาะหน้า การพึ่งการขอเพิ่มงบเพียงอย่างเดียว หรือยึดแผนเดิมตายตัวทุกสถานการณ์ ไม่ใช่ทักษะการบริหารที่ดี", "section": ""}, {"n": 27, "q": "เหตุใดแผนงานควรมี 'เวลาพัก' แทรกอยู่?", "choices": ["เพื่อให้พนักงานมีเวลาทำธุระส่วนตัวระหว่างวัน", "เพื่อรักษาประสิทธิภาพการทำงานให้สม่ำเสมอและลดความผิดพลาด", "เพื่อใช้เป็นเวลาสำรองไว้เร่งงานเมื่อใกล้กำหนดส่ง", "เพื่อให้พนักงานแลกเปลี่ยนข้อมูลงานอย่างไม่เป็นทางการ", "เพื่อลดค่าล่วงเวลา"], "answer": 1, "explanation": "เวลาพักช่วยฟื้นสมาธิและพลังงาน ทำให้ประสิทธิภาพสม่ำเสมอและลดความผิดพลาดจากความล้า เวลาพักไม่ใช่เวลาสำรองของงาน (Buffer Time) ซึ่งเป็นคนละส่วนกันในแผน", "section": ""}, {"n": 28, "q": "หากแผนงานระบุเวลา 'น้อยจนเป็นไปไม่ได้' คุณควรทำอย่างไร?", "choices": ["พยายามทำให้ทันตามแผนเดิมเพื่อรักษาคำมั่นที่ให้ไว้", "ปรับแผนและเพิ่มเวลาให้สอดคล้องกับความจริง", "เริ่มปฏิบัติงานไปก่อนแล้วค่อยแก้ปัญหาเมื่อถึงเวลานั้น", "ตัดขั้นตอนบางส่วนออกเพื่อให้ทันเวลาที่แผนระบุ", "ส่งต่องานให้ผู้ที่ทำงานเร็วกว่ารับผิดชอบแทน"], "answer": 1, "explanation": "แผนที่ระบุเวลาน้อยจนเป็นไปไม่ได้คือแผนที่ผิด ต้องแก้ที่ตัวแผนโดยปรับเวลาให้สอดคล้องความจริง ไม่ฝืนทำ ไม่ตัดขั้นตอน และไม่เริ่มงานทั้งที่รู้ว่าแผนมีปัญหา", "section": ""}, {"n": 29, "q": "พฤติกรรมใดแสดงถึงความ 'ครบถ้วน' ในการจัดตารางเวลา?", "choices": ["ระบุแค่วันเริ่มและจบ", "ระบุขั้นตอนย่อย ระยะเวลา และผู้รับผิดชอบชัดเจน", "จัดรูปแบบตารางให้อ่านง่ายและเป็นระเบียบ", "ระบุเฉพาะงานหลัก ส่วนงานย่อยให้ผู้ปฏิบัติจดจำเอง", "มีผู้อนุมัติตารางลงนามครบถ้วนทุกระดับ"], "answer": 1, "explanation": "ตารางเวลาที่ครบถ้วนต้องระบุขั้นตอนย่อย ระยะเวลา และผู้รับผิดชอบให้ชัดเจน จึงติดตามและควบคุมงานได้จริง รูปแบบที่สวยงามหรือการลงนามอนุมัติครบ ไม่ได้แปลว่าเนื้อหาครบ", "section": ""}, {"n": 30, "q": "เป้าหมายสุดท้ายของการวางแผนและจัดตารางเวลาคือข้อใด?", "choices": ["มีแผนงานที่ละเอียดครบถ้วนไว้ใช้อ้างอิง", "งานสำเร็จตามเป้าหมาย มีคุณภาพ คุ้มค่า และตรงเวลา", "ภาระงานโดยรวมของพนักงานลดลง", "องค์กรมีภาพลักษณ์ความเป็นมืออาชีพ", "ผู้วางแผนได้รับความไว้วางใจจากผู้บริหารมากขึ้น"], "answer": 1, "explanation": "เป้าหมายสุดท้ายของการวางแผนคือให้งานสำเร็จตามเป้าหมาย มีคุณภาพ คุ้มค่า และตรงเวลา ส่วนเอกสารแผน ภาพลักษณ์ หรือความไว้วางใจที่ได้รับ เป็นเพียงเครื่องมือหรือผลพลอยได้", "section": ""}, {"n": 31, "q": "ท่านมีงาน 3 ชิ้น: งาน A รายงานที่ต้องส่งลูกค้าพรุ่งนี้เช้า งาน B ตอบแบบสอบถามภายในที่ถูกทวงว่าด่วนแต่ไม่กระทบงานหลัก และงาน C ปรับปรุงฐานข้อมูลลูกค้าซึ่งสำคัญแต่ยังไม่มีกำหนดส่ง ท่านควรจัดการอย่างไรจึงเหมาะสมที่สุด?", "choices": ["ทำงาน B ก่อนเพราะถูกทวงถามบ่อยที่สุด", "ทำงาน C ก่อนเพราะใช้เวลานานที่สุด", "ทำงาน A ก่อน จัดการงาน B ให้จบเร็วหรือมอบหมายผู้อื่น และกำหนดเวลาในตารางไว้ทำงาน C", "สลับทำทั้งสามงานทีละน้อยเพื่อให้ทุกงานคืบหน้าพร้อมกัน", "เลื่อนงาน A ออกไปก่อนเพราะงาน B เร่งด่วนกว่า"], "answer": 2, "explanation": "งาน A สำคัญและเร่งด่วนต้องทำก่อน งาน B เร่งด่วนแต่ไม่สำคัญจึงควรจัดการให้จบเร็วหรือมอบหมาย ส่วนงาน C สำคัญแต่ไม่เร่งด่วนต้องจองเวลาไว้ล่วงหน้าเพื่อไม่ให้ถูกลืม", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 32, "q": "หากใช้ \"ความเร่งด่วน\" เป็นเกณฑ์เดียวในการเลือกทำงานทุกวัน ผลเสียที่มักเกิดขึ้นคือข้อใด?", "choices": ["งานสำคัญที่ยังไม่เร่งด่วนถูกเลื่อนไปเรื่อย ๆ จนกลายเป็นวิกฤตในภายหลัง", "งานทุกชิ้นจะเสร็จเร็วขึ้นเพราะถูกกดดันด้วยเวลา", "ทีมงานจะมีวินัยในการทำงานมากขึ้นโดยอัตโนมัติ", "ไม่มีผลเสีย เพราะงานที่ด่วนคืองานที่สำคัญเสมอ", "งานที่ไม่สำคัญจะถูกคัดออกจากตารางไปเอง"], "answer": 0, "explanation": "งานเร่งด่วนไม่ได้แปลว่าสำคัญเสมอไป การวิ่งตามแต่ความด่วนทำให้งานสำคัญเชิงป้องกันถูกละเลย จนสะสมกลายเป็นวิกฤตที่ต้องตามแก้ภายหลัง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 33, "q": "ขณะท่านกำลังทำงานสำคัญที่ต้องส่งเย็นนี้ หัวหน้าสั่งงานแทรกมาโดยบอกว่า \"ด่วนมาก\" ท่านควรทำอย่างไรจึงเหมาะสมที่สุด?", "choices": ["รับงานแทรกมาทำทันทีโดยไม่สอบถามรายละเอียด เพราะเป็นคำสั่งหัวหน้า", "ปฏิเสธงานแทรกทันทีเพราะมีงานเดิมอยู่แล้ว", "ทำงานเดิมต่อเงียบ ๆ โดยไม่แจ้งว่ายังไม่ได้เริ่มงานแทรก", "สลับทำทั้งสองงานพร้อมกันทีละนิดเพื่อให้ดูว่ารับผิดชอบทั้งคู่", "แจ้งหัวหน้าว่ามีงานที่ต้องส่งเย็นนี้ พร้อมข้อมูลผลกระทบ และให้หัวหน้าร่วมตัดสินใจลำดับความสำคัญ"], "answer": 4, "explanation": "เมื่อเกิด deadline ขัดแย้งกัน ต้องเปิดเผยข้อมูลให้ผู้มีอำนาจตัดสินใจเห็นผลกระทบทั้งสองทาง ไม่รับปากทั้งที่ทำไม่ได้ และไม่ตัดสินใจแทนโดยพลการ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 34, "q": "ท่านมีงานเร่งด่วนแต่ไม่สำคัญจำนวนมาก เช่น รับสายสอบถามทั่วไปและจัดเอกสารแจกเวียน จนกินเวลางานหลัก ตามหลัก Eisenhower ท่านควรจัดการอย่างไร?", "choices": ["ทำเองทั้งหมดก่อนเพราะเป็นงานด่วน", "มอบหมายให้ผู้อื่นทำหรือสร้างระบบรองรับ แล้วใช้เวลาของตนกับงานสำคัญ", "เลื่อนงานเหล่านี้ทั้งหมดไปไว้ท้ายสัปดาห์", "ตัดงานเหล่านี้ทิ้งทั้งหมดโดยไม่แจ้งใคร", "รวบไว้ทำช่วงใกล้เลิกงานทุกวันแม้บางเรื่องจะเลยกำหนด"], "answer": 1, "explanation": "งานเร่งด่วนแต่ไม่สำคัญควรใช้วิธีมอบหมายหรือหาระบบจัดการแทน เพื่อสงวนเวลาของตนไว้กับงานที่ส่งผลต่อเป้าหมายหลัก", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 35, "q": "ช่างซ่อมบำรุงพบงาน 4 รายการพร้อมกัน: เปลี่ยนหลอดไฟห้องประชุมที่ค้างมานาน บำรุงรักษาตามแผนของสัปดาห์หน้า เพื่อนขอให้ช่วยหาเอกสารที่บอกว่าด่วน และเครื่องจักรไลน์ผลิตหลักหยุดทำงาน ท่านควรทำงานใดก่อน?", "choices": ["เปลี่ยนหลอดไฟห้องประชุมเพราะค้างมานานที่สุด", "ทำบำรุงรักษาตามแผนก่อนเพราะเป็นงานในแผน", "ช่วยเพื่อนหาเอกสารก่อนเพราะถูกร้องขอว่าด่วน", "ซ่อมเครื่องจักรไลน์ผลิตหลักที่หยุดทำงาน", "เลือกทำงานที่ใช้เวลาน้อยที่สุดก่อนเพื่อลดจำนวนงานค้าง"], "answer": 3, "explanation": "เครื่องจักรไลน์ผลิตหลักหยุดคืองานทั้งสำคัญและเร่งด่วน เพราะกระทบการผลิตโดยตรงทุกนาที จึงต้องมาก่อนงานตามแผนและงานด่วนที่ไม่สำคัญ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 36, "q": "งานประเภท \"ไม่สำคัญและไม่เร่งด่วน\" เช่น การตกแต่งสไลด์เกินความจำเป็น หรือเปิดดูโซเชียลระหว่างงาน ควรจัดการอย่างไร?", "choices": ["ตัดออกหรือลดเวลาให้เหลือน้อยที่สุด", "จัดไว้ทำเป็นอันดับแรกเพื่อให้หมดกังวล", "มอบหมายให้เพื่อนร่วมงานทำแทน", "กำหนดเวลาทำอย่างจริงจังในทุกตาราง", "เก็บไว้ทำเมื่องานสำคัญล่าช้าเพื่อเปลี่ยนบรรยากาศ"], "answer": 0, "explanation": "งานที่ไม่สำคัญและไม่เร่งด่วนไม่สร้างคุณค่าต่อเป้าหมาย จึงควรตัดออกหรือจำกัดเวลาให้น้อยที่สุด ไม่ใช่มอบหมายต่อให้เปลืองเวลาผู้อื่น", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 37, "q": "ท่านมีงานสำคัญ 2 ชิ้นที่กำหนดส่งวันเดียวกัน และประเมินแล้วว่าทำคนเดียวไม่ทันแน่นอน ท่านควรทำอย่างไรจึงเหมาะสมที่สุด?", "choices": ["เลือกทำงานที่ตนถนัดและชอบมากกว่าก่อน", "ฝืนทำทั้งสองงานแบบเร่งรีบเพื่อให้เสร็จตามกำหนดแม้คุณภาพจะตก", "ประเมินผลกระทบของแต่ละงาน แล้วรีบเจรจาขอเลื่อนงานที่กระทบน้อยกว่า หรือขอกำลังเสริมตั้งแต่เนิ่น ๆ", "รอให้ถึงวันส่งแล้วค่อยแจ้งว่าทำไม่ทันทั้งสองงาน", "เลือกทำงานของหัวหน้าที่เข้มงวดกว่าเพื่อลดแรงกดดัน"], "answer": 2, "explanation": "เมื่อกำหนดส่งชนกันและกำลังไม่พอ ต้องตัดสินด้วยผลกระท ามสัมพันธ์", "ให้รายที่โทรมาทวงบ่อยกว่าได้ทำก่อน", "ให้รายที่พูดเสียงแข็งกว่าได้ทำก่อนเพื่อลดความขัดแย้ง", "สลับทำวันละครึ่งวันทั้งสองงานเท่า ๆ กันโดยไม่ดูกำหนดส่ง", "ประเมินด้วยข้อมูลจริง เช่น กำหนดส่งตามสัญญา ค่าปรับ และผลกระทบ แล้วจัดลำดับพร้อมแจ้งทั้งสองรายอย่างโปร่งใส"], "answer": 4, "explanation": "เมื่อทรัพยากรจำกัด ต้องตัดสินด้วยข้อมูลเชิงวัตถุ ไม่ใช่แรงกดดัน และการรับปากทั้งคู่ทั้งที่ทำไม่ได้จะทำให้เสียความเชื่อถือทั้งสองราย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 42, "q": "ท่านพบว่าการแจ้งเตือนอีเมลและแชทที่เด้งตลอดวันทำให้งานสำคัญไม่คืบหน้า วิธีแก้ที่เหมาะสมที่สุดคือข้อใด?", "choices": ["ตอบทุกข้อความทันทีที่เด้งเพื่อไม่ให้ค้าง", "ปิดอีเมลและแชททั้งวันโดยไม่แจ้งใครเลย", "กำหนดรอบเวลาตรวจตอบข้อความเป็นช่วง ๆ และปิดการแจ้งเตือนระหว่างช่วงทำงานที่ต้องใช้สมาธิ", "ลาออกจากกลุ่มแชทงานทั้งหมด", "ทำงานสำคัญเฉพาะหลังเลิกงานที่ไม่มีข้อความรบกวน"], "answer": 2, "explanation": "การจัดรอบตอบข้อความช่วยรักษาช่วงสมาธิต่อเนื่องสำหรับงานสำคัญ โดยยังตอบสนองผู้อื่นได้ในเวลาที่เหมาะสม ต่างจากการปิดรับทั้งหมดหรือปล่อยให้ถูกขัดจังหวะตลอดวัน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 43, "q": "แผนงานที่ครบถ้วนพร้อมนำไปปฏิบัติจริง อย่างน้อยต้องระบุองค์ประกอบตามข้อใด?", "choices": ["ขั้นตอนย่อย ระยะเวลาของแต่ละขั้น ผู้รับผิดชอบ และทรัพยากรที่ต้องใช้", "ชื่อโครงการ งบประมาณรวม และรายชื่อผู้บริหารที่อนุมัติ", "เป้าหมายปลายทางเพียงอย่างเดียวเพื่อให้ทีมมีอิสระ", "ตารางวันหยุดของทีมและสถานที่ทำงาน", "รายละเอียดค่าตอบแทนของสมาชิกทุกคน"], "answer": 0, "explanation": "แผนที่ใช้ได้จริงต้องตอบให้ได้ว่าทำอะไร ใช้เวลาเท่าไร ใครทำ และใช้อะไรทำ หากขาดข้อใดข้อหนึ่งจะเกิดช่องว่างเมื่อลงมือปฏิบัติ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 44, "q": "ท่านได้รับมอบหมายให้จัดสัมมนาผู้เข้าร่วม 200 คนภายใน 6 สัปดาห์ ขั้นตอนแรกที่ควรทำคือข้อใด?", "choices": ["ลงมือทำทันทีโดยไม่ต้องวางแผนเพราะเวลามีน้อย", "เริ่มจากงานที่ตนถนัดที่สุดก่อนเพื่อสร้างความคืบหน้า", "รอหัวหน้าสั่งการเป็นขั้น ๆ เพื่อไม่ให้ตัดสินใจผิด", "แตกงานใหญ่เป็นงานย่อย ประเมินเวลาแต่ละงาน และระบุงานที่ต้องทำก่อน-หลัง", "ประกาศเชิญผู้เข้าร่วมก่อนเพื่อกดดันให้ทีมต้องทำให้ทัน"], "answer": 3, "explanation": "งานใหญ่ต้องถูกแตกเป็นงานย่อยพร้อมเวลาและลำดับก่อน-หลังก่อน จึงจะเห็นว่างานใดวิกฤตและต้องเริ่มเมื่อใด การลงมือทันทีโดยไม่มีโครงแผนทำให้ตกหล่นและย้อนแก้ทีหลัง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 45, "q": "แผนงานฉบับหนึ่งระบุขั้นตอนและเวลาครบ แต่ไม่ระบุผู้รับผิดชอบรายกิจกรรม ความเสี่ยงที่ตามมาคือข้อใด?", "choices": ["งานจะเสร็จเร็วขึ้นเพราะทุกคนช่วยกันทำได้อิสระ", "งานบางขั้นตอนตกหล่นเพราะต่างคนต่างคิดว่าอีกฝ่ายเป็นคนทำ", "งบประมาณจะบานปลายทันที", "ทีมจะขัดแย้งกันเรื่องค่าตอบแทน", "ไม่มีความเสี่ยง เพราะหัวหน้าจะสั่งการหน้างานได้อยู่แล้ว"], "answer": 1, "explanation": "งานที่ไม่มีเจ้าภาพชัดเจนคืองานที่ไม่มีใครทำ การระบุผู้รับผิดชอบทำให้ติดตามได้และไม่เกิดการโยนงานกันไปมา", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 46, "q": "ท่านต้องประเมินระยะเวลาของงานที่ทีมไม่เคยทำมาก่อน วิธีที่เหมาะสมที่สุดคือข้อใด?", "choices": ["กำหนดตัวเลขกลม ๆ ไปก่อนแล้วค่อยแก้ทีหลัง", "ใช้เวลาน้อยที่สุดเท่าที่คิดว่าเป็นไปได้เพื่อให้แผนดูดี", "เทียบกับข้อมูลงานลักษณะใกล้เคียง สอบถามผู้มีประสบการณ์ และเผื่อเวลาสำหรับความไม่แน่นอน", "ให้แต่ละคนประเมินเองแล้วเลือกตัวเลขที่ต่ำที่สุด", "ไม่ต้องประเมิน ปล่อยให้งานจบเมื่อไรก็เมื่อนั้น"], "answer": 2, "explanation": "งานที่ไม่มีประสบการณ์ตรงต้องอาศัยข้อมูลเทียบเคียงและผู้รู้ พร้อมเผื่อความไม่แน่นอน การเลือกตัวเลขต่ำสุดหรือกลม ๆ ทำให้แผนคลาดเคลื่อนตั้งแต่ต้น", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 47, "q": "โรงงานมีห้องพ่นสีเพียงห้องเดียว แต่โครงการ 2 โครงการมีแผนต้องใช้ห้องพ่นสีในสัปดาห์เดียวกัน ควรจัดการอย่างไรตั้งแต่ขั้นวางแผน?", "choices": ["ให้สองทีมมาแย่งกันใช้ตามหลักใครมาก่อนได้ก่อน", "ตัดขั้นตอนพ่นสีของโครงการหนึ่งออกเพื่อไม่ให้ชนกัน", "ปล่อยไว้ก่อน เพราะปัญหาอาจไม่เกิดขึ้นจริง", "เช่าห้องพ่นสีเพิ่มทันทีโดยไม่ประเมินค่าใช้จ่ายและความจำเป็น", "จัดตารางการใช้ทรัพยากรร่วมตั้งแต่ขั้นวางแผน โดยเลื่อนลำดับงานของแต่ละโครงการให้ใช้ห้องคนละช่วงเวลา"], "answer": 4, "explanation": "ทรัพยากรจำกัดที่ต้องใช้ร่วมกันต้องถูกจัดสรรในขั้นวางแผน ไม่ใช่ปล่อยให้ชนกันหน้างาน การเลื่อนลำดับงานย่อยให้สลับช่วงเวลาคือทางแก้ที่ต้นทุนต่ำที่สุด", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 48, "q": "ในงานก่อสร้าง งานเทปูนจะเริ่มได้ต่อเมื่องานประกอบโครงเหล็กเสร็จก่อน การวางแผนที่ถูกต้องคือข้อใด?", "choices": ["ระบุความสัมพันธ์ก่อน-หลังของงานทั้งสองไว้ในแผน แล้วเรียงตารางตามลำดับนั้น", "จัดสองงานทำพร้อมกันเพื่อประหยัดเวลา", "สลับให้เทปูนก่อนเพราะใช้เวลาน้อยกว่า", "วางสองงานไว้ในตารางโดยไม่ต้องสนใจลำดับ เพราะหน้างานจะจัดการเอง", "ตัดงานโครงเหล็กออกเพื่อให้แผนสั้นลง"], "answer": 0, "explanation": "งานที่มีเงื่อนไขต้องทำก่อน-หลัง (dependency) ต้องถูกระบุในแผนอย่างชัดเจน มิฉะนั้นตารางจะเป็นไปไม่ได้จริงและเกิดการรองานหน้างาน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 49, "q": "หัวหน้างานเขียนแผนโครงการ 3 เดือนโดยระบุกิจกรรมละเอียดถึงระดับนาทีทุกวัน ข้อเสียหลักของแผนลักษณะนี้คือข้อใด?", "choices": ["ทีมงานจะทำงานเร็วเกินไปจนคุณภาพตก", "แผนจะสั้นเกินไปจนขาดรายละเอียด", "ผู้บริหารจะไม่อนุมัติเพราะเอกสารหนาเกินไป", "ปรับตามสถานการณ์จริงได้ยากและต้องเสียเวลาแก้แผนบ่อยครั้ง ควรละเอียดมากเฉพาะช่วงเวลาใกล้ตัว", "ไม่มีข้อเสีย เพราะแผนยิ่งละเอียดยิ่งดีเสมอ"], "answer": 3, "explanation": "แผนระยะยาวที่ละเอียดเกินจำเป็นจะล้าสมัยทันทีเมื่อสถานการณ์เปลี่ยน หลักที่ดีคือละเอียดในช่วงใกล้และหยาบขึ้นในช่วงไกล แล้วค่อยเติมรายละเอียดเมื่อใกล้ถึง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 50, "q": "ผู้วางแผนคนหนึ่งกำหนดเวลาทุกขั้นตอนโดยใช้สถิติ \"เวลาที่เร็วที่สุดที่ทีมเคยทำได้\" ปัญหาของวิธีนี้คือข้อใด?", "choices": ["แผนจะยาวเกินความจำเป็นจนลูกค้าไม่พอใจ", "แผนมองโลกในแง่ดีเกินไป โอกาสล่าช้าสูงเพราะทุกขั้นตอนห้ามผิดพลาดเลยแม้แต่ครั้งเดียว", "ทีมจะทำงานสบายเกินไปเพราะเวลาเหลือเฟือ", "เป็นวิธีที่ถูกต้อง เพราะแสดงศักยภาพสูงสุดของทีม", "ทำให้คำนวณต้นทุนไม่ได้"], "answer": 1, "explanation": "เวลาที่เร็วที่สุดคือกรณีที่ทุกอย่างสมบูรณ์แบบซึ่งแทบไม่เกิดขึ้นจริง แผนที่อิงค่านี้ทั้งเส้นจึงพังทันทีที่มีเหตุติดขัดเพียงจุดเดียว", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 51, "q": "เมื่อจัดทำแผนงานเสร็จแล้ว สิ่งที่ควรทำก่อนเริ่มลงมือปฏิบัติคือข้อใด?", "choices": ["สื่อสารแผนให้ผู้เกี่ยวข้องทุกคนเข้าใจบทบาท กำหนดเวลา และจุดส่งมอบของตน", "เก็บแผนไว้เป็นความลับเพื่อป้องกันการลอกเลียน", "เริ่มงานทันทีแล้วค่อยแจกแผนเมื่อมีคนถาม", "ส่งแผนให้เฉพาะหัวหน้าเก็บไว้อ้างอิง", "แก้ไขแผนอีกหลายรอบจนมั่นใจว่าสมบูรณ์แบบก่อนบอกใคร"], "answer": 0, "explanation": "แผนที่ทีมไม่รู้เท่ากับไม่มีแผน การสื่อสารก่อนเริ่มทำให้ทุกคนรู้หน้าที่และกำหนดเวลาของตน และยังเปิดโอกาสให้ทักท้วงจุดที่ไม่สมจริงก่อนลงมือ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 52, "q": "งานซ่อมเครื่องยนต์ต้องส่งมอบภายใน 5 วัน ประกอบด้วย สั่งอะไหล่ (รอของ 3 วัน) ถอดตรวจสภาพ (1 วัน) และประกอบทดสอบ (1 วัน) ควรจัดลำดับอย่างไร?", "choices": ["ถอดตรวจสภาพให้เสร็จก่อนแล้วค่อยสั่งอะไหล่เพื่อความแน่นอนที่สุด", "ประกอบทดสอบก่อนเพื่อดูว่าเครื่องมีปัญหาจริงหรือไม่", "ทำตามลำดับใดก็ได้เพราะเวลารวมเท่ากัน", "สั่งอะไหล่เป็นอย่างแรกเพราะมีเวลารอนาน แล้วใช้ช่วงรอของทำงานถอดตรวจคู่ขนานกันไป", "ขอเลื่อนกำหนดส่งเป็น 7 วันก่อนเริ่มงาน"], "answer": 3, "explanation": "งานที่มีเวลารอ (lead time) นานต้องเริ่มก่อน แล้วใช้ช่วงรอทำงานอื่นคู่ขนาน ทำให้ 3+1+1 วันซ้อนกันจบใน 5 วันได้ หากรอถอดตรวจเสร็จค่อยสั่งของจะกลายเป็น 1+3+1 ชนกำหนดพอดีโดยไม่มีเวลาเผื่อเลย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 53, "q": "โครงการหนึ่งล่าช้าเพราะเพิ่งพบภายหลังว่าแผนไม่ได้รวมขั้นตอนขออนุมัติซึ่งใช้เวลา 5 วันทำการ บทเรียนที่ถูกต้องคือข้อใด?", "choices": ["ครั้งหน้าไม่ต้องขออนุมัติเพื่อให้งานเร็วขึ้น", "โทษหน่วยงานที่อนุมัติช้าว่าเป็นต้นเหตุความล่าช้า", "ก่อนยืนยันแผน ต้องทบทวนความครบถ้วนของขั้นตอนกับผู้เกี่ยวข้องทุกฝ่าย รวมถึงขั้นตอนรอคอยที่มองไม่เห็น", "เพิ่มเวลาเผื่อท้ายโครงการอีก 1 เดือนทุกครั้งโดยไม่ต้องหาสาเหตุ", "ทำแผนสั้นลงเพื่อให้มีขั้นตอนน้อยลง"], "answer": 2, "explanation": "ความล่าช้าเกิดจากแผนไม่ครบถ้วน ไม่ใช่จากขั้นตอนอนุมัติ การตรวจทานแผนร่วมกับผู้เกี่ยวข้องช่วยดักขั้นตอนแฝงอย่างงานเอกสารและเวลารอคอยก่อนที่จะสายเกินไป", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 54, "q": "ในการมอบหมายผู้รับผิดชอบงานแต่ละขั้นตอนของแผน ควรพิจารณาจากข้อใดเป็นหลัก?", "choices": ["เลือกคนที่ว่างที่สุดเสมอไม่ว่างานจะเป็นอะไร", "เลือกคนที่สนิทกับผู้วางแผนเพื่อสั่งงานง่าย", "แบ่งจำนวนงานให้เท่ากันทุกคนโดยไม่ดูลักษณะงาน", "มอบงานสำคัญทั้งหมดให้คนเก่งที่สุดเพียงคนเดียว", "พิจารณาทั้งทักษะที่ตรงกับงานและภาระงานปัจจุบันของแต่ละคนประกอบกัน"], "answer": 4, "explanation": "การมอบหมายที่ดีต้องดูทั้งความสามารถและภาระที่มีอยู่ การทุ่มงานให้คนเก่งคนเดียวสร้างคอขวดและความเสี่ยงหากคนนั้นไม่ว่างหรือลาป่วย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 55, "q": "เหตุผลหลักของการเผื่อเวลาสำรอง (buffer) ไว้ในตารางงานคือข้อใด?", "choices": ["เพื่อให้ทำงานช้าลงได้โดยไม่ถูกตำหนิ", "เพื่อรองรับเหตุไม่คาดคิดและงานแทรก โดยไม่ทำให้กำหนดส่งโดยรวมต้องเลื่อน", "เพื่อให้ตัวเลขในแผนดูปลอดภัยต่อตัวผู้จัดทำแผนเอง", "เพื่อให้มีเวลาพักระหว่างงานมากขึ้น", "เพื่อลดปริมาณงานที่ต้องทำในแต่ละวัน"], "answer": 1, "explanation": "Buffer คือกันชนที่ดูดซับความไม่แน่นอน เช่น งานแทรก อุปกรณ์เสีย หรือการประเมินพลาด เพื่อปกป้องกำหนดส่งปลายทาง ไม่ใช่ข้ออ้างสำหรับการทำงานช้า", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 56, "q": "ผู้จัดการสั่งตัดเวลาสำรองออกจากตารางทั้งหมด เพื่อให้กำหนดการดูสั้นและน่าพอใจต่อลูกค้า ผลที่มักตามมาคือข้อใด?", "choices": ["โครงการจะเสร็จเร็วขึ้นตามตารางใหม่", "ลูกค้าจะพอใจตลอดโครงการเพราะเห็นตัวเลขที่ดี", "ทีมจะทำงานรอบคอบขึ้นเพราะรู้ว่าไม่มีเวลาเผื่อ", "ความล่าช้าเล็กน้อยเพียงจุดเดียวจะลามกระทบทุกงานถัดไปจนเลยกำหนดส่งจริง", "ไม่มีผลใด ๆ เพราะเวลาสำรองเป็นแค่ตัวเลขบนกระดาษ"], "answer": 3, "explanation": "ตารางที่ไม่มีกันชนจะเปราะบาง ความคลาดเคลื่อนเล็กน้อยจะส่งต่อเป็นลูกโซ่ทั้งเส้น ตารางที่ดูสั้นบนกระดาษจึงมักกลายเป็นการส่งมอบที่ช้ากว่าจริงและเสียความเชื่อถือมากกว่า", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 57, "q": "การวางตำแหน่งเวลาสำรองในตารางโครงการ ควรทำอย่างไรจึงเหมาะสมที่สุด?", "choices": ["วางไว้ที่ขั้นตอนที่มีความไม่แน่นอนสูงและช่วงท้ายก่อนจุดส่งมอบสำคัญ", "บวกเวลาเพิ่มเท่ากันทุกขั้นตอนขั้นละหนึ่งเท่าตัว", "ไม่จำเป็นต้องมีหากวางแผนอย่างละเอียดเพียงพอ", "ใส่ไว้ต้นโครงการทั้งหมดเพราะช่วงเริ่มต้นมักล่าช้า", "กระจายแบบสุ่มเพื่อให้ไม่มีใครคาดเดาได้"], "answer": 0, "explanation": "Buffer ควรอยู่ตรงจุดที่เสี่ยงจริงและหน้าจุดส่งมอบสำคัญ เพื่อให้ดูดซับความล่าช้าได้ตรงจุด การบวกเผื่อทุกขั้นเท่า ๆ กันทำให้ตารางยาวเกินจำเป็นและเวลาเผื่อถูกใช้ทิ้งโดยเปล่าประโยชน์", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 58, "q": "ท่านมีงานเอกสารสำคัญที่ต้องใช้สมาธิต่อเนื่อง 3 ชั่วโมง และมีงานจุกจิก เช่น ตอบอีเมล เซ็นเอกสาร กระจายอยู่ทั้งวัน ควรจัดตารางอย่างไร?", "choices": ["ทำงานจุกจิกให้หมดก่อนแล้วค่อยเริ่มงานเอกสารตอนบ่ายแก่ ๆ", "สลับทำงานเอกสารกับงานจุกจิกทุก 15 นาทีให้ทั่วถึง", "ทำงานเอกสารเฉพาะเวลาที่มีคนมาทวง", "ยกงานเอกสารไปทำที่บ้านหลังเลิกงานทุกวัน", "บล็อกช่วงเวลาที่สมาธิดีที่สุดต่อเนื่องให้งานเอกสาร และรวบงานจุกจิกไว้จัดการเป็นช่วงสั้น ๆ ระหว่างวัน"], "answer": 4, "explanation": "งานที่ต้องใช้สมาธิลึกต้องการช่วงเวลาต่อเนื่องไม่ถูกขัดจังหวะ ส่วนงานจุกจิกควรรวบเป็นก้อนเพื่อลดต้นทุนการสลับงาน การสลับถี่ ๆ ทำให้งานยากไม่คืบหน้าเลย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 59, "q": "พนักงานคนหนึ่งจัดตารางงานแน่นเต็ม 100% ทุกชั่วโมงตั้งแต่เช้าถึงเย็น ปัญหาที่จะเกิดขึ้นคือข้อใด?", "choices": ["จะถูกมองว่าขยันเกินไปจนเพื่อนร่วมงานอึดอัด", "งานทุกชิ้นจะเสร็จเร็วกว่ากำหนดจนไม่มีอะไรทำ", "งานแทรกเพียงเรื่องเดียวจะทำให้งานทั้งวันเลื่อนต่อเนื่องเป็นลูกโซ่", "หัวหน้าจะเพิ่มงานให้อีกเพราะเห็นว่าตารางลงตัว", "ไม่มีปัญหา เพราะการใช้เวลาเต็มที่คือประสิทธิภาพสูงสุด"], "answer": 2, "explanation": "ตารางที่ไม่มีช่องว่างเลยรองรับความไม่แน่นอนไม่ได้ ในชีวิตจริงมีงานแทรกและเหตุขัดข้องเสมอ การอัดเต็ม 100% จึงทำให้แผนพังทั้งวันจากเหตุเพียงเรื่องเดียว", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 60, "q": "โครงการ 8 สัปดาห์มีเวลาสำรองรวม 5 วัน แต่เพิ่งสัปดาห์ที่ 3 เวลาสำรองถูกใช้หมดแล้ว ท่านควรทำอย่างไร?", "choices": ["ปิดข่าวไว้ก่อน หวังว่าช่วงหลังทีมจะทำเร็วขึ้นเอง", "ทบทวนแผนที่เหลือ หาสาเหตุที่ใช้เวลาสำรองเร็วผิดปกติ และแจ้งผู้เกี่ยวข้องเพื่อปรับแผนหรือขอทรัพยากรเพิ่มทันที", "ตัดขั้นตอนตรวจสอบคุณภาพช่วงท้ายออกเพื่อชดเชยเวลา", "สั่งทีมทำงานล่วงเวลาทุกวันไปจนจบโครงการโดยไม่แจ้งใคร", "ประกาศเลื่อนกำหนดส่งทันทีโดยไม่ต้องวิเคราะห์อะไร"], "answer": 1, "explanation": "การใช้เวลาสำรองหมดตั้งแต่ช่วงต้นคือสัญญาณเตือนภัยว่าแผนหรือการทำงานมีปัญหาเชิงระบบ ต้องรีบวิเคราะห์และปรับแผนขณะที่ยังมีทางเลือก ไม่ใช่ปิดบังหรือแก้ด้วยการลดคุณภาพ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 61, "q": "งานหนึ่งต้องใช้เครื่องจักรรวม 20 ชั่วโมง แต่เครื่องว่างให้ใช้ได้เพียงวันละ 4 ชั่วโมง และลูกค้าต้องการรับของภายใน 4 วัน (ใช้เครื่องได้ 16 ชั่วโมง) ท่านควรทำอย่างไร?", "choices": ["รับปากลูกค้าไปก่อนแล้วค่อยหาทางแก้ปัญหาหน้างาน", "เร่งรอบเครื่องจักรให้เกินพิกัดเพื่อให้ทันเวลา", "ตัดการทดสอบชิ้นงานออกเพื่อประหยัดชั่วโมงเครื่อง", "จัดตารางแบบเดิมไปก่อนโดยหวังว่าเครื่องจะว่างเพิ่มขึ้นเอง", "แจ้งข้อจำกัดพร้อมตัวเลขจริง และเสนอทางเลือก เช่น เจรจาเลื่อนส่ง ขอช่วงเวลาเครื่องเพิ่ม หรือจัดกะการใช้เครื่องใหม่"], "answer": 4, "explanation": "ตัวเลข 20 ชั่วโมงกับเวลาว่าง 16 ชั่วโมงชี้ชัดว่าแผนเดิมเป็นไปไม่ได้ ต้องแก้ที่เงื่อนไขด้วยข้อมูลจริงและทางเลือกที่เป็นรูปธรรม ไม่ใช่รับปากทั้งที่รู้ว่าทำไม่ได้หรือลดคุณภาพและความปลอดภัย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 62, "q": "ในการเรียงลำดับงานลงตารางเวลา ควรพิจารณาปัจจัยใดประกอบกันเป็นหลัก?", "choices": ["ความชอบส่วนตัวของผู้จัดตาราง", "กำหนดส่งของแต่ละงาน ความสัมพันธ์ก่อน-หลังของงาน และช่วงเวลาที่ทรัพยากรว่าง", "ขนาดของงานโดยเรียงจากเล็กไปใหญ่เสมอ", "ลำดับที่ได้รับมอบหมายมาก่อน-หลังเท่านั้น", "วางงานยากไว้ท้ายตารางเสมอเพื่อให้มีกำลังใจช่วงแรก"], "answer": 1, "explanation": "ตารางที่ใช้ได้จริงต้องสอดคล้องทั้งเส้นตาย ลำดับเงื่อนไขของงาน และความพร้อมของคนกับเครื่องมือ การใช้เกณฑ์เดียว เช่น ขนาดงานหรือลำดับที่รับมา ทำให้ตารางขัดกับความเป็นจริง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 63, "q": "ท่านเพิ่งพบว่าตนมีนัดประชุมลูกค้าและอบรมภายในเวลา 14:00 น. วันเดียวกันทั้งสองรายการ ควรจัดการอย่างไร?", "choices": ["ไม่ไปทั้งสองรายการเพื่อความเป็นกลาง", "เข้ารายการละครึ่งชั่วโมงแล้วรีบย้ายไปอีกที่", "รอให้ถึงเวลาแล้วเลือกตามความรู้สึกตอนนั้น", "ประเมินความสำคัญและผลกระทบของทั้งสองรายการ เลือกเข้ารายการที่กระทบมากกว่า และรีบแจ้งขอเลื่อนหรือส่งตัวแทนอีกรายการทันทีที่ทราบ", "เข้าอบรมภายในเพราะยกเลิกง่ายกว่าโดยไม่ต้องแจ้งลูกค้า"], "answer": 3, "explanation": "นัดซ้อนต้องตัดสินด้วยผลกระทบและจัดการรายการที่เหลือทันทีที่รู้ตัว การแจ้งล่วงหน้าเปิดทางให้เลื่อนหรือหาตัวแทนได้ ต่างจากการหายไปเฉย ๆ หรือเข้าครึ่ง ๆ กลาง ๆ ซึ่งเสียหายทั้งสองทาง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 64, "q": "เหตุใดจึงควรเว้นช่วงเวลาว่างสั้น ๆ ระหว่างการประชุมหรือนัดหมายที่ต่อเนื่องกัน?", "choices": ["เพื่อเผื่อการประชุมเกินเวลา การเดินทาง และการเตรียมตัว ทำให้ตารางทั้งวันไม่พังเป็นลูกโซ่", "เพื่อให้ดูเหมือนงานไม่แน่นจนเกินไปในสายตาหัวหน้า", "เพื่อใช้เล่นโทรศัพท์คลายเครียดเป็นหลัก", "เพื่อให้ผู้อื่นสามารถจองเวลาแทรกได้ตลอดเวลา", "ไม่จำเป็นต้องเว้น เพราะการประชุมย่อมเลิกตรงเวลาเสมอ"], "answer": 0, "explanation": "ช่วงว่างระหว่างนัดคือ buffer ขนาดเล็กที่ดูดซับการเลิกช้า การเดินทาง และการเตรียมงาน หากนัดชิดกันหมด ความล่าช้าจากนัดแรกจะไล่ทับทุกนัดที่เหลือ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 65, "q": "ท่านมีงานประจำที่ต้องทำทุกสัปดาห์อยู่แล้ว และได้รับโครงการพิเศษที่ต้องส่งวันศุกร์นี้เพิ่มเข้ามา ประเมินแล้วเวลาไม่พอสำหรับทั้งหมด ควรทำอย่างไร?", "choices": ["ทำงานประจำตามปกติทั้งหมดก่อน แล้วเอาเวลาที่เหลือให้โครงการพิเศษ", "ทิ้งงานประจำทั้งหมดโดยไม่แจ้งใครเพื่อทุ่มให้โครงการพิเศษ", "จัดลำดับใหม่ เจรจาเลื่อนหรือฝากงานประจำที่เลื่อนได้ และกันช่วงเวลาชัดเจนในตารางให้โครงการพิเศษ", "ทำงานทั้งสองอย่างสลับไปมาตามอารมณ์ในแต่ละวัน", "ขอถอนตัวจากโครงการพิเศษทันทีโดยไม่ประเมินทางเลือกอื่น"], "answer": 2, "explanation": "เมื่อภาระเกินเวลา ต้องจัดลำดับใหม่อย่างเป็นระบบ งานประจำบางส่วนมักเลื่อนหรือฝากได้หากแจ้งล่วงหน้า และโครงการที่มีเส้นตายชัดต้องได้ช่วงเวลาที่ถูกกันไว้แน่นอน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 66, "q": "ข้อใดคือสัญญาณชัดเจนที่สุดว่าการประเมินเวลาในตารางงานไม่สมจริง?", "choices": ["งานบางชิ้นเสร็จก่อนเวลาเล็กน้อยและบางชิ้นช้าเล็กน้อยสลับกันไป", "งานเกือบทุกชิ้นเสร็จช้ากว่าตารางทั้งที่ทีมทำงานอย่างเต็มที่แล้ว", "สมาชิกทีมขอเปิดดูตารางบ่อยครั้ง", "มีการปรับปรุงตารางตามรอบทุกเดือน", "หัวหน้าสอบถามความคืบหน้าทุกสัปดาห์"], "answer": 1, "explanation": "หากทีมทำเต็มกำลังแต่ผลงานช้ากว่าตารางเกือบทุกรายการ ปัญหาอยู่ที่ตัวประมาณการเวลา ไม่ใช่ที่คน ส่วนความคลาดเคลื่อนเล็กน้อยสลับเร็ว-ช้าเป็นเรื่องปกติของการทำงาน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 67, "q": "ท่านเผื่อเวลาสำรองไว้ 20% แต่ทำงานเสร็จก่อนกำหนด ควรใช้เวลาที่เหลือนี้อย่างไรจึงเกิดประโยชน์สูงสุด?", "choices": ["ปล่อยเวลาให้ว่างเปล่าเพราะแผนกำหนดไว้อย่างนั้นแล้ว", "ยืดการทำงานเดิมออกไปให้เต็มเวลาที่วางไว้พอดี", "รายงานว่าใช้เวลาเต็มตามแผนเพื่อให้การประเมินครั้งหน้าได้เวลาเท่าเดิม", "เก็บเวลาที่เหลือไว้โดยไม่บอกใครเพื่อใช้พักผ่อน", "ใช้ตรวจทานคุณภาพงาน เริ่มงานถัดไปให้เร็วขึ้น หรือนำไปทำงานสำคัญที่ไม่เร่งด่วน"], "answer": 4, "explanation": "เวลาที่เหลือจาก buffer คือกำไรที่ควรนำไปเพิ่มคุณภาพหรือความคืบหน้าของงานอื่น การยืดงานให้เต็มเวลาหรือปกปิดข้อมูลจริงทำให้การประเมินเวลาในอนาคตบิดเบือน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 68, "q": "หัวหน้าถามว่า \"ถ้างานเทปูนล่าช้าไป 2 วัน จะกระทบงานใดบ้างและกระทบกำหนดส่งหรือไม่\" เครื่องมือใดช่วยตอบคำถามนี้ได้รวดเร็วที่สุด?", "choices": ["บันทึกการลงเวลาเข้า-ออกงานของพนักงาน", "ใบเสนอราคาของโครงการ", "Gantt chart ที่แสดงช่วงเวลาและความสัมพันธ์ก่อน-หลังของแต่ละงาน", "รายงานการประชุมครั้งล่าสุด", "สมุดรายรับ-รายจ่ายของโครงการ"], "answer": 2, "explanation": "Gantt chart แสดงงานทุกชิ้นบนแกนเวลาพร้อมความเชื่อมโยงก่อน-หลัง จึงมองเห็นได้ทันทีว่าความล่าช้าจุดหนึ่งจะดันงานใดต่อและชนกำหนดส่งหรือไม่", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 69, "q": "โครงการก่อสร้างกำหนด milestone เป็นระยะ เช่น \"โครงสร้างเสร็จ\" และ \"ระบบไฟฟ้าเสร็จ\" จุดประสงค์หลักของการกำหนดเช่นนี้คือข้อใด?", "choices": ["ใช้เป็นจุดตรวจสอบความคืบหน้าเทียบกับแผน ทำให้รู้ตัวเร็วเมื่อเริ่มล่าช้าและแก้ไขได้ทัน", "ใช้เป็นโอกาสจัดงานเลี้ยงฉลองของทีมเป็นหลัก", "ทำให้เอกสารโครงการดูเป็นทางการมากขึ้น", "ใช้แทนการทำตารางเวลารายละเอียดทั้งหมด", "ใช้กำหนดวันจ่ายเงินเดือนของพนักงาน"], "answer": 0, "explanation": "Milestone คือหมุดหมายสำคัญที่ใช้เทียบความคืบหน้ <script>
"use strict";
/* ================= state & storage ================= */
const $ = id => document.getElementById(id);
const store = {
  get(){ try{return JSON.parse(localStorage.getItem("vnet-stats"))||{}}catch(e){return{}} },
  set(d){ localStorage.setItem("vnet-stats", JSON.stringify(d)) }
};
let S = null;         // current quiz session
let timerInt = null;
let muted = localStorage.getItem("vnet-muted")==="1";

/* ================= sounds (WebAudio) ================= */
let actx = null;
function beep(freqs, dur=0.12, type="sine", vol=0.15){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, actx.currentTime + i*dur);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (i+1)*dur);
      o.connect(g).connect(actx.destination);
      o.start(actx.currentTime + i*dur); o.stop(actx.currentTime + (i+1)*dur + .02);
    });
  }catch(e){}
}
const sndGood = ()=>beep([660,880],0.1,"sine",.12);
const sndBad  = ()=>beep([220,180],0.15,"square",.06);
const sndWin  = ()=>beep([523,659,784,1047],0.14,"sine",.14);
const sndClick= ()=>beep([440],0.05,"sine",.05);
function toggleMute(){ muted=!muted; localStorage.setItem("vnet-muted",muted?"1":"0"); $("mutebtn").textContent = muted?"🔇":"🔊"; }

/* ================= home ================= */
function renderHome(){
  const st = store.get();
  const myIds = new Set([...EXAM_DATA.subjects.map(s=>s.id), "mix"]);
  let answered=0, correct=0;
  for(const k in (st.log||{})){ if(!myIds.has(k)) continue; answered += st.log[k].a; correct += st.log[k].c; }
  $("st-total").textContent = EXAM_DATA.subjects.reduce((s,x)=>s+x.questions.length,0);
  $("st-answered").textContent = answered;
  $("st-acc").textContent = answered ? Math.round(correct/answered*100)+"%" : "—";
  $("st-streak").textContent = st.maxStreak||0;

  const g = $("subjects"); g.innerHTML = "";
  EXAM_DATA.subjects.forEach(s=>{
    const best = (st.best||{})[s.id];
    const b = document.createElement("button");
    b.className = "subj";
    b.innerHTML = `<div class="ic">${s.icon}</div><h3>${s.title}</h3><div class="sub">${s.subtitle}</div>
      <div class="meta"><span class="badge">${s.questions.length} ข้อ</span>
      <span class="best">${best!=null ? "🏆 "+best+"%" : "ยังไม่เคยทำ"}</span></div>`;
    b.onclick = ()=>openSetup(s.id);
    g.appendChild(b);
  });
  if(EXAM_DATA.subjects.length < 2) return;
  const grandTotal = EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0);
  const mix = document.createElement("button");
  mix.className = "subj mix";
  const mixBest = (st.best||{})["mix"];
  mix.innerHTML = `<div class="ic">🎲</div><h3>จับฉลากรวมทุกชุด</h3><div class="sub">สุ่มคละจากทั้ง ${grandTotal} ข้อ</div>
    <div class="meta"><span class="badge">ท้าทาย!</span><span class="best">${mixBest!=null?"🏆 "+mixBest+"%":"ยังไม่เคยทำ"}</span></div>`;
  mix.onclick = ()=>openSetup("mix");
  g.appendChild(mix);
}

/* ================= setup modal ================= */
let setup = {n:20, mode:"practice", shuffleQ:true, shuffleC:false, subj:null};
function openSetup(id){
  sndClick();
  setup.subj = id;
  const s = id==="mix" ? {title:"จับฉลากรวมทุกวิชา", subtitle:"คละทุกสมรรถนะ", icon:"🎲",
      questions:{length:EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0)}}
    : EXAM_DATA.subjects.find(x=>x.id===id);
  const total = s.questions.length;
  const counts = [10,20,30,total>=100?50:total].filter((v,i,a)=>v<=total && a.indexOf(v)===i);
  if(!counts.includes(total) && total<=60) counts.push(total);
  setup.n = counts.includes(20)?20:counts[0];
  if(id==="mix") setup.shuffleQ = true;
  $("modal-root").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeSetup()">
    <div class="modal">
      <h2>${s.icon} ${s.title}</h2>
      <div class="sub">${s.subtitle} • มีทั้งหมด ${total} ข้อ</div>
      <div class="optlabel">โหมด</div>
      <div class="optrow" id="mode-row">
        <button class="opt ${setup.mode==="practice"?"sel":""}" onclick="setMode('practice')">📖 ฝึกฝน (เฉลยทันที)</button>
        <button class="opt ${setup.mode==="exam"?"sel":""}" onclick="setMode('exam')">⏱️ สอบเสมือนจริง</button>
      </div>
      <div class="optlabel">จำนวนข้อ</div>
      <div class="optrow" id="count-row">
        ${counts.map(c=>`<button class="opt ${c===setup.n?"sel":""}" onclick="setCount(${c})">${c===total?"ทั้งหมด ("+c+")":c}</button>`).join("")}
      </div>
      <div class="toggle ${setup.shuffleQ?"on":""}" id="tg-q" onclick="tog('shuffleQ','tg-q')"><span class="box">${setup.shuffleQ?"✓":""}</span> สุ่มลำดับข้อ</div>
      <div class="toggle ${setup.shuffleC?"on":""}" id="tg-c" onclick="tog('shuffleC','tg-c')"><span class="box">${setup.shuffleC?"✓":""}</span> สุ่มลำดับตัวเลือก</div>
      <div class="mrow">
        <button class="btn ghost" onclick="closeSetup()">ยกเลิก</button>
        <button class="btn primary" onclick="startQuiz()">เริ่มเลย 🚀</button>
      </div>
    </div>
  </div>`;
}
function setMode(m){ setup.mode=m; document.querySelectorAll("#mode-row .opt").forEach((b,i)=>b.classList.toggle("sel",(i===0)===(m==="practice"))); sndClick(); }
function setCount(c){ setup.n=c; document.querySelectorAll("#count-row .opt").forEach(b=>b.classList.toggle("sel",b.textContent.includes("("+c+")")||b.textContent.trim()==String(c))); sndClick(); }
function tog(key,id){ setup[key]=!setup[key]; const el=$(id); el.classList.toggle("on",setup[key]); el.querySelector(".box").textContent = setup[key]?"✓":""; sndClick(); }
function closeSetup(){ $("modal-root").innerHTML=""; }

/* ================= quiz engine ================= */
function shuffled(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

function startQuiz(){
  closeSetup();
  let pool, labels;
  if(setup.subj==="mix"){
    pool = EXAM_DATA.subjects.flatMap(s=>s.questions.map(q=>({...q, labels:s.labels, from:s.icon+" "+s.title})));
    labels = null;
  } else {
    const s = EXAM_DATA.subjects.find(x=>x.id===setup.subj);
    pool = s.questions.map(q=>({...q, labels:s.labels, from:""}));
  }
  if(setup.shuffleQ) pool = shuffled(pool);
  pool = pool.slice(0, setup.n);
  pool = pool.map(q=>{
    let idx = q.choices.map((_,i)=>i);
    if(setup.shuffleC) idx = shuffled(idx);
    return {...q, order:idx, picked:null, removed:[]};
  });
  S = { qs:pool, i:0, correct:0, streak:0, maxStreak:0, fifty:3, mode:setup.mode,
        subj:setup.subj, start:Date.now(), done:false };
  $("home").classList.add("hidden"); $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("mutebtn").textContent = muted?"🔇":"🔊";
  $("palette").classList.toggle("hidden", S.mode!=="exam");
  clearInterval(timerInt);
  timerInt = setInterval(()=>{ const t=Math.floor((Date.now()-S.start)/1000);
    $("q-timer").textContent = String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); },500);
  renderQ();
  window.scrollTo(0,0);
}

function renderQ(){
  const q = S.qs[S.i];
  $("q-count").textContent = `${S.i+1}/${S.qs.length}`;
  $("q-score").textContent = `✅ ${S.correct}`;
  $("q-streak").textContent = `🔥 ${S.streak}`;
  $("q-progress").style.width = (S.i/S.qs.length*100)+"%";
  $("q-section").textContent = q.from || q.section || "";
  stopSpeech();
  const audio = parseAudio(q.q);
  $("q-text").textContent = `${S.i+1}. ${audio ? audio.question : q.q}`;
  renderAudioBox(audio, q);
  $("q-expl").innerHTML = "";
  $("nextbtn").classList.add("hidden");
  $("skipbtn").classList.toggle("hidden", S.mode!=="exam");
  $("submitbtn").classList.add("hidden");
  $("fifty").classList.toggle("hidden", S.mode!=="practice");
  $("fifty").disabled = S.fifty<=0;
  $("fifty-n").textContent = "×"+S.fifty;

  const c = $("q-choices"); c.innerHTML = "";
  q.order.forEach((origIdx,pos)=>{
    const b = document.createElement("button");
    b.className = "choice";
    if(q.removed.includes(origIdx)) b.classList.add("dim");
    b.innerHTML = `<span class="lb">${q.labels[pos]}</span><span>${q.choices[origIdx]}</span>`;
    if(S.mode==="exam" && q.picked===origIdx) b.classList.add("picked");
    b.onclick = ()=>pick(origIdx, b);
    c.appendChild(b);
  });
  if(S.mode==="exam"){
    renderPalette();
    if(q.picked!==null || S.i===S.qs.length-1) maybeShowSubmit();
  }
}

/* ===== text-to-speech for listening questions ===== */
const AUDIO_RE = /^\(Audio\)\s*['‘’](.*)['‘’]\s*(?:->|→)\s*(.*)$/s;
function parseAudio(text){
  const m = AUDIO_RE.exec(text);
  return m ? {script:m[1].trim(), question:m[2].trim()} : null;
}
let currentScript = null;
let currentAudioSrc = null;   // mp3 for this question (real voice), if available
let audioEl = null;
function stopSpeech(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  if(audioEl){ audioEl.pause(); audioEl = null; }
  document.querySelectorAll(".playbtn").forEach(b=>b.classList.remove("playing"));
}
let currentUtterance = null; // keep a reference so Chrome doesn't GC it mid-speech
function playAudio(){
  stopSpeech();
  const btnA = document.querySelector(".playbtn");
  if(currentAudioSrc){
    const src = currentAudioSrc.startsWith("data:") ? currentAudioSrc
              : (window.AUDIO_BASE || "audio/") + currentAudioSrc;
    audioEl = new Audio(src);
    audioEl.onplay = ()=>btnA && btnA.classList.add("playing");
    audioEl.onended = ()=>btnA && btnA.classList.remove("playing");
    audioEl.onerror = ()=>{ btnA && btnA.classList.remove("playing"); speakScript(); };
    audioEl.play().catch(()=>speakScript());
    return;
  }
  speakScript();
}
function speakScript(){
  if(!("speechSynthesis" in window) || !currentScript) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(currentScript);
  u.lang = "en-US"; u.rate = 0.92;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x=>x.name==="Samantha") || vs.find(x=>x.lang==="en-US") ||
            vs.find(x=>x.lang && x.lang.startsWith("en"));
  if(v) u.voice = v;
  const btn = document.querySelector(".playbtn");
  u.onstart = ()=>btn && btn.classList.add("playing");
  u.onend = u.onerror = ()=>btn && btn.classList.remove("playing");
  currentUtterance = u;
  // Chrome quirk: speak() immediately after cancel() can be silently dropped
  setTimeout(()=>speechSynthesis.speak(u), 80);
}
function toggleScript(){
  const s = $("q-script"); if(s) s.classList.toggle("hidden");
}
function renderAudioBox(audio, q){
  currentScript = audio ? audio.script : null;
  currentAudioSrc = (audio && q && q.audio) ? q.audio : null;
  const box = $("q-audio");
  if(!audio){ box.innerHTML = ""; return; }
  const ttsOK = currentAudioSrc !== null || "speechSynthesis" in window;
  box.innerHTML = `<div class="audio-box">
    <div class="audio-row">
      <button class="playbtn" onclick="playAudio()">▶️ ฟังเสียง</button>
      <button class="scriptbtn" onclick="toggleScript()">📜 ดูบทพูด</button>
    </div>
    <div class="script hidden" id="q-script">"${audio.script}"</div>
    <div class="audio-hint">${ttsOK ? "ฟังได้หลายรอบ • ลองตอบโดยไม่เปิดบทพูดเพื่อฝึกการฟังจริง" : "เบราว์เซอร์นี้ไม่รองรับเสียงพูด — กด ดูบทพูด เพื่ออ่านแทน"}</div>
  </div>`;
}
function labelOf(q, origIdx){ return q.labels[q.order.indexOf(origIdx)]; }
function pick(idx, btn){
  const q = S.qs[S.i];
  if(S.mode==="practice"){
    if(q.picked!==null) return;
    q.picked = idx;
    const good = idx===q.answer;
    if(good){ S.correct++; S.streak++; S.maxStreak=Math.max(S.maxStreak,S.streak); sndGood();
      if(S.streak>0 && S.streak%5===0){ comboPop("🔥 "+S.streak+" ติด!"); }
    } else { S.streak=0; sndBad(); $("qcard").classList.add("shake"); setTimeout(()=>$("qcard").classList.remove("shake"),400); }
    // reveal
    [...$("q-choices").children].forEach((b,pos)=>{
      const oi = q.order[pos];
      b.disabled = true;
      if(oi===q.answer) b.classList.add("correct");
      else if(oi===idx) b.classList.add("wrong");
    });
    $("q-score").textContent = `✅ ${S.correct}`;
    $("q-streak").textContent = `🔥 ${S.streak}`;
    $("q-expl").innerHTML = `<div class="expl ${good?"good":"bad"}">
      <h4>${good ? "🎉 ถูกต้อง!" : "❌ ยังไม่ถูก — เฉลยคือ "+labelOf(q,q.answer)+"."}</h4>
      <p>${q.explanation || "ไม่มีคำอธิบายเพิ่มเติมสำหรับข้อนี้"}</p></div>`;
    const sc = $("q-script"); if(sc) sc.classList.remove("hidden");
    $("fifty").classList.add("hidden");
    if(S.i===S.qs.length-1){ $("nextbtn").textContent = "ดูสรุปผล 🏁"; }
    $("nextbtn").classList.remove("hidden");
    $("nextbtn").focus();
  } else {
    q.picked = idx; sndClick();
    [...$("q-choices").children].forEach((b,pos)=>b.classList.toggle("picked", q.order[pos]===idx));
    renderPalette(); maybeShowSubmit();
    setTimeout(()=>{ if(S.i<S.qs.length-1){ S.i++; renderQ(); window.scrollTo(0,0);} }, 250);
  }
}

function nextQ(){
  if(S.i>=S.qs.length-1){ finishQuiz(); return; }
  S.i++; renderQ(); window.scrollTo(0,0);
}
function maybeShowSubmit(){
  const allDone = S.qs.every(q=>q.picked!==null);
  $("submitbtn").classList.toggle("hidden", !(allDone || S.i===S.qs.length-1));
}
function renderPalette(){
  const p = $("palette"); p.innerHTML = "";
  S.qs.forEach((q,i)=>{
    const b = document.createElement("button");
    b.className = "pal"+(q.picked!==null?" done":"")+(i===S.i?" cur":"");
    b.textContent = i+1;
    b.onclick = ()=>{ S.i=i; renderQ(); };
    p.appendChild(b);
  });
}
function useFifty(){
  const q = S.qs[S.i];
  if(S.fifty<=0 || q.picked!==null) return;
  S.fifty--;
  const wrongs = shuffled(q.order.filter(i=>i!==q.answer && !q.removed.includes(i))).slice(0,2);
  q.removed.push(...wrongs);
  sndClick(); renderQ();
}
function confirmExit(){
  if(S && !S.done && S.qs.some(q=>q.picked!==null)){
    if(!confirm("ออกจากการทำข้อสอบ? ความคืบหน้ารอบนี้จะหายไป")) return;
  }
  quitToHome();
}
function quitToHome(){
  stopSpeech();
  clearInterval(timerInt); S=null;
  $("quiz").classList.add("hidden"); $("result").classList.add("hidden");
  $("home").classList.remove("hidden");
  renderHome(); window.scrollTo(0,0);
}

/* ================= results ================= */
function finishQuiz(){
  S.done = true;
  stopSpeech();
  clearInterval(timerInt);
  if(S.mode==="exam"){ S.correct = S.qs.filter(q=>q.picked===q.answer).length; }
  const n = S.qs.length, pct = Math.round(S.correct/n*100);
  const secs = Math.floor((Date.now()-S.start)/1000);
  const time = String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0");

  // save stats
  const st = store.get();
  st.best = st.best||{}; st.log = st.log||{};
  if(pct > (st.best[S.subj] ?? -1)) st.best[S.subj] = pct;
  const lg = st.log[S.subj] || {a:0,c:0};
  lg.a += n; lg.c += S.correct; st.log[S.subj] = lg;
  st.maxStreak = Math.max(st.maxStreak||0, S.maxStreak);
  store.set(st);

  const verdict = pct===100 ? ["🏆 สมบูรณ์แบบ!","var(--warn)"]
    : pct>=80 ? ["🌟 เยี่ยมมาก!","var(--good)"]
    : pct>=60 ? ["👍 ผ่านเกณฑ์ ทำได้ดี","var(--brand2)"]
    : pct>=40 ? ["💪 เกือบแล้ว สู้ต่อ!","var(--warn)"]
    : ["📚 ทบทวนอีกนิด แล้วลองใหม่","var(--bad)"];

  const circ = 2*Math.PI*80;
  const wrong = S.qs.filter(q=>q.picked!==q.answer);
  $("quiz").classList.add("hidden");
  const r = $("result");
  r.classList.remove("hidden");
  r.innerHTML = `
  <div class="result">
    <div style="display:flex;justify-content:space-between"><button class="topbtn" onclick="quitToHome()">← หน้าหลัก</button>
    <button class="topbtn" onclick="retry()">🔄 ทำใหม่</button></div>
    <div class="ring">
      <svg width="190" height="190"><circle cx="95" cy="95" r="80" fill="none" stroke="var(--card2)" stroke-width="14"/>
      <circle cx="95" cy="95" r="80" fill="none" stroke="${pct>=60?"var(--good)":pct>=40?"var(--warn)":"var(--bad)"}" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" id="ringbar"/></svg>
      <div class="num"><b>${pct}%</b><span>${S.correct} / ${n} ข้อ</span></div>
    </div>
    <div class="verdict" style="color:${verdict[1]}">${verdict[0]}</div>
    <div class="rstats">
      <div class="stat"><b>⏱️ ${time}</b><span>เวลาที่ใช้</span></div>
      <div class="stat"><b>🔥 ${S.maxStreak}</b><span>ตอบถูกติดกันสูงสุด</span></div>
      <div class="stat"><b>${wrong.length}</b><span>ข้อที่ผิด/ข้าม</span></div>
    </div>
    ${wrong.length ? `<button class="btn primary" style="max-width:320px;margin:0 auto" onclick="$('rev').classList.toggle('hidden')">📖 ทบทวนข้อที่ผิด (${wrong.length})</button>` : ""}
    <div class="review ${S.mode==="exam"?"":"hidden"}" id="rev">
      ${wrong.map(q=>`<div class="rq">
        <div class="st no">✗ ${q.q}</div>
        <p>คำตอบของคุณ: ${q.picked!==null ? labelOf(q,q.picked)+". "+q.choices[q.picked] : "— ไม่ได้ตอบ"}</p>
        <p style="color:var(--good)">เฉลย: ${labelOf(q,q.answer)}. ${q.choices[q.answer]}</p>
        <div class="ex">💡 ${q.explanation || "ไม่มีคำอธิบายเพิ่มเติม"}</div>
      </div>`).join("")}
    </div>
  </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const bar = $("ringbar"); bar.style.transition = "stroke-dashoffset 1.2s ease";
    bar.style.strokeDashoffset = circ*(1-pct/100);
  }));
  if(pct>=80){ sndWin(); confetti(); } else if(pct>=60){ sndWin(); }
  window.scrollTo(0,0);
}
function retry(){ openSetupFromResult(); }
function openSetupFromResult(){ const id=S.subj; quitToHome(); openSetup(id); }

/* ================= fun bits ================= */
function comboPop(text){
  const el = document.createElement("div");
  el.className = "combo-pop"; el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}
function confetti(){
  const cv = $("confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#7c6cff","#4ecdc4","#ffc94d","#ff5d73","#3ddc84"];
  const ps = Array.from({length:140},()=>({
    x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.5,
    w:6+Math.random()*6, h:8+Math.random()*8,
    vy:2+Math.random()*3, vx:(Math.random()-.5)*2, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.2,
    c:colors[Math.floor(Math.random()*colors.length)]
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if(++frames < 260) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* keyboard shortcuts: 1-5 answer, Enter/space next */
document.addEventListener("keydown", e=>{
  if(!S || $("quiz").classList.contains("hidden")) return;
  if(e.key>="1" && e.key<="5"){
    const pos = +e.key-1, btns = $("q-choices").children;
    if(btns[pos] && !btns[pos].disabled) btns[pos].click();
  } else if(e.key==="Enter" && !$("nextbtn").classList.contains("hidden")){ nextQ(); }
});

renderHome();
</script>
