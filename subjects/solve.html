<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 การแก้ปัญหาและการตัดสินใจ — ข้อสอบ V-NET 80 ข้อ</title>
<style>
:root{
  --bg:#0f1220; --bg2:#171b30; --card:#1e2340; --card2:#252b4d;
  --text:#eef0ff; --muted:#9aa3c7; --line:#323a63;
  --brand:#7c6cff; --brand2:#4ecdc4; --good:#3ddc84; --bad:#ff5d73; --warn:#ffc94d;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Noto Sans Thai","Segoe UI",sans-serif;
  background:radial-gradient(1200px 800px at 80% -10%,#2a2f55 0%,var(--bg) 55%);
  color:var(--text); min-height:100vh; line-height:1.6;
}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}

/* ===== Home ===== */
.hero{text-align:center;padding:28px 0 20px}
.hero h1{font-size:2rem;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);margin-top:6px}
.statbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;text-align:center;min-width:110px}
.stat b{font-size:1.3rem;display:block}
.stat span{color:var(--muted);font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.subj{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:left;transition:.18s;position:relative;overflow:hidden}
.subj:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 24px rgba(124,108,255,.25)}
.subj .ic{font-size:1.9rem}
.subj h3{font-size:1.02rem;margin:8px 0 2px}
.subj .sub{color:var(--muted);font-size:.8rem}
.subj .meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:.82rem;color:var(--muted)}
.badge{background:var(--bg2);border:1px solid var(--line);padding:2px 10px;border-radius:999px}
.best{color:var(--warn)}
.subj.mix{background:linear-gradient(135deg,#3b2f7a,#1c5f5a);border-color:#6a5cff}

/* ===== Setup modal ===== */
.overlay{position:fixed;inset:0;background:rgba(8,10,20,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:20px;max-width:440px;width:100%;padding:24px}
.modal h2{font-size:1.2rem;margin-bottom:2px}
.modal .sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.optlabel{font-size:.85rem;color:var(--muted);margin:14px 0 6px}
.optrow{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:.9rem}
.opt.sel{background:var(--brand);border-color:var(--brand);font-weight:700}
.toggle{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.9rem;color:var(--muted);cursor:pointer;user-select:none}
.toggle .box{width:20px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.toggle.on .box{background:var(--good);border-color:var(--good);color:#08331c}
.mrow{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:12px;border-radius:12px;font-size:1rem;font-weight:700}
.btn.primary{background:linear-gradient(90deg,var(--brand),#9b8cff);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line)}

/* ===== Quiz ===== */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qtop .left{display:flex;gap:8px;align-items:center}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.85rem}
.pill.flame{border-color:#ff8c42;color:#ffb347}
.pill.timer{min-width:84px;text-align:center}
.progress{height:8px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.qsec{color:var(--brand2);font-size:.78rem;margin-bottom:6px}
.qtext{font-size:1.08rem;font-weight:600;white-space:pre-wrap}
.choices{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-size:.97rem;transition:.15s;width:100%}
.choice:not(:disabled):hover{border-color:var(--brand)}
.choice .lb{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.choice.correct{border-color:var(--good);background:rgba(61,220,132,.12)}
.choice.correct .lb{background:var(--good);color:#06301a;border-color:var(--good)}
.choice.wrong{border-color:var(--bad);background:rgba(255,93,115,.12)}
.choice.wrong .lb{background:var(--bad);color:#fff;border-color:var(--bad)}
.choice.picked{border-color:var(--brand);background:rgba(124,108,255,.14)}
.choice.dim{opacity:.28;pointer-events:none}
.expl{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid;animation:pop .25s}
.expl.good{background:rgba(61,220,132,.1);border-color:var(--good)}
.expl.bad{background:rgba(255,93,115,.1);border-color:var(--bad)}
.expl h4{font-size:.95rem;margin-bottom:4px}
.expl p{font-size:.92rem;color:var(--text)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.qactions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.lifeline{background:var(--card);border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:10px 16px;font-weight:700}
.lifeline:disabled{opacity:.35;border-color:var(--line);color:var(--muted)}
.shake{animation:shake .35s}
.audio-box{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
.audio-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.playbtn{background:linear-gradient(90deg,#2e7d6b,var(--brand2));color:#04241f;font-weight:800;border-radius:99px;padding:10px 22px;font-size:1rem;display:inline-flex;align-items:center;gap:8px}
.playbtn.playing{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(78,205,196,.5)}50%{box-shadow:0 0 0 10px rgba(78,205,196,0)}}
.scriptbtn{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:.85rem;color:var(--muted)}
.script{margin-top:12px;border-left:3px solid var(--brand2);padding:6px 12px;font-style:italic;color:var(--muted);font-size:.95rem}
.audio-hint{color:var(--muted);font-size:.78rem;margin-top:8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.combo-pop{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);font-size:2.2rem;font-weight:800;pointer-events:none;z-index:99;animation:rise 1s forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}

/* palette (exam mode) */
.palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.pal{width:34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-size:.8rem}
.pal.done{background:var(--brand);border-color:var(--brand);font-weight:700}
.pal.cur{outline:2px solid var(--brand2)}

/* ===== Results ===== */
.result{text-align:center;padding-top:10px}
.ring{width:190px;height:190px;margin:14px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:2.4rem}
.ring .num span{color:var(--muted);font-size:.85rem}
.verdict{font-size:1.3rem;font-weight:800;margin:4px 0 14px}
.rstats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.review{margin-top:26px;text-align:left}
.review h3{margin-bottom:12px}
.rq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.rq .st{font-weight:700}
.rq .st.ok{color:var(--good)} .rq .st.no{color:var(--bad)}
.rq p{font-size:.9rem;margin-top:4px}
.rq .ex{color:var(--muted);font-size:.86rem;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.topbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.85rem}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.footer-note{text-align:center;color:var(--muted);font-size:.75rem;margin-top:40px}
@media(max-width:520px){ .hero h1{font-size:1.5rem} .qtext{font-size:1rem} }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ HOME ============ -->
  <div id="home">
    <div class="hero">
      <h1>🧠 การแก้ปัญหาและการตัดสินใจ</h1>
      <p>Problem Solving & Decision Making • 80 ข้อ พร้อมเฉลยและคำอธิบายทุกข้อ</p>
    </div>
    <div class="statbar">
      <div class="stat"><b id="st-total">540</b><span>ข้อสอบทั้งหมด</span></div>
      <div class="stat"><b id="st-answered">0</b><span>ทำไปแล้ว (ครั้ง)</span></div>
      <div class="stat"><b id="st-acc">—</b><span>ความแม่นยำรวม</span></div>
      <div class="stat"><b id="st-streak">0</b><span>สถิติตอบถูกติดกัน</span></div>
    </div>
    <div class="grid" id="subjects"></div>
    <p class="footer-note">แตะวิชาเพื่อเริ่ม • ผลคะแนนบันทึกไว้ในเครื่องอัตโนมัติ</p>
  </div>

  <!-- ============ QUIZ ============ -->
  <div id="quiz" class="hidden">
    <div class="qtop">
      <div class="left">
        <button class="topbtn" onclick="confirmExit()">← ออก</button>
        <span class="pill" id="q-count">1/30</span>
        <span class="pill" id="q-score">✅ 0</span>
      </div>
      <div class="left">
        <span class="pill flame" id="q-streak">🔥 0</span>
        <span class="pill timer" id="q-timer">00:00</span>
        <button class="topbtn" id="mutebtn" onclick="toggleMute()">🔊</button>
      </div>
    </div>
    <div class="progress"><i id="q-progress" style="width:0%"></i></div>
    <div class="qcard" id="qcard">
      <div class="qsec" id="q-section"></div>
      <div class="qtext" id="q-text"></div>
      <div id="q-audio"></div>
      <div class="choices" id="q-choices"></div>
      <div id="q-expl"></div>
      <div class="qactions">
        <button class="lifeline" id="fifty" onclick="useFifty()">✂️ 50:50 <span id="fifty-n">×3</span></button>
        <button class="btn primary hidden" id="nextbtn" onclick="nextQ()">ข้อถัดไป →</button>
        <button class="btn ghost hidden" id="skipbtn" onclick="nextQ()">ข้าม →</button>
        <button class="btn primary hidden" id="submitbtn" onclick="finishQuiz()">ส่งคำตอบ ✅</button>
      </div>
    </div>
    <div class="palette hidden" id="palette"></div>
  </div>

  <!-- ============ RESULT ============ -->
  <div id="result" class="hidden"></div>
</div>

<div id="modal-root"></div>

<script>window.AUDIO_BASE='../audio/';const EXAM_DATA = {"subjects": [{"id": "solve", "icon": "🧠", "title": "การแก้ปัญหาและการตัดสินใจ", "subtitle": "Problem Solving & Decision Making", "labels": ["ก", "ข", "ค", "ง", "จ"], "questions": [{"n": 1, "q": "ข้อใดคือขั้นตอนแรกที่สำคัญที่สุดในการแก้ปัญหาตามหลักการคิดเชิงระบบ (5.1)?", "choices": ["การระดมสมองหาทางแก้ไขทันที", "การระบุและนิยามปัญหาให้ชัดเจน (Identify Problem)", "การค้นหาผู้รับผิดชอบต่อความผิดพลาด", "การของบประมาณเพื่อซื้ออุปกรณ์ใหม่", "การแต่งตั้งคณะกรรมการตรวจสอบ"], "answer": 1, "explanation": "การแก้ปัญหาเชิงระบบต้องเริ่มจากการระบุและนิยามปัญหาให้ชัดเจนก่อนเสมอ เพราะหากนิยามปัญหาผิด ขั้นตอนต่อไปทั้งหมด (การวิเคราะห์สาเหตุและการหาทางแก้) จะผิดทิศทางตามไปด้วย", "section": ""}, {"n": 2, "q": "การแยกแยะระหว่าง 'อาการ' (Symptom) และ 'สาเหตุ' (Root Cause) มีประโยชน์อย่างไร?", "choices": ["ช่วยให้ไม่ต้องแก้ปัญหาที่ต้นเหตุ", "ช่วยให้การแก้ปัญหาตรงจุดและไม่กลับมาเป็นซ้ำ", "ช่วยประหยัดเวลาในการประชุม", "ช่วยให้หัวหน้างานพอใจ", "ช่วยลดขั้นตอนการทำงานให้เหลือขั้นตอนเดียว"], "answer": 1, "explanation": "อาการ (Symptom) คือสิ่งที่ปรากฏให้เห็นภายนอก ส่วนสาเหตุที่แท้จริง (Root Cause) คือต้นตอของปัญหา การแก้ที่ต้นตอจะทำให้ปัญหาไม่ย้อนกลับมาเกิดซ้ำอีก", "section": ""}, {"n": 3, "q": "เครื่องมือ '5 Whys' (ถามทำไม 5 ครั้ง) เหมาะสำหรับใช้ในขั้นตอนใด?", "choices": ["การตัดสินใจเลือกวิธีแก้ปัญหา", "การติดตามผลหลังการแก้ไข", "การค้นหาสาเหตุที่แท้จริงของปัญหา", "การจัดทำคู่มือมาตรฐานการทำงาน", "การประเมินผลงานพนักงานประจำปี"], "answer": 2, "explanation": "เทคนิค 5 Whys คือการถามว่า “ทำไม” ต่อเนื่องกันประมาณ 5 ครั้ง เพื่อเจาะลึกจากอาการที่เห็นลงไปจนถึงสาเหตุรากของปัญหา จึงใช้ในขั้นตอนการวิเคราะห์หาสาเหตุ", "section": ""}, {"n": 4, "q": "ข้อมูลประเภทใดมีความน่าเชื่อถือที่สุดในการนำมาใช้ประกอบการตัดสินใจ (5.2)?", "choices": ["ความคิดเห็นส่วนตัวของเพื่อนร่วมงาน", "ข้อมูลเชิงสถิติและข้อเท็จจริงที่มีหลักฐานอ้างอิง", "ข่าวลือที่พูดต่อกันมาในองค์กร", "สัญชาตญาณหรือลางสังหรณ์ของผู้บริหาร", "ข้อมูลจากโซเชียลมีเดียที่ไม่ระบุแหล่งที่มา"], "answer": 1, "explanation": "ข้อมูลเชิงสถิติและข้อเท็จจริงที่มีหลักฐานอ้างอิงสามารถตรวจสอบซ้ำได้ จึงน่าเชื่อถือกว่าความคิดเห็นส่วนตัว ข่าวลือ ลางสังหรณ์ หรือข้อมูลที่ไม่ระบุแหล่งที่มา", "section": ""}, {"n": 5, "q": "พฤติกรรมใดแสดงถึงความ 'มุ่งมั่นในการแก้ปัญหา' (5.3) เมื่อเผชิญอุปสรรค?", "choices": ["หยุดพักงานไว้ก่อนรอให้สถานการณ์ดีขึ้น", "โยนความรับผิดชอบให้แผนกอื่น", "พยายามหาทางเลือกใหม่ๆ และไม่ล้มเลิกความตั้งใจ", "รายงานหัวหน้าเพื่อขอเปลี่ยนงาน", "ทำตามคำสั่งเดิมซ้ำๆ แม้ไม่ได้ผล"], "answer": 2, "explanation": "ความมุ่งมั่นในการแก้ปัญหาหมายถึงการไม่ล้มเลิกเมื่อเจออุปสรรค และพยายามหาทางเลือกหรือวิธีการใหม่ ๆ จนกว่าจะแก้ปัญหาได้สำเร็จ", "section": ""}, {"n": 6, "q": "การจัดการความรู้ (KM) มีบทบาทสำคัญอย่างไรต่อการแก้ปัญหาในองค์กร?", "choices": ["เพื่อจับผิดพนักงานที่ทำงานพลาด", "เพื่อป้องกันไม่ให้เกิดปัญหาเดิมซ้ำโดยการถอดบทเรียน", "เพื่อสร้างภาระงานเอกสารให้มากขึ้น", "เพื่อใช้เป็นเกณฑ์ในการลดเงินเดือน", "เพื่อเก็บความรู้ไว้เฉพาะกลุ่มผู้บริหาร"], "answer": 1, "explanation": "การจัดการความรู้ (Knowledge Management) คือการถอดบทเรียนและจัดเก็บความรู้จากการแก้ปัญหา เพื่อให้ผู้อื่นนำไปใช้ได้และป้องกันไม่ให้องค์กรเกิดปัญหาเดิมซ้ำ", "section": ""}, {"n": 7, "q": "วงจร PDCA ขั้นตอนใดหมายถึงการนำผลการตรวจสอบมาปรับปรุงแก้ไขและจัดทำให้เป็นมาตรฐาน เพื่อการปรับปรุงอย่างยั่งยืน?", "choices": ["Plan (วางแผน)", "Do (ลงมือทำ)", "Check (ตรวจสอบ)", "Act (ปรับปรุง/ทำให้เป็นมาตรฐาน)", "การรายงานผลต่อผู้บริหาร (Report)"], "answer": 3, "explanation": "Act คือการนำผลจากขั้น Check มาปรับปรุงแก้ไข และจัดทำวิธีการที่ได้ผลให้เป็นมาตรฐาน (Standardize) ก่อนเริ่มวงจรรอบใหม่ จึงเป็นขั้นที่ทำให้การปรับปรุงเกิดขึ้นอย่างยั่งยืน", "section": ""}, {"n": 8, "q": "ผังก้างปลา (Fishbone Diagram) ใช้เพื่อวัตถุประสงค์ใด?", "choices": ["วางแผนตารางการทำงาน", "วิเคราะห์หาความสัมพันธ์ของเหตุและผล (สาเหตุของปัญหา)", "คำนวณจุดคุ้มทุน", "จัดลำดับความสำคัญของงาน", "ออกแบบโครงสร้างองค์กร"], "answer": 1, "explanation": "ผังก้างปลา (Ishikawa Diagram) ใช้แจกแจงสาเหตุที่เป็นไปได้ของปัญหาออกเป็นหมวดหมู่ เช่น 4M เพื่อให้เห็นความสัมพันธ์ระหว่างเหตุและผลอย่างเป็นระบบ", "section": ""}, {"n": 9, "q": "หากท่านต้องตัดสินใจในสถานการณ์วิกฤตที่มีข้อมูลจำกัด ท่านควรทำอย่างไร?", "choices": ["ไม่ตัดสินใจใดๆ จนกว่าจะได้ข้อมูลครบ 100%", "ใช้ข้อมูลเท่าที่มี วิเคราะห์ความเสี่ยง และตัดสินใจโดยเตรียมแผนสำรอง", "โยนเหรียญเสี่ยงทายเพื่อความยุติธรรม", "รอให้คนอื่นตัดสินใจแทน", "เลือกใช้วิธีที่เคยได้ผลในอดีตทันที โดยไม่ประเมินสถานการณ์ปัจจุบัน"], "answer": 1, "explanation": "ในภาวะวิกฤตไม่มีทางรอข้อมูลให้ครบ 100% ได้ ผู้ตัดสินใจที่ดีจะใช้ข้อมูลที่ดีที่สุดเท่าที่มี ประเมินความเสี่ยง แล้วตัดสินใจพร้อมเตรียมแผนสำรองรองรับ", "section": ""}, {"n": 10, "q": "การระดมสมอง (Brainstorming) ที่ดี ควรมีลักษณะอย่างไร?", "choices": ["ให้หัวหน้าพูดคนเดียว", "วิจารณ์ไอเดียของผู้อื่นทันทีที่พูดจบ", "เปิดโอกาสให้ทุกคนแสดงความคิดเห็นโดยไม่ด่วนตัดสินถูกผิด", "จำกัดเวลาให้น้อยที่สุดเพื่อความรวดเร็ว", "เน้นคุณภาพไอเดียมากกว่าปริมาณตั้งแต่เริ่ม"], "answer": 2, "explanation": "หัวใจของการระดมสมองคือการเปิดกว้างและไม่ด่วนตัดสินไอเดีย (Defer Judgment) โดยเน้นปริมาณไอเดียก่อนแล้วค่อยคัดกรองภายหลัง การวิจารณ์ทันทีจะปิดกั้นความคิดของทีม", "section": ""}, {"n": 11, "q": "หลักการ Pareto (กฎ 80/20) ช่วยในการแก้ปัญหาอย่างไร?", "choices": ["ทำให้เราทำงานเพียง 20% ของเวลางาน", "ช่วยให้โฟกัสที่สาเหตุสำคัญ 20% ที่ส่งผลกระทบถึง 80%", "ช่วยลดจำนวนพนักงานลง 20%", "ช่วยเพิ่มกำไรทันที 80%", "ทำให้ไม่ต้องสนใจปัญหาย่อยๆ เลย"], "answer": 1, "explanation": "กฎ Pareto ชี้ว่าผลกระทบราว 80% มักมาจากสาเหตุเพียงราว 20% การโฟกัสทรัพยากรไปที่สาเหตุส่วนน้อยที่สำคัญที่สุดจึงให้ผลคุ้มค่าที่สุด", "section": ""}, {"n": 12, "q": "Lessons Learned (การถอดบทเรียน) ควรทำเมื่อใด?", "choices": ["เฉพาะเมื่อโครงการล้มเหลว", "เฉพาะเมื่อโครงการประสบความสำเร็จ", "ทำหลังจากเสร็จสิ้นงานหรือโครงการ ไม่ว่าจะสำเร็จหรือล้มเหลว", "ทำก่อนเริ่มงานเท่านั้น", "ทำเมื่อว่างจากงานอื่นแล้วเท่านั้น"], "answer": 2, "explanation": "บทเรียนเกิดได้ทั้งจากความสำเร็จ (เพื่อนำไปทำซ้ำ) และความล้มเหลว (เพื่อป้องกัน) จึงควรถอดบทเรียนทุกครั้งหลังจบงาน ไม่ว่าผลจะเป็นอย่างไร", "section": ""}, {"n": 13, "q": "ข้อใดไม่ใช่ขั้นตอนในการตัดสินใจอย่างเป็นระบบ?", "choices": ["ระบุปัญหา", "สร้างทางเลือก", "ใช้อารมณ์ความรู้สึกตัดสิน", "ประเมินทางเลือก", "ตัดสินใจและติดตามผล"], "answer": 2, "explanation": "การตัดสินใจอย่างเป็นระบบประกอบด้วย ระบุปัญหา สร้างทางเลือก ประเมินทางเลือก ตัดสินใจ และติดตามผล การใช้อารมณ์ความรู้สึกตัดสินไม่ใช่ขั้นตอนของกระบวนการนี้", "section": ""}, {"n": 14, "q": "การใช้ 'ประสบการณ์' (5.2) มาช่วยแก้ปัญหา ควรระวังเรื่องใดมากที่สุด?", "choices": ["ระวังว่าจะแก้ปัญหาได้เร็วเกินไป", "ระวังการยึดติดกับวิธีเดิมๆ โดยไม่ดูบริบทที่เปลี่ยนไป", "ระวังเพื่อนร่วมงานอิจฉา", "ระวังหัวหน้ามองว่าเก่งเกินไป", "ระวังข้อมูลจะสูญหาย"], "answer": 1, "explanation": "ประสบการณ์เดิมมีค่า แต่บริบทของปัญหาอาจเปลี่ยนไป สิ่งที่ต้องระวังที่สุดคือการยึดติดกับวิธีเดิมโดยไม่พิจารณาว่าสถานการณ์ปัจจุบันยังเหมือนเดิมหรือไม่", "section": ""}, {"n": 15, "q": "เมื่อพบปัญหาที่ซับซ้อนและเกินความสามารถของตนเอง ควรทำอย่างไร?", "choices": ["เก็บเงียบไว้และพยายามแก้คนเดียว", "ปรึกษาหัวหน้างานหรือผู้เชี่ยวชาญเพื่อขอคำแนะนำ", "ปล่อยทิ้งไว้เผื่อปัญหาจะหายไปเอง", "รอให้ผู้บริหารสั่งการลงมาเอง โดยไม่รายงานปัญหาให้ผู้ใดทราบ", "โทษว่าเป็นความผิดของระบบ"], "answer": 1, "explanation": "เมื่อปัญหาเกินความสามารถ การปรึกษาหัวหน้างานหรือผู้เชี่ยวชาญ (Escalation) คือวิธีที่ถูกต้อง เพราะทำให้ปัญหาได้รับการแก้ไขเร็วและถูกทาง ดีกว่าเก็บเงียบหรือปล่อยทิ้งไว้", "section": ""}, {"n": 16, "q": "ขั้นตอน 'Check' ในวงจร PDCA ตรงกับการกระทำในข้อใด?", "choices": ["การกำหนดเป้าหมาย", "การลงมือปฏิบัติงาน", "การตรวจสอบผลการดำเนินงานเทียบกับเป้าหมาย", "การปรับปรุงมาตรฐานการทำงาน", "การจัดสรรงบประมาณ"], "answer": 2, "explanation": "Check คือการตรวจสอบและวัดผลการดำเนินงานจริง แล้วนำมาเปรียบเทียบกับเป้าหมายหรือแผนที่วางไว้ เพื่อดูว่าสำเร็จตามที่คาดหรือไม่", "section": ""}, {"n": 17, "q": "การวิเคราะห์ SWOT Analysis ส่วนใดเป็นปัจจัย 'ภายใน' องค์กร?", "choices": ["โอกาส (Opportunity) และ อุปสรรค (Threat)", "จุดแข็ง (Strength) และ จุดอ่อน (Weakness)", "จุดแข็ง (Strength) และ โอกาส (Opportunity)", "จุดอ่อน (Weakness) และ อุปสรรค (Threat)", "โอกาส (Opportunity) เพียงอย่างเดียว"], "answer": 1, "explanation": "จุดแข็ง (S) และจุดอ่อน (W) เป็นปัจจัยภายในองค์กรที่ควบคุมได้ ส่วนโอกาส (O) และอุปสรรค (T) เป็นปัจจัยภายนอกที่ควบคุมไม่ได้", "section": ""}, {"n": 18, "q": "หากท่านเสนอวิธีแก้ปัญหาแล้วเพื่อนร่วมงานไม่เห็นด้วย ท่านควรทำอย่างไร?", "choices": ["เลิกยุ่งเกี่ยวกับการแก้ปัญหานั้น", "รับฟังเหตุผลของเพื่อนและนำมาปรับปรุงแนวทาง (Open-minded)", "ยืนยันกระต่ายขาเดียวว่าจะใช้วิธีเดิม", "ฟ้องหัวหน้าว่าเพื่อนไม่ให้ความร่วมมือ", "แอบทำตามวิธีของตนเองโดยไม่บอกใคร"], "answer": 1, "explanation": "การเปิดใจรับฟังเหตุผลของผู้อื่นแล้วนำมาปรับปรุงแนวทาง ทำให้ได้วิธีแก้ปัญหาที่รอบด้านขึ้นและได้รับความร่วมมือในการนำไปปฏิบัติ", "section": ""}, {"n": 19, "q": "เป้าหมายสูงสุดของการแก้ปัญหาในงานอุตสาหกรรมหรือองค์กรคือข้อใด?", "choices": ["แก้ปัญหาให้จบๆ ไปวันต่อวัน", "ป้องกันไม่ให้ปัญหาเดิมเกิดซ้ำอีก (Recurrence Prevention)", "หาคนผิดมารับโทษ", "เขียนรายงานให้ดูสวยหรู", "ลดจำนวนพนักงานให้มากที่สุด"], "answer": 1, "explanation": "เป้าหมายสูงสุดของการแก้ปัญหาคือการป้องกันไม่ให้ปัญหาเดิมเกิดซ้ำ (Recurrence Prevention) ไม่ใช่เพียงแก้เฉพาะหน้าให้ผ่านไปวัน ๆ", "section": ""}, {"n": 20, "q": "ข้อใดแสดงถึงการระบุปัญหาที่ 'ชัดเจน' ที่สุด?", "choices": ["เครื่องจักรเสียบ่อยมาก", "ยอดขายตกต่ำน่าใจหาย", "ลูกค้าไม่พอใจการบริการ", "เครื่องจักร A หยุดทำงาน 3 ครั้งในสัปดาห์นี้ เนื่องจากความร้อนสูงเกินไป", "พนักงานทำงานกันไม่ค่อยดีเลย"], "answer": 3, "explanation": "การระบุปัญหาที่ดีต้องเจาะจงและวัดได้ คือบอกได้ว่า อะไร ที่ไหน เมื่อไร บ่อยแค่ไหน (เครื่องจักร A หยุด 3 ครั้งในสัปดาห์นี้ จากความร้อนสูงเกินไป) ส่วนตัวเลือกอื่นเป็นคำบรรยายกว้าง ๆ ที่วัดไม่ได้", "section": ""}, {"n": 21, "q": "Decision Matrix (ตารางการตัดสินใจ) มีประโยชน์อย่างไร?", "choices": ["ช่วยเปรียบเทียบทางเลือกหลายทางด้วยเกณฑ์คะแนนที่ชัดเจน", "ช่วยจับเวลาในการทำงาน", "ช่วยคำนวณภาษี", "ช่วยออกแบบผลิตภัณฑ์ใหม่", "ช่วยร่างจดหมายโต้ตอบลูกค้า"], "answer": 0, "explanation": "Decision Matrix ช่วยเปรียบเทียบทางเลือกหลายทางอย่างเป็นกลาง โดยกำหนดเกณฑ์และให้คะแนนแต่ละทางเลือกตามเกณฑ์อย่างชัดเจน ลดการใช้ความรู้สึกในการตัดสินใจ", "section": ""}, {"n": 22, "q": "การนำแนวทางแก้ปัญหาไปปฏิบัติจริง (Implementation) ควรคำนึงถึงสิ่งใดเป็นหลัก?", "choices": ["ทำอย่างไรก็ได้ให้เร็วที่สุด", "ผลกระทบ ความเป็นไปได้ และแผนรองรับความเสี่ยง", "ความสะดวกสบายของผู้ปฏิบัติงานเท่านั้น", "งบประมาณที่ต่ำที่สุดโดยไม่สนคุณภาพ", "ชื่อเสียงของคนทำ"], "answer": 1, "explanation": "การนำแนวทางไปปฏิบัติต้องพิจารณาผลกระทบต่อผู้เกี่ยวข้อง ความเป็นไปได้จริง และแผนรองรับความเสี่ยง ไม่ใช่เน้นความเร็วหรือความถูกเพียงอย่างเดียว", "section": ""}, {"n": 23, "q": "เมื่อเกิดข้อผิดพลาดในการแก้ปัญหา สิ่งที่ 'ไม่ควร' ทำคืออะไร?", "choices": ["ยอมรับข้อผิดพลาด", "วิเคราะห์หาสาเหตุ", "ปกปิดข้อมูลเพื่อไม่ให้โดนตำหนิ", "หาทางแก้ไขและป้องกัน", "เรียนรู้จากความผิดพลาด"], "answer": 2, "explanation": "การปกปิดข้อมูลความผิดพลาดทำให้ปัญหาถูกแก้ล่าช้าและอาจลุกลามใหญ่ขึ้น สิ่งที่ควรทำคือยอมรับ วิเคราะห์สาเหตุ แก้ไข และเรียนรู้จากความผิดพลาด", "section": ""}, {"n": 24, "q": "ความคิดสร้างสรรค์ (Creativity) สัมพันธ์กับการแก้ปัญหาอย่างไร?", "choices": ["ไม่สัมพันธ์กัน การแก้ปัญหาต้องใช้ตรรกะเท่านั้น", "ช่วยให้คิดนอกกรอบและหาทางเลือกใหม่ๆ ได้หลากหลายขึ้น", "ทำให้การแก้ปัญหายุ่งยากซับซ้อน", "ใช้เฉพาะงานศิลปะเท่านั้น", "ทำให้เสียเวลาประชุม"], "answer": 1, "explanation": "ความคิดสร้างสรรค์ช่วยให้มองปัญหาในมุมใหม่และคิดนอกกรอบ ทำให้ได้ทางเลือกในการแก้ปัญหาที่หลากหลายกว่าการใช้ตรรกะเพียงอย่างเดียว", "section": ""}, {"n": 25, "q": "คำว่า 'Proactive Problem Solving' (การแก้ปัญหาเชิงรุก) หมายถึงอะไร?", "choices": ["รอให้ปัญหาเกิดแล้วค่อยรีบไปแก้", "การคาดการณ์แนวโน้มและป้องกันปัญหาก่อนที่จะเกิดขึ้น", "การแก้ปัญหาด้วยความก้าวร้าว", "การจ้างที่ปรึกษาจากภายนอกมาแก้ปัญหา", "การแก้ปัญหาเฉพาะหน้าไปเรื่อยๆ"], "answer": 1, "explanation": "การแก้ปัญหาเชิงรุกคือการวิเคราะห์แนวโน้มและความเสี่ยงล่วงหน้า แล้วลงมือป้องกันก่อนที่ปัญหาจะเกิดขึ้นจริง ตรงข้ามกับการตั้งรับรอแก้เมื่อเกิดปัญหาแล้ว", "section": ""}, {"n": 26, "q": "สมรรถนะข้อ 5.4 'วิธีการแก้ปัญหาอย่างเป็นระบบ' ตรงกับภาษาอังกฤษข้อใดมากที่สุด?", "choices": ["Positive Thinking", "Systematic Problem Solving", "Creative Thinking", "Teamwork Management", "Crisis Management"], "answer": 1, "explanation": "การมีวิธีการแก้ปัญหาอย่างเป็นขั้นตอนตรงกับคำว่า Systematic Problem Solving ส่วนตัวเลือกอื่นเป็นทักษะคนละด้าน เช่น การคิดบวก ความคิดสร้างสรรค์ หรือการจัดการภาวะวิกฤต", "section": ""}, {"n": 27, "q": "หากข้อมูลดิบ (Raw Data) มีความขัดแย้งกัน ท่านควรทำอย่างไร?", "choices": ["เลือกข้อมูลที่ถูกใจเราที่สุด", "ตรวจสอบแหล่งที่มาและความน่าเชื่อถือของข้อมูลอีกครั้ง (Verify)", "ใช้ค่าเฉลี่ยของข้อมูลทั้งหมด", "เลือกใช้ชุดข้อมูลที่ได้รับมาล่าสุดเสมอ โดยไม่ตรวจสอบที่มา", "ถามเพื่อนข้างๆ ว่าเชื่ออันไหน"], "answer": 1, "explanation": "เมื่อข้อมูลขัดแย้งกัน ต้องตรวจสอบ (Verify) แหล่งที่มา วิธีการเก็บ และความน่าเชื่อถือของข้อมูลแต่ละชุดก่อนนำไปใช้ ไม่ใช่เลือกตามความชอบหรือใช้ข้อมูลล่าสุดโดยไม่ตรวจสอบ", "section": ""}, {"n": 28, "q": "การถ่ายทอดความรู้ (KM) ให้ผู้อื่น ควรใช้วิธีการใดเพื่อให้เข้าใจง่ายที่สุด?", "choices": ["เขียนบรรยายเป็นข้อความยาวๆ", "ใช้ภาพประกอบ ผังงาน (Flowchart) หรือตัวอย่างประกอบ", "ใช้ศัพท์เทคนิคชั้นสูงเพื่อแสดงความรู้", "บอกปากเปล่าครั้งเดียวจบ", "ให้ไปอ่านตำราภาษาต่างประเทศเอง"], "answer": 1, "explanation": "การใช้ภาพประกอบ ผังงาน หรือตัวอย่างจริง ช่วยให้ผู้รับถ่ายทอดเห็นภาพและเข้าใจได้ง่ายกว่าการบรรยายด้วยข้อความยาว ๆ หรือศัพท์เทคนิคชั้นสูง", "section": ""}, {"n": 29, "q": "เมื่อแก้ปัญหาสำเร็จแล้ว ประโยชน์ของการให้ 'รางวัล' หรือ 'คำชมเชย' แก่ทีมงานคืออะไร?", "choices": ["เพื่อให้ทีมงานเหลิง", "เพื่อสร้างขวัญกำลังใจและแรงจูงใจในการแก้ปัญหาครั้งต่อไป", "เพื่อใช้เงินงบประมาณให้หมด", "เพื่อให้คนอื่นอิจฉา", "เพื่อใช้เป็นหลักฐานประกอบการประเมินผลงานประจำปีเท่านั้น"], "answer": 1, "explanation": "คำชมเชยและรางวัลเป็นการเสริมแรงทางบวก (Positive Reinforcement) ที่สร้างขวัญกำลังใจ และจูงใจให้ทีมกล้าลงมือแก้ปัญหาในครั้งต่อ ๆ ไป", "section": ""}, {"n": 30, "q": "ข้อใดคือลักษณะของ 'นักแก้ปัญหาที่ดี'?", "choices": ["มองโลกในแง่ร้ายไว้ก่อน", "มีสติ ใช้เหตุผล ยืดหยุ่น และมุ่งมั่นที่ผลลัพธ์", "ยึดมั่นในความคิดตนเองเป็นใหญ่", "ชอบสั่งการแต่ไม่ลงมือทำ", "หลีกเลี่ยงความขัดแย้งทุกกรณีแม้ปัญหาจะไม่จบ"], "answer": 1, "explanation": "นักแก้ปัญหาที่ดีต้องมีสติเมื่อเผชิญปัญหา ใช้เหตุผลและข้อมูล ยืดหยุ่นปรับตัวตามสถานการณ์ และมุ่งมั่นที่ผลลัพธ์มากกว่าการเอาชนะหรือหาคนผิด", "section": ""}, {"n": 31, "q": "ข้อใดคือความเสี่ยงของการมี 'Confirmation Bias' (อคติยืนยันสิ่งเดิม) ในการตัดสินใจ (5.2)?", "choices": ["ทำให้เสียเวลาหาข้อมูลนานเกินไป", "ทำให้เลือกมองหาแต่ข้อมูลที่สนับสนุนความเชื่อเดิมของตนเอง และละเลยข้อมูลด้านตรงข้าม", "ทำให้ไม่กล้าตัดสินใจ", "ทำให้เชื่อคนง่ายเกินไป", "ทำให้ใช้งบประมาณเกินตัว"], "answer": 1, "explanation": "Confirmation Bias ทำให้เราเลือกมองหาเฉพาะข้อมูลที่สนับสนุนความเชื่อเดิม และมองข้ามข้อมูลด้านตรงข้าม ส่งผลให้การประเมินสถานการณ์และการตัดสินใจผิดพลาด", "section": ""}, {"n": 32, "q": "ในการวิเคราะห์ปัญหาด้วยหลัก 4M ข้อใด *ไม่ใช่* ปัจจัย 4M หลัก?", "choices": ["Man (คน)", "Machine (เครื่องจักร)", "Method (วิธีการ)", "Money (เงิน)", "Material (วัสดุ)"], "answer": 3, "explanation": "ปัจจัย 4M หลักในการวิเคราะห์ปัญหา ได้แก่ Man (คน) Machine (เครื่องจักร) Method (วิธีการ) และ Material (วัสดุ) ส่วน Money เป็นทรัพยากรบริหาร ไม่ใช่หนึ่งใน 4M", "section": ""}, {"n": 33, "q": "เทคนิค SCAMPER ใช้ทำอะไรในการแก้ปัญหา?", "choices": ["ใช้เพื่อคำนวณต้นทุนการผลิต", "ใช้เพื่อกระตุ้นความคิดสร้างสรรค์ในการดัดแปลงหรือปรับปรุงวิธีการเดิม", "ใช้เพื่อตรวจสอบประวัติพนักงาน", "ใช้เพื่อจับเวลาการทำงาน", "ใช้เพื่อประเมินความเสี่ยงไฟไหม้"], "answer": 1, "explanation": "SCAMPER (Substitute, Combine, Adapt, Modify, Put to another use, Eliminate, Reverse) คือชุดคำถามกระตุ้นความคิดสร้างสรรค์ เพื่อดัดแปลงหรือปรับปรุงสิ่งเดิมให้เกิดแนวทางใหม่", "section": ""}, {"n": 34, "q": "Cost-Benefit Analysis (การวิเคราะห์ต้นทุน-ผลประโยชน์) จำเป็นอย่างไรก่อนตัดสินใจ (5.4)?", "choices": ["เพื่อให้แน่ใจว่าผลตอบแทนที่ได้คุ้มค่ากับทรัพยากรที่ลงทุนไป", "เพื่อให้ดูมีหลักการทางบัญชี", "เพื่อลดจำนวนพนักงาน", "เพื่อหลีกเลี่ยงการจ่ายภาษี", "เพื่อชะลอการตัดสินใจออกไปก่อน"], "answer": 0, "explanation": "การวิเคราะห์ต้นทุน-ผลประโยชน์ช่วยยืนยันก่อนตัดสินใจว่าผลตอบแทนที่จะได้รับคุ้มค่ากับทรัพยากร เวลา และงบประมาณที่ต้องลงทุนไปหรือไม่", "section": ""}, {"n": 35, "q": "เมื่อแผนหลัก (Plan A) ล้มเหลว พฤติกรรมใดแสดงถึงสมรรถนะ 5.3 ที่ดีที่สุด?", "choices": ["ยกเลิกโครงการทันที", "ดึงดันทำแผน A ต่อไปจนกว่าจะสำเร็จ", "เริ่มใช้แผนสำรอง (Plan B) หรือปรับกลยุทธ์อย่างรวดเร็ว (Agility)", "หาคนมารับผิดชอบความล้มเหลว", "นั่งรอคำสั่งใหม่จากเบื้องบน"], "answer": 2, "explanation": "เมื่อแผนหลักล้มเหลว ผู้ที่มุ่งมั่นในการแก้ปัญหาจะปรับตัวอย่างรวดเร็ว (Agility) โดยใช้แผนสำรองหรือปรับกลยุทธ์ใหม่ ไม่ดึงดันกับแผนเดิมและไม่ล้มเลิกกลางคัน", "section": ""}, {"n": 36, "q": "การใช้ 'กราฟ' หรือ 'แผนภูมิ' (Data Visualization) ดีกว่าการอ่านข้อมูลดิบเป็นตัวหนังสืออย่างไร?", "choices": ["ช่วยให้ประหยัดกระดาษ", "ช่วยให้เห็นแนวโน้ม (Trend) และความผิดปกติของข้อมูลได้รวดเร็วและชัดเจนกว่า", "ช่วยให้ข้อมูลดูน้อยลง", "ช่วยให้ไม่ต้องคำนวณเลข", "ช่วยปกปิดข้อมูลที่ไม่ดี"], "answer": 1, "explanation": "การแปลงข้อมูลเป็นกราฟหรือแผนภูมิช่วยให้มองเห็นแนวโน้ม การเปรียบเทียบ และความผิดปกติของข้อมูลได้รวดเร็วและชัดเจนกว่าการไล่อ่านตัวเลขดิบจำนวนมาก", "section": ""}, {"n": 37, "q": "จริยธรรม (Ethics) มีผลต่อการตัดสินใจแก้ปัญหาอย่างไร?", "choices": ["ไม่มีผล ขอแค่แก้ปัญหาได้ก็พอ", "ทำให้การตัดสินใจช้าลงจึงไม่ควรนำมาคิด", "เป็นกรอบที่ช่วยให้ตัดสินใจได้อย่างถูกต้อง โปร่งใส และยั่งยืนในระยะยาว", "เป็นเพียงข้อบังคับทางกฎหมาย", "เป็นเรื่องของฝ่ายบุคคลเท่านั้น"], "answer": 2, "explanation": "จริยธรรมเป็นกรอบกำกับให้การตัดสินใจถูกต้อง โปร่งใส และไม่สร้างผลเสียต่อผู้อื่นในระยะยาว การแก้ปัญหาที่ขาดจริยธรรมอาจได้ผลระยะสั้นแต่สร้างปัญหาที่ใหญ่กว่าตามมา", "section": ""}, {"n": 38, "q": "การกระจายงาน (Delegation) ในการแก้ปัญหา มีข้อดีอย่างไร?", "choices": ["เพื่อให้หัวหน้าได้พักผ่อน", "เพื่อให้พนักงานคนอื่นรับความเสี่ยงแทน", "เพื่อใช้ความเชี่ยวชาญเฉพาะด้านของแต่ละคนให้เกิดประโยชน์สูงสุด", "เพื่อลดอำนาจของหัวหน้า", "เพื่อให้งานเสร็จช้าลงแต่ละเอียดขึ้น"], "answer": 2, "explanation": "การกระจายงานที่ดีคือการมอบหมายงานให้ตรงกับความเชี่ยวชาญของแต่ละคน ทำให้แก้ปัญหาได้เร็วขึ้น มีคุณภาพขึ้น และพัฒนาศักยภาพของทีมไปพร้อมกัน", "section": ""}, {"n": 39, "q": "Kaizen (ไคเซ็น) เกี่ยวข้องกับการแก้ปัญหาอย่างไร?", "choices": ["เน้นการแก้ปัญหาใหญ่ๆ ครั้งเดียวจบ", "เน้นการปรับปรุงเปลี่ยนแปลงทีละเล็กละน้อยอย่างต่อเนื่อง", "เน้นการซื้อเครื่องจักรใหม่ราคาแพง", "เน้นการเปลี่ยนพนักงานบ่อยๆ", "เน้นการทำงานแบบญี่ปุ่นโดยไม่ปรับใช้"], "answer": 1, "explanation": "Kaizen คือปรัชญาการปรับปรุงอย่างต่อเนื่อง (Continuous Improvement) โดยเปลี่ยนแปลงทีละเล็กละน้อยแต่สม่ำเสมอ ซึ่งสะสมเป็นการพัฒนาที่ยิ่งใหญ่ในระยะยาว", "section": ""}, {"n": 40, "q": "เมื่อระบุสาเหตุของปัญหาได้แล้ว ขั้นตอนถัดไปทันทีคือข้อใด?", "choices": ["ลงโทษคนที่ทำให้เกิดสาเหตุนั้น", "จัดลำดับความสำคัญของสาเหตุและสร้างทางเลือกในการแก้ไข", "ประกาศให้ทุกคนทราบว่าใครผิด", "รื้อระบบทิ้งทั้งหมด", "ลงมือแก้ไขทุกสาเหตุพร้อมกันทันที โดยไม่จัดลำดับความสำคัญ"], "answer": 1, "explanation": "เมื่อทราบสาเหตุแล้ว ขั้นถัดไปคือจัดลำดับความสำคัญของสาเหตุ (เช่น ใช้หลัก Pareto) แล้วสร้างทางเลือกในการแก้ไข เพราะทรัพยากรมีจำกัด ไม่สามารถแก้ทุกสาเหตุพร้อมกันได้", "section": ""}, {"n": 41, "q": "สายพานลำเลียงหยุดกะทันหันบ่อยครั้ง ทีมทำ 5 Whys ได้ว่า สายพานหยุดเพราะมอเตอร์ร้อนจัดตัดการทำงาน และมอเตอร์ร้อนเพราะพัดลมระบายอากาศมีฝุ่นอุดตัน คำถาม Why ลำดับถัดไปที่ถูกต้องที่สุดคือข้อใด?", "choices": ["ทำไมไม่เปลี่ยนมอเตอร์รุ่นใหม่ที่ทนความร้อนกว่านี้", "ทำไมฝุ่นจึงสะสมที่พัดลมจนอุดตันได้", "ทำไมพนักงานทำความสะอาดจึงละเลยหน้าที่", "ทำไมโรงงานไม่ติดแอร์ลดอุณหภูมิทั้งอาคาร", "ทำไมมอเตอร์ยี่ห้อนี้จึงคุณภาพต่ำ"], "answer": 1, "explanation": "5 Whys ต้องถามต่อจากสาเหตุล่าสุดที่ยืนยันแล้วเพื่อเจาะลึกไปสู่สาเหตุเชิงระบบ การกระโดดไปเปลี่ยนอุปกรณ์หรือโทษบุคคลคือการตัดวงจรวิเคราะห์ก่อนถึงรากของปัญหา", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 42, "q": "ลูกค้าร้องเรียนว่าสินค้าส่งถึงช้า ทีมสอบสวนพบว่า รถออกจากคลังช้าเพราะแพ็กของเสร็จช้า แพ็กช้าเพราะข้อมูลคำสั่งซื้อมาถึงคลังช้า และข้อมูลมาช้าเพราะระบบส่งข้อมูลใช้การคีย์มือรวบยอดวันละครั้ง ข้อใดคือสาเหตุราก (Root Cause)?", "choices": ["รถขนส่งออกจากคลังสินค้าล่าช้า", "พนักงานแพ็กสินค้าทำงานเสร็จช้า", "ลูกค้าได้รับสินค้าช้ากว่ากำหนด", "ระบบส่งข้อมูลคำสั่งซื้อแบบคีย์มือรวบยอดวันละครั้ง", "พนักงานขับรถขาดความรับผิดชอบต่อเวลา"], "answer": 3, "explanation": "เหตุการณ์รถออกช้า แพ็กช้า และลูกค้าได้ของช้า ล้วนเป็นอาการหรือสาเหตุระหว่างทาง สาเหตุรากคือจุดต้นทางเชิงระบบที่ถ้าแก้แล้วปัญหาทั้งสายจะไม่เกิดซ้ำ", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 43, "q": "โรงงานเก็บข้อมูลของเสีย 1 เดือนพบ รอยขีดข่วน 45% ขนาดผิดสเปค 30% สีเพี้ยน 15% อื่นๆ 10% หัวหน้ามีงบและกำลังคนจำกัด ตามหลัก Pareto ควรทำอย่างไร?", "choices": ["มุ่งวิเคราะห์และแก้สาเหตุของรอยขีดข่วนกับขนาดผิดสเปคก่อน เพราะครอบคลุมของเสียราว 75%", "แก้ทุกประเภทพร้อมกันโดยแบ่งงบเท่าๆ กันให้ยุติธรรม", "เริ่มจากสีเพี้ยนก่อนเพราะเป็นปัญหาที่แก้ง่ายและเห็นผลเร็วที่สุด", "รอเก็บข้อมูลต่ออีก 6 เดือนให้มั่นใจก่อนจึงเริ่มแก้", "เรียกประชุมตักเตือนพนักงานทุกแผนกให้ระมัดระวังมากขึ้น"], "answer": 0, "explanation": "หลัก 80:20 ให้ทุ่มทรัพยากรจำกัดไปที่สาเหตุส่วนน้อยที่สร้างผลกระทบส่วนใหญ่ การกระจายงบเท่ากันหรือเลือกเรื่องง่ายก่อนทำให้ผลรวมที่ได้ต่ำกว่าที่ควร", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 44, "q": "งานเชื่อมโครงเหล็กเกิดรูพรุนเพิ่มขึ้นผิดปกติ การสอบสวนพบว่าลวดเชื่อมล็อตใหม่จากผู้ขายรายใหม่ดูดความชื้นเพราะบรรจุภัณฑ์ไม่ได้มาตรฐาน เมื่อบันทึกลงผังก้างปลาแบบ 4M สาเหตุนี้อยู่ในก้างใด?", "choices": ["คน (Man) เพราะพนักงานเป็นผู้เลือกใช้ลวดเชื่อม", "เครื่องจักร (Machine) เพราะตู้เชื่อมทำงานร่วมกับลวด", "วิธีการ (Method) เพราะเกี่ยวกับขั้นตอนการเชื่อม", "สภาพแวดล้อม เพราะความชื้นมาจากอากาศ", "วัตถุดิบ (Material) เพราะเป็นคุณสมบัติของลวดเชื่อมที่รับเข้ามา"], "answer": 4, "explanation": "ต้นเหตุอยู่ที่คุณภาพของลวดเชื่อมซึ่งเป็นปัจจัยนำเข้า จึงจัดเป็น Material แม้ความชื้นจะเกี่ยวกับสภาพแวดล้อม แต่จุดบกพร่องคือบรรจุภัณฑ์ของวัตถุดิบเอง", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 45, "q": "ทีมใช้ PDCA แก้ปัญหาของเสีย หลังปรับปรุงตามแผน ของเสียลดจาก 8% เหลือ 3% แต่เป้าหมายคือ 2% ขั้นต่อไปที่ถูกต้องคือข้อใด?", "choices": ["ประกาศความสำเร็จและยุติโครงการ เพราะลดลงมากกว่าครึ่งแล้ว", "จัดทำมาตรฐานใหม่ทันทีโดยไม่ต้องวิเคราะห์เพิ่ม เพราะวิธีนี้ได้ผลแล้ว", "วิเคราะห์ส่วนต่างที่เหลือ 1% ว่ามาจากสาเหตุใด แล้วปรับแผนหมุนวงจร PDCA รอบใหม่", "ยกเลิกแนวทางเดิมทั้งหมดแล้วเสนอซื้อเครื่องจักรใหม่แทน", "ปรับเป้าหมายเป็น 3% ให้ตรงกับผลที่ทำได้จริง"], "answer": 2, "explanation": "ขั้น Check พบว่ายังไม่ถึงเป้า ขั้น Act จึงต้องนำส่วนต่างมาวิเคราะห์และหมุนวงจรใหม่ ไม่ใช่หยุดกลางทาง ลดเป้า หรือรื้อทิ้งแนวทางที่กำลังได้ผล", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 46, "q": "สายการผลิตหลักหยุดกะทันหันโดยยังไม่ทราบสาเหตุ ขณะที่มีคำสั่งซื้อของลูกค้ารายสำคัญต้องส่งพรุ่งนี้ การตัดสินใจที่เหมาะสมที่สุดในภาวะวิกฤตนี้คือข้อใด?", "choices": ["ใช้มาตรการชั่วคราว เช่น ย้ายงานไปสายการผลิตสำรอง เพื่อรักษากำหนดส่ง พร้อมสืบหาสาเหตุรากคู่ขนานกันไป", "หยุดทุกอย่างจนกว่าจะพบสาเหตุรากแล้วจึงเริ่มผลิตใหม่ เพื่อความถูกต้องตามหลักวิชา", "เร่งเดินเครื่องต่อทันทีแม้เสี่ยงผลิตของเสีย เพราะกำหนดส่งสำคัญที่สุด", "เรียกฝ่ายซ่อมบำรุงมาชี้แจงความบกพร่องก่อนดำเนินการใดๆ", "แจ้งยกเลิกคำสั่งซื้อกับลูกค้าเพื่อไม่ให้เกิดความเสียหายเพิ่ม"], "answer": 0, "explanation": "ภาวะวิกฤตต้องแยกการควบคุมความเสียหายเฉพาะหน้าออกจากการแก้สาเหตุราก แล้วทำคู่ขนานกัน การรอจนรู้สาเหตุหรือฝืนผลิตต่อล้วนสร้างความเสี่ยงที่ไม่จำเป็น", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 47, "q": "ชิ้นงานพลาสติกมีร่องรอยไหม้จากความร้อนเกิน แต่เซนเซอร์อุณหภูมิของเครื่องแสดงค่าปกติตลอด ขณะที่พนักงานคุมเครื่องยืนยันว่ารู้สึกว่าเครื่องร้อนกว่าปกติ ควรทำอย่างไรก่อนสรุปสาเหตุ?", "choices": ["เชื่อค่าจากเซนเซอร์เพราะเป็นข้อมูลดิจิทัลย่อมแม่นยำกว่าความรู้สึกคน", "เชื่อพนักงานเพราะมีประสบการณ์คุมเครื่องมานานกว่าสิบปี", "ใช้ค่ากลางระหว่างสองแหล่งข้อมูลเพื่อความเป็นธรรม", "ตรวจสอบระบบการวัดโดยสอบเทียบเซนเซอร์และวัดซ้ำด้วยเครื่องมือวัดอิสระอีกตัว", "ย้ายพนักงานคนดังกล่าวไปคุมเครื่องอื่นเพื่อตัดตัวแปร"], "answer": 3, "explanation": "เมื่อข้อมูลขัดแย้งกับหลักฐานทางกายภาพ ต้องสงสัยความน่าเชื่อถือของระบบการวัดก่อน การสอบเทียบและวัดซ้ำด้วยแหล่งอิสระคือวิธียุติข้อขัดแย้งด้วยข้อเท็จจริง", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 48, "q": "ช่างซ่อมเครื่อง CNC ที่เสียซ้ำได้สำเร็จโดยพบว่าเกิดจากการตั้งค่าพารามิเตอร์หลังเปลี่ยนทูลไม่ถูกต้อง ข้อใดคือการจัดการความรู้ที่ป้องกันปัญหาซ้ำได้ดีที่สุด?", "choices": ["ให้ช่างคนดังกล่าวเป็นผู้ซ่อมเครื่องนี้แต่เพียงผู้เดียวต่อไป เพราะรู้ปัญหาดีที่สุด", "จัดทำวิธีตั้งค่าที่ถูกต้องเป็นมาตรฐานการทำงาน อบรมช่างทุกกะ และบันทึกบทเรียนลงระบบที่ทุกคนค้นได้", "ตักเตือนช่างที่ตั้งค่าผิดเพื่อไม่ให้เกิดความประมาทอีก", "สำรองอะไหล่ชุดที่เสียบ่อยไว้ให้มากขึ้นเพื่อซ่อมได้เร็ว", "แจ้งผลการซ่อมในที่ประชุมประจำสัปดาห์หนึ่งครั้งถือว่าเพียงพอ"], "answer": 1, "explanation": "การป้องกันปัญหาซ้ำต้องเปลี่ยนความรู้ในตัวบุคคลให้เป็นมาตรฐานและระบบที่องค์กรเข้าถึงได้ การพึ่งคนคนเดียวหรือบอกปากเปล่าทำให้ความรู้หายไปพร้อมกับคน", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 49, "q": "ผู้จัดการสั่งทีมแก้ปัญหาโดยบอกเพียงว่า \"ยอดขายตก ไปแก้มา\" ข้อใดคือการนิยามปัญหาที่ดีที่สุดสำหรับเริ่มกระบวนการแก้ปัญหา?", "choices": ["ยอดขายของบริษัทไม่ดีเท่าที่ควรจะเป็น", "ปัญหาคือเรายังไม่ได้จัดโปรโมชันลดราคาแข่งกับคู่แข่ง", "พนักงานขายขาดความกระตือรือร้นทำให้ยอดตก", "ยอดขายตกเพราะเศรษฐกิจไม่ดี ซึ่งอยู่นอกเหนือการควบคุม", "ยอดขายสาขา ก. ไตรมาส 2 ลดลง 18% เทียบกับไตรมาส 1 โดยลดเฉพาะกลุ่มสินค้าอะไหล่แต่ง"], "answer": 4, "explanation": "นิยามปัญหาที่ดีต้องระบุอย่างเจาะจงว่าอะไร ที่ไหน เมื่อใด มากเท่าใด เทียบกับฐานใด ข้อที่ฝังคำตอบไว้ล่วงหน้าหรือโทษบุคคลคือการด่วนสรุปก่อนวิเคราะห์", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 50, "q": "ทีมทำ 5 Whys: ของเสียเพิ่ม → เพราะค่าตั้งเครื่องคลาดเคลื่อน → เพราะพนักงานใหม่ตั้งค่าไม่ถูก → เพราะไม่มีคู่มือมาตรฐานการตั้งค่าและไม่มีระบบสอนงาน ควรหยุดถาม Why ที่จุดใด?", "choices": ["หยุดที่ \"พนักงานใหม่ตั้งค่าไม่ถูก\" เพราะระบุตัวผู้ทำผิดได้แล้ว", "หยุดที่ \"ค่าตั้งเครื่องคลาดเคลื่อน\" เพราะเป็นสาเหตุทางเทคนิคโดยตรง", "หยุดที่ \"ไม่มีคู่มือมาตรฐานและระบบสอนงาน\" เพราะเป็นสาเหตุเชิงระบบที่องค์กรแก้ได้และตัดวงจรการเกิดซ้ำ", "ห้ามหยุด ต้องถามให้ครบ 5 ครั้งเสมอตามชื่อเครื่องมือ", "หยุดตั้งแต่ \"ของเสียเพิ่ม\" แล้วเพิ่มการตรวจสอบชิ้นงาน 100%"], "answer": 2, "explanation": "จุดหยุดของ 5 Whys คือเมื่อถึงสาเหตุเชิงระบบที่แก้แล้วป้องกันการเกิดซ้ำได้ ไม่ใช่จำนวนครั้งตายตัว และไม่ควรหยุดแค่ระดับตัวบุคคลหรืออาการ", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 51, "q": "เครื่องบรรจุรั่วซึมทำสินค้าเสียหาย มีทางเลือก ก. ซ่อมด่วนราคาถูกเสร็จใน 1 วัน แต่มีโอกาสรั่วซ้ำ 40% และทางเลือก ข. เปลี่ยนชุดซีลระบบใหม่ใช้เวลา 2 สัปดาห์ แก้ขาดแต่ต้องหยุดไลน์ ลูกค้าจะเข้าตรวจโรงงานในอีก 6 เดือน ควรตัดสินใจอย่างไร?", "choices": ["เลือก ก. อย่างเดียว เพราะเร็วและถูก ปัญหาในอนาคตค่อยว่ากัน", "เลือก ข. ทันทีโดยหยุดไลน์ 2 สัปดาห์ แม้จะผิดนัดส่งของลูกค้าทั้งหมด", "ไม่เลือกทั้งสองทาง รอดูว่าอาการรั่วจะหายไปเองหรือไม่", "ใช้ ก. เป็นมาตรการชั่วคราวเพื่อเดินเครื่องต่อ พร้อมวางแผนทำ ข. ในช่วงหยุดผลิตตามแผนก่อนการตรวจโรงงาน", "โอนความรับผิดชอบให้ฝ่ายซ่อมบำรุงตัดสินใจเองทั้งหมด"], "answer": 3, "explanation": "การตัดสินใจที่ดีผสานมาตรการชั่วคราวเพื่อคุมความเสี่ยงระยะสั้นกับการแก้ถาวรที่วางจังหวะเวลาให้กระทบน้อยที่สุด ไม่ใช่เลือกสุดขั้วทางใดทางหนึ่ง", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 52, "q": "ทีมทำแผนภูมิ Pareto ข้อร้องเรียนลูกค้า พบว่าหมวด \"อื่นๆ\" สูงถึง 35% เป็นแท่งที่สูงที่สุด สมาชิกเสนอให้เริ่มแก้หมวดอื่นๆ ก่อน ข้อใดคือการดำเนินการที่ถูกต้อง?", "choices": ["แตกหมวด \"อื่นๆ\" ออกเป็นหมวดย่อยแล้วจัดกลุ่มข้อมูลใหม่ก่อน เพราะหมวดนี้รวมหลายสาเหตุปะปนกันจนวิเคราะห์ไม่ได้", "ทำตามข้อเสนอ เพราะหลัก Pareto ให้แก้แท่งที่สูงที่สุดก่อนเสมอ", "ตัดหมวดอื่นๆ ทิ้งจากแผนภูมิเพราะไม่มีความหมาย", "สรุปว่าข้อมูลใช้ไม่ได้และกลับไปใช้ประสบการณ์ตัดสินแทน", "แก้หมวดที่เล็กที่สุดก่อนเพื่อลดจำนวนหมวดในแผนภูมิ"], "answer": 0, "explanation": "หมวดอื่นๆ ที่ใหญ่ผิดปกติสะท้อนว่าการจัดหมวดข้อมูลยังหยาบเกินไป ต้องแยกย่อยให้เห็นสาเหตุจริงก่อน มิฉะนั้นจะทุ่มทรัพยากรไปกับกลุ่มที่ไม่รู้ว่าข้างในคืออะไร", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 53, "q": "วันพุธที่ผ่านมาของเสียพุ่งขึ้นเป็น 7% จากปกติราว 3% หัวหน้าสั่งเปลี่ยนผู้ขายวัตถุดิบทันทีเพราะเพิ่งรับวัตถุดิบล็อตใหม่มา ข้อใดคือข้อบกพร่องของการตัดสินใจนี้?", "choices": ["ไม่บกพร่อง เพราะการตัดสินใจเร็วคือหัวใจของการแก้ปัญหา", "บกพร่องเพราะควรเปลี่ยนพนักงานคุมเครื่องด้วยพร้อมกัน", "ยังไม่ได้ตรวจสอบด้วยข้อมูลย้อนหลังว่าค่า 7% ผิดปกติจริงหรืออยู่ในความผันแปรปกติ และยังไม่พิสูจน์ความเชื่อมโยงกับวัตถุดิบล็อตใหม่", "บกพร่องเพราะควรรอให้ของเสียเกิน 10% ก่อนจึงลงมือ", "บกพร่องเพราะการเปลี่ยนผู้ขายต้องขออนุมัติผู้บริหารระดับสูงเท่านั้น"], "answer": 2, "explanation": "ค่าที่กระโดดหนึ่งครั้งอาจเป็นความผันแปรปกติหรือเหตุพิเศษก็ได้ ต้องเทียบกับข้อมูลในอดีตและพิสูจน์ความสัมพันธ์เชิงเหตุผลก่อน การสรุปจากความบังเอิญเชิงเวลาคือการด่วนสรุป", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 54, "q": "โรงแรมถูกร้องเรียนว่าเช็คอินช้าเฉพาะวันเสาร์-อาทิตย์ ข้อมูลพบว่าจำนวนพนักงานเท่ากันทุกวัน แต่แขกวันหยุดกว่า 70% มาถึงกระจุกตัวช่วง 14:00-16:00 น. ข้อใดคือสาเหตุรากที่สอดคล้องกับข้อมูลที่สุด?", "choices": ["พนักงานต้อนรับวันหยุดขี้เกียจกว่าวันธรรมดา", "ระบบคอมพิวเตอร์ของโรงแรมเก่าและช้า", "แขกวันหยุดเรื่องมากและใช้เวลาสอบถามนานกว่าปกติ", "จำนวนเคาน์เตอร์เช็คอินมีน้อยเกินไปต้องสร้างเพิ่มทันที", "การจัดกำลังคนเป็นแบบคงที่ ไม่สอดคล้องกับช่วงเวลาที่แขกมาถึงกระจุกตัว"], "answer": 4, "explanation": "ข้อมูลชี้ว่าปัญหาเกิดจากความไม่สมดุลระหว่างกำลังคนกับรูปแบบการมาถึงของแขก ซึ่งเป็นสาเหตุเชิงระบบ ส่วนการโทษพนักงานหรือแขกเป็นการโทษบุคคลโดยไม่มีข้อมูลรองรับ", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 55, "q": "ทีมทำ 5 Whys เรื่องส่งมอบงานผิดรุ่น แล้วสรุปจบที่ \"เพราะพนักงานประมาทเลินเล่อ\" พร้อมเสนอมาตรการกำชับให้รอบคอบขึ้น ข้อใดคือจุดอ่อนสำคัญของการวิเคราะห์นี้?", "choices": ["ใช้จำนวน Why น้อยเกินไป ควรถามให้ครบ 5 ครั้งก่อนเสมอ", "หยุดการวิเคราะห์ที่ตัวบุคคล ควรถามต่อว่าระบบงานใดเปิดช่องให้ความผิดพลาดเกิดง่าย เช่น ไม่มีมาตรฐานหรือกลไกป้องกันความผิดพลาด", "สรุปเร็วเกินไป ควรประชุมเพิ่มอีกหลายรอบก่อนตัดสิน", "ไม่ได้ระบุชื่อพนักงานที่ประมาทให้ชัดเจนเพื่อลงโทษ", "ไม่ได้ใช้แผนภูมิ Pareto ประกอบซึ่งเป็นข้อบังคับของ 5 Whys"], "answer": 1, "explanation": "คำตอบที่จบด้วย \"ความประมาทของคน\" มักเป็นสัญญาณว่ายังวิเคราะห์ไม่ถึงราก เพราะระบบที่ดีต้องออกแบบให้คนพลาดได้ยาก มาตรการกำชับอย่างเดียวจึงไม่กันปัญหาซ้ำ", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 56, "q": "ทีมแก้ปัญหาของเสียงานพ่นสี ได้เก็บข้อมูล วางแผนปรับหัวพ่นและทดลองใช้จริงมา 2 สัปดาห์ ขณะนี้กำลังเปรียบเทียบอัตราของเสียก่อนและหลังการปรับปรุงกับเป้าหมาย กิจกรรมนี้อยู่ในขั้นตอนใดของ PDCA?", "choices": ["Plan เพราะยังต้องใช้ข้อมูลไปวางแผนต่อ", "Do เพราะยังอยู่ระหว่างการทดลองปฏิบัติ", "Check เพราะเป็นการตรวจสอบผลลัพธ์เทียบกับเป้าหมายที่วางไว้", "Act เพราะเป็นขั้นตอนสุดท้ายของโครงการ", "ไม่อยู่ในวงจร PDCA เพราะเป็นงานด้านสถิติ"], "answer": 2, "explanation": "การวัดผลหลังการปรับปรุงและเทียบกับเป้าหมายคือหัวใจของขั้น Check ซึ่งเป็นข้อมูลตั้งต้นในการตัดสินใจขั้น Act ว่าจะจัดทำมาตรฐานหรือปรับแผนหมุนรอบใหม่", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 57, "q": "เครื่องยนต์ปั๊มน้ำในไซต์งานร้อนจัดและน้ำหล่อเย็นพร่องซ้ำๆ ทุกสัปดาห์ ช่างแก้โดยเติมน้ำหล่อเย็นทุกครั้งแล้วใช้งานต่อมาตลอด 2 เดือน ข้อใดวิเคราะห์สถานการณ์นี้ได้ถูกต้องที่สุด?", "choices": ["การเติมน้ำหล่อเย็นคือการแก้ที่อาการ สาเหตุรากเช่นรอยรั่วหรือฝาหม้อน้ำเสื่อมยังไม่ถูกค้นหา ปัญหาจึงวนกลับมาซ้ำ", "ช่างแก้ปัญหาถูกต้องแล้ว เพราะเครื่องกลับมาใช้งานได้ทุกครั้ง", "ปัญหานี้เป็นเรื่องปกติของเครื่องจักรเก่า ไม่จำเป็นต้องวิเคราะห์", "สาเหตุรากคือช่างขาดความขยันในการเติมน้ำให้ถี่ขึ้น", "ควรเปลี่ยนยี่ห้อน้ำหล่อเย็นเป็นเกรดแพงขึ้นก่อนสิ่งอื่นใด"], "answer": 0, "explanation": "น้ำหล่อเย็นพร่องซ้ำเป็นอาการที่บอกว่ามีต้นเหตุ เช่น การรั่วซึมในระบบ การเติมทดแทนทำให้เครื่องเดินต่อได้ชั่วคราวแต่ไม่ตัดวงจรปัญหา และเสี่ยงเสียหายหนักขึ้น", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 58, "q": "ฝ่ายผลิตรายงานของเสีย 2% แต่ฝ่ายประกันคุณภาพรายงาน 6% ในเดือนเดียวกัน ทำให้ที่ประชุมโต้เถียงกันว่าใครถูก ขั้นตอนแรกที่ควรทำคือข้อใด?", "choices": ["ยึดตัวเลขฝ่ายประกันคุณภาพเพราะเป็นหน่วยงานกลาง", "ยึดตัวเลขฝ่ายผลิตเพราะอยู่หน้างานใกล้ชิดข้อมูลที่สุด", "รายงานผู้บริหารให้ตัดสินว่าจะเชื่อฝ่ายใด", "ตรวจสอบว่าทั้งสองฝ่ายใช้นิยามของเสีย จุดเก็บข้อมูล และวิธีนับแบบเดียวกันหรือไม่", "ใช้ค่าเฉลี่ย 4% เป็นตัวเลขทางการเพื่อยุติข้อขัดแย้ง"], "answer": 3, "explanation": "ข้อมูลขัดแย้งกันมักเกิดจากนิยามและวิธีเก็บที่ต่างกัน เช่น นับก่อนหรือหลังงานซ่อมแก้ ต้องทำนิยามเชิงปฏิบัติให้ตรงกันก่อน ไม่ใช่ตัดสินด้วยอำนาจหรือถัวเฉลี่ยตัวเลข", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 59, "q": "โรงงานอาหารพบผลตรวจเบื้องต้นน่าสงสัยว่าสินค้าล็อตหนึ่งอาจปนเปื้อน แต่ผลยืนยันต้องรออีก 24 ชั่วโมง ขณะที่ล็อตนี้มีกำหนดส่งขึ้นรถบ่ายวันนี้ ควรตัดสินใจอย่างไร?", "choices": ["ปล่อยส่งตามกำหนด เพราะยังไม่มีหลักฐานยืนยันว่าปนเปื้อนจริง", "กักสินค้าล็อตที่สงสัยไว้ก่อนและเร่งกระบวนการตรวจยืนยัน เพราะความเสี่ยงต่อผู้บริโภครุนแรงกว่าต้นทุนของการส่งช้า", "ส่งสินค้าไปครึ่งล็อตเพื่อแบ่งความเสี่ยงให้พอดี", "สั่งทำลายสินค้าทั้งล็อตทันทีเพื่อความปลอดภัยสูงสุด", "ให้พนักงานขายเป็นผู้เลือกว่าลูกค้ารายใดควรได้รับสินค้าล็อตนี้"], "answer": 1, "explanation": "การตัดสินใจภายใต้ข้อมูลไม่ครบต้องชั่งความรุนแรงของผลเสียแต่ละทาง ความเสี่ยงด้านความปลอดภัยอาหารที่ย้อนกลับไม่ได้ย่อมหนักกว่าการส่งช้า แต่การทำลายทิ้งก่อนรู้ผลก็เกินกว่าเหตุ", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 60, "q": "ช่างอาวุโสผู้เดียวที่วินิจฉัยอาการเสียของเครื่องรุ่นเก่าได้จะเกษียณในอีก 3 เดือน ข้อใดคือแนวทางจัดการความรู้ (KM) ที่เหมาะสมที่สุด?", "choices": ["จ้างช่างอาวุโสกลับมาเป็นที่ปรึกษาทางโทรศัพท์หลังเกษียณไปเรื่อยๆ", "ซื้อเครื่องจักรรุ่นใหม่มาแทนทั้งหมดเพื่อตัดปัญหา", "ให้ช่างอาวุโสเขียนบันทึกส่งครั้งเดียวก่อนวันเกษียณ", "ประกาศรับสมัครช่างใหม่ที่มีประสบการณ์เครื่องรุ่นเดียวกัน", "เร่งถ่ายทอดความรู้ฝังลึกให้เป็นความรู้ชัดแจ้ง เช่น จัดทำคู่มืออาการเสีย ถ่ายวิดีโอการวินิจฉัย และให้ช่างรุ่นใหม่ฝึกปฏิบัติคู่กันแบบพี่เลี้ยง"], "answer": 4, "explanation": "ความรู้จากประสบการณ์เป็น Tacit Knowledge ที่ต้องถ่ายโอนผ่านทั้งการบันทึกเป็นสื่อและการฝึกปฏิบัติคู่กัน การเขียนส่งครั้งเดียวหรือพึ่งโทรศัพท์ไม่สามารถถ่ายทอดทักษะวินิจฉัยได้จริง", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 61, "q": "ข้อมูลของเสียพบว่า ตำหนิผิว เกิด 120 ครั้ง/เดือน เสียหายชิ้นละ 15 บาท ส่วน แกนเพลาแตก เกิดเพียง 6 ครั้ง/เดือน แต่ต้องทิ้งทั้งชุด เสียหายครั้งละ 9,000 บาท หากใช้ Pareto จัดลำดับ ควรทำอย่างไร?", "choices": ["ทำ Pareto โดยถ่วงน้ำหนักด้วยมูลค่าความเสียหาย ซึ่งจะพบว่าแกนเพลาแตกสร้างความเสียหายรวมสูงกว่ามาก จึงควรได้รับความสำคัญก่อน", "เลือกแก้ตำหนิผิวก่อน เพราะความถี่ 120 ครั้งสูงกว่าอย่างชัดเจน", "แก้พร้อมกันทั้งสองเรื่องด้วยทรัพยากรเท่ากัน", "ไม่ต้องใช้ Pareto เพราะมีข้อมูลเพียงสองประเภท", "เลือกแก้ตำหนิผิวเพราะมูลค่าต่อชิ้นถูกกว่า แก้แล้วเสี่ยงน้อยกว่า"], "answer": 0, "explanation": "Pareto ไม่จำเป็นต้องเรียงตามความถี่เสมอไป การถ่วงด้วยมูลค่าความเสียหายทำให้เห็นว่าแกนเพลาแตกเสียหาย 54,000 บาท/เดือน สูงกว่าตำหนิผิวที่ 1,800 บาท/เดือนอย่างมาก", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 62, "q": "ระหว่างระดมสมองสร้างผังก้างปลาเรื่องงานประกอบหลุดสเปค สมาชิกคนหนึ่งเสนอให้โหวตเลือกสาเหตุที่จริงที่สุดจากในผังแล้วลงมือแก้ทันที ข้อใดคือคำแนะนำที่ถูกต้อง?", "choices": ["เห็นด้วย เพราะเสียงส่วนใหญ่ย่อมชี้สาเหตุที่ถูกต้องได้", "เห็นด้วย แต่ควรให้หัวหน้างานเป็นผู้เลือกแทนการโหวต", "ไม่เห็นด้วย เพราะผังก้างปลาให้เพียงสาเหตุที่เป็นไปได้ ต้องคัดกรองแล้วพิสูจน์ด้วยข้อมูลจริงหน้างานก่อนสรุปว่าสาเหตุใดเป็นจริง", "ไม่เห็นด้วย เพราะควรแก้ทุกสาเหตุในผังพร้อมกันทั้งหมด", "ไม่เห็นด้วย เพราะผังก้างปลาใช้ได้เฉพาะปัญหาด้านเครื่องจักรเท่านั้น"], "answer": 2, "explanation": "ผังก้างปลาเป็นเครื่องมือรวบรวมสมมติฐาน ไม่ใช่เครื่องมือพิสูจน์ การตัดสินด้วยการโหวตหรือความอาวุโสโดยไม่ตรวจสอบข้อมูลคือการด่วนสรุปที่เสี่ยงแก้ผิดจุด", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 63, "q": "ปั๊มลมโรงงานเสียด้วยอาการเดิมเป็นครั้งที่ 3 ในรอบ 4 เดือน ทั้งที่ทุกครั้งช่างเปลี่ยนอะไหล่ชุดเดิมแล้วเครื่องก็กลับมาใช้ได้ ข้อใดคือสิ่งที่ควรทำต่างไปจากเดิม?", "choices": ["เปลี่ยนอะไหล่ยี่ห้อแพงขึ้นในการซ่อมครั้งต่อไป", "กำหนดรอบเปลี่ยนอะไหล่ชุดนี้ให้ถี่ขึ้นเป็นทุก 1 เดือน", "เปลี่ยนตัวช่างผู้รับผิดชอบเพราะซ่อมแล้วไม่หายขาด", "ทำใจยอมรับเพราะปั๊มลมใช้งานหนักย่อมเสียเป็นธรรมดา", "ยอมรับว่าการซ่อมที่ผ่านมาแก้เพียงอาการ แล้วรวบรวมข้อมูลการเสียทั้ง 3 ครั้งมาวิเคราะห์หาสาเหตุรากว่าเหตุใดอะไหล่ชุดนี้จึงพังซ้ำ"], "answer": 4, "explanation": "อะไหล่ตัวเดียวพังซ้ำเป็นสัญญาณว่ามีต้นเหตุอื่น เช่น การติดตั้ง แรงดันผิดปกติ หรือสภาพแวดล้อม การเปลี่ยนอะไหล่ถี่ขึ้นหรือแพงขึ้นคือการจ่ายค่าอาการไปเรื่อยๆ โดยไม่ตัดวงจร", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 64, "q": "งานกลึงเพลามีของเสียจากขนาดเกินพิกัดเพิ่มขึ้น การวิเคราะห์ชี้ว่าจิ๊กจับยึดชิ้นงานหลวมคลอนตามอายุการใช้งาน ข้อใดคือทางเลือกแก้ปัญหาที่จัดการสาเหตุรากโดยตรง?", "choices": ["เพิ่มพนักงานตรวจสอบขนาดชิ้นงาน 100% ทุกชิ้นก่อนส่งมอบ", "ซ่อมปรับปรุงจิ๊กจับยึดให้ได้มาตรฐาน พร้อมกำหนดรอบตรวจสภาพจิ๊กเชิงป้องกัน", "จัดโอทีให้พนักงานคัดแยกชิ้นงานดีออกจากชิ้นงานเสียทุกเย็น", "ขยายพิกัดความคลาดเคลื่อนในแบบงานให้กว้างขึ้นเพื่อให้ของผ่านเกณฑ์", "ชะลอการแก้ไขไว้รอรวมกับแผนซื้อเครื่องกลึงใหม่ปีหน้า"], "answer": 1, "explanation": "การตรวจ 100% และการคัดแยกเป็นเพียงการดักจับอาการที่ปลายทางซึ่งเพิ่มต้นทุนแต่ไม่ลดการเกิดของเสีย การแก้ที่จิ๊กพร้อมระบบตรวจเชิงป้องกันคือการตัดสาเหตุที่ต้นทาง", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 65, "q": "คลังสินค้าส่งอะไหล่ผิดรุ่นให้ลูกค้าบ่อย ทีมทำ 5 Whys: ส่งผิดรุ่น → เพราะพนักงานหยิบผิด → เพราะฉลากสองรุ่นหน้าตาคล้ายกันมากและวางชิดกัน คำถาม Why ถัดไปที่ควรถามคือข้อใด?", "choices": ["ทำไมพนักงานจึงไม่ตั้งใจอ่านฉลากให้ละเอียดกว่านี้", "ทำไมลูกค้าจึงสั่งสองรุ่นนี้พร้อมกันบ่อย", "ทำไมไม่จ้างพนักงานเพิ่มมาช่วยตรวจซ้ำก่อนส่ง", "ทำไมระบบการออกแบบฉลากและการจัดวางสินค้าจึงยอมให้สินค้าคนละรุ่นดูคล้ายและอยู่ชิดกันจนหยิบสลับได้ง่าย", "ทำไมบริษัทไม่เลิกขายรุ่นใดรุ่นหนึ่งไปเลย"], "answer": 3, "explanation": "เมื่อพบเงื่อนไขที่ทำให้คนพลาดง่าย ต้องเจาะต่อไปที่ระบบซึ่งสร้างเงื่อนไขนั้น การย้อนกลับไปโทษความตั้งใจของพนักงานหรือเพิ่มคนตรวจซ้ำคือการแก้ที่อาการและเพิ่มต้นทุน", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 66, "q": "เกิดปัญหาคุณภาพที่ลูกค้าเร่งขอคำตอบภายในวันนี้ แต่ข้อมูลที่มียังไม่ครบถ้วน ผลทดสอบสำคัญจะออกในอีก 3 วัน ผู้จัดการควรปฏิบัติอย่างไร?", "choices": ["ปฏิเสธการให้คำตอบใดๆ จนกว่าข้อมูลจะครบ 100%", "เดาคำตอบที่ลูกค้าอยากได้ยินไปก่อนเพื่อรักษาความสัมพันธ์", "ตอบโดยอ้างว่าปัญหาเกิดจากความผิดพลาดของพนักงานรายบุคคลซึ่งลงโทษไปแล้ว", "ส่งข้อมูลดิบทั้งหมดให้ลูกค้าวิเคราะห์เองเพื่อความโปร่งใส", "ตัดสินใจบนข้อมูลที่ดีที่สุดที่มีขณะนี้ แจ้งมาตรการควบคุมชั่วคราว ระบุสมมติฐานและความเสี่ยงอย่างตรงไปตรงมา พร้อมนัดหมายอัปเดตเมื่อผลทดสอบออก"], "answer": 4, "explanation": "การตัดสินใจภายใต้ข้อมูลไม่ครบที่ดีคือใช้ข้อมูลที่มีอย่างโปร่งใส แถลงพร้อมเงื่อนไขและจุดทบทวน ไม่ใช่นิ่งเฉยรอความสมบูรณ์ เดาเอาใจลูกค้า หรือโยนความผิดให้บุคคล", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 67, "q": "รายงานสรุปว่าอัตราของเสียเฉลี่ยทั้งเดือนอยู่ที่ 3% ซึ่งอยู่ในเกณฑ์ยอมรับ ผู้จัดการจึงจะปิดประเด็น แต่พนักงานแย้งว่าเฉพาะกะดึกของเสียสูงถึง 9% ทุกสัปดาห์ ข้อใดคือบทเรียนด้านการใช้ข้อมูลจากกรณีนี้?", "choices": ["ควรเชื่อค่าเฉลี่ยเพราะเป็นตัวเลขที่สรุปภาพรวมได้ดีที่สุด", "ควรตัดข้อมูลกะดึกออกเพราะเป็นค่าผิดปกติที่รบกวนภาพรวม", "ค่าเฉลี่ยรวมอาจกลบรูปแบบของปัญหา จึงต้องแยกดูข้อมูลตามกลุ่ม เช่น ตามกะ เครื่อง หรือช่วงเวลา ก่อนสรุปว่าไม่มีปัญหา", "พนักงานไม่มีหน้าที่แย้งรายงานที่ฝ่ายวิเคราะห์จัดทำแล้ว", "ควรเปลี่ยนเกณฑ์ยอมรับเป็น 9% เพื่อให้ครอบคลุมทุกกะ"], "answer": 2, "explanation": "การจำแนกข้อมูล (Stratification) เป็นหัวใจของการวิเคราะห์เชิงสถิติ เพราะค่าเฉลี่ยรวมของหลายกลุ่มที่ต่างกันมากอาจดูปกติทั้งที่มีกลุ่มหนึ่งผิดปกติรุนแรง", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 68, "q": "บริษัทมีระบบบันทึกบทเรียน (Lesson Learned) ครบถ้วน แต่ปัญหาแบบเดิมยังเกิดซ้ำในกะอื่นและสาขาอื่นเสมอ ข้อใดคือการปรับปรุงการจัดการความรู้ที่ตรงจุดที่สุด?", "choices": ["เชื่อมบทเรียนเข้าสู่การใช้งานจริง เช่น ปรับมาตรฐานการทำงาน สอดแทรกในการอบรม และทบทวนก่อนเริ่มงานลักษณะเดียวกัน", "สั่งให้ทุกแผนกเขียนรายงานบทเรียนให้ยาวและละเอียดขึ้นกว่าเดิม", "ย้ายไฟล์บทเรียนทั้งหมดขึ้นระบบคลาวด์ที่มีความจุมากขึ้น", "ลงโทษกะหรือสาขาที่ทำปัญหาเดิมซ้ำเพื่อให้หลาบจำ", "ยกเลิกระบบบันทึกบทเรียนเพราะพิสูจน์แล้วว่าไม่ได้ผล"], "answer": 0, "explanation": "KM ล้มเหลวบ่อยที่สุดตรงขั้นนำความรู้ไปใช้ ไม่ใช่ขั้นจัดเก็บ บทเรียนต้องถูกแปลงเป็นมาตรฐาน การอบรม และกิจกรรมทบทวนที่ฝังในงานประจำจึงจะกันปัญหาซ้ำได้", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 69, "q": "ผู้บริหารแจ้งว่า \"ช่วงนี้ลูกค้าร้องเรียนเยอะขึ้น รีบไปจัดการ\" ก่อนลงมือแก้ปัญหา คำถามชุดใดช่วยนิยามปัญหาได้ดีที่สุด?", "choices": ["ใครคือพนักงานที่ทำให้ลูกค้าไม่พอใจ และจะลงโทษอย่างไร", "จะชดเชยลูกค้าที่ร้องเรียนด้วยของกำนัลมูลค่าเท่าใด", "ฝ่ายใดควรเป็นผู้รับผิดชอบปัญหานี้แทนฝ่ายเรา", "ข้อร้องเรียนเพิ่มขึ้นจากฐานเดิมเท่าใด เริ่มเมื่อใด กระจุกตัวที่สินค้า บริการ หรือสาขาใด และเป็นเรื่องประเภทใดบ้าง", "จะเขียนประกาศขอโทษลูกค้าผ่านช่องทางใดจึงเหมาะสม"], "answer": 3, "explanation": "การนิยามปัญหาต้องเปลี่ยนคำบอกเล่ากว้างๆ ให้เป็นข้อเท็จจริงที่วัดได้และระบุขอบเขตชัด ส่วนการหาคนผิดหรือรีบชดเชยเป็นการข้ามขั้นไปสู่ปฏิกิริยาก่อนเข้าใจปัญหา", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 70, "q": "รถโฟล์คลิฟท์เสียบ่อยเพราะขาดการอัดจาระบีตามรอบ การสอบสวนพบว่าตารางหล่อลื่นที่ติดประกาศไว้ระบุแค่ \"อัดจาระบีสม่ำเสมอ\" โดยไม่กำหนดรอบเวลา จุดอัด และผู้รับผิดชอบที่ชัดเจน สาเหตุรากนี้จัดอยู่ในปัจจัยใดของ 4M?", "choices": ["คน (Man) เพราะพนักงานเป็นผู้ละเลยการอัดจาระบี", "วิธีการ (Method) เพราะมาตรฐานขั้นตอนการบำรุงรักษาไม่ชัดเจนเพียงพอให้ปฏิบัติตรงกัน", "เครื่องจักร (Machine) เพราะรถโฟล์คลิฟท์เป็นอุปกรณ์ที่เสีย", "วัตถุดิบ (Material) เพราะจาระบีคือวัสดุสิ้นเปลือง", "การเงิน (Money) เพราะงบซ่อมบำรุงไม่เพียงพอ"], "answer": 1, "explanation": "ต้นตออยู่ที่มาตรฐานวิธีปฏิบัติงานที่กำกวมจนแต่ละคนตีความต่างกัน จึงเป็นปัจจัย Method การสรุปว่าเป็นความละเลยของคนคือการหยุดวิเคราะห์ที่อาการเชิงพฤติกรรม", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 71, "q": "หลังใช้ Pareto พบว่าสาเหตุอันดับหนึ่งของงานคืนจากลูกค้าคือบรรจุภัณฑ์บุบ และทีมแก้สำเร็จจนงานคืนลดลง 60% ขั้นตอนต่อไปที่ถูกต้องตามแนวคิดการปรับปรุงต่อเนื่องคือข้อใด?", "choices": ["ยุติการเก็บข้อมูลงานคืนเพราะปัญหาใหญ่ถูกแก้แล้ว", "นำแผนภูมิ Pareto แผ่นเดิมมาใช้เลือกเป้าหมายรอบถัดไปได้ทันที", "โยกทีมทั้งหมดไปทำโครงการอื่นที่ไม่เกี่ยวข้อง", "ฉลองความสำเร็จและรอจนกว่าปัญหาใหม่จะร้องเรียนเข้ามาเอง", "เก็บข้อมูลงานคืนรอบใหม่แล้วจัดทำ Pareto อีกครั้ง เพราะสัดส่วนและลำดับของสาเหตุเปลี่ยนไปหลังการแก้ไข"], "answer": 4, "explanation": "เมื่อสาเหตุอันดับหนึ่งถูกกำจัด โครงสร้างข้อมูลจะเปลี่ยน สาเหตุรองจะขยับขึ้นมาแทน จึงต้องทำ Pareto จากข้อมูลใหม่เพื่อเลือกเป้าหมายรอบถัดไปอย่างแม่นยำ", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 72, "q": "เครื่องตัดกระดาษขัดข้อง หัวหน้ากะใช้วิธีเคาะและขยับชุดเฟืองให้เครื่องเดินต่อได้ก่อนเพื่อไม่ให้งานค้าง ข้อใดคือแนวทางที่ถูกต้องในการจัดการการแก้ปัญหาชั่วคราวลักษณะนี้?", "choices": ["ยอมรับได้ในภาวะเร่งด่วน แต่ต้องบันทึกไว้เป็นความเสี่ยงค้างแก้ กำหนดผู้รับผิดชอบและเส้นตายในการวิเคราะห์และแก้สาเหตุรากอย่างถาวร", "ถือเป็นวิธีมาตรฐานใหม่ได้เลยเพราะพิสูจน์แล้วว่าเครื่องกลับมาเดินได้จริง", "ห้ามทำเด็ดขาดทุกกรณี ต้องหยุดสายการผลิตจนกว่าจะแก้ถาวรเท่านั้น", "เก็บวิธีเคาะนี้เป็นเทคนิคเฉพาะตัวของหัวหน้ากะ ไม่ต้องรายงานใคร", "แจ้งซ่อมในระบบแล้วถือว่าหมดหน้าที่ ไม่ต้องติดตามต่อ"], "answer": 0, "explanation": "มาตรการชั่วคราวมีที่ทางในภาวะเร่งด่วน แต่ความเสี่ยงคือมันมักกลายเป็นวิธีถาวรโดยไม่ตั้งใจ จึงต้องบันทึก ติดตาม และปิดด้วยการแก้รากภายในเวลาที่กำหนด", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 73, "q": "ร้านกาแฟแห่งหนึ่งวิเคราะห์ปัญหา: ยอดขายรายเดือนลดลง เพราะลูกค้าประจำหายไป เพราะลูกค้ารอเครื่องดื่มนานขึ้น เพราะเครื่องชงเสียบ่อย เพราะไม่มีแผนบำรุงรักษาเชิงป้องกัน จากสายการวิเคราะห์นี้ ข้อใดจัดเป็น \"อาการ\" (Symptom) ของปัญหา?", "choices": ["การไม่มีแผนบำรุงรักษาเชิงป้องกัน", "ยอดขายรายเดือนที่ลดลง", "คุณภาพเมล็ดกาแฟที่เสื่อมลง", "นิสัยการทำงานของพนักงานชงกาแฟ", "ทำเลที่ตั้งของร้านที่ไม่เหมาะสม"], "answer": 1, "explanation": "ยอดขายที่ลดลงคือผลปลายทางที่มองเห็นได้ ซึ่งเป็นอาการของปัญหา ส่วนการไม่มีแผนบำรุงรักษาคือสาเหตุรากที่อยู่ต้นสายของเหตุการณ์ทั้งหมด", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 74, "q": "ระหว่างวิเคราะห์สาเหตุของเสียงานฉีดพลาสติก ช่างอาวุโสยืนยันหนักแน่นจากประสบการณ์ 20 ปีว่า \"ต้องเป็นเพราะเม็ดพลาสติกชื้นแน่นอน\" โดยยังไม่มีข้อมูลยืนยัน ทีมควรปฏิบัติอย่างไร?", "choices": ["เชื่อและลงมือแก้ตามทันที เพราะประสบการณ์ 20 ปีน่าเชื่อถือกว่าข้อมูลใดๆ", "ปัดตกความเห็นนี้เพราะไม่มีข้อมูลรองรับ ถือว่าใช้ไม่ได้", "บันทึกเป็นสมมติฐานลำดับต้นๆ แล้วออกแบบการเก็บข้อมูลหรือทดสอบ เช่น วัดความชื้นเม็ดพลาสติกเทียบกับล็อตที่เกิดของเสีย เพื่อพิสูจน์ก่อนสรุป", "ให้ช่างอาวุโสกับวิศวกรโหวตกันว่าจะเชื่อฝ่ายใด", "ส่งเรื่องให้ผู้จัดการโรงงานชี้ขาดโดยไม่ต้องทดสอบ"], "answer": 2, "explanation": "ประสบการณ์มีคุณค่าในการตั้งสมมติฐานที่แหลมคม แต่ไม่ใช่ข้อพิสูจน์ วิธีที่ถูกคือนำไปจัดลำดับความน่าจะเป็นแล้วตรวจสอบด้วยข้อมูลจริง ไม่เชื่อทันทีและไม่ปัดทิ้ง", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 75, "q": "โครงการลดเวลารอคิวของศูนย์บริการรถจักรยานยนต์ทดลองระบบนัดหมายล่วงหน้าแล้วได้ผลตามเป้า เมื่อเข้าสู่ขั้น Act ของ PDCA กิจกรรมข้อใดครบถ้วนถูกต้องที่สุด?", "choices": ["เริ่มเก็บข้อมูลเวลารอคิวใหม่ตั้งแต่ต้นเพื่อยืนยันผลอีกหลายรอบ", "ทดลองใช้ระบบนัดหมายต่อไปเรื่อยๆ โดยยังไม่ประกาศเป็นทางการ", "ยกเลิกระบบนัดหมายแล้วกลับไปใช้วิธีเดิมเพื่อเปรียบเทียบอีกครั้ง", "จัดทำระบบนัดหมายเป็นมาตรฐานการทำงานถาวร ขยายผลไปสาขาอื่น และกำหนดหัวข้อปรับปรุงสำหรับวงจรรอบถัดไป", "มอบรางวัลทีมงานแล้วปิดโครงการโดยสมบูรณ์"], "answer": 3, "explanation": "ขั้น Act เมื่อผลสำเร็จคือการยกระดับวิธีใหม่เป็นมาตรฐาน ขยายผล และตั้งต้นวงจรปรับปรุงรอบใหม่ ไม่ใช่แค่ฉลองปิดงานหรือทดลองค้างไว้โดยไม่จัดทำมาตรฐาน", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 76, "q": "ทีมต้องเลือกแนวทางแก้ปัญหาของเสียจาก 3 ทางเลือกที่ต่างกันทั้งต้นทุน ระยะเวลา และประสิทธิผล สมาชิกแต่ละคนเชียร์คนละทางตามความถนัดของตน วิธีตัดสินใจที่เป็นระบบที่สุดคือข้อใด?", "choices": ["ให้หัวหน้าทีมเลือกคนเดียวเพื่อความรวดเร็วและเด็ดขาด", "เลือกทางที่ต้นทุนต่ำสุดเสมอเพราะประหยัดงบประมาณ", "เลือกทางที่เสร็จเร็วที่สุดเสมอเพราะปัญหากำลังเกิดอยู่", "จับสลากเพื่อความยุติธรรมและไม่ขัดแย้งกันในทีม", "กำหนดเกณฑ์ตัดสินใจร่วมกัน ให้น้ำหนักแต่ละเกณฑ์ตามผลกระทบต่อเป้าหมาย แล้วให้คะแนนทุกทางเลือกเปรียบเทียบอย่างเป็นระบบพร้อมพิจารณาความเสี่ยงของแต่ละทาง"], "answer": 4, "explanation": "เมื่อทางเลือกมีจุดแข็งต่างมิติกัน ต้องใช้เกณฑ์ถ่วงน้ำหนักที่โปร่งใสแทนความชอบส่วนตัว การยึดเกณฑ์เดียวเช่นถูกสุดหรือเร็วสุดอาจมองข้ามประสิทธิผลและความเสี่ยงสำคัญ", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 77, "q": "บริษัทขนส่งแห่งหนึ่งจ่ายค่าชดเชยให้ลูกค้าที่ได้รับสินค้าเสียหายทุกครั้งอย่างรวดเร็วจนลูกค้าพอใจ แต่ยอดเคลมกลับเพิ่มขึ้นทุกไตรมาส ข้อใดวิเคราะห์สถานการณ์นี้ได้ถูกต้องที่สุด?", "choices": ["การชดเชยที่รวดเร็วเป็นเพียงการบรรเทาอาการ บริษัทยังไม่ได้วิเคราะห์และแก้กระบวนการที่ทำให้สินค้าเสียหาย ปัญหาต้นทางจึงโตขึ้นเรื่อยๆ", "บริษัททำถูกต้องครบถ้วนแล้ว เพราะความพอใจของลูกค้าคือเป้าหมายสูงสุด", "ควรลดวงเงินชดเชยลงเพื่อให้ยอดเคลมลดตาม", "ลูกค้าจงใจเคลมเท็จมากขึ้น ควรตั้งเงื่อนไขการเคลมให้ยากขึ้น", "ควรยกเลิกการรับประกันสินค้าเสียหายเพื่อตัดค่าใช้จ่าย"], "answer": 0, "explanation": "การเยียวยาลูกค้าจำเป็นแต่ไม่ใช่การแก้ปัญหา ยอดเคลมที่โตต่อเนื่องชี้ว่าสาเหตุรากในกระบวนการขนส่งยังทำงานอยู่ การไปตั้งกำแพงเคลมหรือโทษลูกค้าคือการแก้ผิดจุด", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 78, "q": "รายงานประจำเดือนของฝ่ายจัดส่งแสดงแนวโน้มการส่งตรงเวลาดีขึ้นต่อเนื่อง แต่ข้อมูลดิบรายวันกลับพบงานส่งล่าช้าเพิ่มขึ้น เมื่อตรวจสอบพบว่ารายงานตัดยอดเฉพาะงานที่ปิดสมบูรณ์แล้ว โดยไม่นับงานล่าช้าที่ยังค้างอยู่ ควรสรุปและดำเนินการอย่างไร?", "choices": ["เชื่อรายงานประจำเดือนเพราะผ่านการจัดทำอย่างเป็นทางการแล้ว", "แก้ไขวิธีจัดทำรายงานให้สะท้อนงานค้างล่าช้าด้วย แล้วประเมินสถานการณ์ใหม่จากข้อมูลที่ครบถ้วนก่อนตัดสินใจใดๆ", "ลงโทษพนักงานคีย์ข้อมูลรายวันที่ทำให้ตัวเลขขัดแย้งกับรายงาน", "นำตัวเลขสองชุดมาเฉลี่ยกันเพื่อใช้เป็นข้อสรุปกลาง", "ปกปิดข้อมูลรายวันไว้ก่อนเพื่อไม่ให้ผู้บริหารสับสน"], "answer": 1, "explanation": "ข้อมูลที่ขัดแย้งกันเกิดจากวิธีตัดยอดที่ลำเอียงเชิงโครงสร้าง ทำให้ภาพที่เห็นดีเกินจริง ต้องแก้ที่ระบบรายงานให้สะท้อนความจริงก่อน ไม่ใช่เลือกเชื่อฝั่งใดฝั่งหนึ่งหรือถัวเฉลี่ย", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 79, "q": "เครื่องผสมอาหารสัตว์หยุดทำงานกลางกะ มีสาเหตุที่เป็นไปได้ 2 ทางคือ ระบบไฟฟ้าขัดข้อง (ตรวจสอบได้ใน 15 นาที และอาการไฟกะพริบก่อนดับสนับสนุน) กับชุดเกียร์ขัดตัว (ต้องถอดตรวจครึ่งวัน) ภายใต้เวลาจำกัด ควรจัดลำดับการตรวจสอบอย่างไร?", "choices": ["ถอดชุดเกียร์ตรวจก่อนเพราะเป็นชิ้นส่วนที่ราคาแพงที่สุด", "ตรวจทั้งสองระบบพร้อมกันโดยเรียกช่างมาเพิ่มเป็นสองเท่า", "ตรวจระบบไฟฟ้าก่อน เพราะใช้เวลาน้อยกว่ามากและมีหลักฐานจากอาการสนับสนุน หากไม่พบจึงค่อยตรวจชุดเกียร์", "เดินเครื่องต่อไปก่อนเพื่อดูว่าอาการจะแสดงชัดขึ้นหรือไม่", "รอผู้เชี่ยวชาญจากบริษัทผู้ผลิตซึ่งจะเข้ามาได้ในสัปดาห์หน้า"], "answer": 2, "explanation": "การไล่ตรวจสาเหตุอย่างมีประสิทธิภาพต้องจัดลำดับตามความน่าจะเป็นจากหลักฐานประกอบกับต้นทุนเวลาในการพิสูจน์ ทางเลือกที่พิสูจน์เร็วและมีหลักฐานหนุนควรถูกตัดออกหรือยืนยันก่อน", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}, {"n": 80, "q": "หลังจบโครงการแก้ปัญหาลูกค้าร้องเรียนเรื่องงานติดตั้งล่าช้าซึ่งสำเร็จเกินเป้า หัวหน้าต้องการถอดบทเรียนให้เกิดประโยชน์สูงสุดต่อองค์กร วิธีใดเหมาะสมที่สุด?", "choices": ["เก็บรายงานฉบับสมบูรณ์เข้าแฟ้มของหัวหน้าโครงการไว้ใช้อ้างอิงส่วนตัว", "สรุปเฉพาะความสำเร็จเพื่อเผยแพร่ประชาสัมพันธ์ผลงานของทีม", "ให้สมาชิกแต่ละคนจดจำบทเรียนของตนเองไว้ใช้ในงานถัดไป", "จัดประชุมทบทวนหลังปฏิบัติงานโดยเทียบสิ่งที่วางแผนกับสิ่งที่เกิดจริง วิเคราะห์ทั้งปัจจัยสำเร็จและข้อผิดพลาด แล้วบันทึกเป็นแนวปฏิบัติที่เผยแพร่ให้ทีมอื่นเข้าถึงและนำไปใช้ได้", "รอถอดบทเรียนพร้อมกันตอนสิ้นปีเพื่อประหยัดเวลาประชุม"], "answer": 3, "explanation": "การถอดบทเรียนที่ดีต้องทำขณะความจำยังสด ครอบคลุมทั้งสิ่งที่ได้ผลและไม่ได้ผล และแปลงเป็นความรู้ที่องค์กรเข้าถึงได้ ไม่ใช่เก็บไว้ที่บุคคลหรือคัดเฉพาะด้านดี", "section": "ชุดเสริมระดับยาก (ข้อ 41-80)"}]}]};</script>
<script>
"use strict";
/* ================= state & storage ================= */
const $ = id => document.getElementById(id);
const store = {
  get(){ try{return JSON.parse(localStorage.getItem("vnet-stats"))||{}}catch(e){return{}} },
  set(d){ localStorage.setItem("vnet-stats", JSON.stringify(d)) }
};
let S = null;         // current quiz session
let timerInt = null;
let muted = localStorage.getItem("vnet-muted")==="1";

/* ================= sounds (WebAudio) ================= */
let actx = null;
function beep(freqs, dur=0.12, type="sine", vol=0.15){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, actx.currentTime + i*dur);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (i+1)*dur);
      o.connect(g).connect(actx.destination);
      o.start(actx.currentTime + i*dur); o.stop(actx.currentTime + (i+1)*dur + .02);
    });
  }catch(e){}
}
const sndGood = ()=>beep([660,880],0.1,"sine",.12);
const sndBad  = ()=>beep([220,180],0.15,"square",.06);
const sndWin  = ()=>beep([523,659,784,1047],0.14,"sine",.14);
const sndClick= ()=>beep([440],0.05,"sine",.05);
function toggleMute(){ muted=!muted; localStorage.setItem("vnet-muted",muted?"1":"0"); $("mutebtn").textContent = muted?"🔇":"🔊"; }

/* ================= home ================= */
function renderHome(){
  const st = store.get();
  const myIds = new Set([...EXAM_DATA.subjects.map(s=>s.id), "mix"]);
  let answered=0, correct=0;
  for(const k in (st.log||{})){ if(!myIds.has(k)) continue; answered += st.log[k].a; correct += st.log[k].c; }
  $("st-total").textContent = EXAM_DATA.subjects.reduce((s,x)=>s+x.questions.length,0);
  $("st-answered").textContent = answered;
  $("st-acc").textContent = answered ? Math.round(correct/answered*100)+"%" : "—";
  $("st-streak").textContent = st.maxStreak||0;

  const g = $("subjects"); g.innerHTML = "";
  EXAM_DATA.subjects.forEach(s=>{
    const best = (st.best||{})[s.id];
    const b = document.createElement("button");
    b.className = "subj";
    b.innerHTML = `<div class="ic">${s.icon}</div><h3>${s.title}</h3><div class="sub">${s.subtitle}</div>
      <div class="meta"><span class="badge">${s.questions.length} ข้อ</span>
      <span class="best">${best!=null ? "🏆 "+best+"%" : "ยังไม่เคยทำ"}</span></div>`;
    b.onclick = ()=>openSetup(s.id);
    g.appendChild(b);
  });
  if(EXAM_DATA.subjects.length < 2) return;
  const grandTotal = EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0);
  const mix = document.createElement("button");
  mix.className = "subj mix";
  const mixBest = (st.best||{})["mix"];
  mix.innerHTML = `<div class="ic">🎲</div><h3>จับฉลากรวมทุกชุด</h3><div class="sub">สุ่มคละจากทั้ง ${grandTotal} ข้อ</div>
    <div class="meta"><span class="badge">ท้าทาย!</span><span class="best">${mixBest!=null?"🏆 "+mixBest+"%":"ยังไม่เคยทำ"}</span></div>`;
  mix.onclick = ()=>openSetup("mix");
  g.appendChild(mix);
}

/* ================= setup modal ================= */
let setup = {n:20, mode:"practice", shuffleQ:true, shuffleC:false, subj:null};
function openSetup(id){
  sndClick();
  setup.subj = id;
  const s = id==="mix" ? {title:"จับฉลากรวมทุกวิชา", subtitle:"คละทุกสมรรถนะ", icon:"🎲",
      questions:{length:EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0)}}
    : EXAM_DATA.subjects.find(x=>x.id===id);
  const total = s.questions.length;
  const counts = [10,20,30,total>=100?50:total].filter((v,i,a)=>v<=total && a.indexOf(v)===i);
  if(!counts.includes(total) && total<=60) counts.push(total);
  setup.n = counts.includes(20)?20:counts[0];
  if(id==="mix") setup.shuffleQ = true;
  $("modal-root").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeSetup()">
    <div class="modal">
      <h2>${s.icon} ${s.title}</h2>
      <div class="sub">${s.subtitle} • มีทั้งหมด ${total} ข้อ</div>
      <div class="optlabel">โหมด</div>
      <div class="optrow" id="mode-row">
        <button class="opt ${setup.mode==="practice"?"sel":""}" onclick="setMode('practice')">📖 ฝึกฝน (เฉลยทันที)</button>
        <button class="opt ${setup.mode==="exam"?"sel":""}" onclick="setMode('exam')">⏱️ สอบเสมือนจริง</button>
      </div>
      <div class="optlabel">จำนวนข้อ</div>
      <div class="optrow" id="count-row">
        ${counts.map(c=>`<button class="opt ${c===setup.n?"sel":""}" onclick="setCount(${c})">${c===total?"ทั้งหมด ("+c+")":c}</button>`).join("")}
      </div>
      <div class="toggle ${setup.shuffleQ?"on":""}" id="tg-q" onclick="tog('shuffleQ','tg-q')"><span class="box">${setup.shuffleQ?"✓":""}</span> สุ่มลำดับข้อ</div>
      <div class="toggle ${setup.shuffleC?"on":""}" id="tg-c" onclick="tog('shuffleC','tg-c')"><span class="box">${setup.shuffleC?"✓":""}</span> สุ่มลำดับตัวเลือก</div>
      <div class="mrow">
        <button class="btn ghost" onclick="closeSetup()">ยกเลิก</button>
        <button class="btn primary" onclick="startQuiz()">เริ่มเลย 🚀</button>
      </div>
    </div>
  </div>`;
}
function setMode(m){ setup.mode=m; document.querySelectorAll("#mode-row .opt").forEach((b,i)=>b.classList.toggle("sel",(i===0)===(m==="practice"))); sndClick(); }
function setCount(c){ setup.n=c; document.querySelectorAll("#count-row .opt").forEach(b=>b.classList.toggle("sel",b.textContent.includes("("+c+")")||b.textContent.trim()==String(c))); sndClick(); }
function tog(key,id){ setup[key]=!setup[key]; const el=$(id); el.classList.toggle("on",setup[key]); el.querySelector(".box").textContent = setup[key]?"✓":""; sndClick(); }
function closeSetup(){ $("modal-root").innerHTML=""; }

/* ================= quiz engine ================= */
function shuffled(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

function startQuiz(){
  closeSetup();
  let pool, labels;
  if(setup.subj==="mix"){
    pool = EXAM_DATA.subjects.flatMap(s=>s.questions.map(q=>({...q, labels:s.labels, from:s.icon+" "+s.title})));
    labels = null;
  } else {
    const s = EXAM_DATA.subjects.find(x=>x.id===setup.subj);
    pool = s.questions.map(q=>({...q, labels:s.labels, from:""}));
  }
  if(setup.shuffleQ) pool = shuffled(pool);
  pool = pool.slice(0, setup.n);
  pool = pool.map(q=>{
    let idx = q.choices.map((_,i)=>i);
    if(setup.shuffleC) idx = shuffled(idx);
    return {...q, order:idx, picked:null, removed:[]};
  });
  S = { qs:pool, i:0, correct:0, streak:0, maxStreak:0, fifty:3, mode:setup.mode,
        subj:setup.subj, start:Date.now(), done:false };
  $("home").classList.add("hidden"); $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("mutebtn").textContent = muted?"🔇":"🔊";
  $("palette").classList.toggle("hidden", S.mode!=="exam");
  clearInterval(timerInt);
  timerInt = setInterval(()=>{ const t=Math.floor((Date.now()-S.start)/1000);
    $("q-timer").textContent = String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); },500);
  renderQ();
  window.scrollTo(0,0);
}

function renderQ(){
  const q = S.qs[S.i];
  $("q-count").textContent = `${S.i+1}/${S.qs.length}`;
  $("q-score").textContent = `✅ ${S.correct}`;
  $("q-streak").textContent = `🔥 ${S.streak}`;
  $("q-progress").style.width = (S.i/S.qs.length*100)+"%";
  $("q-section").textContent = q.from || q.section || "";
  stopSpeech();
  const audio = parseAudio(q.q);
  $("q-text").textContent = `${S.i+1}. ${audio ? audio.question : q.q}`;
  renderAudioBox(audio, q);
  $("q-expl").innerHTML = "";
  $("nextbtn").classList.add("hidden");
  $("skipbtn").classList.toggle("hidden", S.mode!=="exam");
  $("submitbtn").classList.add("hidden");
  $("fifty").classList.toggle("hidden", S.mode!=="practice");
  $("fifty").disabled = S.fifty<=0;
  $("fifty-n").textContent = "×"+S.fifty;

  const c = $("q-choices"); c.innerHTML = "";
  q.order.forEach((origIdx,pos)=>{
    const b = document.createElement("button");
    b.className = "choice";
    if(q.removed.includes(origIdx)) b.classList.add("dim");
    b.innerHTML = `<span class="lb">${q.labels[pos]}</span><span>${q.choices[origIdx]}</span>`;
    if(S.mode==="exam" && q.picked===origIdx) b.classList.add("picked");
    b.onclick = ()=>pick(origIdx, b);
    c.appendChild(b);
  });
  if(S.mode==="exam"){
    renderPalette();
    if(q.picked!==null || S.i===S.qs.length-1) maybeShowSubmit();
  }
}

/* ===== text-to-speech for listening questions ===== */
const AUDIO_RE = /^\(Audio\)\s*['‘’](.*)['‘’]\s*(?:->|→)\s*(.*)$/s;
function parseAudio(text){
  const m = AUDIO_RE.exec(text);
  return m ? {script:m[1].trim(), question:m[2].trim()} : null;
}
let currentScript = null;
let currentAudioSrc = null;   // mp3 for this question (real voice), if available
let audioEl = null;
function stopSpeech(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  if(audioEl){ audioEl.pause(); audioEl = null; }
  document.querySelectorAll(".playbtn").forEach(b=>b.classList.remove("playing"));
}
let currentUtterance = null; // keep a reference so Chrome doesn't GC it mid-speech
function playAudio(){
  stopSpeech();
  const btnA = document.querySelector(".playbtn");
  if(currentAudioSrc){
    const src = currentAudioSrc.startsWith("data:") ? currentAudioSrc
              : (window.AUDIO_BASE || "audio/") + currentAudioSrc;
    audioEl = new Audio(src);
    audioEl.onplay = ()=>btnA && btnA.classList.add("playing");
    audioEl.onended = ()=>btnA && btnA.classList.remove("playing");
    audioEl.onerror = ()=>{ btnA && btnA.classList.remove("playing"); speakScript(); };
    audioEl.play().catch(()=>speakScript());
    return;
  }
  speakScript();
}
function speakScript(){
  if(!("speechSynthesis" in window) || !currentScript) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(currentScript);
  u.lang = "en-US"; u.rate = 0.92;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x=>x.name==="Samantha") || vs.find(x=>x.lang==="en-US") ||
            vs.find(x=>x.lang && x.lang.startsWith("en"));
  if(v) u.voice = v;
  const btn = document.querySelector(".playbtn");
  u.onstart = ()=>btn && btn.classList.add("playing");
  u.onend = u.onerror = ()=>btn && btn.classList.remove("playing");
  currentUtterance = u;
  // Chrome quirk: speak() immediately after cancel() can be silently dropped
  setTimeout(()=>speechSynthesis.speak(u), 80);
}
function toggleScript(){
  const s = $("q-script"); if(s) s.classList.toggle("hidden");
}
function renderAudioBox(audio, q){
  currentScript = audio ? audio.script : null;
  currentAudioSrc = (audio && q && q.audio) ? q.audio : null;
  const box = $("q-audio");
  if(!audio){ box.innerHTML = ""; return; }
  const ttsOK = currentAudioSrc !== null || "speechSynthesis" in window;
  box.innerHTML = `<div class="audio-box">
    <div class="audio-row">
      <button class="playbtn" onclick="playAudio()">▶️ ฟังเสียง</button>
      <button class="scriptbtn" onclick="toggleScript()">📜 ดูบทพูด</button>
    </div>
    <div class="script hidden" id="q-script">"${audio.script}"</div>
    <div class="audio-hint">${ttsOK ? "ฟังได้หลายรอบ • ลองตอบโดยไม่เปิดบทพูดเพื่อฝึกการฟังจริง" : "เบราว์เซอร์นี้ไม่รองรับเสียงพูด — กด ดูบทพูด เพื่ออ่านแทน"}</div>
  </div>`;
}
function labelOf(q, origIdx){ return q.labels[q.order.indexOf(origIdx)]; }
function pick(idx, btn){
  const q = S.qs[S.i];
  if(S.mode==="practice"){
    if(q.picked!==null) return;
    q.picked = idx;
    const good = idx===q.answer;
    if(good){ S.correct++; S.streak++; S.maxStreak=Math.max(S.maxStreak,S.streak); sndGood();
      if(S.streak>0 && S.streak%5===0){ comboPop("🔥 "+S.streak+" ติด!"); }
    } else { S.streak=0; sndBad(); $("qcard").classList.add("shake"); setTimeout(()=>$("qcard").classList.remove("shake"),400); }
    // reveal
    [...$("q-choices").children].forEach((b,pos)=>{
      const oi = q.order[pos];
      b.disabled = true;
      if(oi===q.answer) b.classList.add("correct");
      else if(oi===idx) b.classList.add("wrong");
    });
    $("q-score").textContent = `✅ ${S.correct}`;
    $("q-streak").textContent = `🔥 ${S.streak}`;
    $("q-expl").innerHTML = `<div class="expl ${good?"good":"bad"}">
      <h4>${good ? "🎉 ถูกต้อง!" : "❌ ยังไม่ถูก — เฉลยคือ "+labelOf(q,q.answer)+"."}</h4>
      <p>${q.explanation || "ไม่มีคำอธิบายเพิ่มเติมสำหรับข้อนี้"}</p></div>`;
    const sc = $("q-script"); if(sc) sc.classList.remove("hidden");
    $("fifty").classList.add("hidden");
    if(S.i===S.qs.length-1){ $("nextbtn").textContent = "ดูสรุปผล 🏁"; }
    $("nextbtn").classList.remove("hidden");
    $("nextbtn").focus();
  } else {
    q.picked = idx; sndClick();
    [...$("q-choices").children].forEach((b,pos)=>b.classList.toggle("picked", q.order[pos]===idx));
    renderPalette(); maybeShowSubmit();
    setTimeout(()=>{ if(S.i<S.qs.length-1){ S.i++; renderQ(); window.scrollTo(0,0);} }, 250);
  }
}

function nextQ(){
  if(S.i>=S.qs.length-1){ finishQuiz(); return; }
  S.i++; renderQ(); window.scrollTo(0,0);
}
function maybeShowSubmit(){
  const allDone = S.qs.every(q=>q.picked!==null);
  $("submitbtn").classList.toggle("hidden", !(allDone || S.i===S.qs.length-1));
}
function renderPalette(){
  const p = $("palette"); p.innerHTML = "";
  S.qs.forEach((q,i)=>{
    const b = document.createElement("button");
    b.className = "pal"+(q.picked!==null?" done":"")+(i===S.i?" cur":"");
    b.textContent = i+1;
    b.onclick = ()=>{ S.i=i; renderQ(); };
    p.appendChild(b);
  });
}
function useFifty(){
  const q = S.qs[S.i];
  if(S.fifty<=0 || q.picked!==null) return;
  S.fifty--;
  const wrongs = shuffled(q.order.filter(i=>i!==q.answer && !q.removed.includes(i))).slice(0,2);
  q.removed.push(...wrongs);
  sndClick(); renderQ();
}
function confirmExit(){
  if(S && !S.done && S.qs.some(q=>q.picked!==null)){
    if(!confirm("ออกจากการทำข้อสอบ? ความคืบหน้ารอบนี้จะหายไป")) return;
  }
  quitToHome();
}
function quitToHome(){
  stopSpeech();
  clearInterval(timerInt); S=null;
  $("quiz").classList.add("hidden"); $("result").classList.add("hidden");
  $("home").classList.remove("hidden");
  renderHome(); window.scrollTo(0,0);
}

/* ================= results ================= */
function finishQuiz(){
  S.done = true;
  stopSpeech();
  clearInterval(timerInt);
  if(S.mode==="exam"){ S.correct = S.qs.filter(q=>q.picked===q.answer).length; }
  const n = S.qs.length, pct = Math.round(S.correct/n*100);
  const secs = Math.floor((Date.now()-S.start)/1000);
  const time = String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0");

  // save stats
  const st = store.get();
  st.best = st.best||{}; st.log = st.log||{};
  if(pct > (st.best[S.subj] ?? -1)) st.best[S.subj] = pct;
  const lg = st.log[S.subj] || {a:0,c:0};
  lg.a += n; lg.c += S.correct; st.log[S.subj] = lg;
  st.maxStreak = Math.max(st.maxStreak||0, S.maxStreak);
  store.set(st);

  const verdict = pct===100 ? ["🏆 สมบูรณ์แบบ!","var(--warn)"]
    : pct>=80 ? ["🌟 เยี่ยมมาก!","var(--good)"]
    : pct>=60 ? ["👍 ผ่านเกณฑ์ ทำได้ดี","var(--brand2)"]
    : pct>=40 ? ["💪 เกือบแล้ว สู้ต่อ!","var(--warn)"]
    : ["📚 ทบทวนอีกนิด แล้วลองใหม่","var(--bad)"];

  const circ = 2*Math.PI*80;
  const wrong = S.qs.filter(q=>q.picked!==q.answer);
  $("quiz").classList.add("hidden");
  const r = $("result");
  r.classList.remove("hidden");
  r.innerHTML = `
  <div class="result">
    <div style="display:flex;justify-content:space-between"><button class="topbtn" onclick="quitToHome()">← หน้าหลัก</button>
    <button class="topbtn" onclick="retry()">🔄 ทำใหม่</button></div>
    <div class="ring">
      <svg width="190" height="190"><circle cx="95" cy="95" r="80" fill="none" stroke="var(--card2)" stroke-width="14"/>
      <circle cx="95" cy="95" r="80" fill="none" stroke="${pct>=60?"var(--good)":pct>=40?"var(--warn)":"var(--bad)"}" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" id="ringbar"/></svg>
      <div class="num"><b>${pct}%</b><span>${S.correct} / ${n} ข้อ</span></div>
    </div>
    <div class="verdict" style="color:${verdict[1]}">${verdict[0]}</div>
    <div class="rstats">
      <div class="stat"><b>⏱️ ${time}</b><span>เวลาที่ใช้</span></div>
      <div class="stat"><b>🔥 ${S.maxStreak}</b><span>ตอบถูกติดกันสูงสุด</span></div>
      <div class="stat"><b>${wrong.length}</b><span>ข้อที่ผิด/ข้าม</span></div>
    </div>
    ${wrong.length ? `<button class="btn primary" style="max-width:320px;margin:0 auto" onclick="$('rev').classList.toggle('hidden')">📖 ทบทวนข้อที่ผิด (${wrong.length})</button>` : ""}
    <div class="review ${S.mode==="exam"?"":"hidden"}" id="rev">
      ${wrong.map(q=>`<div class="rq">
        <div class="st no">✗ ${q.q}</div>
        <p>คำตอบของคุณ: ${q.picked!==null ? labelOf(q,q.picked)+". "+q.choices[q.picked] : "— ไม่ได้ตอบ"}</p>
        <p style="color:var(--good)">เฉลย: ${labelOf(q,q.answer)}. ${q.choices[q.answer]}</p>
        <div class="ex">💡 ${q.explanation || "ไม่มีคำอธิบายเพิ่มเติม"}</div>
      </div>`).join("")}
    </div>
  </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const bar = $("ringbar"); bar.style.transition = "stroke-dashoffset 1.2s ease";
    bar.style.strokeDashoffset = circ*(1-pct/100);
  }));
  if(pct>=80){ sndWin(); confetti(); } else if(pct>=60){ sndWin(); }
  window.scrollTo(0,0);
}
function retry(){ openSetupFromResult(); }
function openSetupFromResult(){ const id=S.subj; quitToHome(); openSetup(id); }

/* ================= fun bits ================= */
function comboPop(text){
  const el = document.createElement("div");
  el.className = "combo-pop"; el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}
function confetti(){
  const cv = $("confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#7c6cff","#4ecdc4","#ffc94d","#ff5d73","#3ddc84"];
  const ps = Array.from({length:140},()=>({
    x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.5,
    w:6+Math.random()*6, h:8+Math.random()*8,
    vy:2+Math.random()*3, vx:(Math.random()-.5)*2, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.2,
    c:colors[Math.floor(Math.random()*colors.length)]
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if(++frames < 260) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* keyboard shortcuts: 1-5 answer, Enter/space next */
document.addEventListener("keydown", e=>{
  if(!S || $("quiz").classList.contains("hidden")) return;
  if(e.key>="1" && e.key<="5"){
    const pos = +e.key-1, btns = $("q-choices").children;
    if(btns[pos] && !btns[pos].disabled) btns[pos].click();
  } else if(e.key==="Enter" && !$("nextbtn").classList.contains("hidden")){ nextQ(); }
});

renderHome();
</script>
