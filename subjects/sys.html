<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔗 สมรรถนะการคิดเป็นระบบ — ข้อสอบ V-NET 80 ข้อ</title>
<style>
:root{
  --bg:#0f1220; --bg2:#171b30; --card:#1e2340; --card2:#252b4d;
  --text:#eef0ff; --muted:#9aa3c7; --line:#323a63;
  --brand:#7c6cff; --brand2:#4ecdc4; --good:#3ddc84; --bad:#ff5d73; --warn:#ffc94d;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Noto Sans Thai","Segoe UI",sans-serif;
  background:radial-gradient(1200px 800px at 80% -10%,#2a2f55 0%,var(--bg) 55%);
  color:var(--text); min-height:100vh; line-height:1.6;
}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}

/* ===== Home ===== */
.hero{text-align:center;padding:28px 0 20px}
.hero h1{font-size:2rem;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);margin-top:6px}
.statbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;text-align:center;min-width:110px}
.stat b{font-size:1.3rem;display:block}
.stat span{color:var(--muted);font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.subj{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:left;transition:.18s;position:relative;overflow:hidden}
.subj:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 24px rgba(124,108,255,.25)}
.subj .ic{font-size:1.9rem}
.subj h3{font-size:1.02rem;margin:8px 0 2px}
.subj .sub{color:var(--muted);font-size:.8rem}
.subj .meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:.82rem;color:var(--muted)}
.badge{background:var(--bg2);border:1px solid var(--line);padding:2px 10px;border-radius:999px}
.best{color:var(--warn)}
.subj.mix{background:linear-gradient(135deg,#3b2f7a,#1c5f5a);border-color:#6a5cff}

/* ===== Setup modal ===== */
.overlay{position:fixed;inset:0;background:rgba(8,10,20,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:20px;max-width:440px;width:100%;padding:24px}
.modal h2{font-size:1.2rem;margin-bottom:2px}
.modal .sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.optlabel{font-size:.85rem;color:var(--muted);margin:14px 0 6px}
.optrow{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:.9rem}
.opt.sel{background:var(--brand);border-color:var(--brand);font-weight:700}
.toggle{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.9rem;color:var(--muted);cursor:pointer;user-select:none}
.toggle .box{width:20px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.toggle.on .box{background:var(--good);border-color:var(--good);color:#08331c}
.mrow{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:12px;border-radius:12px;font-size:1rem;font-weight:700}
.btn.primary{background:linear-gradient(90deg,var(--brand),#9b8cff);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line)}

/* ===== Quiz ===== */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qtop .left{display:flex;gap:8px;align-items:center}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.85rem}
.pill.flame{border-color:#ff8c42;color:#ffb347}
.pill.timer{min-width:84px;text-align:center}
.progress{height:8px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.qsec{color:var(--brand2);font-size:.78rem;margin-bottom:6px}
.qtext{font-size:1.08rem;font-weight:600;white-space:pre-wrap}
.choices{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-size:.97rem;transition:.15s;width:100%}
.choice:not(:disabled):hover{border-color:var(--brand)}
.choice .lb{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.choice.correct{border-color:var(--good);background:rgba(61,220,132,.12)}
.choice.correct .lb{background:var(--good);color:#06301a;border-color:var(--good)}
.choice.wrong{border-color:var(--bad);background:rgba(255,93,115,.12)}
.choice.wrong .lb{background:var(--bad);color:#fff;border-color:var(--bad)}
.choice.picked{border-color:var(--brand);background:rgba(124,108,255,.14)}
.choice.dim{opacity:.28;pointer-events:none}
.expl{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid;animation:pop .25s}
.expl.good{background:rgba(61,220,132,.1);border-color:var(--good)}
.expl.bad{background:rgba(255,93,115,.1);border-color:var(--bad)}
.expl h4{font-size:.95rem;margin-bottom:4px}
.expl p{font-size:.92rem;color:var(--text)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.qactions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.lifeline{background:var(--card);border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:10px 16px;font-weight:700}
.lifeline:disabled{opacity:.35;border-color:var(--line);color:var(--muted)}
.shake{animation:shake .35s}
.audio-box{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
.audio-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.playbtn{background:linear-gradient(90deg,#2e7d6b,var(--brand2));color:#04241f;font-weight:800;border-radius:99px;padding:10px 22px;font-size:1rem;display:inline-flex;align-items:center;gap:8px}
.playbtn.playing{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(78,205,196,.5)}50%{box-shadow:0 0 0 10px rgba(78,205,196,0)}}
.scriptbtn{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:.85rem;color:var(--muted)}
.script{margin-top:12px;border-left:3px solid var(--brand2);padding:6px 12px;font-style:italic;color:var(--muted);font-size:.95rem}
.audio-hint{color:var(--muted);font-size:.78rem;margin-top:8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.combo-pop{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);font-size:2.2rem;font-weight:800;pointer-events:none;z-index:99;animation:rise 1s forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}

/* palette (exam mode) */
.palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.pal{width:34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-size:.8rem}
.pal.done{background:var(--brand);border-color:var(--brand);font-weight:700}
.pal.cur{outline:2px solid var(--brand2)}

/* ===== Results ===== */
.result{text-align:center;padding-top:10px}
.ring{width:190px;height:190px;margin:14px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:2.4rem}
.ring .num span{color:var(--muted);font-size:.85rem}
.verdict{font-size:1.3rem;font-weight:800;margin:4px 0 14px}
.rstats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.review{margin-top:26px;text-align:left}
.review h3{margin-bottom:12px}
.rq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.rq .st{font-weight:700}
.rq .st.ok{color:var(--good)} .rq .st.no{color:var(--bad)}
.rq p{font-size:.9rem;margin-top:4px}
.rq .ex{color:var(--muted);font-size:.86rem;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.topbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.85rem}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.footer-note{text-align:center;color:var(--muted);font-size:.75rem;margin-top:40px}
@media(max-width:520px){ .hero h1{font-size:1.5rem} .qtext{font-size:1rem} }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ HOME ============ -->
  <div id="home">
    <div class="hero">
      <h1>🔗 สมรรถนะการคิดเป็นระบบ</h1>
      <p>Systematic Thinking • 80 ข้อ พร้อมเฉลยและคำอธิบายทุกข้อ</p>
    </div>
    <div class="statbar">
      <div class="stat"><b id="st-total">540</b><span>ข้อสอบทั้งหมด</span></div>
      <div class="stat"><b id="st-answered">0</b><span>ทำไปแล้ว (ครั้ง)</span></div>
      <div class="stat"><b id="st-acc">—</b><span>ความแม่นยำรวม</span></div>
      <div class="stat"><b id="st-streak">0</b><span>สถิติตอบถูกติดกัน</span></div>
    </div>
    <div class="grid" id="subjects"></div>
    <p class="footer-note">แตะวิชาเพื่อเริ่ม • ผลคะแนนบันทึกไว้ในเครื่องอัตโนมัติ</p>
  </div>

  <!-- ============ QUIZ ============ -->
  <div id="quiz" class="hidden">
    <div class="qtop">
      <div class="left">
        <button class="topbtn" onclick="confirmExit()">← ออก</button>
        <span class="pill" id="q-count">1/30</span>
        <span class="pill" id="q-score">✅ 0</span>
      </div>
      <div class="left">
        <span class="pill flame" id="q-streak">🔥 0</span>
        <span class="pill timer" id="q-timer">00:00</span>
        <button class="topbtn" id="mutebtn" onclick="toggleMute()">🔊</button>
      </div>
    </div>
    <div class="progress"><i id="q-progress" style="width:0%"></i></div>
    <div class="qcard" id="qcard">
      <div class="qsec" id="q-section"></div>
      <div class="qtext" id="q-text"></div>
      <div id="q-audio"></div>
      <div class="choices" id="q-choices"></div>
      <div id="q-expl"></div>
      <div class="qactions">
        <button class="lifeline" id="fifty" onclick="useFifty()">✂️ 50:50 <span id="fifty-n">×3</span></button>
        <button class="btn primary hidden" id="nextbtn" onclick="nextQ()">ข้อถัดไป →</button>
        <button class="btn ghost hidden" id="skipbtn" onclick="nextQ()">ข้าม →</button>
        <button class="btn primary hidden" id="submitbtn" onclick="finishQuiz()">ส่งคำตอบ ✅</button>
      </div>
    </div>
    <div class="palette hidden" id="palette"></div>
  </div>

  <!-- ============ RESULT ============ -->
  <div id="result" class="hidden"></div>
</div>

<div id="modal-root"></div>

ารคิดแบบใดเป็นอันดับแรก?", "choices": ["รื้อเครื่องจักรทุกชิ้นออกมาทำความสะอาด", "สั่งซื้อเครื่องจักรใหม่ทันที", "ตรวจสอบอาการเบื้องต้นและไล่หาสาเหตุตามลำดับขั้น", "รายงานผู้บริหารว่าเครื่องเสียถาวร", "โทษพนักงานคุมเครื่องว่าใช้งานผิดวิธี"], "answer": 2, "explanation": "การซ่อมบำรุงอย่างเป็นระบบต้องเริ่มจากการตรวจสอบอาการเบื้องต้น แล้วไล่หาสาเหตุตามลำดับขั้น (Systematic Troubleshooting) ซึ่งเร็วและประหยัดกว่าการรื้อทั้งเครื่องหรือด่วนสรุป", "section": "ส่วนที่ 1: ความสามารถในการคิดเป็นขั้นเป็นตอน (Sequential Thinking)"}, {"n": 5, "q": "การเขียน 'ผังงาน' (Flowchart) มีประโยชน์อย่างไรต่อการคิดเป็นระบบ?", "choices": ["ช่วยให้เอกสารดูสวยงามน่าอ่าน", "ช่วยลดขั้นตอนการทำงานให้เหลือน้อยที่สุด", "ช่วยให้เห็นภาพรวมลำดับขั้นตอนและการตัดสินใจได้ชัดเจน", "ช่วยป้องกันไม่ให้คนอื่นลอกเลียนแบบงาน", "ช่วยเพิ่มงบประมาณในการดำเนินงาน"], "answer": 2, "explanation": "Flowchart แปลงกระบวนการทำงานให้เป็นภาพ ทำให้เห็นลำดับขั้นตอน จุดตัดสินใจ และจุดที่อาจเป็นคอขวดได้ชัดเจน ทั้งยังใช้สื่อสารให้ทีมเข้าใจตรงกันได้ง่าย", "section": "ส่วนที่ 1: ความสามารถในการคิดเป็นขั้นเป็นตอน (Sequential Thinking)"}, {"n": 6, "q": "หากท่านมีงานด่วนเข้ามาพร้อมกัน 4 งาน ท่านควรใช้หลักการใดในการเลือกทำก่อน-หลัง?", "choices": ["เลือกทำงานที่ง่ายที่สุดก่อน", "เลือกทำงานที่หัวหน้าดุที่สุดก่อน", "เลือกทำงานตามความสำคัญและความเร่งด่วน", "เลือกทำงานที่ใช้เวลาน้อยที่สุดก่อน", "ทำทุกงานไปพร้อมกันครั้งละเล็กละน้อย เพื่อให้ทุกงานคืบหน้าเท่ากัน"], "answer": 2, "explanation": "หลักการจัดลำดับงานที่ถูกต้องคือพิจารณาจากความสำคัญ (Importance) ควบคู่กับความเร่งด่วน (Urgency) ตามหลัก Eisenhower Matrix ไม่ใช่ความง่าย ความเร็ว หรือการทำทุกงานพร้อมกัน", "section": "ส่วนที่ 1: ความสามารถในการคิดเป็นขั้นเป็นตอน (Sequential Thinking)"}, {"n": 7, "q": "ในกระบวนการแก้ปัญหา ขั้นตอนใดควรเกิดขึ้นหลังจาก 'ระบุปัญหา' (Define Problem)?", "choices": ["ลงมือแก้ปัญหาทันที", "รวบรวมข้อมูลและวิเคราะห์สาเหตุของปัญหา", "สรุปผลการแก้ปัญหา", "หาผู้รับผิดชอบเพื่อลงโทษ", "กำหนดวิธีแก้ไขไว้ก่อน แล้วค่อยหาข้อมูลมาสนับสนุนวิธีนั้น"], "answer": 1, "explanation": "หลังระบุปัญหาแล้ว ต้องรวบรวมข้อมูลและวิเคราะห์หาสาเหตุก่อน จึงจะกำหนดวิธีแก้ได้ตรงจุด การลงมือแก้ทันทีหรือตั้งธงวิธีแก้ไว้ก่อนแล้วหาข้อมูลมาสนับสนุน เป็นการแก้ปัญหาที่ไม่เป็นระบบ", "section": "ส่วนที่ 1: ความสามารถในการคิดเป็นขั้นเป็นตอน (Sequential Thinking)"}, {"n": 8, "q": "การทำ Check Sheet (ใบตรวจสอบ) ก่อนเริ่มงาน มีวัตถุประสงค์เพื่ออะไร?", "choices": ["เพื่อจับผิดพนักงาน", "เพื่อให้แน่ใจว่าได้ดำเนินการครบถ้วนตามขั้นตอนมาตรฐาน", "เพื่อเพิ่มภาระงานเอกสาร", "เพื่อใช้เป็นหลักฐานในการขอขึ้นเงินเดือน", "เพื่อทดสอบความจำของพนักงาน"], "answer": 1, "explanation": "Check Sheet ช่วยยืนยันว่าผู้ปฏิบัติงานได้ทำครบทุกรายการตามขั้นตอนมาตรฐาน ลดความผิดพลาดจากการหลงลืม โดยเฉพาะงานที่มีขั้นตอนมากหรือมีผลต่อความปลอดภัย", "section": "ส่วนที่ 1: ความสามารถในการคิดเป็นขั้นเป็นตอน (Sequential Thinking)"}, {"n": 9, "q": "เมื่อเจอปัญหาที่ซับซ้อนมาก (Complex Problem) วิธีการคิดแบบใดที่จะช่วยให้แก้ปัญหาได้ง่ายขึ้น?", "choices": ["การคิดแบบเหมาเข่ง (Stereotyping)", "การคิดแบบแตกปัญหาย่อย (Decomposition)", "การคิดแบบวนลูป (Loop Thinking)", "การคิดแบบเพ้อฝัน (Fantasy Thinking)", "การคิดแบบรวมทุกปัญหาไว้แก้พร้อมกันในครั้งเดียว"], "answer": 1, "explanation": "Decomposition คือการแตกปัญหาใหญ่ที่ซับซ้อนออกเป็นปัญหาย่อยที่เล็กลงและจัดการได้ง่ายขึ้น แล้วทยอยแก้ทีละส่วนอย่างเป็นระบบ ซึ่งเป็นหลักคิดพื้นฐานของการคิดเชิงคำนวณ", "section": "ส่วนที่ 1: ความสามารถในการคิดเป็นขั้นเป็นตอน (Sequential Thinking)"}, {"n": 10, "q": "ข้อใดคือขั้นตอนสุดท้ายที่สำคัญที่สุดของการทำงานเป็นระบบ แต่คนมักละเลย?", "choices": ["การวางแผน (Planning)", "การลงมือทำ (Doing)", "การตรวจสอบ (Checking)", "การสรุปบทเรียนและปรับปรุงมาตรฐาน", "การฉลองความสำเร็จ"], "answer": 3, "explanation": "ขั้นตอนสุดท้ายของการทำงานเป็นระบบคือการสรุปบทเรียนและปรับปรุงมาตรฐาน (สอดคล้องกับขั้น Act ของ PDCA) ซึ่งทำให้ความรู้จากงานครั้งนี้ถูกส่งต่อและงานครั้งถัดไปดีขึ้น", "section": "ส่วนที่ 1: ความสามารถในการคิดเป็นขั้นเป็นตอน (Sequential Thinking)"}, {"n": 11, "q": "แนวคิดแบบ 'องค์รวม' (Holistic) เปรียบเทียบได้กับสำนวนไทยข้อใดมากที่สุด?", "choices": ["ตนแลเป็นที่พึ่งแห่งตน", "เด็ดดอกไม้สะเทือนถึงดวงดาว", "น้ำขึ้นให้รีบตัก", "เข็นครกขึ้นภูเขา", "ขี่ช้างจับตั๊กแตน"], "answer": 1, "explanation": "“เด็ดดอกไม้สะเทือนถึงดวงดาว” สื่อว่าทุกสิ่งเชื่อมโยงถึงกัน การกระทำเล็ก ๆ จุดหนึ่งส่งผลต่อส่วนอื่นของระบบได้ ตรงกับแนวคิดองค์รวมที่มองทุกส่วนสัมพันธ์กัน", "section": "ส่วนที่ 2: ความสามารถในการคิดแบบองค์รวม (Holistic Thinking)"}, {"n": 12, "q": "องค์ประกอบของระบบ (System) โดยพื้นฐานประกอบด้วยอะไรบ้าง?", "choices": ["Input -> Process -> Output -> Feedback", "Start -> Stop -> Finish -> Repeat", "Man -> Money -> Material -> Market", "Plan -> Policy -> Procedure -> Program", "Idea -> Action -> Result -> Reward"], "answer": 0, "explanation": "ระบบพื้นฐานประกอบด้วยปัจจัยนำเข้า (Input) กระบวนการ (Process) ผลลัพธ์ (Output) และข้อมูลป้อนกลับ (Feedback) ที่วนกลับมาใช้ปรับปรุงระบบให้ดีขึ้น", "section": "ส่วนที่ 2: ความสามารถในการคิดแบบองค์รวม (Holistic Thinking)"}, {"n": 13, "q": "การมองปัญหาแบบ 'ภูเขาน้ำแข็ง' (Iceberg Model) สอนให้เรารู้อะไร?", "choices": ["ปัญหาที่มองเห็นเป็นเพียงส่วนเล็กน้อย สาเหตุที่แท้จริงซ่อนอยู่ข้างล่าง", "ปัญหาจะละลายหายไปเองตามกาลเวลา", "ปัญหาใหญ่จะลอยอยู่เหนือน้ำเสมอ", "คนเราควรทำใจให้เย็นเหมือนน้ำแข็งเมื่อเจอปัญหา", "อุปสรรคเปรียบเสมือนความเย็นที่ต้องทน"], "answer": 0, "explanation": "Iceberg Model สอนว่าเหตุการณ์ที่มองเห็น (ยอดภูเขาน้ำแข็ง) เป็นเพียงส่วนเล็ก ๆ ใต้น้ำยังมีแบบแผนพฤติกรรม โครงสร้าง และความเชื่อที่เป็นสาเหตุที่แท้จริงซ่อนอยู่", "section": "ส่วนที่ 2: ความสามารถในการคิดแบบองค์รวม (Holistic Thinking)"}, {"n": 14, "q": "แผนผังก้างปลา (Fishbone Diagram) ใช้สำหรับวิเคราะห์เรื่องใด?", "choices": ["วิเคราะห์ต้นทุนกำไร", "วิเคราะห์หาสาเหตุของปัญหา (Root Cause Analysis)", "วิเคราะห์ตารางการทำงาน", "วิเคราะห์พฤติกรรมผู้บริโภค", "วิเคราะห์โครงสร้างองค์กร"], "answer": 1, "explanation": "ผังก้างปลา (Ishikawa Diagram) ใช้ระดมและจัดหมวดหมู่สาเหตุที่เป็นไปได้ของปัญหา เช่น คน เครื่องจักร วิธีการ วัสดุ เพื่อวิเคราะห์หาสาเหตุราก (Root Cause Analysis)", "section": "ส่วนที่ 2: ความสามารถในการคิดแบบองค์รวม (Holistic Thinking)"}, {"n": 15, "q": "หากฝ่ายผลิตเร่งผลิตสินค้าให้ได้จำนวนมากโดยไม่สนใจคุณภาพ จะเกิดผลกระทบเชิงระบบอย่างไร?", "choices": ["บริษัทได้กำไรสูงสุดทันที", "ฝ่ายขายทำงานง่ายขึ้นเพราะมีของขายเยอะ", "เกิดสินค้าตีกลับ ต้นทุนสูงขึ้น และเสียภาพลักษณ์แบรนด์", "พนักงานฝ่ายผลิตได้รับโบนัสเพิ่มขึ้น", "ลูกค้ามีความสุขเพราะได้รับสินค้าเร็ว"], "answer": 2, "explanation": "การมองแบบแยกส่วน (เอาแค่ยอดผลิต) จะสร้างผลเสียต่อระบบโดยรวม สินค้าด้อยคุณภาพถูกตีกลับ ต้นทุนแก้ไขสูงขึ้น และภาพลักษณ์แบรนด์เสียหาย ซึ่งกระทบทุกฝ่ายในระยะยาว", "section": "ส่วนที่ 2: ความสามารถในการคิดแบบองค์รวม (Holistic Thinking)"}, {"n": 16, "q": "'Butterfly Effect' ในบริบทของการทำงาน หมายความว่าอย่างไร?", "choices": ["การทำงานที่สวยงามเหมือนผีเสื้อ", "การเปลี่ยนแปลงจุดเล็กๆ จุดหนึ่ง อาจส่งผลกระทบมหาศาลต่อทั้งระบบ", "การทำงานที่มีอายุสั้นเหมือนวงจรชีวิตผีเสื้อ", "การบินหนีปัญหาเมื่อเจออุปสรรค", "การทำงานเป็นทีมเหมือนฝูงผีเสื้อ"], "answer": 1, "explanation": "Butterfly Effect คือแนวคิดที่ว่าการเปลี่ยนแปลงเพียงเล็กน้อย ณ จุดหนึ่งของระบบ อาจขยายผลเป็นผลกระทบที่ใหญ่มากต่อทั้งระบบได้ จึงไม่ควรมองข้ามรายละเอียดเล็ก ๆ", "section": "ส่วนที่ 2: ความสามารถในการคิดแบบองค์รวม (Holistic Thinking)"}, {"n": 17, "q": "การคิดแบบ 'Win-Win' ในการเจรจาต่อรอง เป็นการคิดแบบองค์รวมอย่างไร?", "choices": ["เป็นการมองที่ผลประโยชน์ของตนเองเป็นหลัก", "เป็นการยอมเสียเปรียบเพื่อให้งานจบ", "เป็นการมองหาจุดสมดุลที่ทุกฝ่ายในระบบพึงพอใจและอยู่ร่วมกันได้", "เป็นการใช้เล่ห์เหลี่ยมเพื่อเอาชนะ", "เป็นการแบ่งผลประโยชน์คนละครึ่งโดยไม่ดูเนื้องาน"], "answer": 2, "explanation": "การคิดแบบ Win-Win มององค์รวมของความสัมพันธ์ทุกฝ่ายในระบบ โดยหาจุดสมดุลที่ทุกฝ่ายได้ประโยชน์และอยู่ร่วมกันได้ยั่งยืน ไม่ใช่ฝ่ายใดฝ่ายหนึ่งชนะเพียงลำพัง", "section": "ส่วนที่ 2: ความสามารถในการคิดแบบองค์รวม (Holistic Thinking)"}, {"n": 18, "q": "ทำไมการลดต้นทุนโดยการใช้วัสดุเกรดต่ำ จึงอาจไม่ใช่การแก้ปัญหาแบบองค์รวมที่ดี?", "choices": ["เพราะทำให้คู่แข่งเยาะเย้ย", "เพราะอาจทำให้สินค้าเสียหายง่าย และเสียค่าซ่อมแซมมากกว่าเดิมในระยะยาว", "เพราะพนักงานไม่คุ้นเคยกับวัสดุใหม่", "เพราะทำให้ดูเป็นบริษัทที่ขี้เหนียว", "เพราะต้องเสียเวลาปรับตั้งเครื่องจักรให้เข้ากับวัสดุใหม่"], "answer": 1, "explanation": "การมองแค่ต้นทุนวัสดุคือการมองแยกส่วน เมื่อคิดทั้งระบบและทั้งวงจรชีวิตสินค้า วัสดุเกรดต่ำอาจทำให้สินค้าเสียง่าย เกิดค่าซ่อม ค่าเคลม และความไม่พอใจของลูกค้าที่แพงกว่าที่ประหยัดได้", "section": "ส่วนที่ 2: ความสามารถในการคิดแบบองค์รวม (Holistic Thinking)"}, {"n": 19, "q": "การคิดเชิงระบบคำนึงถึง 'Feedback Loop' (วงจรป้อนกลับ) เพื่ออะไร?", "choices": ["เพื่อตรวจสอบว่าระบบทำงานได้ตามเป้าหมายหรือไม่ และนำมาปรับปรุง", "เพื่อใช้จับผิดพนักงานที่ทำงานพลาด", "เพื่อส่งสัญญาณเสียงเตือนภัย", "เพื่อลดขั้นตอนการทำงานให้น้อยลง", "เพื่อเพิ่มความซับซ้อนให้ระบบ"], "answer": 0, "explanation": "Feedback Loop คือการนำผลลัพธ์ของระบบวนกลับมาเปรียบเทียบกับเป้าหมาย เพื่อรู้ว่าระบบทำงานได้ตามที่ต้องการหรือไม่ และใช้ปรับแก้ระบบให้ดีขึ้นอย่างต่อเนื่อง", "section": "ส่วนที่ 2: ความสามารถในการคิดแบบองค์รวม (Holistic Thinking)"}, {"n": 20, "q": "ข้อใดไม่ใช่ลักษณะของนักคิดเชิงระบบ (System Thinker)?", "choices": ["มองเห็นความสัมพันธ์เชื่อมโยง", "มองปัญหาที่โครงสร้างมากกว่าตัวบุคคล", "มองโลกในแง่ดีเกินจริงเสมอ", "มองเห็นภาพใหญ่ก่อนลงรายละเอียด", "มองเห็นการเปลี่ยนแปลงตามเวลา"], "answer": 2, "explanation": "นักคิดเชิงระบบมองความเชื่อมโยง มองโครงสร้างมากกว่าตัวบุคคล มองภาพใหญ่ และมองการเปลี่ยนแปลงตามเวลา ส่วนการมองโลกแง่ดีเกินจริงเป็นอคติ ไม่ใช่คุณลักษณะของนักคิดเชิงระบบ", "section": "ส่วนที่ 2: ความสามารถในการคิดแบบองค์รวม (Holistic Thinking)"}, {"n": 21, "q": "พนักงานทำความสะอาด มีความสำคัญต่อภาพรวมของโรงแรมระดับ 5 ดาวอย่างไร?", "choices": ["ไม่ค่อยสำคัญ เพราะใครๆ ก็ทำได้", "สำคัญน้อย เพราะไม่ได้หารายได้เข้าโรงแรมโดยตรง", "สำคัญมาก เพราะความสะอาดคือหัวใจของความประทับใจลูกค้า", "สำคัญปานกลาง เพราะลูกค้าเน้นอาหารอร่อยมากกว่า", "สำคัญเฉพาะช่วงที่มีการตรวจประเมิน"], "answer": 2, "explanation": "ในมุมมองเชิงระบบ ทุกตำแหน่งคือส่วนหนึ่งของประสบการณ์ลูกค้า ความสะอาดคือมาตรฐานขั้นพื้นฐานที่สุดที่ลูกค้าโรงแรม 5 ดาวคาดหวัง หากบกพร่องจะทำลายภาพลักษณ์ทั้งโรงแรมทันที", "section": "ส่วนที่ 3: ความสามารถในการคิดเชื่อมโยงกับองค์กร (Connecting Task to Organization)"}, {"n": 22, "q": "'Internal Customer' (ลูกค้าภายใน) หมายถึงใคร?", "choices": ["ลูกค้าที่เดินเข้ามาซื้อของในร้าน", "เพื่อนร่วมงานหรือแผนกถัดไปที่เรารับหรือส่งต่องานให้", "ผู้ถือหุ้นของบริษัท", "ญาติพี่น้องของเจ้าของบริษัท", "พนักงานที่ซื้อสินค้าของบริษัทตัวเอง"], "answer": 1, "explanation": "ลูกค้าภายในคือเพื่อนร่วมงานหรือแผนกถัดไปที่รับงานต่อจากเรา หากเราส่งงานที่มีคุณภาพให้ลูกค้าภายใน คุณภาพนั้นจะถูกส่งต่อไปจนถึงลูกค้าภายนอกในที่สุด", "section": "ส่วนที่ 3: ความสามารถในการคิดเชื่อมโยงกับองค์กร (Connecting Task to Organization)"}, {"n": 23, "q": "หากแผนกจัดซื้อสั่งวัตถุดิบผิดสเปก จะส่งผลกระทบเชื่อมโยงไปถึงแผนกใดบ้าง?", "choices": ["เฉพาะแผนกจัดซื้อเท่านั้น", "แผนกผลิต แผนกขาย และแผนกบัญชี", "แผนกบุคคล", "แผนกซ่อมบำรุง", "ไม่กระทบแผนกใดเลย"], "answer": 1, "explanation": "วัตถุดิบผิดสเปกทำให้ฝ่ายผลิตผลิตไม่ได้หรือผลิตของเสีย ฝ่ายขายส่งมอบล่าช้าหรือเสียลูกค้า และฝ่ายบัญชีต้องจัดการต้นทุน/การคืนของ แสดงให้เห็นว่างานหนึ่งจุดกระทบเป็นลูกโซ่ทั้งองค์กร", "section": "ส่วนที่ 3: ความสามารถในการคิดเชื่อมโยงกับองค์กร (Connecting Task to Organization)"}, {"n": 24, "q": "การที่พนักงานทุกคนเข้าใจ 'วิสัยทัศน์' (Vision) ขององค์กร มีประโยชน์อย่างไร?", "choices": ["เพื่อให้นำไปท่องจำเวลาผู้บริหารสอบถาม", "เพื่อให้ทุกคนมุ่งหน้าไปในทิศทางเดียวกัน เหมือนพายเรือลำเดียวกัน", "เพื่อให้บริษัทดูมีความเป็นสากล", "เพื่อให้พนักงานรู้ว่าใครเป็นเจ้าของบริษัท", "เพื่อใช้ในการออกแบบโลโก้บริษัท"], "answer": 1, "explanation": "วิสัยทัศน์คือทิศทางร่วมขององค์กร เมื่อทุกคนเข้าใจตรงกัน การตัดสินใจและการทำงานของแต่ละคนจะสอดคล้องไปในทางเดียวกัน เหมือนทุกคนพายเรือลำเดียวกันไปข้างหน้า", "section": "ส่วนที่ 3: ความสามารถในการคิดเชื่อมโยงกับองค์กร (Connecting Task to Organization)"}, {"n": 25, "q": "ทำไมช่างยนต์ต้องระมัดระวังไม่ให้น้ำมันเครื่องหยดเลอะรถลูกค้า แม้จะเป็นจุดเล็กๆ?", "choices": ["เพราะกลัวถูกหักเงินเดือน", "เพราะน้ำมันเครื่องมีราคาแพง", "เพราะความผิดพลาดเล็กน้อย อาจทำลายความเชื่อมั่นที่ลูกค้ามีต่อแบรนด์", "เพราะจะทำให้พื้นโรงงานสกปรก", "เพราะเป็นกฎระเบียบที่ตั้งไว้เฉยๆ"], "answer": 2, "explanation": "ในสายตาลูกค้า จุดบกพร่องเล็ก ๆ สะท้อนมาตรฐานของทั้งแบรนด์ (Moment of Truth) ความประมาทเพียงจุดเดียวอาจทำลายความเชื่อมั่นที่สะสมมานาน จึงต้องใส่ใจแม้รายละเอียดเล็กน้อย", "section": "ส่วนที่ 3: ความสามารถในการคิดเชื่อมโยงกับองค์กร (Connecting Task to Organization)"}, {"n": 26, "q": "แนวคิด 'Jigsaw' (จิ๊กซอว์) สอนเรื่องการทำงานในองค์กรอย่างไร?", "choices": ["งานของทุกคนคือชิ้นส่วนที่ขาดไม่ได้ ถ้าหายไปภาพรวมก็จะไม่สมบูรณ์", "การทำงานเหมือนเกม ต้องมีผู้แพ้ผู้ชนะ", "การทำงานต้องใช้เวลาต่อเติมยาวนาน", "รูปร่างของงานแต่ละคนต้องเหมือนกันหมด", "ใครทำเสร็จก่อนคนนั้นชนะ"], "answer": 0, "explanation": "แนวคิดจิ๊กซอว์สื่อว่างานของแต่ละคนคือชิ้นส่วนหนึ่งของภาพใหญ่ขององค์กร แม้ชิ้นเล็กแต่ขาดไม่ได้ หากชิ้นใดหายไปหรือบกพร่อง ภาพรวมขององค์กรก็จะไม่สมบูรณ์", "section": "ส่วนที่ 3: ความสามารถในการคิดเชื่อมโยงกับองค์กร (Connecting Task to Organization)"}, {"n": 27, "q": "หากท่านเป็นพนักงานบัญชี การส่งรายงานล่าช้า 1 วัน จะกระทบต่อระบบบริหารอย่างไร?", "choices": ["ไม่กระทบ เพราะผู้บริหารดูย้อนหลังได้", "กระทบต่อการตัดสินใจของผู้บริหารที่ต้องใช้ข้อมูลทันท่วงที", "กระทบเฉพาะฝ่ายบัญชีเอง", "ทำให้เปลืองกระดาษมากขึ้น", "ไม่กระทบมากนัก หากแจ้งเลื่อนกำหนดส่งให้ผู้บริหารทราบล่วงหน้า"], "answer": 1, "explanation": "รายงานบัญชีคือข้อมูลนำเข้าสำคัญของการตัดสินใจบริหาร เช่น กระแสเงินสดและการอนุมัติงบ หากส่งช้า การตัดสินใจทั้งระบบจะช้าหรือพลาดตามไปด้วย แม้จะช้าเพียงวันเดียว", "section": "ส่วนที่ 3: ความสามารถในการคิดเชื่อมโยงกับองค์กร (Connecting Task to Organization)"}, {"n": 28, "q": "การทำ SOP หรือ คู่มือปฏิบัติงานมาตรฐาน ช่วยเชื่อมโยงองค์กรอย่างไร?", "choices": ["ช่วยให้พนักงานใหม่ทำงานได้เหมือนพนักงานเก่า รักษาคุณภาพสินค้าให้คงที่", "ช่วยให้ผู้จัดการไม่ต้องลงมาดูงานลูกน้อง", "ช่วยให้ประหยัดงบประมาณการจ้างงาน", "ช่วยให้เอกสารมีความหนาน่าเชื่อถือ", "ช่วยกีดกันไม่ให้คนนอกรู้วิธีการทำงาน"], "answer": 0, "explanation": "SOP ทำให้ความรู้และวิธีทำงานที่ดีที่สุดถูกบันทึกเป็นมาตรฐานกลาง พนักงานทุกคนไม่ว่าเก่าหรือใหม่จึงทำงานได้ผลลัพธ์แบบเดียวกัน คุณภาพของสินค้าและบริการจึงคงที่ทั่วทั้งองค์กร", "section": "ส่วนที่ 3: ความสามารถในการคิดเชื่อมโยงกับองค์กร (Connecting Task to Organization)"}, {"n": 29, "q": "เป้าหมายส่วนบุคคล (KPI) ควรมีความสัมพันธ์กับเป้าหมายองค์กรอย่างไร?", "choices": ["ควรตั้งเป้าหมายให้ต่ำกว่าองค์กรเพื่อให้ทำสำเร็จง่ายๆ", "ควรตั้งเป้าหมายคนละเรื่องกับองค์กรเพื่อความหลากหลาย", "ควรท้าทายและสอดคล้อง (Align) เพื่อผลักดันให้องค์กรสำเร็จ", "ควรตั้งตามความพอใจของพนักงาน", "ไม่จำเป็นต้องมีความสัมพันธ์กัน"], "answer": 2, "explanation": "KPI ส่วนบุคคลที่ดีต้องท้าทายและสอดคล้อง (Align) กับเป้าหมายองค์กร เพื่อให้ความสำเร็จของแต่ละคนรวมกันเป็นความสำเร็จขององค์กร (เช่นแนวคิด OKR/Goal Alignment)", "section": "ส่วนที่ 3: ความสามารถในการคิดเชื่อมโยงกับองค์กร (Connecting Task to Organization)"}, {"n": 30, "q": "ในมุมมองเชิงระบบ 'กำไร' ขององค์กรควรมาจากอะไรจึงจะยั่งยืนที่สุด?", "choices": ["การกดค่าแรงพนักงานให้ต่ำที่สุด", "การเอาเปรียบผู้บริโภคด้วยการลดปริมาณ", "การส่งมอบ 'คุณค่า' (Value) ที่ลูกค้าพึงพอใจ ผ่านงานที่มีประสิทธิภาพ", "การผูกขาดตลาดเพียงเจ้าเดียว", "การเก็งกำไรค่าเงินและสินทรัพย์"], "answer": 2, "explanation": "กำไรที่ยั่งยืนต้องมาจากการส่งมอบคุณค่าที่ลูกค้าพึงพอใจผ่านการทำงานที่มีประสิทธิภาพ ส่วนการกดค่าแรง เอาเปรียบลูกค้า หรือผูกขาด จะทำลายระบบและย้อนกลับมาทำร้ายองค์กรในระยะยาว", "section": "ส่วนที่ 3: ความสามารถในการคิดเชื่อมโยงกับองค์กร (Connecting Task to Organization)"}, {"n": 31, "q": "ช่างซ่อมรถยนต์รับรถที่มีอาการเครื่องยนต์สั่น แล้วลงมือถอดเปลี่ยนหัวเทียนทันทีโดยไม่ผ่านขั้นตอนวิเคราะห์อาการและตรวจวัดตามลำดับ ผลเสียเชิงระบบที่สำคัญที่สุดคือข้อใด?", "choices": ["ทำให้ช่างคนอื่นมองว่าไม่เป็นมืออาชีพ", "ลูกค้าจะไม่พอใจที่ต้องรอนานขึ้นเล็กน้อย", "อาจแก้ผิดจุด เสียทั้งค่าอะไหล่ เวลา และรถยังไม่หาย ทำให้งานทั้งกระบวนการต้องวนกลับมาเริ่มใหม่", "หัวเทียนใหม่จะมีอายุการใช้งานสั้นลง", "ศูนย์บริการจะเสียค่าปรับจากผู้ผลิตรถยนต์"], "answer": 2, "explanation": "การข้ามขั้นตอนวิเคราะห์ทำให้การแก้ปัญหาเป็นการเดาสุ่ม เมื่อแก้ผิดจุด งานต้องวนซ้ำ ต้นทุนและเวลาของทั้งกระบวนการเพิ่มขึ้นโดยไม่จำเป็น", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 32, "q": "โรงงานแห่งหนึ่งใช้วงจร PDCA ปรับปรุงงาน แต่หัวหน้าสั่งข้ามขั้น Check ไปสู่ Act ทันทีเพราะเชื่อว่าวิธีใหม่ต้องได้ผล ความเสี่ยงเชิงระบบที่ตามมาคือข้อใด?", "choices": ["การปรับปรุงจะไม่อิงข้อมูลจริง หากวิธีใหม่ไม่ได้ผล ปัญหาเดิมจะถูกทำให้เป็นมาตรฐานและวนซ้ำทั้งระบบ", "งานจะเสร็จเร็วขึ้นเพราะลดขั้นตอนที่ไม่จำเป็น", "พนักงานจะสับสนเรื่องชื่อเรียกขั้นตอนเท่านั้น", "ต้องเสียค่าจ้างที่ปรึกษาเพิ่มขึ้น", "ฝ่ายบุคคลจะประเมินผลงานหัวหน้าไม่ได้"], "answer": 0, "explanation": "ขั้น Check คือการเปรียบเทียบผลจริงกับเป้าหมาย หากข้ามไป การตัดสินใจขยายผล (Act) จะตั้งอยู่บนความเชื่อ ไม่ใช่ข้อมูล และอาจฝังวิธีที่ผิดลงในมาตรฐาน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 33, "q": "พนักงานคลังสินค้าบันทึกยอดสต๊อกผิดพลาดโดยคีย์จำนวนเกินจริง หากมองตามห่วงโซ่คุณค่า ผลกระทบปลายทางที่รุนแรงที่สุดคือข้อใด?", "choices": ["พนักงานคลังต้องนับสต๊อกใหม่ทั้งหมด", "ฝ่ายบัญชีต้องปรับปรุงตัวเลขในงบ", "หัวหน้าคลังถูกตำหนิในที่ประชุม", "ระบบจะแจ้งเตือนให้สั่งซื้อเพิ่มโดยไม่จำเป็น", "ฝ่ายขายรับคำสั่งซื้อเกินของที่มีจริง ลูกค้าไม่ได้สินค้าตามสัญญา และความเชื่อมั่นต่อองค์กรทั้งหมดลดลง"], "answer": 4, "explanation": "ข้อมูลสต๊อกคือฐานของการรับออเดอร์ เมื่อยอดเกินจริง คำมั่นที่ให้ลูกค้าจะผิดพลาด ความเสียหายไม่หยุดที่คลังแต่ไหลไปถึงความเชื่อมั่นต่อทั้งองค์กร", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 34, "q": "ฝ่ายจัดซื้อพบซัพพลายเออร์รายใหม่ราคาถูกกว่าเดิม 8% แต่ประวัติการส่งมอบล่าช้าบ่อย หากคิดแบบองค์รวม ควรตัดสินใจด้วยหลักการใด?", "choices": ["เลือกทันทีเพราะ KPI ของฝ่ายจัดซื้อคือการลดต้นทุนวัตถุดิบ", "ประเมินต้นทุนรวมทั้งระบบ โดยนำความเสี่ยงที่สายการผลิตต้องหยุดรอของและค่าปรับส่งมอบล่าช้ามาคิดเทียบกับส่วนลดที่ได้", "ไม่เลือกเด็ดขาดเพราะของถูกย่อมคุณภาพต่ำเสมอ", "เลือกแล้วให้ฝ่ายผลิตสำรองสต๊อกเพิ่มเองตามสะดวก", "ต่อรองให้ลดราคาเพิ่มเป็น 10% ก่อนจึงตัดสินใจ"], "answer": 1, "explanation": "ราคาต่อหน่วยเป็นเพียงต้นทุนส่วนเดียว การคิดเชิงระบบต้องรวมต้นทุนแฝงจากการหยุดผลิตและการส่งมอบพลาด ซึ่งอาจสูงกว่าส่วนลดที่ได้หลายเท่า", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 35, "q": "งานเชื่อมโลหะในโรงฝึก ควรจัดลำดับขั้นตอนการทำงานตามหลักความปลอดภัยและ SOP อย่างไรจึงถูกต้องที่สุด?", "choices": ["เตรียมชิ้นงาน → เชื่อมทันที → ตรวจเครื่องเชื่อม → เก็บอุปกรณ์ → เคลียร์วัตถุไวไฟ", "ตรวจเครื่องเชื่อม → เชื่อมงาน → สวมอุปกรณ์ป้องกัน → เคลียร์วัตถุไวไฟ → เก็บงาน", "เคลียร์วัตถุไวไฟ → เชื่อมงาน → ตรวจเครื่องเชื่อม → สวมอุปกรณ์ป้องกัน → ตรวจพื้นที่หลังงาน", "สวมอุปกรณ์ป้องกัน → เคลียร์วัตถุไวไฟรอบพื้นที่ → ตรวจเครื่องเชื่อมและสายดิน → ปฏิบัติงานเชื่อม → ตรวจพื้นที่หลังเลิกงาน", "เชื่อมงานเร่งด่วนก่อน → ตรวจอุปกรณ์เมื่อมีเวลา → เคลียร์พื้นที่ → เก็บเครื่องมือ → รายงานผล"], "answer": 3, "explanation": "ขั้นตอนป้องกันอันตรายทั้งต่อตนเอง พื้นที่ และเครื่องมือ ต้องเสร็จก่อนลงมือเสมอ และต้องปิดท้ายด้วยการตรวจพื้นที่เพื่อป้องกันไฟคุกรุ่นหลังเลิกงาน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 36, "q": "ร้านอาหารแห่งหนึ่งยอดลูกค้าลดลง เจ้าของจึงลดจำนวนพนักงานเพื่อลดต้นทุน ทำให้บริการช้าลง ลูกค้ายิ่งลดลง แล้วเจ้าของก็ลดพนักงานลงอีก ปรากฏการณ์นี้ตรงกับแนวคิดใดมากที่สุด?", "choices": ["วงจรป้อนกลับแบบเสริมแรงในทางลบ ที่การแก้ปัญหาเฉพาะหน้ากลายเป็นตัวเร่งให้ปัญหาเดิมรุนแรงขึ้น", "การบริหารต้นทุนอย่างมีประสิทธิภาพตามภาวะเศรษฐกิจ", "การปรับสมดุลของระบบที่จะกลับสู่ปกติเอง", "ปัญหาจากพฤติกรรมลูกค้าที่ควบคุมไม่ได้", "การขาดแคลนแรงงานในตลาด"], "answer": 0, "explanation": "การลดคนเพื่อลดต้นทุนไปกดคุณภาพบริการซึ่งเป็นสาเหตุที่ทำให้ลูกค้าหาย ผลลัพธ์จึงวนกลับมาขยายปัญหาเดิม เป็นวงจรเสริมแรงขาลงที่ต้องตัดวงจรที่ต้นเหตุ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 37, "q": "ฝ่ายผลิตถูกวัดด้วย KPI จำนวนชิ้นงานต่อวันเพียงตัวเดียว พนักงานจึงเร่งเครื่องจักรจนอัตราของเสียพุ่งสูง ปัญหานี้สะท้อนหลักการเชื่อมโยง KPI กับภาพรวมองค์กรอย่างไร?", "choices": ["พนักงานขาดความรับผิดชอบ ควรลงโทษเป็นรายบุคคล", "KPI จำนวนชิ้นถูกต้องแล้ว ของเสียเป็นเรื่องของฝ่าย QC", "KPI เฉพาะจุดที่ไม่ถ่วงดุลด้วยตัวชี้วัดคุณภาพจะจูงใจให้คนทำดีเฉพาะตัวเลขตนเอง แต่สร้างต้นทุนให้ระบบรวม จึงต้องออกแบบชุดตัวชี้วัดให้สอดคล้องเป้าหมายองค์กร", "ควรยกเลิก KPI ทั้งหมดเพราะสร้างแรงกดดัน", "ควรเพิ่มเป้าจำนวนชิ้นให้สูงขึ้นเพื่อชดเชยของเสีย"], "answer": 2, "explanation": "ตัวชี้วัดคือตัวกำหนดพฤติกรรม เมื่อวัดแต่ปริมาณโดยไม่วัดคุณภาพ คนจะเพิ่มปริมาณโดยยอมแลกคุณภาพ ระบบวัดผลจึงต้องออกแบบให้ชี้ไปที่เป้าหมายรวม ไม่ใช่เป้าย่อยโดดๆ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 38, "q": "ฝ่ายซ่อมบำรุงขอเลื่อนการบำรุงรักษาเชิงป้องกันออกไป 1 เดือนเพราะฝ่ายผลิตไม่อยากหยุดเครื่อง หากมองผลกระทบลูกโซ่ ความเสี่ยงสูงสุดคือข้อใด?", "choices": ["ช่างซ่อมบำรุงจะว่างงานในเดือนนั้น", "ค่าน้ำมันหล่อลื่นจะถูกลงเพราะใช้ช้าลง", "ตารางบำรุงรักษาปีถัดไปต้องพิมพ์ใหม่", "ฝ่ายผลิตจะทำยอดได้เกินเป้าจนคลังเก็บไม่พอ", "เครื่องอาจเสียกะทันหันกลางแผนผลิต ทำให้หยุดยาวกว่าการหยุดตามแผนหลายเท่า กระทบการส่งมอบจนลูกค้าอาจเรียกค่าปรับ"], "answer": 4, "explanation": "การหยุดตามแผนคือการหยุดที่ควบคุมได้ แต่การเลื่อนออกไปแลกกับความเสี่ยงเครื่องเสียแบบควบคุมไม่ได้ ซึ่งลากผลกระทบเป็นลูกโซ่จากเครื่องจักรไปถึงลูกค้าปลายทาง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 39, "q": "พนักงานทำความสะอาดในโรงพยาบาลคนหนึ่งรู้สึกว่างานตนไม่เกี่ยวกับความสำเร็จขององค์กร หากใช้แนวคิดจิ๊กซอว์ ข้อใดอธิบายความเชื่อมโยงได้ถูกต้องที่สุด?", "choices": ["งานทำความสะอาดเป็นงานสนับสนุนที่ใครทำแทนก็ได้ จึงไม่กระทบภาพรวม", "ความสะอาดคือด่านควบคุมการติดเชื้อในโรงพยาบาล ซึ่งกระทบผลการรักษา ความปลอดภัยผู้ป่วย และชื่อเสียงขององค์กรโดยตรง", "งานนี้สำคัญเพราะทำให้ผู้บริหารประทับใจเวลาตรวจเยี่ยม", "งานนี้สำคัญเฉพาะช่วงที่มีการประเมินคุณภาพโรงพยาบาล", "ความสะอาดเป็นหน้าที่ของพยาบาลประจำวอร์ดมากกว่า"], "answer": 1, "explanation": "ผลลัพธ์หลักของโรงพยาบาลคือการรักษาที่ปลอดภัย การติดเชื้อในสถานพยาบาลเป็นความเสี่ยงใหญ่ งานทำความสะอาดจึงเป็นชิ้นส่วนที่ผลลัพธ์รวมขาดไม่ได้ ไม่ใช่งานชายขอบ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 40, "q": "ฝ่ายขายรับปากลูกค้าทุกรายว่าจะส่งด่วนพิเศษได้เสมอเพื่อปิดยอดขาย โดยไม่เช็คกำลังผลิต ผลเชิงระบบที่ตามมาคือข้อใด?", "choices": ["ยอดขายรวมจะเติบโตอย่างยั่งยืน", "ฝ่ายผลิตจะพัฒนาตัวเองให้เร็วขึ้นโดยอัตโนมัติ", "ลูกค้าทุกรายจะพึงพอใจมากขึ้นเพราะได้ของเร็ว", "ตารางผลิตถูกแทรกจนปั่นป่วน งานที่สัญญาไว้ก่อนกลับล่าช้า ต้นทุนเร่งด่วนพุ่ง และคำมั่นต่อลูกค้าโดยรวมเสียหายหนักกว่ายอดที่ได้มา", "ฝ่ายคลังจะมีสต๊อกหมุนเวียนเร็วขึ้นเป็นผลดี"], "answer": 3, "explanation": "การปิดยอดของฝ่ายเดียวโดยดึงทรัพยากรระบบมาใช้แบบไม่วางแผน คือ sub-optimization ที่ทำให้คิวงานทั้งระบบรวน และความน่าเชื่อถือรวมขององค์กรเสียหายมากกว่าประโยชน์เฉพาะหน้า", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 41, "q": "พนักงานเปิดร้านกาแฟตอนเช้า ควรจัดลำดับงานก่อน-หลังอย่างไรให้พร้อมรับลูกค้าอย่างเป็นระบบที่สุด?", "choices": ["เปิดรับลูกค้าทันทีที่ถึงร้าน แล้วค่อยทยอยเตรียมของระหว่างขาย", "ตรวจเงินทอนก่อนเป็นอันดับแรก → เปิดรับลูกค้า → เปิดเครื่องชง → เตรียมวัตถุดิบ → ทำความสะอาด", "เตรียมวัตถุดิบ → เปิดรับลูกค้า → อุ่นเครื่องชงระหว่างมีออเดอร์ → ตรวจ POS → ทำความสะอาดตอนสาย", "ทำความสะอาดตอนปิดร้านแทนตอนเช้า แล้วเปิดรับลูกค้าได้เลย", "ตรวจความสะอาดและเปิดระบบไฟ-เครื่องชง → อุ่นเครื่องและตั้งค่าเครื่องบด → เตรียมวัตถุดิบและนม → ตรวจเงินทอนและระบบ POS → เปิดรับลูกค้า"], "answer": 4, "explanation": "งานที่ใช้เวลารอ (อุ่นเครื่อง) ต้องเริ่มก่อน และทุกจุดที่ลูกค้าต้องพึ่งพา (วัตถุดิบ เงินทอน ระบบขาย) ต้องพร้อมก่อนเปิดรับ มิฉะนั้นลูกค้าคิวแรกจะติดขัดทันที", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 42, "q": "แผนกแม่บ้านโรงแรมต้องการทำห้องให้เร็วขึ้นจึงข้ามขั้นตอนตรวจนับมินิบาร์ ผลกระทบข้ามฝ่ายที่ตามมาคือข้อใด?", "choices": ["ไม่มีผลกระทบเพราะมินิบาร์เป็นรายได้ส่วนน้อย", "แผนกช่างจะทำงานหนักขึ้น", "รายได้มินิบาร์ตกหล่นเก็บเงินไม่ได้ ข้อมูลการเงินคลาดเคลื่อน และแขกห้องถัดไปเจอของขาดหรือของที่ถูกเปิดแล้ว กระทบภาพลักษณ์บริการ", "แม่บ้านจะได้รับคำชมเรื่องความเร็วจากผู้จัดการ", "ระบบจองห้องออนไลน์จะล่ม"], "answer": 2, "explanation": "ขั้นตอนที่ถูกตัดออกไม่ได้หายไปเฉยๆ แต่ผลักภาระไปที่ฝ่ายการเงินซึ่งเก็บเงินไม่ครบ และไปที่ประสบการณ์แขกคนถัดไป ความเร็วที่ได้จึงแลกด้วยต้นทุนของระบบรวม", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 43, "q": "ท่านรับผิดชอบขั้นตอนกลางของสายงานและรู้ตัวว่างานของตนจะเสร็จช้ากว่ากำหนด 2 วัน การกระทำแรกที่ถูกต้องตามหลักคิดเชิงระบบคือข้อใด?", "choices": ["แจ้งหน่วยงานถัดไปและผู้ประสานงานทันที เพื่อให้ทั้งสายงานปรับแผนและจัดลำดับใหม่ได้ก่อนความเสียหายลาม", "เงียบไว้แล้วเร่งทำให้ทันโดยหวังว่าจะไม่มีใครรู้", "รอให้หน่วยงานถัดไปทวงงานก่อนแล้วค่อยชี้แจง", "ส่งงานที่ยังไม่เรียบร้อยไปก่อนตามกำหนดเดิมเพื่อไม่ให้ถูกตำหนิ", "ขอย้ายกำหนดส่งของตนเองโดยไม่ต้องแจ้งใครเพราะเป็นงานภายใน"], "answer": 0, "explanation": "ความล่าช้าที่ถูกแจ้งล่วงหน้าคือข้อมูลที่ระบบใช้ปรับตัวได้ แต่ความล่าช้าที่ถูกปิดบังจะกลายเป็นความเสียหายลูกโซ่ที่ไม่มีใครทันตั้งรับ การส่งงานไม่เรียบร้อยยิ่งผลักปัญหาไปปลายน้ำ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 44, "q": "องค์กรตั้ง Objective ประจำปีว่า เพิ่มความพึงพอใจลูกค้าจาก 80% เป็น 90% ฝ่ายไอทีควรตั้งเป้าหมายของฝ่ายอย่างไรจึงเรียกว่าสอดคล้อง (align) กับองค์กรมากที่สุด?", "choices": ["ตั้งเป้าอัปเกรดคอมพิวเตอร์สำนักงานให้ครบทุกเครื่องภายในปีนี้", "ตั้งเป้าลดเวลาระบบบริการลูกค้าล่มและเพิ่มความเร็วช่องทางออนไลน์ที่ลูกค้าใช้งาน โดยวัดผลเชื่อมกับคะแนนความพึงพอใจ", "ตั้งเป้าประหยัดงบไอทีให้มากที่สุดเพื่อโชว์ผลงานฝ่าย", "ตั้งเป้าเรียนรู้เทคโนโลยีใหม่ให้มากที่สุดโดยไม่ผูกกับงานใด", "ไม่ต้องตั้งเป้าเพราะไอทีเป็นฝ่ายสนับสนุน ไม่เกี่ยวกับลูกค้า"], "answer": 1, "explanation": "การ align คือการถามว่างานของฝ่ายเราไปขยับตัวชี้วัดองค์กรผ่านเส้นทางใด ระบบที่ลูกค้าใช้งานคือจุดที่ไอทีส่งผลต่อความพึงพอใจโดยตรง จึงควรตั้งเป้าที่จุดนั้น", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 45, "q": "สายการผลิตมี 3 สถานีต่อกัน สถานีที่ 2 ทำงานช้าที่สุด หากผู้จัดการเพิ่มกำลังการผลิตให้สถานีที่ 1 อย่างเดียว จะเกิดอะไรขึ้นกับระบบ?", "choices": ["ผลผลิตรวมของทั้งสายจะเพิ่มขึ้นตามสัดส่วนที่สถานี 1 เร็วขึ้น", "สถานีที่ 2 จะถูกกระตุ้นให้เร็วขึ้นเองโดยอัตโนมัติ", "สถานีที่ 3 จะได้รับงานมากขึ้นทันที", "งานระหว่างทำจะกองสะสมหน้าสถานีที่ 2 มากขึ้น ผลผลิตรวมไม่เพิ่ม เพราะระบบถูกจำกัดด้วยจุดคอขวด", "ต้นทุนต่อหน่วยของทั้งสายจะลดลงชัดเจน"], "answer": 3, "explanation": "อัตราการไหลของทั้งระบบถูกกำหนดโดยจุดที่ช้าที่สุด การเร่งจุดที่ไม่ใช่คอขวดมีแต่สร้างงานค้างและต้นทุนจม ต้องแก้ที่สถานีที่ 2 ผลรวมจึงจะดีขึ้น", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 46, "q": "หัวหน้างานเสนอให้เขียนขั้นตอนการทำงานมาตรฐาน (SOP) ทั้งที่พนักงานปัจจุบันชำนาญงานอยู่แล้ว เหตุผลเชิงระบบที่หนักแน่นที่สุดคือข้อใด?", "choices": ["เพื่อให้มีเอกสารครบตามที่ผู้ตรวจประเมินต้องการเท่านั้น", "เพื่อให้หัวหน้าใช้จับผิดพนักงานได้ง่ายขึ้น", "เพื่อให้คุณภาพงานคงที่ไม่ผูกกับตัวบุคคล ถ่ายทอดให้คนใหม่ได้ ตรวจสอบหาจุดผิดพลาดได้ และใช้เป็นฐานในการปรับปรุงต่อยอด", "เพื่อเพิ่มปริมาณงานเอกสารให้ฝ่ายธุรการ", "เพราะกฎหมายแรงงานบังคับให้ทุกองค์กรต้องมี SOP"], "answer": 2, "explanation": "ความชำนาญที่อยู่ในหัวคนคือความเสี่ยงของระบบ เมื่อคนลาออกหรือสลับงาน คุณภาพจะแกว่ง SOP ทำให้ความรู้กลายเป็นทรัพย์สินของระบบที่ส่งต่อและพัฒนาได้", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 47, "q": "ซัพพลายเออร์ส่งวัตถุดิบให้โรงงานล่าช้า 2 วัน โรงงานผลิตช้าตาม ศูนย์กระจายสินค้าจัดส่งช้าตาม หากถามว่าความเสียหายที่แท้จริงของเหตุการณ์ลูกโซ่นี้ไปสิ้นสุดที่ใด ข้อใดถูกต้องที่สุด?", "choices": ["สิ้นสุดที่ฝ่ายจัดซื้อเพราะเป็นผู้เลือกซัพพลายเออร์", "สิ้นสุดที่โรงงานเพราะเป็นผู้ผลิต", "สิ้นสุดที่ศูนย์กระจายสินค้าซึ่งเป็นหน่วยสุดท้ายที่ทำงาน", "สิ้นสุดที่ฝ่ายขนส่งเพราะเป็นผู้ส่งของช้า", "สิ้นสุดที่ลูกค้าปลายทางที่ไม่ได้สินค้าตามกำหนด และย้อนกลับมาเป็นความเสียหายต่อความเชื่อมั่นในแบรนด์ของทุกหน่วยในห่วงโซ่ร่วมกัน"], "answer": 4, "explanation": "ทุกหน่วยในห่วงโซ่มีลูกค้าปลายทางร่วมกัน ความล่าช้าที่จุดใดจุดหนึ่งจะสะสมและไปแสดงผลที่ประสบการณ์ลูกค้า ซึ่งย้อนกลับมากระทบทั้งห่วงโซ่ ไม่ใช่หน่วยใดหน่วยเดียว", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 48, "q": "บริษัทแก้ปัญหาส่งของช้าด้วยการให้ฝ่ายแพ็คสินค้าทำโอทีทุกวัน โดยไม่เคยตรวจสอบว่าต้นเหตุคือฝ่ายขายคีย์ข้อมูลออเดอร์ผิดบ่อยจนต้องแก้ซ้ำ วิธีแก้แบบนี้มีจุดอ่อนเชิงระบบอย่างไร?", "choices": ["เป็นการแก้ที่อาการปลายเหตุ ต้นทุนโอทีเพิ่มถาวรแต่สาเหตุรากยังผลิตปัญหาป้อนเข้าระบบทุกวัน ปัญหาจึงไม่มีวันหมด", "เป็นวิธีที่ดีเพราะพนักงานได้รายได้เพิ่ม", "เป็นวิธีที่ดีเพราะแก้ปัญหาได้เร็วที่สุด", "จุดอ่อนเดียวคือพนักงานจะเหนื่อยเกินไป", "ไม่มีจุดอ่อนหากลูกค้าได้รับของทันเวลา"], "answer": 0, "explanation": "การเพิ่มแรงที่ปลายน้ำโดยไม่ปิดต้นทางของเสีย คือการจ่ายต้นทุนซ้ำๆ เพื่อชดเชยความผิดพลาดที่ยังไหลเข้ามาเรื่อยๆ การแก้เชิงระบบต้องตามไปแก้ที่จุดกำเนิดปัญหา", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 49, "q": "ร้านเบเกอรี่ทดลองใช้สูตรอบใหม่เป็นเวลา 1 เดือนเพื่อลดขนมไหม้ เมื่อครบกำหนด ขั้น Check ตามวงจร PDCA ที่ถูกต้องคือการทำสิ่งใด?", "choices": ["ประกาศใช้สูตรใหม่เป็นมาตรฐานทันทีเพราะทดลองครบเดือนแล้ว", "กลับไปใช้สูตรเดิมเพื่อความปลอดภัยไว้ก่อน", "ให้พนักงานโหวตว่าชอบสูตรไหนมากกว่า", "นำข้อมูลอัตราขนมไหม้จริงตลอดเดือนมาเปรียบเทียบกับเป้าหมายที่ตั้งไว้ และวิเคราะห์ว่าส่วนต่างเกิดจากอะไร", "เริ่มทดลองสูตรใหม่อีกสูตรซ้อนเข้าไปทันที"], "answer": 3, "explanation": "Check คือการเทียบผลลัพธ์จริงกับเป้าหมายด้วยข้อมูล ไม่ใช่ความรู้สึกหรือการครบกำหนดเวลา ผลการเทียบนี้จึงจะบอกได้ว่าควร Act ด้วยการขยายผลหรือปรับแผนใหม่", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 50, "q": "พนักงานขับรถส่งสินค้ามองว่าตนแค่ขับรถ ไม่เกี่ยวกับ KPI องค์กรเรื่องความพึงพอใจลูกค้า ข้อใดโต้แย้งความคิดนี้ได้ตรงที่สุดตามหลักคิดเชื่อมโยงงานกับภาพรวม?", "choices": ["การขับรถเป็นงานใช้แรงงาน จึงวัดผลด้วยความพึงพอใจไม่ได้", "การส่งของตรงเวลาและสภาพสินค้าสมบูรณ์คือจุดสัมผัสสุดท้ายที่ลูกค้าใช้ตัดสินทั้งองค์กร ต่อให้ทุกฝ่ายก่อนหน้าทำดีแค่ไหน ถ้าปลายทางพลาด ลูกค้าก็จำภาพนั้น", "ความพึงพอใจลูกค้าเป็นหน้าที่ของฝ่ายการตลาดเพียงฝ่ายเดียว", "พนักงานขับรถเกี่ยวข้องเฉพาะ KPI เรื่องการประหยัดน้ำมัน", "ลูกค้าไม่เคยเห็นหน้าพนักงานขับรถจึงไม่มีผลต่อความรู้สึก"], "answer": 1, "explanation": "คุณค่าที่ทุกฝ่ายร่วมกันสร้างถูกส่งมอบจริงที่ปลายทาง งานส่งของจึงเป็นชิ้นส่วนชี้ขาดของประสบการณ์ลูกค้า ไม่ใช่งานที่แยกขาดจากภาพรวม", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 51, "q": "เมื่อได้รับเรื่องร้องเรียนจากลูกค้า การจัดลำดับขั้นตอนจัดการอย่างเป็นระบบที่ถูกต้องที่สุดคือข้อใด?", "choices": ["รับฟังและบันทึกปัญหา → แก้ไขเฉพาะหน้าให้ลูกค้า → วิเคราะห์หาสาเหตุราก → ปรับปรุงกระบวนการ → ติดตามผลว่าไม่เกิดซ้ำ", "แก้ไขเฉพาะหน้า → ปิดเรื่องทันทีเพื่อให้ยอดร้องเรียนต่ำ → รอดูว่าจะเกิดซ้ำหรือไม่", "วิเคราะห์สาเหตุรากให้เสร็จก่อนหลายสัปดาห์ → จึงค่อยติดต่อลูกค้ากลับ", "ส่งเรื่องให้ฝ่ายอื่นที่เกี่ยวข้องรับผิดชอบ → รอฝ่ายนั้นติดต่อลูกค้าเอง", "ชี้แจงลูกค้าว่าปฏิบัติถูกต้องตามระเบียบแล้ว → บันทึกเรื่องไว้เป็นหลักฐาน"], "answer": 0, "explanation": "ลูกค้าต้องได้รับการดูแลทันทีก่อน แต่ระบบจะดีขึ้นได้ก็ต่อเมื่อตามไปแก้สาเหตุรากและปรับกระบวนการ แล้วปิดวงจรด้วยการติดตามผล ลำพังการแก้เฉพาะหน้าไม่ป้องกันการเกิดซ้ำ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 52, "q": "ผู้บริหารตัดงบฝึกอบรมพนักงานทั้งหมดเพื่อให้ผลกำไรไตรมาสนี้ถึงเป้า หากวิเคราะห์แบบองค์รวม จุดอ่อนของการตัดสินใจนี้คือข้อใด?", "choices": ["ไม่มีจุดอ่อนเพราะกำไรคือเป้าหมายสูงสุดขององค์กร", "พนักงานจะมีเวลาทำงานมากขึ้นเพราะไม่ต้องเข้าอบรม", "งบที่ประหยัดได้สามารถนำไปจ่ายโบนัสผู้บริหาร", "ฝ่ายฝึกอบรมจะถูกยุบซึ่งช่วยลดต้นทุนถาวร", "กำไรระยะสั้นแลกกับทักษะที่ถดถอย ของเสียและอุบัติเหตุมีแนวโน้มเพิ่ม ต้นทุนรวมระยะยาวอาจสูงกว่างบที่ประหยัดได้หลายเท่า"], "answer": 4, "explanation": "การมองภาพใหญ่ต้องมองทั้งแกนเวลา งบอบรมคือการลงทุนในขีดความสามารถของระบบ การตัดออกทำให้ตัวเลขวันนี้สวยขึ้นโดยโอนต้นทุนไปเป็นความเสียหายในอนาคต", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 53, "q": "ร้านค้าออนไลน์แห่งหนึ่งได้รีวิวดี ทำให้ลูกค้าใหม่เพิ่มขึ้น ยอดขายโต จึงมีทุนพัฒนาบริการให้ดีขึ้นอีก และได้รีวิวดีเพิ่มอีก วงจรนี้จัดเป็นอะไรและควรบริหารอย่างไร?", "choices": ["วงจรถ่วงดุลที่ระบบจะหยุดโตเองตามธรรมชาติ จึงไม่ต้องทำอะไร", "ความบังเอิญทางการตลาดที่ไม่ควรนำมาวางแผน", "วงจรป้อนกลับแบบเสริมแรงขาขึ้น ควรปกป้องจุดตั้งต้นของวงจรคือคุณภาพบริการอย่างเข้มงวด เพราะถ้าคุณภาพพัง วงจรเดียวกันจะหมุนกลับเป็นขาลงได้เร็วพอกัน", "ปัญหาการเติบโตเร็วเกินไปที่ต้องรีบชะลอ", "วงจรที่เกิดจากคู่แข่งอ่อนแอ ไม่เกี่ยวกับการกระทำของร้าน"], "answer": 2, "explanation": "วงจรเสริมแรงขยายผลไปทิศทางเดียวกันเรื่อยๆ ทั้งขาขึ้นและขาลง ผู้บริหารระบบจึงต้องรู้ว่าตัวแปรใดเป็นจุดตั้งต้น และปกป้องมันไว้ก่อนที่วงจรจะพลิกทิศ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 54, "q": "ฝ่ายการตลาดจัดโปรโมชั่นลดราคาแรงโดยไม่แจ้งฝ่ายคลังและฝ่ายผลิตล่วงหน้า ผลลัพธ์เชิงระบบที่น่าจะเกิดมากที่สุดคือข้อใด?", "choices": ["ยอดขายเพิ่มและทุกฝ่ายได้ประโยชน์ร่วมกัน", "สินค้าขาดสต๊อกกลางแคมเปญ ลูกค้าที่ตั้งใจมาซื้อผิดหวัง โปรที่หวังสร้างยอดกลับกลายเป็นการทำลายความเชื่อมั่นและดันต้นทุนเร่งผลิตให้พุ่ง", "ฝ่ายคลังจะระบายสินค้าเก่าได้พอดี", "ฝ่ายผลิตจะได้ฝึกทำงานภายใต้แรงกดดัน", "ไม่มีผลกระทบเพราะแต่ละฝ่ายมีแผนของตนเองอยู่แล้ว"], "answer": 1, "explanation": "แคมเปญที่กระตุ้นความต้องการโดยไม่เตรียมฝั่งอุปทาน คือการสร้างคำมั่นที่ระบบส่งมอบไม่ได้ ผลคือความผิดหวังของลูกค้าจำนวนมากในเวลาสั้นๆ ซึ่งร้ายกว่าไม่จัดโปรเสียอีก", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 55, "q": "ท่านมีงาน 4 ชิ้นเข้ามาพร้อมกันและทำได้ทีละชิ้น หลักคิดเชิงระบบที่ควรใช้จัดลำดับก่อน-หลังคือข้อใด?", "choices": ["ทำงานที่ง่ายที่สุดก่อนเพื่อให้จำนวนงานค้างลดเร็ว", "ทำงานของหัวหน้าที่ทวงบ่อยที่สุดก่อน", "ทำตามลำดับที่งานเข้ามาอย่างเคร่งครัดเสมอ", "พิจารณาว่างานใดเป็นต้นทางที่หน่วยงานอื่นต้องรอใช้ผลลัพธ์ และงานใดมีเส้นตายกระทบระบบรวม แล้วเรียงตามผลกระทบนั้น", "ทำงานที่ตนเองถนัดที่สุดก่อนเพื่อคุณภาพสูงสุด"], "answer": 3, "explanation": "งานที่คนอื่นรอใช้ผลลัพธ์คือจุดที่ความล่าช้าจะขยายตัวเป็นลูกโซ่ การจัดลำดับเชิงระบบจึงดูที่ผลกระทบต่อการไหลของงานทั้งเครือข่าย ไม่ใช่ความง่ายหรือเสียงทวง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 56, "q": "เกษตรกรพบว่าผลผลิตลดลงจึงอัดปุ๋ยเคมีเพิ่มเป็นสองเท่าทุกฤดู ผลผลิตดีดขึ้นชั่วคราวแล้วกลับตกต่ำลงอีก การวิเคราะห์เชิงระบบข้อใดถูกต้องที่สุด?", "choices": ["ควรเพิ่มปุ๋ยเป็นสามเท่าเพราะสองเท่ายังไม่พอ", "ปัญหาอยู่ที่พันธุ์พืชอย่างเดียว ควรเปลี่ยนพันธุ์", "สภาพอากาศคือสาเหตุเดียวที่ควบคุมไม่ได้", "ควรเลิกทำเกษตรเพราะระบบถึงทางตัน", "การเร่งผลด้วยปุ๋ยเกินขนาดกำลังทำลายโครงสร้างและจุลินทรีย์ในดินซึ่งเป็นฐานของผลผลิตระยะยาว ยิ่งอัดปุ๋ยยิ่งเสื่อม ต้องหันมาฟื้นฟูดินซึ่งเป็นสาเหตุราก"], "answer": 4, "explanation": "นี่คือรูปแบบการแก้ปัญหาที่ตัวแก้กลายเป็นตัวกัดกร่อนรากฐานของระบบ ผลดีระยะสั้นบังตาไม่ให้เห็นความเสื่อมสะสม ทางออกคือแก้ที่ฐานของระบบ ไม่ใช่เพิ่มยาแรงขึ้น", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 57, "q": "ปลายเดือนยอดผลิตใกล้ไม่ถึงเป้า พนักงาน QC ถูกกดดันให้ปล่อยผ่านชิ้นงานที่เกือบได้มาตรฐาน หากคิดเชิงห่วงโซ่คุณค่า เหตุใดจึงไม่ควรปล่อยผ่าน?", "choices": ["เพราะหน้าที่ของ QC คือการปกป้องคุณค่าที่จะถึงมือลูกค้า การปล่อยผ่านคือการส่งต่อความเสี่ยงให้ปลายน้ำ ซึ่งค่าเคลม การเรียกคืนสินค้า และชื่อเสียงที่เสียไป แพงกว่ายอดที่ขาดหลายเท่า", "เพราะเครื่องตรวจสอบจะบันทึกข้อมูลไว้เป็นหลักฐานเอาผิด", "เพราะพนักงาน QC จะถูกหักโบนัสหากถูกจับได้", "เพราะชิ้นงานเกือบได้มาตรฐานขายในราคาเต็มไม่ได้", "เพราะฝ่ายผลิตจะไม่ได้เรียนรู้บทเรียนเรื่องวินัย"], "answer": 0, "explanation": "QC ไม่ใช่แค่ด่านเอกสารแต่เป็นกลไกป้องกันไม่ให้ต้นทุนความบกพร่องไหลออกไปขยายตัวนอกองค์กร เหตุผลที่แท้จริงจึงอยู่ที่ผลกระทบต่อลูกค้าและระบบรวม ไม่ใช่การกลัวถูกจับผิด", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 58, "q": "ฝ่ายไอทีเฮลป์เดสก์แก้ทุกปัญหาด้วยการสั่งรีสตาร์ทเครื่อง ทำให้ปิดงานได้เร็ว ยอด ticket ที่ปิดต่อวันสูงเป็นอันดับหนึ่ง แต่ผู้ใช้แจ้งปัญหาเดิมซ้ำทุกสัปดาห์ การวิเคราะห์ข้อใดตรงที่สุด?", "choices": ["ทีมนี้ทำงานดีที่สุดตามตัวเลขที่ปรากฏ ควรได้รางวัล", "ผู้ใช้งานคือปัญหาที่แท้จริงเพราะใช้เครื่องไม่เป็น", "ตัวเลขปิดงานสวยแต่สาเหตุรากไม่เคยถูกแก้ ปริมาณงานซ้ำวนกลับเข้าระบบเรื่อยๆ ภาระรวมและเวลาสูญเปล่าขององค์กรจึงสูงขึ้นทั้งที่ KPI ฝ่ายดูดี", "ควรเพิ่มพนักงานเฮลป์เดสก์เพื่อรองรับ ticket ที่มากขึ้น", "ควรจำกัดสิทธิ์ผู้ใช้ในการแจ้งปัญหาเพื่อลดจำนวน ticket"], "answer": 2, "explanation": "นี่คือภาพคลาสสิกของตัวชี้วัดที่ขัดกับเป้าหมายจริง การปิดงานเร็วโดยไม่แก้สาเหตุรากคือการผลิต ticket ในอนาคต ระบบวัดผลควรวัดอัตราการเกิดซ้ำควบคู่กับความเร็ว", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 59, "q": "ผู้จัดการต้องการลดเวลารอของลูกค้าที่เคาน์เตอร์บริการ จึงคิดจะสั่งเพิ่มพนักงานทันที หากยึดหลักคิดอย่างเป็นขั้นตอน สิ่งที่ควรทำก่อนตัดสินใจคือข้อใด?", "choices": ["สั่งเพิ่มพนักงานไปก่อนแล้วค่อยประเมินผลภายหลัง", "สอบถามความเห็นพนักงานหน้าเคาน์เตอร์แล้วทำตามเสียงส่วนใหญ่", "ดูว่าคู่แข่งใช้พนักงานกี่คนแล้วใช้เท่ากัน", "เก็บข้อมูลก่อนว่าลูกค้ารอนานที่ขั้นตอนใด ช่วงเวลาใด และเพราะอะไร เพื่อให้รู้ว่าคอขวดจริงอยู่ตรงไหนก่อนเลือกวิธีแก้", "ลดจำนวนลูกค้าด้วยการจำกัดคิวต่อวัน"], "answer": 3, "explanation": "การเพิ่มคนคือคำตอบเดียวจากคำตอบที่เป็นไปได้หลายแบบ ถ้าคอขวดจริงคือระบบเอกสารหรือขั้นตอนซ้ำซ้อน การเพิ่มคนจะเปลืองต้นทุนโดยแก้ไม่ตรงจุด ต้องวินิจฉัยก่อนจ่ายยา", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 60, "q": "พนักงานธุรการฝ่ายจัดซื้อรู้สึกว่างานคีย์เอกสารของตนไร้ความหมายต่อองค์กร หากใช้แนวคิดจิ๊กซอว์ ข้อใดสะท้อนความจริงเชิงระบบที่สุด?", "choices": ["ความรู้สึกนั้นถูกต้อง เพราะงานเอกสารไม่สร้างรายได้โดยตรง", "เอกสารจัดซื้อที่ช้าหรือผิดหนึ่งใบ อาจทำให้วัตถุดิบเข้าช้า สายการผลิตสะดุด และการส่งมอบลูกค้าเลื่อนทั้งสาย งานชิ้นเล็กจึงเป็นข้อต่อของผลลัพธ์ใหญ่", "งานธุรการมีค่าเฉพาะเมื่อผู้บริหารสังเกตเห็น", "องค์กรควรยกเลิกงานเอกสารทั้งหมดแล้วใช้ระบบอัตโนมัติ", "คุณค่าของงานขึ้นอยู่กับเงินเดือนของตำแหน่งนั้น"], "answer": 1, "explanation": "ระบบใหญ่ประกอบจากข้อต่อเล็กๆ ที่ส่งงานต่อกัน ความผิดพลาดที่ข้อต่อใดจะเดินทางไปโผล่ที่ผลลัพธ์รวม แนวคิดจิ๊กซอว์คือการเห็นว่าภาพจะไม่สมบูรณ์หากขาดชิ้นใดชิ้นหนึ่ง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 61, "q": "งานก่อสร้างอาคาร งานฐานรากล่าช้า 3 วันจากแผน ผู้ควบคุมงานควรวิเคราะห์ผลกระทบอย่างไรจึงถูกต้องตามหลักคิดเชิงระบบ?", "choices": ["ไม่ต้องทำอะไรเพราะ 3 วันเป็นความล่าช้าเล็กน้อย", "สั่งลงโทษทีมฐานรากก่อนเป็นอันดับแรกเพื่อไม่ให้เป็นเยี่ยงอย่าง", "งานโครงสร้าง งานระบบ และงานตกแต่งที่ต่อคิวอยู่จะถูกเลื่อนทั้งสาย ต้องรีบปรับแผนรวม เจรจาคิววัสดุและแรงงาน และประเมินความเสี่ยงค่าปรับตามสัญญาทันที", "เร่งงานตกแต่งภายในให้เร็วขึ้นเพื่อชดเชยเวลาที่เสียไป", "เปลี่ยนผู้รับเหมาฐานรากทันทีระหว่างงาน"], "answer": 2, "explanation": "งานก่อสร้างเป็นลำดับพึ่งพากัน งานต้นทางที่ช้าจะดันตารางของทุกงานปลายทาง การตอบสนองที่ถูกคือปรับแผนทั้งระบบทันที ส่วนการเร่งงานที่ยังไม่ถึงคิวช่วยอะไรไม่ได้", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 62, "q": "เครื่องจักรในแผนกของท่านว่างงานชั่วคราว ขณะที่แผนกข้างเคียงซึ่งเป็นคอขวดของโรงงานมีงานล้นมือ การตัดสินใจที่ดีที่สุดต่อระบบรวมคือข้อใด?", "choices": ["เสนอกำลังคนและเวลาไปช่วยระบายงานที่จุดคอขวด เพราะผลผลิตรวมของโรงงานถูกกำหนดด้วยจุดที่ช้าที่สุด ไม่ใช่ความขยันของแต่ละแผนก", "เดินเครื่องผลิตชิ้นส่วนของแผนกตนล่วงหน้าไว้มากๆ เพื่อไม่ให้เครื่องว่างเปล่าประโยชน์", "ให้พนักงานพักผ่อนรอจนกว่างานของแผนกตนจะมา", "ขอให้หัวหน้าหางานใหม่มาป้อนแผนกตนเพิ่ม", "ปิดเครื่องเพื่อประหยัดไฟแล้วรายงานว่าแผนกตนไม่มีปัญหา"], "answer": 0, "explanation": "การเดินเครื่องผลิตล่วงหน้าดูขยันแต่สร้างสต๊อกจมและไม่เพิ่มผลผลิตรวมแม้แต่ชิ้นเดียว ทรัพยากรว่างควรไหลไปที่คอขวดเพราะทุกชิ้นที่คอขวดทำได้เพิ่มคือผลผลิตรวมที่เพิ่มจริง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 63, "q": "ผู้จัดการสาขาร้านสะดวกซื้อลดชั่วโมงเปิดร้านลง 4 ชั่วโมงต่อวันเพื่อประหยัดค่าแรงและค่าไฟ ตัวเลขต้นทุนสาขาดีขึ้นทันที ข้อใดคือการประเมินแบบมองภาพใหญ่ที่ครบถ้วนที่สุด?", "choices": ["การตัดสินใจถูกต้องเพราะต้นทุนคือสิ่งเดียวที่ผู้จัดการควบคุมได้", "การตัดสินใจถูกต้องหากพนักงานไม่คัดค้าน", "ควรลดชั่วโมงลงอีกเพราะได้ผลดี", "ผลกระทบเดียวที่ต้องดูคือยอดขายในเดือนแรก", "ต้องเทียบต้นทุนที่ประหยัดได้กับยอดขายที่หายไปในชั่วโมงที่ปิด รวมถึงลูกค้าประจำที่เปลี่ยนไปใช้ร้านคู่แข่งแล้วอาจไม่กลับมาอีก ซึ่งเป็นความเสียหายสะสมที่ตัวเลขเดือนเดียวมองไม่เห็น"], "answer": 4, "explanation": "การมองบรรทัดต้นทุนบรรทัดเดียวคือกับดักคลาสสิก การตัดสินใจเชิงระบบต้องชั่งผลได้ผลเสียทุกด้านรวมทั้งพฤติกรรมลูกค้าที่เปลี่ยนถาวร ซึ่งมักใหญ่กว่าเงินที่ประหยัดได้", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 64, "q": "ระบบสั่งซื้อของร้านค้ากำหนดว่าเมื่อสต๊อกลดถึงจุดสั่งซื้อ ระบบจะสั่งเติมอัตโนมัติจนสต๊อกกลับสู่ระดับเป้าหมาย กลไกนี้จัดเป็นวงจรป้อนกลับประเภทใดและมีบทบาทอย่างไร?", "choices": ["วงจรเสริมแรงที่จะทำให้สต๊อกโตขึ้นเรื่อยๆ ไม่มีที่สิ้นสุด", "ไม่ใช่วงจรป้อนกลับเพราะเป็นการทำงานของคอมพิวเตอร์", "วงจรเปิดที่ไม่มีการวัดผลใดๆ", "วงจรป้อนกลับแบบถ่วงดุล ที่คอยดึงสถานะของระบบกลับเข้าสู่ระดับเป้าหมายทุกครั้งที่เบี่ยงเบน ทำให้ระบบมีเสถียรภาพโดยไม่ต้องรอคนสั่งการ", "ข้อบกพร่องของระบบที่ควรปิดการทำงานแล้วใช้คนตัดสินใจแทน"], "answer": 3, "explanation": "วงจรถ่วงดุลทำงานโดยเทียบสถานะจริงกับเป้าหมายแล้วออกแรงต้านความเบี่ยงเบน เหมือนลูกลอยตัดน้ำในแท็งก์ นี่คือกลไกที่ทำให้กระบวนการรักษาระดับได้เองอย่างเป็นระบบ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 65, "q": "พนักงานคนหนึ่งค้นพบวิธีทำงานที่เร็วกว่าที่ SOP กำหนด การกระทำที่ถูกต้องตามหลักการทำงานเชิงระบบคือข้อใด?", "choices": ["ใช้วิธีของตนเงียบๆ เพราะผลลัพธ์ดีกว่าคือสิ่งที่สำคัญที่สุด", "นำเสนอวิธีใหม่ให้หัวหน้าพิจารณา ทดลองพิสูจน์ผลอย่างเป็นระบบ แล้วแก้ไข SOP อย่างเป็นทางการเพื่อให้ทุกคนได้ประโยชน์และควบคุมความเสี่ยงได้", "สอนวิธีลัดให้เพื่อนสนิทในทีมโดยไม่ต้องแจ้งใคร", "ยึด SOP เดิมตลอดไปเพราะมาตรฐานห้ามเปลี่ยนแปลง", "รอให้ฝ่ายบริหารค้นพบวิธีนี้เอง"], "answer": 1, "explanation": "การแอบทำต่างจากมาตรฐานสร้างระบบเงาที่ตรวจสอบไม่ได้ ส่วนการยึดของเดิมตายตัวก็ปิดทางพัฒนา ทางที่ถูกคือเสนอ พิสูจน์ และปรับมาตรฐานอย่างเป็นทางการ ให้ระบบทั้งระบบเก่งขึ้นพร้อมกัน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 66, "q": "บริษัทวางแผนขยายกำลังผลิตในไตรมาสหน้า แต่ฝ่ายบุคคลสรรหาพนักงานใหม่ได้ไม่ทันตามแผน ผลกระทบเชิงระบบที่ควรมองเห็นล่วงหน้ามากที่สุดคือข้อใด?", "choices": ["แผนขยายกำลังผลิตจะทำไม่ได้จริง พนักงานเดิมต้องแบกโอทีต่อเนื่องจนล้า คุณภาพงานและความปลอดภัยเสี่ยงลดลง และคำสั่งซื้อที่รับไว้ตามแผนขยายจะส่งมอบไม่ทัน", "ฝ่ายบุคคลจะถูกลดงบประมาณในปีถัดไป", "ค่าโฆษณารับสมัครงานจะสูงขึ้นเล็กน้อย", "พนักงานเดิมจะดีใจที่ได้ค่าโอทีเพิ่ม", "ไม่มีผลกระทบเพราะเครื่องจักรใหม่ทำงานแทนคนได้"], "answer": 0, "explanation": "แผนขยายกำลังผลิตพึ่งพาหลายระบบพร้อมกันทั้งเครื่องจักร คน และวัตถุดิบ เมื่อขาไหนขาหนึ่งไม่ทัน ทั้งแผนจะรวน และภาระจะถูกโยนไปที่คนเดิมจนเกิดความเสี่ยงลูกโซ่ด้านคุณภาพและความปลอดภัย", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 67, "q": "ก่อนเริ่มโปรเจกต์ใหญ่ เหตุใดการแตกงานเป็นงานย่อยและวิเคราะห์ลำดับก่อน-หลังจึงจำเป็นตามหลักคิดเป็นขั้นเป็นตอน?", "choices": ["เพื่อให้รายงานความคืบหน้ามีหัวข้อเยอะดูน่าเชื่อถือ", "เพื่อแบ่งความรับผิดชอบเวลางานพลาดจะได้รู้ว่าใครผิด", "เพื่อให้ทุกงานเริ่มพร้อมกันทั้งหมดในวันแรก", "เพราะจะทำให้เห็นว่างานใดต้องรอกัน งานใดทำขนานกันได้ และงานใดอยู่บนเส้นทางวิกฤติ ทำให้วางคน เวลา และทรัพยากรได้ตรงจุดจริง", "เพราะเป็นข้อบังคับของทุกองค์กร"], "answer": 3, "explanation": "โครงสร้างการพึ่งพากันของงานคือหัวใจของการวางแผน หากไม่เห็นว่างานไหนรอใคร จะเกิดทั้งการรอคอยสูญเปล่าและการเร่งผิดจุด การแตกงานทำให้แผนสะท้อนความเป็นจริงของระบบ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 68, "q": "แคชเชียร์ร้านสะดวกซื้อพบสินค้าบาร์โค้ดเสีย จึงคีย์ราคาด้วยมือแทนการสแกนเป็นประจำเพื่อความรวดเร็ว ผลกระทบเชิงระบบที่ซ่อนอยู่คือข้อใด?", "choices": ["ลูกค้าจะจ่ายเงินผิดจำนวนบ่อยขึ้นเท่านั้น", "แคชเชียร์จะพิมพ์เร็วขึ้นซึ่งเป็นผลดีต่อทักษะ", "ยอดขายสินค้าตัวนั้นไม่ถูกตัดออกจากสต๊อกในระบบ ทำให้ระบบเติมสินค้าอัตโนมัติคำนวณผิด สินค้าจริงหมดชั้นแต่ระบบคิดว่ายังมี และการวิเคราะห์ยอดขายทั้งบริษัทคลาดเคลื่อน", "เครื่องคิดเงินจะเสื่อมเร็วกว่าปกติ", "ไม่มีผลกระทบหากจำนวนเงินที่คีย์ถูกต้อง"], "answer": 2, "explanation": "เงินที่รับมาถูกต้องไม่ได้แปลว่าระบบถูกต้อง การข้ามการสแกนตัดวงจรข้อมูลที่ระบบเติมสินค้าและฝ่ายวิเคราะห์ใช้ ปัญหาเล็กที่หน้าเคาน์เตอร์จึงกลายเป็นข้อมูลเสียทั้งเครือข่าย ควรรีบแจ้งซ่อมบาร์โค้ดแทน", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 69, "q": "สองแผนกต้องการใช้ช่างเทคนิคผู้ชำนาญคนเดียวกันในสัปดาห์เดียวกัน ต่างฝ่ายต่างยืนยันว่างานของตนสำคัญที่สุด วิธีจัดการทรัพยากรรวมที่ถูกต้องตามหลักคิดแบบองค์รวมคือข้อใด?", "choices": ["ให้แผนกที่จองก่อนได้ใช้ก่อนเสมอโดยไม่มีข้อยกเว้น", "ให้แผนกที่หัวหน้ามีตำแหน่งสูงกว่าได้ใช้ก่อน", "ให้ช่างเลือกเองว่าอยากทำงานให้แผนกไหน", "แบ่งเวลาช่างให้แผนกละครึ่งเท่ากันเพื่อความยุติธรรม", "ให้ผู้มีมุมมองภาพรวมเปรียบเทียบว่างานใดกระทบเป้าหมายรวมขององค์กรและลูกค้ามากกว่า แล้วจัดคิวตามผลกระทบนั้น พร้อมวางแผนสำรองให้อีกงาน"], "answer": 4, "explanation": "เกณฑ์ใครมาก่อนหรือแบ่งครึ่งดูยุติธรรมแต่ไม่สนใจผลลัพธ์รวม การจัดสรรทรัพยากรที่จำกัดต้องตัดสินจากผลกระทบต่อระบบทั้งหมด ไม่ใช่ความรู้สึกยุติธรรมระหว่างแผนก", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 70, "q": "โรงงานผลิตชิ้นส่วนส่งให้โรงงานประกอบ ชิ้นงานทุกชิ้นผ่านเกณฑ์ขั้นต่ำแต่เบี่ยงไปทางขอบพิกัดความเผื่อเสมอ เหตุใดจึงยังเป็นปัญหาเชิงระบบทั้งที่ไม่มีชิ้นใดตกสเปค?", "choices": ["ไม่เป็นปัญหาเพราะทุกชิ้นผ่านเกณฑ์ตามสัญญาแล้ว", "ความเบี่ยงเบนของหลายชิ้นส่วนจะสะสมรวมกันตอนประกอบ ทำให้งานประกอบฝืด ใช้เวลาเพิ่ม และผลิตภัณฑ์สุดท้ายอาจมีปัญหาคุณภาพ แม้แต่ละชิ้นจะผ่านเกณฑ์ก็ตาม", "เป็นปัญหาเฉพาะด้านเอกสารรับรองคุณภาพ", "โรงงานประกอบจะได้กำไรลดลงจากค่าขนส่ง", "เป็นปัญหาเพียงเพราะลูกค้าชอบของที่สวยงามสมบูรณ์แบบ"], "answer": 1, "explanation": "ระบบประกอบไม่ได้เจอชิ้นส่วนทีละชิ้นแต่เจอผลรวมของความเบี่ยงเบนทุกชิ้นพร้อมกัน การมองแค่ผ่านหรือไม่ผ่านรายชิ้นจึงพลาดพฤติกรรมสะสมของระบบ ซึ่งเป็นแก่นของการคิดเชิงระบบด้านคุณภาพ", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 71, "q": "บริษัทแห่งหนึ่งรับรู้ปัญหาความไม่พอใจของลูกค้าจากแบบสำรวจที่ทำทุก 6 เดือน ทำให้กว่าจะแก้ไข ลูกค้าจำนวนมากเลิกใช้บริการไปแล้ว การปรับปรุงเชิงระบบที่ตรงจุดที่สุดคือข้อใด?", "choices": ["เพิ่มคำถามในแบบสำรวจให้ละเอียดขึ้นกว่าเดิม", "เปลี่ยนบริษัทรับทำแบบสำรวจให้มืออาชีพกว่าเดิม", "ทำแบบสำรวจเหมือนเดิมแต่แจกของรางวัลให้คนตอบมากขึ้น", "เพิ่มช่องทางรับเสียงสะท้อนที่เร็วขึ้น เช่น การประเมินหลังใช้บริการทันทีและการติดตามคำร้องเรียนรายวัน เพื่อย่นวงจรจากรับรู้ถึงลงมือแก้ให้สั้นที่สุด", "ยกเลิกการสำรวจเพราะลูกค้าที่ไม่พอใจย่อมจากไปอยู่ดี"], "answer": 3, "explanation": "จุดอ่อนของระบบนี้คือความหน่วงของวงจรป้อนกลับ ไม่ใช่คุณภาพของคำถาม เมื่อสัญญาณมาถึงช้า การแก้ไขย่อมช้าตาม การย่นรอบ feedback คือการแก้ที่โครงสร้างของระบบโดยตรง", "section": "ชุดเสริมระดับยาก (ข้อ 31-80)"}, {"n": 72, "q": "โรงงานตรวจพบของเสียเพิ่มขึ้นผิดปกติในไลน์ผลิต ควรเรียงลำดับการจัดการอย่างเป็นระบบอย่างไรจึงถูกต้องที่สุด?", "choices": ["หาสาเหตุรากให้เจอก่อนเป็นอันดับแรก ระหว่างนั้นปล่อยให้ไลน์ผลิตและจัดส่งตามปกติ", "ลงโทษพนักงานประจำไลน์ทันทีเพื่อกระตุ้นความระมัดระวัง", "แก้ไขเครื่องจักรทุกตัวพร้อมกันทันทีโดยไม่ต้องเก็บข้อมูล", "รอดูอีกหนึ่งสัปดาห์ว่าของเสียจะลดลงเองหรือไม่", "กักกันล็อตที่สงสัยไม่ให้หลุดถึงลูกค้าก่อน → เก็บข้อมูลลักษณะและช่วงเวลาที่เกิดของเสีย → วิเคราะห์หาสาเหตุราก → แก้ไขพร้อมวางมาตรการป้องกัน → ติดตามผลว่าของเสียกลับสู่ระดับปกติ"], "answer": 4, "explanation": "ขั้นแรกต้องหยุดความเสียหายไม่ให้ไหลออกนอกระบบก่อน จากนั้นจึงเดินตามลำดับ <script>
"use strict";
/* ================= state & storage ================= */
const $ = id => document.getElementById(id);
const store = {
  get(){ try{return JSON.parse(localStorage.getItem("vnet-stats"))||{}}catch(e){return{}} },
  set(d){ localStorage.setItem("vnet-stats", JSON.stringify(d)) }
};
let S = null;         // current quiz session
let timerInt = null;
let muted = localStorage.getItem("vnet-muted")==="1";

/* ================= sounds (WebAudio) ================= */
let actx = null;
function beep(freqs, dur=0.12, type="sine", vol=0.15){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, actx.currentTime + i*dur);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (i+1)*dur);
      o.connect(g).connect(actx.destination);
      o.start(actx.currentTime + i*dur); o.stop(actx.currentTime + (i+1)*dur + .02);
    });
  }catch(e){}
}
const sndGood = ()=>beep([660,880],0.1,"sine",.12);
const sndBad  = ()=>beep([220,180],0.15,"square",.06);
const sndWin  = ()=>beep([523,659,784,1047],0.14,"sine",.14);
const sndClick= ()=>beep([440],0.05,"sine",.05);
function toggleMute(){ muted=!muted; localStorage.setItem("vnet-muted",muted?"1":"0"); $("mutebtn").textContent = muted?"🔇":"🔊"; }

/* ================= home ================= */
function renderHome(){
  const st = store.get();
  const myIds = new Set([...EXAM_DATA.subjects.map(s=>s.id), "mix"]);
  let answered=0, correct=0;
  for(const k in (st.log||{})){ if(!myIds.has(k)) continue; answered += st.log[k].a; correct += st.log[k].c; }
  $("st-total").textContent = EXAM_DATA.subjects.reduce((s,x)=>s+x.questions.length,0);
  $("st-answered").textContent = answered;
  $("st-acc").textContent = answered ? Math.round(correct/answered*100)+"%" : "—";
  $("st-streak").textContent = st.maxStreak||0;

  const g = $("subjects"); g.innerHTML = "";
  EXAM_DATA.subjects.forEach(s=>{
    const best = (st.best||{})[s.id];
    const b = document.createElement("button");
    b.className = "subj";
    b.innerHTML = `<div class="ic">${s.icon}</div><h3>${s.title}</h3><div class="sub">${s.subtitle}</div>
      <div class="meta"><span class="badge">${s.questions.length} ข้อ</span>
      <span class="best">${best!=null ? "🏆 "+best+"%" : "ยังไม่เคยทำ"}</span></div>`;
    b.onclick = ()=>openSetup(s.id);
    g.appendChild(b);
  });
  if(EXAM_DATA.subjects.length < 2) return;
  const grandTotal = EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0);
  const mix = document.createElement("button");
  mix.className = "subj mix";
  const mixBest = (st.best||{})["mix"];
  mix.innerHTML = `<div class="ic">🎲</div><h3>จับฉลากรวมทุกชุด</h3><div class="sub">สุ่มคละจากทั้ง ${grandTotal} ข้อ</div>
    <div class="meta"><span class="badge">ท้าทาย!</span><span class="best">${mixBest!=null?"🏆 "+mixBest+"%":"ยังไม่เคยทำ"}</span></div>`;
  mix.onclick = ()=>openSetup("mix");
  g.appendChild(mix);
}

/* ================= setup modal ================= */
let setup = {n:20, mode:"practice", shuffleQ:true, shuffleC:false, subj:null};
function openSetup(id){
  sndClick();
  setup.subj = id;
  const s = id==="mix" ? {title:"จับฉลากรวมทุกวิชา", subtitle:"คละทุกสมรรถนะ", icon:"🎲",
      questions:{length:EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0)}}
    : EXAM_DATA.subjects.find(x=>x.id===id);
  const total = s.questions.length;
  const counts = [10,20,30,total>=100?50:total].filter((v,i,a)=>v<=total && a.indexOf(v)===i);
  if(!counts.includes(total) && total<=60) counts.push(total);
  setup.n = counts.includes(20)?20:counts[0];
  if(id==="mix") setup.shuffleQ = true;
  $("modal-root").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeSetup()">
    <div class="modal">
      <h2>${s.icon} ${s.title}</h2>
      <div class="sub">${s.subtitle} • มีทั้งหมด ${total} ข้อ</div>
      <div class="optlabel">โหมด</div>
      <div class="optrow" id="mode-row">
        <button class="opt ${setup.mode==="practice"?"sel":""}" onclick="setMode('practice')">📖 ฝึกฝน (เฉลยทันที)</button>
        <button class="opt ${setup.mode==="exam"?"sel":""}" onclick="setMode('exam')">⏱️ สอบเสมือนจริง</button>
      </div>
      <div class="optlabel">จำนวนข้อ</div>
      <div class="optrow" id="count-row">
        ${counts.map(c=>`<button class="opt ${c===setup.n?"sel":""}" onclick="setCount(${c})">${c===total?"ทั้งหมด ("+c+")":c}</button>`).join("")}
      </div>
      <div class="toggle ${setup.shuffleQ?"on":""}" id="tg-q" onclick="tog('shuffleQ','tg-q')"><span class="box">${setup.shuffleQ?"✓":""}</span> สุ่มลำดับข้อ</div>
      <div class="toggle ${setup.shuffleC?"on":""}" id="tg-c" onclick="tog('shuffleC','tg-c')"><span class="box">${setup.shuffleC?"✓":""}</span> สุ่มลำดับตัวเลือก</div>
      <div class="mrow">
        <button class="btn ghost" onclick="closeSetup()">ยกเลิก</button>
        <button class="btn primary" onclick="startQuiz()">เริ่มเลย 🚀</button>
      </div>
    </div>
  </div>`;
}
function setMode(m){ setup.mode=m; document.querySelectorAll("#mode-row .opt").forEach((b,i)=>b.classList.toggle("sel",(i===0)===(m==="practice"))); sndClick(); }
function setCount(c){ setup.n=c; document.querySelectorAll("#count-row .opt").forEach(b=>b.classList.toggle("sel",b.textContent.includes("("+c+")")||b.textContent.trim()==String(c))); sndClick(); }
function tog(key,id){ setup[key]=!setup[key]; const el=$(id); el.classList.toggle("on",setup[key]); el.querySelector(".box").textContent = setup[key]?"✓":""; sndClick(); }
function closeSetup(){ $("modal-root").innerHTML=""; }

/* ================= quiz engine ================= */
function shuffled(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

function startQuiz(){
  closeSetup();
  let pool, labels;
  if(setup.subj==="mix"){
    pool = EXAM_DATA.subjects.flatMap(s=>s.questions.map(q=>({...q, labels:s.labels, from:s.icon+" "+s.title})));
    labels = null;
  } else {
    const s = EXAM_DATA.subjects.find(x=>x.id===setup.subj);
    pool = s.questions.map(q=>({...q, labels:s.labels, from:""}));
  }
  if(setup.shuffleQ) pool = shuffled(pool);
  pool = pool.slice(0, setup.n);
  pool = pool.map(q=>{
    let idx = q.choices.map((_,i)=>i);
    if(setup.shuffleC) idx = shuffled(idx);
    return {...q, order:idx, picked:null, removed:[]};
  });
  S = { qs:pool, i:0, correct:0, streak:0, maxStreak:0, fifty:3, mode:setup.mode,
        subj:setup.subj, start:Date.now(), done:false };
  $("home").classList.add("hidden"); $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("mutebtn").textContent = muted?"🔇":"🔊";
  $("palette").classList.toggle("hidden", S.mode!=="exam");
  clearInterval(timerInt);
  timerInt = setInterval(()=>{ const t=Math.floor((Date.now()-S.start)/1000);
    $("q-timer").textContent = String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); },500);
  renderQ();
  window.scrollTo(0,0);
}

function renderQ(){
  const q = S.qs[S.i];
  $("q-count").textContent = `${S.i+1}/${S.qs.length}`;
  $("q-score").textContent = `✅ ${S.correct}`;
  $("q-streak").textContent = `🔥 ${S.streak}`;
  $("q-progress").style.width = (S.i/S.qs.length*100)+"%";
  $("q-section").textContent = q.from || q.section || "";
  stopSpeech();
  const audio = parseAudio(q.q);
  $("q-text").textContent = `${S.i+1}. ${audio ? audio.question : q.q}`;
  renderAudioBox(audio, q);
  $("q-expl").innerHTML = "";
  $("nextbtn").classList.add("hidden");
  $("skipbtn").classList.toggle("hidden", S.mode!=="exam");
  $("submitbtn").classList.add("hidden");
  $("fifty").classList.toggle("hidden", S.mode!=="practice");
  $("fifty").disabled = S.fifty<=0;
  $("fifty-n").textContent = "×"+S.fifty;

  const c = $("q-choices"); c.innerHTML = "";
  q.order.forEach((origIdx,pos)=>{
    const b = document.createElement("button");
    b.className = "choice";
    if(q.removed.includes(origIdx)) b.classList.add("dim");
    b.innerHTML = `<span class="lb">${q.labels[pos]}</span><span>${q.choices[origIdx]}</span>`;
    if(S.mode==="exam" && q.picked===origIdx) b.classList.add("picked");
    b.onclick = ()=>pick(origIdx, b);
    c.appendChild(b);
  });
  if(S.mode==="exam"){
    renderPalette();
    if(q.picked!==null || S.i===S.qs.length-1) maybeShowSubmit();
  }
}

/* ===== text-to-speech for listening questions ===== */
const AUDIO_RE = /^\(Audio\)\s*['‘’](.*)['‘’]\s*(?:->|→)\s*(.*)$/s;
function parseAudio(text){
  const m = AUDIO_RE.exec(text);
  return m ? {script:m[1].trim(), question:m[2].trim()} : null;
}
let currentScript = null;
let currentAudioSrc = null;   // mp3 for this question (real voice), if available
let audioEl = null;
function stopSpeech(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  if(audioEl){ audioEl.pause(); audioEl = null; }
  document.querySelectorAll(".playbtn").forEach(b=>b.classList.remove("playing"));
}
let currentUtterance = null; // keep a reference so Chrome doesn't GC it mid-speech
function playAudio(){
  stopSpeech();
  const btnA = document.querySelector(".playbtn");
  if(currentAudioSrc){
    const src = currentAudioSrc.startsWith("data:") ? currentAudioSrc
              : (window.AUDIO_BASE || "audio/") + currentAudioSrc;
    audioEl = new Audio(src);
    audioEl.onplay = ()=>btnA && btnA.classList.add("playing");
    audioEl.onended = ()=>btnA && btnA.classList.remove("playing");
    audioEl.onerror = ()=>{ btnA && btnA.classList.remove("playing"); speakScript(); };
    audioEl.play().catch(()=>speakScript());
    return;
  }
  speakScript();
}
function speakScript(){
  if(!("speechSynthesis" in window) || !currentScript) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(currentScript);
  u.lang = "en-US"; u.rate = 0.92;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x=>x.name==="Samantha") || vs.find(x=>x.lang==="en-US") ||
            vs.find(x=>x.lang && x.lang.startsWith("en"));
  if(v) u.voice = v;
  const btn = document.querySelector(".playbtn");
  u.onstart = ()=>btn && btn.classList.add("playing");
  u.onend = u.onerror = ()=>btn && btn.classList.remove("playing");
  currentUtterance = u;
  // Chrome quirk: speak() immediately after cancel() can be silently dropped
  setTimeout(()=>speechSynthesis.speak(u), 80);
}
function toggleScript(){
  const s = $("q-script"); if(s) s.classList.toggle("hidden");
}
function renderAudioBox(audio, q){
  currentScript = audio ? audio.script : null;
  currentAudioSrc = (audio && q && q.audio) ? q.audio : null;
  const box = $("q-audio");
  if(!audio){ box.innerHTML = ""; return; }
  const ttsOK = currentAudioSrc !== null || "speechSynthesis" in window;
  box.innerHTML = `<div class="audio-box">
    <div class="audio-row">
      <button class="playbtn" onclick="playAudio()">▶️ ฟังเสียง</button>
      <button class="scriptbtn" onclick="toggleScript()">📜 ดูบทพูด</button>
    </div>
    <div class="script hidden" id="q-script">"${audio.script}"</div>
    <div class="audio-hint">${ttsOK ? "ฟังได้หลายรอบ • ลองตอบโดยไม่เปิดบทพูดเพื่อฝึกการฟังจริง" : "เบราว์เซอร์นี้ไม่รองรับเสียงพูด — กด ดูบทพูด เพื่ออ่านแทน"}</div>
  </div>`;
}
function labelOf(q, origIdx){ return q.labels[q.order.indexOf(origIdx)]; }
function pick(idx, btn){
  const q = S.qs[S.i];
  if(S.mode==="practice"){
    if(q.picked!==null) return;
    q.picked = idx;
    const good = idx===q.answer;
    if(good){ S.correct++; S.streak++; S.maxStreak=Math.max(S.maxStreak,S.streak); sndGood();
      if(S.streak>0 && S.streak%5===0){ comboPop("🔥 "+S.streak+" ติด!"); }
    } else { S.streak=0; sndBad(); $("qcard").classList.add("shake"); setTimeout(()=>$("qcard").classList.remove("shake"),400); }
    // reveal
    [...$("q-choices").children].forEach((b,pos)=>{
      const oi = q.order[pos];
      b.disabled = true;
      if(oi===q.answer) b.classList.add("correct");
      else if(oi===idx) b.classList.add("wrong");
    });
    $("q-score").textContent = `✅ ${S.correct}`;
    $("q-streak").textContent = `🔥 ${S.streak}`;
    $("q-expl").innerHTML = `<div class="expl ${good?"good":"bad"}">
      <h4>${good ? "🎉 ถูกต้อง!" : "❌ ยังไม่ถูก — เฉลยคือ "+labelOf(q,q.answer)+"."}</h4>
      <p>${q.explanation || "ไม่มีคำอธิบายเพิ่มเติมสำหรับข้อนี้"}</p></div>`;
    const sc = $("q-script"); if(sc) sc.classList.remove("hidden");
    $("fifty").classList.add("hidden");
    if(S.i===S.qs.length-1){ $("nextbtn").textContent = "ดูสรุปผล 🏁"; }
    $("nextbtn").classList.remove("hidden");
    $("nextbtn").focus();
  } else {
    q.picked = idx; sndClick();
    [...$("q-choices").children].forEach((b,pos)=>b.classList.toggle("picked", q.order[pos]===idx));
    renderPalette(); maybeShowSubmit();
    setTimeout(()=>{ if(S.i<S.qs.length-1){ S.i++; renderQ(); window.scrollTo(0,0);} }, 250);
  }
}

function nextQ(){
  if(S.i>=S.qs.length-1){ finishQuiz(); return; }
  S.i++; renderQ(); window.scrollTo(0,0);
}
function maybeShowSubmit(){
  const allDone = S.qs.every(q=>q.picked!==null);
  $("submitbtn").classList.toggle("hidden", !(allDone || S.i===S.qs.length-1));
}
function renderPalette(){
  const p = $("palette"); p.innerHTML = "";
  S.qs.forEach((q,i)=>{
    const b = document.createElement("button");
    b.className = "pal"+(q.picked!==null?" done":"")+(i===S.i?" cur":"");
    b.textContent = i+1;
    b.onclick = ()=>{ S.i=i; renderQ(); };
    p.appendChild(b);
  });
}
function useFifty(){
  const q = S.qs[S.i];
  if(S.fifty<=0 || q.picked!==null) return;
  S.fifty--;
  const wrongs = shuffled(q.order.filter(i=>i!==q.answer && !q.removed.includes(i))).slice(0,2);
  q.removed.push(...wrongs);
  sndClick(); renderQ();
}
function confirmExit(){
  if(S && !S.done && S.qs.some(q=>q.picked!==null)){
    if(!confirm("ออกจากการทำข้อสอบ? ความคืบหน้ารอบนี้จะหายไป")) return;
  }
  quitToHome();
}
function quitToHome(){
  stopSpeech();
  clearInterval(timerInt); S=null;
  $("quiz").classList.add("hidden"); $("result").classList.add("hidden");
  $("home").classList.remove("hidden");
  renderHome(); window.scrollTo(0,0);
}

/* ================= results ================= */
function finishQuiz(){
  S.done = true;
  stopSpeech();
  clearInterval(timerInt);
  if(S.mode==="exam"){ S.correct = S.qs.filter(q=>q.picked===q.answer).length; }
  const n = S.qs.length, pct = Math.round(S.correct/n*100);
  const secs = Math.floor((Date.now()-S.start)/1000);
  const time = String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0");

  // save stats
  const st = store.get();
  st.best = st.best||{}; st.log = st.log||{};
  if(pct > (st.best[S.subj] ?? -1)) st.best[S.subj] = pct;
  const lg = st.log[S.subj] || {a:0,c:0};
  lg.a += n; lg.c += S.correct; st.log[S.subj] = lg;
  st.maxStreak = Math.max(st.maxStreak||0, S.maxStreak);
  store.set(st);

  const verdict = pct===100 ? ["🏆 สมบูรณ์แบบ!","var(--warn)"]
    : pct>=80 ? ["🌟 เยี่ยมมาก!","var(--good)"]
    : pct>=60 ? ["👍 ผ่านเกณฑ์ ทำได้ดี","var(--brand2)"]
    : pct>=40 ? ["💪 เกือบแล้ว สู้ต่อ!","var(--warn)"]
    : ["📚 ทบทวนอีกนิด แล้วลองใหม่","var(--bad)"];

  const circ = 2*Math.PI*80;
  const wrong = S.qs.filter(q=>q.picked!==q.answer);
  $("quiz").classList.add("hidden");
  const r = $("result");
  r.classList.remove("hidden");
  r.innerHTML = `
  <div class="result">
    <div style="display:flex;justify-content:space-between"><button class="topbtn" onclick="quitToHome()">← หน้าหลัก</button>
    <button class="topbtn" onclick="retry()">🔄 ทำใหม่</button></div>
    <div class="ring">
      <svg width="190" height="190"><circle cx="95" cy="95" r="80" fill="none" stroke="var(--card2)" stroke-width="14"/>
      <circle cx="95" cy="95" r="80" fill="none" stroke="${pct>=60?"var(--good)":pct>=40?"var(--warn)":"var(--bad)"}" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" id="ringbar"/></svg>
      <div class="num"><b>${pct}%</b><span>${S.correct} / ${n} ข้อ</span></div>
    </div>
    <div class="verdict" style="color:${verdict[1]}">${verdict[0]}</div>
    <div class="rstats">
      <div class="stat"><b>⏱️ ${time}</b><span>เวลาที่ใช้</span></div>
      <div class="stat"><b>🔥 ${S.maxStreak}</b><span>ตอบถูกติดกันสูงสุด</span></div>
      <div class="stat"><b>${wrong.length}</b><span>ข้อที่ผิด/ข้าม</span></div>
    </div>
    ${wrong.length ? `<button class="btn primary" style="max-width:320px;margin:0 auto" onclick="$('rev').classList.toggle('hidden')">📖 ทบทวนข้อที่ผิด (${wrong.length})</button>` : ""}
    <div class="review ${S.mode==="exam"?"":"hidden"}" id="rev">
      ${wrong.map(q=>`<div class="rq">
        <div class="st no">✗ ${q.q}</div>
        <p>คำตอบของคุณ: ${q.picked!==null ? labelOf(q,q.picked)+". "+q.choices[q.picked] : "— ไม่ได้ตอบ"}</p>
        <p style="color:var(--good)">เฉลย: ${labelOf(q,q.answer)}. ${q.choices[q.answer]}</p>
        <div class="ex">💡 ${q.explanation || "ไม่มีคำอธิบายเพิ่มเติม"}</div>
      </div>`).join("")}
    </div>
  </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const bar = $("ringbar"); bar.style.transition = "stroke-dashoffset 1.2s ease";
    bar.style.strokeDashoffset = circ*(1-pct/100);
  }));
  if(pct>=80){ sndWin(); confetti(); } else if(pct>=60){ sndWin(); }
  window.scrollTo(0,0);
}
function retry(){ openSetupFromResult(); }
function openSetupFromResult(){ const id=S.subj; quitToHome(); openSetup(id); }

/* ================= fun bits ================= */
function comboPop(text){
  const el = document.createElement("div");
  el.className = "combo-pop"; el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}
function confetti(){
  const cv = $("confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#7c6cff","#4ecdc4","#ffc94d","#ff5d73","#3ddc84"];
  const ps = Array.from({length:140},()=>({
    x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.5,
    w:6+Math.random()*6, h:8+Math.random()*8,
    vy:2+Math.random()*3, vx:(Math.random()-.5)*2, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.2,
    c:colors[Math.floor(Math.random()*colors.length)]
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if(++frames < 260) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* keyboard shortcuts: 1-5 answer, Enter/space next */
document.addEventListener("keydown", e=>{
  if(!S || $("quiz").classList.contains("hidden")) return;
  if(e.key>="1" && e.key<="5"){
    const pos = +e.key-1, btns = $("q-choices").children;
    if(btns[pos] && !btns[pos].disabled) btns[pos].click();
  } else if(e.key==="Enter" && !$("nextbtn").classList.contains("hidden")){ nextQ(); }
});

renderHome();
</script>
