 2: การรับฟังความคิดเห็น"}, {"n": 24, "q": "การสื่อสารในทีมผ่านช่องทาง Digital ควรระวังเรื่องใดที่สุด?", "choices": ["การตอบกลับล่าช้าจนการประสานงานไม่ทันต่อสถานการณ์", "การใช้ช่องทางไม่เป็นทางการจนขาดหลักฐานอ้างอิงภายหลัง", "การตีความหมายที่ผิดพลาดเนื่องจากขาดน้ำเสียงและท่าทาง", "การส่งข้อมูลปริมาณมากจนผู้รับอ่านได้ไม่ครบถ้วน", "การรั่วไหลของข้อมูลสำคัญไปสู่บุคคลภายนอก"], "answer": 2, "explanation": "การสื่อสารดิจิทัลขาดน้ำเสียง สีหน้า และภาษากาย จึงเสี่ยงต่อการตีความหมายผิดมากที่สุด ควรระวังการใช้ถ้อยคำให้ชัดเจน ประเด็นอื่นเป็นข้อควรระวังรองลงมา", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 25, "q": "การเคารพใน 'ความแตกต่างระหว่างบุคคล' (Diversity) หมายถึงข้อใด?", "choices": ["การปฏิบัติต่อทุกคนด้วยวิธีเดียวกันโดยไม่คำนึงถึงความแตกต่าง", "การจัดคนที่มีพื้นฐานใกล้เคียงกันให้ทำงานกลุ่มเดียวกัน", "การยอมรับและใช้ประโยชน์จากความหลากหลายของสมาชิก", "การหลีกเลี่ยงการพูดถึงความแตกต่างเพื่อป้องกันความขัดแย้ง", "การอบรมให้สมาชิกทุกคนมีแนวคิดไปในทิศทางเดียวกัน"], "answer": 2, "explanation": "การเคารพความหลากหลายคือการยอมรับความแตกต่างของสมาชิกและนำจุดเด่นที่ต่างกันมาใช้ให้เกิดประโยชน์ต่อทีม ส่วนการปฏิบัติแบบเดียวกันหมดหรือเลี่ยงไม่พูดถึง คือการมองข้ามความแตกต่าง ไม่ใช่การเคารพ", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 26, "q": "ข้อใดคือพฤติกรรมการฟังที่ 'ไม่เหมาะสม'?", "choices": ["การทวนคำพูดของผู้พูดเพื่อตรวจสอบความเข้าใจ", "การพูดแทรกในขณะที่ผู้อื่นยังพูดไม่จบ", "การจดประเด็นสำคัญระหว่างที่ผู้พูดกำลังนำเสนอ", "การตั้งคำถามเพิ่มเติมเมื่อผู้พูดเปิดโอกาสให้ซักถาม", "การสังเกตน้ำเสียงและภาษากายประกอบการรับฟัง"], "answer": 1, "explanation": "การพูดแทรกขณะที่ผู้อื่นยังพูดไม่จบเป็นการฟังที่ไม่เหมาะสมและไม่ให้เกียรติผู้พูด ส่วนการทวนคำ จดประเด็น ถามเมื่อเปิดโอกาส และสังเกตภาษากาย เป็นพฤติกรรมการฟังที่ดี", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 27, "q": "ความขัดแย้งในทีมเป็นเรื่องปกติหรือไม่?", "choices": ["ไม่ปกติ เพราะทีมที่มีเป้าหมายร่วมชัดเจนย่อมไม่เกิดความขัดแย้ง", "ปกติ เพราะความเห็นที่แตกต่างสามารถนำไปสู่ความคิดใหม่ๆ ได้", "ปกติ แต่ควรให้หัวหน้าเป็นผู้ชี้ขาดยุติโดยเร็วทุกครั้ง", "ไม่ปกติ เพราะสะท้อนว่าการคัดเลือกสมาชิกทีมผิดพลาด", "ปกติ แต่เกิดเฉพาะทีมที่สมาชิกยังไม่คุ้นเคยกันเท่านั้น"], "answer": 1, "explanation": "ความขัดแย้งเป็นเรื่องปกติในการทำงานร่วมกัน แม้ทีมจะมีเป้าหมายร่วมชัดเจนก็ตาม หากเป็นความเห็นต่างเชิงสร้างสรรค์ยังนำไปสู่ความคิดและวิธีการใหม่ๆ ที่ดีขึ้นได้", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 28, "q": "สาเหตุส่วนใหญ่ของความขัดแย้งในที่ทำงานคือข้อใด?", "choices": ["การสื่อสารที่ผิดพลาดและการขัดผลประโยชน์", "ความแตกต่างด้านวัยและประสบการณ์ของพนักงานแต่ละรุ่น", "ปริมาณงานที่มากเกินกำลังของพนักงานแต่ละคน", "โครงสร้างองค์กรที่มีสายการบังคับบัญชาหลายระดับ", "การแข่งขันที่รุนแรงขึ้นจากคู่แข่งภายนอกองค์กร"], "answer": 0, "explanation": "ความขัดแย้งในที่ทำงานส่วนใหญ่เกิดจากการสื่อสารที่ผิดพลาด (เข้าใจไม่ตรงกัน) และการขัดกันของผลประโยชน์หรือเป้าหมาย ปัจจัยด้านวัย ภาระงาน หรือโครงสร้าง เป็นเพียงตัวเสริมไม่ใช่สาเหตุหลัก", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 29, "q": "การจัดการความขัดแย้งแบบ 'Win-Win' คือข้อใด?", "choices": ["ฝ่ายที่มีเหตุผลดีกว่าได้ตามข้อเรียกร้องของตนทั้งหมด", "แต่ละฝ่ายยอมลดข้อเรียกร้องลงครึ่งหนึ่งเพื่อพบกันครึ่งทาง", "เราทั้งคู่ได้ประโยชน์และยอมรับข้อตกลงร่วมกัน", "ทั้งสองฝ่ายพักข้อพิพาทไว้ก่อนเพื่อรักษาความสัมพันธ์", "ฝ่ายที่อาวุโสกว่าเป็นผู้ตัดสินและอีกฝ่ายยอมรับตาม"], "answer": 2, "explanation": "Win-Win คือการร่วมมือกันหาทางออกที่ทั้งสองฝ่ายได้ประโยชน์และยอมรับข้อตกลงร่วมกัน (Collaborating) ต่างจากการพบกันครึ่งทางซึ่งเป็นการประนีประนอมที่ทั้งคู่ต้องยอมเสียบางส่วน", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 30, "q": "เมื่อสมาชิก 2 คนในทีมทะเลาะกันเรื่องวิธีทำงาน หัวหน้าควรทำอย่างไร?", "choices": ["รับฟังทีละฝ่ายแยกกันแล้วหัวหน้าตัดสินเลือกวิธีที่ดีกว่าให้", "ให้ทั้งสองคนมาคุยกันโดยมีหัวหน้าเป็นตัวกลางในการเจรจา", "เลือกใช้วิธีของฝ่ายที่มีประสบการณ์ทำงานมากกว่า", "ให้ทั้งสองพักประเด็นไว้ก่อนแล้วกลับไปทำงานตามแผนเดิม", "แยกให้ทั้งสองรับผิดชอบงานคนละส่วนเพื่อตัดปัญหา"], "answer": 1, "explanation": "การให้คู่กรณีได้พูดคุยกันโดยมีหัวหน้าเป็นคนกลางช่วยประสาน เป็นวิธีจัดการความขัดแย้งที่สร้างสรรค์และเป็นธรรมที่สุด ส่วนการฟังแยกแล้วตัดสินให้ คู่กรณีไม่ได้ปรับความเข้าใจกันจริง", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 31, "q": "การแก้ปัญหาโดย 'การประนีประนอม' (Compromising) หมายถึงอะไร?", "choices": ["การยอมทำตามข้อเรียกร้องของอีกฝ่ายเพื่อรักษาความสัมพันธ์อันดี", "การที่แต่ละฝ่ายยอมลดข้อเรียกร้องลงบางส่วนเพื่อหาจุดกึ่งกลาง", "การร่วมกันคิดทางออกใหม่ที่ทุกฝ่ายได้ประโยชน์อย่างเต็มที่", "การชะลอการเจรจาไว้จนกว่าทั้งสองฝ่ายจะใจเย็นลง", "การให้บุคคลที่สามเป็นผู้ตัดสินข้อพิพาทแทนทั้งสองฝ่าย"], "answer": 1, "explanation": "การประนีประนอมคือการที่แต่ละฝ่ายยอมลดข้อเรียกร้องลงบางส่วนเพื่อพบกันครึ่งทาง ต่างจากการยอมตาม (Accommodating) และการร่วมมือหาทางออกใหม่ที่ได้ประโยชน์เต็มที่ (Collaborating)", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 32, "q": "ทัศนคติที่ควรมีเมื่อเกิดความขัดแย้งคืออะไร?", "choices": ["ยึดมั่นในจุดยืนของตนจนกว่าอีกฝ่ายจะมีข้อมูลมาหักล้างได้", "มุ่งแก้ไขที่ตัวปัญหาร่วมกัน ไม่มุ่งโจมตีตัวบุคคล", "รวบรวมผู้สนับสนุนให้มากพอเพื่อให้ข้อเสนอของเราผ่าน", "ยอมถอยทุกครั้งเพื่อไม่ให้ความขัดแย้งขยายวงกว้าง", "ให้เวลาช่วยคลี่คลายโดยไม่หยิบยกประเด็นขึ้นมาอีก"], "answer": 1, "explanation": "ควรแยก 'ปัญหา' ออกจาก 'ตัวบุคคล' คือมุ่งไปที่การแก้ปัญหาร่วมกัน การยึดจุดยืนรอให้อีกฝ่ายหักล้าง หรือการหาแนวร่วมกดดัน เป็นการมุ่งเอาชนะไม่ใช่การแก้ปัญหา", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 33, "q": "ขั้นตอนแรกของการแก้ไขความขัดแย้งคืออะไร?", "choices": ["การแยกคู่กรณีออกจากกันเพื่อลดความตึงเครียดลงก่อน", "การระบุปัญหาและสาเหตุที่แท้จริงของความขัดแย้ง", "การกำหนดผู้รับผิดชอบต่อความเสียหายที่เกิดขึ้นให้ชัดเจน", "การเร่งหาข้อยุติที่ทั้งสองฝ่ายพอใจให้เร็วที่สุด", "การรายงานผู้บังคับบัญชาตามลำดับขั้นเพื่อขอคำวินิจฉัย"], "answer": 1, "explanation": "การแก้ความขัดแย้งต้องเริ่มจากการระบุปัญหาและเข้าใจสาเหตุที่แท้จริงก่อน จึงจะแก้ได้ตรงจุด การรีบหาข้อยุติหรือแยกคู่กรณีโดยยังไม่รู้สาเหตุ มักเป็นการกดปัญหาไว้ชั่วคราว", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 34, "q": "ข้อใดคือข้อดีของความขัดแย้ง 'ด้านความคิด' (Task Conflict)?", "choices": ["ช่วยให้ทีมมองเห็นว่าใครเหมาะสมจะเป็นผู้นำในโอกาสต่อไป", "ช่วยคัดกรองสมาชิกที่ไม่เหมาะสมออกจากทีมได้เร็วขึ้น", "ช่วยเปิดมุมมองใหม่ๆ และปรับปรุงวิธีการทำงานให้ดีขึ้น", "ช่วยให้สมาชิกคุ้นเคยกับแรงกดดันในการทำงานมากขึ้น", "ช่วยให้หัวหน้ามีข้อมูลประเมินผลงานสมาชิกรายบุคคล"], "answer": 2, "explanation": "ความขัดแย้งเชิงงาน (Task Conflict) ที่ถกกันเรื่องเนื้องาน ช่วยเปิดมุมมองใหม่และกระตุ้นให้ปรับปรุงวิธีทำงานให้ดีขึ้น ไม่ใช่เครื่องมือคัดคนหรือประเมินตัวบุคคล", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 35, "q": "พฤติกรรม 'การหลีกเลี่ยง' (Avoiding) ความขัดแย้ง เหมาะสมในกรณีใด?", "choices": ["เมื่อปัญหานั้นกระทบเป้าหมายหลักและต้องการข้อยุติโดยเร็ว", "เมื่อเรื่องนั้นเป็นเรื่องเล็กน้อยและไม่คุ้มที่จะทะเลาะ", "เมื่อเรามีข้อมูลครบถ้วนและมั่นใจว่าแนวทางของเราถูกต้อง", "เมื่อคู่กรณีเป็นผู้บังคับบัญชาที่มีอำนาจตัดสินใจสูงกว่า", "เมื่อต้องการรักษาความสัมพันธ์ระยะยาวกับอีกฝ่ายไว้"], "answer": 1, "explanation": "การหลีกเลี่ยง (Avoiding) เหมาะกับประเด็นเล็กน้อยที่ไม่คุ้มจะเสียเวลาหรือความสัมพันธ์ไปทะเลาะ ไม่ใช่กับปัญหาสำคัญ และการหลบเพียงเพราะคู่กรณีมีอำนาจกว่าเป็นการยอมจำนน ไม่ใช่การเลือกใช้วิธีอย่างเหมาะสม", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 36, "q": "การใช้อารมณ์ในการแก้ปัญหาความขัดแย้งส่งผลอย่างไร?", "choices": ["ทำให้อีกฝ่ายเห็นความจริงจังและยอมยุติปัญหาเร็วขึ้น", "ทำให้ทีมตระหนักถึงความสำคัญของประเด็นที่ถกเถียงกัน", "ทำให้สถานการณ์เลวร้ายลงและเสียความสัมพันธ์", "ทำให้เราได้ระบายความเครียดและกลับมาทำงานได้ดีขึ้น", "ทำให้ผู้อื่นเกรงใจและรับฟังความเห็นของเรามากขึ้น"], "answer": 2, "explanation": "การใช้อารมณ์มักทำให้ความขัดแย้งบานปลายและทำลายความสัมพันธ์ แม้จะดูเหมือนแสดงความจริงจัง แต่ผู้อื่นจะตอบสนองต่ออารมณ์ไม่ใช่เหตุผล ควรใช้ความสงบในการแก้ปัญหา", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 37, "q": "'การไกล่เกลี่ย' (Mediation) จะมีประสิทธิภาพเมื่อใด?", "choices": ["เมื่อตัวกลางมีความเป็นกลางและเป็นที่ยอมรับของทั้งสองฝ่าย", "เมื่อตัวกลางมีตำแหน่งสูงพอที่จะสั่งให้ทั้งสองฝ่ายยุติข้อพิพาทได้", "เมื่อตัวกลางเป็นเพื่อนสนิทที่รู้จักนิสัยของทั้งสองฝ่ายเป็นอย่างดี", "เมื่อตัวกลางเตรียมทางออกสำเร็จรูปไว้ให้ทั้งสองฝ่ายเลือกทันที", "เมื่อตัวกลางเร่งรัดให้ได้ข้อยุติภายในการพูดคุยเพียงครั้งเดียว"], "answer": 0, "explanation": "การไกล่เกลี่ยจะได้ผลเมื่อคนกลางมีความเป็นกลางและได้รับการยอมรับจากทั้งสองฝ่าย อำนาจสั่งการหรือความสนิทสนมไม่ใช่หลักประกัน หากขาดความเป็นกลางที่ทั้งคู่ยอมรับ", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 38, "q": "หากความขัดแย้งเกิดจาก 'ความเข้าใจผิด' ควรแก้ไขอย่างไร?", "choices": ["การให้ข้อมูลที่ถูกต้องครบถ้วนและสื่อสารกันโดยตรง", "การให้เวลาช่วยเยียวยาจนทั้งสองฝ่ายลืมเรื่องที่เข้าใจผิดไปเอง", "การสื่อสารผ่านคนกลางที่ทั้งสองฝ่ายให้ความไว้วางใจ", "การทำหนังสือชี้แจงอย่างเป็นทางการเพื่อบันทึกไว้เป็นหลักฐาน", "การหลีกเลี่ยงการพูดถึงประเด็นนั้นเพื่อไม่ให้เรื่องบานปลาย"], "answer": 0, "explanation": "ความขัดแย้งที่เกิดจากความเข้าใจผิด แก้ได้ตรงจุดที่สุดด้วยการให้ข้อมูลที่ถูกต้องและพูดคุยกันโดยตรง การผ่านคนกลางหรือทำหนังสือชี้แจงเพิ่มขั้นตอนและเสี่ยงต่อการตีความคลาดเคลื่อนซ้ำ", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 39, "q": "พฤติกรรมการแก้ความขัดแย้งแบบ 'ยอมตาม' (Accommodating) เหมาะกับสถานการณ์ใด?", "choices": ["เมื่อเรามีเหตุผลถูกต้องแต่ต้องการยุติเรื่องให้เร็วที่สุด", "เมื่อเราพบว่าเราเป็นฝ่ายผิดและต้องการรักษาความสัมพันธ์ไว้", "เมื่อประเด็นนั้นส่งผลกระทบสูงต่อทั้งสองฝ่ายเท่าๆ กัน", "เมื่อทั้งสองฝ่ายมีอำนาจต่อรองใกล้เคียงกันและมีเวลาจำกัด", "เมื่อต้องการให้อีกฝ่ายยอมตามเราในประเด็นอื่นเป็นการตอบแทน"], "answer": 1, "explanation": "การยอมตาม (Accommodating) เหมาะเมื่อเราพบว่าตนเป็นฝ่ายผิด หรือเรื่องนั้นสำคัญกับอีกฝ่ายมากกว่า และต้องการรักษาความสัมพันธ์ ส่วนกรณีอำนาจต่อรองใกล้เคียงกันและเวลาจำกัดเหมาะกับการประนีประนอมมากกว่า", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 40, "q": "เป้าหมายสุดท้ายของการบริหารความขัดแย้งคืออะไร?", "choices": ["เพื่อหาข้อยุติที่ให้ความเป็นธรรมแก่ฝ่ายที่ถูกต้องมากที่สุด", "เพื่อรักษาบรรยากาศการทำงานและให้งานดำเนินต่อไปได้อย่างมีประสิทธิภาพ", "เพื่อขจัดความขัดแย้งทุกรูปแบบไม่ให้เกิดขึ้นในองค์กรอีก", "เพื่อให้ทุกฝ่ายยอมรับและปฏิบัติตามกติกาที่หัวหน้ากำหนด", "เพื่อคัดกรองบุคคลที่มักสร้างความขัดแย้งออกจากหน่วยงาน"], "answer": 1, "explanation": "เป้าหมายของการบริหารความขัดแย้งไม่ใช่การหาผู้ชนะหรือขจัดความขัดแย้งให้หมดไป แต่คือการรักษาความสัมพันธ์และบรรยากาศที่ดี เพื่อให้งานเดินหน้าต่อไปได้อย่างมีประสิทธิภาพ", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 41, "q": "เมื่อสมาชิกในทีมคนหนึ่งไม่สามารถส่งงานได้ตามกำหนดจนส่งผลกระทบต่อภาพรวม การกระทำในข้อใดแสดงถึงการเป็น 'สมาชิกที่ดีของทีม' มากที่สุด?", "choices": ["รายงานหัวหน้างานทันทีเพื่อให้สั่งการแก้ไขตามสายการบังคับบัญชา", "เข้าไปสอบถามสาเหตุและเสนอตัวช่วยเหลือในส่วนที่ทำได้", "ทำเฉพาะงานของตนเองให้ดีที่สุดเพื่อพิสูจน์ว่าความล่าช้าไม่ได้เกิดจากเรา", "แจ้งในที่ประชุมทีมให้ทุกคนทราบว่าความล่าช้าเกิดจากสมาชิกคนใด", "รอให้ถึงวันส่งงานจริงค่อยแจ้งปัญหาให้ทุกคนทราบพร้อมกัน"], "answer": 1, "explanation": "สมาชิกที่ดีของทีมมองที่เป้าหมายส่วนรวมเป็นหลัก การเข้าไปสอบถามสาเหตุและเสนอตัวช่วยเหลือช่วยให้งานของทีมเดินหน้าต่อได้ทันที ส่วนการรีบรายงาน การประกาศหาคนผิด หรือการนิ่งรอ ล้วนไม่ช่วยแก้ปัญหาเฉพาะหน้าและบั่นทอนบรรยากาศทีม", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 42, "q": "ในการประชุมทีม หากคุณเห็นว่าแนวทางที่เสียงส่วนใหญ่เลือกอาจมีข้อผิดพลาดในอนาคต คุณควรปฏิบัติอย่างไรตามหลักการทำงานเป็นทีม?", "choices": ["ปฏิบัติตามเสียงส่วนใหญ่เพราะมติของทีมย่อมสำคัญกว่าความเห็นส่วนตัว", "ขออนุญาตนำเสนอข้อมูลสนับสนุนและข้อกังวลด้วยเหตุผลอย่างสุภาพ", "ยืนยันคัดค้านต่อไปจนกว่าที่ประชุมจะนำข้อกังวลของเราไปทบทวนใหม่", "เก็บข้อมูลไว้แจ้งหัวหน้างานเป็นการส่วนตัวหลังจบการประชุม", "บันทึกข้อกังวลไว้เป็นลายลักษณ์อักษรเพื่อใช้อ้างอิงหากเกิดปัญหาขึ้นจริง"], "answer": 1, "explanation": "ผู้ตามที่ดีต้องกล้าแสดงความเห็นต่างอย่างสร้างสรรค์ คือเสนอข้อมูลและเหตุผลอย่างสุภาพในที่ประชุม เพื่อให้ทีมได้พิจารณาความเสี่ยงก่อนตัดสินใจ ไม่ใช่เงียบตาม ยืนกรานคัดค้าน พูดลับหลัง หรือเพียงบันทึกไว้ป้องกันตนเอง", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 43, "q": "การทำ 'Service Mind' ให้เกิดประสิทธิภาพสูงสุด พนักงานต้องเข้าใจ 'ความต้องการของผู้รับบริการ' ในมิติใดเป็นอันดับแรก?", "choices": ["กำลังซื้อและระดับราคาที่ลูกค้ายินดีจ่ายสำหรับบริการ", "ความต้องการพื้นฐานและสิ่งที่ลูกค้ากังวลใจ (Pain Point)", "ประวัติการใช้บริการและข้อมูลส่วนตัวของลูกค้าโดยละเอียด", "มาตรฐานบริการของคู่แข่งที่ลูกค้าเคยได้รับมาก่อนหน้านี้", "ระดับความคาดหวังต่อของสมนาคุณและสิทธิพิเศษต่างๆ"], "answer": 1, "explanation": "หัวใจของงานบริการคือการเข้าใจความต้องการพื้นฐานและปัญหาที่ลูกค้ากังวล (Pain Point) ก่อน จึงจะตอบสนองได้ตรงจุด ข้อมูลด้านกำลังซื้อ ประวัติ หรือคู่แข่ง เป็นเพียงส่วนประกอบ ไม่ใช่มิติแรกที่ต้องเข้าใจ", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 44, "q": "หากลูกค้ามาร้องเรียนเรื่องความล่าช้าด้วยอารมณ์ที่เกรี้ยวกราด ขั้นตอนแรกที่พนักงานควรทำคือข้อใด?", "choices": ["อธิบายเหตุผลของความล่าช้าทันทีเพื่อให้ลูกค้าเข้าใจสถานการณ์ที่เกิดขึ้น", "กล่าวขอโทษพร้อมเสนอส่วนลดหรือของชดเชยทันทีเพื่อยุติข้อร้องเรียน", "รับฟังอย่างตั้งใจโดยไม่ขัดจังหวะและแสดงความเห็นอกเห็นใจ", "เชิญลูกค้าไปพูดคุยในห้องรับรองเพื่อไม่ให้กระทบลูกค้าท่านอื่น", "ส่งเรื่องต่อให้ผู้จัดการที่มีอำนาจตัดสินใจสูงกว่าเป็นผู้ดูแลทันที"], "answer": 2, "explanation": "หลักการจัดการข้อร้องเรียนคือต้องให้ลูกค้าได้ระบายและรู้สึกว่าถูกรับฟังก่อน (รับฟังอย่างตั้งใจ + แสดง Empathy) เมื่ออารมณ์เย็นลงจึงค่อยอธิบายเหตุผลหรือเสนอการชดเชย การรีบอธิบายหรือรีบยื่นข้อเสนอขณะลูกค้ายังโกรธมักทำให้สถานการณ์แย่ลง", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 45, "q": "ข้อใดคือการ 'ประสานประโยชน์' ระหว่างแผนกการผลิตและแผนกขายที่มีประสิทธิภาพที่สุด?", "choices": ["แผนกขายรับออเดอร์ให้มากที่สุดเพื่อสร้างรายได้ แล้วให้แผนกผลิตเร่งกำลังการผลิตตาม", "แผนกการผลิตลดขั้นตอนการตรวจสอบบางส่วนลงเพื่อให้ผลิตทันตามคำสั่งซื้อทุกรายการ", "การประชุมร่วมกันเพื่อวางแผนยอดขายให้สอดคล้องกับกำลังการผลิตจริง", "แต่ละแผนกกำหนดเป้าหมายของตนอย่างอิสระเพื่อไม่ให้ก้าวก่ายอำนาจกัน", "ให้ผู้บริหารสูงสุดเป็นผู้กำหนดโควตาของทั้งสองแผนกเพื่อความเด็ดขาด"], "answer": 2, "explanation": "การประสานประโยชน์คือการหาจุดสมดุลที่ทุกฝ่ายได้ประโยชน์และงานส่วนรวมเดินได้ การประชุมวางแผนร่วมกันให้ยอดขายสอดคล้องกับกำลังการผลิตจริง คือการประสานที่ทั้งสองแผนกบรรลุเป้าหมายไปด้วยกัน ไม่ใช่ฝ่ายใดฝ่ายหนึ่งต้องฝืนรับภาระ", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 46, "q": "การสื่อสารแบบใดที่ช่วยลดความขัดแย้งในการประสานงานภายในทีมได้ดีที่สุด?", "choices": ["การพูดคุยแบบเผชิญหน้าและทวนคำสั่งเพื่อความเข้าใจที่ตรงกัน", "การสื่อสารเป็นลายลักษณ์อักษรทุกครั้งเพื่อให้มีหลักฐานอ้างอิงที่ชัดเจน", "การให้หัวหน้าเป็นศูนย์กลางรับและกระจายข้อมูลเพียงผู้เดียว", "การเลือกใช้ถ้อยคำนุ่มนวลอ้อมค้อมเพื่อไม่ให้อีกฝ่ายรู้สึกกดดัน", "การเรียกประชุมทีมทุกครั้งที่มีข้อมูลใหม่เพื่อให้ทุกคนรับทราบพร้อมกัน"], "answer": 0, "explanation": "การคุยแบบเผชิญหน้าได้ทั้งน้ำเสียงและภาษากาย และการทวนคำสั่ง (paraphrasing) ช่วยยืนยันว่าเข้าใจตรงกัน จึงลดความเข้าใจผิดอันเป็นต้นเหตุหลักของความขัดแย้ง ส่วนการยึดลายลักษณ์อักษรทุกเรื่องหรือพูดอ้อมๆ ยิ่งเสี่ยงต่อการตีความผิด", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 47, "q": "พฤติกรรมใดที่ช่วยสร้าง 'ความเชื่อมั่น' (Trust) ในการสร้างความสัมพันธ์กับสมาชิกในทีม?", "choices": ["การสร้างความสนิทสนมผ่านกิจกรรมสังสรรค์นอกเวลางานอย่างสม่ำเสมอ", "การรักษาคำพูดและการทำงานให้เสร็จตามที่ได้รับมอบหมายอย่างสม่ำเสมอ", "การรายงานความคืบหน้าของงานให้หัวหน้าทราบอย่างละเอียดทุกวัน", "การกล่าวชื่นชมผลงานของเพื่อนร่วมทีมในที่ประชุมเป็นประจำ", "การเสนอตัวช่วยงานทุกอย่างของทีมแม้จะเกินกำลังของตนเอง"], "answer": 1, "explanation": "ความไว้วางใจในทีมเกิดจากความน่าเชื่อถือที่พิสูจน์ได้ คือรักษาคำพูดและส่งมอบงานได้ตามที่รับปากอย่างสม่ำเสมอ ความสนิทสนมทางสังคมหรือการรับปากเกินกำลังจนทำไม่ได้จริง กลับบั่นทอนความเชื่อมั่นในระยะยาว", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 48, "q": "เมื่อเกิดปัญหาความขัดแย้งส่วนตัวระหว่างคุณกับสมาชิกคนอื่นในทีม คุณควรจัดการอย่างไรเพื่อไม่ให้กระทบงาน?", "choices": ["ติดต่อกันเฉพาะเรื่องงานที่จำเป็นและหลีกเลี่ยงเรื่องส่วนตัวโดยสิ้นเชิง", "ขอให้หัวหน้าปรับการมอบหมายงานเพื่อลดโอกาสที่ต้องทำงานร่วมกัน", "พูดคุยเพื่อปรับความเข้าใจโดยมุ่งเน้นไปที่เป้าหมายของงานเป็นหลัก", "รอจังหวะให้อีกฝ่ายเป็นผู้เปิดใจก่อนจึงค่อยเข้าไปปรับความเข้าใจ", "ขอให้เพื่อนร่วมทีมที่สนิทกับทั้งสองฝ่ายช่วยเป็นสื่อกลางประสานให้"], "answer": 2, "explanation": "หลักการแก้ความขัดแย้งคือแยกเรื่องส่วนตัวออกจากงาน แล้วเปิดใจพูดคุยปรับความเข้าใจโดยยึดเป้าหมายของงานเป็นที่ตั้ง การเลี่ยงเจอกัน รอให้อีกฝ่ายเริ่มก่อน หรือพึ่งคนกลางทั้งที่คุยกันเองได้ เป็นการยืดปัญหาให้ค้างคา", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 49, "q": "ข้อใดคือตัวอย่างของการ 'แลกเปลี่ยนเรียนรู้' ที่สร้างสรรค์ที่สุด?", "choices": ["การจดบันทึกความผิดพลาดที่เกิดขึ้นแล้วนำมาแชร์เพื่อหาแนวทางป้องกันร่วมกัน", "การถ่ายทอดเทคนิคเฉพาะทางให้กับสมาชิกที่มีพื้นฐานดีพอจะรับได้เท่านั้น", "การนำเสนอเฉพาะผลงานที่ประสบความสำเร็จเพื่อสร้างกำลังใจให้กับทีม", "การรอให้ฝ่ายบุคคลจัดกิจกรรมการจัดการความรู้ (KM) อย่างเป็นทางการ", "การศึกษาวิธีทำงานของเพื่อนที่เก่งแล้วนำมาปรับใช้กับงานของตนเอง"], "answer": 0, "explanation": "การนำบทเรียนจากความผิดพลาด (Lessons Learned) มาแบ่งปันเพื่อหาแนวทางป้องกันร่วมกัน เป็นการจัดการความรู้ที่สร้างสรรค์ เพราะเปลี่ยนความผิดพลาดให้เป็นความรู้ของทั้งทีม ส่วนการแชร์เฉพาะความสำเร็จหรือเรียนรู้เพียงลำพังไม่ก่อประโยชน์ต่อส่วนรวมเท่า", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 50, "q": "พนักงานระดับอาชีวศึกษาจะช่วยเพิ่มประสิทธิภาพการทำงานเป็นทีมผ่านการ 'แลกเปลี่ยนเรียนรู้' ได้อย่างไร?", "choices": ["การเลือกเรียนรู้จากผู้เชี่ยวชาญที่มีประสบการณ์สูงที่สุดเพียงคนเดียว", "การสอนงาน (Mentoring) ให้กับพนักงานใหม่ด้วยความเต็มใจ", "การพัฒนาทักษะเฉพาะทางของตนให้ลึกที่สุดเพื่อเป็นที่พึ่งหลักของทีม", "การชี้ข้อบกพร่องในการทำงานของเพื่อนร่วมทีมอย่างตรงไปตรงมา", "การเข้าอบรมทุกหลักสูตรที่บริษัทจัดเพื่อสะสมความรู้ไว้ใช้ในงานของตน"], "answer": 1, "explanation": "การสอนงาน (Mentoring) ด้วยความเต็มใจเป็นการถ่ายทอดความรู้และทักษะให้คนในทีม ทำให้ทีมโดยรวมเก่งขึ้น ส่วนการสะสมความเชี่ยวชาญไว้กับตนเองหรือเรียนรู้จากคนเพียงคนเดียว เป็นการรับหรือเก็บความรู้ฝ่ายเดียว ไม่ใช่การแลกเปลี่ยน", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 51, "q": "หากสมาชิกในทีมรู้สึกท้อแท้จากภาระงานที่หนักเกินไป พฤติกรรมใดของเพื่อนร่วมทีมที่แสดงถึง 'การสร้างความสัมพันธ์' ที่ดี?", "choices": ["รับงานของสมาชิกคนนั้นมาทำแทนทั้งหมดเพื่อให้เขาได้พักฟื้นอย่างเต็มที่", "ให้กำลังใจและรับฟังปัญหา พร้อมเสนอช่วยจัดลำดับความสำคัญของงาน", "แนะนำให้เขาไปขอลดปริมาณงานกับหัวหน้าโดยตรงตามสิทธิที่พึงมี", "ชวนไปทำกิจกรรมผ่อนคลายนอกเวลางานเพื่อให้ลืมความเครียดจากงาน", "ปล่อยให้เขาจัดการปัญหาด้วยตนเองเพื่อฝึกความเข้มแข็งในระยะยาว"], "answer": 1, "explanation": "การให้กำลังใจ รับฟังปัญหา และช่วยเสนอวิธีจัดลำดับความสำคัญของงาน เป็นการดูแลทั้งด้านจิตใจและด้านการทำงานไปพร้อมกัน ส่วนการรับงานมาทำแทนทั้งหมดหรือชวนหนีไปผ่อนคลาย ไม่ได้แก้ที่ต้นเหตุของภาระงาน", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 52, "q": "ในการทำงานกับผู้รับบริการต่างชาติหรือต่างวัฒนธรรม สิ่งสำคัญที่สุดในการเข้าใจ 'ความต้องการ' คือข้อใด?", "choices": ["การรักษามาตรฐานบริการเดียวกันกับลูกค้าทุกชาติเพื่อความเสมอภาค", "การฝึกภาษาของลูกค้าให้คล่องเพื่อสื่อสารได้เองโดยไม่ต้องใช้ล่าม", "การศึกษาความแตกต่างทางวัฒนธรรมและความคาดหวังเฉพาะบุคคล", "การจัดพนักงานที่มีเชื้อชาติเดียวกับลูกค้าเป็นผู้ให้บริการโดยเฉพาะ", "การยึดแนวปฏิบัติสากลเป็นหลักเพราะเป็นที่ยอมรับของทุกวัฒนธรรม"], "answer": 2, "explanation": "ลูกค้าต่างวัฒนธรรมมีความคาดหวังและมารยาทที่ต่างกัน การศึกษาความแตกต่างทางวัฒนธรรมควบคู่กับความคาดหวังเฉพาะบุคคล จึงเป็นกุญแจของการเข้าใจความต้องการที่แท้จริง การใช้มาตรฐานเดียวกันหมดหรือยึดแนวสากลอย่างเดียวคือการมองข้ามความแตกต่างนั้น", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 53, "q": "เป้าหมายของทีม (Team Goal) จะบรรลุได้ยากที่สุดหากสมาชิกมีพฤติกรรมในข้อใด?", "choices": ["การมีความคิดเห็นแตกต่างจนต้องอภิปรายกันบ่อยครั้ง", "การขาดความซื่อสัตย์และการปกปิดข้อผิดพลาด", "การตั้งคำถามต่อแผนงานของหัวหน้าในที่ประชุมอย่างเปิดเผย", "การแข่งขันกันนำเสนอไอเดียใหม่ระหว่างสมาชิกในทีม", "การใช้สิทธิลาพักตามระเบียบในช่วงที่งานกำลังเร่งด่วน"], "answer": 1, "explanation": "การขาดความซื่อสัตย์และการปกปิดข้อผิดพลาดทำลายความไว้วางใจซึ่งเป็นรากฐานของทีม และทำให้ปัญหาถูกซุกไว้จนบานปลาย ส่วนความเห็นต่าง การตั้งคำถาม การแข่งกันเสนอไอเดีย หรือการใช้สิทธิลาตามระเบียบ เป็นเรื่องปกติที่ไม่ได้ขัดขวางเป้าหมายทีม", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 54, "q": "ทักษะใดจัดเป็น 'ทักษะทางอารมณ์' (Soft Skills) ที่จำเป็นที่สุดในการสร้างความสัมพันธ์ในทีม?", "choices": ["ทักษะการวิเคราะห์ข้อมูลและการวางแผนงานอย่างเป็นระบบ", "ทักษะการใช้เทคโนโลยีการสื่อสารสมัยใหม่ได้อย่างคล่องแคล่ว", "ทักษะการควบคุมอารมณ์ภายใต้ความกดดันและการเห็นอกเห็นใจผู้อื่น", "ทักษะการนำเสนอผลงานด้วยสื่อที่ทันสมัยและน่าสนใจ", "ทักษะการเจรจาต่อรองเงื่อนไขทางธุรกิจกับคู่ค้าภายนอกองค์กร"], "answer": 2, "explanation": "การควบคุมอารมณ์ (Self-regulation) และความเห็นอกเห็นใจ (Empathy) เป็นองค์ประกอบหลักของความฉลาดทางอารมณ์ (EQ) ซึ่งจำเป็นที่สุดต่อการสร้างความสัมพันธ์ในทีม ส่วนการวิเคราะห์ เทคโนโลยี หรือการเจรจาธุรกิจภายนอก ไม่ใช่แก่นของความสัมพันธ์ภายในทีม", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 55, "q": "เมื่อสมาชิกในทีมมีสไตล์การทำงานที่ช้าและเน้นความละเอียด ในขณะที่คุณเน้นความเร็ว คุณควรประสานงานอย่างไร?", "choices": ["ขอให้หัวหน้ากำหนดมาตรฐานความเร็วกลางให้ทุกคนปฏิบัติเหมือนกัน", "ปรับจังหวะการทำงานร่วมกันโดยกำหนดจุดเชื่อมต่อและเวลาส่งมอบที่ชัดเจน", "แบ่งงานใหม่ให้ต่างคนต่างรับผิดชอบส่วนที่ไม่ต้องเกี่ยวข้องกันเลย", "ปรับตัวเองให้ทำงานอย่างละเอียดช้าลงตามจังหวะของอีกฝ่ายทั้งหมด", "ทำส่วนของตนให้เร็วที่สุดแล้วใช้เวลาที่เหลือช่วยตรวจแก้งานของอีกฝ่ายแทน"], "answer": 1, "explanation": "สไตล์การทำงานที่ต่างกันไม่ใช่ปัญหา หากตกลงจุดเชื่อมต่อของงานและกำหนดเวลาส่งมอบร่วมกันชัดเจน ต่างฝ่ายจะทำงานตามจังหวะของตนได้โดยงานรวมไม่สะดุด การบังคับให้ใช้ความเร็วเดียวกันหรือแยกงานขาดจากกันคือการเลี่ยงปัญหา ไม่ใช่การประสาน", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 56, "q": "พนักงานควรทำอย่างไรเมื่อได้รับ 'คำชม' จากผู้รับบริการว่าเป็นผลงานที่ดีที่สุดในทีม?", "choices": ["ขอบคุณลูกค้าและยอมรับคำชมไว้เพราะเป็นผลจากความตั้งใจของเราจริง", "ขอบคุณลูกค้าและบอกว่านี่คือผลสำเร็จจากการสนับสนุนของสมาชิกทุกคนในทีม", "กล่าวถ่อมตัวว่าผลงานยังไม่ดีพอเพื่อแสดงความสุภาพต่อลูกค้า", "นำคำชมไปแจ้งหัวหน้าเพื่อบันทึกเป็นผลงานของตนในการประเมินประจำปี", "เชิญลูกค้ากรอกแบบประเมินความพึงพอใจอย่างเป็นทางการแทนคำชม"], "answer": 1, "explanation": "การให้เครดิตแก่ทีม (Share the credit) แสดงถึงความเป็นสมาชิกทีมที่ดี เพราะผลงานที่ดีเกือบทั้งหมดเกิดจากการสนับสนุนของหลายฝ่าย การรับความดีความชอบไว้คนเดียวแม้จะตั้งใจทำจริง ก็บั่นทอนความสัมพันธ์ในทีม", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 57, "q": "ข้อใดเป็นอุปสรรคสำคัญของการ 'แลกเปลี่ยนเรียนรู้' ในองค์กร?", "choices": ["การมีพนักงานหลายรุ่นหลายช่วงวัยทำงานปะปนกันในหน่วยงานเดียว", "วัฒนธรรมการทำงานแบบ 'ใครผิดต้องถูกประจาน'", "การเปิดโอกาสให้พนักงานใหม่ตั้งคำถามกับวิธีทำงานแบบเดิม", "การจัดสรรเวลาส่วนหนึ่งของงานประจำไว้สำหรับการฝึกอบรม", "การมีผู้เชี่ยวชาญหลายด้านที่ความเห็นไม่ตรงกันในบางประเด็น"], "answer": 1, "explanation": "วัฒนธรรมประจานคนทำผิดทำให้พนักงานกลัวการยอมรับข้อผิดพลาดและไม่กล้าแบ่งปันบทเรียน ความรู้จึงถูกปกปิด ส่วนความหลากหลายของวัย การตั้งคำถาม หรือความเห็นต่างของผู้เชี่ยวชาญ กลับเป็นวัตถุดิบชั้นดีของการแลกเปลี่ยนเรียนรู้", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 58, "q": "ในการทำงานเป็นทีม การทำ 'After Action Review' (AAR) หลังจบโครงการมีจุดประสงค์หลักเพื่ออะไร?", "choices": ["เพื่อประเมินผลการปฏิบัติงานรายบุคคลประกอบการพิจารณาความดีความชอบ", "เพื่อทบทวนสิ่งที่ทำได้ดีและสิ่งที่ควรปรับปรุงสำหรับการทำงานครั้งต่อไป", "เพื่อจัดทำรายงานสรุปผลโครงการเสนอต่อผู้บริหารอย่างเป็นทางการ", "เพื่อระบุตัวผู้รับผิดชอบต่อข้อผิดพลาดแต่ละจุดอย่างเป็นธรรม", "เพื่อเฉลิมฉลองความสำเร็จและสร้างขวัญกำลังใจให้กับทีม"], "answer": 1, "explanation": "AAR เป็นเครื่องมือทบทวนหลังปฏิบัติงาน โดยถามว่าอะไรที่ทำได้ดี อะไรควรปรับปรุง และจะทำให้ดีขึ้นอย่างไรในครั้งหน้า จุดประสงค์คือการเรียนรู้ของทีม ไม่ใช่การประเมินรายบุคคลหรือหาผู้รับผิด", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 59, "q": "พฤติกรรมใดที่แสดงถึงการ 'ใส่ใจรายละเอียด' ของผู้รับบริการในสายงานช่าง?", "choices": ["การล้างทำความสะอาดรถให้ลูกค้าหลังจากซ่อมเสร็จแม้ลูกค้าไม่ได้ร้องขอ", "การเร่งซ่อมให้เสร็จก่อนกำหนดนัดหมายเพื่อให้ลูกค้าไม่ต้องเสียเวลารอ", "การเลือกใช้อะไหล่ราคาประหยัดแทนของแท้เพื่อช่วยลูกค้าลดค่าใช้จ่าย", "การชวนลูกค้าพูดคุยอย่างเป็นกันเองระหว่างที่รอรับบริการ", "การมอบสิทธิ์ตรวจเช็กฟรีในครั้งถัดไปเพื่อจูงใจให้ลูกค้ากลับมาใช้บริการ"], "answer": 0, "explanation": "การทำสิ่งเล็กๆ ที่เกินความคาดหวังโดยลูกค้าไม่ต้องร้องขอ (เช่น ล้างรถให้หลังซ่อมเสร็จ) คือการบริการที่ใส่ใจรายละเอียดและสร้างความประทับใจ ส่วนการเร่งความเร็ว การลดเกรดอะไหล่ หรือการแจกสิทธิพิเศษ ไม่ใช่การใส่ใจรายละเอียดที่แท้จริง", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 60, "q": "องค์ประกอบสำคัญของ 'ความสัมพันธ์ที่ดีในทีม' คือความเคารพซึ่งกันและกัน ข้อใดแสดงถึงพฤติกรรมนี้?", "choices": ["การให้เกียรติผู้อาวุโสโดยให้สิทธิแสดงความเห็นก่อนเสมอในที่ประชุม", "การรับฟังความคิดเห็นของพนักงานใหม่ด้วยความตั้งใจเท่ากับพนักงานเก่า", "การไม่ทักท้วงวิธีทำงานของเพื่อนเพื่อแสดงว่าเราไว้วางใจในฝีมือของเขา", "การปฏิบัติตามคำแนะนำของรุ่นพี่ทุกเรื่องเพื่อแสดงความนอบน้อม", "การเลือกทำงานร่วมกับคนที่มีแนวคิดคล้ายกันเพื่อลดข้อขัดแย้ง"], "answer": 1, "explanation": "การเคารพซึ่งกันและกันคือการให้คุณค่ากับทุกคนอย่างเท่าเทียม การรับฟังพนักงานใหม่อย่างตั้งใจเท่ากับพนักงานเก่าแสดงว่าเราเคารพในความคิด ไม่ตัดสินจากอาวุโส ส่วนการให้สิทธิพิเศษตามอาวุโสหรือการไม่กล้าทักท้วง เป็นการยึดลำดับชั้น ไม่ใช่ความเคารพที่แท้จริง", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 61, "q": "พฤติกรรมใดแสดงถึงความเป็น 'สมาชิกที่ดีของทีม' ในช่วงเวลาที่งานกดดันสูง?", "choices": ["การมุ่งทำงานส่วนของตนให้เสร็จสมบูรณ์ที่สุดโดยไม่รบกวนสมาธิของผู้อื่น", "การรักษาสติ คอยให้กำลังใจทีม และอาสาทำหน้าที่เสริมตามความจำเป็น", "การเสนอให้ตัดขั้นตอนงานที่ใช้เวลามากออกเพื่อให้ทันกำหนดส่งงาน", "การขอกำลังคนเพิ่มจากหัวหน้าทันทีเพื่อกระจายความกดดันของทีม", "การทำงานล่วงเวลาทุกวันเพื่อพิสูจน์ความทุ่มเทให้ทีมได้เห็น"], "answer": 1, "explanation": "ในภาวะกดดัน สมาชิกที่ดีจะรักษาสติ (ควบคุมอารมณ์) เป็นกำลังใจให้ทีม และมีความคิดริเริ่มอาสาช่วยงานเสริมที่จำเป็น ซึ่งช่วยพยุงทั้งขวัญกำลังใจและผลงานของทีม การก้มหน้าทำเฉพาะงานตนหรือทุ่มโอทีเพื่อพิสูจน์ตัว ไม่ได้ช่วยทีมโดยรวม", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 62, "q": "การทำ 'Customer Journey Mapping' ช่วยให้สมาชิกในทีมเข้าใจความต้องการของผู้รับบริการอย่างไร?", "choices": ["ช่วยจำแนกกลุ่มลูกค้าตามกำลังซื้อเพื่อออกแบบโปรโมชั่นให้เหมาะสมกับแต่ละกลุ่ม", "ช่วยให้เห็นภาพรวมของประสบการณ์ลูกค้าตั้งแต่ต้นจนจบและจุดที่ต้องปรับปรุง", "ช่วยกำหนดราคาบริการให้สอดคล้องกับต้นทุนที่เกิดขึ้นในแต่ละขั้นตอน", "ช่วยวัดประสิทธิภาพการทำงานของพนักงานประจำจุดบริการแต่ละจุด", "ช่วยคาดการณ์ยอดขายล่วงหน้าจากสถิติการเข้าใช้บริการของลูกค้า"], "answer": 1, "explanation": "Customer Journey Map คือแผนภาพเส้นทางประสบการณ์ของลูกค้าตั้งแต่ก่อนใช้บริการจนหลังใช้บริการ ทำให้ทีมเห็นจุดสัมผัส (Touchpoint) และจุดที่ลูกค้าติดขัด (Pain Point) เพื่อปรับปรุงบริการได้ตรงจุด ไม่ใช่เครื่องมือแบ่งกลุ่มลูกค้า ตั้งราคา หรือวัดผลพนักงาน", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 63, "q": "ในการสื่อสารภายในทีม ข้อใดคือความหมายของการสื่อสาร 'อย่างมีประสิทธิภาพ'?", "choices": ["ผู้ส่งสารถ่ายทอดข้อมูลได้ครบถ้วนทุกรายละเอียดตามที่เตรียมการมา", "ผู้รับสารสามารถเข้าใจเนื้อหาได้ถูกต้องและนำไปปฏิบัติงานต่อได้ทันที", "การสื่อสารที่ใช้เวลาน้อยที่สุดและเข้าถึงผู้รับได้จำนวนมากที่สุด", "การใช้ศัพท์เทคนิคที่ถูกต้องตามหลักวิชาชีพอย่างเคร่งครัด", "การมีบันทึกเป็นลายลักษณ์อักษรอ้างอิงได้ทุกครั้งที่มีการสื่อสาร"], "answer": 1, "explanation": "ประสิทธิภาพของการสื่อสารวัดที่ 'ผู้รับสาร' คือรับสารแล้วเข้าใจถูกต้องตรงตามเจตนาและนำไปปฏิบัติต่อได้ ไม่ได้วัดที่ความครบถ้วนของผู้ส่งฝ่ายเดียว ความเร็ว ปริมาณ หรือศัพท์เทคนิคที่ใช้", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 64, "q": "การสร้างสัมพันธ์ในทีมผ่านกิจกรรมกลุ่มสัมพันธ์ (Team Building) จะล้มเหลวที่สุดหากเกิดสถานการณ์ใด?", "choices": ["กิจกรรมนั้นถูกจัดขึ้นในวันหยุดทำให้พนักงานบางส่วนไม่สะดวกเข้าร่วม", "กิจกรรมนั้นมีแต่เกมสนุกสนานแต่ไม่มีการเชื่อมโยงกลับมาสู่การทำงานจริง", "กิจกรรมนั้นใช้งบประมาณสูงกว่าที่ตั้งไว้จนถูกฝ่ายบริหารทักท้วง", "กิจกรรมนั้นแบ่งกลุ่มแข่งขันกันจนมีทีมที่แพ้และทีมที่ชนะ", "กิจกรรมนั้นถูกเลื่อนกำหนดออกไปเพราะสภาพอากาศไม่เอื้ออำนวย"], "answer": 1, "explanation": "เป้าหมายที่แท้จริงของ Team Building คือการนำบทเรียนจากกิจกรรมกลับมาใช้ในการทำงานร่วมกัน หากมีแต่ความสนุกโดยไม่ถอดบทเรียนเชื่อมโยงสู่งานจริง กิจกรรมนั้นถือว่าล้มเหลวในเชิงวัตถุประสงค์ ปัญหาวันจัด งบ หรือแพ้ชนะเป็นเพียงอุปสรรครอง", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 65, "q": "พฤติกรรม 'สอนงาน' (Coaching) ระหว่างเพื่อนร่วมงาน ช่วยส่งเสริมการแลกเปลี่ยนเรียนรู้ อย่างไร?", "choices": ["ช่วยแบ่งเบาภาระของพนักงานเก่าโดยส่งต่องานประจำให้พนักงานใหม่รับผิดชอบแทน", "ช่วยสร้างมาตรฐานฝีมือแรงงานให้เท่าเทียมกันและลดความเสี่ยงจากการทำงาน", "ช่วยให้พนักงานใหม่เคารพและปฏิบัติตามแนวทางของรุ่นพี่อย่างเคร่งครัด", "ช่วยให้หัวหน้างานประเมินศักยภาพของพนักงานแต่ละคนได้แม่นยำยิ่งขึ้น", "ช่วยลดงบประมาณการส่งพนักงานไปฝึกอบรมภายนอกขององค์กรลงได้มาก"], "answer": 1, "explanation": "การสอนงานถ่ายทอดทักษะและเทคนิคที่ถูกต้องให้ทั่วถึงกัน ทำให้ฝีมือของทีมได้มาตรฐานเดียวกัน ลดข้อผิดพลาดและอุบัติเหตุจากการทำงานที่ไม่ถูกวิธี ไม่ใช่การโอนภาระงาน สร้างลำดับชั้น หรือเพียงประหยัดงบอบรม", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 66, "q": "หากคุณมีเทคนิคการซ่อมเครื่องจักรที่รวดเร็วกว่าคนอื่น พฤติกรรมใดแสดงถึง 'การแลกเปลี่ยนเรียนรู้' ที่ดี?", "choices": ["ใช้เทคนิคนั้นสร้างผลงานให้โดดเด่นเพื่อเป็นแบบอย่างให้เพื่อนร่วมทีมสังเกตเอง", "จัดเตรียมคู่มือหรือวิดีโอสาธิตง่ายๆ แล้วแบ่งปันให้ทุกคนในทีมได้ลองทำตาม", "สาธิตให้เฉพาะสมาชิกที่มีพื้นฐานดีพอเพื่อป้องกันการนำไปใช้อย่างผิดวิธี", "เสนอเทคนิคต่อหัวหน้างานเพื่อพิจารณาบรรจุเป็นขั้นตอนมาตรฐานเสียก่อน", "เก็บเทคนิคไว้ใช้เองในงานเร่งด่วนที่ทีมต้องการความรวดเร็วเป็นพิเศษ"], "answer": 1, "explanation": "การแปลงความรู้ฝังลึก (Tacit Knowledge) ให้เป็นความรู้ชัดแจ้ง (Explicit Knowledge) เช่น คู่มือหรือวิดีโอสาธิต แล้วแบ่งปันให้ทีมนำไปฝึกตาม เป็นการแลกเปลี่ยนเรียนรู้เชิงรุก ส่วนการรอให้สังเกตเอง สอนเฉพาะบางคน หรือรอขั้นตอนทางการ ทำให้ความรู้กระจายช้าและไม่ทั่วถึง", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 67, "q": "การใช้วาจา 'สุภาพและให้เกียรติ' สำคัญต่อการประสานงานภายในทีมอย่างไร?", "choices": ["ช่วยให้การประสานงานดูเป็นทางการและตรวจสอบย้อนหลังได้ง่ายขึ้น", "ช่วยลดกำแพงทางใจและสร้างบรรยากาศที่พนักงานกล้าสื่อสารอย่างเปิดเผย", "ช่วยป้องกันไม่ให้เกิดความขัดแย้งขึ้นภายในทีมได้ในทุกกรณี", "ช่วยเสริมภาพลักษณ์ความเป็นมืออาชีพขององค์กรในสายตาผู้มาติดต่อภายนอก", "ช่วยให้ผู้พูดได้รับการยอมรับนับถือจากเพื่อนร่วมงานมากยิ่งขึ้น"], "answer": 1, "explanation": "วาจาสุภาพและให้เกียรติสร้างความรู้สึกปลอดภัยทางจิตใจ ลดกำแพงระหว่างกัน ทำให้สมาชิกกล้าพูด กล้าถาม กล้าเสนอความเห็นอย่างเปิดเผย ซึ่งเป็นหัวใจของการประสานงาน ไม่ใช่เรื่องความเป็นทางการหรือภาพลักษณ์ภายนอก", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 68, "q": "เมื่อสมาชิกในทีมนำเสนอไอเดียที่คุณคิดว่า 'เป็นไปไม่ได้' คุณควรตอบสนองอย่างไร?", "choices": ["ชี้แจงข้อจำกัดด้านงบประมาณและเวลาให้เห็นทันทีเพื่อไม่ให้เสียเวลาที่ประชุม", "รับฟังและชวนวิเคราะห์ถึงจุดดีและข้อจำกัดของไอเดียนั้นอย่างเป็นกลาง", "เสนอไอเดียของเราประกบคู่ไปเพื่อให้ที่ประชุมเปรียบเทียบและเลือกเอง", "กล่าวให้กำลังใจไว้ก่อนแล้วค่อยหาโอกาสบอกข้อจำกัดเป็นการส่วนตัว", "เสนอให้บันทึกไอเดียนั้นไว้พิจารณาในโอกาสหน้าเพื่อรักษาน้ำใจผู้เสนอ"], "answer": 1, "explanation": "การรับฟังจนจบแล้วชวนกันวิเคราะห์ทั้งจุดแข็งและข้อจำกัดอย่างเป็นกลาง เป็นการเคารพความคิดเห็นและรักษาบรรยากาศสร้างสรรค์ การรีบชี้ข้อจำกัดหรือเลื่อนไปพิจารณาภายหลังคือการปัดตกไอเดียโดยยังไม่ได้พิจารณาจริง", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 69, "q": "ข้อใดเป็นหัวใจของการ 'รู้และเข้าใจความต้องการของผู้รับบริการ' ในระยะยาว?", "choices": ["การสอบถามความต้องการจากลูกค้าโดยตรงอย่างละเอียดทุกครั้งที่เข้ามาใช้บริการ", "การสังเกตพฤติกรรมและการเก็บข้อมูลสถิติเพื่อพยากรณ์ความต้องการในอนาคต", "การตอบสนองทุกคำขอของลูกค้าให้รวดเร็วที่สุดเท่าที่จะสามารถทำได้", "การจัดกิจกรรมส่งเสริมการขายอย่างต่อเนื่องเพื่อรักษาฐานลูกค้าเดิมไว้", "การยึดมาตรฐานบริการที่ผ่านการรับรองแล้วอย่างมั่นคงไม่เปลี่ยนแปลง"], "answer": 1, "explanation": "การเข้าใจลูกค้าในระยะยาวต้องอาศัยข้อมูล คือการสังเกตพฤติกรรมและเก็บสถิติอย่างต่อเนื่องเพื่อวิเคราะห์แนวโน้มและพยากรณ์ความต้องการล่วงหน้า การถามรายครั้งหรือรอตอบสนองคำขอ ได้เพียงความต้องการเฉพาะหน้า ไม่เห็นแนวโน้มระยะยาว", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 70, "q": "ความสำเร็จของการทำงานเป็นทีม (Teamwork) วัดจากสิ่งใดมากที่สุด?", "choices": ["การส่งมอบงานได้ครบถ้วนตรงตามกำหนดเวลาและงบประมาณที่วางแผนไว้", "การบรรลุเป้าหมายขององค์กรพร้อมกับความพึงพอใจของสมาชิกในทีมและลูกค้า", "การที่สมาชิกทุกคนสามัคคีกันโดยไม่เกิดข้อขัดแย้งใดเลยตลอดทั้งโครงการ", "การได้รับคำชื่นชมและการยอมรับจากผู้บริหารระดับสูงขององค์กร", "การที่สมาชิกแต่ละคนทำผลงานส่วนตัวได้ครบตามตัวชี้วัดทุกข้อ"], "answer": 1, "explanation": "ความสำเร็จของทีมต้องวัดทั้งด้านผลงาน (บรรลุเป้าหมายองค์กร) และด้านคน (ความพึงพอใจของสมาชิกและลูกค้า) ควบคู่กัน การส่งงานทันเวลาหรือทำ KPI ส่วนตัวครบเป็นเพียงบางมิติ ทีมที่งานสำเร็จแต่คนหมดไฟไม่ถือว่าสำเร็จแท้จริง", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 71, "q": "ทีมงานต้องส่งมอบงานให้ลูกค้าภายในพรุ่งนี้ แต่สมาชิกสองคนกำลังขัดแย้งกันอย่างรุนแรงเรื่องแนวทางการทำงานจนงานหยุดชะงัก ในฐานะหัวหน้าทีม ควรดำเนินการอย่างไรเป็นลำดับแรก?", "choices": ["สั่งให้ทั้งสองหยุดเถียงกันทันทีและใช้แนวทางของหัวหน้าทีมแทน เพื่อไม่ให้เสียเวลาไปมากกว่านี้", "แยกให้ทั้งสองไปรับผิดชอบงานคนละส่วนโดยไม่ต้องเจอกันจนกว่าจะส่งมอบงานเสร็จ", "ให้ทั้งสองฝ่ายชี้แจงเหตุผล แล้วใช้เป้าหมายงานและกำหนดส่งเป็นเกณฑ์เลือกแนวทางร่วมกัน", "แจ้งลูกค้าขอเลื่อนกำหนดส่งออกไปก่อน เพื่อให้ทีมมีเวลาแก้ปัญหาภายในอย่างรอบคอบ", "ให้สมาชิกที่เหลือในทีมโหวตเลือกแนวทางของฝ่ายใดฝ่ายหนึ่งเพื่อยุติข้อขัดแย้งโดยเร็ว"], "answer": 2, "explanation": "การขจัดความขัดแย้งที่ดีต้องเปิดโอกาสให้ทั้งสองฝ่ายชี้แจงเหตุผล แล้วใช้เป้าหมายส่วนรวมและเงื่อนไขเวลาเป็นเกณฑ์ตัดสิน ส่วนการใช้อำนาจสั่ง แยกคน โหวต หรือรีบขอเลื่อนงานทั้งที่ยังไม่ได้แก้ปัญหา เป็นการกดปัญหาไว้โดยไม่ได้แก้ที่สาเหตุ", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 72, "q": "ในที่ประชุมทีม หัวหน้าตำหนิผลงานของเราอย่างตรงไปตรงมาต่อหน้าเพื่อนร่วมงานจนรู้สึกเสียหน้า แต่ข้อตำหนิบางส่วนเป็นความจริง การตอบสนองในข้อใดเหมาะสมที่สุด?", "choices": ["รับฟังอย่างสงบ ขอบคุณสำหรับข้อสังเกต แล้วขอคุยรายละเอียดเพิ่มเติมหลังประชุม", "ชี้แจงข้อเท็จจริงโต้แย้งทันทีในที่ประชุมอย่างสุภาพ เพื่อรักษาความน่าเชื่อถือของตนต่อหน้าเพื่อนร่วมงาน", "ยอมรับผิดทุกประเด็นแม้บางเรื่องไม่ใช่ความผิดของเรา เพื่อให้เรื่องจบลงโดยเร็ว", "นิ่งเงียบในที่ประชุม แล้วไประบายกับเพื่อนสนิทว่าหัวหน้าปฏิบัติอย่างไม่เป็นธรรม", "ทำหนังสือถึงผู้บริหารว่าหัวหน้าตำหนิพนักงานต่อหน้าที่ประชุมอย่างไม่เหมาะสม"], "answer": 0, "explanation": "การรับ feedback อย่างมืออาชีพคือฟังโดยไม่ตอบโต้ด้วยอารมณ์ แยกข้อเท็จจริงออกจากความรู้สึกเสียหน้า และหาโอกาสคุยส่วนตัวเพื่อทำความเข้าใจและปรับปรุง การรีบโต้แย้งกลางที่ประชุม ยอมรับทุกอย่าง หรือไปนินทา ล้วนไม่ช่วยพัฒนางาน", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 73, "q": "ลูกค้าโทรมาเร่งงานที่ทีมรับปากไว้ แต่ขณะนั้นทีมกำลังมีปัญหาภายในเพราะสมาชิกหลักลาป่วยกะทันหันทำให้งานล่าช้ากว่าแผนมาก ผู้ประสานงานควรสื่อสารกับลูกค้าอย่างไรจึงจะเหมาะสมที่สุด?", "choices": ["ยืนยันกับลูกค้าว่างานจะเสร็จตามกำหนดเดิมเพื่อรักษาความเชื่อมั่น แล้วค่อยหาทางแก้ปัญหาภายหลัง", "อธิบายสถานการณ์ปัญหาภายในทีมให้ลูกค้าฟังอย่างละเอียด เพื่อแสดงความโปร่งใสและขอให้ลูกค้าเห็นใจ", "แนะนำให้ลูกค้าติดต่อหัวหน้าทีมโดยตรงเพราะตนไม่มีอำนาจตัดสินใจเรื่องกำหนดส่งงาน", "แจ้งตามจริงว่างานอาจล่าช้า พร้อมเสนอส่งมอบส่วนที่เร่งด่วนก่อนและแจ้งกำหนดส่วนที่เหลือที่ทำได้จริง", "ขอให้ลูกค้าเลื่อนกำหนดออกไปโดยให้เหตุผลว่าเป็นเหตุสุดวิสัยที่ทีมไม่ต้องรับผิดชอบ"], "answer": 3, "explanation": "การเข้าใจความต้องการของผู้รับบริการคือรู้ว่าลูกค้าต้องการความชัดเจนและงานส่วนที่จำเป็นก่อน การแจ้งตามจริงพร้อมเสนอทางเลือกที่ทำได้จริงจึงรักษาทั้งความเชื่อมั่นและประโยชน์ของลูกค้า ต่างจากการรับปากเกินจริง เล่าปัญหาภายในทั้งหมด หรือโยนเรื่องให้ผู้อื่น", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 74, "q": "สมาชิกใหม่ในทีมมีความรู้เทคโนโลยีสมัยใหม่ดีมาก แต่ถูกสมาชิกอาวุโสมองว่าอวดรู้และไม่ยอมรับฟังวิธีทำงานแบบเดิม ทำให้ทั้งสองฝ่ายไม่แลกเปลี่ยนความรู้กัน ในฐานะสมาชิกทีมที่เห็นปัญหานี้ ควรทำอย่างไรจึงเกิดประโยชน์ต่อทีมมากที่สุด?", "choices": ["แนะนำสมาชิกใหม่ให้ลดบทบาทลงและทำตามแนวทางของรุ่นพี่ไปก่อน จนกว่าจะได้รับความไว้วางใจจากทีม", "แนะนำสมาชิกอาวุโสให้เร่งเปิดใจเรียนรู้ เพราะความรู้แบบเดิมกำลังจะถูกเทคโนโลยีใหม่เข้ามาแทนที่", "เสนอจัดกิจกรรมแลกเปลี่ยนเรียนรู้ภายในทีม ให้ทั้งสองฝ่ายผลัดกันเป็นผู้สอนในสิ่งที่ตนถนัด", "รายงานหัวหน้าให้พิจารณาแยกทั้งสองคนไปรับผิดชอบงานคนละส่วนเพื่อลดการกระทบกระทั่ง", "ปล่อยให้เวลาช่วยแก้ปัญหา เพราะเมื่อได้ทำงานด้วยกันนานขึ้นทั้งคู่จะปรับตัวเข้าหากันเอง"], "answer": 2, "explanation": "การแลกเปลี่ยนเรียนรู้ในทีมเกิดขึ้นได้เมื่อทุกฝ่ายเห็นคุณค่าของกันและกัน การให้ผลัดกันเป็นผู้สอนทำให้ทั้งความรู้ใหม่และประสบการณ์เดิมถูกนำมาใช้ร่วมกัน ส่วนการให้ฝ่ายใดฝ่ายหนึ่งยอมถอย แยกกันทำงาน หรือรอเวลา เป็นการเสียโอกาสของทีม", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 75, "q": "ทีมได้รับมอบหมายงานเร่งด่วน หัวหน้าทีมตัดสินใจเลือกแนวทางหนึ่งซึ่งเราเห็นว่ามีจุดอ่อนสำคัญที่อาจทำให้งานเสียหาย แต่ที่ประชุมส่วนใหญ่เห็นด้วยกับหัวหน้าแล้ว ผู้ตามที่ดีควรทำอย่างไร?", "choices": ["ปฏิบัติตามมติทันทีโดยไม่แสดงความเห็นเพิ่ม เพราะเมื่อเสียงส่วนใหญ่และหัวหน้าเห็นชอบแล้ว ผู้ตามที่ดีควรสนับสนุนอย่างเต็มที่", "ปฏิบัติตามแนวทางของตนเองอย่างเงียบๆ ในส่วนงานที่ตนดูแล เพราะมั่นใจว่าจะช่วยป้องกันความเสียหายได้", "ขอถอนตัวจากงานนี้อย่างสุภาพ เพื่อไม่ต้องร่วมรับผิดชอบต่อความเสียหายที่ประเมินแล้วว่าอาจเกิดขึ้น", "บันทึกข้อกังวลไว้เป็นหลักฐาน แล้วรอให้ปัญหาเกิดขึ้นจริงจึงชี้ให้ที่ประชุมเห็นว่าเราเคยทักท้วงไว้", "แสดงข้อกังวลพร้อมเหตุผลในที่ประชุม แต่หากมติคงเดิมก็ปฏิบัติตามอย่างเต็มที่และช่วยเฝ้าระวังจุดอ่อนนั้น"], "answer": 4, "explanation": "ผู้ตามที่ดีไม่ใช่ผู้ที่เชื่อฟังโดยไม่คิด แต่กล้าท้วงติงด้วยเหตุผลก่อนตัดสินใจ และเมื่อทีมมีมติแล้วก็สนับสนุนอย่างเต็มที่พร้อมช่วยลดความเสี่ยง การเงียบตาม แอบทำตามใจตน หรือรอให้พังเพื่อพิสูจน์ตัวเอง ล้วนทำร้ายทีม", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 76, "q": "ในการประชุมทีมเพื่อตัดสินใจเรื่องสำคัญ สมาชิกคนหนึ่งพูดยาวและวนซ้ำจนกินเวลาผู้อื่น ขณะที่สมาชิกอีกสองคนไม่กล้าแสดงความเห็นเลยทั้งที่รับผิดชอบงานส่วนนั้นโดยตรง ประธานที่ประชุมควรทำอย่างไร?", "choices": ["สรุปประเด็นของผู้ที่พูดยาวอย่างสุภาพเพื่อปิดประเด็น แล้วเชิญผู้ที่รับผิดชอบโดยตรงแสดงความเห็นทีละคน", "เปิดโอกาสให้ทุกคนพูดตามความสมัครใจต่อไปจนครบถ้วน เพราะการเร่งรัดหรือเจาะจงตัวผู้พูดจะทำให้บรรยากาศการประชุมตึงเครียด", "ตัดบทผู้ที่พูดยาวทันทีว่าหมดเวลา แล้วรีบสรุปมติตามความเห็นที่มีอยู่เพื่อให้การประชุมจบตรงเวลา", "เลื่อนการตัดสินใจออกไปประชุมครั้งหน้า เพื่อให้สมาชิกทุกคนมีเวลาเตรียมความเห็นมานำเสนอมากขึ้น", "ขอความเห็นเพิ่มเติมจากผู้ที่นำเสนอเก่งที่สุด เพราะเป็นผู้ที่มีข้อมูลพร้อมสนับสนุนการตัดสินใจมากที่สุด"], "answer": 0, "explanation": "ประธานที่ดีต้องบริหารเวลาและเปิดพื้นที่ให้ทุกฝ่ายที่เกี่ยวข้องได้แสดงความเห็น การสรุปปิดประเด็นอย่างสุภาพและเชิญผู้รับผิดชอบตรงให้พูด ทำให้การตัดสินใจได้ข้อมูลครบโดยไม่เสียบรรยากาศ ส่วนการปล่อยไหล ตัดบทหยาบ หรือเลื่อนประชุม ไม่แก้ปัญหาที่แท้จริง", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 77, "q": "เราพบว่าเพื่อนร่วมทีมทำงานผิดขั้นตอนซึ่งจะกระทบคุณภาพงานที่ส่งให้ลูกค้า แต่เขาเป็นคนอ่อนไหวต่อคำวิจารณ์และเคยไม่พอใจเมื่อถูกทักท้วงต่อหน้าผู้อื่น ควรให้ feedback อย่างไรจึงได้ผลที่สุด?", "choices": ["แจ้งในกลุ่มแชทของทีมอย่างสุภาพทันทีที่พบ เพื่อให้ทุกคนช่วยกันตรวจสอบและป้องกันความผิดพลาดแบบเดียวกัน", "แก้ไขงานส่วนที่ผิดให้เองโดยไม่บอกเขา เพื่อรักษาน้ำใจและให้งานถูกต้องทันกำหนดเวลา", "แจ้งหัวหน้าให้เป็นผู้ตักเตือนแทน เพราะการตักเตือนเป็นหน้าที่ของผู้บังคับบัญชาโดยตรง", "พูดคุยเป็นการส่วนตัว ชี้ให้เห็นผลกระทบต่องานโดยไม่ตำหนิตัวบุคคล และชวนกันหาวิธีแก้ไข", "รอบันทึกข้อบกพร่องนี้ไว้ก่อน แล้วแจ้งอย่างเป็นทางการในแบบประเมินผลการปฏิบัติงานประจำปี"], "answer": 3, "explanation": "การให้ feedback ที่ดีควรทำเป็นการส่วนตัว เน้นที่พฤติกรรมและผลกระทบต่องานไม่ใช่ตัวบุคคล และชวนหาทางแก้ร่วมกัน การทักท้วงในแชทกลุ่ม แอบแก้ให้เอง หรือเก็บไว้แจ้งตอนประเมิน ล้วนทำลายความสัมพันธ์หรือปล่อยให้ปัญหาซ้ำรอย", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 78, "q": "ทีมประกอบด้วยสมาชิกจากหลายแผนกที่ไม่เคยทำงานร่วมกันมาก่อน ต่างฝ่ายต่างระวังตัวและปกป้องผลประโยชน์ของแผนกตนจนงานส่วนรวมไม่คืบหน้า ผู้ประสานงานควรเริ่มต้นสร้างความร่วมมืออย่างไร?", "choices": ["กำหนดบทลงโทษที่ชัดเจนสำหรับแผนกที่ไม่ให้ความร่วมมือเพื่อให้ทุกฝ่ายต้องเข้าร่วมทำงาน", "จัดประชุมร่วมกำหนดเป้าหมายส่วนรวมที่ทุกแผนกได้ประโยชน์ พร้อมตกลงบทบาทของแต่ละฝ่ายอย่างเปิดเผย", "เจรจากับแต่ละแผนกเป็นรายฝ่ายเพื่อรับฟังเงื่อนไขอย่างลึกซึ้ง โดยเสนอสิ่งจูงใจพิเศษให้แผนกที่ยอมเริ่มร่วมมือก่อน", "เริ่มทำงานกับแผนกที่ให้ความร่วมมือดีไปก่อน ส่วนแผนกที่ยังลังเลค่อยดึงเข้ามาร่วมภายหลัง", "รายงานผู้บริหารระดับสูงให้ออกคำสั่งบังคับทุกแผนกส่งตัวแทนเข้าร่วมทำงานอย่างจริงจัง"], "answer": 1, "explanation": "การประสานประโยชน์ที่ยั่งยืนต้องทำให้ทุกฝ่ายเห็นเป้าหมายร่วมและรู้ว่าตนได้ประโยชน์อะไรอย่างโปร่งใส การบังคับ ลงโทษ หรือเจรจาลับพร้อมสิ่งจูงใจพิเศษ อาจได้ความร่วมมือชั่วคราวแต่ทำลายความไว้วางใจระยะยาว", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 79, "q": "สมาชิกในทีมคนหนึ่งเพิ่งสูญเสียบุคคลในครอบครัว ทำให้ประสิทธิภาพการทำงานลดลงในช่วงที่ทีมมีงานเร่ง สมาชิกบางคนเริ่มบ่นว่าไม่ยุติธรรมที่ต้องรับภาระแทน การกระทำของหัวหน้าทีมในข้อใดสร้างทั้งความสัมพันธ์และผลงานได้ดีที่สุด?", "choices": ["ให้สมาชิกคนนั้นหยุดพักยาวจนกว่าจะพร้อมกลับมา แล้วเกลี่ยงานทั้งหมดให้สมาชิกที่เหลือรับผิดชอบ", "ปฏิบัติกับทุกคนอย่างเท่าเทียมโดยไม่ลดปริมาณงานของผู้ใด เพื่อไม่ให้สมาชิกคนอื่นรู้สึกถึงความไม่ยุติธรรม", "แสดงความเห็นใจเป็นการส่วนตัว ปรับลดงานของเขาชั่วคราว และสื่อสารให้ทีมเข้าใจพร้อมชื่นชมผู้ช่วยรับภาระ", "จ้างพนักงานชั่วคราวเข้ามาเสริมทีมทันทีในช่วงเร่งด่วน เพื่อไม่ให้กระทบทั้งปริมาณงานและความรู้สึกของสมาชิกที่เหลือ", "แจ้งสมาชิกคนนั้นว่าเข้าใจสถานการณ์ดี แต่ขอให้แยกเรื่องส่วนตัวออกจากงานในช่วงที่ทีมกำลังเร่งด่วน"], "answer": 2, "explanation": "หัวหน้าที่ดีต้องสมดุลระหว่างความเห็นอกเห็นใจกับผลงานของทีม การช่วยเหลือชั่วคราวพร้อมสื่อสารเหตุผลอย่างเปิดเผยและให้เกียรติผู้รับภาระเพิ่ม ทำให้ทีมรู้สึกยุติธรรมและผูกพันกัน ส่วนการเพิกเฉยต่อความรู้สึกหรือปล่อยภาระโดยไม่อธิบายจะบั่นทอนทีม", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 80, "q": "หลังจบโครงการ ทีมพบว่างานสำเร็จแต่เกิดข้อผิดพลาดซ้ำหลายจุดเหมือนโครงการก่อนหน้า สมาชิกส่วนใหญ่อยากรีบปิดงานไปพักผ่อน และบางคนกลัวว่าการทบทวนจะกลายเป็นการกล่าวโทษกัน หัวหน้าทีมควรทำอย่างไรเพื่อให้เกิดการเรียนรู้ร่วมกันอย่างแท้จริง?", "choices": ["งดการประชุมทบทวนเพื่อรักษาบรรยากาศของทีม แล้วให้หัวหน้าสรุปบทเรียนส่งให้ทุกคนอ่านภายหลัง", "จัดประชุมทบทวนเฉพาะจุดที่ผิดพลาด โดยให้ผู้เกี่ยวข้องแต่ละจุดชี้แจงต่อทีมเพื่อแสดงความรับผิดชอบ", "เลื่อนการทบทวนออกไปหลายเดือน เพื่อให้ทุกคนหายเหนื่อยและมีอารมณ์เย็นลงก่อนค่อยพูดคุยกัน", "บันทึกข้อผิดพลาดไว้ในรายงานปิดโครงการโดยไม่ระบุชื่อผู้เกี่ยวข้อง แล้วส่งให้ทีมโครงการถัดไปศึกษาเอง", "จัดประชุมถอดบทเรียนสั้นๆ โดยตั้งกติกาเน้นหาสาเหตุเชิงระบบไม่กล่าวโทษบุคคล แล้วบันทึกเป็นแนวปฏิบัติสำหรับโครงการหน้า"], "answer": 4, "explanation": "การแลกเปลี่ยนเรียนรู้ที่แท้จริงต้องทำขณะข้อมูลยังสด โดยสร้างบรรยากาศปลอดภัยที่เน้นสาเหตุเชิงระบบไม่ใช่ตัวบุคคล และแปลงบทเรียนเป็นแนวปฏิบัติ ส่วนการงดประชุม เลื่อนออกไปนาน ให้คนผิดชี้แจงรายคน หรือส่งรายงานให้อ่านเอง จะไม่เกิดการเรียนรู้ร่วมกันจริง", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}]}]};</script>
<script>
"use strict";
/* ================= state & storage ================= */
const $ = id => document.getElementById(id);
const store = {
  get(){ try{return JSON.parse(localStorage.getItem("vnet-stats"))||{}}catch(e){return{}} },
  set(d){ localStorage.setItem("vnet-stats", JSON.stringify(d)) }
};
let S = null;         // current quiz session
let timerInt = null;
let muted = localStorage.getItem("vnet-muted")==="1";

/* ================= sounds (WebAudio) ================= */
let actx = null;
function beep(freqs, dur=0.12, type="sine", vol=0.15){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, actx.currentTime + i*dur);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (i+1)*dur);
      o.connect(g).connect(actx.destination);
      o.start(actx.currentTime + i*dur); o.stop(actx.currentTime + (i+1)*dur + .02);
    });
  }catch(e){}
}
const sndGood = ()=>beep([660,880],0.1,"sine",.12);
const sndBad  = ()=>beep([220,180],0.15,"square",.06);
const sndWin  = ()=>beep([523,659,784,1047],0.14,"sine",.14);
const sndClick= ()=>beep([440],0.05,"sine",.05);
function toggleMute(){ muted=!muted; localStorage.setItem("vnet-muted",muted?"1":"0"); $("mutebtn").textContent = muted?"🔇":"🔊"; }

/* ================= home ================= */
function renderHome(){
  const st = store.get();
  const myIds = new Set([...EXAM_DATA.subjects.map(s=>s.id), "mix"]);
  let answered=0, correct=0;
  for(const k in (st.log||{})){ if(!myIds.has(k)) continue; answered += st.log[k].a; correct += st.log[k].c; }
  $("st-total").textContent = EXAM_DATA.subjects.reduce((s,x)=>s+x.questions.length,0);
  $("st-answered").textContent = answered;
  $("st-acc").textContent = answered ? Math.round(correct/answered*100)+"%" : "—";
  $("st-streak").textContent = st.maxStreak||0;

  const g = $("subjects"); g.innerHTML = "";
  EXAM_DATA.subjects.forEach(s=>{
    const best = (st.best||{})[s.id];
    const b = document.createElement("button");
    b.className = "subj";
    b.innerHTML = `<div class="ic">${s.icon}</div><h3>${s.title}</h3><div class="sub">${s.subtitle}</div>
      <div class="meta"><span class="badge">${s.questions.length} ข้อ</span>
      <span class="best">${best!=null ? "🏆 "+best+"%" : "ยังไม่เคยทำ"}</span></div>`;
    b.onclick = ()=>openSetup(s.id);
    g.appendChild(b);
  });
  if(EXAM_DATA.subjects.length < 2) return;
  const grandTotal = EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0);
  const mix = document.createElement("button");
  mix.className = "subj mix";
  const mixBest = (st.best||{})["mix"];
  mix.innerHTML = `<div class="ic">🎲</div><h3>จับฉลากรวมทุกชุด</h3><div class="sub">สุ่มคละจากทั้ง ${grandTotal} ข้อ</div>
    <div class="meta"><span class="badge">ท้าทาย!</span><span class="best">${mixBest!=null?"🏆 "+mixBest+"%":"ยังไม่เคยทำ"}</span></div>`;
  mix.onclick = ()=>openSetup("mix");
  g.appendChild(mix);
}

/* ================= setup modal ================= */
let setup = {n:20, mode:"practice", shuffleQ:true, shuffleC:false, subj:null};
function openSetup(id){
  sndClick();
  setup.subj = id;
  const s = id==="mix" ? {title:"จับฉลากรวมทุกวิชา", subtitle:"คละทุกสมรรถนะ", icon:"🎲",
      questions:{length:EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0)}}
    : EXAM_DATA.subjects.find(x=>x.id===id);
  const total = s.questions.length;
  const counts = [10,20,30,total>=100?50:total].filter((v,i,a)=>v<=total && a.indexOf(v)===i);
  if(!counts.includes(total) && total<=60) counts.push(total);
  setup.n = counts.includes(20)?20:counts[0];
  if(id==="mix") setup.shuffleQ = true;
  $("modal-root").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeSetup()">
    <div class="modal">
      <h2>${s.icon} ${s.title}</h2>
      <div class="sub">${s.subtitle} • มีทั้งหมด ${total} ข้อ</div>
      <div class="optlabel">โหมด</div>
      <div class="optrow" id="mode-row">
        <button class="opt ${setup.mode==="practice"?"sel":""}" onclick="setMode('practice')">📖 ฝึกฝน (เฉลยทันที)</button>
        <button class="opt ${setup.mode==="exam"?"sel":""}" onclick="setMode('exam')">⏱️ สอบเสมือนจริง</button>
      </div>
      <div class="optlabel">จำนวนข้อ</div>
      <div class="optrow" id="count-row">
        ${counts.map(c=>`<button class="opt ${c===setup.n?"sel":""}" onclick="setCount(${c})">${c===total?"ทั้งหมด ("+c+")":c}</button>`).join("")}
      </div>
      <div class="toggle ${setup.shuffleQ?"on":""}" id="tg-q" onclick="tog('shuffleQ','tg-q')"><span class="box">${setup.shuffleQ?"✓":""}</span> สุ่มลำดับข้อ</div>
      <div class="toggle ${setup.shuffleC?"on":""}" id="tg-c" onclick="tog('shuffleC','tg-c')"><span class="box">${setup.shuffleC?"✓":""}</span> สุ่มลำดับตัวเลือก</div>
      <div class="mrow">
        <button class="btn ghost" onclick="closeSetup()">ยกเลิก</button>
        <button class="btn primary" onclick="startQuiz()">เริ่มเลย 🚀</button>
      </div>
    </div>
  </div>`;
}
function setMode(m){ setup.mode=m; document.querySelectorAll("#mode-row .opt").forEach((b,i)=>b.classList.toggle("sel",(i===0)===(m==="practice"))); sndClick(); }
function setCount(c){ setup.n=c; document.querySelectorAll("#count-row .opt").forEach(b=>b.classList.toggle("sel",b.textContent.includes("("+c+")")||b.textContent.trim()==String(c))); sndClick(); }
function tog(key,id){ setup[key]=!setup[key]; const el=$(id); el.classList.toggle("on",setup[key]); el.querySelector(".box").textContent = setup[key]?"✓":""; sndClick(); }
function closeSetup(){ $("modal-root").innerHTML=""; }

/* ================= quiz engine ================= */
function shuffled(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

function startQuiz(){
  closeSetup();
  let pool, labels;
  if(setup.subj==="mix"){
    pool = EXAM_DATA.subjects.flatMap(s=>s.questions.map(q=>({...q, labels:s.labels, from:s.icon+" "+s.title})));
    labels = null;
  } else {
    const s = EXAM_DATA.subjects.find(x=>x.id===setup.subj);
    pool = s.questions.map(q=>({...q, labels:s.labels, from:""}));
  }
  if(setup.shuffleQ) pool = shuffled(pool);
  pool = pool.slice(0, setup.n);
  pool = pool.map(q=>{
    let idx = q.choices.map((_,i)=>i);
    if(setup.shuffleC) idx = shuffled(idx);
    return {...q, order:idx, picked:null, removed:[]};
  });
  S = { qs:pool, i:0, correct:0, streak:0, maxStreak:0, fifty:3, mode:setup.mode,
        subj:setup.subj, start:Date.now(), done:false };
  $("home").classList.add("hidden"); $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("mutebtn").textContent = muted?"🔇":"🔊";
  $("palette").classList.toggle("hidden", S.mode!=="exam");
  clearInterval(timerInt);
  timerInt = setInterval(()=>{ const t=Math.floor((Date.now()-S.start)/1000);
    $("q-timer").textContent = String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); },500);
  renderQ();
  window.scrollTo(0,0);
}

function renderQ(){
  const q = S.qs[S.i];
  $("q-count").textContent = `${S.i+1}/${S.qs.length}`;
  $("q-score").textContent = `✅ ${S.correct}`;
  $("q-streak").textContent = `🔥 ${S.streak}`;
  $("q-progress").style.width = (S.i/S.qs.length*100)+"%";
  $("q-section").textContent = q.from || q.section || "";
  stopSpeech();
  const audio = parseAudio(q.q);
  $("q-text").textContent = `${S.i+1}. ${audio ? audio.question : q.q}`;
  renderAudioBox(audio, q);
  $("q-expl").innerHTML = "";
  $("nextbtn").classList.add("hidden");
  $("skipbtn").classList.toggle("hidden", S.mode!=="exam");
  $("submitbtn").classList.add("hidden");
  $("fifty").classList.toggle("hidden", S.mode!=="practice");
  $("fifty").disabled = S.fifty<=0;
  $("fifty-n").textContent = "×"+S.fifty;

  const c = $("q-choices"); c.innerHTML = "";
  q.order.forEach((origIdx,pos)=>{
    const b = document.createElement("button");
    b.className = "choice";
    if(q.removed.includes(origIdx)) b.classList.add("dim");
    b.innerHTML = `<span class="lb">${q.labels[pos]}</span><span>${q.choices[origIdx]}</span>`;
    if(S.mode==="exam" && q.picked===origIdx) b.classList.add("picked");
    b.onclick = ()=>pick(origIdx, b);
    c.appendChild(b);
  });
  if(S.mode==="exam"){
    renderPalette();
    if(q.picked!==null || S.i===S.qs.length-1) maybeShowSubmit();
  }
}

/* ===== text-to-speech for listening questions ===== */
const AUDIO_RE = /^\(Audio\)\s*['‘’](.*)['‘’]\s*(?:->|→)\s*(.*)$/s;
function parseAudio(text){
  const m = AUDIO_RE.exec(text);
  return m ? {script:m[1].trim(), question:m[2].trim()} : null;
}
let currentScript = null;
let currentAudioSrc = null;   // mp3 for this question (real voice), if available
let audioEl = null;
function stopSpeech(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  if(audioEl){ audioEl.pause(); audioEl = null; }
  document.querySelectorAll(".playbtn").forEach(b=>b.classList.remove("playing"));
}
let currentUtterance = null; // keep a reference so Chrome doesn't GC it mid-speech
function playAudio(){
  stopSpeech();
  const btnA = document.querySelector(".playbtn");
  if(currentAudioSrc){
    const src = currentAudioSrc.startsWith("data:") ? currentAudioSrc
              : (window.AUDIO_BASE || "audio/") + currentAudioSrc;
    audioEl = new Audio(src);
    audioEl.onplay = ()=>btnA && btnA.classList.add("playing");
    audioEl.onended = ()=>btnA && btnA.classList.remove("playing");
    audioEl.onerror = ()=>{ btnA && btnA.classList.remove("playing"); speakScript(); };
    audioEl.play().catch(()=>speakScript());
    return;
  }
  speakScript();
}
function speakScript(){
  if(!("speechSynthesis" in window) || !currentScript) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(currentScript);
  u.lang = "en-US"; u.rate = 0.92;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x=>x.name==="Samantha") || vs.find(x=>x.lang==="en-US") ||
            vs.find(x=>x.lang && x.lang.startsWith("en"));
  if(v) u.voice = v;
  const btn = document.querySelector(".playbtn");
  u.onstart = ()=>btn && btn.classList.add("playing");
  u.onend = u.onerror = ()=>btn && btn.classList.remove("playing");
  currentUtterance = u;
  // Chrome quirk: speak() immediately after cancel() can be silently dropped
  setTimeout(()=>speechSynthesis.speak(u), 80);
}
function toggleScript(){
  const s = $("q-script"); if(s) s.classList.toggle("hidden");
}
function renderAudioBox(audio, q){
  currentScript = audio ? audio.script : null;
  currentAudioSrc = (audio && q && q.audio) ? q.audio : null;
  const box = $("q-audio");
  if(!audio){ box.innerHTML = ""; return; }
  const ttsOK = currentAudioSrc !== null || "speechSynthesis" in window;
  box.innerHTML = `<div class="audio-box">
    <div class="audio-row">
      <button class="playbtn" onclick="playAudio()">▶️ ฟังเสียง</button>
      <button class="scriptbtn" onclick="toggleScript()">📜 ดูบทพูด</button>
    </div>
    <div class="script hidden" id="q-script">"${audio.script}"</div>
    <div class="audio-hint">${ttsOK ? "ฟังได้หลายรอบ • ลองตอบโดยไม่เปิดบทพูดเพื่อฝึกการฟังจริง" : "เบราว์เซอร์นี้ไม่รองรับเสียงพูด — กด ดูบทพูด เพื่ออ่านแทน"}</div>
  </div>`;
}
function labelOf(q, origIdx){ return q.labels[q.order.indexOf(origIdx)]; }
function pick(idx, btn){
  const q = S.qs[S.i];
  if(S.mode==="practice"){
    if(q.picked!==null) return;
    q.picked = idx;
    const good = idx===q.answer;
    if(good){ S.correct++; S.streak++; S.maxStreak=Math.max(S.maxStreak,S.streak); sndGood();
      if(S.streak>0 && S.streak%5===0){ comboPop("🔥 "+S.streak+" ติด!"); }
    } else { S.streak=0; sndBad(); $("qcard").classList.add("shake"); setTimeout(()=>$("qcard").classList.remove("shake"),400); }
    // reveal
    [...$("q-choices").children].forEach((b,pos)=>{
      const oi = q.order[pos];
      b.disabled = true;
      if(oi===q.answer) b.classList.add("correct");
      else if(oi===idx) b.classList.add("wrong");
    });
    $("q-score").textContent = `✅ ${S.correct}`;
    $("q-streak").textContent = `🔥 ${S.streak}`;
    $("q-expl").innerHTML = `<div class="expl ${good?"good":"bad"}">
      <h4>${good ? "🎉 ถูกต้อง!" : "❌ ยังไม่ถูก — เฉลยคือ "+labelOf(q,q.answer)+"."}</h4>
      <p>${q.explanation || "ไม่มีคำอธิบายเพิ่มเติมสำหรับข้อนี้"}</p></div>`;
    const sc = $("q-script"); if(sc) sc.classList.remove("hidden");
    $("fifty").classList.add("hidden");
    if(S.i===S.qs.length-1){ $("nextbtn").textContent = "ดูสรุปผล 🏁"; }
    $("nextbtn").classList.remove("hidden");
    $("nextbtn").focus();
  } else {
    q.picked = idx; sndClick();
    [...$("q-choices").children].forEach((b,pos)=>b.classList.toggle("picked", q.order[pos]===idx));
    renderPalette(); maybeShowSubmit();
    setTimeout(()=>{ if(S.i<S.qs.length-1){ S.i++; renderQ(); window.scrollTo(0,0);} }, 250);
  }
}

function nextQ(){
  if(S.i>=S.qs.length-1){ finishQuiz(); return; }
  S.i++; renderQ(); window.scrollTo(0,0);
}
function maybeShowSubmit(){
  const allDone = S.qs.every(q=>q.picked!==null);
  $("submitbtn").classList.toggle("hidden", !(allDone || S.i===S.qs.length-1));
}
function renderPalette(){
  const p = $("palette"); p.innerHTML = "";
  S.qs.forEach((q,i)=>{
    const b = document.createElement("button");
    b.className = "pal"+(q.picked!==null?" done":"")+(i===S.i?" cur":"");
    b.textContent = i+1;
    b.onclick = ()=>{ S.i=i; renderQ(); };
    p.appendChild(b);
  });
}
function useFifty(){
  const q = S.qs[S.i];
  if(S.fifty<=0 || q.picked!==null) return;
  S.fifty--;
  const wrongs = shuffled(q.order.filter(i=>i!==q.answer && !q.removed.includes(i))).slice(0,2);
  q.removed.push(...wrongs);
  sndClick(); renderQ();
}
function confirmExit(){
  if(S && !S.done && S.qs.some(q=>q.picked!==null)){
    if(!confirm("ออกจากการทำข้อสอบ? ความคืบหน้ารอบนี้จะหายไป")) return;
  }
  quitToHome();
}
function quitToHome(){
  stopSpeech();
  clearInterval(timerInt); S=null;
  $("quiz").classList.add("hidden"); $("result").classList.add("hidden");
  $("home").classList.remove("hidden");
  renderHome(); window.scrollTo(0,0);
}

/* ================= results ================= */
function finishQuiz(){
  S.done = true;
  stopSpeech();
  clearInterval(timerInt);
  if(S.mode==="exam"){ S.correct = S.qs.filter(q=>q.picked===q.answer).length; }
  const n = S.qs.length, pct = Math.round(S.correct/n*100);
  const secs = Math.floor((Date.now()-S.start)/1000);
  const time = String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0");

  // save stats
  const st = store.get();
  st.best = st.best||{}; st.log = st.log||{};
  if(pct > (st.best[S.subj] ?? -1)) st.best[S.subj] = pct;
  const lg = st.log[S.subj] || {a:0,c:0};
  lg.a += n; lg.c += S.correct; st.log[S.subj] = lg;
  st.maxStreak = Math.max(st.maxStreak||0, S.maxStreak);
  store.set(st);

  const verdict = pct===100 ? ["🏆 สมบูรณ์แบบ!","var(--warn)"]
    : pct>=80 ? ["🌟 เยี่ยมมาก!","var(--good)"]
    : pct>=60 ? ["👍 ผ่านเกณฑ์ ทำได้ดี","var(--brand2)"]
    : pct>=40 ? ["💪 เกือบแล้ว สู้ต่อ!","var(--warn)"]
    : ["📚 ทบทวนอีกนิด แล้วลองใหม่","var(--bad)"];

  const circ = 2*Math.PI*80;
  const wrong = S.qs.filter(q=>q.picked!==q.answer);
  $("quiz").classList.add("hidden");
  const r = $("result");
  r.classList.remove("hidden");
  r.innerHTML = `
  <div class="result">
    <div style="display:flex;justify-content:space-between"><button class="topbtn" onclick="quitToHome()">← หน้าหลัก</button>
    <button class="topbtn" onclick="retry()">🔄 ทำใหม่</button></div>
    <div class="ring">
      <svg width="190" height="190"><circle cx="95" cy="95" r="80" fill="none" stroke="var(--card2)" stroke-width="14"/>
      <circle cx="95" cy="95" r="80" fill="none" stroke="${pct>=60?"var(--good)":pct>=40?"var(--warn)":"var(--bad)"}" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" id="ringbar"/></svg>
      <div class="num"><b>${pct}%</b><span>${S.correct} / ${n} ข้อ</span></div>
    </div>
    <div class="verdict" style="color:${verdict[1]}">${verdict[0]}</div>
    <div class="rstats">
      <div class="stat"><b>⏱️ ${time}</b><span>เวลาที่ใช้</span></div>
      <div class="stat"><b>🔥 ${S.maxStreak}</b><span>ตอบถูกติดกันสูงสุด</span></div>
      <div class="stat"><b>${wrong.length}</b><span>ข้อที่ผิด/ข้าม</span></div>
    </div>
    ${wrong.length ? `<button class="btn primary" style="max-width:320px;margin:0 auto" onclick="$('rev').classList.toggle('hidden')">📖 ทบทวนข้อที่ผิด (${wrong.length})</button>` : ""}
    <div class="review ${S.mode==="exam"?"":"hidden"}" id="rev">
      ${wrong.map(q=>`<div class="rq">
        <div class="st no">✗ ${q.q}</div>
        <p>คำตอบของคุณ: ${q.picked!==null ? labelOf(q,q.picked)+". "+q.choices[q.picked] : "— ไม่ได้ตอบ"}</p>
        <p style="color:var(--good)">เฉลย: ${labelOf(q,q.answer)}. ${q.choices[q.answer]}</p>
        <div class="ex">💡 ${q.explanation || "ไม่มีคำอธิบายเพิ่มเติม"}</div>
      </div>`).join("")}
    </div>
  </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const bar = $("ringbar"); bar.style.transition = "stroke-dashoffset 1.2s ease";
    bar.style.strokeDashoffset = circ*(1-pct/100);
  }));
  if(pct>=80){ sndWin(); confetti(); } else if(pct>=60){ sndWin(); }
  window.scrollTo(0,0);
}
function retry(){ openSetupFromResult(); }
function openSetupFromResult(){ const id=S.subj; quitToHome(); openSetup(id); }

/* ================= fun bits ================= */
function comboPop(text){
  const el = document.createElement("div");
  el.className = "combo-pop"; el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}
function confetti(){
  const cv = $("confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#3563c9","#ffd93b","#e0533c","#2f9e44","#33415c"];
  const ps = Array.from({length:140},()=>({
    x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.5,
    w:6+Math.random()*6, h:8+Math.random()*8,
    vy:2+Math.random()*3, vx:(Math.random()-.5)*2, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.2,
    c:colors[Math.floor(Math.random()*colors.length)]
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if(++frames < 260) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* keyboard shortcuts: 1-5 answer, Enter/space next */
document.addEventListener("keydown", e=>{
  if(!S || $("quiz").classList.contains("hidden")) return;
  if(e.key>="1" && e.key<="5"){
    const pos = +e.key-1, btns = $("q-choices").children;
    if(btns[pos] && !btns[pos].disabled) btns[pos].click();
  } else if(e.key==="Enter" && !$("nextbtn").classList.contains("hidden")){ nextQ(); }
});

renderHome();
</script>
