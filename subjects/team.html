<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

<title>🤝 การทำงานเป็นทีม — ข้อสอบ V-NET 80 ข้อ</title>
<style>
:root{
  --paper:#f7f1e3; --card:#fffdf6; --card2:#fdf8ea;
  --ink:#33415c; --ink-soft:#5a6784; --muted:#93866f; --line:#d8cfae;
  --blue:#3563c9; --red:#e0533c; --marker:#ffd93b; --marker-soft:#fff3bf;
  --good:#2f9e44; --good-bg:#eaf7ec; --bad:#e03131; --bad-bg:#fdeeec;
  --shadow:4px 4px 0 rgba(51,65,92,.12);
  --radius:14px;
  --display:'Mali','Sukhumvit Set',sans-serif;
  --body:'Sarabun','Noto Sans Thai',-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--body);
  background:
    radial-gradient(circle at 15% 8%, rgba(255,217,59,.14) 0 180px, transparent 200px),
    radial-gradient(circle at 88% 30%, rgba(53,99,201,.07) 0 220px, transparent 260px),
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(51,65,92,.045) 31px 32px),
    var(--paper);
  color:var(--ink); min-height:100vh; line-height:1.65;
}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}

/* ===== Home ===== */
.hero{text-align:center;padding:30px 0 18px}
.hero h1{
  font-family:var(--display);font-size:2.2rem;font-weight:700;color:var(--ink);
  display:inline-block;position:relative;
  background:linear-gradient(transparent 58%, var(--marker) 58% 92%, transparent 92%);
  padding:0 .35em; transform:rotate(-1deg);
}
.hero p{color:var(--ink-soft);margin-top:10px;font-size:1.02rem}
.statbar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:22px 0 30px}
.stat{
  background:var(--card);border:2px solid var(--ink);border-radius:10px;
  padding:10px 18px;text-align:center;min-width:112px;box-shadow:var(--shadow);
}
.stat:nth-child(odd){transform:rotate(-.6deg)}
.stat:nth-child(even){transform:rotate(.5deg)}
.stat b{font-size:1.35rem;display:block;font-family:var(--display)}
.stat span{color:var(--muted);font-size:.78rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.subj{
  background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);
  padding:20px 18px 16px;text-align:left;transition:.15s;position:relative;box-shadow:var(--shadow);
}
.subj::before{
  content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:74px;height:20px;background:rgba(255,217,59,.55);border:1px solid rgba(51,65,92,.12);
  border-radius:2px;
}
.subj:nth-child(3n+1){transform:rotate(-.7deg)}
.subj:nth-child(3n+2){transform:rotate(.5deg)}
.subj:nth-child(3n){transform:rotate(-.3deg)}
.subj:hover{transform:translateY(-4px) rotate(0deg);box-shadow:6px 8px 0 rgba(51,65,92,.16)}
.subj .ic{font-size:1.9rem}
.subj h3{font-family:var(--display);font-size:1.05rem;margin:8px 0 2px;font-weight:600}
.subj .sub{color:var(--muted);font-size:.8rem}
.subj .meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:.82rem;color:var(--ink-soft)}
.badge{background:var(--marker-soft);border:1.5px solid var(--ink);padding:2px 12px;border-radius:999px;font-weight:600}
.best{color:var(--red);font-weight:700}
.subj.mix{background:var(--marker-soft)}
.subj.mix::before{background:rgba(53,99,201,.25)}

/* ===== Setup modal ===== */
.overlay{position:fixed;inset:0;background:rgba(51,65,92,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{
  background:var(--card);border:2.5px solid var(--ink);border-radius:18px;max-width:440px;width:100%;
  padding:26px 24px;box-shadow:8px 10px 0 rgba(51,65,92,.25);
}
.modal h2{font-family:var(--display);font-size:1.25rem;margin-bottom:2px}
.modal .sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.optlabel{font-size:.82rem;color:var(--muted);margin:16px 0 7px;font-weight:700;letter-spacing:.02em}
.optrow{display:flex;gap:8px;flex-wrap:wrap}
.opt{
  background:var(--card2);border:2px solid var(--line);border-radius:10px;
  padding:8px 16px;font-size:.9rem;font-weight:600;color:var(--ink-soft);
}
.opt.sel{background:var(--marker);border-color:var(--ink);color:var(--ink);box-shadow:2px 2px 0 rgba(51,65,92,.25)}
.toggle{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.92rem;color:var(--ink-soft);cursor:pointer;user-select:none}
.toggle .box{
  width:22px;height:22px;border-radius:6px;border:2px solid var(--ink);background:var(--card);
  display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;
}
.toggle.on{color:var(--ink)}
.toggle.on .box{background:var(--good);border-color:var(--good);color:#fff}
.mrow{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;padding:12px;border-radius:12px;font-size:1.02rem;font-weight:700;font-family:var(--display)}
.btn.primary{background:var(--blue);color:#fff;border:2px solid var(--ink);box-shadow:var(--shadow)}
.btn.primary:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(51,65,92,.2)}
.btn.ghost{background:var(--card);border:2px solid var(--line);color:var(--ink-soft)}

/* ===== Quiz ===== */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.qtop .left{display:flex;gap:8px;align-items:center}
.pill{
  background:var(--card);border:2px solid var(--ink);border-radius:999px;
  padding:4px 14px;font-size:.85rem;font-weight:700;box-shadow:2px 2px 0 rgba(51,65,92,.12);
}
.pill.flame{background:var(--marker-soft);color:var(--red)}
.pill.timer{min-width:86px;text-align:center;font-variant-numeric:tabular-nums}
.progress{height:10px;background:var(--card);border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin-bottom:20px}
.progress i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--blue) 0 10px,#4f7ad6 10px 20px);transition:width .3s}
.qcard{
  background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);
  padding:22px 20px;box-shadow:var(--shadow);position:relative;
}
.qsec{color:var(--blue);font-size:.78rem;margin-bottom:6px;font-weight:700;letter-spacing:.02em}
.qtext{font-size:1.1rem;font-weight:700;white-space:pre-wrap;line-height:1.7}
.choices{margin-top:18px;display:flex;flex-direction:column;gap:11px}
.choice{
  display:flex;gap:12px;align-items:flex-start;background:var(--card2);
  border:2px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;
  font-size:.98rem;transition:.12s;width:100%;color:var(--ink);
}
.choice:not(:disabled):hover{border-color:var(--ink);background:var(--marker-soft);transform:translateX(3px)}
.choice .lb{
  flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--card);
  border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.85rem;font-family:var(--display);
}
.choice.correct{border-color:var(--good);background:var(--good-bg)}
.choice.correct .lb{background:var(--good);color:#fff;border-color:var(--good)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice.wrong .lb{background:var(--bad);color:#fff;border-color:var(--bad)}
.choice.picked{border-color:var(--blue);background:#eef3fd;box-shadow:2px 2px 0 rgba(53,99,201,.25)}
.choice.dim{opacity:.3;pointer-events:none;text-decoration:line-through}
.expl{margin-top:18px;border-radius:4px 14px 14px 14px;padding:14px 16px;border:2px solid;animation:pop .25s;position:relative}
.expl.good{background:var(--good-bg);border-color:var(--good)}
.expl.bad{background:var(--bad-bg);border-color:var(--bad)}
.expl h4{font-family:var(--display);font-size:1rem;margin-bottom:4px}
.expl p{font-size:.93rem;color:var(--ink)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.qactions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.lifeline{
  background:var(--card);border:2px dashed var(--red);color:var(--red);
  border-radius:12px;padding:10px 16px;font-weight:800;
}
.lifeline:disabled{opacity:.35;border-color:var(--line);color:var(--muted)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.combo-pop{
  position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);
  font-family:var(--display);font-size:2.2rem;font-weight:800;color:var(--red);
  text-shadow:2px 2px 0 var(--marker);pointer-events:none;z-index:99;animation:rise 1s forwards;
}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6) rotate(-4deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(2deg)}100%{opacity:0;transform:translate(-50%,-120%) scale(1) rotate(-2deg)}}

/* palette (exam mode) */
.palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.pal{width:34px;height:34px;border-radius:9px;background:var(--card);border:2px solid var(--line);font-size:.8rem;font-weight:700}
.pal.done{background:var(--blue);border-color:var(--ink);color:#fff}
.pal.cur{outline:3px solid var(--marker)}

/* ===== Results ===== */
.result{text-align:center;padding-top:10px}
.ring{width:190px;height:190px;margin:16px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-family:var(--display);font-size:2.5rem}
.ring .num span{color:var(--muted);font-size:.85rem}
.verdict{font-family:var(--display);font-size:1.35rem;font-weight:800;margin:6px 0 16px;transform:rotate(-1deg)}
.rstats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.review{margin-top:28px;text-align:left}
.review h3{font-family:var(--display);margin-bottom:12px}
.rq{background:var(--card);border:2px solid var(--line);border-left:5px solid var(--bad);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.rq .st{font-weight:700}
.rq .st.ok{color:var(--good)} .rq .st.no{color:var(--bad)}
.rq p{font-size:.9rem;margin-top:4px}
.rq .ex{color:var(--ink-soft);font-size:.87rem;margin-top:8px;border-top:2px dashed var(--line);padding-top:8px}
.topbtn{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:7px 14px;font-size:.85rem;font-weight:700;box-shadow:2px 2px 0 rgba(51,65,92,.12)}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.footer-note{text-align:center;color:var(--muted);font-size:.78rem;margin-top:44px}

/* ===== audio (listening) ===== */
.audio-box{margin-top:16px;background:var(--card2);border:2px dashed var(--blue);border-radius:12px;padding:14px}
.audio-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.playbtn{
  background:var(--blue);color:#fff;font-weight:800;font-family:var(--display);
  border:2px solid var(--ink);border-radius:99px;padding:10px 22px;font-size:1rem;
  display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow);
}
.playbtn.playing{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(53,99,201,.45)}50%{box-shadow:0 0 0 12px rgba(53,99,201,0)}}
.scriptbtn{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:9px 16px;font-size:.85rem;color:var(--ink-soft);font-weight:600}
.script{margin-top:12px;border-left:3px solid var(--blue);padding:6px 12px;font-style:italic;color:var(--ink-soft);font-size:.95rem}
.audio-hint{color:var(--muted);font-size:.78rem;margin-top:8px}

@media(max-width:520px){ .hero h1{font-size:1.6rem} .qtext{font-size:1.02rem} }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ HOME ============ -->
  <div id="home">
    <div class="hero">
      <h1>🤝 การทำงานเป็นทีม</h1>
      <p>Teamwork • รวมชุด 1+2+เสริม • 80 ข้อ พร้อมเฉลยและคำอธิบายทุกข้อ</p>
    </div>
    <div class="statbar">
      <div class="stat"><b id="st-total">540</b><span>ข้อสอบทั้งหมด</span></div>
      <div class="stat"><b id="st-answered">0</b><span>ทำไปแล้ว (ครั้ง)</span></div>
      <div class="stat"><b id="st-acc">—</b><span>ความแม่นยำรวม</span></div>
      <div class="stat"><b id="st-streak">0</b><span>สถิติตอบถูกติดกัน</span></div>
    </div>
    <div class="grid" id="subjects"></div>
    <p class="footer-note">แตะวิชาเพื่อเริ่ม • ผลคะแนนบันทึกไว้ในเครื่องอัตโนมัติ</p>
  </div>

  <!-- ============ QUIZ ============ -->
  <div id="quiz" class="hidden">
    <div class="qtop">
      <div class="left">
        <button class="topbtn" onclick="confirmExit()">← ออก</button>
        <span class="pill" id="q-count">1/30</span>
        <span class="pill" id="q-score">✅ 0</span>
      </div>
      <div class="left">
        <span class="pill flame" id="q-streak">🔥 0</span>
        <span class="pill timer" id="q-timer">00:00</span>
        <button class="topbtn" id="mutebtn" onclick="toggleMute()">🔊</button>
      </div>
    </div>
    <div class="progress"><i id="q-progress" style="width:0%"></i></div>
    <div class="qcard" id="qcard">
      <div class="qsec" id="q-section"></div>
      <div class="qtext" id="q-text"></div>
      <div id="q-audio"></div>
      <div class="choices" id="q-choices"></div>
      <div id="q-expl"></div>
      <div class="qactions">
        <button class="lifeline" id="fifty" onclick="useFifty()">✂️ 50:50 <span id="fifty-n">×3</span></button>
        <button class="btn primary hidden" id="nextbtn" onclick="nextQ()">ข้อถัดไป →</button>
        <button class="btn ghost hidden" id="skipbtn" onclick="nextQ()">ข้าม →</button>
        <button class="btn primary hidden" id="submitbtn" onclick="finishQuiz()">ส่งคำตอบ ✅</button>
      </div>
    </div>
    <div class="palette hidden" id="palette"></div>
  </div>

  <!-- ============ RESULT ============ -->
  <div id="result" class="hidden"></div>
</div>

<div id="modal-root"></div>

<script>window.AUDIO_BASE='../audio/';const EXAM_DATA = {"subjects": [{"id": "team", "icon": "🤝", "title": "การทำงานเป็นทีม", "subtitle": "Teamwork • รวมชุด 1+2+เสริม", "labels": ["ก", "ข", "ค", "ง", "จ"], "questions": [{"n": 1, "q": "หัวใจสำคัญที่สุดที่ทำให้การทำงานเป็นทีมประสบความสำเร็จคืออะไร?", "choices": ["การมีผู้นำที่มีอำนาจตัดสินใจอย่างเด็ดขาด", "การมีเป้าหมายร่วมกันที่ชัดเจนของสมาชิกทุกคน", "การรวมสมาชิกที่มีความสามารถโดดเด่นไว้ด้วยกัน", "การแบ่งงานให้แต่ละคนรับผิดชอบอย่างอิสระ", "การมีทรัพยากรและงบประมาณที่เพียงพอ"], "answer": 1, "explanation": "เป้าหมายร่วมที่ชัดเจนทำให้สมาชิกทุกคนมุ่งไปในทิศทางเดียวกัน จึงเป็นหัวใจของการทำงานเป็นทีม ส่วนผู้นำที่เด็ดขาด การรวมคนเก่ง หรือทรัพยากรที่เพียงพอ เป็นเพียงปัจจัยเสริม ไม่ใช่หัวใจหลัก", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 2, "q": "ลักษณะของ 'ทีมงาน' (Team) ที่แตกต่างจาก 'กลุ่มงาน' (Group) คือข้อใด?", "choices": ["สมาชิกในทีมมีการทำงานที่พึ่งพาอาศัยกัน", "สมาชิกในทีมมีโครงสร้างการบังคับบัญชาที่เป็นทางการกว่า", "สมาชิกในทีมรับผิดชอบเฉพาะผลงานส่วนของตนเป็นหลัก", "สมาชิกในทีมต้องรายงานต่อหัวหน้าเพียงคนเดียวเท่านั้น", "สมาชิกในทีมถูกประเมินจากผลงานรายบุคคลเป็นสำคัญ"], "answer": 0, "explanation": "จุดต่างสำคัญของ 'ทีม' คือการทำงานแบบพึ่งพาอาศัยกัน (interdependence) และมีเป้าหมายร่วม ส่วนการรับผิดชอบเฉพาะส่วนตนหรือการวัดผลรายบุคคลเป็นลักษณะของ 'กลุ่ม' ที่ต่างคนต่างทำงาน", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 3, "q": "ในการเริ่มต้นทำงานเป็นทีม สิ่งแรกที่ควรทำคืออะไร?", "choices": ["การจัดหาทรัพยากรและอุปกรณ์ให้พร้อมก่อนเริ่มงาน", "การกำหนดงบประมาณและระยะเวลาของโครงการโดยละเอียด", "การสร้างความเข้าใจในเป้าหมายและบทบาทของแต่ละคน", "การลงมือทำส่วนที่ตนถนัดทันทีเพื่อให้งานคืบหน้าเร็วที่สุด", "การวางระบบติดตามความคืบหน้าและรายงานผลการดำเนินงาน"], "answer": 2, "explanation": "การเริ่มงานควรให้ทุกคนเข้าใจเป้าหมายร่วมและรู้บทบาทหน้าที่ของตนก่อน จึงจะทำงานประสานกันได้ การรีบลงมือทำหรือจัดการทรัพยากรก่อนโดยยังไม่เข้าใจทิศทางมักทำให้งานซ้ำซ้อนผิดพลาด", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 4, "q": "'ผู้นำทีม' (Team Leader) ที่ดีควรมีบทบาทหลักอย่างไร?", "choices": ["ลงมือทำงานชิ้นสำคัญด้วยตนเองเพื่อให้มั่นใจในคุณภาพของงาน", "ตัดสินใจอย่างรวดเร็วเด็ดขาดโดยไม่ต้องรอฟังมติของทีม", "สนับสนุนและประสานงานเพื่อให้ทีมบรรลุเป้าหมาย", "ควบคุมตรวจสอบการทำงานของสมาชิกอย่างใกล้ชิดทุกขั้นตอน", "สื่อสารผ่านสายการบังคับบัญชาอย่างเป็นทางการเท่านั้น"], "answer": 2, "explanation": "ผู้นำที่ดีทำหน้าที่อำนวยความสะดวก สนับสนุน และประสานงานให้ทีมเดินไปสู่เป้าหมาย ไม่ใช่ลงมือทำแทน ควบคุมทุกขั้นตอน หรือตัดสินใจฝ่ายเดียว", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 5, "q": "หากท่านได้รับมอบหมายหน้าที่ที่ตนเองไม่ถนัดในทีม ท่านควรทำอย่างไร?", "choices": ["แจ้งหัวหน้าเพื่อขอเปลี่ยนไปทำหน้าที่ที่ตนถนัดกว่าทันที", "ขอสลับหน้าที่กับเพื่อนที่ถนัดกว่าเพื่อประสิทธิภาพสูงสุดของทีม", "ยอมรับและพยายามเรียนรู้ พร้อมขอคำแนะนำจากเพื่อนร่วมทีม", "ทำเท่าที่ความสามารถของตนมีอยู่โดยไม่ปรึกษาใครเพื่อไม่รบกวนผู้อื่น", "มอบหมายงานส่วนนั้นต่อให้สมาชิกที่มีภาระงานน้อยกว่า"], "answer": 2, "explanation": "เมื่อได้งานที่ไม่ถนัด ควรเปิดใจเรียนรู้และขอคำแนะนำจากเพื่อนร่วมทีม เป็นทั้งการพัฒนาตนเองและการรักษาความรับผิดชอบต่อทีม ส่วนการรีบขอเปลี่ยนหรือสลับหน้าที่คือการเลี่ยงความรับผิดชอบที่ได้รับมอบหมาย", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 6, "q": "'ผู้ตามที่ดี' (Effective Follower) ในทีมมีลักษณะอย่างไร?", "choices": ["ปฏิบัติตามคำสั่งของหัวหน้าอย่างเคร่งครัดโดยไม่โต้แย้งใดๆ", "มีความคิดริเริ่มและสนับสนุนงานของทีมอย่างจริงจัง", "ทำงานที่ได้รับมอบหมายให้สำเร็จโดยไม่ก้าวก่ายงานส่วนอื่น", "สนับสนุนความเห็นของหัวหน้าในที่ประชุมทุกครั้งเพื่อความสามัคคี", "สงวนความคิดเห็นไว้จนกว่าหัวหน้าจะสอบถามโดยตรง"], "answer": 1, "explanation": "ผู้ตามที่ดีไม่ได้เชื่อฟังอย่างเดียว แต่มีความคิดริเริ่ม กล้าเสนอความเห็น และสนับสนุนงานของทีมอย่างจริงจัง การทำตามคำสั่งหรือเห็นด้วยทุกเรื่องเป็นผู้ตามแบบเฉื่อยชา", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 7, "q": "การแบ่งงานตามความถนัดของสมาชิก (Put the right man on the right job) ส่งผลดีต่อทีมอย่างไร?", "choices": ["ทำให้งานเสร็จเร็วขึ้นและได้ผลงานที่มีคุณภาพ", "ทำให้สมาชิกไม่ต้องเรียนรู้งานนอกเหนือความถนัดของตน", "ทำให้หัวหน้าลดภาระในการควบคุมงานลงได้มาก", "ทำให้การประเมินผลงานรายบุคคลทำได้ง่ายขึ้น", "ทำให้ใช้จำนวนสมาชิกในทีมน้อยลงกว่าเดิม"], "answer": 0, "explanation": "การมอบงานให้ตรงกับความถนัดช่วยให้สมาชิกใช้ศักยภาพได้เต็มที่ งานจึงมีคุณภาพและเสร็จเร็วขึ้น ซึ่งเป็นผลดีหลักต่อทีม ไม่ใช่เพียงความสะดวกของหัวหน้าหรือการประเมินผล", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 8, "q": "เมื่อสมาชิกในทีมคนหนึ่งงานล้นมือ เพื่อนร่วมทีมควรปฏิบัติอย่างไร?", "choices": ["ทำงานส่วนของตนให้ดีที่สุดเพื่อไม่สร้างภาระเพิ่มให้ทีม", "รอให้สมาชิกคนนั้นร้องขอความช่วยเหลือก่อนเพื่อไม่เป็นการก้าวก่าย", "อาสาเข้าช่วยเหลือเท่าที่ทำได้เพื่อประโยชน์ของทีม", "แจ้งหัวหน้าให้พิจารณากระจายงานใหม่ตามสายการบังคับบัญชา", "เสนอให้เลื่อนกำหนดส่งงานออกไปเพื่อลดความกดดันของทีม"], "answer": 2, "explanation": "น้ำใจและการอาสาช่วยเหลือกันเท่าที่ทำได้โดยไม่ต้องรอให้ร้องขอ เป็นคุณลักษณะสำคัญของสมาชิกทีมที่ดี เพราะเป้าหมายส่วนรวมสำคัญกว่าขอบเขตงานส่วนตัว", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 9, "q": "'ความรับผิดชอบร่วมกัน' (Mutual Accountability) หมายถึงอะไร?", "choices": ["ถ้างานผิดพลาด ทุกคนต้องร่วมกันรับผิดชอบและแก้ไข", "ผู้รับผิดชอบงานส่วนนั้นโดยตรงเป็นผู้รับผิดและแก้ไขด้วยตนเอง", "หัวหน้าทีมเป็นผู้รับผิดชอบสูงสุดแทนสมาชิกทุกคน", "การแบ่งความรับผิดชอบตามสัดส่วนงานที่แต่ละคนได้รับ", "การร่วมกันรับเฉพาะความดีความชอบจากผลงานของทีม"], "answer": 0, "explanation": "Mutual Accountability คือการที่สมาชิกทุกคนรับผิดชอบต่อผลงานของทีมร่วมกัน ทั้งความสำเร็จและความผิดพลาด ไม่ใช่แบ่งรับตามสัดส่วนหรือปล่อยให้ผู้ทำส่วนนั้นรับคนเดียว", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 10, "q": "ข้อใดคือลักษณะของทีมที่ไม่มีประสิทธิภาพ?", "choices": ["มีการถกเถียงเรื่องแนวทางการทำงานกันบ่อยครั้ง", "มีเป้าหมายการทำงานที่คลุมเครือและไม่ชัดเจน", "สมาชิกตรวจสอบความถูกต้องของงานกันและกันอยู่เสมอ", "มีการปรับเปลี่ยนแผนงานระหว่างทางเมื่อสถานการณ์เปลี่ยน", "สมาชิกกล้าทักท้วงความเห็นของหัวหน้าในที่ประชุม"], "answer": 1, "explanation": "เป้าหมายที่คลุมเครือทำให้สมาชิกทำงานคนละทิศทางและวัดผลไม่ได้ จึงเป็นลักษณะของทีมที่ไร้ประสิทธิภาพ ส่วนการถกเถียง การตรวจสอบกัน การปรับแผน และการกล้าทักท้วง เป็นพฤติกรรมปกติของทีมที่มีประสิทธิภาพ", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 11, "q": "'Synergy' หรือ การรวมพลัง มีความหมายสอดคล้องกับข้อใด?", "choices": ["1 + 1 = 2", "1 + 1 < 2", "1 + 1 > 2", "1 - 1 = 0", "2 - 1 = 1"], "answer": 2, "explanation": "Synergy คือพลังของทีมที่รวมกันแล้วได้ผลลัพธ์ 'มากกว่า' ผลบวกของแต่ละคน จึงแทนด้วย 1 + 1 > 2", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 12, "q": "การสร้าง 'ทีมวิญญาณ' (Team Spirit) ควรทำอย่างไร?", "choices": ["การจัดกิจกรรมสร้างความสัมพันธ์ (Team Building)", "การให้รางวัลพิเศษแก่สมาชิกที่ผลงานโดดเด่นที่สุดในแต่ละเดือน", "การกำหนดกฎระเบียบการทำงานร่วมกันอย่างเข้มงวด", "การแบ่งขอบเขตงานของแต่ละคนให้ชัดเจนไม่ทับซ้อนกัน", "การประกาศเปรียบเทียบผลงานของสมาชิกเป็นรายบุคคล"], "answer": 0, "explanation": "กิจกรรมสร้างความสัมพันธ์ (Team Building) ช่วยสร้างความผูกพัน ความไว้วางใจ และจิตวิญญาณความเป็นทีม ส่วนการให้รางวัลหรือเปรียบเทียบรายบุคคลกระตุ้นการแข่งขันมากกว่าความเป็นน้ำหนึ่งใจเดียว", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 13, "q": "ในการทำงานทีมเชิงรุก (Proactive Team) สมาชิกควรทำสิ่งใด?", "choices": ["แก้ไขปัญหาเฉพาะหน้าอย่างรวดเร็วทันทีที่ปัญหาเกิดขึ้น", "คาดการณ์ปัญหาที่อาจเกิดขึ้นและเตรียมทางหนีทีไล่", "ปฏิบัติตามแผนงานเดิมอย่างเคร่งครัดเพื่อป้องกันความผิดพลาด", "รอข้อมูลให้ครบถ้วนสมบูรณ์ก่อนจึงตัดสินใจดำเนินการ", "รายงานปัญหาให้หัวหน้าทราบทันทีทุกครั้งที่ตรวจพบ"], "answer": 1, "explanation": "ทีมเชิงรุกจะวางแผนล่วงหน้า คาดการณ์ปัญหาและเตรียมแนวทางรับมือไว้ก่อน ส่วนการแก้ปัญหาเร็วหลังปัญหาเกิดหรือการรอรายงาน เป็นการทำงานเชิงรับ (Reactive)", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 14, "q": "ทักษะการสื่อสารที่สำคัญที่สุดในการทำงานเป็นทีมคืออะไร?", "choices": ["การพูดนำเสนอที่ชัดเจนและน่าเชื่อถือ", "การเลือกช่องทางสื่อสารให้เหมาะกับแต่ละสถานการณ์", "การฟังอย่างตั้งใจ (Active Listening)", "การเขียนสรุปประเด็นให้กระชับครบถ้วน", "การตอบกลับข้อความอย่างรวดเร็วทันเหตุการณ์"], "answer": 2, "explanation": "การฟังอย่างตั้งใจ (Active Listening) เป็นพื้นฐานที่ทำให้เข้าใจกันตรงกันและลดความผิดพลาดในการทำงานร่วมกัน ทักษะการพูด การเขียน หรือการเลือกช่องทาง เป็นส่วนเสริมที่ต้องตั้งอยู่บนการฟังที่ดีก่อน", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 15, "q": "เมื่อเพื่อนร่วมทีมเสนอความคิดเห็นที่เราไม่เห็นด้วย เราควรทำอย่างไร?", "choices": ["ชี้แจงข้อโต้แย้งของเราทันทีเพื่อไม่ให้ที่ประชุมเข้าใจคลาดเคลื่อน", "สงวนท่าทีไว้แล้วนำไปหารือกับหัวหน้าเป็นการส่วนตัวภายหลัง", "ฟังให้จบ พิจารณาข้อดีข้อเสีย และแลกเปลี่ยนอย่างสุภาพ", "ยอมรับความเห็นนั้นเพื่อรักษาบรรยากาศที่ดีของการประชุม", "เสนอให้ที่ประชุมลงมติทันทีเพื่อยุติความเห็นที่แตกต่าง"], "answer": 2, "explanation": "การเคารพความเห็นต่างด้วยการฟังจนจบ ชั่งน้ำหนักข้อดีข้อเสีย แล้วแลกเปลี่ยนอย่างสุภาพ เป็นการสื่อสารเชิงสร้างสรรค์ ส่วนการรีบโต้แย้งหรือยอมตามเพื่อรักษาบรรยากาศ ทำให้ทีมเสียโอกาสพิจารณาอย่างรอบด้าน", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 16, "q": "ข้อใดคืออุปสรรคสำคัญของการรับฟังความคิดเห็นในทีม?", "choices": ["การมีอคติ (Bias) ต่อตัวผู้พูดหรือประเด็นที่พูด", "การจดบันทึกประเด็นสำคัญระหว่างการรับฟัง", "การทวนคำพูดของผู้พูดเพื่อตรวจสอบความเข้าใจให้ตรงกัน", "การตั้งคำถามกลับทันทีที่ไม่เข้าใจในประเด็นใด", "การสังเกตภาษากายของผู้พูดประกอบการฟัง"], "answer": 0, "explanation": "อคติต่อผู้พูดทำให้เราปิดกั้นและตีความสารอย่างบิดเบือน จึงเป็นอุปสรรคของการรับฟัง ส่วนการจด การทวนคำ การถาม และการสังเกตภาษากาย ล้วนเป็นพฤติกรรมการฟังที่ดี", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 17, "q": "การสื่อสารแบบสองทาง (Two-way Communication) ส่งผลดีต่อทีมอย่างไร?", "choices": ["ทำให้เกิดความเข้าใจตรงกันและลดความผิดพลาด", "ทำให้การตัดสินใจรวดเร็วขึ้นเพราะไม่ต้องรอการตอบกลับ", "ทำให้หัวหน้าควบคุมทิศทางของการประชุมได้ง่ายขึ้น", "ทำให้ลดปริมาณเอกสารที่ใช้ในการสื่อสารภายในลง", "ทำให้สมาชิกทุกคนได้รับข้อมูลพร้อมกันในครั้งเดียว"], "answer": 0, "explanation": "การสื่อสารสองทางเปิดโอกาสให้ผู้รับสารป้อนกลับและซักถาม จึงช่วยให้เข้าใจตรงกันและลดความผิดพลาด ส่วนความรวดเร็วโดยไม่ต้องรอการตอบกลับเป็นลักษณะของการสื่อสารทางเดียว", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 18, "q": "ท่าทางใดที่แสดงว่าเรา 'ตั้งใจฟัง' เพื่อนร่วมทีม?", "choices": ["จดบันทึกอย่างละเอียดตลอดเวลาโดยไม่ละสายตาจากสมุด", "นิ่งเงียบไม่แสดงปฏิกิริยาใดๆ เพื่อไม่รบกวนสมาธิผู้พูด", "สบตาผู้พูดและพยักหน้ารับตามจังหวะอย่างเหมาะสม", "กล่าวตอบรับทุกประโยคเพื่อแสดงว่ากำลังติดตามฟังอยู่", "รีบสรุปความเห็นของผู้พูดก่อนที่เขาจะพูดจบ"], "answer": 2, "explanation": "การสบตาและพยักหน้าตามจังหวะเป็นภาษากายเชิงบวกที่แสดงว่าเรากำลังตั้งใจฟัง ส่วนการก้มจดตลอดหรือนิ่งเฉยไม่ตอบสนอง ทำให้ผู้พูดไม่รู้ว่าเรากำลังรับฟังอยู่จริง", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 19, "q": "'Empathy' หรือ ความเห็นอกเห็นใจ สำคัญอย่างไรในการสื่อสารในทีม?", "choices": ["ช่วยให้เราเข้าใจความรู้สึกและมุมมองของผู้อื่น", "ช่วยให้เราคล้อยตามความเห็นของผู้อื่นได้ง่ายขึ้น", "ช่วยให้เราหลีกเลี่ยงความขัดแย้งได้ในทุกสถานการณ์", "ช่วยให้เราโน้มน้าวผู้อื่นให้ยอมทำตามแนวทางของเราได้ง่ายขึ้น", "ช่วยให้เราประเมินผลงานของเพื่อนร่วมทีมได้แม่นยำขึ้น"], "answer": 0, "explanation": "Empathy ช่วยให้เราเข้าใจความรู้สึกและมุมมองของเพื่อนร่วมทีม จึงสื่อสารและทำงานร่วมกันได้ราบรื่นขึ้น ทั้งนี้การเข้าใจไม่ใช่การคล้อยตาม และไม่ใช่เครื่องมือไว้โน้มน้าวผู้อื่น", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 20, "q": "เมื่อมีการประชุมทีม แต่สมาชิกส่วนใหญ่เงียบ ไม่แสดงความเห็น ผู้นำควรทำอย่างไร?", "choices": ["เสนอแนวทางของตนก่อนแล้วให้สมาชิกยกมือรับรองทีละประเด็น", "มอบหมายให้สมาชิกส่งความเห็นเป็นลายลักษณ์อักษรหลังการประชุม", "ใช้คำถามปลายเปิดเพื่อกระตุ้นให้สมาชิกแชร์ไอเดีย", "สรุปประเด็นด้วยตนเองเพื่อประหยัดเวลาของที่ประชุม", "เรียกชื่อสมาชิกให้ตอบทีละคนตามลำดับอาวุโส"], "answer": 2, "explanation": "คำถามปลายเปิดช่วยเปิดพื้นที่และกระตุ้นให้สมาชิกที่เงียบกล้าแสดงความคิดเห็นโดยไม่กดดัน ส่วนการให้ยกมือรับรองหรือเรียกตอบตามลำ
