<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤝 การทำงานเป็นทีม — ข้อสอบ V-NET 80 ข้อ</title>
<style>
:root{
  --bg:#0f1220; --bg2:#171b30; --card:#1e2340; --card2:#252b4d;
  --text:#eef0ff; --muted:#9aa3c7; --line:#323a63;
  --brand:#7c6cff; --brand2:#4ecdc4; --good:#3ddc84; --bad:#ff5d73; --warn:#ffc94d;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Noto Sans Thai","Segoe UI",sans-serif;
  background:radial-gradient(1200px 800px at 80% -10%,#2a2f55 0%,var(--bg) 55%);
  color:var(--text); min-height:100vh; line-height:1.6;
}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}

/* ===== Home ===== */
.hero{text-align:center;padding:28px 0 20px}
.hero h1{font-size:2rem;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);margin-top:6px}
.statbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 18px;text-align:center;min-width:110px}
.stat b{font-size:1.3rem;display:block}
.stat span{color:var(--muted);font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.subj{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:left;transition:.18s;position:relative;overflow:hidden}
.subj:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 24px rgba(124,108,255,.25)}
.subj .ic{font-size:1.9rem}
.subj h3{font-size:1.02rem;margin:8px 0 2px}
.subj .sub{color:var(--muted);font-size:.8rem}
.subj .meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:.82rem;color:var(--muted)}
.badge{background:var(--bg2);border:1px solid var(--line);padding:2px 10px;border-radius:999px}
.best{color:var(--warn)}
.subj.mix{background:linear-gradient(135deg,#3b2f7a,#1c5f5a);border-color:#6a5cff}

/* ===== Setup modal ===== */
.overlay{position:fixed;inset:0;background:rgba(8,10,20,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:20px;max-width:440px;width:100%;padding:24px}
.modal h2{font-size:1.2rem;margin-bottom:2px}
.modal .sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.optlabel{font-size:.85rem;color:var(--muted);margin:14px 0 6px}
.optrow{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:.9rem}
.opt.sel{background:var(--brand);border-color:var(--brand);font-weight:700}
.toggle{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.9rem;color:var(--muted);cursor:pointer;user-select:none}
.toggle .box{width:20px;height:20px;border-radius:6px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.toggle.on .box{background:var(--good);border-color:var(--good);color:#08331c}
.mrow{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:12px;border-radius:12px;font-size:1rem;font-weight:700}
.btn.primary{background:linear-gradient(90deg,var(--brand),#9b8cff);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line)}

/* ===== Quiz ===== */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qtop .left{display:flex;gap:8px;align-items:center}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.85rem}
.pill.flame{border-color:#ff8c42;color:#ffb347}
.pill.timer{min-width:84px;text-align:center}
.progress{height:8px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.qsec{color:var(--brand2);font-size:.78rem;margin-bottom:6px}
.qtext{font-size:1.08rem;font-weight:600;white-space:pre-wrap}
.choices{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-size:.97rem;transition:.15s;width:100%}
.choice:not(:disabled):hover{border-color:var(--brand)}
.choice .lb{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.choice.correct{border-color:var(--good);background:rgba(61,220,132,.12)}
.choice.correct .lb{background:var(--good);color:#06301a;border-color:var(--good)}
.choice.wrong{border-color:var(--bad);background:rgba(255,93,115,.12)}
.choice.wrong .lb{background:var(--bad);color:#fff;border-color:var(--bad)}
.choice.picked{border-color:var(--brand);background:rgba(124,108,255,.14)}
.choice.dim{opacity:.28;pointer-events:none}
.expl{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid;animation:pop .25s}
.expl.good{background:rgba(61,220,132,.1);border-color:var(--good)}
.expl.bad{background:rgba(255,93,115,.1);border-color:var(--bad)}
.expl h4{font-size:.95rem;margin-bottom:4px}
.expl p{font-size:.92rem;color:var(--text)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.qactions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.lifeline{background:var(--card);border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:10px 16px;font-weight:700}
.lifeline:disabled{opacity:.35;border-color:var(--line);color:var(--muted)}
.shake{animation:shake .35s}
.audio-box{margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
.audio-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.playbtn{background:linear-gradient(90deg,#2e7d6b,var(--brand2));color:#04241f;font-weight:800;border-radius:99px;padding:10px 22px;font-size:1rem;display:inline-flex;align-items:center;gap:8px}
.playbtn.playing{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(78,205,196,.5)}50%{box-shadow:0 0 0 10px rgba(78,205,196,0)}}
.scriptbtn{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-size:.85rem;color:var(--muted)}
.script{margin-top:12px;border-left:3px solid var(--brand2);padding:6px 12px;font-style:italic;color:var(--muted);font-size:.95rem}
.audio-hint{color:var(--muted);font-size:.78rem;margin-top:8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.combo-pop{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);font-size:2.2rem;font-weight:800;pointer-events:none;z-index:99;animation:rise 1s forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}

/* palette (exam mode) */
.palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.pal{width:34px;height:34px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-size:.8rem}
.pal.done{background:var(--brand);border-color:var(--brand);font-weight:700}
.pal.cur{outline:2px solid var(--brand2)}

/* ===== Results ===== */
.result{text-align:center;padding-top:10px}
.ring{width:190px;height:190px;margin:14px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:2.4rem}
.ring .num span{color:var(--muted);font-size:.85rem}
.verdict{font-size:1.3rem;font-weight:800;margin:4px 0 14px}
.rstats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.review{margin-top:26px;text-align:left}
.review h3{margin-bottom:12px}
.rq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.rq .st{font-weight:700}
.rq .st.ok{color:var(--good)} .rq .st.no{color:var(--bad)}
.rq p{font-size:.9rem;margin-top:4px}
.rq .ex{color:var(--muted);font-size:.86rem;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.topbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.85rem}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:98}
.footer-note{text-align:center;color:var(--muted);font-size:.75rem;margin-top:40px}
@media(max-width:520px){ .hero h1{font-size:1.5rem} .qtext{font-size:1rem} }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ HOME ============ -->
  <div id="home">
    <div class="hero">
      <h1>🤝 การทำงานเป็นทีม</h1>
      <p>Teamwork • รวมชุด 1+2+เสริม • 80 ข้อ พร้อมเฉลยและคำอธิบายทุกข้อ</p>
    </div>
    <div class="statbar">
      <div class="stat"><b id="st-total">540</b><span>ข้อสอบทั้งหมด</span></div>
      <div class="stat"><b id="st-answered">0</b><span>ทำไปแล้ว (ครั้ง)</span></div>
      <div class="stat"><b id="st-acc">—</b><span>ความแม่นยำรวม</span></div>
      <div class="stat"><b id="st-streak">0</b><span>สถิติตอบถูกติดกัน</span></div>
    </div>
    <div class="grid" id="subjects"></div>
    <p class="footer-note">แตะวิชาเพื่อเริ่ม • ผลคะแนนบันทึกไว้ในเครื่องอัตโนมัติ</p>
  </div>

  <!-- ============ QUIZ ============ -->
  <div id="quiz" class="hidden">
    <div class="qtop">
      <div class="left">
        <button class="topbtn" onclick="confirmExit()">← ออก</button>
        <span class="pill" id="q-count">1/30</span>
        <span class="pill" id="q-score">✅ 0</span>
      </div>
      <div class="left">
        <span class="pill flame" id="q-streak">🔥 0</span>
        <span class="pill timer" id="q-timer">00:00</span>
        <button class="topbtn" id="mutebtn" onclick="toggleMute()">🔊</button>
      </div>
    </div>
    <div class="progress"><i id="q-progress" style="width:0%"></i></div>
    <div class="qcard" id="qcard">
      <div class="qsec" id="q-section"></div>
      <div class="qtext" id="q-text"></div>
      <div id="q-audio"></div>
      <div class="choices" id="q-choices"></div>
      <div id="q-expl"></div>
      <div class="qactions">
        <button class="lifeline" id="fifty" onclick="useFifty()">✂️ 50:50 <span id="fifty-n">×3</span></button>
        <button class="btn primary hidden" id="nextbtn" onclick="nextQ()">ข้อถัดไป →</button>
        <button class="btn ghost hidden" id="skipbtn" onclick="nextQ()">ข้าม →</button>
        <button class="btn primary hidden" id="submitbtn" onclick="finishQuiz()">ส่งคำตอบ ✅</button>
      </div>
    </div>
    <div class="palette hidden" id="palette"></div>
  </div>

  <!-- ============ RESULT ============ -->
  <div id="result" class="hidden"></div>
</div>

<div id="modal-root"></div>

<script>window.AUDIO_BASE='../audio/';const EXAM_DATA = {"subjects": [{"id": "team", "icon": "🤝", "title": "การทำงานเป็นทีม", "subtitle": "Teamwork • รวมชุด 1+2+เสริม", "labels": ["ก", "ข", "ค", "ง", "จ"], "questions": [{"n": 1, "q": "หัวใจสำคัญที่สุดที่ทำให้การทำงานเป็นทีมประสบความสำเร็จคืออะไร?", "choices": ["การมีผู้นำที่เผด็จการ", "การมีเป้าหมายร่วมกันที่ชัดเจน", "การคัดเลือกสมาชิกที่เก่งที่สุดมารวมกัน", "การทำงานแยกส่วนใครส่วนมัน", "การมีงบประมาณในการทำงานจำนวนมาก"], "answer": 1, "explanation": "เป้าหมายร่วมที่ชัดเจนทำให้สมาชิกทุกคนมุ่งไปในทิศทางเดียวกัน จึงเป็นหัวใจของการทำงานเป็นทีม ส่วนผู้นำเผด็จการ การรวมคนเก่ง หรือการมีงบประมาณมาก ไม่ใช่ปัจจัยหลักที่ทำให้ทีมสำเร็จ", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 2, "q": "ลักษณะของ 'ทีมงาน' (Team) ที่แตกต่างจาก 'กลุ่มงาน' (Group) คือข้อใด?", "choices": ["สมาชิกในทีมมีการทำงานที่พึ่งพาอาศัยกัน", "สมาชิกในกลุ่มมีจำนวนมากกว่าสมาชิกในทีม", "สมาชิกในทีมไม่จำเป็นต้องคุยกัน", "สมาชิกในกลุ่มต้องมีหัวหน้าเพียงคนเดียว", "ทีมงานไม่มีความรับผิดชอบส่วนบุคคล"], "answer": 0, "explanation": "จุดต่างสำคัญของ 'ทีม' คือการทำงานแบบพึ่งพาอาศัยกัน (interdependence) และมีเป้าหมายร่วม ต่างจาก 'กลุ่ม' ที่มักต่างคนต่างทำงานของตน", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 3, "q": "ในการเริ่มต้นทำงานเป็นทีม สิ่งแรกที่ควรทำคืออะไร?", "choices": ["การเลือกสถานที่พักผ่อนของทีม", "การกำหนดงบประมาณ", "การสร้างความเข้าใจในเป้าหมายและบทบาทของแต่ละคน", "การเริ่มลงมือทำทันทีเพื่อประหยัดเวลา", "การรายงานผลการดำเนินงาน"], "answer": 2, "explanation": "การเริ่มงานควรให้ทุกคนเข้าใจเป้าหมายร่วมและรู้บทบาทหน้าที่ของตนก่อน จึงจะทำงานประสานกันได้ ไม่ใช่รีบลงมือทำทันทีโดยยังไม่เข้าใจทิศทาง", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 4, "q": "'ผู้นำทีม' (Team Leader) ที่ดีควรมีบทบาทหลักอย่างไร?", "choices": ["ทำงานแทนลูกน้องทุกอย่าง", "ตัดสินใจคนเดียวโดยไม่ฟังใคร", "สนับสนุนและประสานงานเพื่อให้ทีมบรรลุเป้าหมาย", "คอยจับผิดความผิดพลาดของสมาชิก", "สั่งการผ่านเอกสารเท่านั้น"], "answer": 2, "explanation": "ผู้นำที่ดีทำหน้าที่อำนวยความสะดวก สนับสนุน และประสานงานให้ทีมเดินไปสู่เป้าหมาย ไม่ใช่ทำแทนทุกอย่างหรือสั่งการฝ่ายเดียว", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 5, "q": "หากท่านได้รับมอบหมายหน้าที่ที่ตนเองไม่ถนัดในทีม ท่านควรทำอย่างไร?", "choices": ["ลาออกจากทีมทันที", "ปฏิเสธการทำงานและอยู่เฉยๆ", "ยอมรับและพยายามเรียนรู้ พร้อมขอคำแนะนำจากเพื่อนร่วมทีม", "ทำงานส่งๆ ไปให้เสร็จ", "จ้างคนภายนอกมาทำงานแทน"], "answer": 2, "explanation": "เมื่อได้งานที่ไม่ถนัด ควรเปิดใจเรียนรู้และขอคำแนะนำจากเพื่อนร่วมทีม เป็นทั้งการพัฒนาตนเองและการรักษาความรับผิดชอบต่อทีม", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 6, "q": "'ผู้ตามที่ดี' (Effective Follower) ในทีมมีลักษณะอย่างไร?", "choices": ["เชื่อฟังหัวหน้าทุกอย่างโดยไม่มีข้อสงสัย", "มีความคิดริเริ่มและสนับสนุนงานของทีมอย่างจริงจัง", "ทำงานเฉพาะที่สั่งเท่านั้น", "คอยประจบหัวหน้าเพื่อเอาใจ", "ไม่แสดงความคิดเห็นใดๆ ในที่ประชุม"], "answer": 1, "explanation": "ผู้ตามที่ดีไม่ได้เชื่อฟังอย่างเดียว แต่มีความคิดริเริ่ม กล้าเสนอความเห็น และสนับสนุนงานของทีมอย่างจริงจัง", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 7, "q": "การแบ่งงานตามความถนัดของสมาชิก (Put the right man on the right job) ส่งผลดีต่อทีมอย่างไร?", "choices": ["ทำให้งานเสร็จเร็วขึ้นและมีคุณภาพ", "ทำให้สมาชิกคนอื่นไม่ต้องทำงาน", "ทำให้หัวหน้างานสบายขึ้น", "เพื่อเป็นการแบ่งแยกชนชั้นในทีม", "เพื่อลดจำนวนสมาชิกในทีม"], "answer": 0, "explanation": "การมอบงานให้ตรงกับความถนัดช่วยให้สมาชิกใช้ศักยภาพได้เต็มที่ งานจึงมีคุณภาพและเสร็จเร็วขึ้น", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 8, "q": "เมื่อสมาชิกในทีมคนหนึ่งงานล้นมือ เพื่อนร่วมทีมควรปฏิบัติอย่างไร?", "choices": ["นั่งดูเฉยๆ เพราะไม่ใช่หน้าที่ของเรา", "รีบกลับบ้านก่อนเพื่อไม่ให้เป็นภาระ", "อาสาเข้าช่วยเหลือเท่าที่ทำได้เพื่อประโยชน์ของทีม", "ไปบอกหัวหน้าว่าสมาชิกคนนั้นทำงานช้า", "หัวเราะเยาะสมาชิกคนนั้น"], "answer": 2, "explanation": "น้ำใจและการช่วยเหลือกันเท่าที่ทำได้เพื่อเป้าหมายส่วนรวม เป็นคุณลักษณะสำคัญของสมาชิกทีมที่ดี", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 9, "q": "'ความรับผิดชอบร่วมกัน' (Mutual Accountability) หมายถึงอะไร?", "choices": ["ถ้างานผิดพลาด ทุกคนต้องร่วมกันรับผิดชอบและแก้ไข", "ใครทำผิด คนนั้นรับผิดชอบคนเดียว", "หัวหน้าต้องรับผิดชอบทุกอย่างเพียงลำพัง", "การโยนความผิดให้พนักงานใหม่", "การรับเฉพาะความดีความชอบร่วมกันเท่านั้น"], "answer": 0, "explanation": "Mutual Accountability คือการที่สมาชิกทุกคนรับผิดชอบต่อผลงานของทีมร่วมกัน ทั้งความสำเร็จและความผิดพลาด แล้วช่วยกันแก้ไข", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 10, "q": "ข้อใดคือลักษณะของทีมที่ไม่มีประสิทธิภาพ?", "choices": ["มีการสื่อสารที่เปิดกว้าง", "มีเป้าหมายที่คลุมเครือ ไม่ชัดเจน", "สมาชิกมีความไว้วางใจกัน", "มีการสนับสนุนซึ่งกันและกัน", "มีการประเมินผลงานสม่ำเสมอ"], "answer": 1, "explanation": "เป้าหมายที่คลุมเครือทำให้สมาชิกทำงานคนละทิศทางและวัดผลไม่ได้ จึงเป็นลักษณะของทีมที่ไร้ประสิทธิภาพ ส่วนข้ออื่นล้วนเป็นคุณสมบัติของทีมที่ดี", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 11, "q": "'Synergy' หรือ การรวมพลัง มีความหมายสอดคล้องกับข้อใด?", "choices": ["1 + 1 = 2", "1 + 1 < 2", "1 + 1 > 2", "1 - 1 = 0", "2 - 1 = 1"], "answer": 2, "explanation": "Synergy คือพลังของทีมที่รวมกันแล้วได้ผลลัพธ์ 'มากกว่า' ผลบวกของแต่ละคน จึงแทนด้วย 1 + 1 > 2", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 12, "q": "การสร้าง 'ทีมวิญญาณ' (Team Spirit) ควรทำอย่างไร?", "choices": ["การจัดกิจกรรมสร้างความสัมพันธ์ (Team Building)", "การลงโทษผู้ที่ทำงานพลาดอย่างรุนแรง", "การแยกพนักงานให้อยู่คนละแผนก", "การงดใช้เสียงในที่ทำงาน", "การประกาศรายชื่อคนเก่งเพียงคนเดียว"], "answer": 0, "explanation": "กิจกรรมสร้างความสัมพันธ์ (Team Building) ช่วยสร้างความผูกพัน ความไว้วางใจ และจิตวิญญาณความเป็นทีม", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 13, "q": "ในการทำงานทีมเชิงรุก (Proactive Team) สมาชิกควรทำสิ่งใด?", "choices": ["รอรับคำสั่งจากหัวหน้าเพียงอย่างเดียว", "คาดการณ์ปัญหาที่อาจเกิดขึ้นและเตรียมทางหนีทีไล่", "ทำงานตามความเคยชินเดิมๆ", "ปฏิเสธการเปลี่ยนแปลงทุกรูปแบบ", "บ่นเรื่องงานให้ผู้อื่นฟัง"], "answer": 1, "explanation": "ทีมเชิงรุกจะวางแผนล่วงหน้า คาดการณ์ปัญหาและเตรียมแนวทางรับมือไว้ก่อน ไม่ใช่รอให้ปัญหาเกิดแล้วค่อยแก้", "section": "ชุดที่ 1: ส่วนที่ 1: บทบาทหน้าที่ในทีม"}, {"n": 14, "q": "ทักษะการสื่อสารที่สำคัญที่สุดในการทำงานเป็นทีมคืออะไร?", "choices": ["การพูดจาโน้มน้าวใจ", "การพูดภาษาอังกฤษได้คล่อง", "การฟังอย่างตั้งใจ (Active Listening)", "การเขียนรายงานที่ยาวและละเอียด", "การส่งอีเมลอย่างรวดเร็ว"], "answer": 2, "explanation": "การฟังอย่างตั้งใจ (Active Listening) เป็นพื้นฐานที่ทำให้เข้าใจกันตรงกันและลดความผิดพลาดในการทำงานร่วมกัน", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 15, "q": "เมื่อเพื่อนร่วมทีมเสนอความคิดเห็นที่เราไม่เห็นด้วย เราควรทำอย่างไร?", "choices": ["พูดขัดคอทันที", "แกล้งทำเป็นไม่ได้ยิน", "ฟังให้จบ พิจารณาข้อดีข้อเสีย และแลกเปลี่ยนอย่างสุภาพ", "นำความคิดเห็นนั้นไปนินทาลับหลัง", "บังคับให้เขาเปลี่ยนความคิดเห็นตามเรา"], "answer": 2, "explanation": "การเคารพความเห็นต่างด้วยการฟังจนจบ ชั่งน้ำหนักข้อดีข้อเสีย แล้วแลกเปลี่ยนอย่างสุภาพ เป็นการสื่อสารเชิงสร้างสรรค์ในทีม", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 16, "q": "ข้อใดคืออุปสรรคสำคัญของการรับฟังความคิดเห็นในทีม?", "choices": ["การมีอคติ (Bias) ต่อผู้พูด", "การจดบันทึกขณะฟัง", "การสบตาผู้พูด", "การถามคำถามเมื่อไม่เข้าใจ", "การสรุปประเด็นร่วมกัน"], "answer": 0, "explanation": "อคติต่อผู้พูดทำให้เราปิดกั้นและตีความสารอย่างบิดเบือน จึงเป็นอุปสรรคของการรับฟัง ส่วนข้ออื่นล้วนเป็นพฤติกรรมการฟังที่ดี", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 17, "q": "การสื่อสารแบบสองทาง (Two-way Communication) ส่งผลดีต่อทีมอย่างไร?", "choices": ["ทำให้เกิดความเข้าใจตรงกันและลดความผิดพลาด", "ทำให้เสียเวลาในการทำงาน", "ทำให้หัวหน้าเสียอำนาจ", "ทำให้สมาชิกทะเลาะกันมากขึ้น", "ทำให้งานล่าช้ากว่ากำหนด"], "answer": 0, "explanation": "การสื่อสารสองทางเปิดโอกาสให้ผู้รับสารป้อนกลับและซักถาม จึงช่วยให้เข้าใจตรงกันและลดความผิดพลาด", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 18, "q": "ท่าทางใดที่แสดงว่าเรา 'ตั้งใจฟัง' เพื่อนร่ว , "answer": 2, "explanation": "ผู้นำที่กล้ายอมรับผิด ขอโทษ และชวนทีมหาทางแก้ไข จะสร้างความไว้วางใจและเป็นแบบอย่างของความรับผิดชอบ", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 23, "q": "ประโยชน์ของการระดมสมอง (Brainstorming) คือข้อใด?", "choices": ["เพื่อหาคนผิดมาลงโทษ", "เพื่อรวบรวมไอเดียหลากหลายโดยยังไม่รีบตัดสินว่าถูกหรือผิด", "เพื่อให้หัวหน้าได้โชว์ความเก่ง", "เพื่อฆ่าเวลาในการทำงาน", "เพื่อหาว่าใครพูดน้อยที่สุด"], "answer": 1, "explanation": "การระดมสมองเน้นรวบรวมไอเดียให้ได้มากและหลากหลายก่อน โดยยังไม่รีบตัดสินถูกผิด แล้วจึงค่อยนำมาประเมินภายหลัง", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 24, "q": "การสื่อสารในทีมผ่านช่องทาง Digital ควรระวังเรื่องใดที่สุด?", "choices": ["ความเร็วในการพิมพ์", "การใช้สติกเกอร์ที่สวยงาม", "การตีความหมายที่ผิดพลาดเนื่องจากขาดน้ำเสียงและท่าทาง", "ราคาของอุปกรณ์สื่อสาร", "จำนวนสมาชิกในกลุ่ม"], "answer": 2, "explanation": "การสื่อสารดิจิทัลขาดน้ำเสียง สีหน้า และภาษากาย จึงเสี่ยงต่อการตีความหมายผิดมากที่สุด ควรระวังการใช้ถ้อยคำให้ชัดเจน", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 25, "q": "การเคารพใน 'ความแตกต่างระหว่างบุคคล' (Diversity) หมายถึงข้อใด?", "choices": ["การบังคับให้ทุกคนคิดเหมือนกัน", "การเลือกปฏิบัติกับคนที่เรียนเก่งกว่า", "การยอมรับและใช้ประโยชน์จากความหลากหลายของสมาชิก", "การแยกกลุ่มคนตามเชื้อชาติ", "การไม่รับพนักงานใหม่ที่ต่างถิ่น"], "answer": 2, "explanation": "การเคารพความหลากหลายคือการยอมรับความแตกต่างของสมาชิกและนำจุดเด่นที่ต่างกันมาใช้ให้เกิดประโยชน์ต่อทีม", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 26, "q": "ข้อใดคือพฤติกรรมการฟังที่ 'ไม่เหมาะสม'?", "choices": ["การทวนคำพูดเพื่อตรวจสอบความเข้าใจ", "การพูดแทรกในขณะที่ผู้อื่นยังพูดไม่จบ", "การรอจังหวะที่เหมาะสมก่อนถาม", "การสังเกตภาษากายของผู้พูด", "การตั้งใจจดประเด็นสำคัญ"], "answer": 1, "explanation": "การพูดแทรกขณะที่ผู้อื่นยังพูดไม่จบเป็นการฟังที่ไม่เหมาะสมและไม่ให้เกียรติผู้พูด ส่วนข้ออื่นเป็นพฤติกรรมการฟังที่ดี", "section": "ชุดที่ 1: ส่วนที่ 2: การรับฟังความคิดเห็น"}, {"n": 27, "q": "ความขัดแย้งในทีมเป็นเรื่องปกติหรือไม่?", "choices": ["ไม่ปกติ ทีมที่ดีต้องไม่มีความขัดแย้งเลย", "ปกติ เพราะความเห็นที่แตกต่างสามารถนำไปสู่ความคิดใหม่ๆ ได้", "เป็นเรื่องเลวร้ายที่ต้องกำจัดทันที", "เป็นเรื่องที่หัวหน้าควรจัดการด้วยการไล่ออก", "เป็นสัญญาณว่าทีมกำลังจะล่มสลาย"], "answer": 1, "explanation": "ความขัดแย้งเป็นเรื่องปกติในการทำงานร่วมกัน หากเป็นความเห็นต่างเชิงสร้างสรรค์ยังนำไปสู่ความคิดและวิธีการใหม่ๆ ที่ดีขึ้นได้", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 28, "q": "สาเหตุส่วนใหญ่ของความขัดแย้งในที่ทำงานคือข้อใด?", "choices": ["การสื่อสารที่ผิดพลาดและการขัดผลประโยชน์", "การมีเงินเดือนเท่ากันทุกคน", "การที่ทุกคนตั้งใจทำงานมากเกินไป", "การที่ออฟฟิศสะอาดเกินไป", "การมีสวัสดิการที่ดีเกินไป"], "answer": 0, "explanation": "ความขัดแย้งในที่ทำงานส่วนใหญ่เกิดจากการสื่อสารที่ผิดพลาด (เข้าใจไม่ตรงกัน) และการขัดกันของผลประโยชน์หรือเป้าหมาย", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 29, "q": "การจัดการความขัดแย้งแบบ 'Win-Win' คือข้อใด?", "choices": ["ฉันได้ เธอเสีย", "ฉันเสีย เธอได้", "เราทั้งคู่ได้ประโยชน์และยอมรับข้อตกลงร่วมกัน", "เราทั้งคู่เสียประโยชน์เท่าๆ กัน", "ไม่สนใจปัญหา ปล่อยให้มันผ่านไป"], "answer": 2, "explanation": "Win-Win คือการร่วมมือกันหาทางออกที่ทั้งสองฝ่ายได้ประโยชน์และยอมรับข้อตกลงร่วมกัน (แนวทาง Collaborating)", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 30, "q": "เมื่อสมาชิก 2 คนในทีมทะเลาะกันเรื่องวิธีทำงาน หัวหน้าควรทำอย่างไร?", "choices": ["ลงโทษทั้งสองคนโดยไม่ฟังเหตุผล", "ให้ทั้งสองคนมาคุยกันโดยมีหัวหน้าเป็นตัวกลางในการเจรจา", "เลือกข้างคนที่หัวหน้าชอบมากกว่า", "ปล่อยให้ทะเลาะกันไปเรื่อยๆ จนกว่าจะเลิกเอง", "ย้ายทั้งสองคนไปอยู่คนละสาขา"], "answer": 1, "explanation": "การให้คู่กรณีได้พูดคุยกันโดยมีหัวหน้าเป็นคนกลางช่วยประสาน เป็นวิธีจัดการความขัดแย้งที่สร้างสรรค์และเป็นธรรมที่สุด", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 31, "q": "การแก้ปัญหาโดย 'การประนีประนอม' (Compromising) หมายถึงอะไร?", "choices": ["การยอมเสียสละทุกอย่างเพื่ออีกฝ่าย", "การที่แต่ละฝ่ายยอมลดข้อเรียกร้องลงบางส่วนเพื่อหาจุดกึ่งกลาง", "การบังคับให้อีกฝ่ายทำตามใจเรา", "การเดินหนีจากความขัดแย้ง", "การใช้กำลังแก้ปัญหา"], "answer": 1, "explanation": "การประนีประนอมคือการที่แต่ละฝ่ายยอมลดข้อเรียกร้องลงบางส่วน เพื่อพบกันครึ่งทางและหาข้อยุติร่วมกัน", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 32, "q": "ทัศนคติที่ควรมีเมื่อเกิดความขัดแย้งคืออะไร?", "choices": ["ต้องเอาชนะให้ได้", "มุ่งแก้ปัญหา ไม่มุ่งโจมตีตัวบุคคล", "หาแนวร่วมมาสนับสนุนความคิดเรา", "เก็บความโกรธไว้แล้วรอแก้แค้น", "ไม่พูดกับคู่กรณีอีกต่อไป"], "answer": 1, "explanation": "ควรแยก 'ปัญหา' ออกจาก 'ตัวบุคคล' คือมุ่งไปที่การแก้ปัญหาร่วมกัน ไม่โจมตีหรือเอาชนะกันที่ตัวคน", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 33, "q": "ขั้นตอนแรกของการแก้ไขความขัดแย้งคืออะไร?", "choices": ["การหาคนมารับผิดชอบ", "การระบุปัญหาและสาเหตุที่แท้จริงของความขัดแย้ง", "การลงโทษผู้ที่เริ่มก่อน", "การนำเรื่องไปฟ้องผู้บริหารระดับสูง", "การทำเป็นว่าไม่มีอะไรเกิดขึ้น"], "answer": 1, "explanation": "การแก้ความขัดแย้งต้องเริ่มจากการระบุปัญหาและเข้าใจสาเหตุที่แท้จริงก่อน จึงจะแก้ได้ตรงจุด", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 34, "q": "ข้อใดคือข้อดีของความขัดแย้ง 'ด้านความคิด' (Task Conflict)?", "choices": ["ทำให้คนเกลียดกัน", "ทำให้งานล่าช้า", "ช่วยเปิดมุมมองใหม่ๆ และปรับปรุงวิธีการทำงานให้ดีขึ้น", "ช่วยหาว่าใครฉลาดน้อยที่สุด", "ทำให้บริษัทต้องปิดตัวลง"], "answer": 2, "explanation": "ความขัดแย้งเชิงงาน (Task Conflict) ที่ถกกันเรื่องเนื้องาน ช่วยเปิดมุมมองใหม่และกระตุ้นให้ปรับปรุงวิธีทำงานให้ดีขึ้น", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 35, "q": "พฤติกรรม 'การหลีกเลี่ยง' (Avoiding) ความขัดแย้ง เหมาะสมในกรณีใด?", "choices": ["ปัญหานั้นสำคัญมากและต้องรีบแก้", "เมื่อเรื่องนั้นเป็นเรื่องเล็กน้อยและไม่คุ้มที่จะทะเลาะ", "เมื่อเราเป็นฝ่ายถูก 100%", "เมื่อต้องการแสดงอำนาจ", "เมื่อต้องการสร้างความสัมพันธ์ที่ดี"], "answer": 1, "explanation": "การหลีกเลี่ยง (Avoiding) เหมาะกับประเด็นเล็กน้อยที่ไม่คุ้มจะเสียเวลาหรือความสัมพันธ์ไปทะเลาะ ไม่เหมาะกับปัญหาสำคัญที่ต้องรีบแก้", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 36, "q": "การใช้อารมณ์ในการแก้ปัญหาความขัดแย้งส่งผลอย่างไร?", "choices": ["ทำให้ปัญหาจบเร็วขึ้น", "ทำให้ทุกคนเคารพเรามากขึ้น", "ทำให้สถานการณ์เลวร้ายลงและเสียความสัมพันธ์", "ทำให้ได้งานที่มีคุณภาพ", "ทำให้ได้รับการเลื่อนตำแหน่ง"], "answer": 2, "explanation": "การใช้อารมณ์มักทำให้ความขัดแย้งบานปลายและทำลายความสัมพันธ์ ควรใช้เหตุผลและความสงบในการแก้ปัญหา", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 37, "q": "'การไกล่เกลี่ย' (Mediation) จะมีประสิทธิภาพเมื่อใด?", "choices": ["เมื่อตัวกลางมีความเป็นกลางและเป็นที่ยอมรับของทั้งสองฝ่าย", "เมื่อตัวกลางเข้าข้างฝ่ายใดฝ่ายหนึ่ง", "เมื่อตัวกลางข่มขู่ทั้งสองฝ่าย", "เมื่อใช้เวลานานเกินไป", "เมื่อไม่ฟังข้อมูลจากฝ่ายใดเลย"], "answer": 0, "explanation": "การไกล่เกลี่ยจะได้ผลเมื่อคนกลางมีความเป็นกลางและได้รับการยอมรับจากทั้งสองฝ่าย จึงจะช่วยประสานให้เกิดข้อยุติได้", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 38, "q": "หากความขัดแย้งเกิดจาก 'ความเข้าใจผิด' ควรแก้ไขอย่างไร?", "choices": ["การให้ข้อมูลที่ถูกต้องและสื่อสารกันโดยตรง", "การโพสต์ด่าบนโซเชียลมีเดีย", "การเขียนจดหมายลึกลับไปขู่", "การจ้างทนายความมาฟ้องร้อง", "การยื่นใบลาออก"], "answer": 0, "explanation": "ความขัดแย้งที่เกิดจากความเข้าใจผิด แก้ได้ด้วยการให้ข้อมูลที่ถูกต้องและพูดคุยกันโดยตรงเพื่อปรับความเข้าใจ", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 39, "q": "พฤติกรรมการแก้ความขัดแย้งแบบ 'ยอมตาม' (Accommodating) เหมาะกับสถานการณ์ใด?", "choices": ["เมื่อเรามั่นใจว่าเราถูก", "เมื่อเราพบว่าเราเป็นฝ่ายผิดและต้องการรักษาความสัมพันธ์ไว้", "เมื่อเรื่องนั้นส่งผลเสียต่อบริษัทอย่างรุนแรง", "เมื่อต้องการเอาชนะฝ่ายตรงข้าม", "เมื่อต้องการสร้างอำนาจต่อรอง"], "answer": 1, "explanation": "การยอมตาม (Accommodating) เหมาะเมื่อเราพบว่าตนเป็นฝ่ายผิด หรือเรื่องนั้นสำคัญกับอีกฝ่ายมากกว่า และเราต้องการรักษาความสัมพันธ์ไว้", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 40, "q": "เป้าหมายสุดท้ายของการบริหารความขัดแย้งคืออะไร?", "choices": ["เพื่อหาคนชนะ", "เพื่อรักษาบรรยากาศการทำงานและให้งานดำเนินต่อไปได้อย่างมีประสิทธิภาพ", "เพื่อให้ทุกคนเงียบ", "เพื่อให้หัวหน้าพึงพอใจ", "เพื่อให้เกิดการลาออกน้อยที่สุด"], "answer": 1, "explanation": "เป้าหมายของการบริหารความขัดแย้งไม่ใช่การหาผู้ชนะ แต่คือการรักษาความสัมพันธ์และบรรยากาศที่ดี เพื่อให้งานเดินหน้าต่อไปได้อย่างมีประสิทธิภาพ", "section": "ชุดที่ 1: ส่วนที่ 3: การขจัดความขัดแย้ง"}, {"n": 41, "q": "เมื่อสมาชิกในทีมคนหนึ่งไม่สามารถส่งงานได้ตามกำหนดจนส่งผลกระทบต่อภาพรวม การกระทำในข้อใดแสดงถึงการเป็น 'สมาชิกที่ดีของทีม' มากที่สุด?", "choices": ["รายงานหัวหน้างานทันทีเพื่อให้พิจารณาลงโทษตามระเบียบ", "เข้าไปสอบถามสาเหตุและเสนอตัวช่วยเหลือในส่วนที่ทำได้เพื่อให้งานเดินหน้า", "ทำเฉพาะงานของตนเองให้ดีที่สุดเพื่อพิสูจน์ว่าความล่าช้าไม่ได้เกิดจากเรา", "ตำหนิสมาชิกคนนั้นในที่ประชุมเพื่อให้ตระหนักถึงความรับผิดชอบ", "รอให้ถึงวันส่งงานจริงค่อยแจ้งปัญหาให้ทุกคนทราบพร้อมกัน"], "answer": 1, "explanation": "สมาชิกที่ดีของทีมมองที่เป้าหมายส่วนรวมเป็นหลัก การเข้าไปสอบถามสาเหตุและเสนอตัวช่วยเหลือช่วยให้งานของทีมเดินหน้าต่อได้ ส่วนการฟ้อง การตำหนิ หรือการนิ่งเฉย ล้วนไม่ช่วยแก้ปัญหาและทำลายบรรยากาศทีม", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 42, "q": "ในการประชุมทีม หากคุณเห็นว่าแนวทางที่เสียงส่วนใหญ่เลือกอาจมีข้อผิดพลาดในอนาคต คุณควรปฏิบัติอย่างไรตามหลักการทำงานเป็นทีม?", "choices": ["เงียบไว้เพื่อไม่ให้เสียบรรยากาศและปฏิบัติตามเสียงส่วนใหญ่", "ขออนุญาตนำเสนอข้อมูลสนับสนุนและข้อกังวลด้วยเหตุผลอย่างสุภาพ", "คัดค้านอย่างรุนแรงเพื่อให้ทุกคนยอมรับความคิดเห็นของคุณ", "เก็บข้อมูลไว้แจ้งหัวหน้างานเป็นการส่วนตัวหลังจบการประชุม", "ประชดด้วยการขอถอนตัวจากโครงการนั้นทันที"], "answer": 1, "explanation": "ผู้ตามที่ดีต้องกล้าแสดงความเห็นต่างอย่างสร้างสรรค์ คือเสนอข้อมูลและเหตุผลอย่างสุภาพในที่ประชุม เพื่อให้ทีมได้พิจารณาความเสี่ยงก่อนตัดสินใจ ไม่ใช่เงียบตาม คัดค้านรุนแรง หรือไปพูดลับหลัง", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 43, "q": "การทำ 'Service Mind' ให้เกิดประสิทธิภาพสูงสุด พนักงานต้องเข้าใจ 'ความต้องการของผู้รับบริการ' ในมิติใดเป็นอันดับแรก?", "choices": ["ฐานะทางสังคมและกำลังซื้อของลูกค้า", "ความต้องการพื้นฐานและสิ่งที่ลูกค้ากังวลใจ (Pain Point)", "วันเกิดและประวัติส่วนตัวของลูกค้าทั้งหมด", "ชื่อเสียงของบริษัทคู่แข่งที่ลูกค้าเคยใช้บริการ", "จำนวนของกำนัลที่ลูกค้าต้องการได้รับ"], "answer": 1, "explanation": "หัวใจของงานบริการคือการเข้าใจความต้องการพื้นฐานและปัญหาที่ลูกค้ากังวล (Pain Point) ก่อน จึงจะตอบสนองได้ตรงจุด ข้อมูลอื่นๆ เป็นเพียงส่วนประกอบ ไม่ใช่มิติแรกที่ต้องเข้าใจ", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 44, "q": "หากลูกค้ามาร้องเรียนเรื่องความล่าช้าด้วยอารมณ์ที่เกรี้ยวกราด ขั้นตอนแรกที่พนักงานควรทำคือข้อใด?", "choices": ["อธิบายเหตุผลของความล่าช้าทันทีเพื่อให้ลูกค้าเข้าใจ", "เดินหนีไปหาพนักงานคนอื่นเพื่อให้ลูกค้าใจเย็นลง", "รับฟังอย่างตั้งใจโดยไม่ขัดจังหวะและแสดงความเห็นอกเห็นใจ", "โต้ตอบด้วยน้ำเสียงที่ดังกว่าเพื่อให้ลูกค้าหยุดพูด", "เรียกฝ่ายรักษาความปลอดภัยมาเชิญลูกค้าออกจากพื้นที่"], "answer": 2, "explanation": "หลักการจัดการข้อร้องเรียนคือต้องให้ลูกค้าได้ระบายและรู้สึกว่าถูกรับฟังก่อน (รับฟังอย่างตั้งใจ + แสดง Empathy) เมื่ออารมณ์เย็นลงแล้วจึงค่อยอธิบายเหตุผลและเสนอทางแก้ การรีบอธิบายทันทีขณะลูกค้ายังโกรธมักทำให้สถานการณ์แย่ลง", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 45, "q": "ข้อใดคือการ 'ประสานประโยชน์' ระหว่างแผนกการผลิตและแผนกขายที่มีประสิทธิภาพที่สุด?", "choices": ["แผนกขายรับออเดอร์ให้มากที่สุดโดยไม่ต้องสนใจกำลังการผลิต", "แผนกการผลิตลดขั้นตอนการทำงานลงเพื่อให้ทันตามคำสั่งซื้อ", "การประชุมร่วมกันเพื่อวางแผนยอดขายให้สอดคล้องกับกำลังการผลิตจริง", "ต่างคนต่างทำหน้าที่ของตนเองให้ดีที่สุดโดยไม่ต้องสื่อสารกัน", "ให้ผู้บริหารสูงสุดเป็นคนตัดสินใจสั่งการทุกขั้นตอน"], "answer": 2, "explanation": "การประสานประโยชน์คือการหาจุดสมดุลที่ทุกฝ่ายได้ประโยชน์และงานส่วนรวมเดินได้ การประชุมวางแผนร่วมกันให้ยอดขายสอดคล้องกับกำลังการผลิตจริง คือการประสานที่ทั้งสองแผนกบรรลุเป้าหมายไปด้วยกัน", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 46, "q": "การสื่อสารแบบใดที่ช่วยลดความขัดแย้งในการประสานงานภายในทีมได้ดีที่สุด?", "choices": ["การพูดคุยแบบเผชิญหน้าและทวนคำสั่งเพื่อความเข้าใจที่ตรงกัน", "การส่งอีเมลอย่างเดียวเพื่อใช้เป็นหลักฐานในการเอาผิดหากงานพลาด", "การฝากข้อความผ่านบุคคลที่สาม", "การพูดแบบอ้อมๆ เพื่อไม่ให้อีกฝ่ายรู้สึกถูกกดดัน", "การรอให้ปัญหาเกิดขึ้นก่อนแล้วค่อยเรียกประชุมด่วน"], "answer": 0, "explanation": "การคุยแบบเผชิญหน้าได้ทั้งน้ำเสียงและภาษากาย และการทวนคำสั่ง (paraphrasing) ช่วยยืนยันว่าเข้าใจตรงกัน จึงลดความเข้าใจผิดอันเป็นต้นเหตุหลักของความขัดแย้ง ส่วนการฝากผ่านคนกลางหรือพูดอ้อมๆ ยิ่งเสี่ยงต่อการตีความผิด", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 47, "q": "พฤติกรรมใดที่ช่วยสร้าง 'ความเชื่อมั่น' (Trust) ในการสร้างความสัมพันธ์กับสมาชิกในทีม?", "choices": ["การชวนเพื่อนร่วมงานไปสังสรรค์ทุกวันหลังเลิกงาน", "การรักษาคำพูดและการทำงานให้เสร็จตามที่ได้รับมอบหมายอย่างสม่ำเสมอ", "การคอยรายงานพฤติกรรมของเพื่อนในทีมให้หัวหน้าทราบ", "การชมเชยเพื่อนร่วมงานเกินความเป็นจริงในที่ประชุม", "การให้ยืมเงินหรือทรัพย์สินส่วนตัว"], "answer": 1, "explanation": "ความไว้วางใจในทีมเกิดจากความน่าเชื่อถือที่พิสูจน์ได้ คือรักษาคำพูดและส่งมอบงานได้ตามที่รับปากอย่างสม่ำเสมอ ไม่ใช่ความสนิทสนมทางสังคม การประจบ หรือเรื่องเงินทอง", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 48, "q": "เมื่อเกิดปัญหาความขัดแย้งส่วนตัวระหว่างคุณกับสมาชิกคนอื่นในทีม คุณควรจัดการอย่างไรเพื่อไม่ให้กระทบงาน?", "choices": ["หลีกเลี่ยงการพูดคุยหรือร่วมงานกับสมาชิกคนนั้น", "ขออนุญาตหัวหน้าย้ายแผนกทันที", "พูดคุยเพื่อปรับความเข้าใจโดยมุ่งเน้นไปที่เป้าหมายของงานเป็นหลัก", "รอให้อีกฝ่ายมาขอโทษก่อนเท่านั้น", "พยายามหาพวกในทีมเพื่อให้ทุกคนไม่ชอบสมาชิกคนนั้นเหมือนเรา"], "answer": 2, "explanation": "หลักการแก้ความขัดแย้งคือแยกเรื่องส่วนตัวออกจากงาน แล้วเปิดใจพูดคุยปรับความเข้าใจโดยยึดเป้าหมายของงานเป็นที่ตั้ง (มุ่งที่ปัญหา ไม่มุ่งที่ตัวบุคคล) การหลบเลี่ยง รอขอโทษ หรือหาพวก มีแต่ทำให้ความขัดแย้งบานปลาย", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 49, "q": "ข้อใดคือตัวอย่างของการ 'แลกเปลี่ยนเรียนรู้' ที่สร้างสรรค์ที่สุด?", "choices": ["การจดบันทึกความผิดพลาดที่เกิดขึ้นแล้วนำมาแชร์เพื่อหาแนวทางป้องกันร่วมกัน", "การอวดทักษะใหม่ๆ ที่เรียนมาเพื่อให้ผู้อื่นรู้สึกด้อยกว่า", "การบอกเฉพาะข้อมูลส่วนที่ทำให้ตนเองดูดี", "การรอให้หัวหน้าสั่งให้มีการจัดการความรู้ (KM) เท่านั้น", "การแอบศึกษาจากเพื่อนร่วมงานที่เก่งๆ โดยไม่บอกให้รู้ตัว"], "answer": 0, "explanation": "การนำบทเรียนจากความผิดพลาด (Lessons Learned) มาแบ่งปันเพื่อหาแนวทางป้องกันร่วมกัน เป็นการจัดการความรู้ที่สร้างสรรค์ เพราะเปลี่ยนความผิดพลาดให้เป็นความรู้ของทั้งทีมและป้องกันการเกิดซ้ำ", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 50, "q": "พนักงานระดับอาชีวศึกษาจะช่วยเพิ่มประสิทธิภาพการทำงานเป็นทีมผ่านการ 'แลกเปลี่ยนเรียนรู้' ได้อย่างไร?", "choices": ["การรับฟังเฉพาะคำแนะนำจากผู้ที่มีวุฒิการศึกษาสูงกว่า", "การสอนงาน (Mentoring) ให้กับพนักงานใหม่ด้วยความเต็มใจ", "การเก็บความรู้เฉพาะทางไว้กับตนเองเพื่อความมั่นคงในหน้าที่การงาน", "การวิพากษ์วิจารณ์การทำงานของคนอื่นโดยไม่เสนอทางออก", "การปฏิเสธการเข้าอบรมที่บริษัทจัดให้"], "answer": 1, "explanation": "การสอนงาน (Mentoring) ด้วยความเต็มใจเป็นการถ่ายทอดความรู้และทักษะให้คนในทีม ทำให้ทีมโดยรวมเก่งขึ้น ส่วนการหวงความรู้หรือฟังเฉพาะคนวุฒิสูงกว่า ขัดกับหลักการแลกเปลี่ยนเรียนรู้", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 51, "q": "หากสมาชิกในทีมรู้สึกท้อแท้จากภาระงานที่หนักเกินไป พฤติกรรมใดของเพื่อนร่วมทีมที่แสดงถึง 'การสร้างความสัมพันธ์' ที่ดี?", "choices": ["แกล้งทำเป็นไม่เห็นเพื่อจะได้ไม่ต้องรับผิดชอบเพิ่ม", "ให้กำลังใจและรับฟังปัญหา พร้อมเสนอช่วยจัดลำดับความสำคัญของงาน", "บอกให้สมาชิกคนนั้นเข้มแข็งกว่านี้และเลิกบ่น", "รีบทำงานส่วนของตนเองให้เสร็จเพื่อจะได้รับงานแทนทันที", "นินทาลับหลังว่าสมาชิกคนนั้นไม่อดทน"], "answer": 1, "explanation": "การให้กำลังใจ รับฟังปัญหา และช่วยเสนอวิธีจัดลำดับความสำคัญของงาน เป็นการดูแลทั้งด้านจิตใจและด้านการทำงานไปพร้อมกัน ซึ่งคือแก่นของการสร้างความสัมพันธ์ที่ดีในทีม", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 52, "q": "ในการทำงานกับผู้รับบริการต่างชาติหรือต่างวัฒนธรรม สิ่งสำคัญที่สุดในการเข้าใจ 'ความต้องการ' คือข้อใด?", "choices": ["การยึดถือมาตรฐานของบริษัทเราเป็นหลักโดยไม่เปลี่ยน", "การพยายามพูดคุยด้วยภาษาของลูกค้าเพียงอย่างเดียว", "การศึกษาความแตกต่างทางวัฒนธรรมและความคาดหวังเฉพาะบุคคล", "การปฏิเสธการให้บริการเพราะกลัวสื่อสารผิดพลาด", "การคิดไปเองว่าลูกค้าทุกคนต้องการเหมือนกันหมด"], "answer": 2, "explanation": "ลูกค้าต่างวัฒนธรรมมีความคาดหวังและมารยาทที่ต่างกัน การศึกษาความแตกต่างทางวัฒนธรรม (Cross-cultural Awareness) ควบคู่กับความคาดหวังเฉพาะบุคคล จึงเป็นกุญแจของการเข้าใจความต้องการที่แท้จริง ภาษาเป็นเพียงเครื่องมือหนึ่งเท่านั้น", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 53, "q": "เป้าหมายของทีม (Team Goal) จะบรรลุได้ยากที่สุดหากสมาชิกมีพฤติกรรมในข้อใด?", "choices": ["การมีความคิดเห็นที่แตกต่างกันบ่อยๆ", "การขาดความซื่อสัตย์และการปกปิดข้อผิดพลาด", "การตั้งคำถามเกี่ยวกับแผนงานของหัวหน้า", "การแข่งขันกันเสนอไอเดียใหม่ๆ", "การขอใช้เวลาพักเบรกตามที่กฎระเบียบกำหนด"], "answer": 1, "explanation": "การขาดความซื่อสัตย์และการปกปิดข้อผิดพลาดทำลายความไว้วางใจซึ่งเป็นรากฐานของทีม และทำให้ปัญหาถูกซุกไว้จนบานปลาย ส่วนความเห็นต่าง การตั้งคำถาม หรือการแข่งกันเสนอไอเดีย เป็นเรื่องปกติที่ดีต่อทีมด้วยซ้ำ", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 54, "q": "ทักษะใดจัดเป็น 'ทักษะทางอารมณ์' (Soft Skills) ที่จำเป็นที่สุดในการสร้างความสัมพันธ์ในทีม?", "choices": ["ทักษะการคำนวณสถิติขั้นสูง", "ทักษะการซ่อมบำรุงเครื่องจักร", "ทักษะการควบคุมอารมณ์ภายใต้ความกดดันและการเห็นอกเห็นใจผู้อื่น", "ทักษะการขับขี่รถบรรทุกอย่างปลอดภัย", "ทักษะการจำหน่ายสินค้าผ่านระบบออนไลน์"], "answer": 2, "explanation": "การควบคุมอารมณ์ (Self-regulation) และความเห็นอกเห็นใจ (Empathy) เป็นองค์ประกอบหลักของความฉลาดทางอารมณ์ (EQ) ซึ่งเป็น Soft Skill ที่จำเป็นต่อการสร้างความสัมพันธ์ ส่วนข้ออื่นเป็นทักษะทางเทคนิค (Hard Skills)", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 55, "q": "เมื่อสมาชิกในทีมมีสไตล์การทำงานที่ช้าและเน้นความละเอียด ในขณะที่คุณเน้นความเร็ว คุณควรประสานงานอย่างไร?", "choices": ["เร่งรัดอีกฝ่ายให้ทำงานเร็วขึ้นตามมาตรฐานของคุณ", "ปรับจังหวะการทำงานร่วมกันโดยกำหนดจุดเชื่อมต่อและเวลาส่งมอบที่ชัดเจน", "นำงานส่วนนั้นมาทำเองทั้งหมดเพื่อความรวดเร็ว", "รายงานว่าเพื่อนร่วมงานคนนั้นทำงานช้าเกินไป", "ทำงานให้เร็วที่สุดโดยทิ้งช่วงให้งานของอีกฝ่ายค้างคา"], "answer": 1, "explanation": "สไตล์การทำงานที่ต่างกันไม่ใช่ปัญหา หากมีการตกลงจุดเชื่อมต่อของงาน (Interface) และกำหนดเวลาส่งมอบร่วมกันอย่างชัดเจน ต่างฝ่ายจะทำงานตามจังหวะของตนได้โดยงานรวมไม่สะดุด เป็นการเคารพความแตกต่างระหว่างบุคคล", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 56, "q": "พนักงานควรทำอย่างไรเมื่อได้รับ 'คำชม' จากผู้รับบริการว่าเป็นผลงานที่ดีที่สุดในทีม?", "choices": ["ยอมรับไว้คนเดียวเพราะเราตั้งใจทำจริง", "ขอบคุณลูกค้าและบอกว่านี่คือผลสำเร็จจากการสนับสนุนของสมาชิกทุกคนในทีม", "บอกลูกค้าว่าสมาชิกคนนั้นไม่ได้ช่วยอะไรเลย", "ขอให้ลูกค้าเขียนจดหมายชมเชยระบุชื่อเราเพื่อไปขอขึ้นเงินเดือน", "แกล้งทำเป็นไม่ได้ยินคำชมเพื่อความถ่อมตัว"], "answer": 1, "explanation": "การให้เครดิตแก่ทีม (Share the credit) แสดงถึงความเป็นสมาชิกทีมที่ดีและความอ่อนน้อม ผลงานที่ดีเกือบทั้งหมดเกิดจากการสนับสนุนของหลายฝ่าย การรับความดีความชอบไว้คนเดียวจะบั่นทอนความสัมพันธ์ในทีม", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 57, "q": "ข้อใดเป็นอุปสรรคสำคัญของการ 'แลกเปลี่ยนเรียนรู้' ในองค์กร?", "choices": ["การมีระบบคอมพิวเตอร์ที่ทันสมัยเกินไป", "วัฒนธรรมการทำงานแบบ 'ใครผิดต้องถูกประจาน'", "การที่พนักงานมีอายุเท่ากันทั้งหมด", "การมีงบประมาณสำหรับการศึกษาดูงานจำนวนมาก", "การที่บริษัทมีสาขาหลายแห่ง"], "answer": 1, "explanation": "วัฒนธรรมประจานคนทำผิดทำให้พนักงานกลัวการยอมรับข้อผิดพลาดและไม่กล้าแบ่งปันบทเรียน ความรู้จึงถูกปกปิด ตรงข้ามกับวัฒนธรรมความปลอดภัยทางจิตใจ (Psychological Safety) ที่เอื้อต่อการแลกเปลี่ยนเรียนรู้", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 58, "q": "ในการทำงานเป็นทีม การทำ 'After Action Review' (AAR) หลังจบโครงการมีจุดประสงค์หลักเพื่ออะไร?", "choices": ["เพื่อหาคนรับผิดชอบในความเสียหายที่เกิดขึ้น", "เพื่อทบทวนสิ่งที่ทำได้ดีและสิ่งที่ควรปรับปรุงสำหรับการทำงานครั้งต่อไป", "เพื่อฉลองความสำเร็จและหยุดพักงานชั่วคราว", "เพื่อร่างจดหมายแจ้งเตือนพนักงานที่ทำผลงานต่ำกว่ามาตรฐาน", "เพื่อเปลี่ยนหัวหน้าทีมคนใหม่"], "answer": 1, "explanation": "AAR เป็นเครื่องมือทบทวนหลังปฏิบัติงาน โดยถามว่าอะไรที่ทำได้ดี อะไรควรปรับปรุง และจะทำให้ดีขึ้นอย่างไรในครั้งหน้า จุดประสงค์คือการเรียนรู้ของทีม ไม่ใช่การหาคนผิด", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 59, "q": "พฤติกรรมใดที่แสดงถึงการ 'ใส่ใจรายละเอียด' ของผู้รับบริการในสายงานช่าง?", "choices": ["การล้างทำความสะอาดรถให้ลูกค้าหลังจากซ่อมเสร็จแม้ลูกค้าไม่ได้ร้องขอ", "การรีบซ่อมให้จบไวๆ เพื่อจะได้รับงานรายต่อไป", "การใช้อะไหล่ราคาถูกเพื่อช่วยลูกค้าประหยัดเงินโดยไม่บอก", "การพูดคุยเรื่องส่วนตัวกับลูกค้าขณะทำงาน", "การรอให้ลูกค้ากลับมาต่อว่าก่อนค่อยแก้ไขงาน"], "answer": 0, "explanation": "การทำสิ่งเล็กๆ ที่เกินความคาดหวังโดยลูกค้าไม่ต้องร้องขอ (เช่น ล้างรถให้หลังซ่อมเสร็จ) คือการบริการที่ใส่ใจรายละเอียดและสร้างความประทับใจ ส่วนการเปลี่ยนอะไหล่ถูกโดยไม่บอกลูกค้าถือว่าขาดความซื่อสัตย์", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 60, "q": "องค์ประกอบสำคัญของ 'ความสัมพันธ์ที่ดีในทีม' คือความเคารพซึ่งกันและกัน ข้อใดแสดงถึงพฤติกรรมนี้?", "choices": ["การเรียกชื่อเล่นที่เพื่อนร่วมงานไม่ชอบเพื่อให้ดูสนิทสนม", "การรับฟังความคิดเห็นของพนักงานใหม่ด้วยความตั้งใจเท่ากับพนักงานเก่า", "การไม่กล้าตักเตือนเมื่อเห็นเพื่อนร่วมงานทำผิดกฎความปลอดภัย", "การแบ่งพรรคแบ่งพวกทำงานกับเฉพาะคนที่นิสัยเหมือนกัน", "การทำตามคำสั่งโดยไม่สงสัยแม้จะรู้ว่าผิด"], "answer": 1, "explanation": "การเคารพซึ่งกันและกันคือการให้คุณค่ากับทุกคนอย่างเท่าเทียม การรับฟังพนักงานใหม่อย่างตั้งใจเท่ากับพนักงานเก่า แสดงว่าเราเคารพในความคิดของคน ไม่ใช่ตัดสินจากอาวุโส ส่วนการไม่กล้าตักเตือนเรื่องความปลอดภัยไม่ใช่ความเคารพ แต่เป็นการละเลย", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 61, "q": "พฤติกรรมใดแสดงถึงความเป็น 'สมาชิกที่ดีของทีม' ในช่วงเวลาที่งานกดดันสูง?", "choices": ["การทำงานเฉพาะส่วนของตนเองและหลบหน้าสมาชิกคนอื่น", "การรักษาสติ คอยให้กำลังใจทีม และอาสาทำหน้าที่เสริมตามความจำเป็น", "การบ่นเรื่องภาระงานให้ผู้อื่นฟังเพื่อระบายความเครียด", "การรีบทำงานให้เสร็จหยาบๆ เพื่อจะได้เลิกงานเร็วขึ้น", "การรอฟังคำสั่งเพียงอย่างเดียวโดยไม่ขยับตัวทำอะไรก่อน"], "answer": 1, "explanation": "ในภาวะกดดัน สมาชิกที่ดีจะรักษาสติ (ควบคุมอารมณ์) เป็นกำลังใจให้ทีม และมีความคิดริเริ่มอาสาช่วยงานเสริมที่จำเป็น ซึ่งช่วยพยุงทั้งขวัญกำลังใจและผลงานของทีมในช่วงวิกฤต", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 62, "q": "การทำ 'Customer Journey Mapping' ช่วยให้สมาชิกในทีมเข้าใจความต้องการของผู้รับบริการอย่างไร?", "choices": ["ช่วยให้รู้ว่าลูกค้าแต่ละคนมีรายได้เท่าไหร่", "ช่วยให้เห็นภาพรวมของประสบการณ์ลูกค้าตั้งแต่ต้นจนจบและจุดที่ต้องปรับปรุง", "ช่วยในการกำหนดราคาขายให้แพงที่สุด", "ช่วยให้รู้ว่าพนักงานคนไหนแอบอู้งานระหว่างบริการ", "ช่วยลดจำนวนลูกค้าให้น้อยลงเพื่อจะได้ทำงานสบายขึ้น"], "answer": 1, "explanation": "Customer Journey Map คือแผนภาพเส้นทางประสบการณ์ของลูกค้าตั้งแต่ก่อนใช้บริการจนหลังใช้บริการ ทำให้ทีมเห็นจุดสัมผัส (Touchpoint) และจุดที่ลูกค้าติดขัด (Pain Point) เพื่อนำมาปรับปรุงบริการได้ตรงจุด", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 63, "q": "ในการสื่อสารภายในทีม ข้อใดคือความหมายของการสื่อสาร 'อย่างมีประสิทธิภาพ'?", "choices": ["ผู้ส่งสารพูดให้ดังที่สุดเพื่อให้ทุกคนได้ยิน", "ผู้รับสารสามารถเข้าใจเนื้อหาได้ถูกต้องและนำไปปฏิบัติงานต่อได้ทันที", "การสื่อสารที่มีการใช้ศัพท์เทคนิคขั้นสูงเพื่อให้ดูมีความรู้", "การส่งข้อความจำนวนมากๆ เพื่อให้ทุกคนได้รับข้อมูลล้นเหลือ", "การสื่อสารทางเดียวจากหัวหน้างานสู่ลูกน้องเท่านั้น"], "answer": 1, "explanation": "ประสิทธิภาพของการสื่อสารวัดที่ 'ผู้รับสาร' คือรับสารแล้วเข้าใจถูกต้องตรงตามเจตนาและนำไปปฏิบัติต่อได้ ไม่ได้วัดที่ความดัง ปริมาณข้อความ หรือความหรูหราของศัพท์", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 64, "q": "การสร้างสัมพันธ์ในทีมผ่านกิจกรรมกลุ่มสัมพันธ์ (Team Building) จะล้มเหลวที่สุดหากเกิดสถานการณ์ใด?", "choices": ["กิจกรรมนั้นจัดขึ้นนอกสถานที่ทำงาน", "กิจกรรมนั้นมีแต่เกมสนุกสนานแต่ไม่มีการเชื่อมโยงกลับมาสู่การทำงานจริง", "พนักงานบางคนแต่งกายไม่เหมาะสมมาทำกิจกรรม", "งบประมาณในการจัดกิจกรรมมีจำกัด", "มีฝนตกหนักระหว่างทำกิจกรรมกลางแจ้ง"], "answer": 1, "explanation": "เป้าหมายที่แท้จริงของ Team Building คือการนำบทเรียนจากกิจกรรมกลับมาใช้ในการทำงานร่วมกัน หากมีแต่ความสนุกโดยไม่ถอดบทเรียนเชื่อมโยงสู่งานจริง กิจกรรมนั้นก็ไม่สร้างการเปลี่ยนแปลงใดๆ ถือว่าล้มเหลวในเชิงวัตถุประสงค์", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 65, "q": "พฤติกรรม 'สอนงาน' (Coaching) ระหว่างเพื่อนร่วมงาน ช่วยส่งเสริมการแลกเปลี่ยนเรียนรู้ อย่างไร?", "choices": ["ช่วยให้พนักงานเก่าไม่ต้องทำงานหนักอีกต่อไป", "ช่วยสร้างมาตรฐานฝีมือแรงงานให้เท่าเทียมกันและลดความเสี่ยงจากการทำงาน", "ช่วยให้พนักงานใหม่เกิดความเกรงกลัวพนักงานเก่า", "ช่วยให้หัวหน้างานสามารถลดจำนวนพนักงานลงได้", "ช่วยเพิ่มชั่วโมงการทำงานให้มากขึ้นเพื่อทำโอที"], "answer": 1, "explanation": "การสอนงานถ่ายทอดทักษะและเทคนิคที่ถูกต้องให้ทั่วถึงกัน ทำให้ฝีมือของทีมได้มาตรฐานเดียวกัน ลดข้อผิดพลาดและอุบัติเหตุจากการทำงานที่ไม่ถูกวิธี ซึ่งเป็นผลลัพธ์โดยตรงของการแลกเปลี่ยนเรียนรู้", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 66, "q": "หากคุณมีเทคนิคการซ่อมเครื่องจักรที่รวดเร็วกว่าคนอื่น พฤติกรรมใดแสดงถึง 'การแลกเปลี่ยนเรียนรู้' ที่ดี?", "choices": ["เก็บเป็นความลับสุดยอดเพื่อใช้เลื่อนตำแหน่ง", "จัดเตรียมคู่มือหรือวิดีโอสาธิตง่ายๆ แล้วแบ่งปันให้ทุกคนในทีมได้ลองทำตาม", "พูดอวดในที่ประชุมบ่อยๆ ว่าตนเองเก่งกว่าคนอื่น", "รอให้หัวหน้างานสั่งให้มาสอนคนอื่นเท่านั้น", "เสนอขายเทคนิคนี้ให้กับบริษัทคู่แข่ง"], "answer": 1, "explanation": "การแปลงความรู้ฝังลึก (Tacit Knowledge) ให้เป็นความรู้ชัดแจ้ง (Explicit Knowledge) เช่น คู่มือหรือวิดีโอสาธิต แล้วแบ่งปันให้ทีมนำไปฝึกตาม เป็นการแลกเปลี่ยนเรียนรู้เชิงรุกที่ยกระดับความสามารถของทั้งทีม", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 67, "q": "การใช้วาจา 'สุภาพและให้เกียรติ' สำคัญต่อการประสานงานภายในทีมอย่างไร?", "choices": ["เพื่อให้ดูเป็นคนดีในสายตาของคนภายนอก", "ช่วยลดกำแพงทางใจและสร้างบรรยากาศที่พนักงานกล้าสื่อสารอย่างเปิดเผย", "เพื่อให้หัวหน้างานชื่นชมว่าเรามีมารยาทดี", "เพื่อหลีกเลี่ยงการโดนทำร้ายร่างกายจากเพื่อนร่วมงาน", "เพื่อประชดพนักงานคนอื่นที่ใช้วาจาไม่สุภาพ"], "answer": 1, "explanation": "วาจาสุภาพและให้เกียรติสร้างความรู้สึกปลอดภัยทางจิตใจ ลดกำแพงระหว่างกัน ทำให้สมาชิกกล้าพูด กล้าถาม กล้าเสนอความเห็นอย่างเปิดเผย ซึ่งเป็นหัวใจของการประสานงานที่มีประสิทธิภาพ", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 68, "q": "เมื่อสมาชิกในทีมนำเสนอไอเดียที่คุณคิดว่า 'เป็นไปไม่ได้' คุณควรตอบสนองอย่างไร?", "choices": ["หัวเราะเยาะในความคิดที่ดูไร้สาระนั้น", "รับฟังและชวนวิเคราะห์ถึงจุดดีและข้อจำกัดของไอเดียนั้นอย่างเป็นกลาง", "นิ่งเฉยและรอให้คนอื่นเป็นคนคัดค้านแทน", "บอกทันทีว่าทำไม่ได้แน่นอนโดยไม่ต้องฟังจนจบ", "แอบนำไอเดียนั้นไปบอกหัวหน้าว่าเพื่อนร่วมงานคนนี้คิดอะไรประหลาดๆ"], "answer": 1, "explanation": "การรับฟังจนจบแล้วชวนกันวิเคราะห์ทั้งจุดแข็งและข้อจำกัดอย่างเป็นกลาง เป็นการเคารพความคิดเห็นและรักษาบรรยากาศสร้างสรรค์ ไอเดียที่ดูเป็นไปไม่ได้ในตอนแรกอาจมีบางส่วนที่นำมาพัฒนาต่อได้", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 69, "q": "ข้อใดเป็นหัวใจของการ 'รู้และเข้าใจความต้องการของผู้รับบริการ' ในระยะยาว?", "choices": ["การทำตามคำสั่งลูกค้าเพียงอย่างเดียวโดยไม่สงสัย", "การสังเกตพฤติกรรมและการเก็บข้อมูลสถิติเพื่อพยากรณ์ความต้องการในอนาคต", "การพยายามขายสินค้าที่บริษัทมีกำไรสูงสุดให้ลูกค้า", "การเปลี่ยนพนักงานบริการบ่อยๆ เพื่อความสดใหม่", "การจัดโปรโมชั่นลดราคาตลอดทั้งปี"], "answer": 1, "explanation": "การเข้าใจลูกค้าในระยะยาวต้องอาศัยข้อมูล คือการสังเกตพฤติกรรมและเก็บสถิติอย่างต่อเนื่อง เพื่อวิเคราะห์แนวโน้มและพยากรณ์ความต้องการล่วงหน้า ทำให้ปรับปรุงบริการได้ก่อนที่ลูกค้าจะร้องขอ", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 70, "q": "ความสำเร็จของการทำงานเป็นทีม (Teamwork) วัดจากสิ่งใดมากที่สุด?", "choices": ["ปริมาณงานที่ทำเสร็จต่อวันโดยไม่สนใจคุณภาพ", "การบรรลุเป้าหมายขององค์กรพร้อมกับความพึงพอใจของสมาชิกในทีมและลูกค้า", "การที่สมาชิกในทีมทุกคนไม่เคยทะเลาะกันเลย", "การที่ทุกคนได้รับรางวัลพนักงานดีเด่นพร้อมกัน", "การมีงบประมาณเหลือใช้มหาศาลหลังจบงาน"], "answer": 1, "explanation": "ความสำเร็จของทีมต้องวัดทั้งด้านผลงาน (บรรลุเป้าหมายองค์กร) และด้านคน (ความพึงพอใจของสมาชิกและลูกค้า) ควบคู่กัน ทีมที่งานสำเร็จแต่คนหมดไฟหรือลูกค้าไม่พอใจ ไม่ถือว่าประสบความสำเร็จอย่างแท้จริง", "section": "ชุดที่ 2 (ระดับกลาง)"}, {"n": 71, "q": "ทีมงานต้องส่งมอบงานให้ลูกค้าภายในพรุ่งนี้ แต่สมาชิกสองคนกำลังขัดแย้งกันอย่างรุนแรงเรื่องแนวทางการทำงานจนงานหยุดชะงัก ในฐานะหัวหน้าทีม ควรดำเนินการอย่างไรเป็นลำดับแรก?", "choices": ["สั่งให้ทั้งสองหยุดเถียงกันและใช้แนวทางของหัวหน้าทีมทันทีเพื่อไม่ให้เสียเวลา", "แยกให้ทั้งสองไปทำงานคนละส่วนโดยไม่ต้องเจอกันจนกว่าจะส่งงานเสร็จ", "เรียกทั้งสองมาพูดคุยโดยให้แต่ละฝ่ายอธิบายเหตุผล แล้วร่วมกันเลือกแนวทางที่ตอบโจทย์เป้าหมายงานและกำหนดส่งมากที่สุด", "แจ้งลูกค้าขอเลื่อนกำหนดส่งออกไปก่อนเพื่อให้มีเวลาแก้ปัญหาภายในทีมอย่างรอบคอบ", "ให้สมาชิกที่เหลือโหวตเลือกแนวทางของฝ่ายใดฝ่ายหนึ่งเพื่อยุติข้อขัดแย้งโดยเร็ว"], "answer": 2, "explanation": "การขจัดความขัดแย้งที่ดีต้องเปิดโอกาสให้ทั้งสองฝ่ายชี้แจงเหตุผล แล้วใช้เป้าหมายส่วนรวมและเงื่อนไขเวลาเป็นเกณฑ์ตัดสิน ส่วนการใช้อำนาจสั่ง แยกคน หรือโหวต เป็นการกดปัญหาไว้โดยไม่ได้แก้ที่สาเหตุ", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 72, "q": "ในที่ประชุมทีม หัวหน้าตำหนิผลงานของเราอย่างตรงไปตรงมาต่อหน้าเพื่อนร่วมงานจนรู้สึกเสียหน้า แต่ข้อตำหนิบางส่วนเป็นความจริง การตอบสนองในข้อใดเหมาะสมที่สุด?", "choices": ["รับฟังอย่างสงบ ขอบคุณสำหรับข้อสังเกต แล้วขอคุยรายละเอียดเพิ่มเติมหลังประชุมเพื่อหาแนวทางปรับปรุง", "ชี้แจงโต้แย้งทันทีในที่ประชุมเพื่อรักษาความน่าเชื่อถือของตนเองต่อหน้าเพื่อนร่วมงาน", "ยอมรับผิดทุกประเด็นทั้งที่บางเรื่องไม่ใช่ความผิดของเรา เพื่อให้เรื่องจบโดยเร็ว", "นิ่งเงียบในที่ประชุม แล้วไปเล่าให้เพื่อนสนิทฟังว่าหัวหน้าไม่ยุติธรรม", "ทำหนังสือร้องเรียนถึงผู้บริหารว่าหัวหน้าตำหนิพนักงานในที่ประชุมอย่างไม่เหมาะสม"], "answer": 0, "explanation": "การรับ feedback อย่างมืออาชีพคือฟังโดยไม่ตอบโต้ด้วยอารมณ์ แยกข้อเท็จจริงออกจากความรู้สึกเสียหน้า และหาโอกาสคุยส่วนตัวเพื่อทำความเข้าใจและปรับปรุง ส่วนการโต้แย้งทันที ยอมรับทุกอย่าง หรือไปนินทา ล้วนไม่ช่วยพัฒนางาน", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 73, "q": "ลูกค้าโทรมาเร่งงานที่ทีมรับปากไว้ แต่ขณะนั้นทีมกำลังมีปัญหาภายในเพราะสมาชิกหลักลาป่วยกะทันหันทำให้งานล่าช้ากว่าแผนมาก ผู้ประสานงานควรสื่อสารกับลูกค้าอย่างไรจึงจะเหมาะสมที่สุด?", "choices": ["ยืนยันกับลูกค้าว่างานจะเสร็จตามกำหนดเดิมเพื่อรักษาความเชื่อมั่น แล้วค่อยหาทางแก้ปัญหาภายหลัง", "เล่ารายละเอียดปัญหาภายในทีมทั้งหมดให้ลูกค้าฟังเพื่อแสดงความโปร่งใสและขอความเห็นใจ", "บอกลูกค้าให้ติดต่อหัวหน้าทีมโดยตรงเพราะตนเองไม่มีอำนาจตัดสินใจเรื่องกำหนดส่งงาน", "แจ้งลูกค้าตามจริงว่างานอาจล่าช้า พร้อมเสนอทางเลือก เช่น ส่งมอบส่วนที่จำเป็นเร่งด่วนก่อน และแจ้งกำหนดส่วนที่เหลือที่ทำได้จริง", "ขอให้ลูกค้าเลื่อนกำหนดออกไปโดยให้เหตุผลว่าเป็นเหตุสุดวิสัยที่ทีมไม่ต้องรับผิดชอบ"], "answer": 3, "explanation": "การเข้าใจความต้องการของผู้รับบริการคือรู้ว่าลูกค้าต้องการความชัดเจนและงานส่วนที่จำเป็นก่อน การแจ้งตามจริงพร้อมเสนอทางเลือกที่ทำได้จริงจึงรักษาทั้งความเชื่อมั่นและประโยชน์ของลูกค้า ต่างจากการรับปากเกินจริงหรือโยนปัญหาให้ผู้อื่น", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 74, "q": "สมาชิกใหม่ในทีมมีความรู้เทคโนโลยีสมัยใหม่ดีมาก แต่ถูกสมาชิกอาวุโสมองว่าอวดรู้และไม่ยอมรับฟังวิธีทำงานแบบเดิม ทำให้ทั้งสองฝ่ายไม่แลกเปลี่ยนความรู้กัน ในฐานะสมาชิกทีมที่เห็นปัญหานี้ ควรทำอย่างไรจึงเกิดประโยชน์ต่อทีมมากที่สุด?", "choices": ["แนะนำสมาชิกใหม่ให้ลดบทบาทลงและทำตามวิธีของรุ่นพี่ไปก่อนจนกว่าจะได้รับการยอมรับ", "แนะนำสมาชิกอาวุโสว่าควรเปิดใจเพราะความรู้เดิมกำลังล้าสมัยและอาจถูกแทนที่", "เสนอให้จัดกิจกรรมแลกเปลี่ยนเรียนรู้ที่ให้ทั้งสองฝ่ายผลัดกันสอนสิ่งที่ตนถนัด เพื่อให้เห็นคุณค่าของกันและกัน", "รายงานหัวหน้าให้แยกทั้งสองคนไปอยู่คนละงานเพื่อลดโอกาสกระทบกระทั่ง", "ปล่อยให้เวลาช่วยแก้ปัญหาเพราะเมื่อทำงานด้วยกันนานขึ้นจะปรับตัวเข้าหากันเอง"], "answer": 2, "explanation": "การแลกเปลี่ยนเรียนรู้ในทีมเกิดขึ้นได้เมื่อทุกฝ่ายเห็นคุณค่าของกันและกัน การให้ผลัดกันเป็นผู้สอนทำให้ทั้งความรู้ใหม่และประสบการณ์เดิมถูกนำมาใช้ร่วมกัน ส่วนการให้ฝ่ายใดฝ่ายหนึ่งยอมหรือแยกกันทำงานเป็นการเสียโอกาสของทีม", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 75, "q": "ทีมได้รับมอบหมายงานเร่งด่วน หัวหน้าทีมตัดสินใจเลือกแนวทางหนึ่งซึ่งเราเห็นว่ามีจุดอ่อนสำคัญที่อาจทำให้งานเสียหาย แต่ที่ประชุมส่วนใหญ่เห็นด้วยกับหัวหน้าแล้ว ผู้ตามที่ดีควรทำอย่างไร?", "choices": ["ปฏิบัติตามมติทันทีโดยไม่แสดงความเห็น เพราะผู้ตามที่ดีต้องเชื่อฟังผู้นำในทุกกรณี", "ปฏิบัติตามแนวทางของตนเองอย่างเงียบ ๆ เพราะมั่นใจว่าจะช่วยให้งานไม่เสียหาย", "ขอถอนตัวจากงานนี้เพื่อไม่ต้องรับผิดชอบต่อความเสียหายที่อาจเกิดขึ้น", "รอให้ปัญหาเกิดขึ้นจริงก่อนแล้วจึงชี้ให้ที่ประชุมเห็นว่าเราเคยทักท้วงไว้แล้ว", "แสดงข้อกังวลพร้อมเหตุผลและข้อมูลอย่างสร้างสรรค์ในที่ประชุม แต่หากมติยังคงเดิมก็ปฏิบัติตามอย่างเต็มความสามารถพร้อมช่วยเฝ้าระวังจุดอ่อนนั้น"], "answer": 4, "explanation": "ผู้ตามที่ดีไม่ใช่ผู้ที่เชื่อฟังโดยไม่คิด แต่กล้าท้วงติงด้วยเหตุผลก่อนตัดสินใจ และเมื่อทีมมีมติแล้วก็สนับสนุนอย่างเต็มที่พร้อมช่วยลดความเสี่ยง การเงียบ แอบทำตามใจตน หรือรอให้พังเพื่อพิสูจน์ตัวเอง ล้วนทำร้ายทีม", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 76, "q": "ในการประชุมทีมเพื่อตัดสินใจเรื่องสำคัญ สมาชิกคนหนึ่งพูดยาวและวนซ้ำจนกินเวลาผู้อื่น ขณะที่สมาชิกอีกสองคนไม่กล้าแสดงความเห็นเลยทั้งที่รับผิดชอบงานส่วนนั้นโดยตรง ประธานที่ประชุมควรทำอย่างไร?", "choices": ["สรุปประเด็นของผู้ที่พูดยาวอย่างสุภาพเพื่อปิดประเด็น แล้วเชิญผู้ที่รับผิดชอบโดยตรงแสดงความเห็นทีละคน", "ปล่อยให้ทุกคนพูดตามความสมัครใจต่อไป เพราะการบังคับให้พูดจะทำให้บรรยากาศตึงเครียด", "ตัดบทผู้ที่พูดยาวทันทีว่าหมดเวลา แล้วรีบสรุปมติตามความเห็นที่มีอยู่เพื่อให้ประชุมจบตรงเวลา", "เลื่อนการตัดสินใจออกไปประชุมครั้งหน้าเพื่อให้ทุกคนมีเวลาเตรียมความเห็นมากขึ้น", "ขอความเห็นเฉพาะจากผู้ที่พูดเก่งเพราะเป็นผู้ที่มีข้อมูลพร้อมนำเสนอมากที่สุด"], "answer": 0, "explanation": "ประธานที่ดีต้องบริหารเวลาและเปิดพื้นที่ให้ทุกฝ่ายที่เกี่ยวข้องได้แสดงความเห็น การสรุปปิดประเด็นอย่างสุภาพและเชิญผู้รับผิดชอบตรงให้พูด ทำให้การตัดสินใจได้ข้อมูลครบโดยไม่เสียบรรยากาศ ส่วนการปล่อยไหล ตัดบทหยาบ หรือเลื่อนประชุม ไม่แก้ปัญหาที่แท้จริง", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 77, "q": "เราพบว่าเพื่อนร่วมทีมทำงานผิดขั้นตอนซึ่งจะกระทบคุณภาพงานที่ส่งให้ลูกค้า แต่เขาเป็นคนอ่อนไหวต่อคำวิจารณ์และเคยไม่พอใจเมื่อถูกทักท้วงต่อหน้าผู้อื่น ควรให้ feedback อย่างไรจึงได้ผลที่สุด?", "choices": ["ทักท้วงในกลุ่มแชทของทีมทันทีเพื่อให้ทุกคนช่วยกันตรวจสอบและป้องกันความผิดพลาดซ้ำ", "แก้ไขงานส่วนที่ผิดให้เองโดยไม่บอกเขา เพื่อรักษาน้ำใจและให้งานถูกต้องทันเวลา", "แจ้งหัวหน้าให้เป็นผู้ตักเตือนแทน เพราะเป็นหน้าที่ของหัวหน้าไม่ใช่เพื่อนร่วมงาน", "พูดคุยเป็นการส่วนตัว ชี้ให้เห็นผลกระทบต่องานอย่างเป็นรูปธรรมโดยไม่ตำหนิตัวบุคคล และร่วมกันหาวิธีแก้ไข", "รอประเมินผลงานปลายปีแล้วค่อยระบุข้อบกพร่องนี้ในแบบประเมินอย่างเป็นทางการ"], "answer": 3, "explanation": "การให้ feedback ที่ดีควรทำเป็นการส่วนตัว เน้นที่พฤติกรรมและผลกระทบต่องานไม่ใช่ตัวบุคคล และชวนหาทางแก้ร่วมกัน การประจานในแชท แอบแก้ให้ หรือเก็บไว้ว่าตอนประเมิน ล้วนทำลายความสัมพันธ์หรือปล่อยให้ปัญหาซ้ำรอย", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 78, "q": "ทีมประกอบด้วยสมาชิกจากหลายแผนกที่ไม่เคยทำงานร่วมกันมาก่อน ต่างฝ่ายต่างระวังตัวและปกป้องผลประโยชน์ของแผนกตนจนงานส่วนรวมไม่คืบหน้า ผู้ประสานงานควรเริ่มต้นสร้างความร่วมมืออย่างไร?", "choices": ["กำหนดบทลงโทษชัดเจนสำหรับแผนกที่ไม่ให้ความร่วมมือเพื่อบังคับให้ทุกฝ่ายทำงาน", "จัดประชุมร่วมเพื่อกำหนดเป้าหมายส่วนรวมที่ทุกแผนกได้ประโยชน์ พร้อมตกลงบทบาทและผลที่แต่ละฝ่ายจะได้รับอย่างเปิดเผย", "เจรจากับแต่ละแผนกแบบลับ ๆ ทีละฝ่าย โดยเสนอผลประโยชน์พิเศษให้แผนกที่ยอมร่วมมือก่อน", "เลือกทำงานกับแผนกที่ให้ความร่วมมือดีไปก่อน ส่วนแผนกที่แข็งขืนค่อยดึงเข้ามาภายหลัง", "รายงานผู้บริหารระดับสูงให้ออกคำสั่งบังคับทุกแผนกส่งตัวแทนมาทำงานอย่างจริงจัง"], "answer": 1, "explanation": "การประสานประโยชน์ที่ยั่งยืนต้องทำให้ทุกฝ่ายเห็นเป้าหมายร่วมและรู้ว่าตนได้ประโยชน์อะไรอย่างโปร่งใส การบังคับ ลงโทษ หรือเจรจาลับ อาจได้ความร่วมมือชั่วคราวแต่ทำลายความไว้วางใจระยะยาว", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 79, "q": "สมาชิกในทีมคนหนึ่งเพิ่งสูญเสียบุคคลในครอบครัว ทำให้ประสิทธิภาพการทำงานลดลงในช่วงที่ทีมมีงานเร่ง สมาชิกบางคนเริ่มบ่นว่าไม่ยุติธรรมที่ต้องรับภาระแทน การกระทำของหัวหน้าทีมในข้อใดสร้างทั้งความสัมพันธ์และผลงานได้ดีที่สุด?", "choices": ["ให้สมาชิกคนนั้นหยุดงานยาวไปเลยจนกว่าจะพร้อม แล้วเกลี่ยงานทั้งหมดให้คนที่เหลือรับผิดชอบ", "ปฏิบัติกับทุกคนเท่ากันโดยไม่ลดปริมาณงานของใคร เพื่อไม่ให้สมาชิกคนอื่นรู้สึกว่าไม่ยุติธรรม", "แสดงความเห็นใจเป็นการส่วนตัว ปรับลดงานของเขาชั่วคราวในส่วนที่วิกฤต พร้อมสื่อสารให้ทีมเข้าใจเหตุผลและชื่นชมผู้ที่ช่วยรับภาระ", "จ้างพนักงานชั่วคราวมาทำแทนทันทีเพื่อไม่ให้กระทบทั้งงานและความรู้สึกของสมาชิกคนอื่น", "แจ้งสมาชิกคนนั้นว่าเข้าใจสถานการณ์ แต่ขอให้แยกเรื่องส่วนตัวออกจากงานในช่วงที่ทีมกำลังเร่ง"], "answer": 2, "explanation": "หัวหน้าที่ดีต้องสมดุลระหว่างความเห็นอกเห็นใจกับผลงานของทีม การช่วยเหลือชั่วคราวพร้อมสื่อสารเหตุผลอย่างเปิดเผยและให้เกียรติผู้รับภาระเพิ่ม ทำให้ทีมรู้สึกยุติธรรมและผูกพันกัน ส่วนการเพิกเฉยต่อความรู้สึกหรือปล่อยภาระโดยไม่อธิบายจะบั่นทอนทีม", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}, {"n": 80, "q": "หลังจบโครงการ ทีมพบว่างานสำเร็จแต่เกิดข้อผิดพลาดซ้ำหลายจุดเหมือนโครงการก่อนหน้า สมาชิกส่วนใหญ่อยากรีบปิดงานไปพักผ่อน และบางคนกลัวว่าการทบทวนจะกลายเป็นการกล่าวโทษกัน หัวหน้าทีมควรทำอย่างไรเพื่อให้เกิดการเรียนรู้ร่วมกันอย่างแท้จริง?", "choices": ["ยกเลิกการประชุมทบทวนเพื่อรักษาบรรยากาศ แล้วสรุปบทเรียนด้วยตนเองส่งให้ทุกคนอ่าน", "จัดประชุมทบทวนเฉพาะจุดที่ผิดพลาด และให้ผู้ที่ทำผิดพลาดแต่ละจุดชี้แจงต่อทีมเพื่อความรับผิดชอบ", "เลื่อนการทบทวนออกไปหลายเดือนเพื่อให้ทุกคนหายเหนื่อยและอารมณ์เย็นลงก่อน", "บันทึกข้อผิดพลาดไว้ในรายงานปิดโครงการโดยไม่ระบุชื่อ แล้วส่งต่อให้ทีมโครงการถัดไปอ่านเอาเอง", "จัดประชุมถอดบทเรียนสั้น ๆ โดยตั้งกติกาว่าเน้นหาสาเหตุเชิงระบบไม่กล่าวโทษบุคคล ให้ทุกคนเสนอทั้งจุดแข็งและจุดควรปรับ แล้วบันทึกเป็นแนวปฏิบัติสำหรับโครงการหน้า"], "answer": 4, "explanation": "การแลกเปลี่ยนเรียนรู้ที่แท้จริงต้องทำขณะข้อมูลยังสด โดยสร้างบรรยากาศปลอดภัยที่เน้นสาเหตุเชิงระบบไม่ใช่ตัวบุคคล และแปลงบทเรียนเป็นแนวปฏิบัติ ส่วนการยกเลิก เลื่อนออกไปนาน หรือให้คนผิดชี้แจงรายคน จะทำให้ไม่เกิดการเรียนรู้หรือกลายเป็นการกล่าวโทษ", "section": "ชุดเสริมระดับยาก (ข้อ 71-80)"}]}]};</script>
<script>
"use strict";
/* ================= state & storage ================= */
const $ = id => document.getElementById(id);
const store = {
  get(){ try{return JSON.parse(localStorage.getItem("vnet-stats"))||{}}catch(e){return{}} },
  set(d){ localStorage.setItem("vnet-stats", JSON.stringify(d)) }
};
let S = null;         // current quiz session
let timerInt = null;
let muted = localStorage.getItem("vnet-muted")==="1";

/* ================= sounds (WebAudio) ================= */
let actx = null;
function beep(freqs, dur=0.12, type="sine", vol=0.15){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, actx.currentTime + i*dur);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (i+1)*dur);
      o.connect(g).connect(actx.destination);
      o.start(actx.currentTime + i*dur); o.stop(actx.currentTime + (i+1)*dur + .02);
    });
  }catch(e){}
}
const sndGood = ()=>beep([660,880],0.1,"sine",.12);
const sndBad  = ()=>beep([220,180],0.15,"square",.06);
const sndWin  = ()=>beep([523,659,784,1047],0.14,"sine",.14);
const sndClick= ()=>beep([440],0.05,"sine",.05);
function toggleMute(){ muted=!muted; localStorage.setItem("vnet-muted",muted?"1":"0"); $("mutebtn").textContent = muted?"🔇":"🔊"; }

/* ================= home ================= */
function renderHome(){
  const st = store.get();
  const myIds = new Set([...EXAM_DATA.subjects.map(s=>s.id), "mix"]);
  let answered=0, correct=0;
  for(const k in (st.log||{})){ if(!myIds.has(k)) continue; answered += st.log[k].a; correct += st.log[k].c; }
  $("st-total").textContent = EXAM_DATA.subjects.reduce((s,x)=>s+x.questions.length,0);
  $("st-answered").textContent = answered;
  $("st-acc").textContent = answered ? Math.round(correct/answered*100)+"%" : "—";
  $("st-streak").textContent = st.maxStreak||0;

  const g = $("subjects"); g.innerHTML = "";
  EXAM_DATA.subjects.forEach(s=>{
    const best = (st.best||{})[s.id];
    const b = document.createElement("button");
    b.className = "subj";
    b.innerHTML = `<div class="ic">${s.icon}</div><h3>${s.title}</h3><div class="sub">${s.subtitle}</div>
      <div class="meta"><span class="badge">${s.questions.length} ข้อ</span>
      <span class="best">${best!=null ? "🏆 "+best+"%" : "ยังไม่เคยทำ"}</span></div>`;
    b.onclick = ()=>openSetup(s.id);
    g.appendChild(b);
  });
  if(EXAM_DATA.subjects.length < 2) return;
  const grandTotal = EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0);
  const mix = document.createElement("button");
  mix.className = "subj mix";
  const mixBest = (st.best||{})["mix"];
  mix.innerHTML = `<div class="ic">🎲</div><h3>จับฉลากรวมทุกชุด</h3><div class="sub">สุ่มคละจากทั้ง ${grandTotal} ข้อ</div>
    <div class="meta"><span class="badge">ท้าทาย!</span><span class="best">${mixBest!=null?"🏆 "+mixBest+"%":"ยังไม่เคยทำ"}</span></div>`;
  mix.onclick = ()=>openSetup("mix");
  g.appendChild(mix);
}

/* ================= setup modal ================= */
let setup = {n:20, mode:"practice", shuffleQ:true, shuffleC:false, subj:null};
function openSetup(id){
  sndClick();
  setup.subj = id;
  const s = id==="mix" ? {title:"จับฉลากรวมทุกวิชา", subtitle:"คละทุกสมรรถนะ", icon:"🎲",
      questions:{length:EXAM_DATA.subjects.reduce((a,x)=>a+x.questions.length,0)}}
    : EXAM_DATA.subjects.find(x=>x.id===id);
  const total = s.questions.length;
  const counts = [10,20,30,total>=100?50:total].filter((v,i,a)=>v<=total && a.indexOf(v)===i);
  if(!counts.includes(total) && total<=60) counts.push(total);
  setup.n = counts.includes(20)?20:counts[0];
  if(id==="mix") setup.shuffleQ = true;
  $("modal-root").innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeSetup()">
    <div class="modal">
      <h2>${s.icon} ${s.title}</h2>
      <div class="sub">${s.subtitle} • มีทั้งหมด ${total} ข้อ</div>
      <div class="optlabel">โหมด</div>
      <div class="optrow" id="mode-row">
        <button class="opt ${setup.mode==="practice"?"sel":""}" onclick="setMode('practice')">📖 ฝึกฝน (เฉลยทันที)</button>
        <button class="opt ${setup.mode==="exam"?"sel":""}" onclick="setMode('exam')">⏱️ สอบเสมือนจริง</button>
      </div>
      <div class="optlabel">จำนวนข้อ</div>
      <div class="optrow" id="count-row">
        ${counts.map(c=>`<button class="opt ${c===setup.n?"sel":""}" onclick="setCount(${c})">${c===total?"ทั้งหมด ("+c+")":c}</button>`).join("")}
      </div>
      <div class="toggle ${setup.shuffleQ?"on":""}" id="tg-q" onclick="tog('shuffleQ','tg-q')"><span class="box">${setup.shuffleQ?"✓":""}</span> สุ่มลำดับข้อ</div>
      <div class="toggle ${setup.shuffleC?"on":""}" id="tg-c" onclick="tog('shuffleC','tg-c')"><span class="box">${setup.shuffleC?"✓":""}</span> สุ่มลำดับตัวเลือก</div>
      <div class="mrow">
        <button class="btn ghost" onclick="closeSetup()">ยกเลิก</button>
        <button class="btn primary" onclick="startQuiz()">เริ่มเลย 🚀</button>
      </div>
    </div>
  </div>`;
}
function setMode(m){ setup.mode=m; document.querySelectorAll("#mode-row .opt").forEach((b,i)=>b.classList.toggle("sel",(i===0)===(m==="practice"))); sndClick(); }
function setCount(c){ setup.n=c; document.querySelectorAll("#count-row .opt").forEach(b=>b.classList.toggle("sel",b.textContent.includes("("+c+")")||b.textContent.trim()==String(c))); sndClick(); }
function tog(key,id){ setup[key]=!setup[key]; const el=$(id); el.classList.toggle("on",setup[key]); el.querySelector(".box").textContent = setup[key]?"✓":""; sndClick(); }
function closeSetup(){ $("modal-root").innerHTML=""; }

/* ================= quiz engine ================= */
function shuffled(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

function startQuiz(){
  closeSetup();
  let pool, labels;
  if(setup.subj==="mix"){
    pool = EXAM_DATA.subjects.flatMap(s=>s.questions.map(q=>({...q, labels:s.labels, from:s.icon+" "+s.title})));
    labels = null;
  } else {
    const s = EXAM_DATA.subjects.find(x=>x.id===setup.subj);
    pool = s.questions.map(q=>({...q, labels:s.labels, from:""}));
  }
  if(setup.shuffleQ) pool = shuffled(pool);
  pool = pool.slice(0, setup.n);
  pool = pool.map(q=>{
    let idx = q.choices.map((_,i)=>i);
    if(setup.shuffleC) idx = shuffled(idx);
    return {...q, order:idx, picked:null, removed:[]};
  });
  S = { qs:pool, i:0, correct:0, streak:0, maxStreak:0, fifty:3, mode:setup.mode,
        subj:setup.subj, start:Date.now(), done:false };
  $("home").classList.add("hidden"); $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  $("mutebtn").textContent = muted?"🔇":"🔊";
  $("palette").classList.toggle("hidden", S.mode!=="exam");
  clearInterval(timerInt);
  timerInt = setInterval(()=>{ const t=Math.floor((Date.now()-S.start)/1000);
    $("q-timer").textContent = String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); },500);
  renderQ();
  window.scrollTo(0,0);
}

function renderQ(){
  const q = S.qs[S.i];
  $("q-count").textContent = `${S.i+1}/${S.qs.length}`;
  $("q-score").textContent = `✅ ${S.correct}`;
  $("q-streak").textContent = `🔥 ${S.streak}`;
  $("q-progress").style.width = (S.i/S.qs.length*100)+"%";
  $("q-section").textContent = q.from || q.section || "";
  stopSpeech();
  const audio = parseAudio(q.q);
  $("q-text").textContent = `${S.i+1}. ${audio ? audio.question : q.q}`;
  renderAudioBox(audio, q);
  $("q-expl").innerHTML = "";
  $("nextbtn").classList.add("hidden");
  $("skipbtn").classList.toggle("hidden", S.mode!=="exam");
  $("submitbtn").classList.add("hidden");
  $("fifty").classList.toggle("hidden", S.mode!=="practice");
  $("fifty").disabled = S.fifty<=0;
  $("fifty-n").textContent = "×"+S.fifty;

  const c = $("q-choices"); c.innerHTML = "";
  q.order.forEach((origIdx,pos)=>{
    const b = document.createElement("button");
    b.className = "choice";
    if(q.removed.includes(origIdx)) b.classList.add("dim");
    b.innerHTML = `<span class="lb">${q.labels[pos]}</span><span>${q.choices[origIdx]}</span>`;
    if(S.mode==="exam" && q.picked===origIdx) b.classList.add("picked");
    b.onclick = ()=>pick(origIdx, b);
    c.appendChild(b);
  });
  if(S.mode==="exam"){
    renderPalette();
    if(q.picked!==null || S.i===S.qs.length-1) maybeShowSubmit();
  }
}

/* ===== text-to-speech for listening questions ===== */
const AUDIO_RE = /^\(Audio\)\s*['‘’](.*)['‘’]\s*(?:->|→)\s*(.*)$/s;
function parseAudio(text){
  const m = AUDIO_RE.exec(text);
  return m ? {script:m[1].trim(), question:m[2].trim()} : null;
}
let currentScript = null;
let currentAudioSrc = null;   // mp3 for this question (real voice), if available
let audioEl = null;
function stopSpeech(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  if(audioEl){ audioEl.pause(); audioEl = null; }
  document.querySelectorAll(".playbtn").forEach(b=>b.classList.remove("playing"));
}
let currentUtterance = null; // keep a reference so Chrome doesn't GC it mid-speech
function playAudio(){
  stopSpeech();
  const btnA = document.querySelector(".playbtn");
  if(currentAudioSrc){
    const src = currentAudioSrc.startsWith("data:") ? currentAudioSrc
              : (window.AUDIO_BASE || "audio/") + currentAudioSrc;
    audioEl = new Audio(src);
    audioEl.onplay = ()=>btnA && btnA.classList.add("playing");
    audioEl.onended = ()=>btnA && btnA.classList.remove("playing");
    audioEl.onerror = ()=>{ btnA && btnA.classList.remove("playing"); speakScript(); };
    audioEl.play().catch(()=>speakScript());
    return;
  }
  speakScript();
}
function speakScript(){
  if(!("speechSynthesis" in window) || !currentScript) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(currentScript);
  u.lang = "en-US"; u.rate = 0.92;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x=>x.name==="Samantha") || vs.find(x=>x.lang==="en-US") ||
            vs.find(x=>x.lang && x.lang.startsWith("en"));
  if(v) u.voice = v;
  const btn = document.querySelector(".playbtn");
  u.onstart = ()=>btn && btn.classList.add("playing");
  u.onend = u.onerror = ()=>btn && btn.classList.remove("playing");
  currentUtterance = u;
  // Chrome quirk: speak() immediately after cancel() can be silently dropped
  setTimeout(()=>speechSynthesis.speak(u), 80);
}
function toggleScript(){
  const s = $("q-script"); if(s) s.classList.toggle("hidden");
}
function renderAudioBox(audio, q){
  currentScript = audio ? audio.script : null;
  currentAudioSrc = (audio && q && q.audio) ? q.audio : null;
  const box = $("q-audio");
  if(!audio){ box.innerHTML = ""; return; }
  const ttsOK = currentAudioSrc !== null || "speechSynthesis" in window;
  box.innerHTML = `<div class="audio-box">
    <div class="audio-row">
      <button class="playbtn" onclick="playAudio()">▶️ ฟังเสียง</button>
      <button class="scriptbtn" onclick="toggleScript()">📜 ดูบทพูด</button>
    </div>
    <div class="script hidden" id="q-script">"${audio.script}"</div>
    <div class="audio-hint">${ttsOK ? "ฟังได้หลายรอบ • ลองตอบโดยไม่เปิดบทพูดเพื่อฝึกการฟังจริง" : "เบราว์เซอร์นี้ไม่รองรับเสียงพูด — กด ดูบทพูด เพื่ออ่านแทน"}</div>
  </div>`;
}
function labelOf(q, origIdx){ return q.labels[q.order.indexOf(origIdx)]; }
function pick(idx, btn){
  const q = S.qs[S.i];
  if(S.mode==="practice"){
    if(q.picked!==null) return;
    q.picked = idx;
    const good = idx===q.answer;
    if(good){ S.correct++; S.streak++; S.maxStreak=Math.max(S.maxStreak,S.streak); sndGood();
      if(S.streak>0 && S.streak%5===0){ comboPop("🔥 "+S.streak+" ติด!"); }
    } else { S.streak=0; sndBad(); $("qcard").classList.add("shake"); setTimeout(()=>$("qcard").classList.remove("shake"),400); }
    // reveal
    [...$("q-choices").children].forEach((b,pos)=>{
      const oi = q.order[pos];
      b.disabled = true;
      if(oi===q.answer) b.classList.add("correct");
      else if(oi===idx) b.classList.add("wrong");
    });
    $("q-score").textContent = `✅ ${S.correct}`;
    $("q-streak").textContent = `🔥 ${S.streak}`;
    $("q-expl").innerHTML = `<div class="expl ${good?"good":"bad"}">
      <h4>${good ? "🎉 ถูกต้อง!" : "❌ ยังไม่ถูก — เฉลยคือ "+labelOf(q,q.answer)+"."}</h4>
      <p>${q.explanation || "ไม่มีคำอธิบายเพิ่มเติมสำหรับข้อนี้"}</p></div>`;
    const sc = $("q-script"); if(sc) sc.classList.remove("hidden");
    $("fifty").classList.add("hidden");
    if(S.i===S.qs.length-1){ $("nextbtn").textContent = "ดูสรุปผล 🏁"; }
    $("nextbtn").classList.remove("hidden");
    $("nextbtn").focus();
  } else {
    q.picked = idx; sndClick();
    [...$("q-choices").children].forEach((b,pos)=>b.classList.toggle("picked", q.order[pos]===idx));
    renderPalette(); maybeShowSubmit();
    setTimeout(()=>{ if(S.i<S.qs.length-1){ S.i++; renderQ(); window.scrollTo(0,0);} }, 250);
  }
}

function nextQ(){
  if(S.i>=S.qs.length-1){ finishQuiz(); return; }
  S.i++; renderQ(); window.scrollTo(0,0);
}
function maybeShowSubmit(){
  const allDone = S.qs.every(q=>q.picked!==null);
  $("submitbtn").classList.toggle("hidden", !(allDone || S.i===S.qs.length-1));
}
function renderPalette(){
  const p = $("palette"); p.innerHTML = "";
  S.qs.forEach((q,i)=>{
    const b = document.createElement("button");
    b.className = "pal"+(q.picked!==null?" done":"")+(i===S.i?" cur":"");
    b.textContent = i+1;
    b.onclick = ()=>{ S.i=i; renderQ(); };
    p.appendChild(b);
  });
}
function useFifty(){
  const q = S.qs[S.i];
  if(S.fifty<=0 || q.picked!==null) return;
  S.fifty--;
  const wrongs = shuffled(q.order.filter(i=>i!==q.answer && !q.removed.includes(i))).slice(0,2);
  q.removed.push(...wrongs);
  sndClick(); renderQ();
}
function confirmExit(){
  if(S && !S.done && S.qs.some(q=>q.picked!==null)){
    if(!confirm("ออกจากการทำข้อสอบ? ความคืบหน้ารอบนี้จะหายไป")) return;
  }
  quitToHome();
}
function quitToHome(){
  stopSpeech();
  clearInterval(timerInt); S=null;
  $("quiz").classList.add("hidden"); $("result").classList.add("hidden");
  $("home").classList.remove("hidden");
  renderHome(); window.scrollTo(0,0);
}

/* ================= results ================= */
function finishQuiz(){
  S.done = true;
  stopSpeech();
  clearInterval(timerInt);
  if(S.mode==="exam"){ S.correct = S.qs.filter(q=>q.picked===q.answer).length; }
  const n = S.qs.length, pct = Math.round(S.correct/n*100);
  const secs = Math.floor((Date.now()-S.start)/1000);
  const time = String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0");

  // save stats
  const st = store.get();
  st.best = st.best||{}; st.log = st.log||{};
  if(pct > (st.best[S.subj] ?? -1)) st.best[S.subj] = pct;
  const lg = st.log[S.subj] || {a:0,c:0};
  lg.a += n; lg.c += S.correct; st.log[S.subj] = lg;
  st.maxStreak = Math.max(st.maxStreak||0, S.maxStreak);
  store.set(st);

  const verdict = pct===100 ? ["🏆 สมบูรณ์แบบ!","var(--warn)"]
    : pct>=80 ? ["🌟 เยี่ยมมาก!","var(--good)"]
    : pct>=60 ? ["👍 ผ่านเกณฑ์ ทำได้ดี","var(--brand2)"]
    : pct>=40 ? ["💪 เกือบแล้ว สู้ต่อ!","var(--warn)"]
    : ["📚 ทบทวนอีกนิด แล้วลองใหม่","var(--bad)"];

  const circ = 2*Math.PI*80;
  const wrong = S.qs.filter(q=>q.picked!==q.answer);
  $("quiz").classList.add("hidden");
  const r = $("result");
  r.classList.remove("hidden");
  r.innerHTML = `
  <div class="result">
    <div style="display:flex;justify-content:space-between"><button class="topbtn" onclick="quitToHome()">← หน้าหลัก</button>
    <button class="topbtn" onclick="retry()">🔄 ทำใหม่</button></div>
    <div class="ring">
      <svg width="190" height="190"><circle cx="95" cy="95" r="80" fill="none" stroke="var(--card2)" stroke-width="14"/>
      <circle cx="95" cy="95" r="80" fill="none" stroke="${pct>=60?"var(--good)":pct>=40?"var(--warn)":"var(--bad)"}" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" id="ringbar"/></svg>
      <div class="num"><b>${pct}%</b><span>${S.correct} / ${n} ข้อ</span></div>
    </div>
    <div class="verdict" style="color:${verdict[1]}">${verdict[0]}</div>
    <div class="rstats">
      <div class="stat"><b>⏱️ ${time}</b><span>เวลาที่ใช้</span></div>
      <div class="stat"><b>🔥 ${S.maxStreak}</b><span>ตอบถูกติดกันสูงสุด</span></div>
      <div class="stat"><b>${wrong.length}</b><span>ข้อที่ผิด/ข้าม</span></div>
    </div>
    ${wrong.length ? `<button class="btn primary" style="max-width:320px;margin:0 auto" onclick="$('rev').classList.toggle('hidden')">📖 ทบทวนข้อที่ผิด (${wrong.length})</button>` : ""}
    <div class="review ${S.mode==="exam"?"":"hidden"}" id="rev">
      ${wrong.map(q=>`<div class="rq">
        <div class="st no">✗ ${q.q}</div>
        <p>คำตอบของคุณ: ${q.picked!==null ? labelOf(q,q.picked)+". "+q.choices[q.picked] : "— ไม่ได้ตอบ"}</p>
        <p style="color:var(--good)">เฉลย: ${labelOf(q,q.answer)}. ${q.choices[q.answer]}</p>
        <div class="ex">💡 ${q.explanation || "ไม่มีคำอธิบายเพิ่มเติม"}</div>
      </div>`).join("")}
    </div>
  </div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const bar = $("ringbar"); bar.style.transition = "stroke-dashoffset 1.2s ease";
    bar.style.strokeDashoffset = circ*(1-pct/100);
  }));
  if(pct>=80){ sndWin(); confetti(); } else if(pct>=60){ sndWin(); }
  window.scrollTo(0,0);
}
function retry(){ openSetupFromResult(); }
function openSetupFromResult(){ const id=S.subj; quitToHome(); openSetup(id); }

/* ================= fun bits ================= */
function comboPop(text){
  const el = document.createElement("div");
  el.className = "combo-pop"; el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}
function confetti(){
  const cv = $("confetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#7c6cff","#4ecdc4","#ffc94d","#ff5d73","#3ddc84"];
  const ps = Array.from({length:140},()=>({
    x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.5,
    w:6+Math.random()*6, h:8+Math.random()*8,
    vy:2+Math.random()*3, vx:(Math.random()-.5)*2, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.2,
    c:colors[Math.floor(Math.random()*colors.length)]
  }));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if(++frames < 260) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* keyboard shortcuts: 1-5 answer, Enter/space next */
document.addEventListener("keydown", e=>{
  if(!S || $("quiz").classList.contains("hidden")) return;
  if(e.key>="1" && e.key<="5"){
    const pos = +e.key-1, btns = $("q-choices").children;
    if(btns[pos] && !btns[pos].disabled) btns[pos].click();
  } else if(e.key==="Enter" && !$("nextbtn").classList.contains("hidden")){ nextQ(); }
});

renderHome();
</script>
